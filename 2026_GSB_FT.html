<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구약석의방법론 기말 모의고사</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22201c;--sub:#6b665d;--line:#e3dfd6;--pri:#5b4636;--pri2:#8a6a4f;--ok:#2e7d4f;--okbg:#e6f4ec;--ng:#b23b3b;--ngbg:#fbeaea;--chip:#efe9df}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--sub);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
.lbl{font-weight:700;font-size:.95rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.lbl small{font-weight:500;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:.88rem;cursor:pointer;user-select:none;transition:.15s}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip .c{opacity:.7;font-size:.8rem;margin-left:4px}
input[type=range]{width:100%;accent-color:var(--pri)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:14px 18px;font-size:1rem;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;flex:1;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--chip);color:var(--pri)}
.btn:disabled{opacity:.4;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:12px 0 4px}
.prog>i{display:block;height:100%;background:var(--pri2);transition:width .25s}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:.75rem;background:var(--chip);color:var(--pri);padding:3px 9px;border-radius:999px;font-weight:600}
.qtext{font-size:1.08rem;font-weight:700;margin-bottom:12px;word-break:keep-all}
.passage{background:#faf8f4;border-left:4px solid var(--pri2);border-radius:8px;padding:12px 14px;font-size:.9rem;color:#3a362f;margin-bottom:14px;white-space:pre-line;word-break:keep-all;max-height:320px;overflow:auto}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;margin-bottom:9px;font-size:.97rem;cursor:pointer;color:var(--ink);word-break:keep-all;transition:.12s;font-family:inherit}
.opt .no{font-weight:800;color:var(--pri2);flex-shrink:0}
.opt:hover:not(:disabled){border-color:var(--pri2)}
.opt.sel{border-color:var(--pri);background:#f3eee7}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:13px 15px;margin-top:6px;font-size:.92rem;word-break:keep-all}
.fb.ok{background:var(--okbg);color:#1f5a38}
.fb.ng{background:var(--ngbg);color:#7d2626}
.fb b{display:block;margin-bottom:3px}
.nav{display:flex;gap:10px;margin-top:16px}
.big{font-size:3.4rem;text-align:center}
.score{font-size:2.2rem;font-weight:800;text-align:center;color:var(--pri)}
.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.stat:last-child{border:none}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri2)}
.wn{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;background:var(--card)}
.wn .q{font-weight:700;margin-bottom:6px;word-break:keep-all}
.wn .l{font-size:.9rem;margin-top:3px;word-break:keep-all}
.wn .l.my{color:var(--ng)}.wn .l.ans{color:var(--ok);font-weight:600}
.wn .e{font-size:.85rem;color:var(--sub);margin-top:6px}
.tog{display:flex;background:var(--chip);border-radius:12px;padding:4px}
.tog div{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:.9rem;font-weight:600;cursor:pointer;color:var(--sub)}
.tog div.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hint{font-size:.8rem;color:var(--sub);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.grid span{text-align:center;font-size:.78rem;padding:6px 0;border-radius:8px;background:var(--chip);cursor:pointer}
.grid span.done{background:var(--pri2);color:#fff}
.grid span.cur{outline:2px solid var(--pri)}
.hidden{display:none}
.x{background:none;border:none;color:var(--sub);font-size:.9rem;cursor:pointer;padding:6px}
</style>
</head>
<body>
<div class="wrap">

<!-- 설정 -->
<section id="home">
  <h1>📜 구약석의방법론 기말 모의고사</h1>
  <p class="sub">2026학년도 2학기 · 4지선다 145문항</p>

  <div class="card">
    <div class="lbl">문항 세트</div>
    <div class="chips" id="setChips"></div>
  </div>
  <div class="card">
    <div class="lbl">방법론 <small><a href="#" id="allCat" style="color:var(--pri2)">전체 선택/해제</a></small></div>
    <div class="chips" id="catChips"></div>
  </div>
  <div class="card">
    <div class="lbl">문항 수 <small id="cntLbl"></small></div>
    <input type="range" id="cnt" min="1" value="20">
    <div class="lbl" style="margin-top:16px">순서</div>
    <div class="tog" id="ordTog"><div data-v="rand" class="on">무작위</div><div data-v="seq">번호순</div></div>
    <div class="lbl" style="margin-top:16px">채점 방식</div>
    <div class="tog" id="modeTog"><div data-v="instant" class="on">즉시 채점</div><div data-v="exam">시험 모드</div></div>
    <p class="hint" id="modeHint">한 문항씩 바로 정답과 해설을 확인합니다.</p>
  </div>
  <div class="row" style="margin-top:18px"><button class="btn" id="startBtn">시작하기</button></div>
</section>

<!-- 풀이 -->
<section id="quiz" class="hidden">
  <div class="top"><button class="x" id="quitBtn">✕ 그만하기</button><span class="sub" id="pos"></span></div>
  <div class="prog"><i id="progBar"></i></div>
  <div class="card">
    <div class="meta" id="qmeta"></div>
    <div class="passage hidden" id="qpas"></div>
    <div class="qtext" id="qtext"></div>
    <div id="opts"></div>
    <div id="fb"></div>
  </div>
  <div class="nav">
    <button class="btn ghost" id="prevBtn">이전</button>
    <button class="btn" id="nextBtn">다음</button>
  </div>
  <div class="card hidden" id="gridCard"><div class="lbl">문항 이동 <small id="ansCnt"></small></div><div class="grid" id="grid"></div></div>
</section>

<!-- 결과 -->
<section id="result" class="hidden">
  <div class="card" style="text-align:center">
    <div class="big" id="emo"></div>
    <div class="score" id="scoreTxt"></div>
    <p class="sub" id="scoreSub"></p>
  </div>
  <div class="card"><div class="lbl">방법론별 정답률</div><div id="catStat"></div></div>
  <div class="row" style="margin-top:16px">
    <button class="btn" id="wrongBtn">오답노트</button>
    <button class="btn ghost" id="retryWrongBtn">틀린 문제만 다시</button>
  </div>
  <div class="row" style="margin-top:10px"><button class="btn ghost" id="homeBtn">처음으로</button></div>
</section>

<!-- 오답노트 -->
<section id="wrong" class="hidden">
  <div class="top"><button class="x" id="backRes">← 결과로</button><span class="sub" id="wCnt"></span></div>
  <div id="wList"></div>
  <div class="row" style="margin-top:16px"><button class="btn" id="retryWrongBtn2">틀린 문제만 다시</button></div>
</section>

</div>
<script>
const DATA = [{"n":1,"set":"문제은행","cat":"정경비평","q":"정경비평의 영어 명칭은?","p":"","o":["Redaction Criticism","Form Criticism","Canonical Criticism","Narrative Criticism"],"a":2,"e":"Canonical 은 정경과 관련된다는 뜻이다.","lv":"하"},{"n":2,"set":"문제은행","cat":"정경비평","q":"브레버드 차일즈의 정경적 접근이 우선 살피는 것은?","p":"","o":["단락에 남은 외래어로 추정한 교역 경로","본문을 읽는 개별 독자의 심리적 반응","본문에 앞선 구전의 가장 이른 형태","공동체가 성경으로 받아들인 본문의 형태와 기능"],"a":3,"e":"차일즈는 성경으로 수용된 본문의 형태가 해석에 미치는 영향을 중시한다.","lv":"하"},{"n":3,"set":"문제은행","cat":"정경비평","q":"제임스 샌더스의 정경비평과 가장 가까운 연구 주제는?","p":"","o":["가구 규모와 토지 제도의 상관관계","한 연설의 반복과 대조가 만드는 설득 효과","서술자가 결말을 미루어 만들어 내는 긴장","권위 있는 전승이 여러 세대에 걸쳐 재해석된 과정"],"a":3,"e":"샌더스는 전승을 전수하고 재맥락화한 공동체와 정경화 과정에 주목한다.","lv":"하"},{"n":4,"set":"문제은행","cat":"정경비평","q":"차일즈와 샌더스의 차이를 가장 잘 설명한 것은?","p":"","o":["차일즈는 사본의 우열에, 샌더스는 저자 개인의 심리에 상대적으로 더 주목한다.","차일즈는 구전의 기원에, 샌더스는 서술의 속도에 상대적으로 더 주목한다.","차일즈는 수용된 정경 형태에, 샌더스는 정경 형성 과정에 상대적으로 더 주목한다.","차일즈는 독자 개인의 반응에, 샌더스는 시의 평행법에 상대적으로 더 주목한다."],"a":2,"e":"두 접근에는 공통점이 있지만, 형태와 과정에 두는 상대적 무게가 다르다.","lv":"중"},{"n":5,"set":"문제은행","cat":"정경비평","q":"오경이 가나안 입성을 서술하는 여호수아가 아니라 신명기로 끝난다는 점에 대한 정경적 질문은?","p":"","o":["모세의 마지막 연설은 어느 지역 방언으로 전승되었는가?","여호수아의 전투는 역사적으로 몇 년 동안 이어졌는가?","약속의 땅에 들어가기 전에 끝나는 구성이 오경의 읽기에 어떤 영향을 주는가?","가나안 고지대 취락의 인구는 얼마나 되었는가?"],"a":2,"e":"책의 경계가 약속과 성취를 읽는 방식에 미치는 영향을 묻는다.","lv":"중"},{"n":6,"set":"문제은행","cat":"정경비평","q":"구약 본문을 신약의 인용문과 정경적으로 비교할 때 적절한 절차는?","p":"","o":["신약 본문의 해석을 구약 원청중의 이해로 간주한다.","두 본문에서 언어가 다르다는 이유로 해석상의 관련을 배제한다.","인용된 한 문장으로 구약 책 전체의 의미를 확정한다.","구약 본문의 문맥과 신약의 인용 문맥을 각각 분석한 뒤 연결점을 논한다."],"a":3,"e":"각 문맥을 보존해야 연속성과 재해석을 구별할 수 있다.","lv":"중"},{"n":7,"set":"문제은행","cat":"정경비평","q":"히브리 성경과 기독교 구약의 배열을 비교하는 연구에서 먼저 밝혀야 할 것은?","p":"","o":["각 책의 저자들이 서로 만난 적이 있는가?","각 책이 번역된 언어의 수는 얼마인가?","독자 가운데 누가 해당 책을 가장 많이 읽었는가?","어느 전통의 정경 범위와 책 배열을 논하는가?"],"a":3,"e":"정경의 범위와 배열은 전통에 따라 달라 비교 대상을 명시해야 한다.","lv":"중"},{"n":8,"set":"문제은행","cat":"정경비평","q":"정경비평에서 ‘최종 형태’에 관심을 둔다는 말의 뜻으로 가장 적절한 것은?","p":"","o":["모든 사본 전통이 한 가지 표현만 보존했다고 전제한다.","정경에 포함된 책들의 편찬 연대가 같다고 전제한다.","가장 늦은 연대의 사본을 문학적으로 가장 우수하다고 판정한다.","어느 본문 형태를 읽는지 밝히고 그 형태의 배열과 기능을 해석한다."],"a":3,"e":"최종 형태는 해석의 분석 대상을 가리키며 사본의 동일성을 보장하지 않는다.","lv":"중"},{"n":9,"set":"문제은행","cat":"정경비평","q":"평행 본문 두 곳이 같은 사건을 서로 다르게 평가한다. 정경적 읽기로 가장 설득력 있는 것은?","p":"","o":["두 기록의 평가를 하나로 통일할 수 있도록 한쪽의 특징을 배제한다.","각 책에서 평가 차이가 담당하는 기능을 살핀 뒤, 두 증언이 정경에 함께 보존된 의미를 논한다.","더 내적으로 일관된 평가를 골라 그것만 정경적 증언으로 인정한다.","더 늦은 형태를 확인하면 그 평가의 정경적 기능도 설명되었다고 본다."],"a":1,"e":"정경 안의 차이도 해석의 자료이며 편찬 순서와 정경적 기능은 다른 질문이다.","lv":"상"},{"n":10,"set":"문제은행","cat":"정경비평","q":"정경비평과 역사비평을 상호 보완적으로 사용하는 예는?","p":"","o":["전승의 역사적 맥락을 검토한 뒤 현재 책의 배치가 부여하는 의미를 살핀다.","최종 형태의 의미를 설명한 뒤 이를 저자의 전기로 환원한다.","사본의 연대를 확인한 뒤 수용 공동체의 해석을 모두 동일하다고 본다.","전승의 형성 과정을 가정한 뒤 현재 본문의 배열은 분석하지 않는다."],"a":0,"e":"형성 과정과 현재의 문학적·신학적 기능은 함께 검토할 수 있다.","lv":"중"},{"n":11,"set":"문제은행","cat":"정경비평","q":"한 책의 결말이 다른 책의 첫머리와 이어질 때, 그 연관을 정경적 논점으로 발전시키는 근거는?","p":"","o":["실제 정경 배열과 각 본문의 대응 표현을 제시하고 연결 효과를 설명한다.","오늘의 독자가 연상할 수 있다는 이유로 원저자의 의도를 확정한다.","두 결말이 비슷하므로 저자가 같았다고 본다.","서로 이웃한 책이므로 모든 주제가 같다고 가정한다."],"a":0,"e":"정경적 연관은 배열과 본문 근거로 논증하되 공동 저작을 전제하지 않는다.","lv":"상"},{"n":12,"set":"문제은행","cat":"정경비평","q":"본래 서로 다른 상황에서 나온 전승이 공동체에서 규범으로 읽히는 일을 묻는 핵심 개념은?","p":"","o":["시간적 생략","문학적 초점화","정경의 권위와 기능","반의적 평행법"],"a":2,"e":"정경 연구는 공동체에서 본문이 권위를 갖고 기능하는 방식에 관심을 둔다.","lv":"하"},{"n":13,"set":"문제은행","cat":"정경비평","q":"정경비평의 한계를 바르게 설명한 것은?","p":"","o":["정경비평은 구약과 신약의 관계를 논할 수 없다.","정경비평은 본문의 신학적 기능을 연구 대상에서 제외한다.","현재 배열을 해석했다고 해서 앞선 역사적 맥락이 자동으로 밝혀지지는 않는다.","정경비평은 책의 배열을 해석의 근거로 사용할 수 없다."],"a":2,"e":"현재의 기능을 분석하는 것과 그 형태에 이른 경위를 재구성하는 것은 별개다.","lv":"중"},{"n":14,"set":"문제은행","cat":"정경비평","q":"‘이 본문은 후대 공동체가 위기의 상황에서 다시 사용한 권위 있는 전승이다’라는 주장을 가장 잘 뒷받침할 자료는?","p":"","o":["두 전승의 언어가 같다는 사실만","이전 전승과 재사용 본문의 대응 및 새로운 문맥을 보여 주는 자료","현대 독자가 그 본문에 강하게 공감했다는 개인 기록","후대 본문의 문장이 더 짧다는 관찰만"],"a":1,"e":"재사용을 입증하려면 연결의 흔적과 변화한 기능을 함께 제시해야 한다.","lv":"상"},{"n":15,"set":"문제은행","cat":"정경비평","q":"단락 내부의 줄거리보다 그 단락이 정경에 속한 다른 책과 맺는 관계가 중심인 경우의 접근은?","p":"","o":["정경비평","양식비평","이야기비평","자료비평"],"a":0,"e":"질문의 초점이 단락의 서사 구조나 기원보다 정경적 배치와 관계에 있다.","lv":"중"},{"n":16,"set":"문제은행","cat":"사회과학비평","q":"사회과학비평의 영어 명칭은?","p":"","o":["Canonical Criticism","Reader-Response Criticism","Social-Scientific Criticism","Rhetorical Criticism"],"a":2,"e":"사회과학의 이론과 모델을 사용하는 접근이다.","lv":"하"},{"n":17,"set":"문제은행","cat":"사회과학비평","q":"강의에서 본문의 명시적·암시적 사회적 지시 대상을 살피는 접근에 연결된 학자는?","p":"","o":["노먼 갓월드","제임스 뮐렌버그","브레버드 차일즈","필리스 트리블"],"a":0,"e":"첨부 자료는 사회과학비평의 설명을 갓월드와 연결한다.","lv":"하"},{"n":18,"set":"문제은행","cat":"사회과학비평","q":"사회과학비평의 중심 질문에 가장 가까운 것은?","p":"","o":["어느 사본이 더 이른 읽기를 보존하는가?","서술자가 어느 시점에 결말을 알려 주는가?","하나의 어구가 단락의 시작과 끝을 어떻게 감싸는가?","채무와 토지 제도가 본문 속 집단의 관계를 어떻게 형성하는가?"],"a":3,"e":"제도와 집단 관계는 사회과학적 분석의 핵심 대상이다.","lv":"하"},{"n":19,"set":"문제은행","cat":"사회과학비평","q":"군사적 정복설과 이주·정착설의 차이는?","p":"","o":["전자는 내부 사회 변화를, 후자는 국가 주도의 추방을 주요 설명으로 삼는다.","전자는 군사적 점령을, 후자는 점진적 이주와 정착을 주요 설명으로 삼는다.","전자는 토지 경작을, 후자는 왕실 제의를 주요 설명으로 삼는다.","전자는 정착을 다루고, 후자는 동일한 군사적 점령을 다른 말로 부른다."],"a":1,"e":"이 문항은 가나안 정착을 설명하는 두 고전 모형의 주된 경로를 구분한다.","lv":"중"},{"n":20,"set":"문제은행","cat":"사회과학비평","q":"강의 자료가 고전적 이주·정착설과 연결한 대표 학자는?","p":"","o":["윌리엄 올브라이트","조지 멘덴홀","알브레히트 알트","노먼 갓월드"],"a":2,"e":"첨부 자료의 고전적 분류에서 알트는 이주·정착 모델을 대표한다.","lv":"하"},{"n":21,"set":"문제은행","cat":"사회과학비평","q":"강의 자료가 고전적 군사적 정복설과 연결한 대표 학자는?","p":"","o":["마르틴 노트","노먼 갓월드","윌리엄 올브라이트","알브레히트 알트"],"a":2,"e":"첨부 자료는 올브라이트를 군사적 정복설에 배치한다.","lv":"하"},{"n":22,"set":"문제은행","cat":"사회과학비평","q":"멘덴홀과 갓월드를 나란히 다룰 때 공통점에 대한 가장 적절한 진술은?","p":"","o":["두 사람 모두 한 차례 외부 군사 정복으로 모든 정착을 설명한다.","세부 설명까지 동일하며 두 가설의 근거도 같다.","두 사람 모두 초기 이스라엘 형성을 왕궁 행정 제도의 도입과 동일시한다.","세부 설명은 다르지만 가나안 내부의 사회 변화를 주요 변수로 삼는다."],"a":3,"e":"두 학자의 설명을 동일시하지 않으면서 내부 변화에 주목한 공통점을 포착한다.","lv":"중"},{"n":23,"set":"문제은행","cat":"사회과학비평","q":"가나안 정착의 보완 모형을 평가할 때 적절한 태도는?","p":"","o":["하나의 유적에서 관찰한 현상을 전 지역에 동일하게 적용한다.","지역마다 다른 자료를 비교하여 복수의 형성 경로가 작동했는지 검토한다.","문헌의 신학적 의도를 알면 정착의 모든 경로도 밝혀진다고 본다.","여러 경로를 말할 수 있으므로 개별 가설은 검증할 필요가 없다고 본다."],"a":1,"e":"복합 모형도 지역별·시기별 자료에 근거해 검증해야 한다.","lv":"중"},{"n":24,"set":"문제은행","cat":"사회과학비평","q":"어떤 지역에서 화재 흔적이 나왔다. 가장 신중한 해석은?","p":"","o":["파괴 연대와 다른 자료를 비교해야 사건의 주체와 원인을 가늠할 수 있다.","화재층 자체가 정복 집단의 민족 정체성을 알려 준다.","파괴 뒤 새 토기가 나오면 정복 경로까지 확정할 수 있다.","같은 세기의 주변 도시도 모두 한 세력에게 파괴되었다고 본다."],"a":0,"e":"물질 자료는 화재와 파괴를 보일 수 있어도 행위자의 정체를 직접 말하지 않는다.","lv":"중"},{"n":25,"set":"문제은행","cat":"사회과학비평","q":"한 유적의 파괴 연대가 주장된 정복 시점과 맞지 않는다. 자료를 어떻게 처리해야 하는가?","p":"","o":["정복 모형을 유지하기 위해 유적의 연대를 먼저 옮긴다.","문헌에 전투가 나오므로 연대 차이는 검토 대상에서 제외한다.","그 유적에 대한 가설을 수정하거나 보류하고 다른 유적의 자료를 독립적으로 평가한다.","한 유적의 불일치만으로 모든 정착·정복 논의를 끝낸다."],"a":2,"e":"반례는 해당 가설의 적용을 제한하며, 지역 전체의 설명은 별도로 검증한다.","lv":"상"},{"n":26,"set":"문제은행","cat":"사회과학비평","q":"신명기 15장의 채무 면제 규정을 사회과학적으로 연구하는 질문은?","p":"","o":["이 장의 표제가 어느 사본에서 가장 길게 나타나는가?","채무 규정의 마지막 문장이 어떤 시적 운율을 이루는가?","채무와 예속이 가구 경제에 미치는 영향은 무엇인가?","후대 독자들이 이 장을 언제 처음 강해했는가?"],"a":2,"e":"채무를 둘러싼 자원·권력·가구 관계가 사회과학적 관심이다.","lv":"중"},{"n":27,"set":"문제은행","cat":"사회과학비평","q":"법전이 가난한 채무자를 보호한다고 해서 당시 보호가 널리 시행되었다고 단정할 수 없는 이유는?","p":"","o":["규범은 바람직한 질서를 제시하며 실제 관행과는 구분되기 때문이다.","실제 관행을 알면 법전의 목적은 따로 살필 필요가 없기 때문이다.","고대 법전에는 사회 제도가 전혀 반영되지 않기 때문이다.","현대 연구자는 규정 문구의 문법을 분석할 수 없기 때문이다."],"a":0,"e":"규범은 당시의 문제나 이상을 드러내지만 실제 시행은 별도의 증거가 필요하다.","lv":"상"},{"n":28,"set":"문제은행","cat":"사회과학비평","q":"고대 공동체에 현대의 계급 모델을 적용하는 방법으로 적절한 것은?","p":"","o":["현대의 집단 명칭과 법적 지위를 고대에 그대로 부여한다.","고대와 현대의 차이가 있으므로 어떤 비교 가설도 세우지 않는다.","자원과 권력 차이를 살피는 가설로 쓰고 시대·지역의 차이를 검증한다.","모델과 맞지 않는 자료를 예외로 돌리고 비교에서 지운다."],"a":2,"e":"현대 모델은 검증 가능한 질문을 만들기 위한 도구이지 고대 사회의 복제본이 아니다.","lv":"중"},{"n":29,"set":"문제은행","cat":"사회과학비평","q":"두 마을의 주택 크기에 차이가 있다는 자료에서 사회적 불평등을 논하려면 무엇이 더 필요한가?","p":"","o":["작은 집이 더 많다는 이유만으로 귀족과 농민의 법적 범주를 확정한다.","주택 면적 차이가 있다는 관찰을 불평등이 입증되었다는 진술로 바꾼다.","가장 큰 집 한 채의 면적만으로 지배계층의 규모를 계산한다.","가구 규모·건축 기능·연대 차이를 통제하고 저장 시설 등 독립 증거를 비교한다."],"a":3,"e":"같은 관찰을 설명할 수 있는 다른 요인을 검토하고 여러 자료를 교차 확인해야 한다.","lv":"상"},{"n":30,"set":"문제은행","cat":"사회과학비평","q":"여호수아의 성읍 목록을 사회과학비평으로 읽는 질문은?","p":"","o":["성읍 이름  입증한다.","같은 결과를 표현만 달리하여 반복한다."],"a":0,"e":"행동 평가와 그 결과의 대조가 독자의 판단을 이끈다.","lv":"중"},{"n":40,"set":"문제은행","cat":"수사비평","q":"한 단락의 핵심 단위가 A–B–B′–A′ 순서로 대응한다. 가장 적절한 구조 명칭은?","p":"","o":["교차대구","인클루시오만 존재하는 구조","직선형 열거","연대기적 요약"],"a":0,"e":"바깥의 A 쌍뿐 아니라 안쪽 B 쌍도 역순으로 대응한다.","lv":"중"},{"n":41,"set":"문제은행","cat":"수사비평","q":"‘하늘과 땅’이 두 극점을 들어 세계 전체를 가리킨다면 그 용법은?","p":"","o":["반어","직유","메리스무스","인클루시오"],"a":2,"e":"메리스무스는 양끝이나 대표 부분을 들어 전체를 나타낸다.","lv":"중"},{"n":42,"set":"문제은행","cat":"수사비평","q":"이사야 1장 2–3절에서 주인을 아는 가축과 깨닫지 못하는 이스라엘을 대비한 효과는?","p":"","o":["기대와 현실의 간격을 두드러지게 해 청중의 자기 인식을 촉구한다.","비유의 존재를 통해 실제 청중이 모두 설득되었음을 확인한다.","가축의 사육 방식을 설명해 당시 경제 구조를 직접 재구성한다.","대조된 두 표현을 사용해 청중에게 시간 순서만 알린다."],"a":0,"e":"비교는 이스라엘의 태도를 문제 삼는 설득 효과를 낳는다(사 1:2–3).","lv":"중"},{"n":43,"set":"문제은행","cat":"수사비평","q":"시편에서 같은 말이 첫 행과 끝 행에 나온다. 인클루시오로 판단하려면 무엇을 더 살펴야 하는가?","p":"","o":["두 행에 같은 수의 글자가 있는가?","해당 시편을 부른 사람이 누구인지 확정되었는가?","반복된 말이 전체 성경에서 가장 드물게 쓰였는가?","반복이 의미상 기능을 갖고 그 위치가 다른 구조 단서와 맞물리는가?"],"a":3,"e":"반복 자체 외에 경계를 이루는 기능과 단락 내부의 연관이 중요하다.","lv":"상"},{"n":44,"set":"문제은행","cat":"수사비평","q":"어떤 설교 본문에 반복 명령과 청중을 향한 질문이 있다. 가장 타당한 수사적 결론은?","p":"","o":["본문이 응답을 유도하는 방식은 분석할 수 있으나 실제 청중의 반응은 별도 근거가 필요하다.","청중의 신원을 모르므로 본문의 설득 전략도 기술할 수 없다.","명령이 반복되므로 실제 청중이 저항했다고 판정한다.","청중을 설득하려는 표현이 있으므로 모든 청중이 동의했다고 본다."],"a":0,"e":"본문이 지향하는 효과와 역사적으로 확인되는 반응을 구별한다.","lv":"상"},{"n":45,"set":"문제은행","cat":"수사비평","q":"뮐렌버그와 기타이를 비교할 때 가장 분명한 차이는?","p":"","o":["전자는 본문의 구성과 문체를, 후자는 담화의 설득 기능을 상대적으로 더 강조한다.","전자는 고고학 자료를, 후자는 정경 배열을 상대적으로 더 강조한다.","전자는 시편만 다루고, 후자는 구약 본문을 연구하지 않는다.","전자는 실제 독자 반응을, 후자는 자료의 연대를 상대적으로 더 강조한다."],"a":0,"e":"두 접근은 모두 수사에 속하지만 본문 기술과 설득 상황에 두는 강조점이 다르다.","lv":"중"},{"n":46,"set":"문제은행","cat":"수사비평","q":"로우쓰의 세 범주로 시를 읽을 때 주의할 점은?","p":"","o":["한 작품의 모든 행 쌍에 동일한 범주를 적용해야 한다.","종합적 평행법이면 두 행에 어떤 관계도 없다고 보아야 한다.","두 행이 동의 관계라면 둘째 행은 의미상 역할이 없다고 보아야 한다.","두 행이 유사하면서 새 의미를 보탤 수 있어 구체적인 관계를 함께 설명해야 한다."],"a":3,"e":"전통적 분류는 출발점이며 둘째 행의 의미 변화를 자세히 분석해야 한다.","lv":"상"},{"n":47,"set":"문제은행","cat":"수사비평","q":"‘청중이 아니라 하늘과 땅을 향해 말을 건다’는 예언의 도입을 수사적으로 분석하는 질문은?","p":"","o":["하늘과 땅의 표현이 어느 서기관에게서 처음 나왔는가?","발화 장소에 실제로 서 있던 사람 수를 어떻게 계산하는가?","우주를 증인처럼 부르는 표현이 뒤따르는 고발에 어떤 무게를 주는가?","이 표현의 존재만으로 본문이 어떤 연대에 쓰였는가?"],"a":2,"e":"말 걸기의 형식이 고발의 전달에 어떤 효과를 내는지 묻는다.","lv":"중"},{"n":48,"set":"문제은행","cat":"수사비평","q":"수사적 장치의 목록을 넘어서는 분석은?","p":"","o":["반복된 어휘가 단락의 여러 주장에 공통의 판단 기준을 부여한다고 논증한다.","평행법의 명칭을 붙인 뒤 두 행의 차이는 생략한다.","인클루시오를 찾은 뒤 단락의 모든 주제가 같다고 본다.","반복 어휘의 출현 횟수만 적고 분석을 마친다."],"a":0,"e":"수사비평은 기법을 식별한 뒤 기법이 의미와 설득에 기여하는 방식을 설명한다.","lv":"중"},{"n":49,"set":"문제은행","cat":"이야기비평","q":"이야기비평의 영어 명칭은?","p":"","o":["Canonical Criticism","Rhetorical Criticism","Form Criticism","Narrative Criticism"],"a":3,"e":"이야기비평은 사건이 어떻게 이야기되는지 살핀다.","lv":"하"},{"n":50,"set":"문제은행","cat":"이야기비평","q":"이야기에서 인물이 행동하는 시간·공간·사회적 환경을 가리키는 말은?","p":"","o":["독자","배경","줄거리","서술자"],"a":1,"e":"배경은 사건과 행동이 일어나는 조건을 이룬다.","lv":"하"},{"n":51,"set":"문제은행","cat":"이야기비평","q":"사건들을 갈등과 인과관계로 이어 주는 구성은?","p":"","o":["서술자","정경적 배열","줄거리","공간적 배경"],"a":2,"e":"줄거리는 사건의 단순 나열보다 사건 사이의 관계와 전개에 초점을 둔다.","lv":"하"},{"n":52,"set":"문제은행","cat":"이야기비평","q":"이야기(story)와 담화(discourse)의 차이는?","p":"","o":["이야기는 사건과 인물의 관계를, 담화는 본문이 그것을 제시하는 방식을 뜻한다.","이야기는 기록된 문장만, 담화는 발굴된 물질문화를 뜻한다.","이야기는 실제 독자의 반응, 담화는 작가의 전기를 뜻한다.","이야기는 허구만, 담화는 역사적 사실만을 뜻한다."],"a":0,"e":"같은 사건도 제시 순서와 정보의 양이 다르면 다르게 읽힌다.","lv":"중"},{"n":53,"set":"문제은행","cat":"이야기비평","q":"실제 저자와 서술자의 구별로 옳은 것은?","p":"","o":["서술자는 본문 속 대화를 가장 많이 하는 인물을 뜻한다.","실제 저자는 이야기 속에 반드시 등장하고 서술자는 반드시 역사 속 인물이다.","저자와 서술자를 구별하려면 반드시 저자의 이름부터 알아야 한다.","실제 저자는 역사적 작성 주체이고 서술자는 본문에서 이야기를 전달하는 목소리다."],"a":3,"e":"본문의 서술 기능은 역사적 저자 문제를 확정하지 않아도 분석할 수 있다.","lv":"중"},{"n":54,"set":"문제은행","cat":"이야기비평","q":"창세기 22장 1–2절이 독자에게 먼저 주는 정보가 만드는 효과는?","p":"","o":["이삭과 아브라함도 같은 설명을 들었다고 확정할 수 있게 한다.","시험이라는 사실을 아는 독자가 아브라함의 응답과 결말을 주목하게 한다.","이삭이 언제 구출될지를 독자에게 미리 알려 준다.","아브라함이 명령을 어떻게 느꼈는지 직접 설명한다."],"a":1,"e":"서술자가 시험이라고 밝히지만 인물에게 설명이 전달되거나 결말이 예고되지는 않는다(창22:1–2).","lv":"중"},{"n":55,"set":"문제은행","cat":"이야기비평","q":"하나의 장면을 한 인물이 보고 들은 범위로 제시하는 방식을 분석하는 핵심 개념은?","p":"","o":["수용사","초점화","인클루시오","정경화"],"a":1,"e":"초점화는 사건을 지각하는 시야와 정보의 범위에 관한 개념이다.","lv":"중"},{"n":56,"set":"문제은행","cat":"이야기비평","q":"열왕기상 22장 1절이 전쟁이 없던 3 년을 한 문장으로 처리한다. 이 서술 방식은?","p":"","o":["장면","회상","서술적 정지","요약"],"a":3,"e":"긴 이야기 시간을 짧은 서술 분량으로 압축한다(왕상 22:1).","lv":"중"},{"n":57,"set":"문제은행","cat":"이야기비평","q":"여행을 떠날 때부터 목적지에 도착할 때까지 실제로 이야기 속 시간이 흐르지만 본문은 여정을 말하지 않는다. 이 방식은?","p":"","o":["장면","서술적 정지","요약","생략"],"a":3,"e":"경과한 시간이 담화에서 건너뛰어졌다.","lv":"중"},{"n":58,"set":"문제은행","cat":"이야기비평","q":"사건의 결말을 말한 뒤 그 원인이 된 이전 사건으로 돌아가는 서술은?","p":"","o":["동시 서술","예고","공간 대비","회상"],"a":3,"e":"이야기 시간상 이전인 사건을 담화에서 뒤에 제시한다.","lv":"중"},{"n":59,"set":"문제은행","cat":"이야기비평","q":"서술자가 한 인물을 ‘지혜로운 사람’이라고 직접 평가할 때 사용한 방법은?","p":"","o":["역사적 연대 설정","공간적 초점화","직접 인물 묘사","행동을 통한 간접 묘사"],"a":2,"e":"평가 표현을 직접 제시하고 독자에게 전적으로 추론을 맡기지 않는다.","lv":"하"},{"n":60,"set":"문제은행","cat":"이야기비평","q":"열왕기상 22장의 왕복과 변장이 독자의 읽기에 미치는 효과는?","p":"","o":["두 왕의 정체를 아는 독자가 지휘관들의 오인을 알아차리게 한다.","왕복으로 오인한 지휘관들이 처음부터 진짜 아합을 추격했다고 알려 준다.","독자도 어느 왕이 변장했는지 결말까지 알 수 없게 한다.","여호사밧의 위험이 아합이 의도한 결과였음을 명시한다."],"a":0,"e":"독자는 복장 정보를 먼저 받고 오인을 보는 데서 긴장을 느낀다(왕상 22:30–33).","lv":"중"},{"n":61,"set":"문제은행","cat":"이야기비평","q":"아합을 찾던 병거 지휘관들은 그를 놓치고, 한 사람이 특정하지 않고 쏜 화살은 아합을 맞힌다. 가장 잘 드러나는 장치는?","p":"","o":["상황의 아이러니","동의적 평행법","연대기적 생략","서술적 정지"],"a":0,"e":"의도적으로 추격한 쪽이 놓치고, 특정 표적을 겨냥하지 않은 사격이 왕을 맞히는역전이다(왕상 22:31–35).","lv":"중"},{"n":62,"set":"문제은행","cat":"이야기비평","q":"‘평안한 귀환’이 열왕기상 22장에서 갖는 효과를 가장 잘 설명한 것은?","p":"","o":["왕이 살아 돌아옴으로써 미가야의 예언이 틀렸다고 모두 확인한다.","왕이 귀환을 조건으로 내걸지만 그는 시신으로 돌아와 그 기대가 뒤집힌다.","미가야와 아합은 이 말로 동일한 결말을 예상한다.","왕의 귀환 여부가 독자에게 소개되지 않아 어떤 대비도 이루어지지 않는다."],"a":1,"e":"말의 반복과 실제 귀환 방식의 간극이 결말의 아이러니를 만든다(왕상 22:27–28, 35–37).","lv":"상"},{"n":63,"set":"문제은행","cat":"이야기비평","q":"아합이 변장하자 여호사밧이 오인되어 위험해졌다. 아합의 동기에 관해 타당한 진술은?","p":"","o":["여호사밧이 위험해졌으므로 그를 죽이려는 동기가 입증된다.","서술자가 동기를 밝히지 않으므로 변장 사실도 확정할 수 없다.","아합이 결말을 미리 알고 변장했다는 점이 명시되어 있다.","자기 보호 의도는 가능한 추론이지만, 여호사밧을 죽이려 했다는 동기는 본문이 밝히지 않는다."],"a":3,"e":"인물의 행동과 그 결과는 명시와 추론의 경계를 넘어 동기를 확정해 주지 않는다.","lv":"상"},{"n":64,"set":"문제은행","cat":"이야기비평","q":"룻기 2장 3절에서 룻이 보아스의 밭에 이르는 우연한 만남을 신학적으로 해석하려면?","p":"","o":["우연을 나타내는 표현 자체가 섭리라는 뜻이므로 이후 이야기는 볼 필요가 없다.","룻이 보아스의 정체와 계획을 처음부터 알았다고 본다.","그 표현이 독자의 기대를 만드는 방식을 살피고 후속 장면을 근거로 섭리의 독법을 논한다.","우연과 섭리는 함께 읽을 수 없으므로 이후에 나타나는 신학적 의미를 배제한다."],"a":2,"e":"인물에게 우연해 보이는 사건과 이야기 전체에서 가능한 신학적 해석을 구별한다(룻 2:3).","lv":"상"},{"n":65,"set":"문제은행","cat":"이야기비평","q":"서술자가 인물의 발언을 직접 인용한다고 해서 그 말을 서술자의 평가로 볼 수 없는 이유는?","p":"","o":["서술자는 인물의 발언과 결말을 함께 제시할 수 없다.","인물의 주장은 다른 인물의 말과 사건의 결말에 의해 상대화될 수 있다.","직접 인용은 사본이 손상된 경우에만 나타난다.","직접 인용된 발언은 본문 밖 저자의 말로만 읽어야 한다."],"a":1,"e":"인물의 발언과 이야기 전체의 평가를 구분해야 한다.","lv":"상"},{"n":66,"set":"문제은행","cat":"이야기비평","q":"내재된 독자와 실제 독자의 관계를 바르게 설명한 것은?","p":"","o":["내재된 독자는 본문이 요청하는 읽기의 역할이고 실제 독자는 역사 속에서 읽는 사람이다.","실제 독자는 언제나 본문이 요청하는 방식대로 읽는다.","내재된 독자는 본문의 실제 첫 독자 한 사람을 가리킨다.","내재된 독자는 이야기에 등장하는 인물과 언제나 동일하다."],"a":0,"e":"본문이 전제하는 역할과 구체적인 독자의 반응을 동일시하지 않는다.","lv":"중"},{"n":67,"set":"문제은행","cat":"독자반응비평과 수용","q":"독자반응비평의 영어 명칭은?","p":"","o":["Redaction Criticism","Social-Scientific Criticism","Narrative Criticism","Reader-Response Criticism"],"a":3,"e":"Reader-Response 는 본문과 독자의 상호작용을 가리킨다.","lv":"하"},{"n":68,"set":"문제은행","cat":"독자반응비평과 수용","q":"독자반응비평과 가장 직접 관련되는 질문은?","p":"","o":["본문 이전의 자료는 어떤 편집을 거쳤는가?","두 사본 중 어느 쪽에 더 이른 읽기가 남았는가?","독자가 읽어 나가는 과정에서 본문의 의미를 어떻게 구성하는가?","한 도시의 세금 체계가 어떤 형태였는가?"],"a":2,"e":"독자의 능동적인 읽기 과정이 중심이다.","lv":"하"},{"n":69,"set":"문제은행","cat":"독자반응비평과 수용","q":"강의에서 소개한 발신자–메시지–수신자 도식에서 라테간이 독자반응 이론과 연결한 관계는?","p":"","o":["사본과 번역본의 계보 관계","본문과 수신자의 상호작용","편집자와 앞선 자료의 관계","발신자와 고고학 자료의 관계"],"a":1,"e":"독자반응은 텍스트와 그것을 받아들이는 독자의 관계를 살핀다.","lv":"하"},{"n":70,"set":"문제은행","cat":"독자반응비평과 수용","q":"‘지평의 융합’이 가장 밀접하게 연결되는 학자는?","p":"","o":["브레버드 차일즈","한스게오르크 가다머","제임스 뮐렌버그","노먼 갓월드"],"a":1,"e":"가다머는 이해에서 해석자의 역사적 지평이 변화하는 과정을 논한다.","lv":"하"},{"n":71,"set":"문제은행","cat":"독자반응비평과 수용","q":"지평의 융합을 잘 보여 주는 읽기는?","p":"","o":["독자가 자신의 전제를 돌아보며 본문이 던지는 질문을 통해 이해를 수정한다.","현재 독자의 관심을 고대 본문에 그대로 투사한다.","독자가 자신의 시대와 관점을 완전히 제거할 수 있다고 전제한다.","서로 다른 해석자는 처음부터 같은 전제를 가진다고 본다."],"a":0,"e":"이해는 역사적 거리 속에서 해석자의 전제가 시험되고 변할 수 있는 과정이다.","lv":"중"},{"n":72,"set":"문제은행","cat":"독자반응비평과 수용","q":"독자가 사건의 결말을 읽기 전 예상과 읽은 뒤 판단을 기록하는 활동은 무엇을 드러내는가?","p":"","o":["가장 오래된 사본의 물리적 상태","실제 저자가 문장을 작성한 정확한 시간","새로운 정보가 읽기의 기대와 판단을 바꾸는 과정","전승의 지리적 이동 경로"],"a":2,"e":"읽기는 정보를 순차적으로 접하며 기대를 다시 형성하는 활동이다.","lv":"중"},{"n":73,"set":"문제은행","cat":"독자반응비평과 수용","q":"본문의 ‘빈틈’에 관한 설명으로 적절한 것은?","p":"","o":["빈틈을 발견하면 모든 추론이 같은 타당성을 갖는다.","본문이 명시하지 않는 연결을 독자가 근거를 따라 추론할 수 있는 자리다.","본문에 진술된 정보는 모두 빈틈에 해당한다.","사본에서 글자가 물리적으로 떨어져 나간 경우만 가리킨다."],"a":1,"e":"빈틈에 대한 보완은 앞뒤 문맥이 허용하는 범위에서 이루어진다.","lv":"중"},{"n":74,"set":"문제은행","cat":"독자반응비평과 수용","q":"같은 장면의 침묵을 두 독자가 각각 저항과 두려움으로 읽는다. 두 독법을 평가하는 방법은?","p":"","o":["두 사람이 서로 다르게 읽었으므로 어떤 근거도 비교하지 않는다.","사회적 위치가 더 널리 공유되는 독자의 답을 자동 채택한다.","둘 가운데 더 상세한 심리 서사를 꾸며 낸 쪽을 선택한다.","각 독법이 설명하는 표현과 문맥, 남는 반례를 비교한다."],"a":3,"e":"독자 차이를 인정하면서도 주장의 설명력과 근거를 비교할 수 있다.","lv":"상"},{"n":75,"set":"문제은행","cat":"독자반응비평과 수용","q":"본문의 수용사를 조사하는 주제로 적절한 것은?","p":"","o":["본문을 작성할 때 사용한 물감은 무엇이었는가?","본문 속 사건이 어떤 순서로 일어나는가?","어떤 서기관이 다른 자료의 문장을 먼저 기록했는가?","같은 본문이 서로 다른 시대의 설교와 그림에서 어떻게 재해석되었는가?"],"a":3,"e":"수용사는 실제 공동체와 예술이 본문을 받아들이고 변용한 역사를 살핀다.","lv":"중"},{"n":76,"set":"문제은행","cat":"독자반응비평과 수용","q":"Rezeptionsgeschichte 와 Traditionsgeschichte 의 일반적인 질문을 비교한 것은?","p":"","o":["전자는 본문이 어떻게 받아들여졌는지, 후자는 전승이 어떻게 전수되고 변형되었는지를 묻는다.","전자는 공간 배경을, 후자는 시의 평행법을 묻는다.","둘 다 모든 번역이 원문과 동일한지를 묻는 이름이다.","전자는 사본의 글자 차이를, 후자는 독자의 개인적 감정만을 묻는다."],"a":0,"e":"수용과 전승 사이에 접점은 있지만 주된 질문은 구별할 수 있다.","lv":"중"},{"n":77,"set":"문제은행","cat":"독자반응비평과 수용","q":"18 세기 설교가 어떤 본문을 정치적 저항의 근거로 인용한다. 가장 적절한 결론은?","p":"","o":["그 설교는 특정 시기의 수용을 보여 주며 본문의 초기 기능은 별도로 검토해야 한다.","같은 시대의 다른 설교도 모두 같은 뜻으로 사용했다고 볼 수 있다.","그 인용은 고대 저자가 동일한 정치 상황을 의도했음을 증명한다.","후대 설교에는 성경 본문의 해석으로 볼 만한 내용이 들어갈 수 없다."],"a":0,"e":"후대 자료는 수용의 증거이지 초기 의미의 직접 증거는 아니다.","lv":"상"},{"n":78,"set":"문제은행","cat":"독자반응비평과 수용","q":"내재된 독자에게 기대되는 반응과 실제 학급의 반응이 다를 때 적절한 조치는?","p":"","o":["작품의 독자 역할과 경험적 독자를 같은 것으로 간주한다.","학급의 반응이 다르므로 본문에는 어떤 단서도 없다고 본다.","본문의 읽기 단서와 학급의 반응을 구별하여 차이가 생긴 이유를 살핀다.","교수자의 첫 반응을 역사적으로 유일한 독자 반응으로 정한다."],"a":2,"e":"본문이 요청하는 읽기와 실제 수용 사이의 차이도 연구 자료다.","lv":"중"},{"n":79,"set":"문제은행","cat":"독자반응비평과 수용","q":"‘저자–본문–독자’의 세 지평에서 독자반응비평을 설명한 것으로 가장 적절한 것은?","p":"","o":["세 지평을 구별하면 한 본문을 두 방법으로 분석할 수 없다.","저자의 전기만 연구하면 독자반응을 충분히 알 수 있다.","독자의 역할을 전면에 두되 본문의 단서와 저자에 대한 질문을 구별할 수 있다.","읽기 과정에서는 본문의 언어가 어떤 제약도 주지 않는다."],"a":2,"e":"독자 중심의 질문을 제기하더라도 본문과 상호작용을 검토할 수 있다.","lv":"중"},{"n":80,"set":"문제은행","cat":"독자반응비평과 수용","q":"인터뷰 세 건으로 ‘모든 청년이 이 본문을 같은 방식으로 읽는다’고 결론 내렸다. 주요 문제는?","p":"","o":["세 건의 반응이 유사하면 본문이 시대를 초월해 하나의 뜻만 가진다.","독자의 반응은 개별 인터뷰로는 기록할 수 없다.","실제 독자에게 물었으므로 자료 자체가 항상 무효다.","일부 실제 독자의 반응을 모집단 전체에 일반화했다."],"a":3,"e":"표본의 범위와 대표성을 밝히고 결론을 자료가 허용하는 수준으로 제한해야 한다.","lv":"상"},{"n":81,"set":"문제은행","cat":"독자반응비평과 수용","q":"독자반응비평과 이야기비평이 같은 장면을 읽을 때의 질문을 잘 배분한 것은?","p":"","o":["전자는 문헌의 연대, 후자는 토지 분배의 고고학을 묻는다.","전자는 정경의 범위, 후자는 가구의 경제 규모를 묻는다.","전자는 사본 계보, 후자는 독자의 인구 통계를 묻는다.","전자는 독자의 기대 변화, 후자는 그 변화를 유도하는 정보의 배치를 묻는다."],"a":3,"e":"두 방법은 겹치지만 관심의 초점을 읽는 과정과 서사 구성에 달리 둘 수 있다.","lv":"중"},{"n":82,"set":"문제은행","cat":"독자반응비평과 수용","q":"여러 시대의 해석이 오늘의 독법에 계속 작용하는 방식을 연구할 때 가장 적절한 용어는?","p":"","o":["본문비평(Textual Criticism)","영향사(Wirkungsgeschichte)","양식비평(Form Criticism)","자료비평(Source Criticism)"],"a":1,"e":"영향사는 본문의 역사적 작용과 해석자가 그 영향 안에 놓인다는 문제에 주목한다.","lv":"상"},{"n":83,"set":"문제은행","cat":"여성주의 비평","q":"여성주의 비평의 영어 명칭은?","p":"","o":["Social-Scientific Criticism","Feminist Criticism","Reader-Response Criticism","Canonical Criticism"],"a":1,"e":"Feminist Criticism 은 성별 권력관계와 여성의 표상과 수용을 살피는 접근이다.","lv":"하"},{"n":84,"set":"문제은행","cat":"여성주의 비평","q":"영어 feminist 와 feminism 의 관계를 바르게 짝지은 것은?","p":"","o":["feminist 는 성차별의 제도를, feminism 은 성차별을 행하는 사람을 가리킨다.","feminist 는 여성주의자 또는 여성주의적이라는 뜻이고, feminism 은 여성주의를 가리킨다.","feminist 는 해석 방법의 명칭으로만, feminism 은 독자의 명칭으로만 쓰인다.","feminist 는 가부장제를, feminism 은 남성 중심주의를 가리킨다."],"a":1,"e":"feminist 는 사람을 가리키거나 수식어가 될 수 있고, feminism 은 사상과 운동을 가리킨다.","lv":"하"},{"n":85,"set":"문제은행","cat":"여성주의 비평","q":"Patriarchy 의 뜻에 가장 가까운 것은?","p":"","o":["본문을 읽는 사람이 시대에 따라 달라지는 현상","남성의 경험을 해석의 보편적 기준으로 삼는 관점 자체","두 시 행이 같은 생각을 발전시키는 문학적 관계","남성 중심의 권위가 가족과 사회 제도 안에서 유지되는 구조"],"a":3,"e":"가부장제는 관점의 편향과 구별해 제도화된 권위와 권력관계를 강조한다.","lv":"하"},{"n":86,"set":"문제은행","cat":"여성주의 비평","q":"Androcentrism 을 가장 직접 보여 주는 해석은?","p":"","o":["여성 인물의 행위가 사건 전개에 주는 효과를 살핀다.","남성 인물의 경험을 전체 공동체의 경험으로 간주하고 여성의 경험은 검토하지 않는다.","가족 내 재산권이 어느 성별에 집중되는지 문헌으로 조사한다.","같은 본문을 두 시대의 여성 독자가 다르게 읽었음을 기록한다."],"a":1,"e":"남성 경험을 인간 일반의 표준으로 삼는 읽기가 남성 중심주의의 사례다.","lv":"중"},{"n":87,"set":"문제은행","cat":"여성주의 비평","q":"남근을 상징적 권위와 의미 생산의 중심으로 삼는 질서를 가리키는 말은?","p":"","o":["Phallocentrism","Androcentrism","Reception history","Womanism"],"a":0,"e":"첨부 문제의 용어 구분에 따라 남근 중심주의를 묻는다.","lv":"하"},{"n":88,"set":"문제은행","cat":"여성주의 비평","q":"‘Womanist’라는 용어를 널리 알린 작가는?","p":"","o":["필리스 트리블","앨리스 워커","메리 데일리","엘리자베스 쉬슬러 피오렌자"],"a":1,"e":"앨리스 워커의 용어 사용은 이후 우머니스트 신학이 자기 관점을 표현하는 데 영향을 주었다.","lv":"하"},{"n":89,"set":"문제은행","cat":"여성주의 비평","q":"우머니스트 성서해석에 가장 가까운 질문은?","p":"","o":["흑인 여성의 경험을 바탕으로 인종·성별·계급의 억압이 어떻게 교차하는가?","모든 여성의 경험에 공통된 단일 해석 틀을 어떻게 세울 수 있는가?","성별과 인종의 차이를 배제한 채 문학적 형식만을 어떻게 묘사하는가?","고대 사본의 글자 차이를 어느 계보로 설명할 수 있는가?"],"a":0,"e":"우머니스트 접근은 흑인 여성의 구체적인 역사와 복합적인 억압에 주목한다.","lv":"중"},{"n":90,"set":"문제은행","cat":"여성주의 비평","q":"『Texts of Terror』에서 여성 인물의 고난을 문학적으로 면밀히 읽은 학자는?","p":"","o":["메리 데일리","앨리스 워커","필리스 트리블","로즈메리 래드퍼드 류터"],"a":2,"e":"트리블은 하갈, 다말 등 폭력과 소외를 겪는 인물의 서사를 문학적으로 분석했다.","lv":"하"},{"n":91,"set":"문제은행","cat":"여성주의 비평","q":"사무엘하 13장의 다말 이야기에서 트리블의 접근을 적용한 질문은?","p":"","o":["다말이 여성 전체의 동일한 경험을 대표한다고 전제할 수 있는가?","다말의 고난을 독자의 위로를 위해 생략해도 되는가?","다말의 발언과 그 이후 침묵이 폭력과 주변 인물의 태도를 어떻게 드러내는가?","다말 이야기가 쓰인 가죽 사본의 제작 연대는 언제인가?"],"a":2,"e":"여성 인물의 말과 서술 배치에서 폭력과 배제의 양상을 읽는다(삼하 13:12–22).","lv":"중"},{"n":92,"set":"문제은행","cat":"여성주의 비평","q":"의심·선포·회상·창조적 실현의 해석학을 결합한 학자는?","p":"","o":["앨리스 워커","메리 데일리","엘리자베스 쉬슬러 피오렌자","필리스 트리블"],"a":2,"e":"강의 자료가 제시한 네 해석학의 결합은 피오렌자의 접근이다.","lv":"하"},{"n":93,"set":"문제은행","cat":"여성주의 비평","q":"본문과 해석 전통이 성별 권력관계를 당연한 것으로 만드는지 살피는 것은 피오렌자의 어느 범주인가?","p":"","o":["의심의 해석학","선포의 해석학","창조적 실현의 해석학","회상의 해석학"],"a":0,"e":"의심은 무엇이 정상으로 전제되는지 묻고 억압을 정당화하는 표현을 검토한다.","lv":"중"},{"n":94,"set":"문제은행","cat":"여성주의 비평","q":"오늘의 예배에서 어떤 본문을 어떤 방식으로 읽고 선포할지 평가하는 작업은?","p":"","o":["회상의 해석학","선포의 해석학","의심의 해석학","창조적 실현의 해석학"],"a":1,"e":"선포의 해석학은 오늘 공동체에서 본문이 수행하는 기능과 효과를 평가한다.","lv":"중"},{"n":95,"set":"문제은행","cat":"여성주의 비평","q":"여성의 고난과 참여가 사라진 역사를 남아 있는 자료로 다시 구성하는 일은?","p":"","o":["선포의 해석학","회상의 해석학","의심의 해석학","창조적 실현의 해석학"],"a":1,"e":"회상은 잊힌 고난과 참여를 기억하며 역사를 재구성하는 작업이다.","lv":"중"},{"n":96,"set":"문제은행","cat":"여성주의 비평","q":"성서 속 여성의 참여를 기억하기 위해 새로운 예배 의식을 창작하는 일은?","p":"","o":["회상의 해석학","의심의 해석학","선포의 해석학","창조적 실현의 해석학"],"a":3,"e":"의식의 창작과 재현은 기억한 이야기를 공동체에서 새롭게 실현하는 행위다.","lv":"중"},{"n":97,"set":"문제은행","cat":"여성주의 비평","q":"강의에서 후기의 탈기독교적 여성 해방 입장과 연결된 학자는?","p":"","o":["메리 데일리","로즈메리 래드퍼드 류터","레티 러셀","필리스 트리블"],"a":0,"e":"첨부 자료는 기존 기독교 전통을 떠나는 후기 입장을 데일리와 연결한다.","lv":"하"},{"n":98,"set":"문제은행","cat":"여성주의 비평","q":"본문에서 여성 인물의 대사가 거의 없다. 가장 신중한 해석은?","p":"","o":["대사가 없으므로 서사의 권력관계를 분석할 수 없다.","여성의 대사가 적은 모든 본문은 같은 이유로 그렇게 쓰였다고 본다.","대사가 없으므로 실제 여성에게도 의견과 주도권이 없었다고 결론 낸다.","서술이 여성의 목소리를 어떻게 제한하는지 말할 수 있으나 역사적 여성의 무행위까지 입증하지는 못한다."],"a":3,"e":"본문의 재현과 사회의 실제 관행은 다른 분석 차원이다.","lv":"상"},{"n":99,"set":"문제은행","cat":"여성주의 비평","q":"사사기 19장의 폭력 서사를 오늘의 공동체에서 읽을 때 여성주의 비평에 가장 가까운 방법은?","p":"","o":["서사에 폭력이 등장하므로 저자와 모든 독자가 그것을 승인했다고 본다.","피해 인물의 위치와 기존 해석의 초점을 검토하고 오늘의 읽기가 피해를 어떻게 다루는지 묻는다.","피해 인물의 이름이 없으므로 인물의 역할은 분석에서 제외한다.","서사의 일부에 폭력이 있으므로 고대 사회 전체를 한 가지 양상으로만 설명한다."],"a":1,"e":"폭력의 재현이 곧 승인이라는 성급한 결론을 피하면서 피해와 수용에 주목한다.","lv":"상"},{"n":100,"set":"문제은행","cat":"여성주의 비평","q":"같은 폭력 본문에 이야기비평과 여성주의 비평을 결합한 연구 설계는?","p":"","o":["인물의 대화가 줄거리에 미치는 효과만 정리하고 누가 말할 수 있는지는 제외한다.","본문의 권위 인정 여부만 결정하고 인물의 말과 서술 기능은 분석하지 않는다.","인물의 말과 정보 배치를 분석하고, 그 서술이 누구의 경험을 드러내거나 가리는지 검토한다.","성별 권력에 대한 현대 독자의 판단만 기록하고 구절의 배열과 발언은 검토하지 않는다. 정답과 해설"],"a":2,"e":"이야기의 구성에 대한 관찰을 여성의 표상과 권력관계에 대한 해석의 근거로 삼는다.","lv":"상"},{"n":101,"set":"기출","cat":"정경비평","q":"정경비평을 영어로 바르게 표현한 것은?","p":null,"o":["Form Criticism","Canonical Criticism","Tradition Criticism","Redaction Criticism"],"a":1,"e":"","lv":""},{"n":102,"set":"기출","cat":"정경비평","q":"위 ( ㄱ )에 들어갈 알맞은 말은?","p":"‘( ㄱ ) focuses its attention on the final form of the text itself. --- Its concern is not to establish a history of Hebrew literature in general, but to study the features of this peculiar set of religious texts in relation to their usage within the historical community of ancient Israel. --- ( ㄱ ) to the Hebrew bible does not make any dogmatic claims for the literature apart from the literature, as if these texts contained only timeless truths or communicated in a unique idiom, but rather it studies them as historically and theologically conditioned writings which were accorded a normative function in the life of this community.’","o":["Form Criticism","Canonical Criticism","Tradition Criticism","Redaction Criticism"],"a":1,"e":"최종 형태와 공동체 안에서의 규범적 기능 → 정경비평.","lv":""},{"n":103,"set":"기출","cat":"정경비평","q":"윗글은 누구의 정의인가?","p":"‘( ㄱ ) focuses its attention on the final form of the text itself. --- Its concern is not to establish a history of Hebrew literature in general, but to study the features of this peculiar set of religious texts in relation to their usage within the historical community of ancient Israel. --- ( ㄱ ) to the Hebrew bible does not make any dogmatic claims for the literature apart from the literature, as if these texts contained only timeless truths or communicated in a unique idiom, but rather it studies them as historically and theologically conditioned writings which were accorded a normative function in the life of this community.’","o":["궁켈","샌더스","차일즈","엥그넬"],"a":2,"e":"최종 형태(final form)를 강조하는 정의는 차일즈.","lv":""},{"n":104,"set":"기출","cat":"정경비평","q":"다음은 어느 비평 방법론의 장점과 한계인가?","p":"가. 이 비평 방법은 성경의 최종 형태의 본문이 가지고 있는 기능과 의미를 추구하므로 최종 형태의 본문의 가치를 높였으며, 이후 최종 형태의 본문에 더욱 관심을 가지게 하는 계기를 마련하였다.\n나. 이 비평은 구약성경과 신약성경 사이의 관계성을 이해하고 그 의미를 폭넓게 하는데 도움을 준다.\n다. 역사 비평학이 성경의 본문의 과거 의도에 초점을 두는 반면에 이 비평은 현재의 신학적 의미에 치중한다. 그러나 본문의 신학적인 의미는 본문의 원래의 배경 등에 대한 충분한 이해를 바탕으로 해야 한다. 그렇지 아니하면 그 의미는 주관적인 것으로 그칠 수 있다.\n라. 이 비평은 역사 비평학의 본문의 역사의 재구성과는 달리 최종 형태의 분석에 초점을 둔다. 그러나 본문의 최종 형태가 반드시 이전의 형태보다 본문의 의미를 더욱 분명하게 전달한다고 할 수는 없다. 본문의 충분한 이해를 위해서는 최종 형태뿐만 아니라 이전 형태의 역사 즉 본문의 배경도 알아야 한다. 따라서 이 비평의 과정을 중요시하는 이도 출애굽기 주석에서 역사 비평학을 활용하고 있다.\n이 비평의 이런 한계점들은 다른 모든 공시적 방법론에 마찬가지로 적용된다. 따라서 통시적 방법론과 공시적 방법론이 서로 그 결과를 활용하고 한계점들을 보충할 때 본문의 뜻을 충분히 드러낼 수 있다.","o":["Form Criticism","Canonical Criticism","Tradition Criticism","Redaction Criticism"],"a":1,"e":"최종 형태, 신·구약 관계, 현재의 신학적 의미 → 정경비평.","lv":""},{"n":105,"set":"기출","cat":"사회과학비평","q":"위 ( ㄱ )에 들어갈 말은?","p":"‘( ㄱ ) tries to situate a biblical book or subsection in its proper social setting - taking into account the literary and historical relations between the parts and the whole. It further attempts to illuminate the text according to its explicit or implied social referents, in a manner similar to historical-critical method's clarification of the political and religious reference points of texts.’","o":["Rhetorical Criticism","Canonical Criticism","Structural Criticism","Social-Scientific Criticism"],"a":3,"e":"본문의 사회적 배경과 사회적 지시 대상 → 사회과학비평.","lv":""},{"n":106,"set":"기출","cat":"사회과학비평","q":"윗글은 누구의 정의인가?","p":"‘( ㄱ ) tries to situate a biblical book or subsection in its proper social setting - taking into account the literary and historical relations between the parts and the whole. It further attempts to illuminate the text according to its explicit or implied social referents, in a manner similar to historical-critical method's clarification of the political and religious reference points of texts.’","o":["N. K. Gottwald","B. S. Childs","Y. Gitay","P. Trible"],"a":0,"e":"사회과학비평의 정의는 갓월드.","lv":""},{"n":107,"set":"기출","cat":"사회과학비평","q":"군사적 정복설의 주장자는?","p":"다음 가나안 정복에 관한 네 가지 이론과 그 주장자들을 바르게 연결하시오.\n① Volkmar Fritz, J. Milgrom\n② G.E. Mendenhall, N.K. Gottwald, W. Dever\n③ A. Alt, M. Noth, Y. Aharoni\n④ W.F. Albright, G.E. Wright, J. Bright, Y. Yadin, A. Malamat","o":["Volkmar Fritz, J. Milgrom","G.E. Mendenhall, N.K. Gottwald, W. Dever","A. Alt, M. Noth, Y. Aharoni","W.F. Albright, G.E. Wright, J. Bright, Y. Yadin, A. Malamat"],"a":3,"e":"올브라이트 학파(Albright, Wright, Bright, Yadin, Malamat).","lv":""},{"n":108,"set":"기출","cat":"사회과학비평","q":"이주·정착·침투설의 주장자는?","p":"다음 가나안 정복에 관한 네 가지 이론과 그 주장자들을 바르게 연결하시오.\n① Volkmar Fritz, J. Milgrom\n② G.E. Mendenhall, N.K. Gottwald, W. Dever\n③ A. Alt, M. Noth, Y. Aharoni\n④ W.F. Albright, G.E. Wright, J. Bright, Y. Yadin, A. Malamat","o":["Volkmar Fritz, J. Milgrom","G.E. Mendenhall, N.K. Gottwald, W. Dever","A. Alt, M. Noth, Y. Aharoni","W.F. Albright, G.E. Wright, J. Bright, Y. Yadin, A. Malamat"],"a":2,"e":"알트, 노트, 아하로니.","lv":""},{"n":109,"set":"기출","cat":"사회과학비평","q":"혁명설의 주장자는?","p":"다음 가나안 정복에 관한 네 가지 이론과 그 주장자들을 바르게 연결하시오.\n① Volkmar Fritz, J. Milgrom\n② G.E. Mendenhall, N.K. Gottwald, W. Dever\n③ A. Alt, M. Noth, Y. Aharoni\n④ W.F. Albright, G.E. Wright, J. Bright, Y. Yadin, A. Malamat","o":["Volkmar Fritz, J. Milgrom","G.E. Mendenhall, N.K. Gottwald, W. Dever","A. Alt, M. Noth, Y. Aharoni","W.F. Albright, G.E. Wright, J. Bright, Y. Yadin, A. Malamat"],"a":1,"e":"멘덴홀, 갓월드, 데버.","lv":""},{"n":110,"set":"기출","cat":"사회과학비평","q":"보완 이론의 주장자는?","p":"다음 가나안 정복에 관한 네 가지 이론과 그 주장자들을 바르게 연결하시오.\n① Volkmar Fritz, J. Milgrom\n② G.E. Mendenhall, N.K. Gottwald, W. Dever\n③ A. Alt, M. Noth, Y. Aharoni\n④ W.F. Albright, G.E. Wright, J. Bright, Y. Yadin, A. Malamat","o":["Volkmar Fritz, J. Milgrom","G.E. Mendenhall, N.K. Gottwald, W. Dever","A. Alt, M. Noth, Y. Aharoni","W.F. Albright, G.E. Wright, J. Bright, Y. Yadin, A. Malamat"],"a":0,"e":"프리츠, 밀그롬.","lv":""},{"n":111,"set":"기출","cat":"수사비평","q":"수사비평을 영어로 바르게 표현한 것은?","p":null,"o":["Rhetorical Criticism","Canonical Criticism","Structural Criticism","Social-Scientific Criticism"],"a":0,"e":"","lv":""},{"n":112,"set":"기출","cat":"수사비평","q":"위 ( ㄱ )에 들어갈 말은?","p":"( ㄱ ), sharing the outlook of new criticism about the primacy of the text itself, and often operating under the banner of 'the final form of the text', concerns itself with the way the language of the text is deployed to convey meaning. Its interests are in the devices of writing, in metaphor and parallelism, in narrative and poetic structures, in stylistic figures. In principle, but not often in practice in Hebrew Bible studies, it has regard to the rhetorical situation of the composition and promulgation of ancient texts and to their intended effect upon their audience. But, like new criticism, its primary focus is upon the texts and their own internal articulation rather than upon their historical setting.","o":["Rhetorical Criticism","Canonical Criticism","Structural Criticism","Social-Scientific Criticism"],"a":0,"e":"언어의 장치·평행법·구조·수사적 상황 → 수사비평.","lv":""},{"n":113,"set":"기출","cat":"수사비평","q":"위를 주장한 사람은?","p":"( ㄱ ), sharing the outlook of new criticism about the primacy of the text itself, and often operating under the banner of 'the final form of the text', concerns itself with the way the language of the text is deployed to convey meaning. Its interests are in the devices of writing, in metaphor and parallelism, in narrative and poetic structures, in stylistic figures. In principle, but not often in practice in Hebrew Bible studies, it has regard to the rhetorical situation of the composition and promulgation of ancient texts and to their intended effect upon their audience. But, like new criticism, its primary focus is upon the texts and their own internal articulation rather than upon their historical setting.","o":["Muilenburg","Clines / Exum","Y. Gitay","P. Trible"],"a":1,"e":"클라인스와 엑섬의 정의.","lv":""},{"n":114,"set":"기출","cat":"수사비평","q":"다음은 누구의 수사비평 방법을 요약한 것인가?","p":"첫째 — 본문의 단락을 정한다. 이 때 인클루시오가 중요한 역할을 한다.\n둘째 — 한 단락으로 구분된 본문을 여러 작은 단락으로 나눈 후, 각 단락의 구조와 사상을 분석한다. 평행법, 교차대구법, 반복법과 불변화사 등의 수사적 장치들이 활용된다.\n셋째 — 작은 단락들 사이의 구조와 사상의 연결을 관찰한다.\n넷째 — 구조와 사상을 모두 연결시켜 본문의 주제들을 살펴본다.","o":["Muilenburg","Clines / Exum","Y. Gitay","P. Trible"],"a":0,"e":"단락 경계(인클루시오)와 구조 분석 → 뮐렌버그.","lv":""},{"n":115,"set":"기출","cat":"수사비평","q":"다음은 누구의 주장에 대한 설명인가?","p":"가. 사 1:2-3절의 본문을 가지고 예언의 연설적·웅변적인 호소를 예증함.\n나. 청중의 사고 형태를 변화시키기 위해 청중을 설득하는 것을 목표로 삼음.\n다. 성경의 담화가 가진 전달의 특성을 예증함(독자들/청중들에게 호소하려고 함).\n라. 담화를 효과적 전달-전략과 기교를 조직적으로 연구할 수 있게 하는 특수한 문학적 방법을 요구한다.","o":["Muilenburg","Clines / Exum","Y. Gitay","P. Trible"],"a":2,"e":"사 1:2-3과 청중 설득 → 기타이.","lv":""},{"n":116,"set":"기출","cat":"정경비평","q":"위는 누구의 정의인가?","p":"‘Canonical criticism traces the history of the function of those authoritative traditions which ended up in one of the canons. In order to do so it uses all the valid and pertinent tools of biblical criticism, especially ( ㄱ ), but focuses on the believing communities at every stage along the way rather than only on the individual discreet geniuses, such as original thinkers, editors, redactors, and the like, whose hands may be evident in the process.’","o":["궁켈","샌더스","차일즈","엥그넬"],"a":1,"e":"권위 있는 전승의 기능의 역사, 신앙 공동체 → 샌더스.","lv":""},{"n":117,"set":"기출","cat":"정경비평","q":"위 ( ㄱ )에 들어갈 알맞은 말은?","p":"‘Canonical criticism traces the history of the function of those authoritative traditions which ended up in one of the canons. In order to do so it uses all the valid and pertinent tools of biblical criticism, especially ( ㄱ ), but focuses on the believing communities at every stage along the way rather than only on the individual discreet geniuses, such as original thinkers, editors, redactors, and the like, whose hands may be evident in the process.’","o":["Form Criticism","Canonical Criticism","Tradition Criticism","Redaction Criticism"],"a":2,"e":"샌더스는 특히 전승비평(Tradition Criticism)을 활용한다.","lv":""},{"n":118,"set":"기출","cat":"여성주의 비평","q":"위 [ ㄱ ]에 들어갈 알맞은 말은?","p":"영어의 [ ㄱ ]는 흔히 여성이 종속되고 사회에서 소외되는 현상을 없애기 위한 운동을 전개하는 남녀 평등주의자, 여성 해방주의자, 여권 신장주의자, 여권주의자를 가리킨다.\n[ ㄴ ]이란 말은 일반적으로 남녀는 평등하므로 여성에 대한 모든 형태의 차별을 없애고 여성이 남성과 똑같은 권리와 기회를 가져야 한다고 주장하는 원리를 지지하는 여성 해방 운동을 가리킨다.\n[ ㄷ ]는 일반적으로 남성이 여성을 지배하고 조정하는 구조를 가리킨다.\n불란서의 여성신학은 남성을 중심으로 여기는 구조를 [ ㄹ ]라 하며 남근을 사회와 문화의 권위를 나타내는 것으로 이해한다.","o":["Feminist","Sexist","Womanist","Terrorist"],"a":0,"e":"사람을 가리킴 → Feminist.","lv":""},{"n":119,"set":"기출","cat":"여성주의 비평","q":"위 [ ㄴ ]에 들어갈 알맞은 말은?","p":"영어의 [ ㄱ ]는 흔히 여성이 종속되고 사회에서 소외되는 현상을 없애기 위한 운동을 전개하는 남녀 평등주의자, 여성 해방주의자, 여권 신장주의자, 여권주의자를 가리킨다.\n[ ㄴ ]이란 말은 일반적으로 남녀는 평등하므로 여성에 대한 모든 형태의 차별을 없애고 여성이 남성과 똑같은 권리와 기회를 가져야 한다고 주장하는 원리를 지지하는 여성 해방 운동을 가리킨다.\n[ ㄷ ]는 일반적으로 남성이 여성을 지배하고 조정하는 구조를 가리킨다.\n불란서의 여성신학은 남성을 중심으로 여기는 구조를 [ ㄹ ]라 하며 남근을 사회와 문화의 권위를 나타내는 것으로 이해한다.","o":["Feminism","Sexist","Womanist","Terrorist"],"a":0,"e":"운동·원리 → Feminism.","lv":""},{"n":120,"set":"기출","cat":"여성주의 비평","q":"위 [ ㄷ ]에 들어갈 알맞은 말은?","p":"영어의 [ ㄱ ]는 흔히 여성이 종속되고 사회에서 소외되는 현상을 없애기 위한 운동을 전개하는 남녀 평등주의자, 여성 해방주의자, 여권 신장주의자, 여권주의자를 가리킨다.\n[ ㄴ ]이란 말은 일반적으로 남녀는 평등하므로 여성에 대한 모든 형태의 차별을 없애고 여성이 남성과 똑같은 권리와 기회를 가져야 한다고 주장하는 원리를 지지하는 여성 해방 운동을 가리킨다.\n[ ㄷ ]는 일반적으로 남성이 여성을 지배하고 조정하는 구조를 가리킨다.\n불란서의 여성신학은 남성을 중심으로 여기는 구조를 [ ㄹ ]라 하며 남근을 사회와 문화의 권위를 나타내는 것으로 이해한다.","o":["Feminism","Sexist","Patriarchy","Terrorist"],"a":2,"e":"남성이 여성을 지배하는 구조 → Patriarchy(가부장제).","lv":""},{"n":121,"set":"기출","cat":"여성주의 비평","q":"위 [ ㄹ ]에 들어갈 알맞은 말은?","p":"영어의 [ ㄱ ]는 흔히 여성이 종속되고 사회에서 소외되는 현상을 없애기 위한 운동을 전개하는 남녀 평등주의자, 여성 해방주의자, 여권 신장주의자, 여권주의자를 가리킨다.\n[ ㄴ ]이란 말은 일반적으로 남녀는 평등하므로 여성에 대한 모든 형태의 차별을 없애고 여성이 남성과 똑같은 권리와 기회를 가져야 한다고 주장하는 원리를 지지하는 여성 해방 운동을 가리킨다.\n[ ㄷ ]는 일반적으로 남성이 여성을 지배하고 조정하는 구조를 가리킨다.\n불란서의 여성신학은 남성을 중심으로 여기는 구조를 [ ㄹ ]라 하며 남근을 사회와 문화의 권위를 나타내는 것으로 이해한다.","o":["Feminism","Sexist","Patriarchy","phallocentrism"],"a":3,"e":"남근을 권위의 상징으로 이해 → phallocentrism(남근 중심주의). ※ 원문은 ( ㄷ )로 표기되어 있으나 ( ㄹ )의 오기로 보임.","lv":""},{"n":122,"set":"기출","cat":"독자반응비평과 수용","q":"다음 중 독자반응 비평과 관련 깊은 이론은?","p":null,"o":["방출 이론","수용 이론","저항 이론","저자 이론"],"a":1,"e":"","lv":""},{"n":123,"set":"기출","cat":"독자반응비평과 수용","q":"독자반응 비평을 영어로 바르게 표현한 것은?","p":null,"o":["Rhetorical Criticism","Reader Response Criticism","Structural Criticism","Social-Scientific Criticism"],"a":1,"e":"","lv":""},{"n":124,"set":"기출","cat":"독자반응비평과 수용","q":"다음 중 관계없는 것을 고르시오.","p":null,"o":["Rezeptionsgeschichte","Transformationsgeschichte","Wirkungsgeschichte","Traditionsgeschichte"],"a":3,"e":"수용사·변형사·영향사는 수용 연구, 전승사(Traditionsgeschichte)는 통시적 방법.","lv":""},{"n":125,"set":"기출","cat":"이야기비평","q":"다음은 어느 비평 방법론에 대한 정의인가?","p":"이 비평이란 용어는 넓게는 지난 70년대 말 이후 다양한 방법론적인 관점에서 가끔 성경의 역사 비평적 해석과 반대되는 문학 비평적 해석으로 사용되어 왔다. 이 비평가들은 본문을 저자와 해석자와 관계없이 해석할 수 있는 실체로 이해한다. 이 비평은 관습적인 구조들을 식별하고 줄거리를 결정하고 인물 묘사의 전개, 관점의 구별, 언어 놀이를 드러내고, 이 모두를 전반적인 주제에 연결시키기 위해서 본문을 자세히 읽는 것에서 본문의 의미를 발견하려고 한다. 이 비평은 내재된 저자가 내재된 독자에게 전달하려는 의미를 밝혀내려는 것이다. 이런 방법은 실제 저자가 기록한 본문을 실제 독자가 읽고 해석할 때 어떤 능동적인 역할을 기대하는 독자 반응 비평과는 다르다.","o":["Rhetorical Criticism","Narrative Criticism","Structural Criticism","Social-Scientific Criticism"],"a":1,"e":"줄거리·인물·관점, 내재된 저자/독자 → 이야기비평.","lv":""},{"n":126,"set":"기출","cat":"이야기비평","q":"다음은 이야기 요소 중 어느 것에 대한 설명인가?","p":"등장인물이 행동하기에 적합한 상황을 설정해 주는 이야기의 한 요소이다. 등장인물의 행동이 언제 어디서 어떻게 일어나는지를 말해준다. 주로 이야기의 분위기를 형성하는 역할을 하며, 주로 한 이야기 단락을 해석하는데 결정적 역할을 한다.\n아브람스(M. M. Abrams) — 이것을 공간적, 시간적, 사회적 상황으로 구분한다. ‘이것’은 이야기 등장인물이 생활하는 물리적 환경과 그 환경을 구성하는 기둥이나 가구 등을 가리킨다.\n발(M. Bal) — 실내(보호, 안전, 감금을 의미함)와 실외(위험, 자유를 의미함)의 대조(시골과 도시, 고독과 사교, 육지와 바다)가 이야기의 이것에 적합한 하나의 역동적인 것이라고 한다. 그리고 경계선이 대조된 장소를 잇는 특별한 역할을 한다고 하였다.","o":["인물","줄거리","배경","독자"],"a":2,"e":"언제·어디서·어떻게 → 배경.","lv":""},{"n":127,"set":"기출","cat":"이야기비평","q":"다음은 이야기 요소 중 어느 것에 대한 설명인가?","p":"이야기는 서정시와 잠언처럼 비시간적 이미지 등과는 달리 이것이 특징이다. 이것은 이야기의 의미가 전달되는 구성의 힘이나 원칙이다. 이것은 전개, 갈등, 복잡화, 절정, 해결로 구성된다. 등장인물과 이것은 이야기 연구의 주된 요소이며, 관계는 단순히 인물들이 줄거리를 구성하는 것이 아니다. 이야기를 구성하는 인물들 안에 있는 힘인 욕망과 야망이 그것을 구성하는 움직임과 변화에 동기를 부여한다.\n첫째 — 등장인물이 이것의 근본적인 기능으로 여긴다. 등장인물 묘사의 어떤 복잡성도 그 이야기 장르에 의해서 이미 이것 안에서 그 등장인물의 위치에 종속된다.\n둘째 — 등장인물을 이야기의 필수 조건으로 본다. 이것이 독자를 완전히 낯선 곳으로 데려갈 때도 등장인물들 자신의 세계의 관점에서 등장인물들을 확인하게 된다.\n셋째 — 이것과 등장인물 사이에 우선순위를 두지 않고 둘이 서로 나누어질 수 없다.","o":["인물","줄거리","배경","독자"],"a":1,"e":"전개·갈등·복잡화·절정·해결 → 줄거리.","lv":""},{"n":128,"set":"기출","cat":"이야기비평","q":"다음은 어느 비평 방법론의 장점인가?","p":"첫째, 성경 본문 자체에 초점을 둔 본문 중심적 해석 방법이다. 따라서 본문 형성 이전의 자료 층이나 자료의 구성 단계를 밝혀 내지 않아도 전체 이야기에 비추어서 본문 자체를 읽고 이해할 수 있게 한다.\n둘째, 신앙 공동체와 밀접한 연관성을 가진다. 최종 형태의 본문을 신앙 공동체가 그들의 신앙과 삶에 권위 있는 것으로 인정하고 본문 자체 안에서 내재된 독자의 관점에서 본문을 해석하여 신앙의 관점에서 생긴 주석을 제공한다.\n셋째, 역사적 배경이 불확실한 본문에 통찰력을 주며, 가설이 아닌 주어진 이야기로 시작하며, 본문의 역사적 증거에 대해서 어떤 가치가 주어진다고 해도 본문은 하나님의 참된 뜻을 가진 이야기로 읽혀질 수 있다고 여긴다.\n넷째, 역사 비평을 검증하고 균형을 이루게 한다. 내재된 독자의 관점에서 본문을 해석하려고 하지만 그 관점이 현대 독자의 관점과 언제나 일치하지는 않는다.","o":["Rhetorical Criticism","Narrative Criticism","Structural Criticism","Social-Scientific Criticism"],"a":1,"e":"전체 이야기, 내재된 독자 → 이야기비평.","lv":""},{"n":129,"set":"기출","cat":"여성주의 비평","q":"다음 ( ) 안에 들어갈 단어는?","p":"종교 연구에서 아프리카 계통의 미국인 여성 해방 신학자들은 워커(A. Walker)의 (    )라는 용어를 도입하여 여성 신학이 백인 여성들의 정치적 운동과 이론적 사상을 넘어선 것이라는 사실을 알리려고 했다.","o":["Feminist","Sexist","Womanist","Terrorist"],"a":2,"e":"앨리스 워커 → Womanist.","lv":""},{"n":130,"set":"기출","cat":"여성주의 비평","q":"다음은 어느 비평에 대한 정의인가?","p":"남성 중심적인 이미지로 가득 찬 기독교 전통에서 남성 우월주의를 반대하는 것을 넘어서서 여성의 관점에서 여성을 낮추는 문화를 비평하고 남녀가 모두 똑같은 인간으로서 평등하다는 사실을 인식하도록 하는데 있다. 기본적으로 여성의 정치적, 사회적, 경제적, 종교적 권리에 관한 문제와 관심에 관련된 본문에 집중한다. 이처럼 남성 중심적인 본문에 들어 있는 증거를 분석하고, 여성의 삶과 소리가 실제로 본문에 의해서 억눌려온 방식들을 자세히 드러내어서, 여성의 소리가 이런 본문에서 어떻게 발견되고 읽혀지고 알려질 수 있는가를 묻는다. 여성이 소외된 증거와 남성이 본문을 다룬 것을 드러낼 뿐만 아니라, 그러한 문화 자체를 지배해온 계급 제도를 고칠 것을 기대한다. 이런 비평은 인종과 계급, 심리학, 환경학과 인간의 성문제 등에 영향을 끼친다.","o":["Rhetorical Criticism","Narrative Criticism","Structural Criticism","Feminist Criticism"],"a":3,"e":"","lv":""},{"n":131,"set":"기출","cat":"여성주의 비평","q":"누구와 관련된 내용인가?","p":"(1) 본문들을 재평가하여 여성 차별주의를 역사적, 사회적으로 입증하여 여성의 긍정적인 이미지를 제시하려고 한다.\n(2) 성경의 가부장제에 도전한 본문들에 관심을 가지고 이를 재해석하고 비판하려고 한다. 성경의 성차별주의에 도전하는 신학을 수립하여 여성 이미지에 새로운 활력을 불어넣고자 한다.\n(3) 위의 두 방법을 합하여 여성 차별주의에 대한 자료들을 생생하게 기억하기 위해 이 본문들을 시적, 신학적으로 다시 묘사한다.","o":["류터","러셀","트리블","피오렌자"],"a":2,"e":"공포의 본문을 시적·신학적으로 재서술 → 트리블.","lv":""},{"n":132,"set":"기출","cat":"여성주의 비평","q":"위의 내용은 누구의 주장인가?","p":"(1) ( ㄱ ): 성경 본문과 해석이 남성 중심적인 것이며 가부장제의 기능화에 봉사하는 것이라는 가정에서 출발. 성경의 권위를 받아들이기보다는 의심의 자세를 취해야 한다. 성경 안에 어떤 억압적인, 혹은 인종차별적인 요소들을 인식하고 이런 요소들을 변명하며 피하는 일을 하지 말아야 하며, 성경 본문 안에서 본문의 남성 중심적 언어 안에 숨겨질 수도 있는 어떤 반 가부장적 잠재적 요인들을 정직하게 발견하려고 노력해야 함.\n(2) ( ㄴ ): 오늘날 신앙 공동체에 대한 성경의 신학적 의의와 힘을 검토한다. 해석은 선포와 떨어질 수 없다. 본문들이 포괄적인 언어로 번역되기 전에 조심스런 선택의 과정이 있어야 한다. 성별 차별이나 가부장적 구조를 지지하는 본문들은 선포되어서는 안된다. 남녀 모두 평등하게 확증하는 본문들만 예배 낭독용 성구집에 사용되어야 한다.\n(3) ( ㄷ ): 성경의 역사를 여성 해방적 관점에서 역사적 비판적으로 재건하여 모든 성경 전승을 회복하려고 한다. 성경에서 남성 중심적 본문이나 가부장적 구조를 영구화하고 정당화하는 본문들이 버려져서는 안된다. 더욱이 이런 본문들은 여성이 어떻게 억압받고 소외되었는가를 기억하는 자원이 되어야 한다. 이런 고난의 재해석을 기억의 해석학이라 부른다.\n(4) ( ㄹ ): 성경의 해방의 역사에서 여성들의 적극적인 참여를 뜻한다. 역사적 상상력, 예술적 재창조, 새로운 예배와 의식을 통해 여성들이 성경 역사에 참여하게 한다. 과거 교회가 역사적으로 계속해서 성경 본문의 일부와 전통들을 의식화 해온 것처럼, 현재 교회는 성경 이야기를 다시 말하고 해석하여 성경의 선조 어머니들과 누이들을 축하할 의식을 창조적으로 형성해야 한다.","o":["류터","러셀","트리블","피오렌자"],"a":3,"e":"네 가지 해석학 → 피오렌자.","lv":""},{"n":133,"set":"기출","cat":"여성주의 비평","q":"위 ( ㄱ )에 들어갈 말은?","p":"(1) ( ㄱ ): 성경 본문과 해석이 남성 중심적인 것이며 가부장제의 기능화에 봉사하는 것이라는 가정에서 출발. 성경의 권위를 받아들이기보다는 의심의 자세를 취해야 한다. 성경 안에 어떤 억압적인, 혹은 인종차별적인 요소들을 인식하고 이런 요소들을 변명하며 피하는 일을 하지 말아야 하며, 성경 본문 안에서 본문의 남성 중심적 언어 안에 숨겨질 수도 있는 어떤 반 가부장적 잠재적 요인들을 정직하게 발견하려고 노력해야 함.\n(2) ( ㄴ ): 오늘날 신앙 공동체에 대한 성경의 신학적 의의와 힘을 검토한다. 해석은 선포와 떨어질 수 없다. 본문들이 포괄적인 언어로 번역되기 전에 조심스런 선택의 과정이 있어야 한다. 성별 차별이나 가부장적 구조를 지지하는 본문들은 선포되어서는 안된다. 남녀 모두 평등하게 확증하는 본문들만 예배 낭독용 성구집에 사용되어야 한다.\n(3) ( ㄷ ): 성경의 역사를 여성 해방적 관점에서 역사적 비판적으로 재건하여 모든 성경 전승을 회복하려고 한다. 성경에서 남성 중심적 본문이나 가부장적 구조를 영구화하고 정당화하는 본문들이 버려져서는 안된다. 더욱이 이런 본문들은 여성이 어떻게 억압받고 소외되었는가를 기억하는 자원이 되어야 한다. 이런 고난의 재해석을 기억의 해석학이라 부른다.\n(4) ( ㄹ ): 성경의 해방의 역사에서 여성들의 적극적인 참여를 뜻한다. 역사적 상상력, 예술적 재창조, 새로운 예배와 의식을 통해 여성들이 성경 역사에 참여하게 한다. 과거 교회가 역사적으로 계속해서 성경 본문의 일부와 전통들을 의식화 해온 것처럼, 현재 교회는 성경 이야기를 다시 말하고 해석하여 성경의 선조 어머니들과 누이들을 축하할 의식을 창조적으로 형성해야 한다.","o":["의심의 해석학","선포의 해석학","회상의 해석학","창조적 실현의 해석학"],"a":0,"e":"","lv":""},{"n":134,"set":"기출","cat":"여성주의 비평","q":"위 ( ㄷ )에 들어갈 말은?","p":"(1) ( ㄱ ): 성경 본문과 해석이 남성 중심적인 것이며 가부장제의 기능화에 봉사하는 것이라는 가정에서 출발. 성경의 권위를 받아들이기보다는 의심의 자세를 취해야 한다. 성경 안에 어떤 억압적인, 혹은 인종차별적인 요소들을 인식하고 이런 요소들을 변명하며 피하는 일을 하지 말아야 하며, 성경 본문 안에서 본문의 남성 중심적 언어 안에 숨겨질 수도 있는 어떤 반 가부장적 잠재적 요인들을 정직하게 발견하려고 노력해야 함.\n(2) ( ㄴ ): 오늘날 신앙 공동체에 대한 성경의 신학적 의의와 힘을 검토한다. 해석은 선포와 떨어질 수 없다. 본문들이 포괄적인 언어로 번역되기 전에 조심스런 선택의 과정이 있어야 한다. 성별 차별이나 가부장적 구조를 지지하는 본문들은 선포되어서는 안된다. 남녀 모두 평등하게 확증하는 본문들만 예배 낭독용 성구집에 사용되어야 한다.\n(3) ( ㄷ ): 성경의 역사를 여성 해방적 관점에서 역사적 비판적으로 재건하여 모든 성경 전승을 회복하려고 한다. 성경에서 남성 중심적 본문이나 가부장적 구조를 영구화하고 정당화하는 본문들이 버려져서는 안된다. 더욱이 이런 본문들은 여성이 어떻게 억압받고 소외되었는가를 기억하는 자원이 되어야 한다. 이런 고난의 재해석을 기억의 해석학이라 부른다.\n(4) ( ㄹ ): 성경의 해방의 역사에서 여성들의 적극적인 참여를 뜻한다. 역사적 상상력, 예술적 재창조, 새로운 예배와 의식을 통해 여성들이 성경 역사에 참여하게 한다. 과거 교회가 역사적으로 계속해서 성경 본문의 일부와 전통들을 의식화 해온 것처럼, 현재 교회는 성경 이야기를 다시 말하고 해석하여 성경의 선조 어머니들과 누이들을 축하할 의식을 창조적으로 형성해야 한다.","o":["의심의 해석학","선포의 해석학","회상의 해석학","창조적 실현의 해석학"],"a":2,"e":"기억의 해석학 = 회상의 해석학.","lv":""},{"n":135,"set":"기출","cat":"여성주의 비평","q":"다음은 누구에 대한 설명인가?","p":"초기에는 기독교 안의 변화의 가능성을 기대. 그러나 후기에는 여성들이 일반적으로 사악한 남성들의 유대교-기독교 전통을 떠나서 가부장주의의 부정적인 악을 정복하여 기독교 이후의 신앙을 형성하려는 가장 급진적인 입장을 취함. 류터는 그가 남성다움이란 기만적인 반질서와 그 위에 대립된 여성다움이란 초월적 정신 세계를 이루고자 하는데 이는 고대 영지주의적 유형들과 너무 흡사하다고 비판.","o":["류터","데일리","트리블","피오렌자"],"a":1,"e":"후기 탈기독교 입장 → 메리 데일리.","lv":""},{"n":136,"set":"기출","cat":"독자반응비평과 수용","q":"“사고의 지평”이란 용어와 관련된 사람은?","p":null,"o":["프라이","가다머","리꾀르","틸리히"],"a":1,"e":"","lv":""},{"n":137,"set":"기출","cat":"사회과학비평","q":"다음은 어느 비평 방법론의 정의인가?","p":"이 비평 방법은 사회과학의 방법과 자료와 이론들을 구약성경의 본문에 적용시켜서 본문과 고대 이스라엘 사회의 조직 관계를 연구하고 본문에서 사회의 삶의 형태를 드러내며 이 형태에 비추어서 현대 사회에 대한 신학적 교훈을 찾으려는 방법론이다.","o":["자료비평","양식비평","사회과학적 비평","독자반응비평"],"a":2,"e":"","lv":""},{"n":138,"set":"기출","cat":"사회과학비평","q":"사회과학적 비평을 영어로 바르게 표현한 것은?","p":null,"o":["Rhetorical Criticism","Canonical Criticism","Structural Criticism","Social-Scientific Criticism"],"a":3,"e":"","lv":""},{"n":139,"set":"기출","cat":"독자반응비평과 수용","q":"다음은 어느 비평 방법론의 정의인가?","p":"The communication process by means of texts can be described in terms of the basic relationships between sender, message, and receiver. Historical studies as a general rule tend to concentrate on the relationship between sender and message, structural studies on the text itself, and Reader Response Theory (hereafter RRT) on the interaction between text and receiver(s). Although the approach developed by RRT has its origins in the field of general literary studies, it is becoming increasingly prominent in the interpretation of biblical material.\n— Lategan, Bernard G. 'Reader Response Theory,' ABD 5 (1992), 625.","o":["Rhetorical Criticism","Reader Response Criticism","Structural Criticism","Social-Scientific Criticism"],"a":1,"e":"라테간의 정의.","lv":""},{"n":140,"set":"기출","cat":"독자반응비평과 수용","q":"다음은 어느 비평 방법론에 대한 평가인가?","p":"가. 일반 문학에 대한 연구방법론을 성경에 적용시켜 성경 본문과 진지한 상호작용을 촉진시킨다.\n나. 자유롭게 본문의 뜻을 이해할 수 있게 하며 다양한 기교와 방법들을 수용할 수 있게 한다.\n다. 더욱 전통적인 성경 연구와 문학 연구의 방법들을 수용하고 이용할 수 있다.\n라. 후기 현대 문학 비평, 여성 신학적 해석 등에 이론적 토대를 제공한다.\n마. 포괄적인 방법론이 아니다.\n바. 문학 중심적이므로 종교적, 역사적 연구 관점에서 적절치 못하다고 판단될 수 있다.\n사. 허구와 같은 문학적 연구 과정의 생성물이라는 인식이 성경 연구에 적용될 수 있는가에 대한 의심을 가진다.","o":["Rhetorical Criticism","Reader Response Criticism","Structural Criticism","Social-Scientific Criticism"],"a":1,"e":"","lv":""},{"n":141,"set":"기출","cat":"여성주의 비평","q":"다음 중 관계없는 단어 하나를 고르시오.","p":null,"o":["patriarchy","androcentrism","phallocentrism","feminism"],"a":3,"e":"가부장제·남성 중심주의·남근 중심주의는 비판 대상, feminism은 비판하는 쪽.","lv":""},{"n":142,"set":"기출","cat":"수사비평","q":"다음은 어떤 용어에 대한 설명인가?","p":"“한 단락의 시작에서 쓰인 낱말이나 어구나 문장이 그 단락의 끝에서 반복되어 서로 평행선을 이룸으로 시작과 끝의 관계를 식별하는 장치로 쓰임”","o":["parallelism","rhetoric criticism","inclusio","merismus"],"a":2,"e":"","lv":""},{"n":143,"set":"기출","cat":"수사비평","q":"위 ( let selSets = new Set(SETS.map(s=>s[0])), selCats = new Set(CATS);
let ord='rand', mode='instant';
let Q=[], ans=[], idx=0;
const $=id=>document.getElementById(id);
const show=id=>['home','quiz','result','wrong'].forEach(s=>$(s).classList.toggle('hidden',s!==id));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function pool(){return DATA.filter(q=>selSets.has(q.set)&&selCats.has(q.cat));}
function renderChips(){
  $('setChips').innerHTML=SETS.map(([k,l])=>{const c=DATA.filter(q=>q.set===k&&selCats.has(q.cat)).length;return `<span class="chip ${selSets.has(k)?'on':''}" data-s="${k}">${l}<span class="c">${c}</span></span>`}).join('');
  $('catChips').innerHTML=CATS.map(k=>{const c=DATA.filter(q=>q.cat===k&&selSets.has(q.set)).length;return `<span class="chip ${selCats.has(k)?'on':''}" data-c="${k}">${k}<span class="c">${c}</span></span>`}).join('');
  const n=pool().length, r=$('cnt');
  r.max=Math.max(n,1); if(+r.value>n) r.value=n; if(+r.value<1)r.value=Math.min(20,n);
  $('cntLbl').textContent=`${n?r.value:0} / ${n}문항`;
  $('startBtn').disabled=!n;
}
$('setChips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.s;selSets.has(k)?selSets.delete(k):selSets.add(k);renderChips();};
$('catChips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.c;selCats.has(k)?selCats.delete(k):selCats.add(k);renderChips();};
$('allCat').onclick=e=>{e.preventDefault();selCats=selCats.size===CATS.length?new Set():new Set(CATS);renderChips();};
$('cnt').oninput=renderChips;
function tog(id,cb){$(id).onclick=e=>{const d=e.target.closest('div[data-v]');if(!d)return;[...$(id).children].forEach(x=>x.classList.toggle('on',x===d));cb(d.dataset.v);};}
tog('ordTog',v=>ord=v);
tog('modeTog',v=>{mode=v;$('modeHint').textContent=v==='instant'?'한 문항씩 바로 정답과 해설을 확인합니다.':'모든 문항을 푼 뒤 제출하면 한꺼번에 채점합니다.';});

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(list){
  Q=list; ans=Array(Q.length).fill(null); idx=0;
  $('gridCard').classList.toggle('hidden',mode!=='exam');
  show('quiz'); render(); window.scrollTo(0,0);
}
$('startBtn').onclick=()=>{let p=pool();p=ord==='rand'?shuffle(p):p.sort((a,b)=>a.n-b.n);start(p.slice(0,+$('cnt').value));};

function render(){
  const q=Q[idx], a=ans[idx], graded=mode==='instant'&&a!==null;
  $('pos').textContent=`${idx+1} / ${Q.length}`;
  $('progBar').style.width=((idx+1)/Q.length*100)+'%';
  $('qmeta').innerHTML=`<span class="tag">No.${q.n}</span><span class="tag">${q.cat}</span>${q.lv?`<span class="tag">난이도 ${q.lv}</span>`:''}`;
  $('qpas').classList.toggle('hidden',!q.p); $('qpas').textContent=q.p||'';
  $('qtext').textContent=q.q;
  $('opts').innerHTML=q.o.map((o,i)=>{let c='';if(graded){if(i===q.a)c='ok';else if(i===a)c='ng';}else if(a===i)c='sel';
    return `<button class="opt ${c}" data-i="${i}" ${graded?'disabled':''}><span class="no">${NUM[i]}</span><span>${esc(o)}</span></button>`}).join('');
  if(graded){const ok=a===q.a;$('fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><b>${ok?'⭕ 정답!':'❌ 오답 — 정답은 '+NUM[q.a]}</b>${q.e?esc(q.e):''}</div>`;}
  else $('fb').innerHTML='';
  $('prevBtn').disabled=idx===0;
  const last=idx===Q.length-1;
  if(mode==='instant'){$('nextBtn').textContent=last?'결과 보기':'다음';$('nextBtn').disabled=a===null;}
  else{$('nextBtn').textContent=last?'제출하기':'다음';$('nextBtn').disabled=false;renderGrid();}
}
function renderGrid(){
  $('grid').innerHTML=Q.map((_,i)=>`<span class="${ans[i]!==null?'done':''} ${i===idx?'cur':''}" data-i="${i}">${i+1}</span>`).join('');
  $('ansCnt').textContent=`${ans.filter(x=>x!==null).length} / ${Q.length} 답함`;
}
$('grid').onclick=e=>{const s=e.target.closest('span');if(!s)return;idx=+s.dataset.i;render();};
$('opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;ans[idx]=+b.dataset.i;render();
  if(mode==='exam'&&idx<Q.length-1)setTimeout(()=>{idx++;render();},180);};
$('prevBtn').onclick=()=>{if(idx>0){idx--;render();}};
$('nextBtn').onclick=()=>{
  if(idx<Q.length-1){idx++;render();window.scrollTo(0,0);return;}
  if(mode==='exam'){const un=ans.filter(x=>x===null).length;if(un&&!confirm(`안 푼 문항이 ${un}개 있습니다. 제출할까요?`))return;}
  result();
};
$('quitBtn').onclick=()=>{if(ans.some(x=>x!==null)){if(confirm('지금까지 푼 문항으로 채점할까요?\n(취소 = 처음 화면으로)'))return result();}show('home');};

function wrongs(){return Q.map((q,i)=>({q,a:ans[i]})).filter(x=>x.a!==x.q.a);}
function result(){
  const done=Q.map((q,i)=>({q,a:ans[i]})).filter(x=>mode==='exam'||x.a!==null);
  const total=mode==='exam'?Q.length:done.length;
  const ok=done.filter(x=>x.a===x.q.a).length, pct=total?Math.round(ok/total*100):0;
  $('emo').textContent=pct>=90?'🏆':pct>=80?'🎉':pct>=70?'😊':pct>=60?'🙂':pct>=40?'😅':'📚';
  $('scoreTxt').textContent=`${ok} / ${total}`;
  $('scoreSub').textContent=`정답률 ${pct}%`+(pct>=90?' · 완벽에 가까워요!':pct>=70?' · 잘하고 있어요':' · 오답노트로 복습해 보세요');
  const by={};done.forEach(x=>{const c=x.q.cat;by[c]=by[c]||[0,0];by[c][1]++;if(x.a===x.q.a)by[c][0]++;});
  $('catStat').innerHTML=CATS.filter(c=>by[c]).map(c=>{const[o,t]=by[c],p=Math.round(o/t*100);return `<div class="stat" style="display:block"><div style="display:flex;justify-content:space-between"><span>${c}</span><span>${o}/${t} · ${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('');
  Q=done.map(x=>x.q);ans=done.map(x=>x.a);
  const w=wrongs().length;
  $('wrongBtn').disabled=$('retryWrongBtn').disabled=!w;
  show('result');window.scrollTo(0,0);
}
function wrongNote(){
  const w=wrongs();$('wCnt').textContent=`틀린 문항 ${w.length}개`;
  $('wList').innerHTML=w.map(({q,a})=>`<div class="wn"><div class="meta"><span class="tag">No.${q.n}</span><span class="tag">${q.cat}</span></div>${q.p?`<div class="passage">${esc(q.p)}</div>`:''}<div class="q">${esc(q.q)}</div>
  <div class="l my">내 답: ${a===null?'(무응답)':NUM[a]+' '+esc(q.o[a])}</div><div class="l ans">정답: ${NUM[q.a]} ${esc(q.o[q.a])}</div>${q.e?`<div class="e">💡 ${esc(q.e)}</div>`:''}</div>`).join('');
  show('wrong');window.scrollTo(0,0);
}
$('wrongBtn').onclick=wrongNote;
const retryW=()=>{const w=wrongs().map(x=>x.q);start(ord==='rand'?shuffle(w):w);};
$('retryWrongBtn').onclick=retryW;$('retryWrongBtn2').onclick=retryW;
$('backRes').onclick=()=>show('result');
$('homeBtn').onclick=()=>{renderChips();show('home');window.scrollTo(0,0);};
renderChips();
</script>
</body>
</html>
