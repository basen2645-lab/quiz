<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신약개론 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E4E7EB;--paper:#FFFFFF;--ink:#14171C;--sub:#5F6670;--rule:#CDD2D8;--faint:#F2F4F6;
  --pen:#D62839;--pen-soft:#FDECEE;--blue:#1D4ED8;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hand:"Nanum Pen Script","Noto Sans KR",cursive;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0D0F12;--paper:#191C21;--ink:#ECEEF1;--sub:#9AA1AB;--rule:#323842;--faint:#22262D;--pen:#FF5C6C;--pen-soft:#3A1C21;--blue:#7AA2FF;}}
:root[data-theme="dark"]{--desk:#0D0F12;--paper:#191C21;--ink:#ECEEF1;--sub:#9AA1AB;--rule:#323842;--faint:#22262D;--pen:#FF5C6C;--pen-soft:#3A1C21;--blue:#7AA2FF;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}
.sheet{max-width:640px;margin:0 auto;background:var(--paper);min-height:100vh;padding:22px 20px 120px;box-shadow:0 0 0 1px var(--rule)}
@media (min-width:700px){.sheet{margin:24px auto;min-height:auto;border-radius:4px}}

/* exam header */
.ehead{border:2px solid var(--ink);margin-bottom:22px}
.ehead .r1{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--ink);font-size:13px;font-weight:500}
.ehead .ttl{text-align:center;padding:16px 10px 12px}
.ehead .ttl small{display:block;font-size:13px;color:var(--sub);letter-spacing:.02em}
.ehead .ttl b{display:block;font-family:var(--serif);font-weight:900;font-size:34px;letter-spacing:.18em;line-height:1.3;margin-top:2px}
.ehead .cells{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink)}
.ehead .cells div{padding:7px 4px;text-align:center;font-size:12px;color:var(--sub)}
.ehead .cells div+div{border-left:1px solid var(--ink)}
.ehead .cells b{display:block;font-size:17px;color:var(--ink);font-weight:700}
.tbtn{font-size:12px;border:1px solid var(--ink);padding:2px 9px;border-radius:999px}

.sec{margin:0 0 26px}
.sec h2{font-family:var(--serif);font-size:17px;font-weight:700;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.sec h2 span{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--sub)}

/* scope */
.grp{border-top:1px solid var(--ink)}
.grp:last-child{border-bottom:1px solid var(--ink)}
.ghead{display:flex;align-items:center;gap:10px;width:100%;padding:11px 2px 9px;text-align:left;font-weight:700;font-size:15px}
.ghead .n{margin-left:auto;font-size:13px;color:var(--sub);font-weight:400}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 10px;padding:0 0 12px 30px}
.bk{display:flex;align-items:center;gap:8px;padding:6px 0;text-align:left;font-size:14.5px}
.bk .n{color:var(--sub);font-size:12px;margin-left:auto;padding-right:4px}
/* omr bubble */
.bub{flex:0 0 auto;width:20px;height:26px;border:1.5px solid var(--ink);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;line-height:1;transition:background .12s,color .12s}
.bub.sm{width:16px;height:21px;font-size:10px}
[aria-pressed="true"]>.bub,[aria-checked="true"]>.bub{background:var(--ink);color:var(--paper)}
[aria-checked="mixed"]>.bub{background:linear-gradient(var(--ink),var(--ink)) center/60% 2px no-repeat}

/* options rows */
.opts2{display:flex;flex-direction:column}
.orow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--rule)}
.orow:first-child{border-top:1px dashed var(--rule)}
.orow .k{font-size:14.5px;font-weight:500}
.tabs{display:flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.tabs button{padding:6px 11px;font-size:13px}
.tabs button+button{border-left:1.5px solid var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.tog{width:44px;height:26px;border-radius:13px;border:1.5px solid var(--ink);position:relative;flex:0 0 auto}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--ink);transition:left .15s}
.tog[aria-checked="true"]{background:var(--ink)}
.tog[aria-checked="true"]::after{left:20px;background:var(--paper)}
.cntrow{display:flex;align-items:center;gap:12px}
.cntbig{font-family:var(--serif);font-size:40px;font-weight:900;line-height:1;min-width:2.2em}
.cntbig small{font-family:var(--sans);font-size:14px;font-weight:400;color:var(--sub)}
input[type=range]{flex:1;accent-color:var(--ink)}
.quick{display:flex;gap:6px;margin-top:8px}
.quick button{border:1px solid var(--rule);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--sub)}

/* sticky bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--paper) 30%);pointer-events:none;z-index:5}
.dock .in{max-width:608px;margin:0 auto;display:flex;gap:8px;pointer-events:auto}
.big{flex:1;background:var(--ink);color:var(--paper);border-radius:10px;padding:15px 10px;font-size:16.5px;font-weight:700}
.big:disabled{opacity:.3;cursor:default}
.sbtn{flex:0 0 auto;border:1.5px solid var(--ink);background:var(--paper);border-radius:10px;padding:13px 16px;font-size:15px;font-weight:500}

/* quiz */
.qtop{position:sticky;top:0;background:var(--paper);z-index:4;margin:-22px -20px 18px;padding:12px 20px 10px;border-bottom:1px solid var(--rule)}
.qtop .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
.qtop .row b{color:var(--ink)}
.track{height:3px;background:var(--faint);margin-top:9px}
.track i{display:block;height:100%;background:var(--ink);transition:width .25s}
.qline{display:flex;gap:12px;align-items:flex-start;position:relative}
.qno{font-family:var(--serif);font-weight:900;font-size:30px;line-height:1.1;min-width:1.6em;position:relative}
.qno .mark{position:absolute;left:-12px;top:-16px;width:66px;height:66px;pointer-events:none}
.qbody{flex:1;min-width:0}
.qtag{font-size:12.5px;color:var(--sub);margin:3px 0 6px}
.qtag b{color:var(--ink);font-weight:700}
.qtag .st{color:var(--pen);font-weight:700}
.stem{font-family:var(--serif);font-size:18.5px;font-weight:600;line-height:1.7;margin:0 0 4px;word-break:keep-all}
.hint{font-size:12.5px;color:var(--sub);margin:0 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 6px;border-radius:8px;font-family:var(--serif);font-size:15.5px;line-height:1.65;word-break:keep-all;position:relative}
.opt:hover{background:var(--faint)}
.opt .bub{margin-top:1px;position:relative}
.opt.done{cursor:default}.opt.done:hover{background:none}
.opt .pm{position:absolute;left:-7px;top:-4px;width:34px;height:38px;pointer-events:none;overflow:visible}
.opt.wrongpick .tx{text-decoration:line-through;text-decoration-color:var(--pen);text-decoration-thickness:1.5px}
.opt.isans .tx{color:var(--ink)}
.opt.done:not(.isans):not(.wrongpick) .tx{color:var(--sub)}
.pen{fill:none;stroke:var(--pen);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.note{margin:14px 0 0 calc(1.6em + 12px);background:var(--pen-soft);border-radius:8px;padding:13px 15px;font-size:14.5px;line-height:1.7}
.note .hd{font-family:var(--hand);color:var(--pen);font-size:24px;line-height:1;margin-bottom:6px}
@media (max-width:440px){.note{margin-left:0}}

/* result */
.rhead{text-align:center;padding:10px 0 18px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.rhead small{font-size:13px;color:var(--sub)}
.scorewrap{position:relative;display:inline-block;margin:14px auto 4px;padding:8px 30px}
.score{font-family:var(--hand);color:var(--pen);font-size:96px;line-height:1}
.scorewrap svg{position:absolute;inset:-6px -10px;width:calc(100% + 20px);height:calc(100% + 12px);overflow:visible}
.rsub{font-size:15px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--rule);padding:8px 4px;text-align:left}
.tbl th{font-weight:500;color:var(--sub);font-size:12.5px;border-bottom:1.5px solid var(--ink)}
.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .bar{display:block;height:6px;background:var(--faint);min-width:60px}
.tbl .bar i{display:block;height:100%;background:var(--ink)}
.tbl .low i{background:var(--pen)}

/* notes */
.wn{padding:18px 0;border-bottom:1px dashed var(--rule)}
.wn ol{list-style:none;margin:10px 0 0;padding:0}
.wn li{display:flex;gap:10px;padding:5px 0;font-family:var(--serif);font-size:14.5px;line-height:1.6;word-break:keep-all}
.wn li.x .t{text-decoration:line-through;text-decoration-color:var(--pen);color:var(--sub)}
.wn li.c .bub{border-color:var(--pen);color:var(--pen);border-width:2px}
.wn li.c .t{font-weight:600}
.wn .note{margin-left:0}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.back{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.back h1{font-family:var(--serif);font-size:24px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.pen{stroke-dashoffset:0}}
</style>
</head>
<body>
<main class="sheet">

<section id="home">
  <div class="ehead">
    <div class="r1"><span>2026학년도 2학기</span><button class="tbtn" id="themeBtn" type="button">다크</button></div>
    <div class="ttl"><small>신약개론 · 공관복음부터 바울서신까지</small><b>모의고사</b></div>
    <div class="cells"><div><b>231</b>문항</div><div><b>11</b>권</div><div><b>77</b>복수정답</div></div>
  </div>

  <div class="sec">
    <h2>출제 범위 <span id="scopeSum"></span></h2>
    <div id="groups"></div>
  </div>

  <div class="sec">
    <h2>설정</h2>
    <div class="opts2">
      <div class="orow"><span class="k">문항 유형</span><div class="tabs" id="kindTabs"></div></div>
      <div class="orow"><span class="k">출제 순서</span><div class="tabs" id="orderTabs"></div></div>
      <div class="orow"><span class="k">정답 개수 미리 보기</span><button class="tog" id="hintTog" role="switch" aria-checked="false" aria-label="정답 개수 미리 보기"></button></div>
    </div>
  </div>

  <div class="sec">
    <h2>문항 수</h2>
    <div class="cntrow"><span class="cntbig" id="cntOut">20</span><input type="range" id="cnt" min="1" max="20" value="20" aria-label="문항 수"></div>
    <div class="quick" id="quick"></div>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="qtop">
    <div class="row"><span><b id="qPos"></b></span><span id="qRun"></span><button class="tbtn" id="quitBtn" type="button">채점 마치기</button></div>
    <div class="track"><i id="qProg"></i></div>
  </div>
  <div class="qline">
    <div class="qno" id="qNo"></div>
    <div class="qbody">
      <p class="qtag" id="qTag"></p>
      <p class="stem" id="qStem"></p>
      <p class="hint" id="qHint"></p>
      <div id="qOpts"></div>
    </div>
  </div>
  <div id="qFb"></div>
</section>

<section id="result" class="hidden">
  <div class="rhead">
    <small>신약개론 모의고사 · 채점 결과</small><br>
    <div class="scorewrap"><span class="score" id="rScore"></span><svg viewBox="0 0 200 120" preserveAspectRatio="none"><path pathLength="1" class="pen" d="M40 18 C110 -8 196 20 190 62 C184 108 70 120 22 92 C-6 74 8 30 60 14"/></svg></div>
    <div class="rsub" id="rSub"></div>
  </div>
  <div class="sec"><h2>책별 성적</h2><table class="tbl"><thead><tr><th>책</th><th>정답률</th><th class="r">맞힘</th></tr></thead><tbody id="rBooks"></tbody></table></div>
</section>

<section id="notes" class="hidden">
  <div class="back"><h1>오답노트</h1><button class="tbtn" id="backBtn" type="button">결과로</button></div>
  <p class="hint" id="nLead"></p>
  <div id="nList"></div>
</section>

</main>
<div class="dock"><div class="in" id="dock"></div></div>
<script>
const QS = [{"id": 1, "book": "로마서", "sub": "", "tag": "", "n": 1, "stem": "로마서의 저자, 기록 장소, 시기 및 연대에 대한 설명으로 맞지 않는 것은?", "opts": ["로마서의 바울 저작설은 오늘날 성서학계에서 의심의 여지가 없는 확고한 사실이다.", "로마서는 바울의 3차 선교여행 끝자락인 기원후 56년 봄, 고린도 가이오의 집에서 작성된 것으로 추정된다(롬 16:23, 고전 1:14).", "바울은 로마서를 로마 감옥에 죄수로 갇혀 있을 때 로마 총독 피스토스에게 제출할 법정 변증서로 기록했다.", "겐그레아 교회의 일꾼인 뵈뵈(Phoebe) 집사가 편지 전달 임무를 맡았을 가능성이 높다(롬 16:1-2)."], "ans": [3], "exp": "로마서는 감옥이 아니라 바울 선교 사역의 전환점(동쪽 선교 마감 및 서쪽 스페인 선교 계획 시점)에 고린도에서 예루살렘으로 연보를 전달하러 가기 직전에 작성되었습니다.", "kind": "neg"}, {"id": 2, "book": "로마서", "sub": "", "tag": "", "n": 2, "stem": "우도 슈넬레(U. Schnelle)가 정리한 로마서의 '5가지 기록 목적 및 배경'에 해당하지 않는 것은?", "opts": ["계획한 스페인 선교 사역에 필요한 로마 교회의 인적·물적 후원과 동의 확보", "예루살렘에 연보를 전달할 때 예상되는 유대인들의 저항과 위험을 극복하기 위한 로마 교회의 중보기도 요청", "예루살렘과 로마에서 불거진 유대주의 적대자들의 선동과 비난에 맞선 자신의 복음(칭의론) 변증", "로마 황제 네로를 암살하고 예루살렘 성전을 물리적으로 재건하기 위한 군사적 혁명 기금 조성"], "ans": [4], "exp": "슈넬레가 제시한 5가지 기록 목적은 (1) 스페인 선교 도움, (2) 예루살렘 연보 전달을 위한 중보기도, (3) 유대주의 적대자 선동 저항, (4) 로마 유대교 및 로마 당국과의 갈등 증대 상황 대응, (5) 자신의 복음(칭의론)에 대한 체계적 소개입니다.", "kind": "neg"}, {"id": 3, "book": "로마서", "sub": "", "tag": "", "n": 3, "stem": "로마 교회의 기원, 클라우디우스 칙령(AD 49년) 및 성도 구성에 대한 설명으로 맞지 않는 것은?", "opts": ["기원후 49년 클라우디우스 황제는 '크레스투스(Chrestus)' 분쟁으로 인해 유대인과 유대계 그리스도인을 로마에서 추방했다.", "클라우디우스 칙령으로 유대계 그리스도인이 추방되면서, 로마 교회는 이방계 그리스도인이 다수를 이루게 되었다.", "기원후 54년 클라우디우스 사망 후 유대계 성도들이 돌아왔으나, 바울이 로마서를 쓸 당시에 로마 교회는 여전히 유대인 전용 단일 회당 구조였다.", "로마서 기록 시점에 이방 그리스도인은 이미 로마 교회의 다수로 존재했다(롬 1:5, 11:13, 15:15-16)."], "ans": [3], "exp": "클라우디우스 칙령 이후 유대계 그리스도인이 소수가 되고 이방계 그리스도인이 다수를 이루었으며, 로마 교회는 단일 회당이 아니라 수많은 독립된 가정교회 형태로 발전했습니다.", "kind": "neg"}, {"id": 4, "book": "로마서", "sub": "", "tag": "", "n": 4, "stem": "로마서 16장의 사회적 계층 정보 및 '에베소 가설(에베소 편지설)'에 대한 설명으로 맞지 않는 것은?", "opts": ["16장에는 28명의 개인 명단(26명 호명)이 언급되며, 브리스가와 아굴라는 노예를 고용한 자유 자영업자로 나타난다(롬 16:3-4).", "16장 인사 명단에 언급된 26명 중 12명은 동쪽 지역에서 로마로 이주해 온 이주민(peregrini)으로 추정된다.", "슈넬레(U. Schnelle)는 로마서 16장이 원래 에베소로 보내진 별개의 소개 편지라는 '에베소 가설'을 적극 수용하여 16장을 정경에서 삭제해야 한다고 주장했다.", "슈미탈스, 카제만 등은 16:1-20을 에베소로 보내진 독립 편지로 보았으나, 16:3-16a의 인물 이주 상황과 서신 결미 문맥은 로마를 가리킨다."], "ans": [3], "exp": "슈넬레는 에베소 가설의 근거가 설득력이 없음을 지적하고, 클라우디우스 사후 이주 상황과 동역자들의 이동을 근거로 16장이 로마서의 원래 원문에 속함을 증명합니다.", "kind": "neg"}, {"id": 5, "book": "로마서", "sub": "", "tag": "", "n": 5, "stem": "로마서 16장의 '본문 비평(사본 전통)' 및 송영 위치에 대한 설명으로 올바른 것은?", "opts": ["로마서 16:25-27의 마지막 송영은 사본에 따라 14장 뒤, 15장 뒤, 16장 뒤 등 다양한 위치에 나타난다.", "영지주의자 마르키온(Marcion)은 로마서를 14장까지만 수용하고 15장과 16장을 전면 삭 제했다.", "로마서 15장 전체가 완전히 빠져 있는 사본이 정경 사본 학계의 보편적 정설로 입증되었다.", "로마서 16:23에서 편지가 본래 종결되었을 가능성과 16:25-27 송영의 위치 유연성은 후대 전승의 정리를 반영한다."], "ans": [1, 2, 4], "exp": "로마서 15장으로 끝나는 사본은 존재하지 않으며, 15장과 16장 전체가 통째로 없는 사본은 오직 마르키온 사본뿐입니다.", "kind": "pos"}, {"id": 6, "book": "로마서", "sub": "", "tag": "", "n": 6, "stem": "로마서의 문학적 장르 분류에 대한 학자들의 견해로 맞지 않는 것은?", "opts": ["다이스만(A. Deissmann) - 서한적 서신", "젤러(D. Zeller) - 에세이 서신", "스토워즈(S. K. Stowers) &아운(D. E. Aune) - 설득의 말(logos protreptikos)", "슈미탈스(W. Schmithals) - 로마 황제를 찬양하는 묵시적 군사 서신"], "ans": [4], "exp": "슈미탈스는 로마서를 '교육서신'으로 분류했으며, 스토워즈 등은 교훈적·철학적 유도를 담은 '설득의 말(logos protreptikos)'로 보았습니다.", "kind": "neg"}, {"id": 7, "book": "로마서", "sub": "", "tag": "", "n": 7, "stem": "로마서 1:16-17에 선포된 '하나님의 의(Dikaiosynē theou)'에 대한 설명으로 올바른 것은?", "opts": ["복음은 모든 믿는 자에게 구원을 주시는 하나님의 능력이다(롬 1:16).", "'하나님의 의'는 단순한 법정적 선언을 넘어, 인간에게 구원을 가져오는 하나님의 선물이자 구원 행동이다.", "'하나님의 의'는 오직 구약 율법의 할례와 제사 의식을 완벽하게 행한 유대인에게만 차등적으로 분배되는 공로이다.", "하박국 2:4(\"의인은 믿음으로 말미암아 살리라\")를 인용하여 믿음과 의의 인과적 결합을 선포한다(롬 1:17)."], "ans": [1, 2, 4], "exp": "'하나님의 의'는 율법의 행위나 공로가 아니라, 유대인이나 헬라인이나 막론하고 예 수 그리스도를 믿는 모든 자에게 거저 주시는 구원의 능력입니다.", "kind": "pos"}, {"id": 8, "book": "로마서", "sub": "", "tag": "", "n": 8, "stem": "로마서 1:18-3:20에 나타난 이방인과 유대인의 죄와 책무에 대한 설명으로 맞지 않는 것은?", "opts": ["1:18-32에서 이방인들은 창조주 하나님을 알고도 우상숭배와 도덕적 일탈에 빠져 하나님의 진노 아래 놓였다.", "2:1-29에서 유대인들은 율법을 가졌으나 행하지 않음으로 외식에 빠졌으며, 참된 할례는 표면적 할례가 아니라 마음에 하는 할례이다.", "3:1-20에서 유대인은 선한 행위 덕분에 하나님의 심판에서 완전히 면제되며 이방인만 심판받는다고 결론짓는다.", "\"의인은 없나니 하나도 없으며... 율법의 행위로 그의 앞에 의롭다 하심을 얻을 육체가 없다\" (롬 3:10, 20)."], "ans": [3], "exp": "바울은 유대인이나 이방인이나 다 죄 아래에 있으며, 온 세상이 하나님의 심판 아래에 있고 율법의 행위로는 아무도 의롭다 함을 얻지 못한다고 선언합니다.", "kind": "neg"}, {"id": 9, "book": "로마서", "sub": "", "tag": "", "n": 9, "stem": "로마서 3:21-31의 칭의론과 '화목제물(Hilastērion)' 전승에 대한 설명으로 올바른 것은?", "opts": ["율법 외에 하나님의 한 의가 나타났으니 율법과 선지자들에게 증거를 받은 것이다(롬 3:21).", "하나님이 예수를 그의 피로써 믿음으로 말미암는 '화목제물(hilastērion)'로 세우셨다(롬 3:25a).", "바울은 유대계 그리스도교의 세례/속죄 전승(3:25-26a)을 전면 거부하고 율법적 제사 제도로 돌아갈 것을 명했다.", "사람이 의롭다 하심을 얻는 것은 율법의 행위에 있지 않고 믿음으로 되는 줄 우리가 인정하노라(롬 3:28)."], "ans": [1, 2, 4], "exp": "바울은 최초 유대계 그리스도교의 속죄/세례 전승(3:25-26a)을 끌어와 자신의 칭의론과 통합시킴으로써 오직 믿음으로 말미암는 은혜의 구원을 선포합니다.", "kind": "pos"}, {"id": 10, "book": "로마서", "sub": "", "tag": "", "n": 10, "stem": "로마서 4장의 '아브라함의 믿음과 칭의'에 대한 설명으로 맞지 않는 것은?", "opts": ["아브라함이 하나님을 믿으매 그것이 그에게 의로 여겨졌다(창 15:6 인용).", "아브라함이 의롭다 하심을 받은 시점은 할례시가 아니라 무할례시였다(롬 4:9-10).", "아브라함은 오직 할례 받은 유대인만의 조상이며, 무할례 이방인은 아브라함의 유업에서 전면 배제된다.", "아브라함은 무할례자로서 믿는 모든 자의 조상이 되어 그들도 의로 여기심을 얻게 하려 하심이다(롬 4:11)."], "ans": [3], "exp": "아브라함은 무할례시에 믿음으로 의롭다 함을 받았으므로, 할례자와 무할례자 모두의 조상이자 칭의의 구속사적 모델이 됩니다.", "kind": "neg"}, {"id": 11, "book": "로마서", "sub": "", "tag": "", "n": 11, "stem": "로마서 5:12-21의 '아담-그리스도 유형론(Typology)'에 대한 설명으로 올바른 것은?", "opts": ["한 사람(아담)으로 말미암아 죄가 세상에 들어오고 죄로 말미암아 사망이 들어왔다(롬 5:12).", "한 사람 예수 그리스도의 은혜와 한 의로운 행위로 말미암아 많은 사람이 의롭다 하심을 받아 생명에 이르렀다(롬 5:17-18).", "아담의 범죄가 인류에게 미친 영향보다 그리스도의 구원 은혜의 효력이 훨씬 더 미약하다.", "아담은 오실 자의 유형(typos)이다(롬 5:14)."], "ans": [1, 2, 4], "exp": "바울은 아담 한 사람의 범죄로 사망이 왕 노릇 한 것보다, 예수 그리스도 한 분을 통해 은혜와 의의 선물이 훨씬 더 풍성하게 넘침을 강조합니다.", "kind": "pos"}, {"id": 12, "book": "로마서", "sub": "", "tag": "", "n": 12, "stem": "로마서 6장의 '세례론'과 신비종교와의 비교에 대한 설명으로 맞지 않는 것은?", "opts": ["그리스도 예수와 합하여 세례를 받은 우리는 그의 죽으심과 합하여 세례를 받은 것이다(롬 6:3).", "세례를 통해 죄에 대하여 단번에 죽고, 성령의 능력 안에서 신령한 새 생명 가운데서 행하게 된다(롬 6:4).", "신비종교(이시스 제의 등)의 세례와 그리스도교의 세례는 구전적·예전적 절차와 신학적 의미가 완전히 동일하다.", "그리스도교 세례는 단 한 번에 포괄적인 전체 구원 사건에 참여하며, 현재의 윤리적 삶의 변화를 규정한다."], "ans": [3], "exp": "신비종교 의식에서의 세례는 반복적인 예전 절차의 일부이지만, 그리스도교의 세례는 입회 의식이자 단 한 번에 전체 구원 사건에 참여하고 윤리적 삶을 가동시키는 결정적 사건입니다.", "kind": "neg"}, {"id": 13, "book": "로마서", "sub": "", "tag": "", "n": 13, "stem": "로마서 7장의 '나(Egō)'와 율법에 대한 해석 논쟁(큄멜, 타이센 등)으로 올바른 것은?", "opts": ["큄멜(W. G. Kümmel)은 7장의 '나(egō)'를 그리스도교적 관점에서 관조적으로 묘사한 비유적·전형적 '나'로 해석했다.", "7:12에서 \"율법은 거룩하고 계명도 거룩하고 의로우며 선하도다\"라며 율법 자체의 선함을 인정한다.", "7:14-25의 탄식(\"오호라 나는 곤고한 사람이로다\")은 성령으로 구원받은 그리스도인의 완벽한 성화적 승리 상태를 나타낸다.", "7:25b(\"내 자신이 마음으로는 하나님의 법을 육신으로는 죄의 법을 섬기노라\")는 바울 사후의 후대 주해(Glosse) 논쟁이 있는 구절이다."], "ans": [1, 2, 4], "exp": "7:14-25의 '나'는 율법 아래에서 죄의 권세에 매여 갈등하는 인간의 실존 또는 불신앙의 상황을 설명하는 구절입니다.", "kind": "pos"}, {"id": 14, "book": "로마서", "sub": "", "tag": "", "n": 14, "stem": "로마서 8장의 '성령 안에서의 삶'과 피조물의 탄식에 대한 설명으로 맞지 않는 것은?", "opts": ["그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니 생명의 성령의 법이 죄와 사망의 법에서 너를 해방하였다(롬 8:1-2).", "성령은 우리가 하나님의 자녀인 것을 증언하시며, 우리가 \"아바 아버지\"라고 부르짖게 하신다(롬 8:15-16).", "피조물은 성도들의 구원과 완전히 무관하며, 영원히 썩어짐의 종노릇 한 데 매여 멸망하도록 버려졌다.", "피조물이 고대하는 바는 하나님의 아들들이 나타나는 것이며, 피조물도 썩어짐의 종노릇 한 데서 해방되어 영광의 자유에 이르는 것이다(롬 8:19-21)."], "ans": [3], "exp": "로마서 8:18-25는 구원받지 못한 피조물 전체가 성도들과 함께 탄식하며 하나님의 아들들이 나타나 구속받기를 소망한다고 선포합니다.", "kind": "neg"}, {"id": 15, "book": "로마서", "sub": "", "tag": "", "n": 15, "stem": "로마서 9-11장의 '이스라엘의 구원'과 11:26a(\"온 이스라엘이 구원을 받으리라\")에 대한 설명으로 맞는 것은?", "opts": ["육신의 자녀가 하나님의 자녀가 아니요 오직 약속의 자녀가 씨로 여김을 받는다(롬 9:8).", "이방인의 충만한 수가 들어오기까지 이스라엘의 더러는 우둔하게 된 것이다(롬 11:25).", "이스라엘이 복음을 거절했으므로 하나님은 이스라엘과의 구약 약속을 완전히 폐기하고 이스라엘 민족 전체를 지옥 심판으로 저주하셨다.", "무스너(F. Mußner)는 '재림의 그리스도(Parousiachristus)'가 율법의 행위 없이 복음으로 모든 이스라엘을 구원한다고 해석했다."], "ans": [1, 2, 4], "exp": "바울은 이스라엘의 불순종에도 불구하고 하나님의 은사와 부르심에는 후회하심이 없으며(11:29), 결국 \"온 이스라엘이 구원을 받으리라(롬 11:26a)\"라는 구원사의 비밀을 선포합니다.", "kind": "pos"}, {"id": 16, "book": "로마서", "sub": "", "tag": "", "n": 16, "stem": "로마서 12-13장의 윤리 및 국가관(13:1-7)에 대한 설명으로 맞지 않는 것은?", "opts": ["너희 몸을 하나님이 기뻐하시는 거룩한 산 제물로 드리라 이는 너희가 드릴 영적 예배니라(롬 12:1).", "각 사람은 위에 있는 권세들에게 복종하라 권세는 하나님으로부터 나지 않음이 없나니 모든 권세는 다 하나님께서 정하신 바라(롬 13:1).", "사랑은 이웃에게 악을 행하지 아니하나니 그러므로 사랑은 율법의 완성이니라(롬 13:10).", "바울은 로마 교인들에게 로마 제국에 맞서 폭력 무장 투쟁을 일으키고 모든 세금 납부를 거부할 것을 사도적 명령으로 지시했다."], "ans": [4], "exp": "바울은 로마서 13:1-7에서 국가 권세에 대한 상식적 복종과 조세(세금) 납부를 권면하였으며, 폭력적 혁명이나 무장 투쟁을 명령하지 않았습니다.", "kind": "neg"}, {"id": 17, "book": "로마서", "sub": "", "tag": "", "n": 17, "stem": "로마서 14:1-15:13의 '강한 자'와 '약한 자' 논쟁에 대한 설명으로 올바른 것은?", "opts": ["'약한 자'는 고기를 먹지 않고 채식을 하며 특정 날(절기)을 지키는 유대계 그리스도인/경건한 자들이다.", "'강한 자'는 그리스도 안에서 음식과 날의 자유를 누리는 이방계 그리스도인 및 바울 자신이다(롬 15:1).", "바울은 '강한 자'의 자유만을 옹호하며, '약한 자'들을 교회에서 즉각 출교시키고 멸시할 것을 명했다.", "믿음이 강한 우리는 마땅히 믿음이 약한 자의 약점을 담당하고 자기를 기쁘게 하지 아니할 것이라(롬 15:1)."], "ans": [1, 2, 4], "exp": "바울은 비판하거나 멸시하지 말고 그리스도께서 우리를 받아 하나님께 영광을 돌리심과 같이 서로 받으라고 권면합니다(롬 15:7).", "kind": "pos"}, {"id": 18, "book": "로마서", "sub": "", "tag": "", "n": 18, "stem": "로마서와 갈라디아서의 '율법 이해' 비교 및 '성령의 법(롬 8:2)'에 대한 설명으로 맞지 않는 것은?", "opts": ["갈라디아서가 위기 속의 격렬하고 상황적인 율법 비판이라면, 로마서는 율법의 선함과 공의를 포함한 원칙적·체계적 논의이다.", "롬 3:27의 '믿음의 법(nomos pisteōs)'과 롬 8:2의 '성령의 법(nomos tou pneumatos)'에서 '노모스(nomos)'의 의미에 대해 학술적 논쟁이 존재한다.", "로제, 오스텐자켄, 휘브너 등은 롬 8:2의 '법'을 '규칙/원리'로 보는 반면, 카제만, 파울젠, 레이제넨은 이를 구약 토라 자체로 해석했다.", "롬 10:4의 \"그리스도는 모든 믿는 자에게 의를 이루기 위하여 율법의 마침(telos)이 되시니라\"에서 telos는 '완성/목표' 또는 '끝'으로 해석된다."], "ans": [3], "exp": "로제(E. Lohse), 오스텐자켄, 한, 휘브너는 '노모스'를 구약 토라와 연결시키는 반면, 카제만, 파울젠, 레이제넨, 베버 등은 이를 본래적 의미가 아닌 '규칙, 규범, 질서'로 해석합니다.", "kind": "neg"}, {"id": 19, "book": "로마서", "sub": "", "tag": "", "n": 19, "stem": "'바울의 새 관점(New Perspective on Paul)' 및 스텐달(K. Stendahl), 샌더스(E. P. Sanders)의 주장에 대한 설명으로 올바른 것은?", "opts": ["스텐달은 칭의론의 핵심이 개인의 양심의 가책이나 구원이 아니라, '하나님의 백성 안에 이방인을 포함하는 것'이라고 보았다.", "샌더스는 고대 유대교의 본질이 공로주의가 아니라 하나님의 은혜적 언약에 근거한 '언약적 율법주의(Covenantal Nomism)'라고 주장했다.", "샌더스는 바울의 칭의론이 고대 유대교의 율법 준수 구원관과 100% 완전히 동일하다고 입증했다.", "슈넬레(U. Schnelle)는 바울 신학의 핵심이 단순한 언약 사상이 아니라 '참여적 그리스도론(partizipatorische Christologie)'에 있다고 강조한다."], "ans": [1, 2, 4], "exp": "샌더스는 유대교의 이미지를 '언약적 율법주의'로 바로잡았으나, 바울 신학은 종교로 귀의하는 것이 언약이 아니라 그리스도와의 하나 됨(참여)을 통해 일어난다고 슈넬레는 분석합니다.", "kind": "pos"}, {"id": 20, "book": "로마서", "sub": "", "tag": "", "n": 20, "stem": "최근 연구에서 엥베르크-페데르센(T. Engberg-Pedersen)이 비교 분석한 세네카의 『호혜에 대하여(De beneficiis)』와 로마서의 관계에 대한 설명으로 올바른 것은?", "opts": ["로마서와 비슷한 시기에 작성된 세네카의 저서는 고대 사회의 후원과 상호 호혜(Gift-giving / Charis) 제도를 보여준다.", "세네카에 따르면 호혜에 대해 감사하지 않는 것은 수치스러운 일이며, 선행은 손에서 손으로 옮겨가는 순환의 질서이다.", "로마서 15:27(\"만일 이방인들이 그들의 영적인 것을 나누어 가졌으면 육신적인 것으로 그들을 섬기는 것이 마땅하니라\")은 은혜의 상호 호혜적 응답을 보여준다.", "바울 본문에서 은혜에 대한 '믿음의 순종'은 호혜 제도에 숭고한 마음으로 응답하는 고대의 윤리적 삶과 통한다."], "ans": [1, 2, 3, 4], "exp": "4개 지문 모두 최근 학계(엥베르크-페데르센, 슈넬레 등)에서 주목하는 고대 헬라-로마 사회의 호혜성(Charis/Grace) 문화와 로마서의 모금·은혜·믿음의 순종 간의 관계를 정확히 설명하고 있습니다.", "kind": "pos"}, {"id": 21, "book": "빌립보서", "sub": "", "tag": "", "n": 1, "stem": "빌립보서의 저자 및 진정성에 대한 설명으로 맞지 않는 것은?", "opts": ["빌립보서의 바울 저작설은 오늘날 성서학계 주석에서 거의 논란이 되지 않는 확고한 사실이다.", "19세기 멩엘(B. Mengel) 등 극소수 학자를 제외하고는 빌립보서의 바울 진정성이 보편적으로 인정받는다.", "2세기 마르키온 및 무라토리 경전 목록은 빌립보서를 바울 서신에서 전면 배격하고 위작으로 판정했다.", "빌립보서는 바울서신 중 사도적 권위를 강하게 내세우기보다 친밀한 우정과 감사, 파레네시스(권면)를 전달하는 성격이 강하다."], "ans": [3], "exp": "빌립보서의 바울 저작설은 마르키온 정경과 무라토리 경전 목록 등 초기 문서부터 확실하게 인정받았으며, 현대 주석학에서도 진정성이 의심받지 않는 친서입니다.", "kind": "neg"}, {"id": 22, "book": "빌립보서", "sub": "", "tag": "", "n": 2, "stem": "빌립보서의 투옥 장소(기록 장소) 논쟁과 학자들의 견해에 대한 설명으로 맞지 않는 것은?", "opts": ["다이스만(A. Deissmann), 보른캄, 곤닐카, 베커 등은 에베소 투옥설(Ephesian Imprisonment)을 제안했다.", "로메이어(E. Lohmeyer), 슈미트, 도드(C. H. Dodd) 등은 사도행전 28:30-31을 근거로 로마 투옥설(Roman Imprisonment)을 주장했다.", "슈넬레(U. Schnelle)는 에베소 투옥설이 역사적·문헌적으로 완전히 입증되었으므로 에베소를 유일한 기록 장소로 확정한다.", "가이사랴 투옥설(Caesarean Imprisonment)은 사도행전 23:34-35의 총독 관저 투옥 보도를 바탕으로 논의되기도 한다."], "ans": [3], "exp": "슈넬레는 에베소 투옥설의 여러 한계(에베소 장기 투옥에 대한 사도행전과 고린도후서의 침묵 등)를 지적하며, 전통적인 로마 투옥설(기원후 60년경)이 가장 큰 개연성을 가진다고 평가합니다.", "kind": "neg"}, {"id": 23, "book": "빌립보서", "sub": "", "tag": "", "n": 3, "stem": "빌립보서의 기록 장소를 '로마'로 보는 주요 근거 및 정황으로 올바른 것은?", "opts": ["빌립보서 1:13의 '시위대(praetorium/프라이토리온)'와 4:22의 '가이사의 집 사람들(familia Caesaris)' 언급은 로마 관저 정황을 잘 반영한다.", "사도행전 28:30-31의 로마 2년간 투옥 묘사는 빌립보서의 온전한 구금 상황 및 재판 대기 정황과 쉽게 조화된다.", "빌립보서에는 예루살렘 성도를 위한 모금(연보)에 대한 기록이 대대적으로 등장하며, 이는 에베소 사역 초기를 입증한다.", "빌립보서 1:21-24의 죽음과 삶 사이에서의 갈등 진술은 바울 사역의 끝자락(로마)에 위치함을 암시한다."], "ans": [1, 2, 4], "exp": "빌립보서에는 다른 주요 서신들과 달리 예루살렘 성도를 위한 모금(연보)에 대한 언급이 전혀 없으며, 이는 모금이 이미 완료된 바울 사역 말기(로마 투옥)임을 암시합니다.", "kind": "pos"}, {"id": 24, "book": "빌립보서", "sub": "", "tag": "", "n": 4, "stem": "빌립보(Philippi) 도시의 역사적·지정학적 배경에 대한 설명으로 맞지 않는 것은?", "opts": ["기원전 356년경 마게도냐의 필리포스 2세에 의해 건립되었으며, 테르마이코스만과 에그나티아 도로(Via Egnatia)상의 요충지였다.", "기원전 42년 로마의 퇴역 군인들이 정착하면서 '율리우스 아우구스투스 속령 빌립보(colonia Julia Augusta Philippensis)'라는 로마 군사 속령이 되었다.", "빌립보는 로마법의 특권(Ius Italicum)을 누리는 로마의 이탈리아 본토 식민도시처럼 발전했다.", "빌립보는 율법 준수를 강요하는 엄격한 유대교 단일 문화 도시였으며, 헬라·로마적 황제 숭배나 동양 제의는 일절 금지되었다."], "ans": [4], "exp": "빌립보는 퇴역군인 중심의 로마적 특성이 매우 강한 도시였으며, 로마 황제 숭배는 물론 트라키아 원주민의 토착 숭배와 이집트 신들(이시스, 세라피스)의 종교 혼합주의가 번성했던 곳입니다.", "kind": "neg"}, {"id": 25, "book": "빌립보서", "sub": "", "tag": "", "n": 5, "stem": "사도 바울의 유럽 최초 교회인 빌립보 교회의 창립 및 교인 구성으로 올바른 것은?", "opts": ["바울은 2차 선교여행 시기(기원후 49/50년경)에 유럽 최초의 교회로 빌립보 교회를 세웠다(행 16:11-12, 빌 4:15).", "교인의 대다수는 이방인 출신 그리스도인(자주장사 루디아, 유오디아, 순두게, 클레멘트 등)이었다.", "빌립보 교회는 바울의 사도권을 인정하지 않고 배척하여 바울과의 관계가 항상 극도로 악화되어 있었다.", "빌립보 교회는 바울의 선교 사역을 위해 여러 차례 물질적 후원과 선물을 보낸 우호적 관계를 유지했다(빌 4:15-18)."], "ans": [1, 2, 4], "exp": "빌립보 교회와 바울의 관계는 매우 좋았으며(빌 4:18), 바울은 그들의 후원과 선물에 대해 깊은 감사와 친밀한 우정을 표현했습니다.", "kind": "pos"}, {"id": 26, "book": "빌립보서", "sub": "", "tag": "", "n": 6, "stem": "빌립보서의 서신 서두(1:1-2) 및 서신 양식적 특징에 대한 설명으로 맞지 않는 것은?", "opts": ["인사말에서 바울의 공식 칭호인 '사도(apostolos)'라는 단어가 나오지 않는다.", "바울은 자신과 디모데를 \"예수 그리스도의 종(douloi Christou Iēsou)\"으로 겸손하게 소개한다.", "바울은 자신의 사도적 권위와 지위를 강력히 내세우며 빌립보 교인들에게 법적 명령조의 일방적 교서를 발송했다.", "빌립보서 1:7, 27, 2:12, 18, 24 등에서 나타나듯, 고대 우정서신(letter of friendship)의 전형적인 특징(\"함께 있다/떠나 있다\")을 반영한다."], "ans": [3], "exp": "바울은 빌립보서에서 사도로서의 권위를 내세우지 않으며, 교회를 친구로 대하고 고난을 공동의 구원 상태의 표시로 해석하는 전형적인 우정서신과 파레네시스 양식을 취합니다.", "kind": "neg"}, {"id": 27, "book": "빌립보서", "sub": "", "tag": "", "n": 7, "stem": "빌립보서의 내용 구성 및 본문 배치 구조에 대한 설명으로 맞지 않는 것은?", "opts": ["1:1-11 - 서신 서두(인사말 및 머리말/감사)", "1:12-30 - 바울 자신의 투옥 상황과 복음 전파 보도", "2:5-11 - 그리스도 찬가 (비하와 승귀)", "3:1-4:1 - 예루살렘 성전을 위한 모금 강요와 자급자족 노동의 전면 거부 선언"], "ans": [4], "exp": "빌립보서 3:1-4:1은 모금을 다루는 본문이 아니라, 거짓 교사들(유대주의 적대자들)에 대한 날카로운 논쟁과 경고를 담고 있는 본문입니다.", "kind": "neg"}, {"id": 28, "book": "빌립보서", "sub": "", "tag": "", "n": 8, "stem": "빌립보서의 문학적 통일성과 비평가들의 '서신 합성설(분할가설)'에 대한 설명으로 맞지 않는 것은?", "opts": ["보른캄(G. Bornkamm), 곤닐카, 베커 등은 빌립보서가 세 통의 독립된 편지(편지 A: 4:10-20, 편지 B: 1:1-3:1a, 편지 C: 3:1b-4:9)의 합성물이라고 주장했다.", "분할가설 학자들은 3:1과 3:2 사이의 갑작스러운 분위기 전환, 4:10-20 감사편지의 독자적 위치 등을 분할의 근거로 내세웠다.", "슐레이에르마허와 튀빙겐 학파 학자들은 빌립보서가 12개의 사도행전 단편을 복사해 붙인 정경 외경 편집물이라는데 완벽히 합의했다.", "슈넬레(U. Schnelle), 큄멜, 피, 왓슨 등은 신중한 수사학적 구조와 기쁨 모티프의 일관성을 근거로 빌립보서의 문학적 통일성을 옹호한다."], "ans": [3], "exp": "빌립보서의 분할가설은 세 통의 편지 모음 가설(보른캄 등)을 가리키며, 슈넬레를 비롯한 다수 현대 주석가들은 텍스트 전체의 수사학적·신학적 일관성을 바탕으로 단일한 서신 통일성을 강력히 증명합니다.", "kind": "neg"}, {"id": 29, "book": "빌립보서", "sub": "", "tag": "", "n": 9, "stem": "폴리카르포스의 빌립보교회 앞 서신(Phil 3:2)에 등장하는 문구와 통일성 논쟁으로 올바른 것은?", "opts": ["폴리카르포스는 빌립보서 3:2에서 바울이 \"부재중에 여러분에게 편지들(epistolas, 복수형)을 썼다\"라고 언급했다.", "합성설 반대 학자들은 폴리카르포스가 같은 서신 11:3에서 오직 단 한 편의 빌립보서(단수형)를 명시적으로 언급함을 들어 복수형 표현이 일반적 표현일 뿐이라고 해명한다.", "폴리카르포스의 서신은 빌립보서가 4세기 로마 공의회에서 비로소 완성된 외경 문서임을 확증했다.", "폴리카르포스는 바울의 빌립보서를 전면 배격하고 오직 마태복음만을 유일한 경전으로 인용했다."], "ans": [1, 2], "exp": "폴리카르포스의 빌립보서 3:2의 복수형 '편지들'은 분할가설의 근거로 쓰이기도 하지만, 11:3에서 단수로 바울의 편지를 지칭하므로 단일 서신의 존재를 부정하는 결정적 증거가 되지 못합니다.", "kind": "pos"}, {"id": 30, "book": "빌립보서", "sub": "", "tag": "", "n": 10, "stem": "빌립보서 2:6-11 '그리스도 찬가(Christ Hymn)'의 구조와 표현에 대한 설명으로 맞지 않는 것은?", "opts": ["로메이어(E. Lohmeyer)는 찬가를 각각 3행씩 6연으로 나누었으며, 예레미아스(J. Jeremias)는 세 부분(6-7a절, 7b-8절, 9-11절)으로 구분했다.", "2:6-8절은 선재자 그리스도의 비하와 십자가 죽음을, 2:9-11절은 하나님에 의한 높이심(승귀)과 주(Kyrios)로의 즉위를 선포한다.", "찬가 전체는 바울이 서신을 쓰던 당일에 빌립보 교인을 처형하기 위해 로마 법원에서 독창적으로 작성한 법정 판결문이다.", "찬가에는 '가장 높은 데까지 올리다(hyperypsoō)', '땅 밑의(katachthonios)', '약탈된 것(harpagmos)' 등 바울 친서에서 단 한 번만 나타나는 특수 어휘들이 집중된다."], "ans": [3], "exp": "빌립보서 2:6-11은 바울 이전에 최초 교회에 형성되어 예배 때 사용되던 그리스도 찬가 전승(Pre-Pauline Christ Hymn)을 바울이 인용하고 편집하여 권면의 근거로 제시한 것입니다.", "kind": "neg"}, {"id": 31, "book": "빌립보서", "sub": "", "tag": "", "n": 11, "stem": "빌립보서 2:5-11 그리스도 찬가의 신학적·윤리적 기능에 대한 설명으로 올바른 것은?", "opts": ["예수는 하나님의 본체이시나 하나님과 동등됨을 취할 것으로 여기지 아니하시고 오히려 자기를 비워 종의 형체를 가지셨다(빌 2:6-7).", "자기를 낮추시고 죽기까지 복종하셨으니 곧 십자가에 죽으심이라(빌 2:8).", "그리스도의 비하는 인간의 이기심과 자기 자랑을 정당화하고, 권력자들의 폭력을 옹호하기 위한 도구이다.", "찬가는 교회의 하나 됨과 연합을 위해 겸손과 이타적 봉사의 원형이자 모범(paradigm)으로 그리스도를 제시한다(빌 2:1-5)."], "ans": [1, 2, 4], "exp": "그리스도의 자기를 비움(케노시스)과 순종은 교회가 극복해야 할 이기심과 분쟁에 대한 반대 이미지이자, 성도들이 따라야 할 윤리적·구속사적 모범으로 작용합니다.", "kind": "pos"}, {"id": 32, "book": "빌립보서", "sub": "", "tag": "", "n": 12, "stem": "빌립보서 3:2-11에 나타난 적대자들의 특징과 바울의 공격으로 맞지 않는 것은?", "opts": ["바울은 적대자들을 향해 \"개들을 삼가고 행악하는 자들을 삼가고 손할례당을 삼가라\"라고 날카롭게 경고한다(빌 3:2).", "적대자들은 빌립보 교회에 침투하여 이방인 그리스도인들에게도 할례와 육체의 예법을 요구하던 유대주의 선교사들이었다.", "바울은 자신이 바리새인으로서 가졌던 과거의 혈통과 율법의 의를 완벽한 구원의 절대적 공로로 자랑했다.", "참된 할례파는 하나님의 성령으로 봉사하며 그리스도 예수를 자랑하고 육체를 신뢰하지 아니하는 우리이다(빌 3:3)."], "ans": [3], "exp": "바울은 3:4-9에서 자신이 육체를 신뢰할 만한 바리새인이자 율법의 의로는 흠이 없는 자였으나, 그리스도를 위하여 그 모든 것을 해(zēmia)로 여기고 배설물(skybala)로 여겼다고 선포합니다.", "kind": "neg"}, {"id": 33, "book": "빌립보서", "sub": "", "tag": "", "n": 13, "stem": "빌립보서 3:8-9의 '칭의론'과 그리스도를 아는 지식에 대한 설명으로 맞지 않는 것은?", "opts": ["내 주 그리스도 예수를 아는 지식이 가장 고상하기 때문에 모든 것을 해로 여긴다.", "그리스도를 얻고 그 안에서 발견되려 함이니 내가 가진 의는 율법에서 난 것이 아니다.", "오직 그리스도를 믿음으로 말미암은 것이니 곧 믿음으로 하나님께로부터 난 의이다(빌 3:9).", "바울은 빌립보서 3:9에서 갈라디아서나 로마서의 칭의론을 전면 철회하고 다시 모세 율법으로 돌아갈 것을 선언했다."], "ans": [4], "exp": "빌립보서 3:9의 \"믿음으로 하나님께로부터 난 의\"는 갈라디아서와 로마서에서 전개된 칭의론의 핵심과 완벽히 일치하며, 예수 그리스도만이 의의 자리임을 재확인합니다.", "kind": "neg"}, {"id": 34, "book": "빌립보서", "sub": "", "tag": "", "n": 14, "stem": "빌립보서 3:18-19의 '십자가의 원수들'과 열광주의적 성향으로 올바른 것은?", "opts": ["여러 사람들이 그리스도의 십자가의 원수로 행하며 그들의 마침은 멸망이다(빌 3:18-19a).", "그들의 신은 배(stomach)요 그 영광은 그들의 부끄러움에 있고 땅의 일을 생각하는 자라(빌 3:19b).", "바울은 '십자가의 원수들'을 예루살렘 공회의 경건한 성도들로 높여 부르며 그들의 방종을 모범으로 삼으라 명했다.", "이들은 육체적 실존으로부터 해방되었다고 착각하는 반자유주의적·열광주의적 헬레니즘 선교사들일 가능성이 높다."], "ans": [1, 2, 4], "exp": "빌립보서 3장에는 할례를 요구하는 유대주의적 공격과 함께, 몸의 구원을 경시하고 도덕적 방종에 빠진 열광주의적 '십자가의 원수들'에 대한 경고가 동시에 나타납니다.", "kind": "pos"}, {"id": 35, "book": "빌립보서", "sub": "", "tag": "", "n": 15, "stem": "빌립보서 3:20-21의 '하늘의 시민권(Politeuma)'과 정치·종말론적 의미로 맞지 않는 것은?", "opts": ["\"그러나 우리의 시민권(politeuma)은 하늘에 있는지라 거기로부터 구원하는 자 곧 주 예수 그리스도를 기다리노니\" (빌 3:20).", "'시민권(politeuma)' 개념은 로마 식민도시 빌립보에 거주하던 교인들의 법적·사회적 지위와 수사학적으로 직접 통한다.", "바울은 로마 황제만이 우주의 유일한 구원자(Sōtēr)이며, 그리스도인은 로마 황제 숭배 예전에 절대적으로 복종해야 한다고 가르쳤다.", "그리스도는 만물을 자기에게 복종하게 하실 수 있는 역사로 우리의 낮은 몸을 자기 영광의 몸의 형체와 같이 변하게 하실 것이다(빌 3:21)."], "ans": [3], "exp": "빌립보서 3:20은 로마 황제가 아닌 오직 주 예수 그리스도가 참된 '구원자(Sōtēr)'이시며, 성도들의 참된 정체성은 로마가 아닌 '하늘의 시민권'에 있음을 선포하는 대립적·변증적 진술입니다.", "kind": "neg"}, {"id": 36, "book": "빌립보서", "sub": "", "tag": "", "n": 16, "stem": "빌립보서의 핵심 주제인 '기쁨(Chara / Chairein)'의 신학적 성격에 대한 설명으로 맞지 않는 것은?", "opts": ["'주 안에서 기뻐하라(chairete en kyriō)'는 권면이 서신 전체에 반복되어 나타난다.", "빌립보서의 기쁨은 환경이나 감정에 좌우되는 일시적 기분이 아니라, 고난과 갈등 속에서도 보존되는 신앙적 실존이다.", "바울의 기쁨은 감옥에서 석방되어 대규모 재산을 모으고 세상적 성공을 거둔 데서 온 세속적 만족이다.", "바울은 복음이 전파되는 것 자체로 기뻐하고(1:18), 성도들의 믿음의 신실함과 연합을 통해 기뻐한다."], "ans": [3], "exp": "바울의 기쁨은 비참한 감옥 투옥과 임박한 죽음의 위협 속에서도 복음의 진보와 그리스도와의 연합, 그리고 성도들과의 구원적 교제에서 비롯되는 종말론적 기쁨입니다.", "kind": "neg"}, {"id": 37, "book": "빌립보서", "sub": "", "tag": "", "n": 17, "stem": "빌립보서 2:19-30에 등장하는 동역자 디모데와 에바브로디도에 대한 설명으로 올바른 것은?", "opts": ["디모데는 바울과 뜻을 같이하여 빌립보 교회의 사정을 진실히 살필 신실한 동역자로 파송이 예고된다(빌 2:19-22).", "에바브로디도는 빌립보 교회가 바울의 투옥을 돕기 위해 보낸 일꾼이자 전달자였다(빌 2:25, 4:18).", "에바브로디도는 바울의 헌금을 중간에서 도둑질하고 도망치다가 로마군에 의해 즉각 체포되었다.", "에바브로디도가 병들어 죽게 되었으나 하나님의 긍휼로 회복되었고, 바울은 교인들의 근심을 덜기 위해 그를 다시 돌려보낸다(빌 2:26-28)."], "ans": [1, 2, 4], "exp": "에바브로디도는 바울의 사역을 돕다가 죽을 고비를 넘길 정도로 충성한 바울의 형제요 함께 수고한 군사였으며, 바울은 그를 존귀히 여기라고 권면합니다.", "kind": "pos"}, {"id": 38, "book": "빌립보서", "sub": "", "tag": "", "n": 18, "stem": "빌립보서 4:2-3의 유오디아(Euodia)와 순두게(Syntyche) 갈등 조율에 대한 설명으로 맞지 않는 것은?", "opts": ["유오디아와 순두게는 빌립보 교회 안에서 복음을 위해 바울과 함께 힘쓰던 중요한 여성 동역자들이었다.", "바울은 그들에게 \"주 안에서 같은 마음을 품으라\"라고 호소한다(빌 4:2).", "바울은 유오디아와 순두게를 사이비 이단자로 규정하고 빌립보 교회에서 즉각 출교시킬 것을 명령했다.", "바울은 '참으로 한멍에를 멘 자(syzygos)'와 글레멘드에게 이 여성들을 돕고 화해시킬 것을 부탁한다(빌 4:3)."], "ans": [3], "exp": "유오디아와 순두게는 출교 대상 이단이 아니라 복음을 위해 사도와 함께 수고한 동역자들이었으며, 바울은 주 안에서 공동체의 일치와 화해를 도모할 것을 목회적으로 권면했습니다.", "kind": "neg"}, {"id": 39, "book": "빌립보서", "sub": "", "tag": "", "n": 19, "stem": "샤데(H. H. Schade)의 어휘 연구 및 정오표(교정)가 시사하는 빌립보서의 연대적 위치로 올바른 것은?", "opts": ["샤데는 롬 11:1과 빌 3:5의 '베냐민', 고후 11:22와 빌 3:5의 '히브리인', 고후 11:13과 빌 3:2의 '행하는 자(ergatēs)' 등 어휘의 빈도와 특징을 분석했다.", "이러한 언어적 특성은 빌립보서가 시간상 로마서 이후(바울 사역의 후기)로 분류되어야 한다는 사실을 가리킨다.", "샤데의 연구는 빌립보서가 바울의 회심 직후 30년대 초반에 가장 먼저 쓰여진 서신임을 입증했다.", "빌립보서의 어휘 분포는 갈라디아서나 데살로니가전서보다 훨씬 더 유대교 묵시록 원본과 정확히 일치한다."], "ans": [1, 2], "exp": "샤데(H. H. Schade)의 언어 분석은 빌립보서의 어휘 집합이 로마서 및 고린도후서 후반부와 사상적·언어적으로 매우 가깝게 연결되어 있음을 밝혀내어, 빌립보서의 늦은 기록 연대(로마 투옥설)를 지지합니다.", "kind": "pos"}, {"id": 40, "book": "빌립보서", "sub": "", "tag": "", "n": 20, "stem": "우도 슈넬레(U. Schnelle)가 요약한 빌립보서의 신학적 핵심 및 종합적 평가로 올바른 것은?", "opts": ["빌립보서는 바울 자신의 인격과 투옥 실존 안에서 그리스도교적 삶의 역설을 보여준다.", "고난 속에서도 선하게 역사하시는 하나님에 대한 신뢰와 기쁨이 서신 전체에 흐른다.", "빌립보서 2:5-11의 그리스도는 신앙의 원형이자 교회의 겸손과 일치를 위한 윤리적 모범이다.", "그리스도인은 땅의 일에 매이지 않고 하늘의 시민권을 가진 자로서 주 예수 그리스도의 재림과 몸의 변형을 소망한다."], "ans": [1, 2, 3, 4], "exp": "4개 지문 모두 우도 슈넬레가 제시한 빌립보서의 핵심 신학 주제(투옥 실존의 역설, 그리스도 찬가, 기쁨과 일치의 윤리, 하늘의 시민권과 부활 소망)를 바르게 설명하고 있습니다.", "kind": "pos"}, {"id": 41, "book": "빌레몬서", "sub": "", "tag": "", "n": 1, "stem": "빌레몬서의 저자, 진정성 및 외적 증언에 대한 설명으로 맞지 않는 것은?", "opts": ["19세기 F. Chr. 바우어(F. Chr. Baur) 등 일부 학자에 의해 의심받기도 했으나, 오늘날은 의심의 여지 없이 진정한 바울 서신으로 간주된다.", "빌레몬서는 사도 바울의 친서 중 가장 분량이 짧은 개별 서신이다.", "2세기 초 마르키온 정경목록과 무라토리 경전은 빌레몬서를 영지주의 이단 서신으로 분류하여 정경에서 전면 삭제했다.", "빌레몬서는 사적인 개인 편지의 형태를 띠면서도 동시에 가정교회라는 공동체적 지평을 포함하고 있다."], "ans": [3], "exp": "마르키온 정경목록과 무라토리 경전 목록 모두 빌레몬서를 진정한 바울 서신으로 수용하고 수록했습니다.", "kind": "neg"}, {"id": 42, "book": "빌레몬서", "sub": "", "tag": "", "n": 2, "stem": "빌레몬서의 기록 장소 및 시기에 대한 설명으로 맞지 않는 것은?", "opts": ["디모데 및 다른 동역자들이 함께 언급되어(1, 23-24절) 빌립보서와 가장 가까운 정황을 공유한다.", "9절에서 바울이 자신을 '나이가 많은 자(presbytēs)'로 칭하는 점은 바울 사역 후기(로마 투옥, 기원후 61년경)를 가리키는 주요 근거로 활용된다.", "슈툴마허, 로제, 그닐카, 람페 등 다수의 주석가들은 빌레몬서가 바울의 1차 선교여행 이전인 기원후 40년대 초반 아라비아 광야에서 쓰였다고 본다.", "19절의 이중적 표현과 분위기는 빌립보서보다 상황이 개선되었음을 암시하여 빌립보서 이후에 쓰여졌을 개연성을 가리킨다."], "ans": [3], "exp": "슈툴마허, 로제, 그닐카, 람페, 뮐러 등 다수의 주석가는 빌레몬서의 기록 장소를 에베소(기원후 53-55년경) 또는 로마(기원후 61년경)로 추정합니다.", "kind": "neg"}, {"id": 43, "book": "빌레몬서", "sub": "", "tag": "", "n": 3, "stem": "빌레몬서의 수신자 및 공동체 정황에 대한 설명으로 올바른 것은?", "opts": ["편지의 주요 수신자는 빌레몬이며, 바울은 그를 '형제' 및 '동역자(synergos)'로 부른다(1절).", "압비아와 아킵보, 그리고 빌레몬의 집에 모이는 가정교회가 공동 수신자로 명시된다(2절).", "빌레몬은 그리스도인이었고(5, 7절), 자신의 집을 예배 장소로 내놓은 점으로 보아 수공업이나 상업에 종사하던 중산층 성도였을 것이다.", "빌레몬, 압비아, 아킵보는 생물학적 친남매 관계임이 본문 2절에 명확히 기록되어 있다."], "ans": [1, 2, 3], "exp": "압비아와 아킵보가 빌레몬과 혈연관계인지는 본문상 단정할 수 없으며, 수신자 공동체 내의 중요한 동역자들로 제시됩니다.", "kind": "pos"}, {"id": 44, "book": "빌레몬서", "sub": "", "tag": "", "n": 4, "stem": "수신자 빌레몬의 거주지와 골로새서와의 관계에 대한 설명으로 맞지 않는 것은?", "opts": ["오네시모가 골로새 출신(골 4:9)으로 언급되는 점은 빌레몬의 거주지가 골로새임을 암시한다.", "빌레몬서 23-24절의 문안 인사자 명단(에파브라, 마가, 아리스다고, 데마, 누가)은 골로새서 4:10 이하의 명단과 거의 일치한다.", "빌레몬서 19b절에서 바울은 빌레몬에게 자신에게 \"빚진 것(opheileis)\"이 있다고 넌지시 언지한다.", "빌레몬은 예루살렘 공회의 대제사장 출신으로, 바울을 고발하기 위해 로마 법정에 직접 상소한 적대자였다."], "ans": [4], "exp": "빌레몬은 교회를 위해 적극적으로 봉사한 그리스도인이자 바울의 친밀한 동역자였습니다.", "kind": "neg"}, {"id": 45, "book": "빌레몬서", "sub": "", "tag": "", "n": 5, "stem": "오네시모(Onesimus)가 바울을 찾아온 경위 및 최근 학계의 가설에 대한 설명으로 맞지 않는 것은?", "opts": ["전통적 가설은 오네시모가 주인 빌레몬의 집에서 도둑질을 하거나 손실을 입히고 도망친 종(fugitivus)이라는 견해이다.", "람페(P. Lampe) 등은 오네시모가 주인과의 갈등 상황에서 중재를 받기 위해 상급 친구/후견인(amicus superior)인 바울을 찾아갔다는 가설을 제기했다.", "아르츠-그라브너(P. Arzt-Grabner)는 오네시모를 자발적으로 주인에게 돌아가고자 했던 '상습적 방랑자(Onesimus erro)'로 보기도 했다.", "오네시모는 로마 황제 네로의 친아들로서, 바울을 암살하기 위해 감옥에 기습 침투한 로마 비밀경찰이었다."], "ans": [4], "exp": "오네시모는 빌레몬의 종이었으며, 감옥에서 바울을 만나 회심하고 복음 사역을 돕게 된 인물입니다.", "kind": "neg"}, {"id": 46, "book": "빌레몬서", "sub": "", "tag": "", "n": 6, "stem": "빌레몬서 11절에 나타난 오네시모의 이름과 바울의 수사학적 언어유희에 대한 설명으로 올바른 것은?", "opts": ["'오네시모(Onēsimos)'라는 이름은 헬라어로 '유익한 자 / 쓸모 있는 자'라는 뜻을 지닌다.", "바울은 \"그가 전에는 네게 무익하였으나 이제는 나와 네게 유익하므로\"라고 언어유희(pun)를 사용한다.", "오네시모는 감옥에서 바울을 통해 그리스도교로 회심하여 바울의 영적 아들이 되었다(10절).", "언어유희를 통한 신분의 변화 강조는 빌레몬에게 오네시모를 용납하도록 유도하는 수사학적 장치이다."], "ans": [1, 2, 3, 4], "exp": "4개 지문 모두 오네시모의 이름 뜻, 11절의 언어유희, 회심 배경, 수사학적 의도를 바르게 설명하고 있습니다.", "kind": "pos"}, {"id": 47, "book": "빌레몬서", "sub": "", "tag": "", "n": 7, "stem": "람페(P. Lampe)와 슈넬레(U. Schnelle)가 정리한 바울의 빌레몬서 3가지 핵심 서신 목적 에 해당하지 않는 것은?", "opts": ["골로새 가정교회 내의 갈등이 해결되고 오네시모가 빌레몬에게 평화롭게 다시 받아들여지는 것", "오네시모가 장래에 빌레몬의 집과 가정교회에서 동등한 그리스도인 형제로 사는 것", "빌레몬이 오네시모를 감옥에 있는 바울에게 돌려보내 바울의 선교 사역을 섬기게 하는 것(13-14절)", "빌레몬의 전 재산을 몰수하여 로마 제국 당국에 국가 세금으로 전액 환수하게 하는 것"], "ans": [4], "exp": "바울의 서신 목적은 (1) 갈등의 평화적 해결, (2) 오네시모의 형제로서의 수용, (3) 바울의 사역을 위한 오네시모의 재파송 요청입니다.", "kind": "neg"}, {"id": 48, "book": "빌레몬서", "sub": "", "tag": "", "n": 8, "stem": "빌레몬서의 수사학적 장르 및 설득 전략에 대한 설명으로 맞지 않는 것은?", "opts": ["고대 수사학 양식상 빌레몬서는 추천서 및 청원/간청서(Gattung: Bittbrief / 추천서)의 형식을 띤다.", "바울은 4-7절의 머리말에서 청중에게 호감을 얻는 '친절한 포착(captatio benevolentiae)' 전략을 사용한다.", "바울은 파토스(감정), 에토스(품성), 로고스(이성)의 수사학적 논증을 적절히 결합하여 빌레몬을 설득한다.", "바울은 사도적 전권 명령만을 일방적으로 강요하고, 빌레몬의 자발적 동의나 호감 유발은 전면 배격했다."], "ans": [4], "exp": "바울은 사도적 명령(8절)을 행사할 수 있음에도 불구하고, 사랑으로서 간청하며(9절) 빌레몬의 자발적 동의(14, 21절)를 이끌어내는 수사학적 접근을 취합니다.", "kind": "neg"}, {"id": 49, "book": "빌레몬서", "sub": "", "tag": "", "n": 9, "stem": "고대 세계의 노예제도와 철학자들의 견해에 대한 설명으로 맞지 않는 것은?", "opts": ["고대 로마 제국에서 노예의 비율은 전체 인구의 약 25-50%에 달할 정도로 경제적·사회적 핵심 구조였다.", "플라톤과 아리스토텔레스는 노예제도를 경제적·자연적 이유로 당연하고 필요한 것으로 보았다.", "알렉산드리아의 필로(Philo)는 \"사람은 본성적으로 노예가 아니다\"라고 선언했다(SpecLeg II 69).", "스토아 철학자(에픽테토스, 세네카)들은 고대 로마의 법적 노예제도 전체를 완전 타도하기 위해 폭력 무장 투쟁을 선동했다."], "ans": [4], "exp": "스토아 철학자들은 노예제도의 외적 법적 테두리를 폭력으로 파괴하려 하지 않았으며, 진정한 노예 상태를 외적 신분이 아닌 내면의 욕망과 연결하여 설명했습니다.", "kind": "neg"}, {"id": 50, "book": "빌레몬서", "sub": "", "tag": "", "n": 10, "stem": "초기 그리스도교와 노예제도의 관계 및 빌레몬서의 신학적 위치에 대한 설명으로 올바른 것은?", "opts": ["세례 전승(갈 3:26-28, 고전 12:13)은 그리스도 안에서 노예와 자유인의 근본적 종교적 구분이 폐지되었음을 선포한다.", "고전 7:21-24에서 바울은 사회 구조의 급진적 정치 혁명보다는 그리스도 안에서의 내면적 자유와 일상의 신실함을 권면한다.", "빌레몬서는 고대 노예제도라는 사회 질서를 즉각 법적으로 전면 폐지하기보다, 교회 영역 안에서 법적 신분을 뛰어넘는 참된 '형제애'를 실현한다.", "빌레몬서의 가르침은 고대 사회의 지배 구조와 법적 관계를 무시하고 오네시모를 법적 주인으로 역전시킨다."], "ans": [1, 2, 3], "exp": "빌레몬서는 사회 질서의 즉각적·전면적 법적 폐지라기보다는, 교회 공동체라는 거점 안에서 '사랑받는 형제'로서의 새로운 실천적 관계를 성취해 냅니다.", "kind": "pos"}, {"id": 51, "book": "빌레몬서", "sub": "", "tag": "", "n": 11, "stem": "빌레몬서 16절에 선포된 오네시모의 새로운 신분적 지위에 대한 설명으로 맞지 않는 것은?", "opts": ["\"이 후로는 종과 같이 대하지 아니하고 종 이상으로 곧 사랑 받는 형제로 둘 자라\"", "바울은 오네시모를 \"육신과 주 안에서(kai en sarki kai en kyriō)\" 사랑받는 형제로 인정하라고 촉구한다.", "'육신 안에서'라는 표현은 오네시모와 빌레몬의 일상적·사회적 삶의 현실 속에서도 형제적 관계가 실현되어야 함을 뜻한다.", "바울은 오네시모를 빌레몬의 집에 돌려보낸 후, 빌레몬을 오네시모의 평생 법적 노예로 섬기도록 강제 매매 계약을 체결했다."], "ans": [4], "exp": "바울은 오네시모를 종 이상인 '사랑받는 형제'로 받아들일 것을 요구하였으며, 지배와 종속의 관계를 실천적 형제애로 대체시켰습니다.", "kind": "neg"}, {"id": 52, "book": "빌레몬서", "sub": "", "tag": "", "n": 12, "stem": "빌레몬서 8-9절, 19b절에 나타난 바울의 사도적 권위 행사 방식에 대한 설명으로 맞는 것은?", "opts": ["바울은 사도로서 담대하게 마땅한 일로 명할 수도 있으나, 사랑으로서 도리어 간구한다(8-9절).", "바울은 권위를 강력히 행사하기보다 사도적 직함의 압박을 내려놓음으로써, 빌레몬에게 인격적·자발적 책임을 지운다.", "19b절(\"네 자신이 내게 빚진 것은 내가 말하지 아니하노라\")은 은근하면서도 강력하게 빌레몬의 자발적 응답을 이끌어내는 수사학적 효과를 지닌다.", "바울은 직접적 명령 대신 자발성을 존중함으로써 자신의 목회적·신학적 영향을 더욱 깊이 있게 만든다."], "ans": [1, 2, 3, 4], "exp": "4개 지문 모두 바울이 사도적 권위를 사유화하지 않고, 사랑과 자발성에 근거하여 빌레몬의 결단을 이끌어내는 방식을 바르게 기술합니다.", "kind": "pos"}, {"id": 53, "book": "빌레몬서", "sub": "", "tag": "", "n": 13, "stem": "빌레몬서 18-19a절의 바울의 보증/대납 선언에 대한 설명으로 맞지 않는 것은?", "opts": ["\"그가 만일 네게 불의를 하였거나 네게 빚진 것이 있으면 그것을 내 앞으로 계산하라\" (18절)", "\"나 바울이 친필로 쓰노니 내가 갚으려니와\" (19a절)", "바울은 오네시모의 불의나 손실에 대해 자신이 직접 친필로 법적 보증 및 채무 대납을 선포한다.", "바울은 오네시모의 빚을 빌레몬이 아니라 로마 황제 네로의 국고에서 몰수하여 지불하도록 명령했다."], "ans": [4], "exp": "바울은 오네시모가 지은 빚이나 손실이 있다면 자신이 직접 갚겠다고 친필 서명으로 보증했습니다.", "kind": "neg"}, {"id": 54, "book": "빌레몬서", "sub": "", "tag": "", "n": 14, "stem": "구약 신명기 23:15-16(도망친 종 보호법)과 빌레몬서의 관계에 대한 설명으로 맞지 않는 것은?", "opts": ["신명기 23:15-16은 주인을 피하여 도망친 종을 주인에게 돌려보내지 말고 보호해 줄 것을 규정한다.", "바울이 오네시모를 주인 빌레몬에게 다시 돌려보내는 것은 신명기 23:15-16의 조항과 표면적 긴장 관계를 형성한다.", "바울은 오네시모를 처벌받는 종이 아니라 '사랑받는 형제'로 돌려보냄으로써 구약의 정신을 그리스도 안에서 재해석하고 승화시킨다.", "바울은 신명기 율법을 파기했다는 이유로 예루살렘 산헤드린 공회에 의해 즉시 사형 선고를 받았다."], "ans": [4], "exp": "바울의 조치는 구약 법안과의 표면적 차이에도 불구하고, 그리스도 안에서 종을 동등한 형제로 세우는 구속사적 성취를 보여줍니다.", "kind": "neg"}, {"id": 55, "book": "빌레몬서", "sub": "", "tag": "", "n": 15, "stem": "빌레몬서 22절의 방문 약속(\"오직 너는 나를 위하여 숙소를 서두르라\")과 헬레니즘 우정 서신의 특징에 대한 설명으로 올바른 것은?", "opts": ["22절의 방문 예고는 수신자 빌레몬으로 하여금 바울의 요구 사항을 신실하게 이행하도록 은근한 목회적 압박을 가하는 수사학적 장치이다.", "헬레니즘 우정의 편지에서 저자의 방문/재림(parousia) 모티프는 수신자에게 현재의 행동 변화를 촉구하는 기능을 한다.", "세네카(Ep. 40, 1) 등 고대 편지 문헌에서도 편지 저자의 현존과 방문 약속이 친밀함과 영향력을 강화하는 장치로 서술된다.", "바울은 숙소를 요청했으나 실제로 빌레몬의 집에 들어가지 않고 로마 황제의 궁전으로 거처를 옮겼다."], "ans": [1, 2, 3], "exp": "방문 모티프(22절)는 헬레니즘 우정 서신의 전형적인 요소로서, 수신자에게 사도의 오심을 선하게 준비하고 요구를 이행하게 만드는 정서적 동인입니다.", "kind": "pos"}, {"id": 56, "book": "빌레몬서", "sub": "", "tag": "", "n": 16, "stem": "오네시모와 에베소의 주교 오네시모(이그나티우스 서신 IgnEph 1:3, 2:1, 6:2) 동일 인물설에 대한 학자들의 평가로 맞지 않는 것은?", "opts": ["슈툴마허(P. Stuhlmacher)는 이그나티우스 서신에 등장하는 에베소 주교 오네시모가 빌레몬서의 오네시모와 동일 인물일 것으로 추정했다.", "이는 빌레몬이 오네시모를 용서하고 풀어주어 바울의 선교 사역을 돕게 한 결과로 해석되기도 한다.", "로제(E. Lohse)와 그닐카(J. Gnilka)는 '오네시모'라는 이름이 당대 흔한 종의 이름이었으 므로 동일 인물로 단정하기 어렵다고 지적했다.", "학계 전체는 이그나티우스 서신의 오네시모가 빌레몬서의 오네시모와 동일인임이 역사적 문서로 100% 완벽 입증되었다는데 동의한다."], "ans": [4], "exp": "흔한 이름이라는 이유로 동일 인물설에 대해 로제, 그닐카 등은 신중하거나 부정적인 입장을 취하고 있습니다.", "kind": "neg"}, {"id": 57, "book": "빌레몬서", "sub": "", "tag": "", "n": 17, "stem": "빌레몬서에 등장하는 가정교회(Hauskirche)의 조직적 특징 및 기능으로 올바른 것은?", "opts": ["빌레몬의 집, 브리스가와 아굴라의 집(고전 16:19, 롬 16:3-5) 등은 최초 그리스도교의 핵심 예배·선교 공간이었다.", "가정교회에서는 기도, 말씀 선포, 세례, 성찬식이 거행되었으며, 순회 선교사들에게 숙소가 제공되었다.", "가정교회는 고대 가부장적 질서를 뛰어넘어 그리스도 안에서 참된 평등과 신앙적 정체성을 살아내는 거점이었다.", "가정교회는 로마 제국의 황제 숭배 제단을 집안 한복판에 의무적으로 설치해야만 유지될 수 있었다."], "ans": [1, 2, 3], "exp": "가정교회는 외부의 적대적 환경 속에서도 신앙의 삶을 실천하고 신앙적 공동체를 형성하는 선교적 거점이었습니다.", "kind": "pos"}, {"id": 58, "book": "빌레몬서", "sub": "", "tag": "", "n": 18, "stem": "최근 연구에서 램페(P. Lampe), 볼터(M. Wolter), 아르츠-그라브너(P. Arzt-Grabner) 등의 법적·사회적 접근에 대한 설명으로 맞지 않는 것은?", "opts": ["램페는 오네시모의 탈출을 상급 친구(amicus superior)에 대한 정당한 중재 요청 프로세스로 해석했다.", "볼터(M. Wolter)는 빌레몬이 오네시모에게서 형제를 보아야 한다는 요구의 급진성이 법적 지위 변화 이상을 의미한다고 강조했다.", "아르츠-그라브너는 고대 파피루스 사료 비교를 통해 오네시모의 법적·사회적 정황을 규명하는 데 기여했다.", "이들 학자 모두 빌레몬서가 역사적 가치가 없는 순수한 영지주의 가짜 서간이라는데 합의했다."], "ans": [4], "exp": "이들 현대 학자들은 고대 파피루스 사료와 법적·사회적 맥락을 비교 분석하여 빌레몬서의 역사적·문학적 정황을 깊이 있게 규명했습니다.", "kind": "neg"}, {"id": 59, "book": "빌레몬서", "sub": "", "tag": "", "n": 19, "stem": "빌레몬서의 수사학적 구조에서 4-7절(머리말)과 8-16절(본문)의 연결에 대한 설명으로 올바른 것은?", "opts": ["4-7절의 머리말은 빌레몬의 사랑과 믿음, 성도들을 향한 기쁨을 격려하며, 이어지는 8-16절의 간청의 토대를 놓는다.", "7절의 \"성도들의 마음이 너로 말미암아 평안함을 얻었으니\"라는 진술은 20절의 \"내 마음이 그리스도 안에서 평안하게 하라\"라는 요구로 수미상응한다.", "바울은 빌레몬의 과거 선행을 칭찬함으로써, 오네시모를 향한 새로운 사랑의 실천으로 그 선행을 완성하도록 유도한다.", "이 세 지문 모두 올바른 설명이다."], "ans": [1, 2, 3, 4], "exp": "4개 지문 모두 빌레몬서의 머리말과 본문의 유기적·수사학적 연결 구조를 정확하게 설명하고 있습니다.", "kind": "pos"}, {"id": 60, "book": "빌레몬서", "sub": "", "tag": "", "n": 20, "stem": "우도 슈넬레(U. Schnelle)가 정리한 빌레몬서의 신학적 핵심 및 사회사적 의의로 올바른 것은?", "opts": ["빌레몬서는 그리스도교의 자유가 사회 질서의 즉각적·폭력적 철폐가 아니라, 교회 공동체 영역 안에서 구체적으로 실현됨을 보여준다.", "바울은 법적 주인과 노예 관계를 '육신과 주 안에서 사랑받는 형제'의 새로운 인격적 관계로 변화시킨다.", "사도는 신앙과 윤리가 분리될 수 없으며, 그리스도 안에서 받은 은혜가 삶의 구체적 관계 혁신으로 이어져야 함을 증언한다.", "빌레몬서는 노예제도를 온 우주의 영원무궁한 거룩한 법으로 정당화하고 축복하는 서신이다."], "ans": [1, 2, 3], "exp": "빌레몬서는 사회적 구속을 넘어 그리스도 안에서 서로를 사랑받는 형제로 고백하게 만드는 삶의 관계 혁신을 선포합니다.", "kind": "pos"}, {"id": 61, "book": "마가복음", "sub": "", "tag": "", "n": 1, "stem": "마가복음이 이전의 단락/수집록을 수용하여 복음서로 통합·편집한 것에 대한 설명으로 맞지 않는 것은?", "opts": ["마가복음 2:1-3:6의 논쟁사화 수집록은 이미 마가 이전 차원에서 구성되었을 가능성이 크다.", "마가복음 4:1-34의 비유 수집록과 10장의 교리문답적 수집록(결혼, 소유, 서열 다툼)은 마가가 복음서 구성에 활용한 대표적 단위이다.", "마가복음 3:6의 적대자들의 반응은 순수한 마가 이전의 '전승'으로만 구성되어 있으며 편집자의 개입이 전혀 배제되어 있다.", "복음서 기자는 더 큰 단위의 전승 복합체와 작은 설명들을 복음서라는 하나의 새로운 틀로 통합시켰다."], "ans": [3], "exp": "마가복음 3:6의 적대자들의 반응 단락에 대해 학계(Roloff, Pesch, Gnilka 등)는 순수 전승인지 편집인지 단정하기보다, 복음서 전체 구성에서 중심적 기능을 하도록 개정/편집된 것으로 평가합니다.", "kind": "neg"}, {"id": 62, "book": "마가복음", "sub": "", "tag": "", "n": 2, "stem": "필하우어(Ph. Vielhauer)가 제시한 마가복음의 종교사적 위치와 이에 대한 학계의 비판적 설명으로 맞지 않는 것은?", "opts": ["필하우어는 마가가 복음서를 고대 이집트의 왕위 즉위식 3단계(세례=신격화, 변모=천거, 십자가=실제 즉위식)와 유사하게 구성했다고 보았다.", "필하우어의 구조에 따르면 예수는 세례에서 십자가에 이르는 역사를 통해 종말론적 왕이자 우주의 통치자로 임명된다.", "최근 이집트학 연구(프리드리히, 노르덴 등)를 통해 고대 이집트 왕위 즉위식의 고정된 3단계 형태가 확고히 입증됨으로써 필하우어의 주장은 완전한 학술적 통설이 되었다.", "마가복음의 핵심 호칭인 '하나님의 아들'은 이집트 왕위 즉위식이 아니라 유대 지혜서(Wisdom of Solomon 2:13, 18)의 고난받는 의인 전통에서 유래한 것으로 해석된다."], "ans": [3], "exp": "고대 이집트 왕위 즉위식이 과연 고정된 세 단계 형태였는지 매우 의심스러우며, 프리드리히 등의 연구에 따라 필하우어가 언급한 노르덴(E. Norden)의 주장은 더 이상 지지받기 어렵습니다.", "kind": "neg"}, {"id": 63, "book": "마가복음", "sub": "", "tag": "", "n": 3, "stem": "위든(T. J. Weeden) 및 마르틴(R. P. Martin)의 '마가 공동체 갈등 정황 재구성'에 대한 슈넬레(U. Schnelle)의 평가로 맞지 않는 것은?", "opts": ["위든은 마가 공동체가 '신인(神人, theios anēr)' 그리스도론을 주장하는 대적자들(거짓 선지자들)과의 첨예한 논쟁 상황에 있었다고 주장했다.", "마르틴은 마가복음이 바울과 마찬가지로 율법 준수를 강조하는 유대주의자들과의 논쟁만을 담고 있다고 보았다.", "슈넬레는 마가복음 본문이 이러한 대적자들에 대해 전혀 언급하지 않으므로 종교사적·신학적 위치를 재구성하려는 시도가 회의적이라고 평가한다.", "제자들의 몰이해 모티프는 교회 안의 역사적 대적자들과 직접 관련지을 수 없다."], "ans": [2], "exp": "마르틴(R. P. Martin)은 마가가 고린도에서 바울의 대적자들과 마찬가지로 예수의 고난을 부인하는 '가현설적인 거짓 교사들'과 논쟁했다고 주장했습니다.", "kind": "neg"}, {"id": 64, "book": "마가복음", "sub": "", "tag": "", "n": 4, "stem": "마가복음의 신학적 기본 사상인 '제자도'와 '중개자 역할'에 대한 설명으로 옳은 것은?", "opts": ["마가복음은 세례에서부터 십자가에 이르는 예수 그리스도의 '길'에 대한 서술이며, 고난의 제자도로의 부름이다.", "제자들은 예수의 부름을 받고 그의 사역을 계승하기 위해 전권(exousia)을 부여받는 중개자 역할을 한다.", "제자들의 행함과 가르침을 위한 파송은 마가 공동체에 중요하지 않으며, 단지 예수의 지상 사역 당시에만 국한된 일회적 사건이다.", "제자들의 사역은 마가 공동체가 자신의 파송 기원을 인식하게 하며, 공동체의 파송이 예수의 행위를 합법적으로 계승함을 나타낸다."], "ans": [1, 2, 4], "exp": "제자들의 행함과 가르침을 위한 파송(막 6:6b-13)은 마가 공동체에서 매우 중요하며, 예수의 시기와 현재 마가 공동체 사이를 연결하는 결정적 계기가 됩니다.", "kind": "pos"}, {"id": 65, "book": "마가복음", "sub": "", "tag": "", "n": 5, "stem": "마가복음에서 '귀신들을 향한 침묵명령'과 '기적 요약'의 특징에 대한 설명이 아닌 것은?", "opts": ["마가복음 1:25의 침묵명령은 축귀사화 전승 유형에서 축귀의 한 방법으로 이해될 수 있다.", "마가복음 1:32-34, 3:7-12의 기적 요약에 나오는 귀신들을 향한 침묵명령은 편집적 요소로 간주된다.", "마가는 기적 행위만으로도 예수가 하나님의 아들 됨을 완벽하고 포괄적으로 인식하기에 충 분하다고 보았다.", "귀신들은 예수의 위격을 정확히 알고 있었으나(막 1:24, 3:11), 예수는 그들에게 침묵명령을 내리셨다."], "ans": [3], "exp": "마가는 이적행위에 근거하여 예수를 인식하는 것은 하나님의 아들 됨을 포괄적으로 이해하기에 충분하지 않으며, 여러 기적의 행사만으로는 예수를 완전한 하나님의 아들로 파악할 수 없다고 봅니다.", "kind": "neg"}, {"id": 66, "book": "마가복음", "sub": "", "tag": "", "n": 6, "stem": "마가복음의 '이적 금지명령'과 그 신학적 기능(프렌슈코프스키 등)에 대한 설명으로 맞지 않는 것은?", "opts": ["예수는 치유 사건이나 이적을 공개적으로 알리는 것을 금하셨으나(막 5:43a, 7:36a), 이 금지명령은 종종 위반되고 전파되었다(막 1:45, 7:36b).", "이적 금지명령은 예수가 행한 기적이 유대교와 헬라 세계에 전혀 알려지지 않도록 완전히 차단하는 데 성공했다.", "프렌슈코프스키(M. Frenchkowski)는 마가의 이적 금지 및 은폐 정황을 고대에 널리 퍼져 있던 '감추어진 현현(epiphany)' 모델로 분류했다.", "선포의 확장을 금하는 것은 이적에만 근거하여 예수의 신분을 성급히 규정하고 강탈하는 것을 막는 기능을 한다."], "ans": [2], "exp": "예수의 이적 금지명령에도 불구하고 치료받은 자나 목격자들에 의해 이적 사건이 계속 알려졌으며(막 1:45, 7:36b), 이는 기적 가운데 현현하는 예수의 신성을 오히려 가리키게 됩니다.", "kind": "neg"}, {"id": 67, "book": "마가복음", "sub": "", "tag": "", "n": 7, "stem": "마가복음 8:27~33의 '베드로의 고백'과 '제자들의 몰이해'에 대한 설명으로 올바른 것은?", "opts": ["마가복음 8:29 베드로의 고백은 제자들의 인식에 전환점이 되며, 예수가 메시아임을 자각하게 된다.", "베드로가 신앙고백을 한 직후 제자들은 예수의 수난과 십자가의 의미를 완벽하게 깨닫고 순종했다.", "마가복음 8:30의 침묵명령에서 예수는 오직 베드로 개인에게만 단독으로 침묵을 명령했다.", "예수의 위격에 대한 온전한 이해는 그의 존귀와 영광만으로 제한될 수 없으며, 수난을 배제할 수 없다."], "ans": [1, 4], "exp": "베드로의 고백 이후에도 첫 번째 수난 예고(막 8:31)와 베드로의 항변(8:32)에서 보듯 제자들의 오해와 몰이해가 계속 중첩됩니다. 또한 막 8:30의 침묵명령은 베드로 개인만이 아닌 복수형 '그들(autois)'에게 내려졌습니다.", "kind": "pos"}, {"id": 68, "book": "마가복음", "sub": "", "tag": "", "n": 8, "stem": "마가복음의 메시아 비밀이 지닌 '기한(성격)'과 부활의 관계에 대해 맞지 않는 설명은?", "opts": ["마가는 침묵명령의 기한을 예수의 부활까지로 규정했다(막 9:9).", "메시아 비밀은 부활 이후에도 영원히 제거되지 않으며, 제자들은 영원히 예수를 인식할 수 없게 된다.", "십자가와 부활에 이르러서야 비로소 예수 그리스도에 대한 제약 없는 인식이 가능해진다.", "브레데(W. Wrede)는 메시아 비밀론에 있어 마가복음 9:9의 근본적 중요성을 일찍이 파악했다."], "ans": [2], "exp": "마가는 침묵명령의 기한을 부활까지로 정했으며, 부활에서 예수의 위격에 대한 비밀이 비로소 제거된다고 서술합니다.", "kind": "neg"}, {"id": 69, "book": "마가복음", "sub": "", "tag": "", "n": 9, "stem": "마가복음에서 비밀이론 및 제자의 몰이해 모티프와 간접적 연관성을 맺는 '장소(공간)' 모티프와 본문 구절의 연결이 바르지 않은 것은?", "opts": ["집 (oikos, oikia) - 막 7:17, 9:28, 10:10", "배 (ploion) - 막 3:9, 6:32, 8:13", "성전 (hieron)의 대제사장 집무실 - 막 1:1, 2:1", "산 (oros) - 막 3:13, 6:46, 9:2"], "ans": [3], "exp": "마가복음에서 비밀 모티프와 연결되어 제자들과 따로 떨어져 가르침을 주거나 물러나는 장소로는 집(막 7:17, 9:28, 33, 10:10), 배(막 3:9, 6:32, 54, 8:13), 산(막 3:13, 6:46, 9:2, 13:3), 광야(막 1:35, 45, 6:31-32) 등이 제시됩니다.", "kind": "neg"}, {"id": 70, "book": "마가복음", "sub": "", "tag": "", "n": 10, "stem": "마가복음 4:10-12의 '비유이론'과 메시아 비밀의 관계에 대한 설명으로 맞는 것은?", "opts": ["마가 이전의 '비유이론' 핵심은 마가 비밀이론의 직접적인 구성 부분이 아니다.", "복음서 기자는 마가복음 4:13b 이하에서 비유이론을 교정하며 제자의 몰이해 모티프를 통해 비밀이론과의 간접적 연결점을 만든다.", "비밀사상은 유대인의 불신앙을 설명하기 위한 변증 이론이며 의식적인 완악함을 내포한다.", "마가복음의 비유이론은 예수의 위격에 대한 바른 이해와 전혀 무관하다."], "ans": [1, 2], "exp": "마가에게 비밀사상은 유대인의 불신앙을 설명하기 위한 변증 이론이 아니며 의식적 완악함을 내포하지도 않습니다. 오히려 비밀사상은 예수의 위격에 대한 바른 이해로 독자를 이끕니다.", "kind": "pos"}, {"id": 71, "book": "마가복음", "sub": "", "tag": "", "n": 11, "stem": "마가복음의 십자가 신학과 '하나님의 아들' 고백에 대한 설명으로 맞지 않는 것은?", "opts": ["마가복음에서 하나님과 귀신 외에 인간으로서 예수의 참된 본질(하나님의 아들)을 최초로 합당하게 고백한 인물은 십자가 아래의 백부장이다(막 15:39).", "마가복음 1:11(세례), 9:7(변모), 15:39(십자가)에 나오는 '하나님의 아들' 선언은 십자가 신학의 핵심 구성 요소이다.", "예수가 행한 기적들을 목격한 갈릴리 군중이 십자가 사건 이전에 가장 먼저 예수를 '하나님의 아들'로 합당하게 고백했다.", "세 번의 수난 예고(막 8:31, 9:31, 10:32-34)와 고난의 제자도에 관한 말씀은 마가 십자가 신학의 중요 요소이다."], "ans": [3], "exp": "이전 단락들에서는 오직 하나님(세례, 변모)과 귀신들만이 예수의 참된 본질을 알았으나, 인간 중에서는 십자가 아래의 백부장이 첫 번째로 예수의 위격을 합당하게 고백합니다.", "kind": "neg"}, {"id": 72, "book": "마가복음", "sub": "", "tag": "", "n": 12, "stem": "메시아 비밀 연구의 개척자인 브레데(W. Wrede)의 주장에 대한 설명으로 맞지 않는 것은?", "opts": ["브레데는 메시아 비밀 구상을 복음서 기자 마가가 독창적으로 순수 창작해 낸 것으로 보았다.", "브레데는 메시아 비밀이 비메시아적 예수의 생애와 부활 이후 공동체의 믿음 사이를 조화롭게 하려는 필요성에서 비롯되었다고 보았다.", "브레데는 메시아 비밀의 기원을 부활 이후 마가 이전 공동체의 활동으로 돌렸다.", "브레데의 연구 이후 메시아 비밀 주제는 마가복음 연구의 핵심 학술 논쟁으로 자리 잡았다."], "ans": [1], "exp": "브레데는 메시아 비밀을 복음서 기자 마가 개인의 창작으로 돌리지 않고, 부활 이전의 역사적 사실과 부활 이후 공동체의 믿음을 연결하려 한 '마가 이전 공동체'의 형성물로 보았습니다.", "kind": "neg"}, {"id": 73, "book": "마가복음", "sub": "", "tag": "", "n": 13, "stem": "레이제넨(H. Räisänen)의 메시아 비밀 비판 및 주장에 대한 설명으로 맞는 것은?", "opts": ["레이제넨은 비유이론과 메시아 비밀이 완벽한 통일성을 이루며 유기적으로 결합되어 있다고 보았다.", "레이제넨은 내적으로 결합된 모티프 가운데 오직 '귀신과 제자를 향한 침묵명령'만이 매우 긴밀하게 결합되어 진정한 메시아 비밀을 형성한다고 보았다.", "레이제넨은 마가복음 안에 체계적이고 통일된 전체적 신학 구조가 완벽하게 존재한다고 주장했다.", "레이제넨은 마가를 구체적인 논쟁에 끌어오는 역사화된 부차 개념으로서 비밀이론을 파악했다."], "ans": [2, 4], "exp": "레이제넨은 '비유이론'을 메시아 비밀과 완전히 분리했으며, 마가 비밀이론의 통일성에 대한 질문에 분명하게 부정적으로 답했습니다.", "kind": "pos"}, {"id": 74, "book": "마가복음", "sub": "", "tag": "", "n": 14, "stem": "베버(R. Weber)의 메시아 비밀 해석에 대한 설명으로 맞지 않는 것은?", "opts": ["베버는 페쉬나 레이제넨과 달리 마가의 비밀이론이 지니는 근본적인 의미와 통일성을 강조했다.", "베버는 \"이미 십자가와 부활 이전에 하나님의 아들이었음에도 예수는 하나님의 아들로서 적절하게 이해될 수 없었다\"라고 요약했다.", "베버는 마가복음 9:9의 침묵명령이 전승일 뿐이며 마가의 신학적 구상에 아무런 기여를 하지 않는다고 보았다.", "베버는 마가의 그리스도론이 지닌 전체적 구상을 긍정적으로 평가했다."], "ans": [3], "exp": "레이제넨과 페쉬가 막 9:9를 단순 전승으로 보고 비밀이론에 기여하지 않는다고 본 반면, 베버(R. Weber)는 마가 비밀이론의 근본적 의미와 통일성을 강하게 옹호했습니다.", "kind": "neg"}, {"id": 75, "book": "마가복음", "sub": "", "tag": "", "n": 15, "stem": "타이센(G. Theißen)이 제안한 메시아 비밀의 모티프와 기능에 대한 설명으로 옳은 것은?", "opts": ["타이센은 비밀 모티프에 실용적·보호적 기능을 부여했다.", "타이센에 따르면 예수는 비밀로 보호받는 기간 동안에도 끊임없이 십자가의 극심한 고통을 받아야만 했다.", "타이센은 모든 비밀 모티프의 중심에 놓인 위격의 비밀을 '권력의 비밀'로 정의했다.", "비밀의 보호로부터 벗어나자마자 예수는 수난을 맞이하게 되며, 이는 그리스도인들의 수난 정황과 상응한다."], "ans": [1, 4], "exp": "타이센은 비밀 모티프의 중심에 놓인 위격의 비밀을 '보호의 비밀'로 보았으며, 예수는 비밀로 보호를 받는 동안 고통을 겪을 필요가 없고 비밀에서 벗어나자마자 수난을 맞이한다고 추론했습니다.", "kind": "pos"}, {"id": 76, "book": "마가복음", "sub": "", "tag": "", "n": 16, "stem": "최근 마가복음 연구자들(죄딩, 브라이텐바흐)의 학술적 견해에 대한 설명으로 맞지 않는 것은?", "opts": ["죄딩(Th. Söding)은 마가가 복잡하고 긴장 가득했으나 신학적으로 탁월한 믿음 이해를 발전시켰다고 본다.", "죄딩에 따르면 믿음의 응답은 하나님을 향한 주저함 없는 신뢰이자 고백적 믿음이다.", "브라이텐바흐(C. Breytenbach)는 예수의 부활 이후에는 제자도 내러티브의 중요성이 완전히 사라지고 미래 기대만 남는다고 보았다.", "브라이텐바흐는 십자가에 달린 분 자신이 다시 오는 인자(Son of Man)로 기대됨을 강조했다."], "ans": [3], "exp": "브라이텐바흐는 제자도와 미래 기대 사이의 근본적 관련성을 강조하며, 예수의 부활 이후에도 제자도 내러티브가 범례적 중요성을 계속 유지한다고 보았습니다.", "kind": "neg"}, {"id": 77, "book": "마가복음", "sub": "", "tag": "", "n": 17, "stem": "숄티섹(K. Scholtissek)이 마가 그리스도론의 핵심 정체성으로 제시한 개념과 그 의미로 올바른 것은?", "opts": ["'사랑(agapē)' - 하나님의 인류를 향한 무조건적인 용서의 표현", "'권위/권세(exousia)' - 임박한 하나님 통치의 선포와 전달을 위한 하나님 아들의 메시아적 파송의 표현", "'지혜(sophia)' - 헬라 철학적 관상과 우주적 질서의 체계화", "'화해(katallagē)' - 사도적 직분의 합법성을 입증하는 율법적 개념"], "ans": [2], "exp": "숄티섹은 마가복음 편집의 핵심(막 1:22, 27, 2:10, 3:15, 6:7, 11:28 등)으로 '권위/권세(exousia)' 개념을 지목하고, 이를 임박한 하나님 통치의 선포와 전달을 위한 메시아적 파송으로 해석했습니다.", "kind": "pos"}, {"id": 78, "book": "마가복음", "sub": "", "tag": "", "n": 18, "stem": "말본(E. S. Malbon)이 마가복음의 내러티브 분석을 통해 구상한 5가지 그리스도론 유형에 포함되지 않는 것은?", "opts": ["투사 그리스도론 (projected Christology) - 화자와 다른 등장인물이 예수에 대해 말한 것", "편향 그리스도론 (deflected Christology) - 예수가 그에 대해 답변한 것", "굴절 그리스도론 (refracted Christology) - 예수가 자신과 하나님에 대해 말한 것", "실존 그리스도론 (existential Christology) - 독자가 자신의 삶에서 경험한 예수의 신성"], "ans": [4], "exp": "말본이 제시한 5가지 그리스도론은 투사 그리스도론, 편향 그리스도론, 굴절 그리스도론, 실행 그리스도론(enacted Christology), 반영 그리스도론(reflected Christology)입니다. '실존 그리스도론'은 포함되지 않습니다.", "kind": "neg"}, {"id": 79, "book": "마가복음", "sub": "", "tag": "", "n": 19, "stem": "최근 연구(로스캄, 윈, 에브너 등)에서 분석한 마가복음의 정치·사회적 맥락과 로마 제국의 이데올로기에 대한 설명으로 맞는 것은?", "opts": ["마가복음은 유대 전쟁 및 로마의 핍박 상황을 배경으로 기록된 변증문서적 성격을 가진다.", "마가복음의 시각장애인 치유 기사(막 8:22-26, 10:46-52)는 로마 황제 베스파시아누스의 시각장애인 치유 선전에 대응·경합하는 증거이다.", "마가복음은 로마 황제의 신적 출생과 권력을 칭송하며 플라비우스 왕가의 예전과 타협했다.", "침묵명령은 청중이 예수를 정치적 메시아로 오해하지 않도록 방지하는 기능을 한다."], "ans": [1, 2, 4], "exp": "마가복음은 로마 황제 베스파시아누스의 이데올로기에 대한 반대-복음(Evangelium contra Evangelium)이자 풍자와 논쟁으로 가득 찬 문서로서, 황제의 신적 출생과 전권 요구가 나사렛 예수를 통해 폐지됨을 선언합니다.", "kind": "pos"}, {"id": 80, "book": "마가복음", "sub": "", "tag": "", "n": 20, "stem": "베커(E.-M. Becker)의 문학 역사적 관점 및 도르마이어(D. Dormeyer)의 분석에 따른 마가복음의 성격으로 맞지 않는 것은?", "opts": ["베커는 마가복음을 고대 역사 사료 편찬의 틀에서 이해하며, 헬레니즘 제국 시대의 다원성(Pluriformität)과 장르의 혁신을 담고 있다고 보았다.", "도르마이어는 고대 철학적인 통치자 전기의 맥락에서 내러티브적·신학적 차원으로 마가복음을 해석했다.", "마가복음에서 '하나님의 왕적 통치' 개념은 오직 영적인 영역에만 국한되며, 로마의 독점적 통치 권력이나 가부장적 지배와는 아무런 접점이 없다.", "로마의 독점적 요구는 하나님의 왕적 통치가 시작되면서 폐지되고 봉사 직무로 다시 정의된다."], "ans": [3], "exp": "주요 개념인 '복음'과 '하나님의 왕적 통치'는 정치적인 영역도 표현합니다. 로마의 독점적 요구(가부장적 지배 Patrocinium)는 하나님의 왕적 통치가 시작되면서 폐지되고 봉사 직무로 재정의됩니다.", "kind": "neg"}, {"id": 81, "book": "마태복음", "sub": "", "tag": "", "n": 1, "stem": "파피아스(Papias)의 전승 및 마태복음 저자에 대한 설명으로 맞지 않는 것은?", "opts": ["파피아스는 마태가 히브리어(아람어) 방언으로 주님의 말씀을 모았으며, 각자 능력대로 이를 번역했다고 증언했다.", "에비온 복음서 단편과 2세기 초 복음서 제목들은 저자 전승의 오래됨을 확인해 준다.", "주의 제자 마태를 직접적 저자로 보는 견해에 반대하는 핵심 이유 중 하나는 지상 사역의 직접 목격자가 마가복음을 기초 자료로 사용했다는 점이다.", "학계에서는 복음서 저자 마태가 예루살렘의 랍비 학교 출신의 서기관임이 역사적으로 입증되었다고 판정한다."], "ans": [4], "exp": "루츠(U. Luz) 등 학자들은 저자가 랍비 교육을 받은 주석학자(서기관)라기보다는, 그리스어 감각과 회당 교육을 이수한 유대 그리스도교적 교사 및 서간 작성자로 보며, 지상 예수 사역의 직접 목격자로 단정하기 어렵다고 분석합니다.", "kind": "neg"}, {"id": 82, "book": "마태복음", "sub": "", "tag": "", "n": 2, "stem": "마태복음의 기록 장소 및 시기에 대한 설명으로 맞지 않는 것은?", "opts": ["마태복음 4:24의 '수리아' 언급과 이그나티우스 서신의 반영(IgnSm 1:1, IgnPhld 3:1)은 시리아 지역(안디옥 등)을 생성 장소로 가리킨다.", "마태복음 22:7, 21:41, 23:38 등은 예루살렘 성전 파괴(기원후 70년)를 전제로 기록되었음을 반영한다.", "이그나티우스의 복음서 지식(기원후 110년경)은 마태복음 작성을 위한 저작의 상한선(terminus ad quem) 역할을 한다.", "대다수 현대 신약학자들은 마태복음이 기원후 50년대 초반 사도 바울의 1차 선교 여행 이전에 저작되었다고 본다."], "ans": [4], "exp": "마태복음은 예루살렘 성전 파괴(기원후 70년)를 이미 지나온 사건으로 전제하며, 이그나티우스의 저술 시기 이전인 기원후 80~90년대 사이에 작성된 것으로 추정하는 것이 학계의 보편적 합의입니다.", "kind": "neg"}, {"id": 83, "book": "마태복음", "sub": "", "tag": "", "n": 3, "stem": "마태복음 수신자와 공동체 상황에 대한 설명으로 옳은 것은?", "opts": ["유대교와의 단절과 갈등이 심화되었으며, 이는 '그들의/너희들의 회당'(마 4:23, 9:35, 10:17)이라는 전형적인 언어적 표현에서 드러난다.", "마태 공동체는 유대교와의 단절 이후 안식일과 구약 성경 계명의 준수를 완전히 폐지하고 이방인 문화로 전면 전환했다.", "롤로프(J. Roloff)는 마태 공동체가 엄격한 유대 그리스도교 그룹과 카리스마적 순회 지도자 그룹 간의 두 개 논쟁 상황에 있었다고 분석했다.", "마태복음 10:18에 '이방인들에게도(kai tois ethnesin)'를 추가한 것은 복음서 기자가 선교를 보편적 개념으로 통합했음을 보여준다."], "ans": [1, 3, 4], "exp": "마태 공동체는 유대교 회당과 갈등을 겪었으나 율법이나 안식일(마 24:20)을 무시하지 않았으며, 오히려 토라의 완전한 성취와 더 나은 의를 강조했습니다.", "kind": "pos"}, {"id": 84, "book": "마태복음", "sub": "", "tag": "", "n": 4, "stem": "마태복음의 이방 선교 및 보편주의에 대한 설명으로 맞지 않는 것은?", "opts": ["마태복음 1:1-6의 족보에 언급된 여성들(다말, 룻, 라합, 우리야의 아내)은 모두 유대인이 아니라는 점에서 보편주의적 관점을 암시한다.", "동방 박사들의 경배(마 2:1-12)와 가버나움 백부장의 신앙(마 8:5-13)은 이방인이 하나님 나라 구원에 참여함을 예고한다.", "마태복음은 이방 선교를 지지하지만, 입문 예식으로서 토라의 핵심 관문인 할례(circumcision) 준수를 이방인 신자들에게 필수 조건으로 요구한다.", "마태복음 28:18-20의 선교명령(대위탁)은 '모든 민족'을 제자로 삼으라는 보편적 선교로 복음서를 결론짓는다."], "ans": [3], "exp": "마태복음에서는 할례(περιτομή) 논쟁 자체가 삭제되어 있으며, 할례가 아닌 세례와 가르침, 계명의 준수(마 28:19-20)가 그리스도교 입문 노선으로 제시됩니다.", "kind": "neg"}, {"id": 85, "book": "마태복음", "sub": "", "tag": "", "n": 5, "stem": "베이컨(B. W. Bacon)이 제시한 마태복음 구조와 5대 설교 블록에 대한 설명으로 맞지 않는 것은?", "opts": ["베이컨은 마태복음을 모세오경에 상응하는 '다섯 권의 책' 구조로 구획하여 이해했다.", "마태복음의 5대 설교는 산상수훈(5-7장), 파송설교(10장), 비유설교(13장), 공동체설교(18장), 종말설교(23-25장)로 구성된다.", "각 설교 블록의 종결부에는 \"예수가 이 말씀을 마치셨을 때...\"(마 7:28, 11:1, 13:53, 19:1, 26:1)라는 정형화된 종결 공식이 나타난다.", "5대 설교 중 10장(파송설교)과 18장(공동체설교), 13장(비유설교)은 오직 불신자 유대인 무리만을 직접적인 가르침의 대상으로 삼는다."], "ans": [4], "exp": "10장과 18장 설교는 오직 '제자들'만을 향하고 있으며, 13장 비유설교는 백성과 제자 모두를 향해 구성되어 있습니다.", "kind": "neg"}, {"id": 86, "book": "마태복음", "sub": "", "tag": "", "n": 6, "stem": "마태복음의 내러티브 구조에서 주요 구성 표지(Signal)와 전환점에 대한 설명으로 올바른 것은?", "opts": ["마태복음 4:17과 16:21은 \"이때로부터 예수께서... 비로소 나타내시니라\"라는 거시적 구성 표지로 기능한다.", "마태복음 4:17-16:20은 갈릴리와 그 주변에서 행해진 예수의 공적 사역과 가르침을 다룬다.", "마태복음 16:21-25:46은 예루살렘을 향한 예수의 여정과 사역 및 수난 예고를 다룬다.", "가이사랴 빌립보 베드로의 신앙고백(마 16:13-20) 직후 나오는 마태복음 16:21은 임박한 수난이라는 내러티브의 급격한 전환점을 명시한다."], "ans": [1, 2, 3, 4], "exp": "제시된 4개 지문 모두 마태복음의 거시적 구조 분석(마 4:17과 16:21을 중심으로 한 2대 단락 구분 및 베드로 고백 이후의 수난 전환)을 정확하게 설명하고 있습니다.", "kind": "pos"}, {"id": 87, "book": "마태복음", "sub": "", "tag": "", "n": 7, "stem": "마태복음의 거시적 차원에서 나타나는 '산(Mountain)-모티프'의 신학적 의미 및 구절 연결로 맞지 않는 것은?", "opts": ["마태복음 4:8 - 마귀의 유혹에 저항하는 장소", "마태복음 5:1 - 제자들과 무리에게 하나님 나라의 삶과 계명을 선포하는 대설교(산상수훈)의 장소", "마태복음 28:16-20 - 승귀하신 분으로서 제자들을 온 세상으로 파송하는 장소", "마태복음 14:23 - 예수가 로마 황제를 타도하기 위해 정치적 군대를 집결시킨 군사적 거점 장소"], "ans": [4], "exp": "마태복음에서 '산'은 기도하는 장소(마 14:23, 6:46), 유혹 저항(4:8), 대설교(5:1), 변모(17:1), 파송(28:16)의 장소이며, 정치적 군사 거점으로 묘사되지 않습니다.", "kind": "neg"}, {"id": 88, "book": "마태복음", "sub": "", "tag": "", "n": 8, "stem": "마태복음 결론부(마 28:16-20)의 선교명령과 보좌 즉위에 대한 설명으로 맞지 않는 것은?", "opts": ["부활하신 예수의 현현과 만물의 통치자로서의 보좌 즉위는 전체 복음서의 방향이자 신학적 소실점(Fluchtpunkt)이다.", "부활을 통해 예수에게 부여된 '권세(exousia)'는 하늘과 땅의 모든 보편적 권세를 의미한다.", "\"내가 세상 끝날까지 너희와 항상 함께 있으리라\"는 약속은 마태복음 1:23의 '임마누엘' 모티프와 연결되어 수미상응(Inclusio)을 이룬다.", "마태복음 28:19b의 삼위일체적 세례 공식은 지상 예수의 공생애 사역 초기에 이미 완성되어 사용되던 역사적 문구이다."], "ans": [4], "exp": "28:19b의 세례 형식(\"아버지와 아들과 성령의 이름으로\")은 부활 이후 마태 공동체에서 실제로 실행되던 세례 행위와 신앙고백을 반영한 복음서 기자의 편집적 표현입니다.", "kind": "neg"}, {"id": 89, "book": "마태복음", "sub": "", "tag": "", "n": 9, "stem": "마태복음의 율법 이해 및 산상수훈의 반대명제(마 5:21-48)에 대한 설명으로 맞지 않는 것은?", "opts": ["예수는 율법의 폐지가 아니라 성취(plerōsai)를 선포한다(마 5:17-20).", "첫 번째 반대명제(마 5:21-26)는 살인 금지 계명을 분노와 욕설까지 확장하여 토라 계명을 급진화한다.", "예수가 사용하는 '권위(exousia)'는 유효한 계명을 무효화하는 것이 아니라 참된 하나님의 뜻을 유효하게 한다.", "마태복음에서 율법의 성취는 구약성서에 표현된 구절들을 문자 그대로 수정 없이 되풀이하는 단순 반복을 뜻한다."], "ans": [4], "exp": "율법의 성취는 구약 단어의 단순 반복이 아니라, 예수의 전권과 권위 있는 해석을 통해 율법의 본의를 사랑의 계명과 더 나은 의로 완성하는 것을 의미합니다.", "kind": "neg"}, {"id": 90, "book": "마태복음", "sub": "", "tag": "", "n": 10, "stem": "마태 윤리의 핵심 개념인 '의(Dikaiosynē)'와 '더 나은 의'(마 5:20)에 대한 설명으로 옳은 것은?", "opts": ["'더 나은 의'는 바리새인과 서기관들의 외식적 의를 능가하여 하늘나라에 들어가기 위한 전제 조건이다.", "마태에게 '의'는 관념적 추상이 아니라 하나님의 뜻을 행함(Orthopraxia)과 구체적인 윤리적 실천으로 드러난다.", "마태복음 5:48의 \"하늘에 계신 너희 아버지의 온전하심과 같이 너희도 온전하라\"는 온전함(teleios)의 요구와 직접 연결된다.", "마태의 '의' 개념은 예수의 권위 및 구원 선포와 완전히 분리된 인간 고유의 자력 구원론을 의미한다."], "ans": [1, 2, 3], "exp": "마태의 '의'는 자력 구원이 아니며, 전권을 지닌 예수의 가르침과 은혜적 부름(구원의 직설법)에 근거하여 응답하는 제자도의 윤리적 행동입니다.", "kind": "pos"}, {"id": 91, "book": "마태복음", "sub": "", "tag": "", "n": 11, "stem": "마태복음에서 율법 이해의 총체로 제시되는 사랑의 계명과 황금률에 대한 설명으로 맞지 않는 것은?", "opts": ["마태복음 7:12의 황금률(\"남에게 대접을 받고자 하는 대로 너희도 남을 대접하라\")은 율법과 선지자의 요약이다.", "마태복음 22:37-40의 사랑의 이중계명(하나님 사랑, 이웃 사랑)은 온 율법과 선지자의 강령이다.", "원수 사랑의 절대적 계명(마 5:43-48)은 당대의 장벽을 넘어 온전한 사랑과 의로움 안에 하나님의 참된 뜻이 있음을 강조한다.", "마태는 사랑의 계명을 강조하기 위해 긍휼(호세아 6:6)이나 정의의 요구를 율법 준수 항목에서 완전히 제외시켰다."], "ans": [4], "exp": "마태에게 율법 준수는 개별 규칙을 기계적으로 지키는 것이 아니라 긍휼(마 9:13, 12:7)과 정의, 사랑을 행하는 것이며, 호세아 6:6(\"나는 인애를 원하고 제사를 원하지 아니하노라\")을 핵심 구절로 인용합니다.", "kind": "neg"}, {"id": 92, "book": "마태복음", "sub": "", "tag": "", "n": 12, "stem": "마태복음 16:17-19의 베드로 신앙고백과 교회론에 대한 설명으로 맞지 않는 것은?", "opts": ["예수는 베드로의 고백(\"주는 그리스도시요 살아계신 하나님의 아들이시니이다\") 위에 자신의 교회를 세우겠다고 선언한다.", "베드로에게 부여된 '매고 푸는 권세(binding and loosing)'는 마태복음 18:18에서 전체 공동체에도 확장 적용된다.", "베드로는 마태복음에서 완벽한 믿음만 소유하며, 어떠한 의심이나 오해, 실족도 겪지 않는 비역사적 인물로 고정된다.", "마태복음은 신약성서 4대 복음서 중 '교회(ekklēsia)'라는 단어를 직접 명시(마 16:18, 18:17)하는 유일한 복음서이다."], "ans": [3], "exp": "베드로는 첫 번째 사도이자 대변자이지만, 물 위를 걸을 때 의심하거나(마 14:28-31) 예수의 수난을 막아서다 책망받는 등 믿음과 의심의 올바른 관계를 보여주는 범례적 인물로 서술됩니다.", "kind": "neg"}, {"id": 93, "book": "마태복음", "sub": "", "tag": "", "n": 13, "stem": "마태복음의 심판 사상 및 공동체 성격(Corpus Permixtum)에 대한 설명으로 옳은 것은?", "opts": ["마태 공동체는 의인과 불의한 자가 세상 속에서 함께 존재하는 '혼합체(corpus permixtum)'로 서술된다.", "알곡과 가라지 비유(마 13:24-30, 36-43)와 그물 비유(마 13:47-50)는 종말 심판 때까지의 공존과 종말론적 분리를 보여준다.", "혼인 잔치 예복 비유(마 22:1-14)에서 택함을 입은 자는 선한 행실과 의를 입증한 사람이다.", "마태복음 25:31-46의 인자의 세상 심판은 구체적인 행위의 기준(지극히 작은 자 하나에게 한 것)에 따라 의인과 악인을 구분한다."], "ans": [1, 2, 3, 4], "exp": "4개 지문 모두 마태복음의 심판론과 '혼합체(corpus permixtum)'로서의 교회 이해, 종말론적 깨어있음의 요구를 정확히 가리키고 있습니다.", "kind": "pos"}, {"id": 94, "book": "마태복음", "sub": "", "tag": "", "n": 14, "stem": "마태복음 7:15, 24:11 등에 나타나는 '거짓 선지자들'과 대적자들에 대한 설명으로 맞지 않는 것은?", "opts": ["복음서 기자는 '거짓 선지자들'을 주의하라고 경고하며, 그들의 열매로 그들을 평가하라고 가르친다.", "거짓 선지자들의 신학적 주요 폐단은 마태가 강력히 비판하는 '불법(anomia)'이다.", "바르트(G. Barth) 등 다수의 학자들은 이들을 대체로 헬라적 반율법주의자(Antinomians)로 해석했다.", "마태복음 본문은 이 거짓 선지자들이 바울 서신을 모조리 위조한 구체적 모임이었음을 명확히 실명으로 기록하고 있다."], "ans": [4], "exp": "대적자들의 신학적 프로필은 본문상 여전히 불분명하며, 대체로 헬라적 반율법주의자로 추정될 뿐 실명이나 위조자 모임으로 명시되지 않습니다.", "kind": "neg"}, {"id": 95, "book": "마태복음", "sub": "", "tag": "", "n": 15, "stem": "마태복음의 특징적인 '숙고 인용문(Reflexionszitate / 성취 인용문)'에 대한 설명으로 맞지 않는 것은?", "opts": ["\"이는 선지자로 말씀하신 바 ... 이루려 하심이라\"라는 도입 문구 구조를 갖는다.", "숙고 인용문은 마태복음의 구속사를 '약속-성취(Promise-Fulfillment)' 모델에 따라 해석한다.", "슈트레커(G. Strecker)는 마태가 그리스도교 증언 수집록(Testimoniensammlung)을 사용했다고 주장했다.", "루츠(U. Luz)는 숙고 인용문이 정경 복음서가 완성된 지 수백 년이 지난 후 외경 저자들에 의해 삽입된 후대의 완전한 가짜 구절이라고 입증했다."], "ans": [4], "exp": "루츠(U. Luz)는 숙고 인용문을 정경 이전의 자유롭고 유동적인 본문 형태 및 구전/문서 전승으로 이해하며, 복음서 기자의 의도적인 편집적 배치를 강조합니다.", "kind": "neg"}, {"id": 96, "book": "마태복음", "sub": "", "tag": "", "n": 16, "stem": "마태복음 5대 설교의 종말론적 결론과 구조에 대한 설명으로 맞지 않는 것은?", "opts": ["5개의 대설교는 거의 동일하게 종말론적 심판에 대한 경고와 전망으로 종결된다.", "산상수훈(마 7:21-27)은 반석 위에 집을 지은 지혜로운 사람과 모래 위에 지은 어리석은 사람의 심판 비유로 끝난다.", "파송설교(마 10:40-42)와 공동체설교(마 18:23-35) 역시 상급과 무자비한 심판에 대한 경고로 구성된다.", "종말설교(24-25장)는 예루살렘 성전의 영원한 물리적 불멸과 로마 제국의 무한한 정복을 축복하며 결론을 맺는다."], "ans": [4], "exp": "종말설교(24-25장)는 성전 파괴 예언, 인자의 오심, 깨어있음 권면, 그리고 양과 염소를 구분하는 인자의 세상 심판(마 25:31-46)으로 결론을 맺습니다.", "kind": "neg"}, {"id": 97, "book": "마태복음", "sub": "", "tag": "", "n": 17, "stem": "마태복음 학자들의 최근 연구 경향(이방 그리스도교적 편집설 vs 유대 그리스도교적 전통설)에 대한 설명으로 맞지 않는 것은?", "opts": ["트릴링(W. Trilling), 슈트레커(G. Strecker), 워커(R. Walker), 마이어(J. P. Meier)는 마태복음의 최종 편집자를 이방 그리스도인으로 본다.", "슈트레커는 마태 신학에서 최종 편집과 전승을 분리할 때 유대 그리스도교적 입장은 수정된 전승에 국한된다고 주장했다.", "보른캄(G. Bornkamm), 훔멜(R. Hummel), 루츠(U. Luz)는 마태복음이 유대교 내부와의 논쟁 상황 및 유대 그리스도교적 바탕을 지닌다고 본다.", "콘라트(M. Konradt)는 마태복음의 보편적 이방 선교가 이스라엘 선교의 완전히 독립된 무관함에서 나왔다고 보며 아브라함 전통과의 연결성을 전면 부정했다."], "ans": [4], "exp": "콘라트(M. Konradt)는 보편적 선교가 단순히 이스라엘 선교의 실패/거절 때문만이 아니라, 아브라함 자녀됨의 모티프와 모든 민족을 향한 약속의 수용 및 실현 때문이라고 강조합니다.", "kind": "neg"}, {"id": 98, "book": "마태복음", "sub": "", "tag": "", "n": 18, "stem": "산상수훈(마 5-7장) 해석과 최근 연구 경향(베츠, 에커트, 타이센 등)에 대한 설명으로 올바른 것은?", "opts": ["베츠(H. D. Betz)는 산상수훈을 마태 이전의 유대 그리스도교적 구성으로 보는 반면, 대다수 주석가는 마태의 신학적 구성으로 본다.", "에커트(J. Eckert)는 산상수훈의 윤리적 급진주의를 임박한 하나님 나라를 앞두고 하나님의 뜻에 자신을 내맡기는 호소로 이해한다.", "타이센(G. Theißen)은 마태복음에서 정치 권력이 윤리로 변형되고, 윤리적 계명을 통한 세계 통치라는 새로운 방식이 제시된다고 본다.", "루츠(U. Luz)는 산상수훈이 오직 기원후 1세기 팔레스타인 농경 사회의 특정 세금 면제자들에게만 한정 적용된 특수 법전이라고 비판했다."], "ans": [1, 2, 3], "exp": "루츠(U. Luz)는 산상수훈을 특정 세금 면제자용 특수 법전으로 국한하지 않고, 예수의 첫 대설교이자 교회의 구속력 있는 윤리적 지침으로 깊이 있게 조명합니다.", "kind": "pos"}, {"id": 99, "book": "마태복음", "sub": "", "tag": "", "n": 19, "stem": "킹스베리(J. D. Kingsbury) 및 내러티브 분석에 대한 설명으로 맞지 않는 것은?", "opts": ["킹스베리는 마태복음의 구상을 '내적 원칙'에 따라 이스라엘 및 그 지도자들과의 논쟁사로 설명했다.", "마태복음 내러티브에서 주요 호칭 중 하나인 '하나님의 아들'은 예수의 정체성을 드러내는 핵심 타이틀이다.", "프랑케묄레(H. Frankemölle)는 마태가 이야기와 설교의 단일체로 자신의 신학을 설계한 내러티브 신학의 대표자라고 강조했다.", "킹스베리는 마태복음이 문학적·내러티브적 구조를 전혀 갖추지 못한 단편들의 무작위 수집품에 불과하다고 폄하했다."], "ans": [4], "exp": "킹스베리는 마태복음을 스토리(Story)와 내러티브 분석의 관점에서 연구하여 복음서 전체의 정교한 문학적·신학적 통일성을 규명했습니다.", "kind": "neg"}, {"id": 100, "book": "마태복음", "sub": "", "tag": "", "n": 20, "stem": "마태 윤리와 실천적 구속력에 대한 설명으로 올바른 것은?", "opts": ["마태 윤리의 핵심 특징은 예수가 선포한 하나님 통치의 복음에 대한 인간의 책임과 '하나님의 뜻을 행함'이다.", "구약성서의 계명과 새 계명은 마태에게 모순되지 않고 예수 그리스도의 권위 안에서 통일성을 갖는다.", "마태는 은혜와 구원의 직설법(Gospel)을 완전히 배제하고, 오직 율법적 명령법(Law)만을 독단적으로 강조했다.", "'작은 자들'(마 10:42, 18:6, 25:40)에 대한 실천과 긍휼의 사랑 능력은 마태 제자도의 중요한 구체적 표지이다."], "ans": [1, 2, 4], "exp": "마태는 구원의 직설법(마 5:1-12, 28:19-20)을 결코 간과하지 않으며, 구원의 은혜(직설법)와 계명 이행(명령법)의 상호 관련성을 강하게 유지합니다.", "kind": "pos"}, {"id": 101, "book": "누가복음", "sub": "최근 연구", "tag": "핵심 출제", "n": 1, "stem": "최근 누가복음 연구 경향에서 '최근 연구가 다시 묻는 세 가지' 핵심 쟁점과 그 신학적 방향에 대한 설명으로 맞지 않는 것은?", "opts": ["시대 구분: 이스라엘·예수·교회의 시대를 얼마나 분리할 수 있는가에 대해, 최근 연구는 콘첼만의 단절적 3시대설보다 예수와 교회의 구속사적 연속성을 강조한다.", "공동체: 박해와 제도보다 복음 전승과 윤리가 더 중요하며, 누가가 파루시아를 재해석할 뿐 사도적 승계나 계급적 직제(초기 공교회주의)에는 관심이 없었다고 본다.", "이스라엘: 이방 선교는 유대인의 거절로 인해 구약의 이스라엘을 완전히 폐기하고 대체(Replacement)한 것이며, '이스라엘의 시대'는 요한과 함께 완전히 종결되었다고 본다.", "종합적 시각: 최근 누가복음 연구는 구원사의 '단절'보다 '연속성'을 더 주의 깊게 살피는 경향을 보인다."], "ans": [3], "exp": "최근 연구(볼터, 뢰닝 등)에 따르면 이방 선교는 이스라엘의 '대체'가 아니라 하나님의 구원 약속에 따른 '연속'이며, \"이스라엘의 시대는 지금도 끝나지 않았다\"라고 봅니다. 구원은 처음부터 유대인과 이방인 모두에게 동등하게 열려 있었습니다.", "kind": "neg"}, {"id": 102, "book": "누가복음", "sub": "최근 연구", "tag": "최근 연구 쟁점 1", "n": 2, "stem": "콘첼만(H. Conzelmann)의 구원사적 '세 시대(이스라엘-시간의 중심-교회)' 구분에 대해 최근 연구자들(슈나이더, 뢰닝, 볼터 등)이 제기한 비판으로 맞지 않는 것은?", "opts": ["콘첼만은 눅 4:13(시험 후 떠난 사탄)과 22:3(유다에게 들어간 사탄)에 주목하여 지상 예수의 시대를 '사탄에게서 벗어난 시대'로 특징지었다.", "슈나이더(G. Schneider)는 누가복음 16:16을 시대를 자르는 절대적 경계로 볼 수 없으며, 예수의 사역과 교회의 선교가 매우 긴밀하게 결합된다고 보았다.", "볼터(M. Wolter)는 누가복음 내러티브에서 예수의 시대가 이스라엘의 역사와 완전히 단절 된 별개의 이방 제국의 역사로만 존재한다고 주장했다.", "승천 사건(눅 24:47-51, 행 1:9-11)은 예수의 시대와 교회의 시대를 분리하는 장벽이 아니라, 세계 선교와 성령 약속을 통해 두 시대를 이어주는 연속성의 고리이다."], "ans": [3], "exp": "뢰닝과 볼터는 누가복음의 모든 사건이 이스라엘의 역사에 속하며, 예수의 등장과 교회의 역사를 이스라엘 주제와 분리할 수 없다고 보았습니다.", "kind": "neg"}, {"id": 103, "book": "누가복음", "sub": "최근 연구", "tag": "최근 연구 쟁점 2", "n": 3, "stem": "케제만(E. Käsemann) 등이 제기한 '초기 공교회주의' 비난에 대해 최근 학계가 이를 부적절하다고 반박하는 근거로 올바른 것은?", "opts": ["누가는 파루시아(재림) 표상을 폐기한 것이 아니라, 역사 속에서 교회가 지속되어야 하는 존재 이유와 윤리적 삶을 신학적으로 해석한 것이다.", "누가는 사도적 승계(Apostolic Succession)나 계급적 직제 완성에 관심이 없으며, 장로/직분자의 임명은 성령의 주도와 연결된다(행 14:23, 20:28).", "누가는 사도행전 20장에서 교황 권제와 대제사장적 직제를 최초 교회의 절대적 구원 요건으로 공식 제정했다.", "누가의 윤리는 선행과 내세의 보상 사이의 관계를 반영하며, 심판 사상은 공동체의 깨어있음을 촉구하는 권면의 모티프로 작용한다."], "ans": [1, 2, 4], "exp": "누가는 사도적 승계나 계급적 조직에 관심이 없었으며, 사도행전 20:28에서도 직분자의 임명은 성령과 연결되어 있습니다. 따라서 '초기 공교회주의'라는 비난은 누가 신학의 고유성을 파악하는 데 적절하지 않습니다.", "kind": "pos"}, {"id": 104, "book": "누가복음", "sub": "최근 연구", "tag": "최근 연구 쟁점 3", "n": 4, "stem": "누가복음-사도행전에 나타난 '이스라엘과의 관계' 및 보편적 이방 선교에 대한 설명으로 맞지 않는 것은?", "opts": ["이방 선교는 이스라엘의 구원사적 실패에 대한 우연한 대안일 뿐이며, 구약 성서의 약속과는 완전히 차단된 신종 종교의 창설이다.", "하나님의 구원은 태초부터 유대인과 이방인에게 동등하게 적용되는 구원사적 연속성을 지닌다.", "태너힐(R. C. Tannehill)과 바서베르크(G. Wasserberg)는 누가복음-사도행전이 그 자체로 완결된 하나의 통일적 내러티브(Narrative Unity)라고 강조한다.", "벤데만(R. v. Bendemann)은 이스라엘 다수가 복음의 초대를 거절한 정황 속에서도 누가가 유대교를 향한 그리스도교의 새로운 길(행 9:2, 24:14)을 제시한다고 보았다."], "ans": [1], "exp": "누가는 이방 선교가 구약의 이스라엘 약속(아브라함 언약, 예언서)의 성취이며, 이방인이 구원으로 인도되어 참된 이스라엘의 일부가 되는 구속사적 연속성을 보여줍니다.", "kind": "neg"}, {"id": 105, "book": "누가복음", "sub": "", "tag": "", "n": 1, "stem": "누가복음 저자 전승과 고대 교부들의 증언에 대한 설명으로 맞지 않는 것은?", "opts": ["기원후 180년경 리용의 이레네우스는 사도행전의 '우리가'-구절(행 16:10-17 등)을 근거로 누가를 바울의 수행원 및 동역자로 보았다.", "무라토리 경전(기원후 200년경)은 누가가 의사이며 그리스도의 승천 이후 바울이 학문적으로 교육받은 그를 영입했다고 기술한다.", "마르키온(기원후 140년경)은 누가복음을 전면 배격하고 마태복음을 자신의 유일한 '복음서'로 채택했다.", "소위 반(反)마르키온적 복음서 서문은 누가를 안디옥 출신의 시리아인이자 의사, 미혼으로 84세에 비오티엔에서 성령 충만하여 죽었다고 전한다."], "ans": [3], "exp": "마르키온(기원후 140년경)은 누가복음을 삭제하고 수정하여 자신의 '복음서'를 얻었다고 전해지며, 마태복음이 아니라 누가복음을 자신의 정경적 기반으로 삼았습니다.", "kind": "neg"}, {"id": 106, "book": "누가복음", "sub": "", "tag": "", "n": 2, "stem": "누가복음-사도행전 저자가 바울의 직접적 수행원이 아니었음을 가리키는 서신과 사도행전 간의 불일치 정황으로 맞지 않는 것은?", "opts": ["사도행전은 바울의 예루살렘 방문을 다섯 번 언급하는 반면, 바울 서신(갈라디아서 등)은 세 번만 언급한다.", "사도행전 16:3에서 바울은 유대인을 고려해 디모데에게 할례를 행한 반면, 갈라디아서 2:3에서는 디도가 할례받지 않은 것을 강조한다.", "사도행전 14:4, 14에서는 바울과 바나바에게 '사도' 칭호를 사용하지만, 바울 서신 전체에서 바울은 자신을 '사도'로 부르는 것을 전면 거부했다.", "사도행전 20:17, 28에서 바울의 밀레도 설교는 장로/감독 직분을 언급하지만, 진정성 있는 바울 서신에서 장로(presbyteros) 개념은 등장하지 않는다."], "ans": [3], "exp": "바울은 그의 서신(고전 9:1-2, 갈 1:1, 2:8 등)에서 자신의 사도직을 지속적으로 강조하고 변호했습니다. 반면 사도행전에서 누가는 사도 칭호를 열두 제자로 제한하려는 경 향이 강합니다(행 14:4, 14 전승은 예외적).", "kind": "neg"}, {"id": 107, "book": "누가복음", "sub": "", "tag": "", "n": 3, "stem": "누가복음 저자의 학식 및 출신 배경에 대한 설명으로 올바른 것은?", "opts": ["칠십인역(LXX)에 대한 친숙함과 성문서, 율법서, 예언서에 대한 관심은 저자의 유대적 환경을 보여준다.", "누가는 셈어적 개념을 피하고, '랍오니' 대신 '주여(kyrie)', '라비' 대신 '에피스타테스(epistatēs)' 등 그리스어로 대체했다.", "마태복음과 마찬가지로 다윗과 아브라함에서 시작하는 족보를 통해 유대주의적 배타성을 수용했다.", "예전 문제(마가복음 7:1-23의 손 씻기 논쟁 생략)에 무관심하거나 셈어 단어를 대치한 점은 이방 그리스도교적/디아스포라 환경을 암시한다."], "ans": [1, 2, 4], "exp": "누가의 족보(눅 3:38)는 마태복음과 달리 아브라함에서 멈추지 않고 '아담'을 거쳐 하나님에게까지 거꾸로 올라감으로써 보편주의적 관점을 제시합니다.", "kind": "pos"}, {"id": 108, "book": "누가복음", "sub": "", "tag": "", "n": 4, "stem": "누가복음의 저작 시기와 정황에 대한 설명으로 맞지 않는 것은?", "opts": ["누가는 마가복음과 Q 자료를 수용하여 저술 활동을 펼쳤다.", "누가복음 21:24(참조 13:35)는 기원후 70년 예루살렘의 멸망과 성전 파괴를 이미 돌아보는 시점에서 기록되었음을 반영한다.", "사도행전 20:25, 28:31 등은 바울의 죽음을 전제하며, 누가는 구원사의 시대를 설명하려는 제3세대 관점에서 작성했다.", "슈넬레(U. Schnelle)를 비롯한 현대 학계는 누가복음의 저작 시기가 기원후 50년대 초반 사도 바울의 생존 당시로 확정되었다고 본다."], "ans": [4], "exp": "누가가 구원사의 시대 설명에 관심이 있었던 최초 그리스도교의 제3세대 관점에서 쓰고 있으므로, 누가복음의 시기는 기원후 80~90년경(혹은 90년경)으로 설정됩니다.", "kind": "neg"}, {"id": 109, "book": "누가복음", "sub": "", "tag": "", "n": 5, "stem": "누가복음의 수신자와 저자의 언어적 특징에 대한 설명으로 맞지 않는 것은?", "opts": ["누가는 헌정사(눅 1:1-4)에서 복음서를 '매우 존경하는 데오빌로'에게 바친다.", "누가는 대부분 이방 그리스도인 교회를 목표 독자로 삼아 율법으로부터 자유로운 이방 선교를 전제한다.", "셈어 용어인 '아바 아버지(abba o patēr)'는 '아버지(patēr)'로, '가나안인(Kananaios)'은 '젤롯당(zēlōtēs)'으로 번역·대체했다.", "마가복음의 '글로리아(영광)' 선언과 마태복음의 '할례' 구절을 원형 그대로 대량 수용하여 셈어적 색채를 극대화했다."], "ans": [4], "exp": "누가는 팔레스타인 지역 밖의 이방 그리스도인 독자층을 위해 셈어적 개념을 피하거나 그리스어로 대체하였으며, 팔레스타인적 특성이 지배적인 본문들을 의도적으로 개정·생략했습니다.", "kind": "neg"}, {"id": 110, "book": "누가복음", "sub": "", "tag": "", "n": 6, "stem": "누가복음의 내용 구성과 구조에 대한 설명으로 올바른 것은?", "opts": ["서문(1:1-4)에 이어 예수의 탄생과 유년기 역사(1:5-2:52)를 앞부분에 배치함으로써 복음서 양식의 전기적 요소를 확장했다.", "마가복음 10장의 짧은 예루살렘 상경 길을 복음서 전체의 3분의 1에 달하는 '여행 보도(눅 9:51-19:27)'로 크게 확장시켰다.", "예루살렘을 향한 예수의 여행(9:51)은 단순한 지리적 이동일 뿐 신학적 의미는 전혀 갖고 있지 않다.", "여행 보도에는 제자도와 선교(9:51-13:21), 잃은 자들의 구원(13:22-17:10), 제자도와 종말론(17:11-19:27) 등의 특수자료와 Q 전승이 통합되어 있다."], "ans": [1, 2, 4], "exp": "누가복음 9:51에서 시작하는 예루살렘 여행은 지리적 이동을 넘어 수난과 부활, 승천을 향하는 신학적으로 독립되고 결정적인 단락입니다.", "kind": "pos"}, {"id": 111, "book": "누가복음", "sub": "", "tag": "", "n": 7, "stem": "누가가 역사 사료 편찬 전통과 연결되어 사용한 전문 용어 및 문학적 특징으로 맞지 않는 것은?", "opts": ["누가는 서문(눅 1:1-4)에서 복음서 기자 중 유일하게 서문 문필가로서 문학적 포부와 신학적 의도를 분명하게 언급한다.", "누가가 사용한 '사건들(pragmata)'과 '이야기/보도(diēgēsis)'는 당대 고대 역사 사료 편찬의 전문 용어이다.", "시간적 일치(눅 1:5, 2:1, 3:1 등)와 날짜 기록을 통해 구원사를 뚜렷한 시기로 나누는 역사 편찬 방식을 보여준다.", "누가는 역사적 연대기 작성을 거부하고 허구적 신화 양식만을 전면 채택함으로써 로마 사학자 살루스트(Sallust)의 정반대 노선을 걸었다."], "ans": [4], "exp": "누가는 완벽함과 정확성, 견고함을 위해 노력하며 고대의 역사 사료 편찬 전통과 연결되며, 로마 역사가 살루스트(Sallust)의 역사책과 유사한 구조적 평행을 보여줍니다.", "kind": "neg"}, {"id": 112, "book": "누가복음", "sub": "", "tag": "", "n": 8, "stem": "누가복음의 파루시아(재림) 이해와 종말론에 대한 설명으로 맞지 않는 것은?", "opts": ["누가는 파루시아의 지연을 구원사적 구상으로 극복하고 시간의 연장을 받아들였다.", "누가는 나사렛 첫 설교(눅 4:16-30)와 므나 비유(눅 19:11-27) 등을 도입하여 파루시아 기대가 즉각 성취되는 것이 아님을 명시했다.", "누가는 재림의 불확실한 시간을 인내하며(눅 8:15) 깨어 있을 것(눅 12:35 이하)을 호소한다.", "파루시아의 지연으로 인해 누가는 하나님 나라의 통치 선포와 모든 윤리적 경고를 완전히 철회했다."], "ans": [4], "exp": "누가가 임박한 파루시아를 포기한 것이 아니라, 게으름과 배교의 위험이 도사리고 있는 공동체 상황에서 그리스도의 도래 및 심판을 윤리적 훈계와 결합하고 있습니다.", "kind": "neg"}, {"id": 113, "book": "누가복음", "sub": "", "tag": "", "n": 9, "stem": "누가복음의 재물 및 사회윤리(부와 가난)에 대한 설명으로 올바른 것은?", "opts": ["누가는 돈과 소유물을 올바로 사용하는 것을 윤리의 중심 문제로 발전시켰다(눅 3:11, 12:13-15 등).", "누가는 부유한 자들의 독선과 탐욕을 비판하며, 그리스도를 따르는 제자도와 소유에 대한 거리를 연결시킨다(눅 14:33).", "누가는 부자들에게 무조건적 절멸을 선언할 뿐, 그리스도교 공동체 안에서 가난한 자를 위한 자발적 사랑과 구제(자선)를 결코 권면하지 않았다.", "사도행전 2:45, 4:32, 20:35(\"주는 것이 받는 것보다 더 복이 있다\") 등은 누가 공동체가 지향한 사랑의 공동체적 특성을 요약한다."], "ans": [1, 2, 4], "exp": "누가는 사랑의 공동체를 실현하기 위해 소유를 포기하고 자발적인 자선을 베풀며 궁핍한 자들을 돕는 재산 사용을 강조했습니다.", "kind": "pos"}, {"id": 114, "book": "누가복음", "sub": "", "tag": "", "n": 10, "stem": "누가복음의 가난한 자와 부자에 대한 학자들의 평가(호른 등)로 맞지 않는 것은?", "opts": ["내세에 상황을 역전시킬 것을 선포한 에비온파 전승(눅 1:46-55, 6:20-26, 16:19-26)이 누가복음에서는 현재 인간에게 돌이켜 회개하라는 호소가 되었다.", "호른(F. W. Horn)은 누가를 단순히 '부유한 자들의 복음서 기자'나 '가난한 자들의 복음서 기자'로 단면적 규정하기보다 '교회 공동체의 복음서 기자'로 보았다.", "누가의 목표는 부자에 대한 타협 없는 비판에 그치지 않고, 공동체 안에서 가난한 자와 부자 사이의 사랑의 공동체를 실현하는 것이다.", "누가는 최초 그리스도교 공동체의 소유 포기 모범을 배격하고, 로마 귀족층의 무제한적 사치와 과잉 축재를 그리스도인의 미덕으로 칭송했다."], "ans": [4], "exp": "누가는 예수의 제자들과 최초 그리스도교 공동체의 소유 포기를 모범으로 삼았으며, 무조건적인 제자도와 사랑의 실천이 공동체에 구현되어야 함을 역설했습니다.", "kind": "neg"}, {"id": 115, "book": "누가복음", "sub": "", "tag": "", "n": 11, "stem": "누가복음-사도행전에 나타난 '국가와 교회'의 관계에 대한 설명으로 맞지 않는 것은?", "opts": ["로마 총독 빌라도는 예수의 무죄를 세 번 확인하고 석방을 주장한다(눅 23:4, 14-15, 22).", "예수를 죽음에 이르게 한 주된 책임은 유대인들에게 있는 것으로 묘사된다.", "바울은 합법적인 로마 시민으로 표현되며(행 22:25 이하), 로마 행정당국으로부터 국가적 위협 요소가 아님이 증명된다.", "누가는 로마 제국 황제를 하나님과 동등한 신으로 숭배할 것을 권고하며, 사도행전 5:29(\"사람보다 하나님께 순종해야 한다\")의 말씀을 삭제했다."], "ans": [4], "exp": "누가는 로마 행정당국에 충성하고 국가에 위협이 되지 않음을 변증하면서도, 비판적 정황(눅 3:19, 13:32-33)을 마다하지 않으며 사도행전 5:29에서 \"사람보다 하나님께 순종해야 한다\"라고 분명히 밝힙니다.", "kind": "neg"}, {"id": 116, "book": "누가복음", "sub": "", "tag": "", "n": 12, "stem": "콘첼만(H. Conzelmann)이 주장한 누가복음 구속사의 '세 단계(3시대)' 구분에 대한 설명으로 맞지 않는 것은?", "opts": ["첫 번째 시대는 '율법과 예언자의 시대'로서 세례 요한까지의 이스라엘의 시대이다(눅 16:16).", "두 번째 시대는 '시간의 중심(Mitte der Zeit)'으로서 예수의 지상 사역 시대이다.", "세 번째 시대는 성령의 시대로서 '교회의 시대'이다.", "콘첼만에 따르면 예수의 지상 사역 시대(시간의 중심)에도 사탄이 온 세상을 지속적으로 지배하며 예수의 사역을 전면 통제했다."], "ans": [4], "exp": "콘첼만은 예수가 사탄의 시험을 받은 후 떠났다가(눅 4:13) 유다의 배신 때 비로소 다시 등장한 것(눅 22:3)에 주목하여, 예수의 시대를 '사탄으로부터 벗어난 시대(satansfreie Zeit)'로 특징지었습니다.", "kind": "neg"}, {"id": 117, "book": "누가복음", "sub": "", "tag": "", "n": 13, "stem": "콘첼만의 엄격한 3시대 구분에 대한 최근 학자들의 비판적 설명으로 옳은 것은?", "opts": ["슈나이더(G. Schneider)는 누가의 구원사적 설명이 예수의 시대와 교회의 시대를 단절시키지 않고 매우 긴밀하게 결합한다고 강조했다.", "뢰닝(K. Löning)은 누가복음 사건 모두가 이스라엘의 역사에 속하며 이스라엘 시대와 분리될 수 없다고 보았다.", "볼터(M. Wolter)는 이스라엘 시대가 요한으로 완전히 끝나버려 교회 시대와 아무런 연관이 없음을 입증했다고 단언했다.", "누가복음 16:16을 구원 역사를 단칼에 잘라내는 절대적 경계로 이해하는 것에 대해 현대 주석가들은 문제를 제기한다."], "ans": [1, 2, 4], "exp": "볼터(M. Wolter)는 이스라엘 시대가 요한까지로 끝나버리는 것이 아니라 '예수의 시간'과 '교회의 시간'으로 계속 이어지며 현재에도 끝나지 않았다고 강조합니다.", "kind": "pos"}, {"id": 118, "book": "누가복음", "sub": "", "tag": "", "n": 14, "stem": "누가복음-사도행전의 성령론에 대한 설명으로 맞지 않는 것은?", "opts": ["예수는 성령으로 태어나시고(눅 1:35), 세례 때 성령을 받으시며(눅 3:22), 성령에 이끌려 사역하신다(눅 4:1, 14).", "나사렛 회당 설교(눅 4:18)에서 \"주의 성령이 내게 임하셨으니\"라는 예언의 성취를 선포한다.", "세례자 요한에 의해 전해진 예수의 '성령 세례' 약속은 오순절 사건 및 제자들의 파송을 통해 성취된다.", "누가는 성령의 역사가 오직 지상 예수의 생애 동안에만 작동하고 부활 이후 교회 선교 역사에서는 완전히 소멸되었다고 가르친다."], "ans": [4], "exp": "누가에게 성령은 예수의 사역을 교회에서 지속시키고, 역사 속에서 하나님의 구원 행동의 연속성을 이어가는 선교 역사의 실제 주체입니다.", "kind": "neg"}, {"id": 119, "book": "누가복음", "sub": "", "tag": "", "n": 15, "stem": "누가 신학에 제기된 '초기 공교회주의(Frühkatholizismus)' 비난과 이에 대한 비판적 이해로 맞지 않는 것은?", "opts": ["케제만(E. Käsemann), 필하우어(Ph. Vielhauer), 슐츠(S. Schulz) 등은 누가가 파루시아 기대를 포기하고 제도적 직제와 구원사를 강조함으로써 '초기 공교회주의'에 빠졌다고 비판했다.", "누가는 사도적 승계(apostolic succession)에 압도적인 관심을 기울이며 사도행전 20장 계급적 직제 완성을 신학의 최우선 목표로 두었다.", "누가는 선행과 내세의 보상 사이 관계를 알고 있으며, 심판 사상이 권면의 모티프로 작용한다.", "누가는 구원사적 개념으로 파루시아 표상을 폐기한 것이 아니라, 역사 속에서 교회가 지속되어야 하는 존재 이유를 신학적으로 해석한 것이다."], "ans": [2], "exp": "누가는 전승의 지속적 전달에 초점을 두지만 사도적 승계에는 관심이 없으며, 사도행전 20:17-38에서도 직분자의 임명은 성령과 연결되어 있을 뿐 계급적 직제 자체에 큰 관심을 두지 않습니다.", "kind": "neg"}, {"id": 120, "book": "누가복음", "sub": "", "tag": "", "n": 16, "stem": "네베(G. Nebe)가 부각시킨 누가복음의 그리스도론적 특징으로 가장 적절한 것은?", "opts": ["사제적 그리스도론", "예언자적(Prophetic) 그리스도론", "묵시적 군사 그리스도론", "영지주의적 신인(theios anēr) 그리스도론"], "ans": [2], "exp": "네베(G. Nebe)는 누가의 예수상(눅 4:16-30, 7:16, 39, 9:7-8, 19, 24:19-21 등)에서 예언자적(Prophetic) 특징을 부각시켰습니다.", "kind": "pos"}, {"id": 121, "book": "누가복음", "sub": "", "tag": "", "n": 17, "stem": "최근 누가복음의 사회역사적 정황 및 박해 이해(슈테게만, 보르만 등)에 대한 설명으로 맞지 않는 것은?", "opts": ["슈미탈스(W. Schmithals)는 박해 상황이 누가의 이중 저작을 이해하기 위한 중요한 구성 요소라고 보았다.", "슈테게만(W. Stegemann)은 디아스포라 회당과 누가 그리스도교 사이의 관계가 전면적 체포·처형이 아니라 '거리두기' 개념으로 파악된다고 본다.", "보르만(L. Bormann)은 누가가 외부의 시선을 받아들여 로마와 그리스-헬레니즘 세계의 독자들에게 예수 전승을 개방했다고 본다.", "누가는 로마 제국 전체가 그리스도인을 학살하기 위해 조직적으로 국가 총동원령을 내린 첨예한 대박해 상황만을 문서 기록의 유일한 전제로 삼았다."], "ans": [4], "exp": "누가는 첨예한 대박해 상황을 전제하지 않으며, 오히려 유대공회와 로마 행정당국 사이의 긴장 관계 속에서 지역적인 침체와 신앙고백의 위협에 직면하여 서신을 기록했습니다.", "kind": "neg"}, {"id": 122, "book": "누가복음", "sub": "", "tag": "", "n": 18, "stem": "누가 신학에서 '이스라엘과의 관계'에 대한 최근 연구자들의 올바른 평가로 맞지 않는 것은?", "opts": ["누가는 이스라엘이 복음을 거절했기 때문에 이방 선교가 비로소 우연히 시작되었다고 보며 구약의 약속을 전면 취소했다.", "포코르니(P. Pokorný)와 야벨(J. Jervell) 등은 누가가 하나님의 백성(laos)과 그 역사에 관심을 두었으며 교회가 참된 이스라엘의 연속선에 있다고 본다.", "태너힐(R. C. Tannehill)은 누가복음-사도행전이 그 자체로 완결된 통일적 내러티브(Narrative Unity)라고 강조한다.", "뢰닝(K. Löning)은 누가가 이스라엘의 유산을 보존하면서 새로운 현실로서 교회를 표현하고자 애썼다고 본다."], "ans": [1], "exp": "누가에게 이스라엘이 복음을 거절한 것이 이방 선교를 가져온 것이 아니라, 하나님의 구원은 태초부터 유대인과 이방인에게 동등하게 적용되는 구원사적 연속성을 가집니다.", "kind": "neg"}, {"id": 123, "book": "누가복음", "sub": "", "tag": "", "n": 19, "stem": "누가복음-사도행전에서 '열두 사도'와 맛디아의 선택(행 1:21-26)이 지니는 신학적 의미로 올바른 것은?", "opts": ["예수 시대와 교회 시대 사이의 연속성을 보존하기 위한 구원사적 조치이다.", "열두 사도는 교회 전승의 기초를 놓고 초기 교회 직제를 맡는 초창기의 핵심 증인들이다.", "맛디아의 선출은 가룟 유다의 배신 이후 열둘이라는 구속사적 수의 완성 및 참된 이스라엘의 회복을 상징한다.", "사도 회의(행 15장) 이후에도 열두 사도의 영향력은 영원히 절대적이며 바울의 사역은 사 도행전에서 완전히 배제된다."], "ans": [1, 2, 3], "exp": "누가의 설명에 따르면 열두 사도의 사역은 바울을 통해 지속되며, '사도회의'(행 15장)로 열두 사도의 시대가 마무리되고 바울 중심의
