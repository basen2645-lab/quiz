선교가 펼쳐집니다.", "kind": "pos"}, {"id": 124, "book": "누가복음", "sub": "", "tag": "", "n": 20, "stem": "누가복음의 결론부(눅 24:50-53)와 승천 사건에 대한 설명으로 맞지 않는 것은?", "opts": ["누가복음은 예수가 베다니 앞까지 나가사 손을 들어 축복하시고 하늘로 올려지시는 승천 장면으로 끝난다(눅 24:50-51).", "제자들은 대단한 슬픔에 빠져 예루살렘을 영원히 도망쳐 갈릴리로 숨어들었다.", "승천은 예수의 지상 사역 시기와 사도들이 대표하는 교회 시대를 연결하고 연속성을 보존하는 결정적 사건이다.", "누가복음 1:5의 성전(가브리엘 현현)에서 시작한 복음서는 24:53의 성전 찬양으로 마감하며 성전 모티프의 수미상응을 이룬다."], "ans": [2], "exp": "승천을 목격한 제자들은 \"큰 기쁨으로 예루살렘에 돌아가 늘 성전에서 하나님을 찬송\"하였습니다(눅 24:52-53).", "kind": "neg"}, {"id": 125, "book": "사도행전", "sub": "", "tag": "", "n": 1, "stem": "사도행전 저자 누가(Lukas)와 사도 바울 서신 간의 관계 및 정황에 대한 설명으로 맞지 않는 것은?", "opts": ["사도행전에 따르면 베드로의 이방 선교가 바울보다 앞서는데(행 10:1-11:18), 이는 갈라디아서 2:1-10과 모순되는 정황을 나타낸다.", "누가는 바울의 직접적인 동행자였으며, 바울 서신들의 존재와 내용을 깊이 이해하고 이를 사도행전 저술에 적극 활용했다.", "사도행전은 바울의 예루살렘 방문을 다섯 번 언급하지만, 바울 서신에서는 세 번만 언급된다.", "사도행전 20:17, 28의 밀레도 설교는 장로/감독 직분을 언급하지만, 바울 서신에서 장로(presbyteros) 개념은 등장하지 않는다."], "ans": [2], "exp": "\"누가는 바울의 동행자가 아니었고 편지들에 대해 몰랐거나 알려고 하지 않았다\"가 올바른 신학적 사실입니다. 또한 베드로의 이방 선교가 바울보다 앞선다는 사도행전의 보도는 갈라디아서 2:1-10과 신학적 모순을 이룹니다.", "kind": "neg"}, {"id": 126, "book": "사도행전", "sub": "", "tag": "", "n": 2, "stem": "사도행전의 기록 시기, 장소 및 지역적 관점에 대한 설명으로 맞지 않는 것은?", "opts": ["사도행전은 기원후 90~100년경 제3세대 그리스도교 시기에 기록된 것으로 설정하는 것이 타당하다.", "콘첼만(H. Conzelmann)은 저자가 에게해 지역에서 성장하고 나중에 로마로 갔을 가능성을 제기했다.", "누가는 팔레스타인 현지인의 동쪽 관점에서 서쪽 로마 제국을 바라보는 시각을 고수한다.", "바울의 공적 선교 활동은 주로 에게해 지역에서 이루어진다."], "ans": [3], "exp": "\"누가는 서쪽이라는 지역적 관점에서 팔레스타인을 바라본다\"가 맞습니다 (관점 방향 교정). 또한 \"바울의 활동은 주로 에게해 지역에서 이루어지며\"로 이해해야 합니다.", "kind": "neg"}, {"id": 127, "book": "사도행전", "sub": "", "tag": "", "n": 3, "stem": "사도행전의 전체 구성 및 단락 구분 표지(Zäsur)에 대한 설명으로 맞지 않는 것은?", "opts": ["사도행전 1:8은 전체 기술의 프로그램(\"예루살렘과 온 유대와 사마리아와 땅 끝까지\")을 제시한다.", "사도행전 6:1 이하 헬라파 유대인의 등장은 최초 교회 내부의 새로운 발전과 전환점이 된다.", "사도행전 15:1-33의 사도회의는 예루살렘 중심의 최초 교회 시기가 끝나고 율법으로부터 자유로운 이방 선교가 시작되는 중심축이다.", "플뤼마허(E. Plümacher) 등 학자들이 단락을 구분할 때 구분점(Zäsur)은 사도행전 15:33 직전에 놓인다."], "ans": [4], "exp": "플뤼마허의 단락 구분점(Zäsur)은 \"사도행전 15:33 뒤에 둔다\"가 올바른 설명입니다.", "kind": "neg"}, {"id": 128, "book": "사도행전", "sub": "", "tag": "", "n": 4, "stem": "사도행전 15장 사도회의와 관련 인물들의 중재 역할에 대한 설명으로 맞지 않는 것은?", "opts": ["사도회의를 통해 교회가 율법의 멍에로부터 이방인을 자유롭게 함으로써 보편적 선교의 기 초를 놓았다.", "사도회의 이후 누가의 서술은 바울의 아시아 및 유럽 선교 활동에 집중된다.", "베드로는 개종한 바리새인 파격 유대인들과 베드로·바울·바나바 사이를 오가는 유일한 중재자 역할을 담당했다.", "야고보는 개종한 바리새인들과 베드로·바울·바나바 사이의 유일한 중재자로 작동한다."], "ans": [3], "exp": "기존의 \"베드로는 바울과 야고보 사이의 중재자이다\"라는 구절은 오역으로 삭제되었으며, \"야고보가 개종한 바리새인들과 베드로·바울·바나바 사이의 중재자이다\"가 올바릅니다 (중재자는 야고보 한 사람뿐임).", "kind": "neg"}, {"id": 129, "book": "사도행전", "sub": "", "tag": "", "n": 5, "stem": "사도행전에 등장하는 인물 전승 중 '실라(Silas)'와 '디모데'에 대한 설명으로 맞지 않는 것은?", "opts": ["실라는 바울의 2차 선교 여행의 주요 동역자로 활약한다.", "실라는 사도행전 18:5에서 사도행전 내에 '처음으로' 등장하여 언급된다.", "디모데는 유대인 어머니와 헬라인 아버지 사이에서 태어나 바울에 의해 할례를 받았다.", "실라는 사도행전 18:5 이후 더 이상 사도행전 서사에서 언급되지 않는다."], "ans": [2], "exp": "\"실라는 사도행전 18:5에서 마지막으로 언급된다\"가 맞습니다 ('처음으로'가 아니라 '마지막으로' 언급됨).", "kind": "neg"}, {"id": 130, "book": "사도행전", "sub": "", "tag": "", "n": 6, "stem": "사도행전 16:3의 디모데의 할례와 갈라디아서 논증의 관계에 대한 설명으로 올바른 것은?", "opts": ["갈라디아서의 논증은 디모데의 할례가 역사적 사실이었음을 완벽히 증명해 준다.", "디모데의 할례는 갈라디아서의 율법 자유 논증을 완전히 믿을 수 없게 만들었을 것이다.", "디모데의 할례는 이방인 신자들에게 할례가 필수적임을 예루살렘 공의회가 의결했음을 뜻한다.", "바울은 디모데에게 할례를 행함으로써 유대교 회당과의 신학적 타협을 완결지었다."], "ans": [2], "exp": "주어와 목적어가 바르게 정정되었습니다. \"디모데의 할례는 갈라 디아서의 논증을 완전히 믿을 수 없게 만들었을 것이다\"가 맞습니다.", "kind": "pos"}, {"id": 131, "book": "사도행전", "sub": "", "tag": "", "n": 7, "stem": "사도행전에서 누가가 그리고 있는 사도 바울(Paulus)의 정체성에 대한 설명으로 맞지 않는 것은?", "opts": ["바울은 부활하신 주님으로부터 직접 부름을 받은 구속사적 증인이다.", "바울은 이방 선교의 개척자로서 예루살렘에서 로마로 향하는 여정의 중심인물이다.", "저자 누가는 스스로 토라와 성전에 충실한 엄격한 가말리엘 문하의 유대인으로 묘사된다.", "바울은 누가에 의해 토라와 성전에 충실한 유대인이자 동시에 이방인의 사도로 묘사된다."], "ans": [3], "exp": "\"그(바울)는 누가에 의해 토라와 성전에 충실한 유대인으로 묘사된다\"가 맞습니다 (누가가 아니라 묘사되는 주체는 '바울'임).", "kind": "neg"}, {"id": 132, "book": "사도행전", "sub": "", "tag": "", "n": 8, "stem": "사도행전의 파루시아(재림) 지연 문제와 구속사 이해에 대한 설명으로 맞지 않는 것은?", "opts": ["사도행전 1:6-8에서 파루시아 시기에 대한 질문은 거절되고 증인으로서의 사명이 부여된다.", "누가는 지체되는 파루시아에 대한 답으로 세상에서 성령의 주도로 그리스도를 증언하는 역사적 교회의 시간을 제시한다.", "누가와 그의 공동체가 하나님께 직접 파루시아 시간의 연장을 공식 요청하면서 신학적 문제가 발생했다.", "실제로 일어난 시간의 지연(eingetretene Dehnung der Zeit) 때문에 누가와 그의 공동체에게 문제가 되었다."], "ans": [3], "exp": "\"실제로 일어난 시간의 지연 때문에 누가와 그의 공동체에게 문제가 되었다\"가 성경신학적 사실입니다.", "kind": "neg"}, {"id": 133, "book": "사도행전", "sub": "", "tag": "", "n": 9, "stem": "바레트(C. K. Barrett) 등 현대 신약학자들의 사도행전 저자관에 대한 설명으로 맞지 않는 것은?", "opts": ["헨헨, 콘첼만 등 순수 편집사 연구자들은 사도행전의 역사적 신빙성을 낮게 평가하기도 했다.", "롤로프, 헨겔, 바레트는 누가가 사도행전에서 신뢰할 만한 옛 전승들을 보존했다고 보았다.", "바레트(C. K. Barrett)는 누가복음과 사도행전의 저자 누가를 바울의 직접적인 역사적 동 행자로 단정했다.", "바레트는 누가를 바울의 직접적인 동행자로 보지는 않으나, 선교 여행에 참여한 그룹에서 나온 우리-자료와 전승을 고려한다."], "ans": [3], "exp": "\"바레트는 누가를 바울의 직접적인 동행자로 보지는 않지만 선교 여행에 참여한 그룹의 전승을 고려한다\"가 올바릅니다.", "kind": "neg"}, {"id": 134, "book": "사도행전", "sub": "", "tag": "", "n": 10, "stem": "사도행전의 본문 비평과 '서방 본문(Western Text / D 본문)'의 특징에 대한 설명으로 맞지 않는 것은?", "opts": ["서방 본문 형태(주요 증거 D 05 등)는 알렉산드리아 전승보다 약 8.5%가 더 길다.", "서방 본문의 형태는 로마제국 수도 로마에서 가장 먼저 생성되어 안디옥으로 역수입되었다.", "서방 본문은 문체와 언어 다듬기, 명료화, 그리고 사도칙령(행 15:20, 29)에 황금률을 덧붙이는 윤리적 해석을 보여준다.", "프렌슈코프스키(M. Frenschkowski)는 서방 본문의 확장을 고대 책 제작의 실용적 분량 채우기 요구사항으로 설명했다."], "ans": [2], "exp": "서방 본문의 형태는 로마 제국이 아니라 시리아(안디옥의 동쪽)에서 시작되었을 개연성이 매우 큽니다.", "kind": "neg"}, {"id": 135, "book": "사도행전", "sub": "", "tag": "", "n": 11, "stem": "사도행전의 '우리-단락(Wir-Passagen, 행 16:10-17, 20:5-15, 21:1-18, 27:1-28:16)'에 대한 설명으로 올바른 것은?", "opts": ["1인칭 복수 형태('우리')로 서술되며 주로 바다 항해와 여행 경로에 대해 기술한다.", "고대 문헌의 항해 역사 기술에 나오는 문학적 스타일 및 관습이 반영되었을 가능성이 있다.", "'우리-단락'의 존재는 저자가 바울의 모든 선교 여행 전체를 직접 눈으로 목격한 유일한 증인임을 완벽히 입증한다.", "디벨리우스(M. Dibelius)는 '우리-단락'을 양식사적 관점에서 '여정 기록(Itinerar)' 자료의 활용으로 해석했다."], "ans": [1, 2, 4], "exp": "'우리-단락'이 직접 목격에 관한 입증 자료인지에 대해서는 학계의 토론이 지속되고 있으며, 문학적 관습이나 동역자의 정보 수용 등 다양한 모델이 제기되므로 직접 목격의 완벽한 증거로 단정하기 어렵습니다.", "kind": "pos"}, {"id": 136, "book": "사도행전", "sub": "", "tag": "", "n": 12, "stem": "사도행전의 문학적 장르 및 서사 문체에 대한 설명으로 맞지 않는 것은?", "opts": ["사도행전의 거시적 장르는 '역사서술적-전기적 내러티브' 및 '역사적 단행본'에 가깝다.", "사도행전은 헬라 로마 소설 양식인 '사도 소설(Apostelroman)'로 완전히 분류되며 역사적 사료 가치는 전혀 없다.", "누가는 요약 보고(행 2:42-47, 4:32-35)와 생동감 있는 에피소드 장면을 교차 배치하는 리듬을 보여준다.", "도르마이어(D. Dormeyer)는 사도행전을 비장하고 전기문학적인 보편 역사로 정의했다."], "ans": [2], "exp": "페르보(R. I. Pervo)가 대중 소설적 성격을 언급하기도 했으나, 사도행전은 구속사적 통찰과 전승을 통합한 고대 역사서술(Historiography) 및 전기적 역사 단행본으로 평가받습니다.", "kind": "neg"}, {"id": 137, "book": "사도행전", "sub": "", "tag": "", "n": 13, "stem": "사도행전 1:8의 구조적 프로그램과 '성령'의 역할에 대한 설명으로 올바른 것은?", "opts": ["성령이 임하시면 권능을 받고 예루살렘, 온 유대, 사마리아, 땅 끝까지 증인이 되는 지리적 확장을 담고 있다.", "복음의 확장은 인간의 정치적 야망이 아닌 성령의 주도와 인도 아래 이루어진다.", "베드로의 고넬료 세례 사건(행 10장)은 사마리아를 넘어 이방인에게 복음이 확장되는 결정적 계기이다.", "바울과 바나바의 안디옥 선교 파송(행 13장)은 이방 세계를 향한 공적 선교의 출발점이 된다."], "ans": [1, 2, 3, 4], "exp": "4개 지문 모두 사도행전 1:8의 구속사적·지리적 프로그램과 성령의 주도적 역할을 정확히 기술하고 있습니다.", "kind": "pos"}, {"id": 138, "book": "사도행전", "sub": "", "tag": "", "n": 14, "stem": "사도행전에 수록된 설교들(전체 분량의 약 3분의 1)의 신학적 기능에 대한 설명으로 맞지 않는 것은?", "opts": ["베드로의 오순절 설교(행 2장), 스데반의 설교(행 7장), 바울의 아테네 설교(행 17장) 등이 대표적이다.", "고대 역사가의 연설 삽입 전통과 유사하게, 과거 사건의 현장 속에서 독자에게 초역사적 의미와 통찰을 제공한다.", "선교 설교는 구원사의 전환점을 이루며 이로 인해 새로운 사건들과 공동체의 형성을 불어넣는다.", "사도행전의 설교들은 1세기 당시 녹음기로 녹취한 듯 사도들의 입에서 나온 문자를 토시 하나 틀리지 않고 속기한 것이다."], "ans": [4], "exp": "사도행전의 설교들은 당대 역사 사료 편찬의 양식에 따라 누가가 전승 자료를 바탕으로 복음서 전체 저작 틀과 목적에 맞게 신학적으로 구성하고 다듬은 연설입니다.", "kind": "neg"}, {"id": 139, "book": "사도행전", "sub": "", "tag": "", "n": 15, "stem": "베드로와 고넬료 사건(행 10:1-11:18)의 구속사적 의미에 대한 설명으로 맞지 않는 것은?", "opts": ["하나님은 이방인도 그리스도의 구원에 참여해야 함을 베드로 환상을 통해 계시하셨다.", "이방인 고넬료 가정에 임한 성령의 은사(행 10:44)는 예루살렘 오순절 사건의 보편적 성취이다.", "예루살렘 유대 그리스도인들은 고넬료 사건 보고를 듣고 하나님께서 이방인에게도 생명 얻는 회개를 주셨음을 인정하고 찬송했다(행 11:18).", "베드로는 고넬료에게 세례를 베푼 후 유대 율법 위반으로 예루살렘 공회에 의해 즉시 사도직에서 파면되었다."], "ans": [4], "exp": "예루살렘 교회의 유대 그리스도인들은 베드로의 해명을 듣고 하나님의 보편적 구원 의지를 기쁨으로 받아들이고 수용했습니다.", "kind": "neg"}, {"id": 140, "book": "사도행전", "sub": "", "tag": "", "n": 16, "stem": "바울의 아테네 아레오바고 설교(행 17:16-34)에 대한 학자들의 해석으로 맞지 않는 것은?", "opts": ["디벨리우스(M. Dibelius)와 헨헨(E. Haenchen)은 이 설교를 사도행전 전체의 신학적 절정으로 보았다.", "예르벨(J. Jervell)은 아레오바고 설교가 사도행전의 구원론을 완성하는 가장 핵심적인 오리지널 바울 전승이라고 평가했다.", "예르벨(J. Jervell)은 문학적으로 이 본문을 부차적인 것으로 보며, 헬라 '이교도적' 사상에 대한 신학적 비평으로 분류했다.", "랑(M. Lang)은 아레오바고 설교에서 사도행전의 바울이 새로운 종교(religio nova)와 동시대 문화 지식에 대한 수용을 보여준다고 보았다."], "ans": [2], "exp": "예르벨(J. Jervell)은 아레오바고 설교가 신약성서 및 누가 저작 전체에서도 낯선 부분이며 문학적으로 부차적인 것으로 간주했습니다.", "kind": "neg"}, {"id": 141, "book": "사도행전", "sub": "", "tag": "", "n": 17, "stem": "사도행전에 나타난 '로마 제국 당국'과 교회의 관계에 대한 설명으로 올바른 것은?", "opts": ["로마 총독들과 관리들(갈리오, 페스토 등)은 바울이 로마법을 위반한 정치적 범죄자가 아님을 확인한다.", "바울을 소요죄로 고발하고 핍박한 주된 주체는 주로 유대 대적자들로 서술된다.", "바울은 로마 황제 숭배를 거부했다는 이유로 1차 선교 여행 직후 로마군에 의해 즉결 처형되었다.", "바울의 가이사 상소(행 25:11)는 로마 당국의 무죄 입증과 복음이 로마 수도까지 방해 없이 전파되는 과정(행 28:31)을 보여준다."], "ans": [1, 2, 4], "exp": "바울은 로마법에 따라 무죄였으나 유대 대적자들의 무고와 로마 당국의 기피 속에 가이사에게 상소하여 로마로 압송되었으며, 로마에서 방해받지 않고 복음을 선포합니다.", "kind": "pos"}, {"id": 142, "book": "사도행전", "sub": "", "tag": "", "n": 18, "stem": "사도행전 28:25-28의 이스라엘 선교 거절과 이방 선교에 대한 설명으로 맞지 않는 것은?", "opts": ["바울은 이사야 6:9-10을 인용하여 유대인들의 완고함과 구원의 거절을 선언한다.", "유대인의 완고함에 대해 이방 백성이 경청하고 믿음으로 응답함(행 28:28)을 대조시킨다.", "이스라엘의 거절로 인해 하나님이 구약 성서에서 이스라엘과 맺은 모든 약속은 완전히 폐기되고 무효화되었다.", "누가는 참된 이스라엘로서의 교회가 탄생했음을 보여주며, 이방인과 유대인 신자 모두를 포함하는 정체성을 제시한다."], "ans": [3], "exp": "누가는 이스라엘의 구속사적 실패에도 불구하고 이스라엘을 향한 하나님의 약속의 신실하심(행 1:6b)을 지속적으로 강조하며 약속의 성취로서 이방 그리스도교 교회를 정당화합니다.", "kind": "neg"}, {"id": 143, "book": "사도행전", "sub": "", "tag": "", "n": 19, "stem": "최근 사도행전 연구 경향(마르그라트, 바크하우스, 도르마이어 등)에 대한 설명으로 맞지 않는 것은?", "opts": ["마르그라트(D. Marguerat)는 사도행전의 내러티브적·문화사적·종교사적 분석의 중요성을 부각시켰다.", "바크하우스(K. Backhaus)는 사도행전을 기원과 설립에 대한 기억이 확보된 '변증적 부분 단행본'으로 명명했다.", "도르마이어(D. Dormeyer)는 사도행전을 수사학적 문체로 기록된 보편 역사로 보았다.", "현대 신약학계는 사도행전의 파루시아 지연 극복만이 저술의 유일한 목적이며 역사기술적 가치는 전무하다는 데 완벽히 합의했다."], "ans": [4], "exp": "최근 연구(슈나이더, 롤로프, 볼터 등)에 따르면 사도행전의 우선적 목적은 단순히 파루시아 지연을 극복하는 것에 머물지 않으며, 구원사 안에서 제3세대 교회의 정체성 확립과 성령의 역사, 하나님의 약속의 신실함을 드러내는 데 주력합니다.", "kind": "neg"}, {"id": 144, "book": "사도행전", "sub": "", "tag": "", "n": 20, "stem": "사도행전 신학의 핵심으로서 '사도적 증인'과 구속사적 연속성에 대한 설명으로 올바른 것은?", "opts": ["복음서의 예수의 지상 사역과 사도행전의 사도들의 선교 사역은 성령 안에서 불가항력적 연속성을 지닌다.", "사도들은 예수 그리스도의 부활의 참된 증인으로서 교회 선교의 정당성과 전승을 보증한다.", "바울은 제2세대 그리스도인의 대표자이자 부활하신 주님의 부름을 받은 이방인의 사도로 서술된다.", "사도행전의 결론(행 28:31)은 거침없이(akōlytōs) 선포되는 하나님 나라 복음을 보여주며 내러티브를 개방성 있게 마감한다."], "ans": [1, 2, 3, 4], "exp": "4개 지문 모두 사도행전의 핵심 신학 주제인 예수-사도-교회 간의 구속사적 연속성, 증인들의 역학, 그리고 결론부의 방해받지 않는 하나님 나라 복음 선포를 바르게 설명합니다.", "kind": "pos"}, {"id": 145, "book": "데살로니가전서", "sub": "", "tag": "", "n": 1, "stem": "데살로니가전서의 저자 및 진정성(저작설)에 대한 설명으로 맞지 않는 것은?", "opts": ["데살로니가전서의 바울 저작설은 학계에서 거의 의심을 받지 않는 확고한 사실이다.", "이미 안디옥의 이그나티우스(IgnEph 10:1)와 무라토리 정경목록도 데살로니가전서를 바울의 서신으로 언급한다.", "크뤼제만(M. Crüsemann)은 데살로니가전서가 바울 사후 바울 학파에 의해 완전히 창작된 2세기 차명문서라는 주장을 학계의 보편적 통설로 입증했다.", "크뤼제만의 차명문서 가설은 바울 사도권의 우위에도 불구하고 항상 학파 테두리의 공동 사역임을 보여주는 서신 서두 진술과 모순된다는 비판을 받는다."], "ans": [3], "exp": "크뤼제만(M. Crüsemann)은 예외적으로 차명문서설을 주장했으나, 슈넬레를 비롯한 현대 성서학계는 이를 배격하며 바울의 친서이자 가장 오래된 서신으로 확정합니다.", "kind": "neg"}, {"id": 146, "book": "데살로니가전서", "sub": "", "tag": "", "n": 2, "stem": "데살로니가전서의 기록 장소, 시기 및 여정에 대한 설명으로 맞지 않는 것은?", "opts": ["빌립보를 거쳐 온 바울(살전 2:2)이 데살로니가 교회를 세웠으며, 아덴에서 디모데를 파송했다(살전 3:1-2).", "디모데는 데살로니가 교회의 상황에 대한 좋은 소식을 바울에게 가져왔다(살전 3:6).", "사도행전 18:5에 따르면 바울은 에베소에서 실루아노와 디모데를 만났으며, 에베소가 데살로니가전서의 기록 장소로 결정된다.", "대다수 현대 신약학자들은 데살로니가전서가 기원후 50년(혹은 51년)경 고린도에서 작성된 가장 오래된 바울 서신으로 본다."], "ans": [3], "exp": "사도행전 18:5에 따르면 바울이 이들을 만난 곳이자 기록 장소는 '에베소'가 아니라 '고린도'입니다.", "kind": "neg"}, {"id": 147, "book": "데살로니가전서", "sub": "", "tag": "", "n": 3, "stem": "데살로니가(Thessalonica)시의 역사적·지정학적 배경 및 종교적 상황에 대한 설명으로 맞지 않는 것은?", "opts": ["기원전 315년 카산더에 의해 새로 건설되었으며, 테르마이코스만과 에그나티아 도로(Via Egnatia)에 위치한 무역·교통의 요충지였다.", "사라피스(Sarapis), 이시스(Isis), 디오니소스(Dionysus), 카비렌(Kabiren) 등 다양한 다신교 제의가 발굴 및 문헌으로 입증되었다.", "사도행전 17:1에 따르면 이 도시에는 유대인 회당이 존재했다.", "데살로니가는 철저한 엄숙주의 유태교 단일 문화 도시였으며, 헬라 로마 제의나 이방인의 합류는 엄격히 금지되어 있었다."], "ans": [4], "exp": "데살로니가는 매력적인 헬라 문화와 항구도시적 다신교 제의가 번성했던 곳으로, 교인 다수가 우상을 버리고 하나님께 돌아온 이방계 그리스도인이었습니다(살전 1:9).", "kind": "neg"}, {"id": 148, "book": "데살로니가전서", "sub": "", "tag": "", "n": 4, "stem": "데살로니가 교회의 수신자 정황과 핍박에 대한 설명으로 올바른 것은?", "opts": ["교인들은 복음을 받아들임으로써 시작된 고난과 박해에 지속적으로 노출되어 있었다(살전 1:6).", "팔레스타인 교회가 유대인들에게 핍박을 받았듯이, 데살로니가 교회 성도들도 이방인들(동족들)에게 핍박을 받았다(살전 2:14).", "데살로니가 성도들은 로마 황제의 직접적인 전국적 체포령에 의해 교인 전체가 즉각 처형당하는 대박해 상황에 직면해 있었다.", "성도들은 고난 가운데서도 성령의 기쁨으로 말씀을 받아 주와 사도를 본받는 자가 되었다(살전 1:6)."], "ans": [1, 2, 4], "exp": "데살로니가 교회가 받은 핍박은 로마 제국의 전국적 처형·체포령이 아니라 주변 이웃 및 동족(이방인/유대인)들과의 일상적 충돌 및 종교적 박해였습니다.", "kind": "pos"}, {"id": 149, "book": "데살로니가전서", "sub": "", "tag": "", "n": 5, "stem": "데살로니가전서의 서두(1:1)와 편지 양식적 특징에 대한 설명으로 맞지 않는 것은?", "opts": ["발신자로 바울뿐만 아니라 실루아노와 디모데가 함께 언급된다.", "바울은 서두에서 자신만을 사도로 높이는 우위를 주장하지 않고 공동 사역임을 드러낸다.", "바울은 서두 인사말에서 자신의 사도권을 강조하기 위해 자신을 '하나님의 종' 또는 '그리스도의 사도'로 공식 칭호화했다.", "편지의 첫 부분 전체(1:2-3:13)에 걸쳐 감사(eucharistein) 모티프가 지속적으로 되풀이된다."], "ans": [3], "exp": "데살로니가전서 1:1 서두에는 바울의 사도 칭호나 종 칭호 없이 \"바울과 실루아노와 디모데는...\"으로 시작하며 동역자들과의 평등한 서신 형식을 취합니다.", "kind": "neg"}, {"id": 150, "book": "데살로니가전서", "sub": "", "tag": "", "n": 6, "stem": "데살로니가전서 몸통(4-5장)에서 나타나는 주요 서신 양식 구조와 '페리(peri, ~에 관하여)' 모티프에 대한 설명으로 맞는 것은?", "opts": ["거시 구조상 1-3장은 과거 사역을 돌아보는 회상과 감사, 4-5장은 종말론적 윤리 권면으로 대별된다.", "데살로니가전서 4:9, 4:13, 5:1에는 데살로니가 교회로부터 온 구체적 질문에 답하는 '~에 관하여(peri)' 표현이 나타난다.", "'페리(peri)' 구절들은 바울이 교인들의 질문을 무시하고 자신의 고유한 교리만을 일방적으로 강요하는 표지이다.", "데살로니가전서 4:13-18은 성도의 갑작스러운 죽음 문제에 대해 파루시아의 때와 종말적 구원의 확신을 설명한다."], "ans": [1, 2, 4], "exp": "'페리(peri, ~에 관하여)'는 데살로니가 교회 성도들이 바울에게 보낸 구체적인 문의사항(형제 사랑, 죽은 자의 부활, 때와 시기)에 대해 응답하고 있음을 나타냅니다.", "kind": "pos"}, {"id": 151, "book": "데살로니가전서", "sub": "", "tag": "", "n": 7, "stem": "데살로니가전서의 문학적 통일성과 '분할가설(비평가설)'에 대한 설명으로 맞지 않는 것은?", "opts": ["에카르트(K. G. Eckart)는 데살로니가전서가 아덴과 고린도에서 각각 쓰인 두 통의 서신이 편집자에 의해 합성된 것이라고 주장했다.", "뎀케(Chr. Demke)는 후기 바울서신과 비교하여 원래 바울서신에 후대 편집자의 보완 구절이 들어갔다고 보았다.", "슈미탈스(W. Schmithals)는 데살로니가전후서가 원래 10개의 독립된 단편으로 나뉘어 있었다는 가설을 성립시켜 학계의 정설로 확립했다.", "슈넬레(U. Schnelle)는 분할가설들이 방법론적 기준을 통제하지 못하며, 데살로니가전서는 문학적 통일성을 보인다고 평가한다."], "ans": [3], "exp": "슈미탈스는 5편의 서신이 2편으로 통합되었다고 주장했으나, 슈넬레는 이러한 분할가설들이 설득력이 없으며 서신의 독자적 통일성을 강조합니다.", "kind": "neg"}, {"id": 152, "book": "데살로니가전서", "sub": "", "tag": "", "n": 8, "stem": "데살로니가전서 2:14-16(유대인 적대 구절)의 후대 삽입설(Interpolation) 논쟁에 대한 설명으로 맞지 않는 것은?", "opts": ["피어슨(B. A. Pearson) 등은 2:14-16의 강력한 반유대적 어조와 예루살렘 멸망 언급을 근거로 후대 삽입 구절로 보았다.", "삽입설을 반대하는 학자들은 이 구절의 모순이 바울 자신의 상황적 진술에 소급된다고 설명한다.", "데살로니가전서 2:16의 단순과거 \"임하였다(ephtasen)\"는 반드시 기원후 70년 예루살렘 멸망을 직접 돌아보는 회고이어야만 한다.", "슈넬레는 문학비평적 가설로 본문을 제거하기보다 바울의 적대적 행동 인식에서 하나님의 진노가 절정에 도달했음을 나타내는 바울 자신의 진술로 본다."], "ans": [3], "exp": "\"임하였다(ephtasen)\"가 반드시 70년 예루살렘 성전 멸망을 전제로 한 것은 아니며, 유대인들의 적대적 행위 속에서 하나님의 진노가 이미 결정적으로 도래했음을 나타내는 표현으로 해석될 수 있습니다.", "kind": "neg"}, {"id": 153, "book": "데살로니가전서", "sub": "", "tag": "", "n": 9, "stem": "데살로니가전서가 바울의 후기 서신들(로마서, 갈라디아서 등)과 비교할 때 지니는 '신학적 특수성'으로 맞지 않는 것은?", "opts": ["후기 서신의 핵심 인간학 용어인 '육(sarx)', '죄(hamartia)', '자유(eleutheria)'가 인간학적 의미로 등장하지 않는다.", "로마서와 갈라디아서의 핵심 교리인 '율법의 행위와 대립되는 칭의론'이 나타나지 않는다.", "그리스도의 몸으로서의 교회론이나 그리스도와 함께 장사되는 세례의 성례전적 사상이 구체화되지 않았다.", "데살로니가전서는 구약성서를 대량으로 인용하고 상세하게 주해함으로써 구약 율법 준수를 서신의 최우선 기초로 삼고 있다."], "ans": [4], "exp": "데살로니가전서는 구약성서를 거의 인용하지 않으며, 칭의론이나 율법 논쟁이 아닌 '하나님의 종말론적 선택(eklogē)'과 '임박한 파루시아 기대'를 신학적 기초로 삼습니다.", "kind": "neg"}, {"id": 154, "book": "데살로니가전서", "sub": "", "tag": "", "n": 10, "stem": "데살로니가전서에서 바울이 이해하는 '믿음(pistis)'의 개념에 대한 설명으로 올바른 것은?", "opts": ["율법의 행위에 대한 대립 개념이 아니라, '곤경 속에서도 흔들리지 않음, 충실함'으로 이해된다.", "율법의 의를 완벽하게 성취하여 하나님께 제출하는 공로적 자력 구원 행위이다.", "미래 부활을 완전히 배격하고 현재의 영적 신격화만을 기뻐하는 열광주의적 지식이다.", "로마 황제의 신성에 대한 정치적 서약과 동의를 의미한다."], "ans": [1], "exp": "데살로니가전서에서 믿음(pistis)은 율법과의 신학적 대립 표상이 아니라, 박해와 곤경 속에서도 흔들리지 않는 충실함과 하나님을 향한 신뢰를 뜻합니다.", "kind": "pos"}, {"id": 155, "book": "데살로니가전서", "sub": "", "tag": "", "n": 11, "stem": "데살로니가전서의 신학적 기초인 '하나님의 선택(eklogē)' 사상에 대한 설명으로 올바른 것은?", "opts": ["'하나님의 선택'(살전 1:4, 2:12, 4:7, 5:9, 24)은 서신의 신학적 출발점을 이룬다.", "부름받은 성도들은 인류와 함께 진노 가운데 멸망하지 않고 종국적인 구원을 경험하도록 선택받았다.", "선택 사상은 성도들로 하여금 도덕적 방종과 무위도식에 빠지도록 만드는 묵시적 결정론이다.", "선택 사상은 '주 예수 그리스도의 즉각적이고 임박한 파루시아'를 기다리는 지평과 직접 결합된다."], "ans": [1, 2, 4], "exp": "선택 사상은 방종이 아니라 거룩함과 성화, 그리고 임박한 파루시아를 인내로 기다리는 종말론적 실존의 근거가 됩니다.", "kind": "pos"}, {"id": 156, "book": "데살로니가전서", "sub": "", "tag": "", "n": 12, "stem": "데살로니가전서 4:13-18의 '주의 말씀' 인용과 종말론적 구상에 대한 설명으로 맞지 않는 것은?", "opts": ["바울은 성도의 갑작스러운 죽음 앞에서 최초 교회의 '주의 말씀'(살전 4:15-17) 전승을 인용·편집했다.", "묘사의 순서는 승리자 퀴리오스(Kyrios)의 오심 -> 그리스도 안에서 죽은 자들의 부활 -> 살아있는 자들이 구름 속으로 끌어올려짐(공중 접견)이다.", "이 사건의 직접적 조건은 모든 사람의 옮겨짐이며, 간접적 조건은 '그리스도 안에서' 죽은 자의 부활이다.", "예수가 지상 사역 당시 녹음기로 직접 기록해 둔 역사적 율법 조항을 문언 그대로 복사하여 삽입했다."], "ans": [4], "exp": "4:15-17의 '주의 말씀'은 최초 교회가 보유하고 있던 부활 및 재림에 관한 전승 자 료를 바울이 데살로니가 교회의 특수 정황에 맞추어 편집하여 적용한 것입니다.", "kind": "neg"}, {"id": 157, "book": "데살로니가전서", "sub": "", "tag": "", "n": 13, "stem": "데살로니가전서 4:13-18에 나타난 '죽은 자의 부활'과 '파루시아'의 관계에 대한 설명으로 맞는 것은?", "opts": ["죽은 성도들의 부활은 전체 종말 사건 안에서 '보조 기능 / 종속적 기능'을 담당한다.", "바울은 자신이 파루시아 때까지 살아남을 자(\"우리 살아남은 자들\", 4:15, 17)에 속할 것으로 생각했다.", "전체 사건의 진짜 목표는 주님과 영원히 함께함(4:17)이다.", "바울은 파루시아 이전에 교회의 모든 성도가 반드시 죽어야만 부활을 거쳐 구원받는다고 가르쳤다."], "ans": [1, 2, 3], "exp": "바울은 교회가 파루시아에서 살아남은 자가 될 것으로 기대했기에, 부활 사상은 예상치 못하게 파루시아 전 죽은 성도들의 구원 문제를 해결하기 위한 보조적/종속적 기능으로 제시되었습니다.", "kind": "pos"}, {"id": 158, "book": "데살로니가전서", "sub": "", "tag": "", "n": 14, "stem": "데살로니가전서 5:1-11의 종말론과 '빛의 자녀' 모티프에 대한 설명으로 맞지 않는 것은?", "opts": ["종말 사건의 '언제(때와 시기)'라는 질문에서 '어떻게(종말론적 실존)'에 대한 논의로 전환한다.", "주의 날이 밤의 도둑같이 임할 것이므로 정신을 차리고 깨어 있어야 함을 권면한다.", "쿰란 문헌(1QS 3:13-4:26)의 '빛의 자녀와 어둠의 자녀' 이원론에 직접 종속되어 쿰란 공동체의 규칙을 그대로 복사했다.", "그리스도교의 실존은 주의 오심이 아직 일어나지 않았다 하더라도 이미 빛과 낮에 속한 종말론적 실존이다."], "ans": [3], "exp": "쿰란 문헌(1QS)과의 병행성이 인정되나, 바울이 쿰란 문헌에 직접 종속되었다는 점은 입증되지 않으며 사상적·문화적 지평을 공유하는 것으로 해석됩니다.", "kind": "neg"}, {"id": 159, "book": "데살로니가전서", "sub": "", "tag": "", "n": 15, "stem": "데살로니가전서 2:1-12의 자기소개와 종교사적 배경(견유학파 등)에 대한 설명으로 올바른 것은?", "opts": ["바울은 사역의 수고와 진실함을 디온 크리소스토모스(Dion Chrysostomos, AD 40-120) 같은 진정한 견유학파 철학자의 사상과 병행하여 기술한다.", "아첨이나 재정적 탐욕 없이 자녀를 대하는 부모나 간호원처럼 성도를 보살폈음을 강조한다(살전 2:7, 11).", "바울은 청중에게 부담을 주지 않기 위해 교인들로부터 대규모 헌금을 강제로 징수하여 자급자족을 거부했다.", "입으로만 가르치지 않고 스스로 밤낮으로 일하며 짐이 되지 않으려 했던 사도의 모범이 제시된다."], "ans": [1, 2, 4], "exp": "바울은 교인들에게 짐이 되지 않기 위해 자발적으로 밤낮 노동하며 복음을 전파했습니다(살전 2:9).", "kind": "pos"}, {"id": 160, "book": "데살로니가전서", "sub": "", "tag": "", "n": 16, "stem": "최근 연구에서 슈미트(E. D. Schmidt)가 부각시킨 데살로니가전서의 '거룩함'과 '성화' 개념에 대한 설명으로 올바른 것은?", "opts": ["거룩함과 성화는 육체적 실존을 완전히 부정하고 영지주의적 초월에 도달하는 것이다.", "\"거룩함은 신적 종말론적 완성의 개념이고, 성화는 믿는 자가 종말론적 완성에 이르기까지 기다리는 길이다.\"", "성화는 과거 세례 시점에 이미 완성되어 더 이상의 윤리적 노력이 불필요함을 뜻한다.", "거룩함은 오직 율법의 할례를 받은 유대계 그리스도인에게만 국한되는 특권이다."], "ans": [2], "exp": "슈미트(E. D. Schmidt)는 거룩함을 신적 종말론적 완성으로, 성화를 그 완성을 향해 나아가는 성도의 삶의 여정으로 구별하여 윤리적 구성을 부각시켰습니다.", "kind": "pos"}, {"id": 161, "book": "데살로니가전서", "sub": "", "tag": "", "n": 17, "stem": "미주 지역 연구자들(말허비, 주엣, 돈프리드 등)의 데살로니가전서 연구 경향에 대한 설명으로 맞지 않는 것은?", "opts": ["말허비(A. J. Malherbe)는 바울의 선교 전략을 방랑 철학자들의 설득, 개종, 소그룹 형성, 권면 및 '우정의 서신' 맥락에서 해석했다.", "말허비는 데살로니가 교인 대다수가 카비렌(Kabiren) 다신교 예전을 열정적으로 추종하는 비밀 영지주의 단체였다고 단정했다.", "주엣(R. Jewett)은 데살로니가전서 시대에 교인 상당수가 천년왕국설적 추종자였다고 가정하기도 했다.", "사회학적 접근은 이교적 예전과 대중 철학이 공존하던 데살로니가의 구체적 정황을 규명하는 데 기여했다."], "ans": [2], "exp": "교인의 사회적 하층민 구성 및 카비렌(Kabiren) 제의추종 가능성을 가정한 학자는 말허비가 아니라 주엣(R. Jewett) 등입니다.", "kind": "neg"}, {"id": 162, "book": "데살로니가전서", "sub": "", "tag": "", "n": 18, "stem": "브로케(Chr. von Brocke)의 연구 및 비문 발굴을 통해 밝혀진 데살로니가 도시 및 교회의 정체성으로 올바른 것은?", "opts": ["데살로니가는 경제적으로 중요하고 종교·문화적으로 대단한 헬라적 도시였다.", "비문 자료들은 황제 숭배 및 다양한 동양 제의(사라피스 등)가 공존했음을 보여준다.", "데살로니가 교회는 신생 교회였으나 그 설립 소식이 그리스 전역으로 확산되었다(살전 1:7-8).", "교인들은 대중 문화 및 주변 세계와의 일상적 의견 충돌 속에서 사회적·종교적 압박을 받았다."], "ans": [1, 2, 3, 4], "exp": "제시된 4개 지문 모두 브로케의 역사·사회적 연구가 밝혀낸 데살로니가시와 신생 교회의 구체적 정황을 바르게 기술하고 있습니다.", "kind": "pos"}, {"id": 163, "book": "데살로니가전서", "sub": "", "tag": "", "n": 19, "stem": "'바울의 새 관점(New Perspective on Paul)' 토론에서 데살로니가전서가 지니는 위치로 맞는 것은?", "opts": ["데살로니가전서는 율법과 할례에 관한 구체적 논쟁이 가득하여 '새 관점' 학파의 가장 핵심적인 증거 문서로 활용된다.", "데살로니가전서에는 율법(nomos)에 관한 진술이 포함되어 있지 않으므로 '바울의 새 관점' 연구에서 거의 아무런 역할도 하지 못한다.", "샌더스(E. P. Sanders)는 데살로니가전서 2장이 언약적 율법주의의 유일한 구원론이라 주장했다.", "던(J. D. G. Dunn)은 데살로니가전서가 민족적 정체성 표지(할례, 안식일, 음식법)를 폐지한 최초 서신임을 입증했다."], "ans": [2], "exp": "데살로니가전서에는 '율법(nomos)'이라는 단어나 칭의론 논쟁이 등장하지 않으므로, 유대교 율법 관점을 다루는 '바울의 새 관점' 토론에서는 거의 다루어지지 않습니다.", "kind": "pos"}, {"id": 164, "book": "데살로니가전서", "sub": "", "tag": "", "n": 20, "stem": "바울 신학 전체에서 데살로니가전서가 지니는 신학사적 위치와 평가로 올바른 것은?", "opts": ["데살로니가전서는 그림자 같은 존재에서 벗어나 바울 사유의 출발점이자 독자적 증거로서 바울 연구의 중심으로 부각되었다.", "나중에 기록된 후기 서신들(로마서, 갈라디아서)의 완성된 관점을 가장 오래된 서신인 데살로니가전서에 소급하여 읽는 것은 비역사적이다.", "데살로니가전서는 후기 서신들에 비해 신학적 완성도가 현저히 떨어지므로 바울 서신 정경에서 완전히 제외되어야 한다.", "데살로니가전서는 초기 바울 신학의 독자적인 신학적 무게와 헬레니즘 세계의 모(母)교회 신학과의 연속성을 보여준다."], "ans": [1, 2, 4], "exp": "데살로니가전서는 바울 사유의 출발점이자 독자적인 신학적 무게를 지닌 서신으로, 후기 서신의 틀로 재단할 수 없는 독자적 가치를 지닙니다.", "kind": "pos"}, {"id": 165, "book": "고린도전서", "sub": "파벌 논쟁", "tag": "", "n": 1, "stem": "고린도전서 1-4장에 묘사된 교회 안의 분열(파벌) 소식의 전달 경위 및 인물 정황에 대한 설명으로 맞지 않는 것은?", "opts": ["바울은 고린도전서 1:11에서 '글로에의 사람들'을 통해 교회 내부의 다툼과 분열 소식을 직접 들었다고 언급한다.", "바울은 서신 결미(고전 16:15-18)에서 스데바나와 그의 동역자들을 언급하지만, 1-4장의 분쟁 소식 출처로는 '글로에의 사람들'만을 명시한다.", "스데바나는 고린도전서 1-4장에 묘사된 논쟁에서 바울 자신을 적극 지지하며 반대파에 맞선 핵심 주동자였다.", "글로에의 사람들은 서신의 결미 부분에서는 더 이상 언급되지 않는다."], "ans": [3], "exp": "스데바나는 고린도전서 1-4장에 묘사된 논쟁에서 바울 자신을 지지하는 역할을 하지 않았으며, 바울은 오직 '글로에의 사람들'을 통해서만 교회 공동체 내부의 다툼에 관해 들었다고 기술합니다. (스데바나와 동역자들은 교회 공동체와의 접촉을 위해 편지를 쓰고 있는 동안 바울을 방문함).", "kind": "neg"}, {"id": 166, "book": "고린도전서", "sub": "파벌 논쟁", "tag": "", "n": 2, "stem": "고린도전서 1:12에 등장하는 4개 파벌과 '그리스도파'에 대한 바울의 대응으로 맞지 않는 것은?", "opts": ["고린도 교회 안에는 리더의 이름에 따라 바울파, 아볼로파, 게바파, 그리스도파 등 네 그룹이 존재했다(고전 1:12).", "\"나는 그리스도에게 속했다(ἐγὼ δὲ Χριστοῦ)\"라는 표현은 네 번째 그룹인 '그리스도파'가 존재했음을 가리킨다.", "바울은 다른 파벌들을 무력화하기 위해 자신을 '그리스도파'의 총수이자 대표자로 적극 내세워 기선제압을 시도했다.", "바울이 그리스도 슬로건을 거의 끌어들이지 않은 이유는, 그럴 경우 그리스도를 게바, 아볼로, 바울 자신과 동급의 파벌 리더로 취급하게 되기 때문이다."], "ans": [3], "exp": "바울은  "고전 1-4장은 고린도 교인의 지혜 추구와 그룹 귀속성(파벌)의 문제를 십자가 신학을 통해 상대화하는 독립적·일관된 문단이다.", "바울은 교회의 통일성을 강조하며 그리스도가 교회의 유일한 기초이자 건축자임을 선포한다(고전 3:11).", "고전 1:10-4:21 문단은 바울 사후 영지주의자에 의해 완전히 위조되어 첨가된 사족으로 판정되었다."], "ans": [1, 2, 3], "exp": "고전 1:10-4:21은 문학적으로 분리될 수 없는 일관된 통일성을 지닌 단락이며, 십자가 신학을 통해 파벌 갈등과 자랑을 교정하는 핵심 본문입니다.", "kind": "pos"}, {"id": 171, "book": "고린도전서", "sub": "파벌 논쟁", "tag": "", "n": 7, "stem": "고린도 교회의 파벌 형성에 영향을 미친 종교사적·사회적 배경에 대한 학계의 평가로 맞지 않는 것은?", "opts": ["그리스 철학 및 수사학 전통(교사와 학생 사이의 친밀한 관계, 학파 간 경쟁)이 파벌 형성에 영향을 주었을 가능성이 있다.", "고린도 교회의 파벌 갈등은 단 하나의 단순한 종교사적 원인(monokausal)만으로 설명될 수 없다.", "다양한 가정교회로의 분화와 사회적 계층(상류 계층과 하층민) 간의 차이가 그룹 형성 및 갈등을 촉진시켰다.", "학계에서는 고린도 교회의 파벌 갈등이 오직 로마 황제의 직령에 의해 조작된 인공적 정치 공작이었다는 데 완전 합의했다."], "ans": [4], "exp": "고린도 교회의 파벌 형성은 단일 원인(monokausal)이 아닌 사회적 계층 차이, 가정교회 분화, 세례의 소속성, 헬라적 지혜 전통 등 복합적인 이유에서 비롯된 고린도 교인들의 독자적 성취 및 갈등으로 이해됩니다.", "kind": "neg"}, {"id": 172, "book": "고린도전서", "sub": "", "tag": "", "n": 1, "stem": "고린도전서의 저자, 외적 증언 및 가치에 대한 설명으로 맞지 않는 것은?", "opts": ["고린도전서의 바울 저작설은 학계에서 의심의 여지가 없는 확고한 사실이다.", "클레멘스1서(47:1-3) 저자는 고린도 교인들에게 이 서신을 상기시킨다.", "안디옥의 이그나티우스는 고린도전서를 최소 네 번 이상 인용 및 언급했다(IgnRöm 5:1, IgnEph 18:1 등).", "무라토리 경전은 고린도전서를 바울 서신 목록에서 전면 배제하고 후대의 위작으로 격하했다."], "ans": [4], "exp": "무라토리 경전은 고린도전서를 바울의 서신으로 간주했으며, 고린도전서는 초기 교회에서 그 가치가 매우 높게 평가받았습니다.", "kind": "neg"}, {"id": 173, "book": "고린도전서", "sub": "", "tag": "", "n": 2, "stem": "고린도전서의 기록 장소, 시기 및 연대에 대한 설명으로 맞지 않는 것은?", "opts": ["에베소(고전 16:8)에서 부활절 즈음에 기록되었을 것이다.", "바울의 사도 여행 계획(고전 16:5-8)에 따르면 에베소 체류 마지막 해 또는 체류 직전에 작성되었다.", "다수의 현대 학자들은 고린도전서가 바울의 1차 선교 여행 직전인 기원후 40년대 초반에 기록된 가장 오래된 서신이라고 확증한다.", "고린도전서 연대는 기원후 54년 또는 55년 봄으로 추정하는 것이 일반적이다."], "ans": [3], "exp": "고린도전서는 기원후 54년 또는 55년 봄(에베소 체류 시기)에 작성된 서신입니다.", "kind": "neg"}, {"id": 174, "book": "고린도전서", "sub": "", "tag": "", "n": 3, "stem": "고린도(Corinth)시의 역사적·지정학적 배경 및 종교적 상황에 대한 설명으로 맞지 않는 것은?", "opts": ["카이사르(Julius Caesar)는 기원전 44년에 고린도를 퇴역군인들을 위한 로마 식민도시로 새로 건설했다.", "겐그레아와 레기옴 항구를 끼고 있어 아시아와 로마/그리스 사이의 경제적·무역 중심지 역할을 했다.", "고린도 북부 지역에서는 고전 8-10장의 우상 제물 문제를 설명하는 아스클레피오스(Asklepios) 신전이 발굴되었다.", "고린도는 유대교 유일신교만 허용된 엄숙주의 도시였으며, 헬라적·동양적 제의나 이스미스 경기는 완전히 금지되었다."], "ans": [4], "exp": "고린도에는 디오니소스, 이시스, 세라피스 등 다수의 헬라적·동양적 제의와 황제 숭배가 공존했으며, 올림픽 다음가는 이스트미아 경기의 개최 장소였습니다.", "kind": "neg"}, {"id": 175, "book": "고린도전서", "sub": "", "tag": "", "n": 4, "stem": "고린도 교회의 교인 구성 및 사회적 계층에 대한 설명으로 올바른 것은?", "opts": ["교인의 다수는 과거 이방인 출신이었다(고전 12:2).", "높은 관직에 있던 에라스도(롬 16:23)와 회당장 그리스보(고전 1:14) 등 부유한 그리스도인들도 존재했다.", "고린도 교인 전체는 사회적 상류층 귀족들로만 구성되었으며 하층민이나 노예는 단 한 명도 없었다.", "교인의 상당수는 하층민과 사회적 약자에 속했다(고전 1:26, 7:21, 11:22b)."], "ans": [1, 2, 4], "exp": "고린도 교회는 상류 계층과 하층민, 노예들이 함께 섞여 있는 복합적인 사회적 구조를 지니고 있었습니다.", "kind": "pos"}, {"id": 176, "book": "고린도전서", "sub": "", "tag": "", "n": 5, "stem": "고린도전서 1-4장에 나타나는 '교회 안의 분열'과 파벌에 대한 설명으로 맞지 않는 것은?", "opts": ["교인들은 각 리더의 이름에 따라 바울파, 아볼로파, 게바파, 그리스도파로 나뉘어 경쟁했다(고전 1:12).", "바울은 글로에의 사람들을 통해 교회 내부의 다툼과 파벌 형성 소식을 들었다(고전 1:11).", "바울은 자신이 직접 고린도에 '그리스도파'를 창설하여 다른 파벌들을 무력으로 도륙할 것을 명령했다.", "바울은 그리스도 안에서 세워지고 세례에 합당한 교회의 통일성을 강조하며 분열에 대응했다."], "ans": [3], "exp": "바울은 스스로 그리스도 슬로건을 이끌어들이지 않으며, 오직 그리스도만이 교회의 기초이자 통일성의 근거임을 선포합니다.", "kind": "neg"}, {"id": 177, "book": "고린도전서", "sub": "", "tag": "", "n": 6, "stem": "고린도전서에 등장하는 서신 양식적 특징인 '...에 관하여(peri de)' 구절과 내용의 연결이 맞지 않는 것은?", "opts": ["고전 7:1 - 결혼과 미혼에 관하여", "고전 8:1 - 우상의 제물에 관하여", "고전 12:1 - 영적 은사에 관하여", "고전 16:1 - 약한 자들의 사회적 권리에 관하여"], "ans": [4], "exp": "고전 16:1은 '약한 자들'이 아니라 '예루살렘 성도를 위한 모금에 관하여' 교회가 물어본 질문에 응답하는 구절입니다.", "kind": "neg"}, {"id": 178, "book": "고린도전서", "sub": "", "tag": "", "n": 7, "stem": "고린도전서 1-4장의 '십자가 신학(Theologia Crucis)'에 대한 설명으로 올바른 것은?", "opts": ["십자가의 말씀(logos tou staurou)은 인간의 지혜와 자만을 상대화하고 하나님의 능력을 드러낸다.", "십자가는 인간 각자의 자기주장과 구원 노력을 의심스럽게 만들고 오만한 지혜를 폐기한다.", "바울은 헬라 수사학의 화려한 웅변술과 세속적 지혜를 적극 채택하여 십자가의 수치스러운 고난을 은폐했다.", "복음 진리의 기준은 인간의 지혜에 있지 않으며, 바울은 믿음의 정체성을 십자가에 고정시켰다."], "ans": [1, 2, 4], "exp": "바울은 세상의 지혜나 화려한 수사학적 웅변이 아니라, 유대인에게는 걸림돌이요 이방인에게는 미련한 '십자가에 못 박힌 그리스도'를 선포합니다.", "kind": "pos"}, {"id": 179, "book": "고린도전서", "sub": "", "tag": "", "n": 8, "stem": "고린도전서 5-6장에 나타난 교회 내부의 윤리적 남용과 법정 송사 문제에 대한 설명으로 맞지 않는 것은?", "opts": ["고전 5장은 아버지의 아내를 취한 근친상간 음행 문제를 다루고 출교를 명한다.", "고전 6:1-11은 교인 간의 민사 소송을 이방인의 불의한 법정으로 가져가는 행위를 비판한다.", "바울은 성매매에 대해 \"모든 것이 내게 허용된다\"라는 고린도 교인의 슬로건을 무조건적으로 칭송하고 권장했다.", "바울은 몸이 성령의 전이며 그리스도의 지체이므로 음행을 피하고 하나님께 영광을 돌리라고 가르친다."], "ans": [3], "exp": "\"모든 것이 내게 허용되나(panta moi exestin)\"는 고린도 교인들의 방종적 슬로건이며, 바울은 이를 받아들이면서도 \"다 유익한 것이 아니요 매이지 아니하리라\"라며 몸의 거룩함을 강조합니다.", "kind": "neg"}, {"id": 180, "book": "고린도전서", "sub": "", "tag": "", "n": 9, "stem": "고린도전서 8-10장의 '우상에게 바쳐진 제물' 논쟁에 대한 설명으로 올바른 것은?", "opts": ["'강한 자들'은 우상이 아무것도 아니라는 지식을 이유로 우상 제물을 자유롭게 먹었다.", "'약한 자들'은 우상에 대한 두려움이나 양심의 가책 때문에 제물 먹는 것을 주저했다.", "바울은 지식을 가진 '강한 자'의 권리와 자유가 약한 자의 양심을 상하게 하더라도 무조건 강행되어야 한다고 보았다.", "바울은 자기가 가진 자유와 권리를 스스로 제한하는 사랑의 원칙을 윤리의 기준으로 제시 한다(고전 9:1-23, 10:23-24)."], "ans": [1, 2, 4], "exp": "바울은 지식은 자랑하게 하나 사랑은 덕을 세우므로, 약한 형제의 양심에 걸림돌이 되지 않도록 자신의 자유를 포기하고 제한하는 사랑을 권면합니다.", "kind": "pos"}, {"id": 181, "book": "고린도전서", "sub": "", "tag": "", "n": 10, "stem": "고린도전서 11:17-34의 '주의 만찬(Herrenmahl)'에 대한 설명으로 맞지 않는 것은?", "opts": ["초기 교회에서는 성례전과 애찬(공동식사)이 하나로 결합되어 있었다.", "부유한 자들이 먼저 와서 호식하고 술에 취하는 동안 가난한 성도들은 굶주림으로써 교회 안에 빈부 차이와 분열이 드러났다.", "바울은 부유한 교인들만의 특권적 애찬 독점을 칭찬하고, 가난한 교인들을 예배당에서 전면 쫓아낼 것을 명했다.", "주의 몸을 분변하지 못하고 모욕하는 자는 자신의 죄를 먹고 마시는 심판을 받게 된다고 경고한다."], "ans": [3], "exp": "바울은 가난한 자들을 부끄럽게 하고 교회를 업신여기는 부유한 자들의 독점적 만찬 행위를 강하게 비판하며, 주의 만찬 전승(11:23b-26)을 끌어와 분변할 것을 호소합니다.", "kind": "neg"}, {"id": 182, "book": "고린도전서", "sub": "", "tag": "", "n": 11, "stem": "고린도전서 12-14장의 '영적 은사'와 '사랑(13장)'에 대한 설명으로 올바른 것은?", "opts": ["다양한 은사는 한 성령으로부터 나온 것이며, 교회의 통일성과 공동체의 유익(oikodomē)을 위해 주어졌다.", "고전 12:27의 \"너희는 그리스도의 몸이요 각 부분의 지체라\"는 교회론의 핵심 이미지이다.", "고전 13장의 사랑은 자기 과시나 이기주의의 반대로서 모든 은사의 오용을 교정하는 가장 좋은 길(hyperbolēn hodon)이다.", "고전 14장에서 바울은 방언보다 알아듣기 쉬운 예언이 교회를 세우는 데 더 유익하다고 가르친다."], "ans": [1, 2, 3, 4], "exp": "4개 지문 모두 은사의 다양성과 몸의 통일성, 13장 사랑의 우위성, 14장의 교회 세움의 원칙을 바르게 설명하고 있습니다.", "kind": "pos"}, {"id": 183, "book": "고린도전서", "sub": "", "tag": "", "n": 12, "stem": "고린도전서 15장의 '죽은 자의 부활'과 '영적 몸'에 대한 설명으로 맞지 않는 것은?", "opts": ["고린도 교회 일부 사람들은 \"죽은 자 가운데서 부활이 없다\"라고 주장했다(고전 15:12).", "바울은 그리스도의 부활이 잠 자는 자들의 첫 열매(aparche)임을 선포한다.", "바울은 부활을 육체와 완전히 무관한 영지주의적 탈출로 보며, 미래적 부활체와 몸의 변형(sōma pneumatikon)을 전면 부정했다.", "고전 15:29의 \"죽은 자들을 위해 세례를 받는 자들\"은 죽음을 극복하는 세례의 구원론적 능력을 예증한다."], "ans": [3], "exp": "바울은 썩을 몸이 썩지 아니할 몸으로, 자연적인 몸(sōma psychikon)이 신령한 몸(sōma pneumatikon)으로 변화함을 강조하며 미래적 부활을 변호합니다.", "kind": "neg"}, {"id": 184, "book": "고린도전서", "sub": "", "tag": "", "n": 13, "stem": "고린도전서에 반영된 '바울 이전 전승(Pre-Pauline Traditions)' 구절과 연결이 바르지 않은 것은?", "opts": ["고전 1:30, 6:11 - 세례와 신앙고백 전승 (\"지혜와 의로움과 거룩함과 구원함\")", "고전 8:6 - 철학적 유일신론과 그리스도 중재 고백 전승 (\"한 하나님과 한 주 예수 그리스도\")", "고전 9:14 - 사도의 자급자족 노동을 전면 금지하고 구걸을 명하는 모세 율법 전통", "고전 15:3b-5 - 그리스도의 죽음, 매장, 부활, 현현에 관한 신앙고백 공식"], "ans": [3], "exp": "고전 9:14의 전승은 \"복음 전하는 자들이 복음으로 말미암아 살리라\"라는 주의 명령 전승이며, 9:1-23 전체에서 바울은 자신의 사도적 권리를 스스로 포기했음을 보여줍니다.", "kind": "neg"}, {"id": 185, "book": "고린도전서", "sub": "", "tag": "", "n": 14, "stem": "고린도전서의 '문학적 통일성'과 '분할가설(Divided Letters)'에 대한 설명으로 맞지 않는 것은?", "opts": ["J. 바이스(J. Weiß), 딩클러, 솅크, 클라우크, 젤린 등은 고린도전서가 여러 독립된 편지 모음이라고 보았다.", "슈미탈스(W. Schmithals)는 고린도전후서를 무려 13통의 독립된 편지 파편으로 분할했다.", "메르크라인(H. Merklein)과 뤼어만(D. Lührmann)은 분할가설이 완벽히 입증되었으므로 고린도전서를 10개의 독립된 책으로 잘라 읽어야 한다고 주장했다.", "슈넬레(U. Schnelle)와 최근 주석가들은 고린도전서가 수사학적·신학적으로 일관된 통일성을 지닌 서신이라고 평가한다."], "ans": [3], "exp": "메르크라인과 뤼어만은 방법론적 관점을 명확히 고려하여 고린도전서의 독자적인 문학적 통일성을 강력히 증명하고 옹호한 학자들입니다.", "kind": "neg"}, {"id": 186, "book": "고린도전서", "sub": "", "tag": "", "n": 15, "stem": "고린도전서 본문 안의 '후대 주해/삽입(Nachpaulinische Glosse)' 논쟁 구절로 언급되는 본문은?", "opts": ["고전 6:14 - 하나님이 주를 살리셨고 우리를 살리시리라 (미래 시제 부활 진술)", "고전 14:33b-36 - 여자는 교회에서 잠잠하라 (예배 시 여성 침묵 요구)", "고전 13:13 - 그런즉 믿음, 소망, 사랑 이 세 가지는 항상 있을 것인데", "고전 1:1-3 - 서신 서두 인사말"], "ans": [1, 2], "exp": "고전 6:14(15:51-52의 부활 진술과의 시제 긴장)와 고전 14:33b-36(11:5의 여성의 능동적 기도/예언 허용과의 충돌)은 학계에서 바울 사후에 첨가된 후대 주해(Glosse / Interpolation) 가설로 자주 논의되는 구절들입니다.", "kind": "pos"}, {"id": 187, "book": "고린도전서", "sub": "", "tag": "", "n": 16, "stem": "고린도 교회의 '적대자' 및 종교사적 분류(영지주의 논쟁)에 대한 설명으로 맞지 않는 것은?", "opts": ["뤼트거트(W. Lütgert)와 슈미탈스(W. Schmithals)는 고린도 교회의 대적자들을 영지주의자로 파악했다.", "현대 성서학계는 고린도전서 작성 당시에 이미 완결된 2세기 영지주의 구원자 신화 체계가 완벽히 존재했음을 확증했다.", "젤린(G. Sellin)과 베츠(H. D. Betz) 등은 고린도 교인의 사고가 헬라적 유대교 지혜신학의 영향을 받은 것으로 보았다.", "고린도 교인의 영적 열광주의 현상은 종교사적으로 단일한 원인(monokausal)만으로 설명될 수 없다."], "ans": [2], "exp": "2세기 영지주의 텍스트로부터 재구성된 구원자 신화 모델이 고린도전서 저작 당시에 어떻게 존재했는지는 매우 의문스러우며, 이원론적 인간론을 영지주의 영향으로 단정하기는 어렵습니다.", "kind": "neg"}, {"id": 188, "book": "고린도전서", "sub": "", "tag": "", "n": 17, "stem": "고린도 교인들의 '완료된 종말론(Over-realized Eschatology)'과 열광주의에 대한 설명으로 올바른 것은?", "opts": ["그들은 세례 시에 영을 받음으로써 구원이 이미 완료되었고 이미 왕 노릇 하고 있다고 믿었다(고전 4:8).", "그들은 육체적 실존과 종교적 규범으로부터 해방되었다고 느꼈다.", "바울은 교인들의 완료된 종말론을 환영하며, 미래의 부활이나 종말적 심판은 전적으로 불필요하다고 동의했다.", "바울은 완료의 시제를 종말로 넘겨 현재와 미래를 바꾼 교인들에 맞서, 종말의 결정된 질서와 미래적 부활을 강조한다."], "ans": [1, 2, 4], "exp": "바울은 이미 완성되었다고 착각하는 교인들의 과도한 영적 열광주의를 경고하고, 재림 시에 비로소 완성될 미래적 부활체로의 변화를 가르칩니다.", "kind": "pos"}, {"id": 189, "book": "고린도전서", "sub": "", "tag": "", "n": 18, "stem": "고린도전서 15:56 구절과 바울 서신 간의 신학적 관계에 대한 설명으로 맞지 않는 것은?", "opts": ["\"사망이 쏘는 것은 죄요 죄의 권능은 율법이라\"라는 구절이 등장한다.", "고린도전서에는 갈라디아서나 로마서의 핵심 주제인 '율법의 행위와 대립되는 칭의론'이 본문 전체에 본격적으로 전개되지 않는다.", "고린도전서 15:56 구절은 바울이 율법을 완전한 구원의 유일한 공로로 복귀시켰음을 증명하는 핵심 증거이다.", "고전 15:56은 갈라디아서와 로마서로 이어지는 바울 율법 논의의 향후 방향을 암시하는 계기(stachel) 역할을 한다."], "ans": [3], "exp": "고전 15:56은 율법이 죄의 권능으로 작동할 수 있음을 단편적으로 가리키며, 이후 갈라디아서와 로마서에서 맹렬하게 수면 위로 올라올 칭의론과 율법 논의의 방향을 암시합니다.", "kind": "neg"}, {"id": 190, "book": "고린도전서", "sub": "", "tag": "", "n": 19, "stem": "고린도전서의 최근 연구 경향(사회역사적, 수사학적, 파피루스학적 접근)에 대한 설명으로 맞지 않는 것은?", "opts": ["미첼(M. M. Mitchell)은 고린도전서를 정치적 수사학을 배경으로 한 '화합과 재화해의 서신'으로 해석했다.", "타이센, 람페, 윈터 등은 고린도 교회의 갈등을 계층 간의 사회적·문화적 차이와 세속 윤리 의 고수에서 설명했다.", "파피루스학적 연구는 고린도전서의 사회적·경제적·법률적 문제들을 이해하는 데 아무런 신학적 도움을 주지 못한다고 배격된다.", "아르츠-그라브너(P. Arzt-Grabner) 등은 파피루스 문헌 비교를 통해 고린도전서의 법률적·사회적 용어들을 깊이 있게 규명했다."], "ans": [3], "exp": "파피루스학적 비교 연구(아르츠-그라브너 등)는 고린도전서의 수많은 사회적, 경제적, 법률적 문제와 당대 일상 언어를 더 깊이 이해하는 결정적 계기를 제공합니다.", "kind": "neg"}, {"id": 191, "book": "고린도전서", "sub": "", "tag": "", "n": 20, "stem": "고린도전서 전체를 관통하는 교회론의 핵심 개념과 목표에 대한 설명으로 올바른 것은?", "opts": ["그리스도는 교회의 기초이자 건축자이며, 현재하는 주님이다.", "교회의 통일성은 은사의 다양성 안에서 '그리스도의 몸(sōma Christou)'으로 명시된다.", "모든 영적 은사는 교회의 세움과 무관하게 개인의 영적 우월성을 과시하고 경쟁하기 위해 사용되어야 한다.", "모든 은사는 개인적 자기주장이 아니라 교회를 세우는 일(oikodomē)에 기여해야 한다."], "ans": [1, 2, 4], "exp": "바울에게 은사는 개인의 자기과시나 신령함의 자랑이 아니라, 오직 사랑 안에서 교회를 세우고(14:3-5, 12, 26) 그리스도의 몸의 통일성을 지키기 위해 봉사하는 것입니다.", "kind": "pos"}, {"id": 192, "book": "고린도후서", "sub": "", "tag": "", "n": 1, "stem": "고린도후서의 저자 및 외적 증언에 대한 설명으로 맞지 않는 것은?", "opts": ["고린도후서의 진정성은 19세기 과잉 비판 이후 현대 학계에서는 의심받지 않는 확고한 사실이다.", "고린도후서에 대한 가장 오랜 외적 반응(고후 9:12)은 클레멘스1서 38:2에 나타난다.", "고린도후서는 2세기 초 마르키온에 의해 완전히 위조 문서로 규명되어 정경 목록에서 전면 삭제되었다.", "2세기 후반 이레네우스, 테르툴리아누스, 클레멘스 등 주요 교부들은 고린도후서를 바울의 친서로 명확히 인용했다."], "ans": [3], "exp": "고린도후서는 19세기 일부 학자의 비판을 제외하고는 저작권에 대한 의심이 없으며, 클레멘스1서(38:2) 등 초기 문헌부터 바울의 친서로 지속적으로 받아들여졌습니다.", "kind": "neg"}, {"id": 193, "book": "고린도후서", "sub": "", "tag": "", "n": 2, "stem": "고린도후서의 작성 장소, 시기 및 연대에 대한 설명으로 맞지 않는 것은?", "opts": ["고린도후서는 기원후 55년 늦가을 마게도냐에서 작성된 것으로 추정된다.", "바울은 에베소를 떠나 드로아를 거쳐 마게도냐로 건너가 그곳에서 디도를 만났다(고후 2:12-13, 7:5-6).", "바울은 고린도후서를 고린도 현지 회당에서 작성하여 로마 교회의 사도들에게 공식 발송했다.", "고린도 서신들 사이에는 약 1년 반(또는 1년) 정도의 시차가 고려되어야 한다."], "ans": [3], "exp": "바울은 에베소를 출발하여 드로아를 거쳐 마게도냐에 이르렀고, 그곳에서 디도로부터 고린도 교회의 좋은 소식을 들은 후 마게도냐에서 고린도후서를 작성했습니다.", "kind": "neg"}, {"id": 194, "book": "고린도후서", "sub": "", "tag": "", "n": 3, "stem": "고린도후서의 수신자 범위와 지역적 성격에 대한 설명으로 올바른 것은?", "opts": ["고린도후서는 고린도 교회뿐만 아니라 '아가야에 있는 모든 성도'를 위해 기록되었다(고후 1:1).", "수신자 그룹이 지역 교회(고린도)와 아가야 전체 성도로 이중 확장됨에 따라 편지의 성격도 영향을 받는다.", "바울은 아가야 지역 교회를 배격하고 오직 예루살렘의 모교회 성도들만을 단독 수신자로 지정했다.", "아가야 지역 교회들을 향한 보편적 호소는 8장과 9장의 모금 권면에서도 중요하게 작동한다."], "ans": [1, 2, 4], "exp": "고린도후서 1:1은 \"고린도에 있는 하나님의 교회와 온 아가야에 있는 모든 성도에게\" 문안하여 수신자가 아가야 전체 지역 성도로 확장되어 있습니다.", "kind": "pos"}, {"id": 195, "book": "고린도후서", "sub": "", "tag": "", "n": 4, "stem": "고린도전서와 고린도후서 사이에 발생한 일련의 사건 경과로 맞지 않는 것은?", "opts": ["에베소에서 고린도로 직접 건너간 사도의 '중간 방문(고후 12:14, 13:1)'이 있었다.", "중간 방문 동안 바울은 고린도 교회의 어떤 구성원(행악자)으로부터 공공연한 상처와 모욕을 받았다(고후 2:3-11, 7:8-12).", "바울은 상처를 받은 직후 고린도 교인들을 단칼에 끊어내고 가이사랴 감옥으로 피신하여 사도직을 완전히 사임했다.", "에베소로 돌아온 바울은 디도를 편지 전달자로 삼아 근심과 눈물로 '눈물의 편지(고후 2:3-4, 7:8)'를 썼다."], "ans": [3], "exp": "바울은 중간 방문에서 교회의 모욕으로 상처를 입고 성급히 에베소로 돌아온 후, 회개와 화해를 촉구하는 '눈물의 편지'를 써서 디도 편에 전달했습니다.", "kind": "neg"}, {"id": 196, "book": "고린도후서", "sub": "", "tag": "", "n": 5, "stem": "고린도후서의 서문 및 머리말 구조(1:1-2:17)에 대한 설명으로 맞지 않는 것은?", "opts": ["서두 인사말(1:1-2)에 이어 1:3-7의 머리말이 나타난다.", "고린도후서 1:3-7의 머리말은 바울서신의 일반적인 감사말(eucharistein) 형식으로 시작한다.", "머리말 1:3-7은 감사말 대신 \"찬송하리로다(eulogētos)\" 송영 형식으로 끌어가며 환난과 위로의 하나님을 찬양한다.", "고린도후서 1:8-2:17 단락에서는 사도의 자기소개 및 여정 계획 변경에 대한 변호 요소가 발견된다."], "ans": [2], "exp": "고린도후서 1:3-7 머리말은 일반적인 감사말(eucharistein)이 아니라 송영 형태인 \"eulogētos(찬송하리로다)\"로 시작하여 고난 가운데 임하는 하나님의 위로를 선포합니다.", "kind": "neg"}, {"id": 197, "book": "고린도후서", "sub": "", "tag": "", "n": 6, "stem": "고린도후서에 인용된 '바울 이전 전승(Pre-Pauline Traditions)' 구절이 아닌 것은?", "opts": ["\"하나님이 우리를 너희와 함께 그리스도 안에서 견고하게 하시고 우리에게 기름을 부으신 이는 하나님이시니 그가 또한 우리에게 인치시고 보증으로 우리 마음에 성령을 주셨느니라\" (고후 1:21-22)", "\"이스라엘 자손들은 모세의 얼굴의 없어질 영광 때문에도 그 얼굴을 주목하지 못하였다\" (고후 3:7 이하)", "\"내 육체에 가시 곧 사탄의 사자를 주셨으니 이는 나를 쳐서 너무 자만하지 않게 하려 하심이라\" (고후 12:7)", "\"하나님께서 그리스도 안에 계시사 세상을 자기와 화목하게 하시며\" (고후 5:19a)"], "ans": [3], "exp": "고후 12:7의 '육체의 가시' 언급은 바울 개인의 자백적 섭리 고백이며, 바울 이전에 교회에 전해진 신앙고백 전승 문구가 아닙니다.", "kind": "neg"}, {"id": 198, "book": "고린도후서", "sub": "", "tag": "", "n": 7, "stem": "고린도후서에 나타난 사도직의 본질과 '역설적 실존'에 대한 설명으로 맞지 않는 것은?", "opts": ["사도의 봉사는 그리스도가 고난을 통해 영광을 성취한 것처럼 영광(고후 3:7-4:6)과 고난(4:7-5:10)을 모두 포괄한다.", "사도의 봉사는 예수 그리스도의 고난을 완전히 배제하고 오직 외적 승리와 기적의 영광만을 강조한다.", "사도는 고난 목록(peristaseis: 고후 4:7-12, 6:4-10, 11:23-29)을 통해 약함 속에 거하는 그리스도의 능력을 드러낸다.", "\"우리가 이 보배를 질그릇에 가졌으니 이는 심히 큰 능력은 하나님께 있고 우리에게 있지 아니함을 알게 하려 함이라\" (고후 4:7)."], "ans": [2], "exp": "바울의 사도직관은 고난을 배제한 영광주의가 아니라, 영광과 고난을 동시에 포괄하며 약함 속에서 역사하는 부활 그리스도의 능력을 보여주는 역설적 실존입니다.", "kind": "neg"}, {"id": 199, "book": "고린도후서", "sub": "", "tag": "", "n": 8, "stem": "고린도후서 3장의 '새 언약의 일꾼'과 율법 이해에 대한 설명으로 올바른 것은?", "opts": ["율법 조문(글자)은 죽이는 것이요 성령(영)은 살리는 것이다(고후 3:6).", "모세의 율법 영광은 사라질 영광이었으나, 성령으로 말미암는 새 언약의 영광은 더욱 영원하다(고후 3:7-11).", "바울은 돌비석에 새겨진 구약 율법 준수만이 인간을 무죄 판결로 이끄는 유일한 구원의 길이라고 강조했다.", "주의 영이 계신 곳에는 자유가 있으며, 우리는 수건을 벗은 얼굴로 주의 영광을 본다(고후 3:17-18)."], "ans": [1, 2, 4], "exp": "3장에서 조문(글자)은 죄인을 심판하고 죽이지만, 그리스도 안에서 성령으로 쓰여진 마음의 비석과 새 언약은 성도를 자유하게 하고 살립니다.", "kind": "pos"}, {"id": 200, "book": "고린도후서", "sub": "", "tag": "", "n": 9, "stem": "고린도후서 5:12-21의 '화해(Katallagē)' 사상에 대한 설명으로 맞지 않는 것은?", "opts": ["누구든지 그리스도 안에 있으면 새로운 피조물이며 이전 것은 지나가고 새 것이 되었다(고후 5:17).", "화해는 인간이 스스로의 구원 성취와 공로를 하나님께 바침으로써 하나님의 분노를 달래는 자력 구원 행동이다.", "하나님이 그리스도를 통하여 세상을 자기와 화목하게 하셨으며, 사도에게 화목하게 하는 말씀과 직책을 위임하셨다(고후 5:18-19).", "\"하나님이 죄를 알지도 못하신 이를 우리를 대신하여 죄로 삼으신 것은 우리로 하여금 그 안에서 하나님의 의가 되게 하려 하심이라\" (고후 5:21)."], "ans": [2], "exp": "화해는 인간의 공로가 아니라, 하나님 편에서 그리스도의 십자가 사건을 통해 선사하신 은혜의 구원 행위입니다.", "kind": "neg"}, {"id": 201, "book": "고린도후서", "sub": "", "tag": "", "n": 10, "stem": "고린도후서 8-9장의 예루살렘 성도를 위한 '모금(Diakonia)'에 대한 설명으로 올바른 것은?", "opts": ["바울은 극심한 가난과 시련 속에서도 풍성한 연보를 바친 마게도냐 교회들의 모범을 제시한다(고후 8:1-5).", "디도와 동역자 형제들이 모금 사역을 성사시키기 위해 고린도로 파송된다(고후 8:6, 16-24).", "바울은 교인들의 호주머니에서 모금액을 강제로 갈취하기 위해 사법적 위협과 폭력을 행사했다.", "모금의 윤리적 원칙으로 '균등(isotēs)'의 원리(고후 8:14)와 즐겨 내는 자를 사랑하시는 하나님의 은혜를 강조한다."], "ans": [1, 2, 4], "exp": "바울은 모금을 억지나 강요가 아니라 자발적인 사랑의 응답과 은혜의 나누어 가짐(균등의 원리)으로 권면합니다.", "kind": "pos"}, {"id": 202, "book": "고린도후서", "sub": "", "tag": "", "n": 11, "stem": "고린도후서 8장과 9장의 관계에 대한 최근 학계의 논의로 맞지 않는 것은?", "opts": ["다수의 학자들은 9:1(\"성도를 섬기는 일에 대하여는 내가 너희에게 쓸 필요가 없나니\")의 새로운 시작 때문에 9장을 독립된 아가야 회람서신 부록으로 보기도 한다.", "슈넬레 등 통일성 옹호 학자들은 고후 1:1에서 이미 아가야 전체 성도가 수신자로 언급되었으므로 9장의 언급이 자연스럽다고 본다.", "8장과 9장은 서로 완전한 교리적 모순을 일으키므로 두 장 모두 바울이 아닌 후대 유대교 비서가 위조한 가짜 본문이다.", "8장과 9장은 작년(1년 전)부터 준비된 모금이라는 공통된 시점(고후 8:10, 9:2)을 공유하며 성공적 마무리를 목표로 한다."], "ans": [3], "exp": "8장과 9장은 모금의 완성이라는 동일한 목표와 시점을 공유하며, 수사학적·목회적 목적에 따라 고린도와 아가야 성도들을 독려하는 일관된 본문입니다.", "kind": "neg"}, {"id": 203, "book": "고린도후서", "sub": "", "tag": "", "n": 12, "stem": "고린도후서에 등장하는 바울의 '적대자들'의 정체와 특징에 대한 설명으로 맞지 않는 것은?", "opts": ["적대자들은 교회 외부에서 고린도 교회 안으로 침투해 들어온 낯선 선교사들이다(고후 11:4).", "적대자들은 바울을 적극 추천하고 옹호하는 친-바울파 정통 선교사들이었다.", "그들은 유대계 출신(고후 11:22)임을 자랑스럽게 내세우고 추천서(고후 3:1)와 영적 능력, 표적과 기적을 자랑했다.", "특이하게도 율법을 뜻하는 핵심 단어인 '노모스(nomos)'는 고린도후서 본문에 단 한 번도 등장하지 않는다."], "ans": [2], "exp": "적대자들은 외부에서 들어와 바울의 사도권을 비방하고 모함하며 자신들의 환상과 영적 능력을 자랑하던 낯선 유대계 선교사들이었습니다.", "kind": "neg"}, {"id": 204, "book": "고린도후서", "sub": "", "tag": "", "n": 13, "stem": "적대자들의 공격에 맞선 바울의 반론과 '바보 연설(고후 11:16-12:13)'에 대한 설명으로 올바른 것은?", "opts": ["적대자들은 자신들을 '지극히 크다는 사도들(hyperlian apostoloi)'로 내세웠고, 바울은 이들을 '거짓 사도'로 간주했다(고후 11:5, 13, 12:11).", "적대자들은 바울이 직접 만날 때는 약하고 편지만 힘이 있다고 비난했다(고후 10:10).", "바울은 적대자들보다 더 화려한 세상 권력과 재산을 자랑하기 위해 유대 대제사장들에게 금전을 바쳤다.", "바울은 '바보 연설'을 통해 적대자들의 자랑 방식을 풍자하며, 오직 자신의 약한 것들과 십자가의 고난을 자랑한다(고후 11:30, 12:9)."], "ans": [1, 2, 4], "exp": "바울은 적대자들의 세상적 자랑에 맞서 자조적인 '바보 연설'의 수사학을 펼치며, 오직 사도의 약함과 그리스도의 능력만을 자랑합니다.", "kind": "pos"}, {"id": 205, "book": "고린도후서", "sub": "", "tag": "", "n": 14, "stem": "고린도후서 12:7-10의 '육체의 가시'와 그리스도의 능력에 대한 설명으로 맞지 않는 것은?", "opts": ["바울은 자만하지 않게 하려고 육체에 가시 곧 사탄의 사자를 받았다.", "바울은 이 가시가 떠나가기를 주께 세 번 간구하였다.", "주님은 바울의 기도를 들으시고 즉시 몸의 모든 질병과 가시를 완전히 제거하여 세상 최고의 건강체로 만들어 주셨다.", "주님은 \"내 은혜가 네게 족하도다 이는 내 능력이 약한 데서 온전하여짐이라\"라고 응답하셨다(고후 12:9)."], "ans": [3], "exp": "주님은 가시를 제거해 주신 것이 아니라 \"내 은혜가 네게 족하도다\"라고 응답하셨으며, 바울은 약함 속에 그리스도의 능력이 머무름을 깨닫고 약함을 기뻐했습니다.", "kind": "neg"}, {"id": 206, "book": "고린도후서", "sub": "", "tag": "", "n": 15, "stem": "고린도후서 6:14-7:1 본문(이방인과의 불멍에 금지)의 문학적 특성과 비평 논쟁으로 맞지 않는 것은?", "opts": ["6:14-7:1은 '메토케(metochē)', '벨리알(Beliar)', '몰리스모스(molysmos)' 등 바울 서신 전체에서 단 한 번만 나오는 특수 어휘들이 집중된다.", "사상적·언어적으로 쿰란 문헌(1QM, 1QS) 및 구약 외경(12족장의 유언서)과 매우 유사하다.", "학계의 모든 주석가들은 6:14-7:1 구절이 바울이 로마 황제에게 직접 보낸 서간의 핵심 결문이라는데 완벽히 동의한다.", "고후 6:13과 7:2가 자연스럽게 연결되기 때문에, 많은 학자들은 이 단락을 바울 사후 유대계 그리스도인에 의해 삽입된 후대 주해(Interpolation)로 본다."], "ans": [3], "exp": "6:14-7:1은 특수 어휘 및 쿰란/외경적 이원론 성격 때문에 바울 사후의 후대 삽입 구절인지, 아니면 바울이 기존 전승을 수용하여 작성한 본문인지에 대한 비평적 논쟁이 활 발한 단락입니다.", "kind": "neg"}, {"id": 207, "book": "고린도후서", "sub": "", "tag": "", "n": 16, "stem": "고린도후서의 '문학적 통일성'과 '서신 합성설(분할가설)'에 대한 설명으로 맞는 것은?", "opts": ["보른캄(G. Bornkamm)과 베츠(H. D. Betz) 등은 고린도후서가 '눈물의 편지(10-13장)', '화해의 편지(1-8장)', 모금 서신(9장) 등 여러 단편의 합성물이라고 주장했다.", "현대 주석가 전체는 고린도후서가 단 1초의 멈춤도 없이 한 자리에서 단숨에 쓰여진 완전 일치체라는데 의견이 일치한다.", "고린도후서 1-9장과 10-13장의 어조 차이는 바울이 두 편의 서로 다른 외경 복음서를 복사해 붙였기 때문이다.", "퀴멜, 보르세, 횔달, 볼프, 비어링어, 슈멜러, 바르넷 등은 상황의 변화와 목회적 수사학 구조를 근거로 고린도후서의 서신 통일성을 옹호한다."], "ans": [1, 4], "exp": "1-9장과 10-13장의 어조 차이 때문에 5개 내외의 단편 합성설(보른캄 등)이 제기되었으나, 최근의 다수 학자들은 수사학적 맥락과 서신 전체의 목회적 목표를 기반으로 통일성을 강력히 증명하고 있습니다.", "kind": "pos"}, {"id": 208, "book": "고린도후서", "sub": "", "tag": "", "n": 17, "stem": "고린도후서 13:13의 삼중적 결문(축도 구절)에 대한 설명으로 맞지 않는 것은?", "opts": ["\"주 예수 그리스도의 은혜와 하나님의 사랑과 성령의 교통하심이 너희 무리와 함께 있을지어다\"라는 삼중적 구조를 갖는다.", "신약성서 서신 결문 중 가장 완전한 삼위일체적 축도 형식을 보여준다.", "편지 서두의 위로와 소망, 그리고 사도적 화해의 선포가 서신 결미의 삼중적 축복으로 수미상응을 이룬다.", "이 구절은 4세기 니케아 공의회 학자들이 바울 서신 텍스트를 전면 삭제하고 새로 써 넣은 완전한 위조 문구임이 입증되었다."], "ans": [4], "exp": "고후 13:13의 삼중적 결문은 바울서신의 정형화된 삼중 구조를 잘 반영하는 전형적인 사도적 축도 구절입니다.", "kind": "neg"}, {"id": 209, "book": "고린도후서", "sub": "", "tag": "", "n": 18, "stem": "고린도후서 적대자들의 종교사적 모델에 대한 학자들의 견해로 맞지 않는 것은?", "opts": ["뤼트거트, 불트만, 슈미탈스는 적대자들을 자유방임적 성령주의자와 영지주의자로 보았다.", "케제만(E. Käsemann)은 적대자들을 예루살렘 최초 교회의 권위를 내세우는 유대계 선교 사들로 파악했다.", "게오르기(D. Georgi)는 적대자들이 구약 성전을 완전히 파괴하러 온 로마 제국의 비밀 정복군 장교들이었다고 보았다.", "게오르기(D. Georgi)는 적대자들을 고대 헬라 세계에 유행하던 '방랑 선지자/신적인 사람(theios anēr)' 모델로 해석했다."], "ans": [3], "exp": "게오르기(D. Georgi)는 적대자들을 구약 역사와 기적 행위를 내세우며 영적 능력을 자랑하던 헬라주의적 유대계 '방랑 선지자/신적인 사람(theios anēr)'으로 분석했습니다.", "kind": "neg"}, {"id": 210, "book": "고린도후서", "sub": "", "tag": "", "n": 19, "stem": "고린도후서의 '화해(Katallagē)' 교리의 전승사적 배경에 대한 학자들의 주장으로 올바른 것은?", "opts": ["브라이텐바흐(C. Breytenbach)는 화해 용어가 제의적 개념이 아니라 헬레니즘 정치·외교적 재화해 언어에서 유래했다고 보았다.", "호피우스(O. Hofius)는 바울의 화해 사상이 구약의 속죄 전통 및 제2이사야의 선포와 깊은 관련을 맺는다고 보았다.", "학자들 모두가 바울의 화해 교리가 오직 플라톤의 우주론 철학에서만 유일하게 나왔다는 데 완벽히 동의한다.", "화해 사상은 고린도후서에 등장하지 않으며 오직 로마서 16장에만 단 한 번 등장한다."], "ans": [1, 2], "exp": "화해 용어의 배경에 대해 브라이텐바흐는 헬레니즘 외교/사회적 재화해 언어로, 호피우스는 구약/제2이사야의 속죄 전통으로 해석하는 등 비중 있는 학술적 토론이 이어지고 있습니다.", "kind": "pos"}, {"id": 211, "book": "고린도후서", "sub": "", "tag": "", "n": 20, "stem": "고린도후서의 최근 연구 경향과 신학적 요약에 대한 설명으로 올바른 것은?", "opts": ["연구자 다수는 고린도후서의 적대자를 유대계 헬라 지역의 그리스도인으로 파악한다.", "서신 전체를 관통하는 핵심 신학 주제는 사도직의 본질, 십자가의 역설적 실존, 그리고 하나님과 교회를 향한 '화해'이다.", "최근 연구는 고린도후서가 역사적 가치가 없는 단순한 비방 유인물에 불과하다고 폄하한다.", "고린도후서 1-9장과 10-13장의 상황 변화를 시간적·목회적 맥락에서 이해하려는 노력이 성과를 거두고 있다."], "ans": [1, 2, 4], "exp": "고린도후서는 사도직의 합법성과 본질, 약함 속에 머무는 그리스도의 능력, 그리고 십자가에 근거한 화해의 소식을 선포하는 대단히 깊이 있는 서신입니다.", "kind": "pos"}, {"id": 212, "book": "갈라디아서", "sub": "", "tag": "", "n": 1, "stem": "갈라디아서의 저자 및 진정성에 대한 설명으로 맞지 않는 것은?", "opts": ["갈라디아서의 바울 저작설은 오늘날 성서학계에서 의심의 여지가 없는 확고한 사실이다.", "갈라디아서 1:1에서 바울은 사람들에게서 난 것도 아니요 사람으로 말미암은 것도 아니라고 선언하며 자신의 사도직 기원을 강력히 변호한다.", "19세기 튀빙겐 학파의 바우어(F. C. Baur)는 갈라디아서를 2세기 중반 영지주의자에 의해 작성된 위작으로 판정하여 정경성에서 전면 배격했다.", "현대 성서학자들은 갈라디아서가 사도 바울의 친서이자 그의 핵심 신학을 담은 서신이라는 데 완전히 동의한다."], "ans": [3], "exp": "F. C. 바우어(F. Chr. Baur)는 갈라디아서를 로마서, 고린도전·후서와 함께 바울의 친서이자 가장 핵심적인 4대 서신(Hauptbriefe)으로 인정한 대표적 학자입니다.", "kind": "neg"}, {"id": 213, "book": "갈라디아서", "sub": "", "tag": "", "n": 2, "stem": "갈라디아서의 수신자 및 지리적 배경(북갈라디아/지역가설 vs 남갈라디아/속령가설)에 대한 설명으로 맞지 않는 것은?", "opts": ["남갈라디아설(속령가설/지방가설)은 1차 선교여행 시 바울이 방문한 비시디아 안디옥, 이고니온, 루스드라, 더베 지역 교회를 수신자로 본다.", "북갈라디아설(지역가설)은 2차 및 3차 선교여행 시 바울이 통과한 앙키라(Ankyra), 페시누스(Pessinus) 등 내륙 켈트족 정주 지역 교회를 수신자로 본다.", "슈넬레(U. Schnelle)는 남갈라디아 지방가설이 수신자의 민족적 명칭(\"갈라디아 사람들아\", 3:1)과 사도행전의 기록에 부합하므로 이를 정설로 채택한다.", "북갈라디아 지역에는 기원후 1세기까지 유대인 공동체가 발견되지 않으며, 이는 갈라디아 교인들이 주로 이방인 그리스도인으로 구성되었음을 지지한다."], "ans": [3], "exp": "슈넬레(U. Schnelle)는 수신자 명칭, 여정의 순서, 바울의 속령 명칭 사용 습관 등을 면밀히 검토한 후 북갈라디아 지역가설을 지지합니다.", "kind": "neg"}, {"id": 214, "book": "갈라디아서", "sub": "", "tag": "", "n": 3, "stem": "갈라디아서의 기록 장소, 시기 및 연대에 대한 설명으로 올바른 것은?", "opts": ["갈라디아서는 고린도전후서 기록 이후, 로마서 작성 바로 직전인 기원후 55년 늦가을 마게도냐에서 작성되었다는 추정이 유력하다.", "카슨(D. A. Carson)과 무(D. J. Moo)는 갈라디아서를 바울의 가장 마지막 서신으로 보아 로마 감옥에서 기록되었다고 주장했다.", "갈라디아서는 바울의 1차 선교여행 도중인 기원후 40년대 초반 아라비아 광야에서 작성되었다는 것이 학계의 보편적 합의이다.", "갈라디아서와 로마서 사이의 긴밀한 사상적·언어적 접촉(3:6-25, 4:1-7 등)은 두 서신이 시간적으로 매우 가깝게 작성되었음을 반영한다."], "ans": [1, 4], "exp": "D. A. 카슨과 D. J. 무는 갈라디아서를 사도회의(기원후 48년) 이전에 기록된 바울의 가장 첫 번째 서신으로 보는 소수 견해를 제시합니다. 보편적 학계와 슈넬레는 고린도전후서 이후, 로마서 직전(기원후 55년 늦가을)에 기록된 것으로 봅니다.", "kind": "pos"}, {"id": 215, "book": "갈라디아서", "sub": "", "tag": "", "n": 4, "stem": "갈라디아서의 서신 양식적 특징과 머리말(Proōmium/감사말)에 대한 설명으로 맞지 않는 것은?", "opts": ["갈라디아서는 바울 서신의 전형적인 서두 구성 요소인 머리말(감사말/Proōmium)이 의도적으로 생략되어 있다.", "바울은 갈라디아 교인들의 흔들리지 않는 열정적 믿음에 깊이 감사하며 긴 송영의 머리말을 가장 먼저 배치했다.", "1:6(\"그리스도의 은혜로 너희를 부르신 이를 이같이 속히 떠나...\")부터 곧바로 날카로운 논쟁과 격렬한 질책으로 시작한다.", "서두 인사말(1:1-5)에서부터 바울은 자신의 사도권과 그리스도의 속죄적 죽음을 강하게 선포한다."], "ans": [2], "exp": "갈라디아서는 갈라디아 교회의 위급한 긴장 상황 때문에 바울서신 중 유일하게 머리말(감사말/Proōmium)이 생략되어 있으며, 서두 직후 곧바로 경악과 질책으로 시작합니다.", "kind": "neg"}, {"id": 216, "book": "갈라디아서", "sub": "", "tag": "", "n": 5, "stem": "베츠(H. D. Betz)가 수사학적 관점에서 분석한 갈라디아서의 문단 구조와 연결이 바르지 않은 것은?", "opts": ["1:1-5 - 서문(Präskriptum)", "1:6-11 - 입문(Exordium)", "1:12-2:14 - 설명(Narratio: 자서전적 소개)", "3:1-4:31 - 결문(Conclusio: 마감 인사)"], "ans": [4], "exp": "베츠의 수사학적 분석에 따르면 3:1-4:31은 '논증(Probatio)'에 해당하며, '결문(Conclusio)'은 6:11-18입니다.", "kind": "neg"}, {"id": 217, "book": "갈라디아서", "sub": "", "tag": "", "n": 6, "stem": "갈라디아서 1:11-2:14의 자서전적 논증과 사도권 변호에 대한 설명으로 맞지 않는 것은?", "opts": ["바울은 자신이 전한 복음이 사람의 뜻을 따라 된 것이 아니요 오직 예수 그리스도의 계시로 말미암았다고 선언한다.", "바울은 회심 후 즉시 예루살렘의 사도들을 찾아가지 않고 아라비아로 갔다가 다메섹으로 돌아갔다.", "바울은 예루살렘 사도회의(2:1-10)에서 기둥 같이 여기는 야고보, 게바, 요한으로부터 이방 선교 복음의 내용을 전면 수정·보완하라는 지시를 받았다.", "안디옥 사건(2:11-14)에서 바울은 야고보에게서 온 자들을 두려워하여 이방인과의 식탁 교제에서 물러난 게바(베드로)와 바나바의 외식을 공적으로 비판했다."], "ans": [3], "exp": "예루살렘의 기둥 사도들(야고보, 게바, 요한)은 바울에게 아무것도 더하여 준 것이 없으며, 바울에게 주신 은혜를 알고 친교의 악수를 청하였습니다(갈 2:6-9).", "kind": "neg"}, {"id": 218, "book": "갈라디아서", "sub": "", "tag": "", "n": 7, "stem": "갈라디아 교회의 예루살렘 성도를 위한 '모금(Diakonia)' 행위에 대한 설명으로 맞는 것은?", "opts": ["갈라디아 교회에서 모금 행위는 갈라디아서가 기록될 당시 이미 종결되었을 것이다.", "갈라디아 교회의 적대자들은 예루살렘 성도를 위한 모금 운동을 사도권 파문의 유일한 이유로 삼아 격렬히 논쟁했다.", "고린도전서 16:1에 지시된 갈라디아 교회의 모금은 갈라디아서의 유대교 적대자들과의 심각한 갈등 한복판에서 비로소 시작되었다.", "바울은 갈라디아서 2:10b의 모금 합의를 이행하는 것을 거부하고 예루살렘과의 모든 관계 를 끊겠다고 선언했다."], "ans": [1], "exp": "갈라디아서 2:10b의 \"가난한 자들을 기억하라는 것\"은 갈라디아서 기록 당시에 이미 수행 및 종결된 과제였으며, 모금 자체가 적대자와의 논쟁 대상은 아니었습니다.", "kind": "pos"}, {"id": 219, "book": "갈라디아서", "sub": "", "tag": "", "n": 8, "stem": "갈라디아 교회의 '적대자들(Opponents/Agitators)'의 정체와 주장에 대한 설명으로 맞지 않는 것은?", "opts": ["적대자들은 외부에서 침투해 들어온 유대계 그리스도교 선교사들(Judaizers)이다.", "그들은 아브라함에게 호소하고 창세기 17장을 가리키며 갈라디아 교인들에게 할례를 받을 것을 요구했다.", "그들은 율법과 할례뿐만 아니라 예수 그리스도의 십자가 구속 사건 전체를 완전한 허구로 부정했다.", "그들은 절기와 달과 해와 날(4:10)을 지키도록 요구하며 유대교적 삶의 방식으로 교인들을 선동했다."], "ans": [3], "exp": "적대자들은 예수를 부정하는 자들이 아니라, 그리스도를 믿는 믿음 위에 할례와 율법 준수를 추가해야 아브라함의 참된 자녀가 된다고 주장하며 십자가의 핍박을 면하려 했던 유대계 그리스도인들이었습니다.", "kind": "neg"}, {"id": 220, "book": "갈라디아서", "sub": "", "tag": "", "n": 9, "stem": "갈라디아서의 핵심 개념인 '율법의 행위(Erga nomou)'에 대한 학자들의 설명으로 맞지 않는 것은?", "opts": ["빌켄스(U. Wilckens)는 바울이 행위에 근거하여 의롭게 된 자에게 그의 의에 대해 이의를 제기했다고 본다.", "불트만(R. Bultmann)은 바울이 율법 준수를 통해 구원을 얻으려는 인간의 자기 자랑과 노력을 죄로 거절했다고 본다.", "던(J. D. G. Dunn)은 바울이 율법 전체가 아니라 민족적 정체성을 식별하는 표지(할례, 안식일, 음식법)로서의 율법의 행위를 반대했다고 본다.", "슈넬레(U. Schnelle)는 갈라디아서와 로마서의 칭의론이 고린도전서의 십자가 신학과 전혀 다르며 서로 대립한다고 본다."], "ans": [4], "exp": "슈넬레(U. Schnelle)는 갈라디아서와 로마서의 칭의론이 고린도전서의 십자가 신학과 내용상 일치하며, 칭의론이 십자가 신학의 관심을 실제로 구현한 것이라고 평가합니다.", "kind": "neg"}, {"id": 221, "book": "갈라디아서", "sub": "", "tag": "", "n": 10, "stem": "갈라디아서 3장에 나타난 아브라함 신학과 율법의 본질에 대한 설명으로 올바른 것은?", "opts": ["아브라함이 하나님을 믿으매 그것을 그에게 의로 정하셨듯이, 믿음으로 말미암은 자들이 아브라함의 자손이다(갈 3:6-7).", "율법은 아브라함에게 주신 약속보다 430년 후에 제정된 것으로서 하나님의 약속을 폐기하거나 무효화하지 못한다(갈 3:17).", "율법은 인간에게 영원한 생명을 선사하기 위해 하나님이 직접 내려주신 완전한 은혜의 구원 수단이다.", "율법은 범법함으로 말미암아 더하여진 것이며, 약속하신 자손(그리스도)이 오시기까지 초등교사(Paidagōgos) 역할을 한 것이다(갈 3:19, 24)."], "ans": [1, 2, 4], "exp": "율법은 생명을 줄 능력이 없으며(갈 3:21), 의는 율법으로 말미암지 않고 오직 약속과 믿음으로 말미암아 주어집니다.", "kind": "pos"}, {"id": 222, "book": "갈라디아서", "sub": "", "tag": "", "n": 11, "stem": "갈라디아서 4:1-11의 '초등학문(Stoicheia tou kosmou)'과 노예 상태에 대한 설명으로 맞지 않는 것은?", "opts": ["그리스도께서 오시기 전 성도들은 어렸을 때에 세상의 초등학문 아래에 있어서 종 노릇 하였다(갈 4:3).", "때가 차매 하나님이 그 아들을 보내사 율법 아래에 있는 자들을 속량하시고 아들의 명분을 얻게 하셨다(갈 4:4-5).", "성령이 우리 마음 가운데 임하셔서 하나님을 \"아바 아버지\"라 부르게 하셨으나, 성도들은 여전히 종의 신분에서 벗어날 수 없다.", "다시 약하고 천한 초등학문으로 돌아가 날과 달과 절기와 해를 지키는 것은 그리스도의 속량을 무효화하는 위험이다(갈 4:9-10)."], "ans": [3], "exp": "갈라디아서 4:7은 \"그러므로 네가 이 후로는 종이 아니요 아들이니 아들이면 하나님으로 말미암아 유업을 받을 자니라\"라고 선포합니다.", "kind": "neg"}, {"id": 223, "book": "갈라디아서", "sub": "", "tag": "", "n": 12, "stem": "갈라디아서 4:21-31의 '하갈과 사라의 비유(알레고리)'에 대한 설명으로 올바른 것은?", "opts": ["여종 하갈은 육체를 따라 난 자(이스마엘)의 어머니이며, 시내산과 현재의 예루살렘을 가리키고 종 노릇 함을 상징한다.", "자유 있는 여자 사라는 약속으로 말미암은 자(이삭)의 어머니이며, 위의 예루살렘을 가리키고 자유함을 상징한다.", "바울은 율법 아래 있고자 하는 자들에게 여종과 그 아들을 높여 신앙의 모범으로 삼으라고 권면했다.", "성도들은 여종의 자녀가 아니요 자유 있는 여자의 자녀로서 약속의 성취에 속한다(갈 4:31)."], "ans": [1, 2, 4], "exp": "바울은 성경 구절(창 21:10)을 인용하여 \"여종과 그 아들을 내쫓으라 여종의 아들이 자유 있는 여자의 아들과 더불어 유업을 얻지 못하리라\"라고 명합니다(갈 4:30).", "kind": "pos"}, {"id": 224, "book": "갈라디아서", "sub": "", "tag": "", "n": 13, "stem": "갈라디아서 5:1-12에 선포된 '그리스도인의 자유'에 대한 설명으로 맞지 않는 것은?", "opts": ["그리스도께서 우리를 자유롭게 하려고 자유를 주셨으니 다시는 종의 멍에를 메지 말아야 한다(갈 5:1).", "할례를 받는 자는 율법 전체를 행할 의무를 지게 되며, 그리스도에게서 끊어지고 은혜에서 떨어지게 된다(갈 5:2-4).", "그리스도 예수 안에서는 할례나 무할례나 오직 외적 예법과 혈통적 가문만이 효력이 있다.", "그리스도 안에서 진정한 효력을 지니는 것은 \"사랑으로 역사하는 믿음(pistis di' agapēs energoumenē)\"이다(갈 5:6)."], "ans": [3], "exp": "갈라디아서 5:6은 \"그리스도 예수 안에서는 할례나 무할례나 효력이 없으되 사랑으로써 역사하는 믿음뿐이니라\"라고 분명히 선언합니다.", "kind": "neg"}, {"id": 225, "book": "갈라디아서", "sub": "", "tag": "", "n": 14, "stem": "갈라디아서 5:16-26의 '육체의 일'과 '성령의 열매'에 대한 설명으로 올바른 것은?", "opts": ["육체의 소욕은 성령을 거스르고 성령은 육체를 거스르므로 이 둘이 서로 대적한다(갈 5:17).", "너희가 만일 성령의 인도하시는 바가 되면 율법 아래에 있지 아니한다(갈 5:18).", "성령의 열매는 사랑, 희락, 화평, 오래 참음, 자비, 양선, 충성, 온유, 절제이며 이같은 것을 금지할 법이 없다(갈 5:22-23).", "그리스도 예수의 사람들은 육체와 함께 그 정욕과 탐심을 십자가에 못 박았다(갈 5:24)."], "ans": [1, 2, 3, 4], "exp": "4개 지문 모두 갈라디아서 5:16-26에 나타난 육체와 성령의 대립, 성령의 인도하심, 성령의 9가지 열매, 그리스도인의 성화적 실존을 정확히 기술합니다.", "kind": "pos"}, {"id": 226, "book": "갈라디아서", "sub": "", "tag": "", "n": 15, "stem": "갈라디아서 6:1-10의 공동체 윤리와 '그리스도의 법'에 대한 설명으로 맞지 않는 것은?", "opts": ["범죄한 형제를 온유한 마음으로 바로잡고 자신도 돌아보아 유혹을 받을까 조심하라(갈 6:1).", "너희가 짐을 서로 지라 그리하여 그리스도의 법(ton nomon tou Christou)을 성취하라(갈 6:2).", "사람이 무엇으로 심든지 그대로 거두리니 육체를 위하여 심는 자는 썩어질 것을 거두고 성령을 위하여 심는 자는 영생을 거둔다(갈 6:8).", "선을 행하되 낙심하지 말아야 하나, 믿음의 가정들에게 선을 행하는 것은 율법 위반으로 엄격히 금지된다."], "ans": [4], "exp": "갈라디아서 6:10은 \"그러므로 우리는 기회 있는 대로 모든 이에게 착한 일을 하되 더욱 믿음의 가정들에게 할지니라\"라고 권면합니다.", "kind": "neg"}, {"id": 227, "book": "갈라디아서", "sub": "", "tag": "", "n": 16, "stem": "갈라디아서 3:26-28의 세례 전승과 구속사적 평등에 대한 설명으로 올바른 것은?", "opts": ["누구든지 그리스도와 합하기 위하여 세례를 받은 자는 그리스도로 옷 입었다(갈 3:27).", "유대인이나 헬라인이나 종이나 자유인이나 남자나 여자나 다 그리스도 예수 안에서 하나이다(갈 3:28).", "세례를 받아 그리스도인이 된 이후에도 계급적·민족적·성별 차별과 차등적 구원관은 고대 유대교 방식 그대로 유지되어야 한다.", "너희가 그리스도의 것이면 곧 아브라함의 자손이요 약속대로 유업을 이을 자이다(갈 3:29)."], "ans": [1, 2, 4], "exp": "세례를 통해 그리스도 안에서 성립된 새 생명은 유대인과 이방인, 종과 자유인, 남성과 여성 사이의 고대 사회적 차별과 장벽을 극복하고 완벽한 영적 평등을 선사합니다.", "kind": "pos"}, {"id": 228, "book": "갈라디아서", "sub": "", "tag": "", "n": 17, "stem": "갈라디아서와 로마서의 관계 및 차이점에 대한 설명으로 맞지 않는 것은?", "opts": ["갈라디아서의 사상적 흐름과 기본 특징(칭의론, 아브라함, 세례, 자유, 성령)은 로마서에서 한층 신중하고 엄격하게 발전한다.", "갈라디아서가 위기 상황 속에서의 날카로운 투쟁적·상황적 논쟁이라면, 로마서는 원칙적인 문제 제기로 구성된다.", "갈라디아서와 로마서에 나타난 '율법(nomos)'의 평가는 완전히 동일하며, 바울은 로마서에서도 율법을 '천사의 율법'으로 비방하고 거부했다.", "갈라디아서와 로마서 모두 '율법의 행위가 아니라 오직 믿음으로 말미암는 의'를 구원의 핵심 대안으로 제시한다."], "ans": [3], "exp": "갈라디아서에서     h.setAttribute('aria-checked',on===bs.length?'true':on?'mixed':'false');
    h.innerHTML='<span class="bub sm"></span>'+s.t+'<span class="n">'+cntFor(q=>bs.some(b=>b.name===q.book))+'문항</span>';
    h.onclick=()=>{const all=on===bs.length;bs.forEach(b=>all?st.books.delete(b.name):st.books.add(b.name));renderHome()};
    const list=document.createElement('div');list.className='books';
    bs.forEach(b=>{const e=document.createElement('button');e.type='button';e.className='bk';e.setAttribute('aria-pressed',st.books.has(b.name));
      e.innerHTML='<span class="bub sm"></span>'+b.name+'<span class="n">'+cntFor(q=>q.book===b.name)+'</span>';
      e.onclick=()=>{st.books.has(b.name)?st.books.delete(b.name):st.books.add(b.name);renderHome()};list.appendChild(e)});
    wrap.appendChild(h);wrap.appendChild(list);g.appendChild(wrap)});
  $('scopeSum').textContent=st.books.size===BOOKS.length?'11권 전체':st.books.size+'권 선택';
  tabs($('kindTabs'),KINDS,st.kind,k=>{st.kind=k;renderHome()});
  tabs($('orderTabs'),ORDERS,st.order,k=>{st.order=k;renderHome()});
  $('hintTog').setAttribute('aria-checked',st.hint);
  const n=pool().length,r=$('cnt');
  r.max=Math.max(1,n);if(st.count>n||st.count<1)st.count=Math.min(n,20)||1;r.value=st.count;r.disabled=!n;
  setCnt(n);
  const qk=$('quick');qk.innerHTML='';[10,20,40].filter(v=>v<n).concat(n?[n]:[]).forEach(v=>{const b=document.createElement('button');b.type='button';b.textContent=v===n?'전체 '+n:v;b.onclick=()=>{st.count=v;r.value=v;setCnt(n)};qk.appendChild(b)});
  dock([{t:n?st.count+'문항 풀기':'범위를 골라 주세요',dis:!n,on:startNew,id:'startBtn'}]);
}
function setCnt(n){$('cntOut').innerHTML=(n?st.count:0)+'<small> / '+n+'</small>';const s=$('startBtn');if(s)s.textContent=st.count+'문항 풀기'}
$('cnt').oninput=e=>{st.count=+e.target.value;setCnt(pool().length)};
$('hintTog').onclick=()=>{st.hint=!st.hint;$('hintTog').setAttribute('aria-checked',st.hint)};
function startNew(){let p=pool();p=st.order==='rand'?shuffle(p):p.slice().sort((a,b)=>a.id-b.id);start(p.slice(0,st.count))}
function start(list){st.list=list;st.i=0;st.log=[];show('quiz');renderQ()}

function renderQ(){
  const q=st.list[st.i];st.sel=new Set();st.checked=false;
  $('qPos').textContent=(st.i+1)+' / '+st.list.length;
  const c=st.log.filter(x=>x.ok).length;$('qRun').textContent=st.log.length?'맞힘 '+c+' · 틀림 '+(st.log.length-c):'';
  $('qProg').style.width=(st.i/st.list.length*100)+'%';
  $('qNo').innerHTML=(st.i+1)+'.';
  $('qTag').innerHTML='<b>'+q.book+'</b> '+q.n+'번'+(q.sub?' · '+q.sub:'')+(q.tag?' · <span class="st">★ '+esc(q.tag)+'</span>':'');
  $('qStem').textContent=q.stem;
  $('qHint').textContent=st.hint?'정답 '+q.ans.length+'개':'정답이 여러 개일 수 있습니다.';
  const box=$('qOpts');box.innerHTML='';
  q.opts.forEach((o,k)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.setAttribute('aria-pressed','false');
    b.innerHTML='<span class="bub">'+(k+1)+'</span><span class="tx">'+esc(o)+'</span>';
    b.onclick=()=>{if(st.checked)return;const v=k+1;st.sel.has(v)?st.sel.delete(v):st.sel.add(v);b.setAttribute('aria-pressed',st.sel.has(v));$('checkBtn').disabled=!st.sel.size};
    box.appendChild(b)});
  $('qFb').innerHTML='';
  dock([{t:'채점하기',dis:true,on:check,id:'checkBtn'}]);
}
function check(){
  const q=st.list[st.i];st.checked=true;
  const ans=new Set(q.ans),sel=[...st.sel].sort();
  const ok=sel.length===ans.size&&sel.every(v=>ans.has(v));
  st.log.push({q,sel,ok});
  [...$('qOpts').children].forEach((b,k)=>{const v=k+1,bub=b.querySelector('.bub');b.classList.add('done');
    if(ans.has(v)){b.classList.add('isans');bub.insertAdjacentHTML('beforeend',PEN_O)}
    else if(st.sel.has(v)){b.classList.add('wrongpick');bub.insertAdjacentHTML('beforeend',PEN_X)}});
  $('qNo').insertAdjacentHTML('beforeend',ok?MARK_O:MARK_X);
  const ansTxt=q.ans.map(a=>NUM[a-1]).join(' ');
  $('qFb').innerHTML='<div class="note"><div class="hd">'+(ok?'정답!':'정답은 '+ansTxt)+'</div>'+esc(q.exp)+'</div>';
  const last=st.i===st.list.length-1;
  dock([{t:last?'결과 보기':'다음 문제',on:()=>{if(last)finish();else{st.i++;renderQ();window.scrollTo(0,0)}},id:'nextBtn'}]);
  $('nextBtn').focus({preventScroll:true});
}
$('quitBtn').onclick=()=>{if(!st.log.length){show('home');renderHome();return}finish()};

function finish(){
  const n=st.log.length,c=st.log.filter(x=>x.ok).length,p=n?Math.round(c/n*100):0;
  $('rScore').textContent=p+'점';
  const emo=p>=90?'🏆':p>=75?'🎉':p>=60?'🙂':p>=40?'📖':'💪';
  $('rSub').textContent=emo+' '+n+'문항 중 '+c+'문항 정답'+(n<st.list.length?' (중간에 마침)':'');
  const by={};st.log.forEach(x=>{const b=x.q.book;by[b]=by[b]||{n:0,c:0};by[b].n++;if(x.ok)by[b].c++});
  $('rBooks').innerHTML=BOOKS.filter(b=>by[b.name]).map(b=>{const v=by[b.name],r=Math.round(v.c/v.n*100);
    return '<tr><td>'+b.name+'</td><td><span class="bar'+(r<60?' low':'')+'"><i style="width:'+r+'%"></i></span></td><td class="r">'+v.c+' / '+v.n+'</td></tr>'}).join('');
  show('result');resultDock();
}
function resultDock(){const w=wrongs().length;
  dock(w?[{t:'처음으로',cls:'sbtn',on:goHome},{t:'오답노트 '+w,cls:'sbtn',on:openNotes},{t:'틀린 것만 다시',on:retry}]:[{t:'처음으로',on:goHome}]);}
function wrongs(){return st.log.filter(x=>!x.ok)}
function retry(){const w=wrongs().map(x=>x.q);if(w.length)start(st.order==='rand'?shuffle(w):w)}
function goHome(){show('home');renderHome()}
$('backBtn').onclick=()=>{show('result');resultDock()};
function openNotes(){
  const w=wrongs();$('nLead').textContent=w.length+'문항 · 빨간 동그라미가 정답, 취소선이 내가 고른 오답입니다.';
  $('nList').innerHTML=w.map(x=>{const q=x.q,a=new Set(q.ans),s=new Set(x.sel);
    return '<div class="wn"><p class="qtag"><b>'+q.book+'</b> '+q.n+'번'+(q.sub?' · '+q.sub:'')+'</p><p class="stem">'+esc(q.stem)+'</p><ol>'+
    q.opts.map((o,k)=>{const v=k+1,c=a.has(v)?'c':(s.has(v)?'x':'');return '<li class="'+c+'"><span class="bub sm">'+v+'</span><span class="t">'+esc(o)+(a.has(v)&&!s.has(v)?' (놓침)':'')+'</span></li>'}).join('')+
    '</ol><div class="note"><div class="hd">정답 '+q.ans.map(v=>NUM[v-1]).join(' ')+'</div>'+esc(q.exp)+'</div></div>'}).join('')||'<p class="empty">틀린 문제가 없습니다.</p>';
  show('notes');dock([{t:'결과로',cls:'sbtn',on:()=>{show('result');resultDock()}},{t:'틀린 것만 다시',on:retry}]);
}

(function(){const root=document.documentElement,btn=$('themeBtn');
  let t=null;try{t=localStorage.getItem('ntq-theme')}catch(e){}
  const dark=()=>t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  const apply=()=>{if(t)root.setAttribute('data-theme',t);else root.removeAttribute('data-theme');btn.textContent=dark()?'라이트':'다크'};
  btn.onclick=()=>{t=dark()?'light':'dark';try{localStorage.setItem('ntq-theme',t)}catch(e){}apply()};apply()})();
renderHome();

</script>
</body>
</html>
