<style>
:root{
  --bg:#E9EDF2; --surface:#FFFFFF; --ink:#18263D; --muted:#5F6B7D; --line:#CFD6E0;
  --accent:#2C5AA0; --accent-ink:#FFFFFF; --soft:#DCE5F3; --mark:#FCE9B2;
  --ok:#24704F; --ok-bg:#E1F1E8; --bad:#A83434; --bad-bg:#F7E3E3;
  --greek:"HellasArch","Noto Serif","Times New Roman","Noto Sans KR",serif;
  --ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111823; --surface:#1A2433; --ink:#E4EAF3; --muted:#9AA6B8; --line:#2D3A4E;
    --accent:#86AAE8; --accent-ink:#0E1622; --soft:#22324A; --mark:#4A3F1C;
    --ok:#7FCFA6; --ok-bg:#183327; --bad:#EE9A9A; --bad-bg:#3A1F22;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111823; --surface:#1A2433; --ink:#E4EAF3; --muted:#9AA6B8; --line:#2D3A4E;
  --accent:#86AAE8; --accent-ink:#0E1622; --soft:#22324A; --mark:#4A3F1C;
  --ok:#7FCFA6; --ok-bg:#183327; --bad:#EE9A9A; --bad-bg:#3A1F22;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:28px 18px 48px}
.gk{font-family:var(--greek)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* 시작 화면 */
.masthead{margin:8px 0 24px}
.masthead .alpha{font-family:var(--greek);font-size:clamp(56px,16vw,88px);line-height:1;letter-spacing:-.01em;color:var(--accent)}
.masthead h1{font-size:22px;margin:10px 0 4px;font-weight:700}
.masthead p{margin:0;color:var(--muted);font-size:14px}
.group{margin-bottom:22px}
.group h2{font-size:15px;font-weight:700;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;font-size:14px;line-height:1.35}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--soft);font-weight:700;color:var(--accent)}
.seg small{display:block;font-size:12px;color:var(--muted);font-weight:400}

제1변화 남성: προφήτης, μαθητής (ὁ).","§26–29, §56, §73",0],["nm","제1변화 여성 세 유형","① 어근이 ε, ι, ρ로 끝나면 단수 내내 α: ἀλήθεια, -ας, -ᾳ, -αν\n② 그 밖의 -α: 단수 속격·여격만 η: δόξα, -ης, -ῃ, -αν\n③ 주격 -η: 단수 내내 η: γραφή, -ῆς, -ῇ, -ήν\n복수는 셋 다 -αι, -ῶν, -αις, -ας","§48–54",1],["nm","제1변화 남성 -ης","단수 주격(-ης)·속격(-ου)·호격(-α)만 다르고 나머지는 제1변화 여성과 같아요.\nπροφήτης와 μαθητής는 악센트 위치만 달라요.","§73–74",0],["nm","중성 명사 공통 규칙","모든 중성 명사는 주격 = 대격 = 호격. 복수 주·대·호격은 짧은 -α로 끝나요.\n속격·여격은 남성 제2변화와 같아요.","§38–39",0],["nm","관사","ὁ, ἡ, οἱ, αἱ에는 τ가 없고 악센트도 없어요(후접어).\n중성 단수 주·대격은 τό (τόν 아님). 관사에는 호격이 없어요.\n헬라어에는 정관사만 있으니 관사가 없으면 ‘한 ~’으로 번역할 수 있어요.","§60–64",1],["nm","형용사 한정·서술 (형전관사, 유한무서)","한정적(그 좋은 말씀): ὁ ἀγαθὸς λόγος / ὁ λόγος ὁ ἀγαθός → 형용사 바로 앞에 관사.\n서술적(그 말씀은 좋다): ὁ λόγος ἀγαθός / ἀγαθὸς ὁ λόγος → 형용사 앞에 관사 없음.\n명사에 관사가 없으면(ἀγαθὸς λόγος) 둘 다 가능해서 문맥으로.\n독립적 용법: ὁ ἀγαθός 그 좋은 남자, τὰ ἀγαθά 그 좋은 것들.","§65–70",1],["nm","격 어미 헷갈리는 짝","-οις(복수 여격) ↔ -ους(복수 대격): λόγοις 말씀들에게 / λόγους 말씀들을\n-ῃ(단수 여격) ↔ -ην(단수 대격): γραφῇ / γραφήν\n-ον(단수 대격, ο) ↔ -ων(복수 속격, ω): ἄνθρωπον / ἀνθρώπων","§30, §52",0],["nm","움직이는 ν · 어순","-ουσι(ν), -ε(ν), ἐστί(ν) 등은 모음 앞이나 문장 끝에서 ν가 붙어요(자음 앞에도 가끔).\n격 어미가 역할을 보여 주므로 어순이 아니라 어미를 보고 번역해요. 강조하는 말을 앞에 둬요.","§40–41",0],["pr","인칭대명사 쓰임","주격 대명사(ἐγώ, σύ)는 강조·대조할 때만 써요(동사 어미에 주어가 있음).\n소유는 비강조 속격: ὁ λόγος μου (ἐμοῦ ×).\n전치사 뒤에는 강조형: δι’ ἐμοῦ, ἐξ ἐμοῦ, ἐν ἐμοί (단, πρός με는 흔함).\n대명사는 선행사와 성·수가 일치, 격은 달라도 돼요.","§88–91",1],["pr","αὐτός 세 가지 용법","① 서술적 위치(관사 없이): αὐτὸς ὁ ἀπόστολος 그 사도 자신이\n② 한정적 위치(관사 뒤): ὁ αὐτὸς ἀπόστολος 바로 그(같은) 사도\n③ 숨은 주어 강조: αὐτὸς λέγω 나 자신이 말한다, αὐτοὶ λέγετε 너희 자신이 말한다\nαὐτή(그 여자, 연한 숨표) ≠ αὕτη(이 여자, 거친 숨표).","§99",1],["pr","지시대명사 οὗτος, ἐκεῖνος","어미에 ο 소리 → 어근 ου(τούτου), α·η 소리 → αυ(ταύτης).\nτ가 없는 넷: οὗτος, αὕτη, οὗτοι, αὗται.\n중성 단수 주·대격: τοῦτο, ἐκεῖνο, αὐτό (-ν 없음).\n명사와 쓸 때 명사는 관사를 갖고 지시대명사는 서술적 위치: οὗτος ὁ λόγος / ὁ λόγος οὗτος.","§96–98",1],["pr","εἰμί","εἶ 말고는 모두 전접어. 자동사라서 보어는 반드시 주격(주격보어).\nἐστί(ν)이 ἔστι(ν)이 되는 때: 문장 처음, 존재·가능의 뜻, οὐκ·μή·εἰ·ὡς·καί·ἀλλ’·ἀλλά·τοῦτ’·τοῦτο 뒤.","§92–93, §125",0],["pr","전접어 앞 악센트","① 앞 낱말 얼티마의 애큐트는 그레이브로 안 바뀜: ἀδελφός μου\n② 앞 낱말이 앤티피널트 애큐트나 피널트 써컴플렉스면 얼티마에 애큐트 하나 더: ἄνθρωπός μου, δῶρόν ἐστιν\n③ 앞 낱말이 후접어나 전접어면 그 얼티마에 애큐트: εἴς με\n④ 두 음절 전접어가 피널트 애큐트 낱말 뒤에 오면 자기 악센트: ὥρα ἐστίν\n후접어(ὁ, ἐν, εἰς, οὐ)는 뒤 낱말에, 전접어(μου, με, ἐστιν)는 앞 낱말에 붙어요.","§87",0],["pr","후치어 δέ, γάρ","절의 맨 앞에 올 수 없고 보통 둘째 자리에 와요: ὁ δὲ ἀπόστολος…, οὐδὲ γὰρ …","§86, §165",0],["vb","파싱 순서와 시제 체계","원형 / 인칭 / 수 / 시제 / 태 / 법 (예: λύω 1단현능직).\n제1시제: 현재·미래·현재완료 · 제2시제(접두모음 ἐ): 미완료·단순과거·과거완료.\n현재형은 단순현재와 진행 둘 다(βλέπω 본다, 보고 있다). 현재형을 ‘~했다’로 옮기지 않기.","§18, §22",0],["vb","시제는 동작의 종류","계속·반복 → 현재(과거의 계속은 미완료 ‘~하고 있었다, ~하곤 했다’)\n완료된 동작 → 완료 · 단순한 발생 → 단순과거(ἀόριστος, 정함이 없는)\n시간 구분(과거·현재·미래)은 직설법에서만.","§114, §156–158",0],["vb","태: 중간태 · 디포넌트","중간태: 동작의 결과가 주어에게(‘나를 위하여’). ἄρχω 지배하다 / ἄρχομαι 시작하다처럼 뜻이 달라지기도.\n현재·미완료는 중간 = 수동 모양(익힘에서는 수동으로 처리).\n미래·단순과거는 중간과 수동이 다른 모양.\n디포넌트: 모양은 중간·수동, 뜻은 능동. 현재 디포는 미완료에서도 디포(ἠρχόμην).","§102, §108, §133, §143",0],["vb","줄어드는 어미","-εσαι → -ῃ (λύῃ) · -εσο → -ου (ἐλύου, ἐλίπου) · -σασο → -σω (ἐλύσω)\n미완료·제2단과 능동 1단과 3복은 같은 모양(ἔλυον): 문맥으로 가려요.","§105, §130, §160, §171",0],["vb","행위자와 수단","ὑπό + 속격: ~로 말미암아(행위자), 수동태와 함께.\n전치사 없는 여격: 수단(~으로) — τῷ λόγῳ 그 말씀으로.","§106–107",0],["vb","동사가 지배하는 격","ἀκούω + 속격: 듣다 / + 대격: 순종하다(강의안 해석)\nἄρχω + 속격: 지배하다\nπιστεύω + 여격 또는 εἰς + 대격: 믿다\nεἰμί, γίνομαι + 주격보어\nπροσφέρω: 가져가는 것은 대격, 받는 이는 여격","§111, §163, §165",0],["vb","οὐ · καί · οὐδέ · μέν…δέ","οὐ: 부정하는 낱말 바로 앞. 모음(연한 숨표) 앞 οὐκ, 거친 숨표 앞 οὐχ.\nκαί가 ‘역시, ~까지도’면 강조하는 낱말 바로 앞. καί … καί 둘 다(both … and).\nοὐδέ: 그리고 … 아니, ~까지도 아니. οὐδέ … οὐδέ: neither … nor.\nμέν … δέ: 대조. μέν은 보통 번역 안 하고 δέ를 ‘그러나’로.","§110, §135–137, §113",0],["vb","중성 복수 주어 + 단수 동사","τὰ δαιμόνια ἐξέρχεται 그 귀신들이 나간다 — 중성 복수 주어는 3인칭 단수 동사를 취할 수 있어요(복수 동사도 가능).","§134",0],["ag","접두모음 (제2시제 직설법)","자음으로 시작: ἐ를 붙임 — ἔλυον, ἐγίνωσκον\n모음으로 시작: 첫 모음을 길게 — ε → η (ἤγειρον), ο → ω, α → η (ἤκουον, 긴 α가 아님), αι → ῃ (ᾖρον)\n악센트는 접두모음을 넘어갈 수 없어요: ἀπῆγον (ἄπηγον ×).","§115–118, §123",1],["ag","합성동사의 접두모음","전치사와 동사 사이에 붙어요: ἐκβάλλω → ἐξέβαλλον (ἐκ는 모음 앞에서 ἐξ).\n전치사의 끝 모음은 모음 앞에서 떨어져요: ἀποκτείνω → ἀπέκτεινον, ἀπό + ἄγω = ἀπάγω → ἀπῆγον.\n같은 방식: παρελάμβανον, συνῆγον, ἐξεπορευόμην, ἐπέστρεψα, ὑπέστρεψα, ἀπέλυσα.","§122",0],["ag","합성동사의 뜻","전치사의 뜻이 더해지는 경우: ἐκ + πορεύομαι = ἐκπορεύομαι 나가다.\n합쳐도 뜻이 드러나지 않는 경우: ἀπό + κρίνομαι = ἀποκρίνομαι 대답하다.","§109",0],["fu","미래 = 원어근 + σ","현재 어근이 아니라 원어근에 시제 접미어 σ를 붙이고, 어미는 현재와 같아요.\nλύ-ω → λύ-σ-ω. 미래 중간태는 ‘나를 위하여 ~할 것이다’(미래 수동은 16과).","§140–144",1],["fu","자음 + σ","순음 π, β, φ + σ → ψ: πέμψω, τρίψω, γράψω\n구개음 κ, γ, χ + σ → ξ: διώξω, ἄξω, ἄρξω\n설음 τ, δ, θ + σ → 앞 자음이 빠지고 σ: σπεύσω, πείσω\nθάπτω → θάψω: τ가 빠지고 남은 π가 σ와 만나 ψ (교재·강의안은 설음 보기로 듦)","§145",1],["fu","원어근이 다른 동사","κηρύσσω: 원어근 κηρυκ- → κηρύξω\nβαπτίζω: 원어근 βαπτιδ- → βαπτίσω\n거꾸로 추적: ἄξω → ξ 안에 σ → ἄκω? ἄγω? ἄχω? → 사전으로 ἄγω 확인.","§146, §150",0],["fu","불규칙 미래와 미래 디포넌트","미래는 불규칙이 많으니 사전(기본형)으로 확인해요.\nἔρχομαι → ἐλεύσομαι, βαίνω → βήσομαι, γίνομαι → γενήσομαι, γινώσκω → γνώσομαι, λαμβάνω → λήμψομαι, βλέπω → ὄψομαι, ἔχω → ἕξω(숨표 주의)\nβαίνω처럼 현재는 능동인데 미래만 중간태형인 동사 = 미래 디포넌트.","§147, §149, §153",1],["fu","기본형 여섯 개","현재 능동 · 미래 능동 · 단순과거 능동 · 현재완료 능동 · 현재완료 수동 · 단순과거 수동의 1인칭 단수 직설법.\n미완료는 현재 어근으로 만들기 때문에 기본형에 없어요.\n합성동사는 전치사를 떼고 찾기: ἀπελεύσεσθε → ἐλεύσομαι → ἔρχομαι → ἀπέρχομαι.","§148, §152",0],["ao","단순과거 능동·중간","ἐ + 원어근 + σα + 제2시제 어미.\n능동: 1단 ν 탈락(ἔλυσα), 3단 σα → σε(ν). 3복 ἔλυσαν은 1단과 달라요(미완료 ἔλυον과 비교).\n중간: 2단 ἐλύσασο → ἐλύσω. σα가 붙을 때 자음 변화는 미래의 σ와 같아요(ἐκήρυξα, ἐπέστρεψα, ἔπεισα).","§159–162",1],["ao","제2단순과거","단순과거와 같은 시제, 변화 형식만 다름(규칙 worked / 불규칙 went처럼).\nσα 없이 어근 자체가 바뀌고, 어미는 미완료와 같아요: λαμβάνω → λαβ- → ἔλαβον, βάλλω → βαλ- → ἔβαλον.\n미완료와의 차이는 어근뿐: ἔλειπον(미완료) / ἔλιπον(제2단과), ἔβαλλον / ἔβαλον.\n중간 2단 -εσο → -ου (ἐλίπου). 제2단과 어근은 능·중에만 쓰고, 제2단과 수동은 따로 없어요.","§158, §166–172",1],["ao","제2단순과거 목록 (모두 외우기)","ἔβαλον ← βάλλω · ἐγενόμην ← γίνομαι(디포) · εἶδον ← βλέπω(ὁράω) · εἶπον ← λέγω · ἔλαβον ← λαμβάνω · ἔλιπον ← λείπω · ἔπεσον ← πίπτω · ἤγαγον ← ἄγω · ἦλθον ← ἔρχομαι\nἤνεγκα ← φέρω: 단순과거처럼 변하지만 -σα 대신 -κα.\nεἶδον은 신약에서 단순과거 어미를 취하기도 해요.","§165",1]],"RQ":[["ac",1,"ἄγγελος의 바른 발음은?",["앙겔로스","악겔로스","아겔로스","악켈로스"],"γ가 γ, κ, ξ, χ 앞에 오면 ㅇ으로 읽어요.","§1"],["ac",1,"ἀνάγκη의 바른 발음은?",["아낭케","아낙케","아나그케","아나케"],"γκ도 앞의 γ를 ㅇ으로 읽어요.","§1"],["ac",1,"ου의 소리는?",["ㅜ (우)","오우","ㅗ (오)","ㅟ (위)"],"ου는 이중모음으로 ‘우’ 한 소리예요. λόγου 로구.","§4"],["ac",1,"ευ의 소리는? (강의안 표기)",["ㅠ (유)","에우","ㅜ (우)","에위"],"강의안 표에서 ευ는 ㅠ로 표기해요. ηυ는 ‘에우’로 차례대로 읽어요.","§4, §6"],["ac",1,"ᾳ, ῃ, ῳ 아래의 작은 ι는?",["이오타 하기 — 소리 내지 않아요","‘이’를 따로 읽어요","거친 숨표예요","장모음 표시예요"],"이오타 하기(下記)는 발음하지 않아요(아- 에- 오-).","§6"],["ac",1,"낱말 맨 끝에 쓰는 시그마는?",["ς","σ","ζ","Σ"],"낱말 끝에서만 ς, 그 밖에는 σ.","§1"],["ac",1,"ρ나 υ가 낱말 처음에 오면?",["거친 숨표가 붙어 ㅎ 소리가 섞여요 (ῥ, ὑ)","연한 숨표가 붙어요","악센트가 붙지 않아요","대문자로 써요"],"ῥῆμα ㅎ레마, ὑπό 휘포.","§1"],["ac",1,"이중모음의 숨표·악센트 자리는?",["둘째 모음 위","첫째 모음 위","두 모음 사이","앞 자음 위"],"οὐ, εἰ, αἰ처럼 둘째 모음 위에 붙여요.","§5–6"],["ac",1,"가름표(ϊ)의 뜻은?",["앞 모음과 이중모음이 아니라는 표시","장모음 표시","이오타 하기","강조 표시"],"προΐμος는 프로-이-모스, 세 음절이에요.","§7"],["ac",1,"헬라어에서 물음표 역할을 하는 부호는?",[";","·","?","."],"; 가 물음표, · 는 콜론·세미콜론이에요.","§8"],["ac",2,"애큐트가 붙을 수 있는 범위는?",["마지막 세 음절","마지막 두 음절","얼티마만","모든 음절"],"애큐트는 앤티피널트·피널트·얼티마. 그래서 ἄποστολος는 틀린 형태예요.","§12"],["ac",2,"써컴플렉스가 붙을 수 있는 곳은?",["마지막 두 음절의 장모음","마지막 세 음절 어디든","얼티마의 단모음","피널트의 단모음"],"써컴플렉스는 장모음에만, 피널트·얼티마에만. πιστεῦομεν은 틀린 형태예요.","§12"],["ac",2,"얼티마가 길 때 가능한 악센트 자리는?",["피널트(애큐트만) 또는 얼티마","앤티피널트 애큐트","피널트 써컴플렉스","어디든 가능"],"얼티마가 길면 앤티피널트에 악센트가 못 오고, 피널트에는 애큐트만: ἀποστόλῳ, δούλου.","§12"],["ac",2,"δοῦλος의 피널트가 써컴플렉스인 이유는?",["얼티마가 짧고 피널트가 길어서","얼티마가 길어서","보유법 예외라서","전접어 앞이라서"],"얼티마 짧고 피널트 길면 피널트 악센트는 써컴플렉스. 얼티마가 길어지면 δούλου.","§12"],["ac",2,"ἄνθρωποι의 앤티피널트에 악센트가 올 수 있는 이유는?",["맨 끝의 -οι는 짧게 보기 때문","οι는 이중모음이라 길기 때문","명사는 역행법이라서","예외 단어라서"],"낱말 맨 끝의 οι, αι는 악센트 문제에서 짧아요. 반면 ἀνθρώποις는 끝이 ς라서 길어요.","§11"],["ac",2,"ἀνθρώποις에서 악센트가 피널트로 온 이유는?",["끝이 -οις라서 얼티마가 길다","끝이 -οι라서 짧다","여격은 항상 피널트","보유법 때문"],"ς가 끝에 있어서 οι가 맨 끝이 아니므로 긴 음절이에요.","§11"],["ac",2,"동사 악센트의 원칙은?",["역행법 — 가능한 한 끝에서 멀리","보유법 — 원형 자리 유지","항상 피널트","항상 얼티마"],"얼티마 짧으면 앤티피널트, 길면 피널트에 애큐트(ἐγίνωσκε / ἐγινώσκου).","§14"],["ac",2,"명사 악센트의 원칙은?",["보유법 — 주격 단수 자리를 지키되 일반 법칙 안에서","역행법 — 끝에서 멀리","항상 얼티마","격마다 새로 정함"],"그래서 명사는 악센트까지 외워야 해요. οἶκος → οἴκου.","§15"],["ac",2,"얼티마의 애큐트가 뒤 낱말과 이어지면?",["그레이브로 바뀐다","써컴플렉스로 바뀐다","사라진다","피널트로 옮겨 간다"],"ἀγαθὸς λόγος, ὁ θεὸς λέγει처럼 그레이브가 돼요(전접어 앞과 문장 끝은 예외).","§12"],["ac",5,"제1변화 명사 복수 속격의 악센트는?",["항상 얼티마 써컴플렉스 -ῶν","주격 단수 자리 유지","항상 피널트 애큐트","악센트가 없다"],"보유법의 예외: ὥρα → ὡρῶν, ἀλήθεια → ἀληθειῶν.","§47"],["ac",4,"υἱός, γραφή처럼 주격 얼티마에 악센트가 있는 명사의 속격·여격은?",["써컴플렉스 (υἱοῦ, γραφῆς)","애큐트를 그대로 유지","그레이브","피널트로 이동"],"속격·여격(단·복)은 써컴플렉스, 나머지는 애큐트.","§37, §54"],["nm",6,"-ος로 끝나지만 여성(ἡ)인 명사 둘은?",["ἔρημος, ὁδός","λόγος, νόμος","θάνατος, οἶκος","κόσμος, λίθος"],"ἔρημος(빈들), ὁδός(길)는 관사 ἡ와 함께 외워요.","§56"],["nm",7,"προφήτης, μαθητής의 성은?",["남성 (제1변화)","여성 (제1변화)","남성 (제2변화)","중성"],"-ης로 끝나는 제1변화 남성 명사예요.","§73"],["nm",7,"제1변화 남성 명사가 여성과 다른 칸은?",["단수 주격·속격·호격","복수 전체","단수 여격·대격","속격만"],"주 -ης, 속 -ου, 호 -α만 다르고 나머지는 여성 제1변화와 같아요.","§74"],["nm",5,"ἀλήθεια의 단수 속격은?",["ἀληθείας","ἀληθείης","ἀληθείου","ἀληθειῶν"],"어근이 ε, ι, ρ로 끝나서 단수 내내 α예요.","§48"],["nm",5,"δόξα의 단수 속격은?",["δόξης","δόξας","δόξου","δοξῶν"],"ε, ι, ρ 뒤가 아닌 -α 명사는 단수 속격·여격이 η.","§50"],["nm",4,"중성 명사의 공통 규칙은?",["주격 = 대격 = 호격, 복수는 짧은 -α","주격 = 속격","단수와 복수가 같다","호격이 없다"],"δῶρον / δῶρα. 제3변화 중성도 같아요.","§39"],["nm",6,"관사 가운데 τ로 시작하지 않는 것은?",["ὁ, ἡ, οἱ, αἱ","τοῦ, τῆς","τόν, τήν","τά, τό"],"이 넷은 τ도 없고 악센트도 없는 후접어예요.","§62"],["nm",6,"관사에 없는 격은?",["호격","속격","여격","대격"],"관사는 호격이 없어요.","§60"],["nm",6,"관사의 중성 단수 주·대격은?",["τό","τόν","τοῦ","τά"],"형용사 ἀγαθόν과 달리 관사는 τό예요.","§62"],["nm",6,"‘그 좋은 말씀’(한정적)이 아닌 것은?",["ὁ λόγος ἀγαθός","ὁ ἀγαθὸς λόγος","ὁ λόγος ὁ ἀγαθός"],"ὁ λόγος ἀγαθός는 형용사 앞에 관사가 없으니 서술적: ‘그 말씀은 좋다’.","§65–69"],["nm",6,"ἀγαθὸς ὁ λόγος의 뜻은?",["그 말씀은 좋다","그 좋은 말씀","좋은 말씀들","그 말씀의 선함"],"유한무서: 형용사 앞에 관사가 없으면 서술적.","§65–69"],["nm",6,"관사 없는 ἀγαθὸς λόγος는?",["한정·서술 둘 다 가능 (문맥으로)","항상 서술적","항상 한정적","문법 오류"],"구별은 명사에 fu",13,"ἔχω의 미래 ἕξω에서 주의할 점은?",["숨표가 거친 숨표로 바뀐다","악센트가 사라진다","χ가 그대로 남는다","디포넌트가 된다"],"ἕξω 헥소 (ἔξω 엑소는 부사 ‘밖에’).","§139, §10"],["fu",13,"βαίνω의 미래 βήσομαι 같은 동사를 부르는 말은?",["미래 디포넌트","제2단순과거","합성동사","전접어"],"현재는 능동형인데 미래에서만 디포넌트예요.","§153"],["fu",13,"ἐλεύσομαι는 어느 동사의 미래인가요?",["ἔρχομαι","λύω","λείπω","λέγω"],"불규칙 미래는 사전으로 확인해요.","§149"],["fu",13,"ἀπελεύσεσθε의 원형은?",["ἀπέρχομαι","ἀπολύω","ἔρχομαι","ἀποστέλλω"],"ἀπό를 떼고 ἐλεύσεσθε → ἐλεύσομαι → ἔρχομαι → ἀπέρχομαι.","§152"],["fu",13,"합성동사의 미래형을 찾는 법은?",["전치사를 떼고 남은 동사로 생각한다","전치사의 미래를 찾는다","전치사에 σ를 붙인다","합성동사는 미래가 없다"],"","§152"],["fu",13,"기본형에 들어가지 않는 것은?",["미완료 능동","미래 능동","단순과거 능동","단순과거 수동"],"미완료는 현재 어근으로 만들기 때문이에요.","§148"],["fu",13,"‘그들이 시작할 것이다’는?",["ἄρξονται","ἄρξουσιν","ἄρχονται","ἤρχοντο"],"‘시작하다’는 ἄρχω의 중간태 → 미래 ἄρξω의 중간태 3복.","§150"],["fu",13,"λύσῃ의 분석은?",["2단미래중직","2단현중직","1단미래능직","2단단과중직"],"λύῃ(2단현중·수직)에 σ가 들어간 모양.","§144"],["ao",14,"단순과거 능동의 공식은?",["ἐ + 원어근 + σα + 제2시제 능동 어미","원어근 + σ + 제1시제 어미","ἐ + 현재 어근 + ο/ε + 제2시제 어미","원어근 + σα + 제1시제 어미"],"ἔ-λυ-σα.","§159"],["ao",14,"ἔλυσα에서 1단 어미는?",["ν가 떨어졌다 (σαν → σα)","ς가 떨어졌다","α가 길어졌다","원래 없다"],"그래서 1단 ἔλυσα와 3복 ἔλυσαν은 달라요.","§159"],["ao",14,"ἔλυσε(ν)에서 일어난 변화는?",["3단에서 σα가 σε로","σα가 σο로","ν가 떨어짐","접두모음이 길어짐"],"움직이는 ν가 붙을 수 있어요.","§159"],["ao",14,"ἔλυσαν의 분석은?",["3복단과능직","1단단과능직","3복미완능직","1단미완능직"],"미완료 ἔλυον은 1단·3복이 같지만, 단순과거는 다르게 생겨요.","§159"],["ao",14,"단순과거 중간 2단 ἐλύσω는 원래?",["ἐλύσασο","ἐλύσεσο","ἐλύσαο","ἐλύσασαι"],"-σασο → -σω.","§160"],["ao",14,"ἐλύσω와 λύσω를 구별하면?",["2단단과중직 / 1단미래능직","1단미래능직 / 2단단과중직","둘 다 1단미래능직","2단미래중직 / 1단현능직"],"접두모음 ἐ가 있으면 제2시제(단순과거)예요.","§160"],["ao",14,"단순과거 σα가 자음 뒤에 붙을 때 일어나는 변화는?",["미래의 σ와 똑같다 (ψ, ξ, 탈락)","항상 그대로 σα","자음이 겹친다","κα로 바뀐다"],"ἐκήρυξα, ἐπέστρεψα, ἔπεισα.","§162"],["ao",14,"κηρύσσω의 단순과거 1단은?",["ἐκήρυξα","ἐκήρυσσα","ἐκήρυψα","κήρυξα"],"원어근 κηρυκ- + σα → ξα.","§155"],["ao",14,"πιστεύω의 단순과거 1복은?",["ἐπιστεύσαμεν","ἐπιστεύομεν","πιστεύσομεν","ἐπίστευσαν"],"ἐ + πιστευ + σα + μεν.","§155"],["ao",15,"제2단순과거에 대한 설명으로 맞는 것은?",["단순과거와 같은 시제, 변화 형식만 다르다","단순과거보다 더 먼 과거다","미완료의 한 종류다","수동태 전용이다"],"영어의 worked(규칙)와 went(불규칙)의 관계와 같아요.","§158, §166"],["ao",15,"제2단순과거의 공식은?",["ἐ + 제2단과 어근 + ο/ε + 제2시제 어미","ἐ + 원어근 + σα + 제2시제 어미","제2단과 어근 + σ + 제1시제 어미","ἐ + 현재 어근 + ο/ε + 제2시제 어미"],"어미는 미완료와 같아요.","§169"],["ao",15,"ἔλιπον과 ἔλειπον의 차이는?",["ἔλιπον 제2단과(λιπ-) / ἔλειπον 미완료(λειπ-)","ἔλιπον 미완료 / ἔλειπον 제2단과","둘 다 미완료","둘 다 제2단과"],"차이는 어근뿐이에요.","§170"],["ao",15,"ἔβαλον과 ἔβαλλον의 차이는?",["ἔβαλον 제2단과 / ἔβαλλον 미완료","ἔβαλον 미완료 / ἔβαλλον 제2단과","ἔβαλον 단과 중간","같은 형태"],"βάλλω의 제2단과 어근은 βαλ-.","§170"],["ao",15,"λαμβάνω의 제2단순과거 어근은?",["λαβ-","λαμβ-","λημψ-","λαμβαν-"],"ἔλαβον.","§168"],["ao",15,"ἐλίπου는 원래?",["ἐλίπεσο","ἐλίπεσαι","ἐλίπασο","ἐλίποσο"],"-εσο → -ου (미완료 ἐλύου와 같은 원리).","§171"],["ao",15,"제2단순과거의 수동태는?",["따로 없다 (과거 수동은 별도 형태, 16과)","ἐλιπόμην","ἔλιπον","중간태와 같다"],"제2단과 어근은 능동·중간에만 써요.","§172"],["ao",15,"ἤνεγκα의 특징은?",["φέρω의 단순과거, -σα 대신 -κα","λέγω의 제2단과","φέρω의 미완료","제2단과 중간태"],"ἔλυσα처럼 변하지만 κ가 들어가요.","§165"],["ao",15,"εἶδον에 대한 설명으로 맞는 것은?",["βλέπω(ὁράω)의 제2단과, 신약에서 단순과거 어미를 취하기도","λέγω의 제2단과","미래 디포넌트","εἰμί의 미완료"],"교재 낱말 모음에는 ‘디포’라고 적혀 있지만 강의안에는 없고, 형태도 능동이라 오기로 보여요.","§165"],["ao",15,"ἐγενόμην에 대한 설명으로 맞는 것은?",["γίνομαι의 제2단과(중간태형 디포)","γινώσκω의 제2단과","γίνομαι의 미완료","γίνομαι의 미래"],"ἐγένοντο 3복2단과중직디포.","§165"],["ao",15,"προσέφερον의 분석으로 가능한 것은?",["1단 또는 3복 미완능직","1단 제2단과능직","3복 단과능직","2단 미완능직"],"강의안 풀이는 1단(‘내가 데려가고 있었다’). 문맥에 따라 3복도 가능해요.","§121, §173"]],"SENT":{"10-1":[10,1,"λύονται οὗτοι οἱ δοῦλοι ὑπὸ τοῦ κυρίου.","이 종들이 주님으로 말미암아 풀려나고 있다.","강의안"],"10-3":[10,3,"οὐκ ἀκούετε τῆς φωνῆς τοῦ προφήτου, ἀλλ’ ἐξέρχεσθε ἐκ τοῦ οἴκου αὐτοῦ.","너희는 그 예언자의 음성을 듣지 않는다. 그러나 너희는 그의 집으로부터 나가고 있다.","강의안"],"10-5":[10,5,"ἐκεῖνοι οἱ ἀγαθοὶ διδάσκαλοι οὐκ εἰσέρχονται εἰς τοὺς οἴκους τῶν ἁμαρτωλῶν.","저 선한 선생들은 그 죄인들의 집들 안으로 들어가지 않는다.","강의안"],"10-7":[10,7,"λέγετε ἐκείνοις τοῖς ἁμαρτωλοῖς ὅτι σώζεσθε ὑπὸ τοῦ θεοῦ ἀπὸ τῶν ἁμαρτιῶν ὑμῶν.","너희가 하나님으로 말미암아 너희의 죄들로부터 구원받는다는 것을 너희는 저 죄인들에게 말하고 있다.","강의안"],"10-9":[10,9,"εἰρήνην ἔχει ἡ ἐκκλησία, ὅτι σώζεται ὑπὸ τοῦ κυρίου αὐτῆς.","그 교회는 평화를 가지고 있다. 왜냐하면 그것은 그것의 주님으로 말미암아 구원받고 있기 때문이다.","강의안"],"10-10":[10,10,"οὐκ ἀποκρινόμεθα τῷ ἀποστόλῳ ὅτι οὐ γινώσκομεν αὐτόν.","우리는 그 사도에게 대답하지 않는다. 왜냐하면 우리는 그를 알지 않기 때문이다.","강의안"],"10-11":[10,11,"οὐχ ὑπὸ τῶν μαθητῶν σώζῃ ἀπὸ τῶν ἁμαρτιῶν σου, ἀλλ’ ὑπ’ αὐτοῦ τοῦ θεοῦ.","너는 그 제자들로 말미암아가 아니라 하나님 자신으로 말미암아 너의 죄들로부터 구원받는다.","강의안"],"10-12":[10,12,"οὐ πορεύῃ ἐν τῇ ὁδῷ τῇ κακῇ, ἀλλὰ σώζῃ ἀπὸ τῶν ἁμαρτιῶν σου· καὶ οἱ ἀδελφοί σου ἀκούουσι τῆς φωνῆς τοῦ κυρίου.","너는 그 나쁜 길 안에 가지 않고, 너의 그 죄들로부터 구원받고 있다. 그리고 너의 그 형제들은 주님의 그 음성을 듣고 있다.","강의안"],"10-13":[10,13,"μετὰ τῶν ἀδελφῶν αὐτοῦ ἄγεται εἰς τὴν βασιλείαν τοῦ θεοῦ τῇ φωνῇ τῶν ἀποστόλων.","그는 그의 형제들과 함께 그 사도들의 음성으로 하나님의 그 나라 안으로 인도받는다.","강의안"],"10-14":[10,14,"οὐ γίνῃ μαθητὴς τοῦ κυρίου, ὅτι οὐκ εἰσέρχῃ εἰς τὴν ἐκκλησίαν αὐτοῦ.","너는 그 주님의 제자가 되지 않는다. 왜냐하면 그의 그 교회 안으로 들어가지 않기 때문이다.","강의안"],"11-1":[11,1,"ἠκούομεν τῆς φωνῆς αὐτοῦ ἐν ἐκείναις ταῖς ἡμέραις, νῦν δὲ οὐκέτι ἀκούομεν αὐτῆς.","우리는 저 날들 안에 그의 음성을 듣고 있었다. 그러나 지금 우리는 더 이상 그것을 듣지 않는다.","강의안"],"11-3":[11,3,"ἀπέκτεινον οἱ δοῦλοι τὰ τέκνα σὺν τοῖς μαθηταῖς.","그 종들이 그 제자들과 함께 그 아이들을 죽이고 있었다.","강의안"],"11-5":[11,5,"παρελαμβάνετε τὸν ἄρτον παρὰ τῶν δούλων καὶ ἠσθίετε αὐτόν.","너희는 그 빵을 그 종들로부터 받고 있었다. 그리고 너희는 그것을 먹고 있었다.","강의안"],"11-7":[11,7,"συνῆγεν οὗτος ὁ ἀπόστολος εἰς τὴν ἐκκλησίαν τοὺς μαθητὰς τοῦ κυρίου ἡμῶν.","이 사도는 그 교회 안으로 우리 주님의 그 제자들을 모으고 있었다.","강의안"],"11-9":[11,9,"ὁ κύριος ἡμῶν ᾖρε τὰς ἁμαρτίας ἡμῶν.","우리의 그 주님이 우리의 그 죄들을 치우고 계셨다.","강의안"],"11-11":[11,11,"πονηροὶ ἦτε, ἀγαθοὶ δέ ἐστε.","너희는 악한 자들이었다. 그러나 너희는 선한 자들이다.","강의안"],"11-13":[11,13,"τότε ἤμην ἐν τῷ ἱερῷ καὶ ἐδίδασκέ με ὁ κύριος.","그때에 나는 그 성전 안에 있었다. 그리고 주님께서 나를 가르치고 계셨다.","강의안"],"11-15":[11,15,"ἐξέβαλλες αὐτοὺς ἐκ τοῦ ἱεροῦ.","네가 그들을 그 성전 밖으로 몰아내고 있었다.","강의안"],"11-17":[11,17,"ὁ κύριος ἀπέστελλεν ἀγγέλους πρὸς ἡμᾶς.","그 주님은 우리를 향하여 천사들을 보내고 계셨다.","강의안"],"11-19":[11,19,"δοῦλος ἦς τοῦ πονηροῦ, ἀλλὰ νῦν οὐκέτι εἶ δοῦλος.","너는 그 악한 자의 종이었다. 그러나 지금 너는 더 이상 종이 아니다.","강의안"],"12-1":[12,1,"ἐγράφοντο οὗτοι οἱ λόγοι ἐν βιβλίῳ.","이 말씀들이 책 안에 기록되고 있었다.","강의안"],"12-2":[12,2,"ἐδιδασκόμην ὑπ’ αὐτοῦ ἐκ τῶν βιβλίων τῶν προφητῶν.","나는 그 예언자들의 책들에서 그로 말미암아 가르침을 받고 있었다.","강의안"],"12-3":[12,3,"ἐν ἐκείναις ταῖς ἡμέραις καὶ ἐδιδασκόμεθα ὑπ’ αὐτοῦ καὶ ἐδιδάσκομεν τοὺς ἄλλους, ἀλλὰ νῦν οὐδὲ διδασκόμεθα οὐδὲ διδάσκομεν.","저 날들 안에 우리가 그로 말미암아 가르침을 받고 있었고 다른 사람들을 가르치고 있었다. 그러나 지금 우리는 가르침을 받지도 않고 가르치지도 않는다.","강의안"],"12-5":[12,5,"ἐξεπορεύετο πρὸς αὐτὸν ἡ ἐκκλησία, ἀλλὰ νῦν οὐκέτι ἐκπορεύεται.","그 교회는 그를 향하여 나가고 있었다. 그러나 지금은 더 이상 나가지 않는다.","강의안"],"12-7":[12,7,"ἐλέγετο ἐν τῷ ἱερῷ καλὸς λόγος περὶ τούτου τοῦ ἀποστόλου.","이 사도에 대하여 좋은 말씀이 그 성전 안에서 말해지고 있었다.","강의안"],"12-9":[12,9,"ἐφέρετο τὰ δῶρα καὶ πρὸς τοὺς πονηρούς.","그 선물들이 그 악한 자들에게까지도 옮겨지고 있었다.","강의안"],"12-10":[12,10,"ἐδέχου τὰ βιβλία ἀπὸ τῶν προφητῶν.","너는 그 예언자들로부터 그 책들을 받고 있었다.","강의안"],"12-11":[12,11,"συνήρχοντο οἱ μαθηταὶ πρὸς τοῦτον.","그 제자들이 이 사람에게 함께 가고 있었다.","강의안"],"12-14":[12,14,"ὑπὲρ τῆς ἐκκλησίας αὐτοῦ ἀπέθνῃσκεν ὁ κύριος.","그 주님이 그의 교회를 위하여 죽고 있었다.","강의안"],"12-16":[12,16,"ἐν τῷ πλοίῳ ἤγου πρὸς τὸν κύριον διὰ τῆς θαλάσσης.","그 배로 너는 그 호수를 통과하여 그 주님에게로 인도되고 있었다.","강의안"],"13-1":[13,1,"ἄξει ὁ κύριος τοὺς μαθητὰς αὐτοῦ εἰς τὴν βασιλείαν.","그 주께서 그의 그 제자들을 그 나라 안으로 인도할 것이다.","강의안"],"13-2":[13,2,"γνωσόμεθα καὶ τοὺς ἀγαθοὺς καὶ τοὺς πονηρούς.","우리는 선한 자들과 악한 자들을 모두 알 것이다.","교재"],"13-3":[13,3,"λήμψεσθε τὰ πλοῖα ἐκ τῆς θαλάσσης.","너희가 그 배들을 그 호수에서 밖으로 취할 것이다.","강의안"],"13-4":[13,4,"λύσεις τοὺς δούλους.","너는 그 종들을 풀어 줄 것이다.","교재"],"13-5":[13,5,"ἕξουσιν οἱ πονηροὶ οὐδὲ χαρὰν οὐδὲ εἰρήνην.","그 악한 자들은 기쁨도 평안도 갖지 않을 것이다.","강의안"],"13-6":[13,6,"ἐν ἐκείνῃ τῇ ὥρᾳ ἐλεύσεται ὁ υἱὸς τοῦ ἀνθρώπου σὺν τοῖς ἀγγέλοις αὐτοῦ.","저 시간에 인자가 그의 천사들과 함께 올 것이다.","교재"],"13-7":[13,7,"ἁμαρτωλοί ἐστε, γενήσεσθε δὲ μαθηταὶ τοῦ κυρίου.","너희는 죄인들이다. 그러나 너희는 주님의 제자들이 될 것이다.","교재"],"13-9":[13,9,"προσεύξῃ τῷ θεῷ σου καὶ δοξάσεις αὐτόν.","너는 너의 하나님께 기도할 것이고 그에게 영광을 돌릴 것이다.","교재"],"13-14":[13,14,"διὰ τοῦ λόγου τοῦ κυρίου ἀναβλέψουσιν οἱ τυφλοὶ οὗτοι.","주님의 말씀을 통하여 이 맹인들이 다시 볼 것이다.","교재"],"13-17":[13,17,"ἀπελεύσῃ καὶ σὺ εἰς τὰς ὁδοὺς τῶν πονηρῶν καὶ διδάξεις οὕτως τοὺς ἀνθρώπους.","너도 악한 자들의 길들로 가 버릴 것이고 사람들을 그렇게 가르칠 것이다.","교재"],"14-1":[14,1,"ἀπέλυσεν ὁ κύριος τὸν δοῦλον αὐτοῦ, ὁ δὲ δοῦλος οὐκ ἀπέλυσε τὸν ἄλλον.","주께서 그의 종을 풀어 주었다. 그러나 그 종은 다른 사람을 풀어 주지 않았다.","강의안"],"14-2":[14,2,"ἤδη ἐπέστρεψαν οὗτοι πρὸς τὸν κύριον, ἐκεῖνοι δὲ ἐπιστρέψουσιν ἐν ταῖς ἡμέραις ταῖς κακαῖς.","이 사람들은 이미 주님에게로 돌아섰다. 그러나 저 사람들은 그 나쁜 날들 안에서 돌아설 것이다.","강의안"],"14-3":[14,3,"ἐπιστεύσαμεν εἰς τὸν κύριον καὶ σώσει ἡμᾶς.","우리는 주님을 믿었다. 그리고 그는 우리를 구원할 것이다.","강의안"],"14-4":[14,4,"καὶ ἐπίστευσας εἰς αὐτὸν καὶ πιστεύσεις.","그리고 너는 그를 믿었고 믿을 것이다.","강의안"],"14-5":[14,5,"ὑπέστρεψας πρὸς τὸν κύριον καὶ ἐδέξατό σε εἰς τὴν ἐκκλησίαν αὐτοῦ.","네가 주님께로 돌아섰다. 그리고 그가 그의 교회 안으로 너를 영접하였다.","강의안"],"14-7":[14,7,"ἐπεστρέψατε πρὸς τὸν κύριον καὶ ἐθεράπευσεν ὑμᾶς.","너희는 주님께로 돌아섰다. 그리고 그는 너희를 고치셨다.","강의안"],"14-9":[14,9,"ἡτοίμασα ὑμῖν τόπον ἐν τῷ οὐρανῷ.","나는 너희에게 그 하늘 안에 한 장소를 준비했다.","강의안"],"14-11":[14,11,"ἀνέβλεψαν οἱ τυφλοί.","그 맹인들이 다시 보게 되었다.","교재"],"14-12":[14,12,"ἔσωσα ὑμᾶς ἐγώ, ὑμεῖς δὲ ἐμὲ οὐκ ἐδέξασθε εἰς τοὺς οἴκους ὑμῶν.","내가 너희를 구원했다. 그러나 너희는 나를 너희의 집들 안으로 영접하지 않았다.","교재"],"14-17":[14,17,"ἤκουσαν αὐτοῦ καὶ ἐθαύμασαν.","그들이 그의 말을 듣고 놀랐다.","교재"],"15-1":[15,1,"καὶ εἴδομεν τὸν κύριον καὶ ἠκούσαμεν τοὺς λόγους αὐτοῦ.","우리가 그 주님을 보았고 그의 그 말씀들에 순종했다.","강의안"],"15-2":[15,2,"οὐδὲ γὰρ εἰσῆλθες εἰς τοὺς οἴκους αὐτῶν οὐδὲ εἶπες αὐτοῖς παραβολήν.","왜냐하면 너는 그들의 집들 안으로 들어가지 않았고 그들에게 비유를 말하지 않았기 때문이다.","강의안"],"15-3":[15,3,"ἐν ἐκείνῃ τῇ ὥρᾳ ἐγένοντο μαθηταὶ τοῦ κυρίου.","저 시간 안에 그들은 주님의 제자들이 되었다.","강의안"],"15-4":[15,4,"οὗτοι μὲν ἐγένοντο μαθηταὶ ἀγαθοί, ἐκεῖνοι δὲ ἔτι ἦσαν πονηροί.","이들은 선한 제자들이 되었다. 그러나 저들은 아직 악한 자들이었다.","강의안"],"15-5":[15,5,"προσέφερον αὐτῷ τοὺς τυφλούς.","내가 그 맹인들을 그에게 데려가고 있었다.","강의안"],"15-6":[15,6,"ἔπεσον ἐκ τοῦ οὐρανοῦ οἱ ἄγγελοι οἱ πονηροί.","그 악한 천사들이 그 하늘로부터 떨어졌다.","강의안"],"15-7":[15,7,"τὰ μὲν δαιμόνια ἐξεβάλετε, τὰ δὲ τέκνα ἐθεραπεύσατε.","너희가 그 귀신들을 쫓아내었고, 그 아이들을 고쳤다.","강의안"],"15-8":[15,8,"τοὺς μὲν πονηροὺς συνηγάγετε ὑμεῖς εἰς τοὺς οἴκους ὑμῶν, τοὺς δὲ ἀγαθοὺς ἡμεῖς.","너희는 그 악한 자들을 너희의 그 집들 안으로 모았고, 우리는 그 선한 자들을 모았다.","강의안"],"15-9":[15,9,"οὐκ ἐκήρυξας τὸ εὐαγγέλιον ἐν τῇ ἐκκλησίᾳ, οὐδὲ γὰρ ἐγένου μαθητής.","너는 그 교회 안에서 그 복음을 선포하지 않았다. 왜냐하면 네가 제자가 되지 않았기 때문이다.","강의안"],"15-10":[15,10,"νῦν μὲν λέγετε λόγους ἀγαθούς, εἶπον δὲ οὗτοι τοὺς αὐτοὺς λόγους καὶ ἐν ταῖς ἡμέραις ἐκείναις.","지금 너희는 선한 말씀들을 말한다. 그러나 이 사람들은 저 날들 안에서까지도 바로 그 말씀들을 말했다.","강의안"],"15-11":[15,11,"ἐπιστεύσαμεν εἰς τὸν κύριον, οἱ γὰρ μαθηταὶ ἤγαγον ἡμᾶς πρὸς αὐτόν.","우리는 주님을 믿었다. 왜냐하면 그 제자들이 우리를 그에게로 인도했기 때문이다.","교재"],"15-14":[15,14,"τότε ὀψόμεθα τὸν κύριον ἐν τῇ δόξῃ αὐτοῦ· ἐπιστεύσαμεν γὰρ εἰς αὐτόν.","그때에 우리는 그의 영광 안에서 주님을 볼 것이다. 왜냐하면 우리가 그를 믿었기 때문이다.","교재"],"15-16":[15,16,"ταύτας τὰς ἐντολὰς ἔλαβον ἀπὸ τοῦ κυρίου, ἤμην γὰρ μαθητὴς αὐτοῦ.","이 계명들을 나는 주님으로부터 받았다. 왜냐하면 나는 그의 제자였기 때문이다.","교재"],"15-18":[15,18,"ἤλθετε πρὸς τὸν κύριον καὶ παρελάβετε παρ’ αὐτοῦ ταῦτα.","너희가 주님께로 왔고 그로부터 이것들을 받았다.","교재"],"15-20":[15,20,"εἶδον οἱ ἄνθρωποι τὸν υἱὸν τοῦ θεοῦ· ἐγένετο γὰρ αὐτὸς ἄνθρωπος καὶ ἔμενεν ἐν τούτῳ τῷ κόσμῳ.","사람들이 하나님의 아들을 보았다. 왜냐하면 그가 친히 사람이 되었고 이 세상 안에 머물고 있었기 때문이다.","교재"]},"PARSE":[[3,"βλέπεις","βλέπω","보다","2단현능직",0,"네가 보고 있다",null],[3,"γινώσκεις","γινώσκω","알다","2단현능직",0,"네가 알고 있다",null],[3,"λαμβάνεις","λαμβάνω","취하다","2단현능직",0,"네가 취하고 있다",null],[3,"λύει","λύω","풀다","3단현능직",0,"그가 풀고 있다",null],[3,"διδάσκει","διδάσκω","가르치다","3단현능직",0,"그가 가르치고 있다",null],[3,"λέγετε","λέγω","말하다","2복현능직",0,"너희가 말하고 있다",null],[3,"γράφετε","γράφω","쓰다","2복현능직",0,"너희가 쓰고 있다",null],[3,"γινώσκομεν","γινώσκω","알다","1복현능직",0,"우리가 알고 있다",null],[3,"ἔχεις","ἔχω","가지다","2단현능직",0,"네가 가지고 있다",null],[3,"βλέπουσι","βλέπω","보다","3복현능직",0,"그들이 보고 있다",null],[3,"λαμβάνομεν","λαμβάνω","취하다","1복현능직",0,"우리가 취하고 있다",null],[4,"διδάσκουσιν","διδάσκω","가르치다","3복현능직",0,"그들이 가르치고 있다",null],[4,"λέγομεν","λέγω","말하다","1복현능직",0,"우리가 말하고 있다",null],[7,"μένουσιν","μένω const VRE=/^([123])(단|복)(현|미완|미래|단과|2단과)(능|중|수)직$/;
function feat(code, kind){
  if(kind==="prep"){const m=code.match(/^(.+) \+ (.+)$/); return {prep:m[1], cs:m[2]}}
  let m=code.match(VRE);
  if(m) return {p:m[1],n:m[2],t:m[3],v:m[4]};
  m=code.match(/^([123])?(남|여|중)?(단|복)(주|속|여|대|호)$/);
  return {p:m[1]||"",g:m[2]||"",n:m[3],c:m[4]};
}
function decode(code, kind){
  if(kind==="prep") return "";
  const f=feat(code,kind);
  if(f.t) return `${P_[f.p]} ${N_[f.n]} ${T_[f.t]} ${V_[f.v]} 직설법`;
  return [f.p?P_[f.p]:"", f.g?G_[f.g]:"", N_[f.n], C_[f.c]].filter(Boolean).join(" ");
}

const PREP_CONFLICT=[["μετά + 속격","σύν + 여격","παρά + 여격"],["ἐκ (ἐξ) + 속격","ἀπό + 속격","παρά + 속격"],["παρά + 여격","παρά + 대격"]];
const prepConflict=(a,b)=>a===b||PREP_CONFLICT.some(g=>g.includes(a)&&g.includes(b));
const secName = s=>SECS.find(x=>x[0]===s)[1];
const PB=[];
PARA.forEach((P,pi)=>{
  P.items.forEach((it,ii)=>{ if(!it.d) PB.push({id:`p_${P.id}_${ii}`, src:"p", dir:"cf", sec:it.s||P.sec, pi, ii, build:buildParaQ}) });
  const seen=new Set();
  P.items.forEach((it,ii)=>{ if(it.d||seen.has(it.f)) return; seen.add(it.f);
    PB.push({id:`pf_${P.id}_${ii}`, src:"p", dir:"fc", sec:it.s||P.sec, pi, form:it.f, build:buildParaQ}); });
});
function buildParaQ(q){
  const P=PARA[q.pi], prep=P.kind==="prep", sec=secName(q.sec);
  if(q.dir==="cf"){
    const it=P.items[q.ii], fc=feat(it.c,P.kind);
    const byForm=new Map();
    P.items.forEach(x=>{ if(x.f===it.f) return;
      if(prep && prepConflict(x.c,it.c)) return;
      const d=dist(fc,feat(x.c,P.kind));
      if(!byForm.has(x.f)||byForm.get(x.f).d>d) byForm.set(x.f,{key:x.f,d});
    });
    const ds=pickNear([...byForm.values()],3).map(c=>c.key);
    const opts=shuffle([it.f,...ds]).map(f=>({v:f,label:f,html:prep?esc(f):gk(f)}));
    return {pre:prep?"":P.lemma, word:it.c, wordCls:prep?"":"code",
      ask: prep?"뜻은?":"알맞은 형태는?", opts, ans:it.f, ansTxt:it.f, optCls:prep?"small":"gkopt",
      tag:`${sec} · 형태 고르기`, revWord:prep?it.c:`${P.lemma.split(/[, /]/)[0]}  ${it.c}`, revSub:sec,
      fb:paraFb(P,it.f,prep)};
  }
  const valid=P.items.filter(x=>x.f===q.form);
  const given=valid.filter(x=>!x.d);
  const code=given[Math.floor(Math.random()*given.length)].c;
  const fc=feat(code,P.kind);
  const cands=P.items.filter(x=>x.f!==q.form && !valid.some(v=>v.c===x.c) && !(prep && valid.some(v=>prepConflict(v.c,x.c))))
    .map(x=>({key:x.c,d:dist(fc,feat(x.c,P.kind))}));
  const uniq=[...new Map(cands.map(c=>[c.key,c])).values()];
  const ds=pickNear(uniq,3).map(c=>c.key);
  const opts=shuffle([code,...ds]).map(c=>({v:c,label:c,html:prep?gk(c):`${esc(c)}<small>${esc(decode(c,P.kind))}</small>`}));
  return {pre:prep?"":P.lemma, word:q.form, wordCls:prep?"ko":"",
    ask: prep?"어떤 전치사 + 격일까요?":"이 형태의 분석으로 맞는 것은?", opts, ans:code, ansTxt:code,
    optCls:prep?"gkopt small":"", tag:`${sec} · 분석하기`, revWord:q.form, revSub:sec,
    fb:paraFb(P,q.form,prep)};
}
function paraFb(P,f,prep){
  const all=P.items.filter(x=>x.f===f), it=all[0];
  let h="";
  if(prep){
    h+=`<div class="entry">${gk(all.map(x=>x.c).join(" / "))}</div><div class="fbline">${esc(f)}</div><div class="fbline dim">발음: ${esc(it.p)} · ${esc(it.t)}</div>`;
    if(/함께/.test(f)) h+=`<div class="fbline dim">‘~과 함께’는 μετά + 속격 / σύν + 여격 / παρά + 여격</div>`;
  } else {
    h+=`<div class="entry">${gk(f)} <span class="fbline dim">(${esc(it.p)})</span></div>`;
    h+=`<div class="fbline">${all.map(x=>`${esc(x.c)} <span class="fbline dim">${decode(x.c,P.kind)}${x.d?" · 참고":""}</span>`).join("<br>")}</div>`;
    const ts=[...new Set(all.map(x=>x.t).filter(Boolean))];
    if(ts.length) h+=`<div class="fbline">${ts.map(esc).join(" / ")}</div>`;
    if(all.length>1) h+=`<div class="fbline dim">같은 형태라서 위 분석이 모두 가능해요.</div>`;
  }
  h+=`<div class="mine">${gk(P.note)}</div>`;
  return h;
}

function sigSwap(f){

const ALLCODES=[];

  if(v==="수" && !(t==="현"||t==="미완")) continue;
  ALLCODES.push(`${p}${n}${t}${v}직`);
}
function altCodes(code, form){
  const f=feat(code), out=new Set([code]);
  if((f.t==="현"||f.t==="미완") && (f.v==="중"||f.v==="수")) out.add(`${f.p}${f.n}${f.t}${f.v==="중"?"수":"중"}직`);
  if((f.t==="미완"||f.t==="2단과") && f.v==="능" && /ον$/.test(form) && ((f.p==="1"&&f.n==="단")||(f.p==="3"&&f.n==="복")))
    out.add(f.p==="1"?`3복${f.t}능직`:`1단${f.t}능직`);
  return out;
}
const XB=[];

PARSE.forEach((x,i)=>{

function ctxHtml(sid, form){
  if(!sid) return "";
  const s=SENT[sid], g=s[2], k=g.indexOf(form);

}
function parseFb(x){
  const [l,form,lem,lm,code,dep,t,sid]=x;
  let h=`<div class="entry">${gk(form)}</div><div class="fbline"><span class="gk">${esc(lem)}</span> ${esc(lm)}</div>`;
  h+=`<div class="fbline">${esc(code)}${dep?"디포":""} <span class="fbline dim">${decode(code)}${dep?" · 디포넌트(뜻은 능동)":""}</span></div>`;
  h+=`<div class="fbline">${esc(t)}</div>`;

  if(alts.length) h+=`<div class="fbline dim">형태만 보면 ${alts.map(esc).join(", ")}도 가능해요. 문맥으로 정해요.</div>`;

const pool=()=>TABS[tab].pool(ST[tab].sel, ST[tab].type);

function renderTabs(){

  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderTabs();renderPanel()});

function renderPanel(){
  const T=TABS[tab], S=ST[tab];
  let h=`<div class="group"><h2>범위</h2><div class="chips" id="chips"></div></div>`;
  if(T.types){
    h+=`<div class="group"><h2>문제 유형</h2><div class="seg" id="typeSeg">${T.types.map(([v,a,b])=>`<button data-t="${v}" aria-pressed="${S.type===v}">${a}${b?`<small>${b}</small>`:""}</button>`).join("")}</div></div>`;
  }

  const box=$("#chips"), keys=T.ranges.map(r=>r[0]);
  const all=document.createElement("button");
  all.className="chip"; all.textContent="전체"; all.setAttribute("aria-pressed", S.sel.size===keys.length);
  all.onclick=()=>{ if(S.sel.size===keys.length) S.sel.clear(); else keys.forEach(k=>S.sel.add(k)); renderPanel(); };
  box.appendChild(all);
  T.ranges.forEach(([k,label])=>{
    const b=document.createElement("button"); b.className="chip"; b.innerHTML=gk(label);

function updateCount(){
  const p=pool(), n=p.length, r=$("#countRange"), S=ST[tab];

function start(set){ lastSet=set.slice(); qs=shuffle(set); idx=0; log=[]; show("quiz"); render(); }
function render(){
  const q0=qs[idx];
  const q = q0.build ? Object.assign({}, q0, q0.build(q0)) : q0;
  $("#progTxt").textContent=`${idx+1} / ${qs.length}`;
  $("#progBar").style.width=(idx/qs.length*100)+"%";
  let h=`<span class="tag">${gk(q.tag)}</span>`;
  if(q.pre) h+=`<div class="pre ${q.preCls||""}">${gk(q.pre)}</div>`;
  if(q.wordHtml) h+=`<div class="word ${q.wordCls||""}">${q.wordHtml}</div>`;
  else {
    const len=q.word.length, long = (q.wordCls||"").includes("ko")||(q.wordCls||"").includes("code") ? "" : (len>24 ? " long xlong" : len>14 ? " long":"");
    h+=`<div class="word${long} ${q.wordCls||""}">${esc(q.word)}</div>`;
  }
  if(q.ctx) h+=q.ctx;
  if(q.type==="sa"){
    h+=`<p class="ask">뜻을 떠올려 보세요</p><div id="fb"><button class="reveal" id="revealBtn">탭해서 정답 보기</button></div>`;
    $("#card").innerHTML=h;
    $("#revealBtn").focus({preventScroll:true});
    $("#revealBtn").onclick=()=>{
      $("#fb").innerHTML=`<div class="feedback neutral"><div class="verdict">정답</div><div>${esc(q.ans)}</div>${posLine(q.pos)}${noteLine(q.note)}<div class="selfgrade"><button class="y" id="yBtn">맞았어요</button><button class="n" id="nBtn">틀렸어요</button></div></div>`;
      const grade=ok=>{record(q.id,ok); log.push({q,ok,mine:""}); advance()};
      $("#yBtn").onclick=()=>grade(true); $("#nBtn").onclick=()=>grade(false);
      $("#yBtn").focus({preventScroll:true});
    };
    return;
  }
  const n=q.opts.length, cols = q.cols===1?"cols1": q.cols===3?"cols3":"";
  h+=`${q.ask?`<p class="ask">${q.ask}</p>`:`<div style="height:18px"></div>`}<div class="opts ${cols}">`;
  q.opts.forEach(o=>h+=`<button class="opt ${q.optCls||""}" data-v="${esc(o.v)}" aria-pressed="false">${o.html}</button>`);
  const instant = !(q.src==="p"||q.src==="x");
  h+=`</div><div id="fb"></div><div class="actions${instant?" hidden":""}"><button class="primary" id="actBtn" disabled>정답 제출</button></div>`;
  $("#card").innerHTML=h;
  const okv = Array.isArray(q.ans)?q.ans:[q.ans];
  let pick=null, done=false;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(done) return;
    pick=b.dataset.v;
    document.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));
    $("#actBtn").disabled=false;
    if(instant) submit();
  });
  const submit=()=>{
    done=true; $(".actions").classList.remove("hidden");
    const ok=okv.includes(pick);
    document.querySelectorAll(".opt").forEach(b=>{
      b.disabled=true;
      if(okv.includes(b.dataset.v)) b.classList.add("right");
      else if(b.dataset.v===pick) b.classList.add("wrong");
    });
    const picked=q.opts.find(o=>o.v===pick);
    record(q.id, ok);
    log.push({q, ok, mine:picked?picked.label:""});
    const verdict = ok ? "정답이에요." : (q.src==="v" ? "정답은 "+esc(q.ansTxt)+josa(q.ansTxt) : "오답이에요. 정답: "+gk(q.ansTxt));
    $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}"><div class="verdict">${verdict}</div>${q.fb||""}</div>`;
    nextBtn();
  };
  $("#actBtn").onclick=submit;
}
function nextBtn(){
  const a=$("#actBtn");
  a.textContent = idx===qs.length-1 ? "결과 보기" : "다음 문제";
  a.disabled=false; a.onclick=advance; a.focus({preventScroll:true});
}
function advance(){idx++; if(idx>=qs.length) finish(); else {render(); window.scrollTo(0,0)}}

/* ================= 결과 ================= */
function finish(){
  $("#progBar").style.width="100%";
  const total=log.length, right=log.filter(x=>x.ok).length;
  const pct= total? Math.round(right/total*100):0;
  const emo = !total?"📖": pct>=90?"🏆":pct>=70?"🎉":pct>=50?"💪":"📖";
  const msg = !total?"아직 푼 문제가 없어요.": pct>=90?"거의 다 외웠어요.":pct>=70?"잘하고 있어요. 틀린 문제만 한 번 더 보세요.":pct>=50?"절반은 넘었어요. 오답노트로 한 번 더 돌려 보세요.":"오답노트부터 천천히 다시 봐요.";
  const wrong=log.filter(x=>!x.ok);
  let h=`<div class="result-head"><div class="emoji">${emo}</div><div class="score">${right}<span> / ${total}</span></div><p>${total?pct+"점 · ":""}${msg}</p></div>`;
  h+=`<div class="review"><h2>오답노트 ${wrong.length}개</h2>`;
  if(!wrong.length) h+=`<div class="empty">${total?"틀린 문제가 없어요.":"문제를 풀면 여기에 틀린 문제가 모여요."}</div>`;
  else {
    h+="<ol>";
    wrong.forEach(({q,mine})=>{
      const w=q.revWord||q.word, ans=q.type==="sa"?q.ans:q.ansTxt;
      h+=`<li><div class="q ${isGreek(w)?"isgk":""}">${gk(w)}<small>${gk(q.revSub||q.tag)}${q.pos?" · "+esc(q.pos):""}</small></div><div class="a">정답: ${gk(ans)}</div>${q.revExtra?`<div class="m">${gk(q.revExtra)}</div>`:""}${mine?`<div class="m">내 답: ${gk(mine)}</div>`:""}</li>`;
    });
    h+="</ol>";
  }
  h+=`</div><div class="btns">${wrong.length?`<button class="primary" id="rWrong">틀린 문제만 다시 풀기</button>`:""}<button class="ghost" id="rSame">같은 문제 다시 풀기</button><button class="ghost" id="rHome">처음으로</button></div>`;
  $("#result").innerHTML=h; show("result");
  if(wrong.length) $("#rWrong").onclick=()=>start(wrong.map(x=>ALLQ.get(x.q.id)));
  $("#rSame").onclick=()=>start(lastSet);
  $("#rHome").onclick=()=>{show("home"); if(VIEW.pane==="learn") renderLearn(); else renderPanel()};
}

const tw = (head, rows)=>`<div class="tw"><table class="t"><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
const CASES=["주","속","여","대","호"];
const paraTitle = P=>P.label.includes(P.lemma.split(/[, ]/)[0])?P.label:P.lemma+" · "+P.label;
function wordsBlock(ws){
  return tw(["낱말","뜻"], ws.map(w=>`<tr><td class="f fw">${esc(w.h)}${w.p?`<small>${esc(w.p)}</small>`:""}</td><td>${esc(w.m)}${w.n?`<small>${gk(w.n)}</small>`:""}</td></tr>`));
}
function paraBlock(P, its){
  let h=`<h3>${gk(paraTitle(P))}</h3><p class="note">${gk(P.note)}</p>`;
  if(P.kind==="verb"){
    const groups=new Map();
    its.forEach(it=>{const f=feat(it.c); const k=f.t+"|"+f.v; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(it)});
    const keys=[...groups.keys()], used=new Set();
    keys.forEach(k=>{
      if(used.has(k)) return;
      const g=groups.get(k), [t,v]=k.split("|");
      let title=`${T_[t]} ${V_[v]}`;
      const twin=keys.find(k2=>k2!==k && !used.has(k2) && k2.split("|")[0]===t && groups.get(k2).map(x=>x.f).join()===g.map(x=>x.f).join());
      if(twin){ used.add(twin); title=`${T_[t]} ${V_[v]} = ${V_[twin.split("|")[1]]}`; }
      used.add(k);
      const dim=g.every(x=>x.d);
      h+=`<div class="vtitle">${title}${dim?" · 비교용":""} <span class="fbline dim">${gk(P.lemma)}</span></div>`;
      h+=tw(["","형태","해석"], g.map((it,i)=>{
        const tt = twin ? `${esc(it.t)}<small>${esc(groups.get(twin)[i].t)}</small>` : esc(it.t);
        return `<tr class="${it.d?"dim":""}"><td class="k">${esc(it.c.slice(0,2))}</td><td class="f">${gk(it.f)}<small>${esc(it.p)}</small></td><td>${tt}</td></tr>`;
      }));
    });
  } else if(P.kind==="prep"){
    h+=tw(["전치사 + 격","뜻","과"], its.map(it=>`<tr><td class="f">${gk(it.c)}<small>${esc(it.p)}</small></td><td>${esc(it.f)}</td><td class="k">${esc(it.t)}</td></tr>`));
  } else {
    const cols=[...new Set(its.map(it=>it.c.slice(0,-1)))];
    const lab=k=>k.replace(/^3/,"").replace("남","남성 ").replace("여","여성 ").replace("중","중성 ").replace(/^1/,"1인칭 ").replace(/^2/,"2인칭 ");
    const rows=CASES.filter(c=>its.some(it=>it.c.endsWith(c))).map(c=>`<tr><td class="k">${C_[c]}</td>${cols.map(k=>{const it=its.find(x=>x.c===k+c);return it?`<td class="f"${it.d?' style="color:var(--muted)"':""}>${gk(it.f)}<small>${esc(it.p)}</small></td>`:"<td></td>"}).join("")}</tr>`);
    h+=tw(["",...cols.map(lab)], rows);
  }
  return h;
}

function parseBlock(xs){
  const bySent=new Map(), loose=[];
  xs.forEach(x=>{ if(x[7]){ if(!bySent.has(x[7])) bySent.set(x[7],[]); bySent.get(x[7]).push(x) } else loose.push(x) });
  const row=x=>`<tr><td class="f">${gk(x[1])}</td><td class="f">${gk(x[2])}<small>${esc(x[3])}</small></td><td>${esc(x[4])}${x[5]?"디포":""}<small>${esc(x[6])}</small></td></tr>`;
  let h="";
  if(loose.length) h+=tw(["형태","원형","분석"], loose.map(row));
  bySent.forEach((ys,sid)=>{
    const s=SENT[sid];
    h+=`<div class="sent"><div class="g">${gk(s[2])}</div><div class="k">${esc(s[3])}</div>${tw(["형태","원형","분석"], ys.map(row))}<div class="src">${s[0]}과 ${s[1]}번 · ${s[4]==="교재"?"교재 익힘 (강의안 풀이 없음)":"강의안 풀이"}</div></div>`;
  });
  return h;
}

/* ---------- 과 정보 ---------- */
const LTITLE={1:"알파벳",2:"악센트",3:"현재 능동태 직설법",4:"명사 제2변화, 어순, 움직이는 ν",5:"명사 제1변화",
  6:"관사, 제1·2변화 형용사, 관사와 형용사의 용법",7:"제1변화의 남성 명사, 전치사",8:"전접어, 3인칭 인칭대명사, εἰμί의 현재 직설법",
  9:"지시대명사, αὐτός 용법의 보충",10:"현재 중간태·수동태 직설법, ὑπό+속격, 수단의 여격, 디포넌트, 합성동사, οὐ의 위치, 동사가 지배하는 격",
  11:"미완료 능동태 직설법, 합성동사의 접두모음, εἰμί의 미완료, ἔστι(ν)의 악센트",12:"미완료 중간태·수동태 직설법, 중성 복수 주어와 단수 동사, καί와 οὐδέ",
  13:"미래 능동태·중간태 직설법",14:"단순과거 능동태·중간태 직설법, πιστεύω에 대하여",15:"제2단순과거 능동태·중간태 직설법"};
const NOML={anth:4,doron:4,huios:4,alet:5,doxa:5,graf:5,prof:7,art:6,agat:6,mikr:6,ego:8,auto:8,hout:9,ekei:9};
function itemLesson(P,it){
  if(P.kind==="prep") return parseInt(it.t);
  if(P.kind!=="verb") return NOML[P.id];
  if(P.id==="leipo") return 15;
  const f=feat(it.c);
  if(P.id==="eimi") return f.t==="현"?8:11;
  return {"현":f.v==="능"?3:10,"미완":f.v==="능"?11:12,"미래":13,"단과":14,"2단과":15}[f.t];
}
const SEC_START=[[1,1],[10,2],[17,3],[24,4],[43,5],[56,6],[72,7],[85,8],[95,9],[101,10],[113,11],[127,12],[139,13],[155,14],[165,15]];
const secLesson = n=>{let L=1; for(const [s,l] of SEC_START) if(n>=s) L=l; return L};
function refLessons(ref){
  const ns=[]; for(const m of ref.matchAll(/(\d+)(?:–(\d+))?/g)){ const a=+m[1], b=m[2]?+m[2]:a; for(let i=a;i<=b;i++) ns.push(i) }
  return [...new Set(ns.map(secLesson))];
}
const ENDL={A:[3,13],B:[10,13],C:[11,15],D:[12,15],E:[14],F:[14]};
const ppLessons = x=>x.l.split("·").map(Number);
function lessonOfQ(q){
  if(q.src==="v") return [q.l];
  if(q.src==="p"){ const P=PARA[q.pi]; const it = q.dir==="cf"?P.items[q.ii]:P.items.find(x=>x.f===q.form); return [itemLesson(P,it)] }
  if(q.src==="e") return ENDL[ENDS[q.set].k];
  if(q.src==="x") return [PARSE[q.i][0]];
  if(q.src==="al") return [1];
  const m=q.id.match(/^(ppfr|ppar|ppf|ppa|r)(\d+)$/);
  if(m[1]==="r") return [RQ[+m[2]][1]];
  return ppLessons(PPO[+m[2]]);
}
const lessonPool = L=>[...ALLQ.values()].filter(q=>lessonOfQ(q).includes(L));

/* ================= 학습 탭 ================= */
const TOPICS=[["v","단어"],["p","변화표"],["e","어미"],["r","특이사항"],["x","익힘 파싱"]];
const LS_VIEW="gk_1_15_view_v1";
let VIEW={pane:"learn", lm:"lesson", topic:"p", lesson:1};
try{ Object.assign(VIEW, JSON.parse(localStorage.getItem(LS_VIEW)||"{}")) }catch(e){}
const saveView=()=>{ try{ localStorage.setItem(LS_VIEW, JSON.stringify(VIEW)) }catch(e){} };

function topicView(k){
  let h="";
  if(k==="v"){
    h+=`<p class="lead">강의안 낱말 모음 순서예요. 명사는 관사와 함께, 동사는 ‘내가 ~하다’로 외워요.</p>`;
    LESSONS.forEach(l=>{ const ws=WORDS.filter(w=>w.l===l); h+=`<h2>${l}과 <span class="fbline dim">${ws.length}개</span></h2>`+wordsBlock(ws) });
  } else if(k==="p"){
    h+=`<p class="lead">회색 칸은 비교용 참고예요. 같은 칸끼리 세로로 소리 내어 읽어 보세요.</p>`;
    SECS.forEach(([sec,name])=>{
      h+=`<h2>${gk(name)}</h2>`;
      PARA.forEach(P=>{ const its=P.items.filter(it=>(it.s||P.sec)===sec); if(its.length) h+=paraBlock(P,its) });
    });
  } else if(k==="e"){
    h+=`<p class="lead">어미는 연결모음(μ, ν 앞 ο / 그 밖 ε)까지 붙인 모양으로 외워요. 굵은 줄을 리듬 있게 소리 내어 읽으세요.</p>`;
    h+=`<h2>시제 조립표</h2>`+formulaBlock(FORMULA)+`<p class="note">제1시제 = 현재·미래(·현재완료), 제2시제 = 미완료·단순과거(·과거완료). 제2시제 직설법에는 접두모음 ἐ가 붙어요.</p>`;
    h+=`<h2>제1시제 어미</h2>`+endBlock(ENDS[0])+endBlock(ENDS[1]);
    h+=`<h2>제2시제 어미</h2>`+endBlock(ENDS[2])+endBlock(ENDS[3]);
    h+=`<h2>단순과거 어미</h2>`+endBlock(ENDS[4])+endBlock(ENDS[5]);
  } else if(k==="r"){
    h+=`<p class="lead">★는 강의안에 ★ 또는 ‘모두 외우기!’로 표시된 내용, 〔교재〕는 교재에서 보충한 내용이에요. § 번호는 강의안·교재 공통 항목 번호예요.</p>`;
    RG.forEach(([g,name,ls])=>{
      h+=`<h2>${gk(name)} <span class="fbline dim">${esc(ls)}</span></h2>`;
      if(g==="al") h+=alphaBlock();
      else if(g==="pp") h+=ppBlock(PPO);
      else h+=RULES.filter(r=>r[0]===g).map(ruleCard).join("");
    });
  } else {
    h+=`<p class="lead">익힘 문제에 나온 동사 형태를 문장과 함께 모았어요. 강의안 풀이를 그대로 따랐고, ‘교재 익힘’은 강의안 풀이가 없는 문장이에요.</p>`;
    XGRP.forEach(([g,name])=>{ h+=`<h2>${name}</h2>`+parseBlock(PARSE.filter(x=>(x[0]<10?9:x[0])===g)) });
  }
  const T=TABS[k];
  h+=`<div class="cta"><button class="primary" id="goQuiz">${esc(T.name)} 문제 풀러 가기</button></div>`;
  return h;
}
function lessonView(L){
  let h=`<h1>제${L}과</h1><p class="lead">${gk(LTITLE[L])}</p>`;
  if(L===1) h+=`<h2>알파벳</h2>`+alphaBlock();
  const ws=WORDS.filter(w=>w.l===L);
  if(ws.length) h+=`<h2>낱말 모음 <span class="fbline dim">${ws.length}개</span></h2>`+wordsBlock(ws);
  let ph="";
  PARA.forEach(P=>{ const its=P.items.filter(it=>itemLesson(P,it)===L); if(its.length) ph+=paraBlock(P,its) });
  if(ph) h+=`<h2>변화표</h2>`+ph;
  const es=ENDS.filter(E=>ENDL[E.k].includes(L));
  if(es.length){
    const fr=FORMULA.filter(f=>f[3].split("·").map(s=>parseInt(s)).includes(L));
    h+=`<h2>어미</h2>`+(fr.length?formulaBlock(fr):"")+es.map(endBlock).join("");
  }
  const rs=RULES.filter(r=>refLessons(r[3]).includes(L));
  if(rs.length) h+=`<h2>정리 <span class="fbline dim">${rs.length}개</span></h2>`+rs.map(ruleCard).join("");
  const pps=PPO.filter(x=>L>=13 && ppLessons(x).includes(L));
  if(pps.length) h+=`<h2>기본형</h2>`+ppBlock(pps);
  const xs=PARSE.filter(x=>x[0]===L);
  if(xs.length) h+=`<h2>익힘 파싱 <span class="fbline dim">${xs.length}개</span></h2>`+parseBlock(xs);
  const n=lessonPool(L).length;
  h+=`<div class="cta btns">${n?`<button class="primary" id="lq20">${L}과 문제 ${Math.min(20,n)}개 풀기</button>${n>20?`<button class="ghost" id="lqAll">${L}과 전부 풀기 (${n}개)</button>`:""}`:""}</div>`;
  const nav=[];
  if(L>1) nav.push(`<button class="ghost" id="lPrev">← ${L-1}과</button>`);
  if(L<15) nav.push(`<button class="ghost" id="lNext">${L+1}과 →</button>`);
  h+=`<div class="lnav">${nav.join("")}</div>`;
  return h;
}
function renderLearn(){
  document.querySelectorAll("#learnSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===VIEW.lm));
  const box=$("#learnChips");
  const items = VIEW.lm==="lesson" ? Array.from({length:15},(_,i)=>[i+1,(i+1)+"과"]) : TOPICS;
  const cur = VIEW.lm==="lesson" ? VIEW.lesson : VIEW.topic;
  box.innerHTML=items.map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${k===cur}">${esc(l)}</button>`).join("");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(VIEW.lm==="lesson") VIEW.lesson=+b.dataset.k; else VIEW.topic=b.dataset.k;
    saveView(); renderLearn(); $("#learnChips").scrollIntoView({block:"start"});
  });
  const body=$("#learnBody");
  body.innerHTML = VIEW.lm==="lesson" ? lessonView(VIEW.lesson) : topicView(VIEW.topic);
  const hs=[...body.querySelectorAll("h2")];
  hs.forEach((h2,i)=>h2.id="sec"+i);
  $("#toc").innerHTML = hs.length>1 ? `<span>바로 가기</span>${hs.map((h2,i)=>{const c=h2.cloneNode(true); c.querySelectorAll(".dim").forEach(x=>x.remove()); return `<button data-i="${i}">${gk(c.textContent.trim())}</button>`}).join("")}` : "";
  $("#toc").querySelectorAll("button").forEach(b=>b.onclick=()=>$("#sec"+b.dataset.i).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"}));
  const on=(id,f)=>{const el=$("#"+id); if(el) el.onclick=f};
  on("goQuiz",()=>{ tab=VIEW.topic; setPane("quiz"); renderTabs(); renderPanel(); window.scrollTo(0,0) });
  on("lq20",()=>start(shuffle(lessonPool(VIEW.lesson)).slice(0,20)));
  on("lqAll",()=>start(lessonPool(VIEW.lesson)));
  on("lPrev",()=>{VIEW.lesson--; saveView(); renderLearn(); window.scrollTo(0,0)});
  on("lNext",()=>{VIEW.lesson++; saveView(); renderLearn(); window.scrollTo(0,0)});
}
function setPane(p){
  VIEW.pane=p; saveView();
  document.querySelectorAll("#topNav button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===p));
  $("#learnPane").classList.toggle("hidden", p!=="learn");
  $("#quizPane").classList.toggle("hidden", p!=="quiz");
}
document.querySelectorAll("#topNav button").forEach(b=>b.onclick=()=>{ setPane(b.dataset.v); if(b.dataset.v==="learn") renderLearn(); else renderPanel(); });
document.querySelectorAll("#learnSeg button").forEach(b=>b.onclick=()=>{ VIEW.lm=b.dataset.m; saveView(); renderLearn() });
const upBtn=$("#upBtn");
window.addEventListener("scroll",()=>{ upBtn.classList.toggle("hidden", !(window.scrollY>700 && !$("#home").classList.contains("hidden") && VIEW.pane==="learn")) },{passive:true});
upBtn.onclick=()=>window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});

renderTabs(); renderPanel(); renderLearn(); setPane(VIEW.pane);
</script>
</body>
</html>
