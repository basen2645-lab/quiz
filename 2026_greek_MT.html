<style>
:root{
  --bg:#F2F1F7; --surface:#FFFFFF; --field:#F4F3F8; --ink:#1F1C2C; --muted:#78748A; --line:#E7E5EE;
  --accent:#6C3EE6; --accent-ink:#FFFFFF; --soft:#EFEAFE; --hero:#6C3EE6; --hero-ink:#FFFFFF; --mark:#FFE7A3;
  --ok:#2F7BEA; --ok-bg:#EAF2FE; --bad:#E5484D; --bad-bg:#FDEDEE;
  --greek:"GentiumGk","Noto Serif","Times New Roman","Noto Sans KR",serif;
  --ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14121B; --surface:#1D1A27; --field:#262232; --ink:#ECEAF4; --muted:#A39FB5; --line:#332E43;
    --accent:#A98BFF; --accent-ink:#170F2E; --soft:#2C2545; --hero:#4A2DB4; --hero-ink:#FFFFFF; --mark:#5A4716;
    --ok:#7DB3FF; --ok-bg:#1B2A44; --bad:#FF8A8E; --bad-bg:#3D1F24;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14121B; --surface:#1D1A27; --field:#262232; --ink:#ECEAF4; --muted:#A39FB5; --line:#332E43;
  --accent:#A98BFF; --accent-ink:#170F2E; --soft:#2C2545; --hero:#4A2DB4; --hero-ink:#FFFFFF; --mark:#5A4716;
  --ok:#7DB3FF; --ok-bg:#1B2A44; --bad:#FF8A8E; --bad-bg:#3D1F24;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 0 48px}
.gk{font-family:var(--greek)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* 표지 */
.hero{background:var(--hero);color:var(--hero-ink);text-align:center;padding:18px 22px 46px;position:relative}
.hero .appname{font-size:14px;font-weight:700;opacity:.92;margin:0}
.hero .gtitle{font-family:var(--greek);font-weight:400;font-size:clamp(22px,6.3vw,32px);line-height:1.3;margin:22px auto 6px;letter-spacing:.005em;text-wrap:balance;max-width:16em}
.hero .ktitle{margin:0;font-size:14px;opacity:.85}
.hero svg{display:block;width:118px;height:auto;margin:18px auto 0}
.sheet{background:var(--surface);border-radius:26px 26px 0 0;margin-top:-26px;position:relative;padding:20px 18px 8px;min-height:60vh}
@media (min-width:600px){
  .wrap{margin-top:24px}
  .hero{border-radius:28px 28px 0 0}
  .sheet{border-radius:26px;min-height:0;margin-bottom:24px}
}

/* 큰 메뉴 = 미션 정보/현황 스타일 */
.top{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 0 18px;background:var(--field);border-radius:999px;padding:4px}
.top button{border:0;border-radius:999px;background:transparent;padding:9px 6px;font-size:15px;font-weight:700;color:var(--muted);line-height:1.3}
.top button small{display:none}
.top button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.group{margin-bottom:22px}
.group h2{font-size:15px;font-weight:700;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--field);border-radius:999px;padding:7px 14px;font-size:14px;min-height:36px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg{display:flex;gap:4px;background:var(--field);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:14px;line-height:1.35;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;color:var(--accent);box-shadow:0 1px 3px rgba(40,20,90,.12)}
.seg small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.slider-row{display:flex;align-items:center;gap:14px}
input[type=range]{flex:1;accent-color:var(--accent)}
.count{font-weight:700;font-size:20px;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)}
.avail{color:var(--muted);font-size:13px;margin-top:6px}
.primary{width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:15px;margin-top:6px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:500;color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:20px}
.tabs button{border:0;background:var(--field);border-radius:12px;padding:9px 2px 8px;font-size:14px;font-weight:700;color:var(--muted);line-height:1.3;word-break:keep-all}
.tabs button small{display:block;font-size:11px;font-weight:400}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--soft)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px}

/* 문제 화면 */
#quiz,#result{padding:20px 18px 0}
.topbar{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:10px;font-weight:500}
.topbar button{border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--surface);border-radius:20px;padding:22px 18px 22px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:6px;padding:2px 8px;margin-bottom:16px}
.word{font-family:var(--greek);font-size:clamp(40px,11vw,58px);line-height:1.15;text-align:center;margin:4px 0 6px;word-break:keep-all;overflow-wrap:anywhere}
.word.long{font-size:clamp(28px,8vw,42px)}
.word.xlong{font-size:clamp(22px,6vw,32px)}
.word.code{font-family:var(--ui);font-weight:700;font-size:clamp(28px,8vw,38px);letter-spacing:.02em}
.word.ko{font-family:var(--ui);font-weight:700;font-size:clamp(22px,6.5vw,30px)}
.word.qtext{font-family:var(--ui);font-weight:700;font-size:18px;line-height:1.5;text-align:left;margin:0 0 4px}
.word.qtext .gk{font-size:1.15em;font-weight:400}
.ctx{margin:12px 0 4px;padding:12px 14px;border-radius:12px;background:var(--field);font-family:var(--greek);font-size:19px;line-height:1.55}
.ctx mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.ctx small{display:block;font-family:var(--ui);font-size:12px;color:var(--muted);margin-top:4px}
.pre{text-align:center;font-family:var(--greek);font-size:20px;color:var(--muted);margin-bottom:2px}
.pre.ui{font-family:var(--ui);font-size:15px}
.ask{text-align:center;color:var(--muted);margin:14px 0 20px;font-size:15px}
.ask b{color:var(--ink);font-weight:500}
.opts{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.opts.cols3{grid-template-columns:repeat(3,1fr)}
.opts.cols1{grid-template-columns:1fr}
.opt{border:1.5px solid transparent;background:var(--field);border-radius:12px;padding:13px 10px;font-size:16px;text-align:center;min-height:54px;line-height:1.4;color:var(--ink)}
.opts.cols1 .opt{text-align:left;padding:13px 16px}
.opt .gk{font-size:1.15em}
.opt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt.gkopt{font-family:var(--greek);font-size:22px;line-height:1.25}
.opt.small{font-size:15px}
.feedback{margin-top:18px;border-radius:12px;padding:14px 16px;font-size:15px}
.feedback.ok{background:var(--ok-bg)}
.feedback.no{background:var(--bad-bg)}
.feedback.neutral{background:var(--soft)}
.feedback .verdict{font-weight:700;margin-bottom:4px}
.feedback.ok .verdict{color:var(--ok)}
.feedback.no .verdict{color:var(--bad)}
.entry{font-family:var(--greek);font-size:19px}
.mine{color:var(--muted);font-size:14px;margin-top:6px}
.fbline{margin-top:2px}
.fbline.dim{color:var(--muted);font-size:14px}
.ref{display:inline-block;font-size:12px;color:var(--muted);background:var(--field);border-radius:6px;padding:0 7px;margin-top:8px}
.selfgrade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.selfgrade button{border-radius:12px;padding:13px;font-weight:700;border:1.5px solid}
.selfgrade .y{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.selfgrade .n{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.actions{margin-top:18px}
.reveal{width:100%;min-height:120px;border:1.5px dashed var(--accent);border-radius:14px;background:var(--soft);color:var(--accent);font-size:16px;font-weight:700}
.pos{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--accent);background:var(--surface);border-radius:6px;padding:1px 8px}

/* 결과 */
.result-head{text-align:center;margin:12px 0 22px;background:var(--surface);border-radius:20px;padding:22px 16px}
.result-head .emoji{font-size:52px;line-height:1}
.result-head .score{font-size:44px;font-weight:700;margin:8px 0 0;font-variant-numeric:tabular-nums;color:var(--accent)}
.result-head .score span{font-size:22px;color:var(--muted);font-weight:500}
.result-head p{margin:4px 0 0;color:var(--muted)}
.review h2{font-size:16px;margin:0 0 10px}
.review ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.review li{background:var(--surface);border-radius:14px;padding:12px 14px;position:relative;padding-left:18px}
.review li::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0;background:var(--bad)}
.review .q{font-size:17px}
.review .q.isgk{font-family:var(--greek);font-size:20px}
.review .q small{font-family:var(--ui);font-size:13px;color:var(--muted);margin-left:6px}
.review .a{font-size:15px}
.review .m{font-size:13px;color:var(--muted)}
.btns{display:grid;gap:10px;margin-top:22px}
.empty{color:var(--muted);text-align:center;padding:12px}

/* 학습 화면 */
#learnSeg{margin-bottom:0}
#learnSeg small{display:none}
.lbar{display:flex;gap:8px;align-items:center;margin:12px 0 0}
.lbar .learnchips{flex:1;min-width:0}
.stepper{display:flex;gap:6px;align-items:center}
.stepper button{flex:none;width:44px;height:44px;border:0;background:var(--field);border-radius:12px;font-size:22px;color:var(--accent);line-height:1}
.stepper button:disabled{opacity:.35}
.stepper select{flex:1;min-width:0;height:44px;border:0;border-radius:12px;background:var(--field);color:var(--ink);font:inherit;font-size:15px;font-weight:700;padding:0 12px;text-overflow:ellipsis}
.study h1{font-size:20px;margin:0}
#learnBody h1{margin-top:22px}
.lhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.study .lead{color:var(--muted);font-size:14px;margin:2px 0 16px}
.study h3{font-size:15px;margin:18px 0 8px}
.study h3 .gk{font-size:1.2em;font-weight:700}
.study .note{font-size:13.5px;color:var(--muted);margin:0 0 10px;padding-left:22px;position:relative}
.study .note::before{content:"i";position:absolute;left:0;top:.2em;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font-size:10px;font-weight:700;line-height:12px;text-align:center;font-style:normal}
details.sec{background:var(--field);border-radius:16px;margin-bottom:10px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:15px 16px;font-size:16px;font-weight:700}
details.sec>summary::-webkit-details-marker,details.sent>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec .sc{font-size:13px;font-weight:500;color:var(--accent)}
details.sec .sb{padding:0 12px 14px}
details.sec .sb>h3:first-child{margin-top:2px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 8px;border-radius:12px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
table.t th{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
table.t td.f{font-family:var(--greek);font-size:18px;white-space:nowrap}
table.t td.f small,table.t td small{display:block;font-family:var(--ui);font-size:12px;color:var(--muted)}
table.t td.fw{white-space:normal;width:50%}
table.t td.k{white-space:nowrap;color:var(--muted);font-size:13px}
table.t tr.dim td{color:var(--muted)}
table.t tr.dim td.f{color:var(--muted)}
.vtitle{font-size:13px;font-weight:700;color:var(--accent);margin:14px 0 6px}
.chant{font-size:15px;font-weight:700;margin:4px 0 8px;color:var(--ink)}
.rule{background:var(--surface);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.rule h4{margin:0 0 4px;font-size:14.5px;color:var(--accent)}
.rule h4 .star{margin-right:4px}
.rule p{margin:0 0 3px;font-size:14px}
.rule .gk{font-size:1.12em}
.sent{background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.sent .g{font-family:var(--greek);font-size:18px;line-height:1.5}
.sent .k{font-size:14px;color:var(--muted);margin:2px 0 6px}
.sent .src{font-size:12px;color:var(--muted)}
details.sent>summary{list-style:none;cursor:pointer}
details.sent .peek{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:6px;padding:1px 8px}
details.sent[open] .peek{color:var(--muted);background:var(--field)}
details.sent[open]>summary{margin-bottom:8px}
details.sent .tw{background:var(--field)}
.study .cta{margin-top:20px}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.lnav .ghost{flex:1}
.upbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:20px;font-weight:700;box-shadow:0 4px 14px rgba(70,30,170,.3)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}details.sec>summary::after{transition:none}}
@media (max-width:380px){.opts.cols3{grid-template-columns:repeat(2,1fr)}.tabs button{font-size:13px}}
</style>
</head>

1변화는 여성(ἡ).\n예외: ἔρημος(빈들)와 ὁδός(길)는 -ος인데 여성(ἡ).\n-ης 제1변화 남성: προφήτης, μαθητής (ὁ).","§26–29, §56, §73",0],["nm","제1변화 여성 세 유형","① 어근이 ε, ι, ρ로 끝나면 단수 내내 α: ἀλήθεια, -ας, -ᾳ, -αν\n② 그 밖의 -α: 단수 속격·여격만 η: δόξα, -ης, -ῃ, -αν\n③ 주격 -η: 단수 내내 η: γραφή, -ῆς, -ῇ, -ήν\n복수는 셋 다 -αι, -ῶν, -αις, -ας","§48–54",1],["nm","제1변화 남성 -ης","단수 주격(-ης)·속격(-ου)·호격(-α)만 다르고 나머지는 제1변화 여성과 같아요.\nπροφήτης와 μαθητής는 악센트 위치만 달라요.","§73–74",0],["nm","중성 명사 공통 규칙","모든 중성 명사는 주격 = 대격 = 호격. 복수 주·대·호격은 짧은 -α로 끝나요.\n속격·여격은 남성 제2변화와 같아요.","§38–39",0],["nm","관사","ὁ, ἡ, οἱ, αἱ에는 τ가 없고 악센트도 없어요(후접어).\n중성 단수 주·대격은 τό (τόν 아님). 관사에는 호격이 없어요.\n헬라어에는 정관사만 있으니 관사가 없으면 ‘한 ~’으로 번역할 수 있어요.","§60–64",1],["nm","형용사 한정·서술 (형전관사, 유한무서)","한정적(그 좋은 말씀): ὁ ἀγαθὸς λόγος / ὁ λόγος ὁ ἀγαθός → 형용사 바로 앞에 관사.\n서술적(그 말씀은 좋다): ὁ λόγος ἀγαθός / ἀγαθὸς ὁ λόγος → 형용사 앞에 관사 없음.\n명사에 관사가 없으면(ἀγαθὸς λόγος) 둘 다 가능해서 문맥으로.\n독립적 용법: ὁ ἀγαθός 그 좋은 남자, τὰ ἀγαθά 그 좋은 것들.","§65–70",1],["nm","격 어미 헷갈리는 짝","-οις(복수 여격) ↔ -ους(복수 대격): λόγοις 말씀들에게 / λόγους 말씀들을\n-ῃ(단수 여격) ↔ -ην(단수 대격): γραφῇ / γραφήν\n-ον(단수 대격, ο) ↔ -ων(복수 속격, ω): ἄνθρωπον / ἀνθρώπων","§30, §52",0],["nm","움직이는 ν · 어순","-ουσι(ν), -ε(ν), ἐστί(ν) 등은 모음 앞이나 문장 끝에서 ν가 붙어요(자음 앞에도 가끔).\n격 어미가 역할을 보여 주므로 어순이 아니라 어미를 보고 번역해요. 강조하는 말을 앞에 둬요.","§40–41",0],["pr","인칭대명사 쓰임","주격 대명사(ἐγώ, σύ)는 강조·대조할 때만 써요(동사 어미에 주어가 있음).\n소유는 비강조 속격: ὁ λόγος μου (ἐμοῦ ×).\n전치사 뒤에는 강조형: δι’ ἐμοῦ, ἐξ ἐμοῦ, ἐν ἐμοί (단, πρός με는 흔함).\n대명사는 선행사와 성·수가 일치, 격은 달라도 돼요.","§88–91",1],["pr","αὐτός 세 가지 용법","① 서술적 위치(관사 없이): αὐτὸς ὁ ἀπόστολος 그 사도 자신이\n② 한정적 위치(관사 뒤): ὁ αὐτὸς ἀπόστολος 바로 그(같은) 사도\n③ 숨은 주어 강조: αὐτὸς λέγω 나 자신이 말한다, αὐτοὶ λέγετε 너희 자신이 말한다\nαὐτή(그 여자, 연한 숨표) ≠ αὕτη(이 여자, 거친 숨표).","§99",1],["pr","지시대명사 οὗτος, ἐκεῖνος","어미에 ο 소리 → 어근 ου(τούτου), α·η 소리 → αυ(ταύτης).\nτ가 없는 넷: οὗτος, αὕτη, οὗτοι, αὗται.\n중성 단수 주·대격: τοῦτο, ἐκεῖνο, αὐτό (-ν 없음).\n명사와 쓸 때 명사는 관사를 갖고 지시대명사는 서술적 위치: οὗτος ὁ λόγος / ὁ λόγος οὗτος.","§96–98",1],["pr","εἰμί","εἶ 말고는 모두 전접어. 자동사라서 보어는 반드시 주격(주격보어).\nἐστί(ν)이 ἔστι(ν)이 되는 때: 문장 처음, 존재·가능의 뜻, οὐκ·μή·εἰ·ὡς·καί·ἀλλ’·ἀλλά·τοῦτ’·τοῦτο 뒤.","§92–93, §125",0],["pr","전접어 앞 악센트","① 앞 낱말 얼티마의 애큐트는 그레이브로 안 바뀜: ἀδελφός μου\n② 앞 낱말이 앤티피널트 애큐트나 피널트 써컴플렉스면 얼티마에 애큐트 하나 더: ἄνθρωπός μου, δῶρόν ἐστιν\n③ 앞 낱말이 후접어나 전접어면 그 얼티마에 애큐트: εἴς με\n④ 두 음절 전접어가 피널트 애큐트 낱말 뒤에 오면 자기 악센트: ὥρα ἐστίν\n후접어(ὁ, ἐν, εἰς, οὐ)는 뒤 낱말에, 전접어(μου, με, ἐστιν)는 앞 낱말에 붙어요.","§87",0],["pr","후치어 δέ, γάρ","절의 맨 앞에 올 수 없고 보통 둘째 자리에 와요: ὁ δὲ ἀπόστολος…, οὐδὲ γὰρ …","§86, §165",0],["vb","파싱 순서와 시제 체계","원형 / 인칭 / 수 / 시제 / 태 / 법 (예: λύω 1단현능직).\n제1시제: 현재·미래·현재완료 · 제2시제(접두모음 ἐ): 미완료·단순과거·과거완료.\n현재형은 단순현재와 진행 둘 다(βλέπω 본다, 보고 있다). 현재형을 ‘~했다’로 옮기지 않기.","§18, §22",0],["vb","시제는 동작의 종류","계속·반복 → 현재(과거의 계속은 미완료 ‘~하고 있었다, ~하곤 했다’)\n완료된 동작 → 완료 · 단순한 발생 → 단순과거(ἀόριστος, 정함이 없는)\n시간 구분(과거·현재·미래)은 직설법에서만.","§114, §156–158",0],["vb","태: 중간태 · 디포넌트","중간태: 동작의 결과가 주어에게(‘나를 위하여’). ἄρχω 지배하다 / ἄρχομαι 시작하다처럼 뜻이 달라지기도.\n현재·미완료는 중간 = 수동 모양(익힘에서는 수동으로 처리).\n미래·단순과거는 중간과 수동이 다른 모양.\n디포넌트: 모양은 중간·수동, 뜻은 능동. 현재 디포는 미완료에서도 디포(ἠρχόμην).","§102, §108, §133, §143",0],["vb","줄어드는 어미","-εσαι → -ῃ (λύῃ) · -εσο → -ου (ἐλύου, ἐλίπου) · -σασο → -σω (ἐλύσω)\n미완료·제2단과 능동 1단과 3복은 같은 모양(ἔλυον): 문맥으로 가려요.","§105, §130, §160, §171",0],["vb","행위자와 수단","ὑπό + 속격: ~로 말미암아(행위자), 수동태와 함께.\n전치사 없는 여격: 수단(~으로) — τῷ λόγῳ 그 말씀으로.","§106–107",0],["vb","동사가 지배하는 격","ἀκούω + 속격: 듣다 / + 대격: 순종하다(강의안 해석)\nἄρχω + 속격: 지배하다\nπιστεύω + 여격 또는 εἰς + 대격: 믿다\nεἰμί, γίνομαι + 주격보어\nπροσφέρω: 가져가는 것은 대격, 받는 이는 여격","§111, §163, §165",0],["vb","οὐ · καί · οὐδέ · μέν…δέ","οὐ: 부정하는 낱말 바로 앞. 모음(연한 숨표) 앞 οὐκ, 거친 숨표 앞 οὐχ.\nκαί가 ‘역시, ~까지도’면 강조하는 낱말 바로 앞. καί … καί 둘 다(both … and).\nοὐδέ: 그리고 … 아니, ~까지도 아니. οὐδέ … οὐδέ: neither … nor.\nμέν … δέ: 대조. μέν은 보통 번역 안 하고 δέ를 ‘그러나’로.","§110, §135–137, §113",0],["vb","중성 복수 주어 + 단수 동사","τὰ δαιμόνια ἐξέρχεται 그 귀신들이 나간다 — 중성 복수 주어는 3인칭 단수 동사를 취할 수 있어요(복수 동사도 가능).","§134",0],["ag","접두모음 (제2시제 직설법)","자음으로 시작: ἐ를 붙임 — ἔλυον, ἐγίνωσκον\n모음으로 시작: 첫 모음을 길게 — ε → η (ἤγειρον), ο → ω, α → η (ἤκουον, 긴 α가 아님), αι → ῃ (ᾖρον)\n악센트는 접두모음을 넘어갈 수 없어요: ἀπῆγον (ἄπηγον ×).","§115–118, §123",1],["ag","합성동사의 접두모음","전치사와 동사 사이에 붙어요: ἐκβάλλω → ἐξέβαλλον (ἐκ는 모음 앞에서 ἐξ).\n전치사의 끝 모음은 모음 앞에서 떨어져요: ἀποκτείνω → ἀπέκτεινον, ἀπό + ἄγω = ἀπάγω → ἀπῆγον.\n같은 방식: παρελάμβανον, συνῆγον, ἐξεπορευόμην, ἐπέστρεψα, ὑπέστρεψα, ἀπέλυσα.","§122",0],["ag","합성동사의 뜻","전치사의 뜻이 더해지는 경우: ἐκ + πορεύομαι = ἐκπορεύομαι 나가다.\n합쳐도 뜻이 드러나지 않는 경우: ἀπό + κρίνομαι = ἀποκρίνομαι 대답하다.","§109",0],["fu","미래 = 원어근 + σ","현재 어근이 아니라 원어근에 시제 접미어 σ를 붙이고, 어미는 현재와 같아요.\nλύ-ω → λύ-σ-ω. 미래 중간태는 ‘나를 위하여 ~할 것이다’(미래 수동은 16과).","§140–144",1],["fu","자음 + σ","순음 π, β, φ + σ → ψ: πέμψω, τρίψω, γράψω\n구개음 κ, γ, χ + σ → ξ: διώξω, ἄξω, ἄρξω\n설음 τ, δ, θ + σ → 앞 자음이 빠지고 σ: σπεύσω, πείσω\nθάπτω → θάψω: τ가 빠지고 남은 π가 σ와 만나 ψ (교재·강의안은 설음 보기로 듦)","§145",1],["fu","원어근이 다른 동사","κηρύσσω: 원어근 κηρυκ- → κηρύξω\nβαπτίζω: 원어근 βαπτιδ- → βαπτίσω\n거꾸로 추적: ἄξω → ξ 안에 σ → ἄκω? ἄγω? ἄχω? → 사전으로 ἄγω 확인.","§146, §150",0],["fu","불규칙 미래와 미래 디포넌트","미래는 불규칙이 많으니 사전(기본형)으로 확인해요.\nἔρχομαι → ἐλεύσομαι, βαίνω → βήσομαι, γίνομαι → γενήσομαι, γινώσκω → γνώσομαι, λαμβάνω → λήμψομαι, βλέπω → ὄψομαι, ἔχω → ἕξω(숨표 주의)\nβαίνω처럼 현재는 능동인데 미래만 중간태형인 동사 = 미래 디포넌트.","§147, §149, §153",1],["fu","기본형 여섯 개","현재 능동 · 미래 능동 · 단순과거 능동 · 현재완료 능동 · 현재완료 수동 · 단순과거 수동의 1인칭 단수 직설법.\n미완료는 현재 어근으로 만들기 때문에 기본형에 없어요.\n합성동사는 전치사를 떼고 찾기: ἀπελεύσεσθε → ἐλεύσομαι → ἔρχομαι → ἀπέρχομαι.","§148, §152",0],["ao","단순과거 능동·중간","ἐ + 원어근 + σα + 제2시제 어미.\n능동: 1단 ν 탈락(ἔλυσα), 3단 σα → σε(ν). 3복 ἔλυσαν은 1단과 달라요(미완료 ἔλυον과 비교).\n중간: 2단 ἐλύσασο → ἐλύσω. σα가 붙을 때 자음 변화는 미래의 σ와 같아요(ἐκήρυξα, ἐπέστρεψα, ἔπεισα).","§159–162",1],["ao","제2단순과거","단순과거와 같은 시제, 변화 형식만 다름(규칙 worked / 불규칙 went처럼).\nσα 없이 어근 자체가 바뀌고, 어미는 미완료와 같아요: λαμβάνω → λαβ- → ἔλαβον, βάλλω → βαλ- → ἔβαλον.\n미완료와의 차이는 어근뿐: ἔλειπον(미완료) / ἔλιπον(제2단과), ἔβαλλον / ἔβαλον.\n중간 2단 -εσο → -ου (ἐλίπου). 제2단과 어근은 능·중에만 쓰고, 제2단과 수동은 따로 없어요.","§158, §166–172",1],["ao","제2단순과거 목록 (모두 외우기)","ἔβαλον ← βάλλω · ἐγενόμην ← γίνομαι(디포) · εἶδον ← βλέπω(ὁράω) · εἶπον ← λέγω · ἔλαβον ← λαμβάνω · ἔλιπον ← λείπω · ἔπεσον ← πίπτω · ἤγαγον ← ἄγω · ἦλθον ← ἔρχομαι\nἤνεγκα ← φέρω: 단순과거처럼 변하지만 -σα 대신 -κα.\nεἶδον은 신약에서 단순과거 어미를 취하기도 해요.","§165",1],["ps","단순과거 수동태 = 원어근 + θη","기본형 제6형(단순과거 수동태 어근)을 기초로 해요. 원어근에 θε를 붙이고, 직설법에서는 θη로 길어져요: λυθε- → λυθη-.\n제2시제라 접두모음 ἐ가 붙어요(모음 시작: ε→η, ο→ω, α→η 장음화 / 합성동사: 전치사 + ε + 동사).\n연결모음 없이 인칭어미를 바로 붙이고, 어미는 중간·수동 어미가 아니라 능동태 어미예요: ἐλύθην, ἐλύθης, ἐλύθη, ἐλύθημεν, ἐλύθητε, ἐλύθησαν.","§175–177",1],["ps","미래 수동태 = λυθησ- + 제1시제 중간·수동 어미","단순과거 수동태 어근 λυθη-에 미래 표지 σ를 덧붙여 λυθησ-. 미래는 제2시제가 아니라서 접두모음이 없어요.\n어미 -μαι, -σαι, -ται, -μεθα, -σθε, -νται + 연결모음 ο/ε. 2단은 -θήσεσαι 대신 -θήσῃ.\n미래 중간 λύσομαι ↔ 미래 수동 λυθήσομαι: θη가 있으면 수동이에요.","§178",1],["ps","기본형 여섯 개와 단순과거 수동태","① 현재 능동 ② 미래 능동 ③ 단순과거 능동 ④ 현재완료 능동 ⑤ 현재완료 수동 ⑥ 단순과거 수동. 미완료는 현재 어근으로 만들어서 기본형에 없어요.\n단순과거 수동태 어근은 원어근과 전혀 다르게 나오는 경우가 많아요. 사전으로 하나씩 확인해요.","§175–176, §180",0],["ps","자음 + θ","τ δ θ + θ → σθ: ἀνύτω → ἠνύσθην, βαπτίζω(βαπτιδ-) → ἐβαπτίσθην, πείθω → ἐπείσθην\nπ β + θ → φθ: πέμπω → ἐπέμφθην, τρίβω → ἐτρίφθην\nκ γ + θ → χθ: διώκω → ἐδιώχθην, ἄγω → ἤχθην\n불규칙이 많아서 사전 확인이 필요해요.","§179–180",0],["ps","단순과거 제2수동태 (θ 탈락)","어떤 동사는 단순과거 수동태에서 시제 접미어의 θ가 빠져요.\nγράφω → ἐγράφην (ἐγράφθην ×): ἐγράφην, ἐγράφης, ἐγράφη, ἐγράφημεν, ἐγράφητε, ἐγράφησαν\nσπείρω(뿌리다, 24과) → ἐσπάρην","§181",0],["ps","디포넌트의 단순과거와 미래","① 수동태 형만 가지는 것: ἀποκρίνομαι → 단순과거 ἀπεκρίθην, 미래 ἀποκριθήσομαι.\n② 중간태 형과 수동태 형을 겸하는 것: γίνομαι → ἐγενόμην / ἐγενήθην. 둘의 뜻은 같고 능동적이에요.\nπορεύομαι → ἐπορεύθην(갔다)도 수동태 형이지만 뜻은 능동이에요.","§182–183",0],["ps","단순과거 수동태 낱말 (16과)","ἐβλήθην ← βάλλω · ἐγενήθην ← γίνομαι(디포) · ἐγνώσθην ← γινώσκω · ἐδιδάχθην ← διδάσκω · ἐκηρύχθην ← κηρύσσω · ἐλήμφθην ← λαμβάνω\nἐπορεύθην ← πορεύομαι(디포) · ἠγέρθην ← ἐγείρω · ἠκούσθην ← ἀκούω · ἠνέχθην ← φέρω · ἤχθην ← ἄγω · ὤφθην ← βλέπω(ὁράω)","§174",0],["n3","제3변화는 속격이 기본","주격이 아닌 속격을 기본으로 격변화해요. 단수 속격에서 -ος를 떼면 어근: ἐλπίδος → ἐλπιδ-, νυκτός → νυκτ-, ἄρχοντος → ἀρχοντ-.\n단수 주격만으로는 어근을 가려낼 수 없어서 주격·속격·성을 함께 외워요.","§185–188",0],["n3","제3변화 격 어미","단수: 주 -ς 혹은 없음 · 속 -ος · 여 -ι · 대 -α · 호 주격과 같거나 없음\n복수: 주 -ες · 속 -ων · 여 -σι(ν) · 대 -ας · 호 -ες\n단수·복수 대격 어미의 α는 짧아요. 단수 주격·호격은 명사마다 달라서 일정한 규칙이 없어요.","§187–191",0],["n3","복수 여격 -σι와 자음","τ δ θ + σ → τ δ θ가 사라짐: ἐλπιδ + σι → ἐλπίσι(ν), ὀνοματ + σι → ὀνόμασι(ν)\nπ β φ + σ → ψ / κ γ χ + σ → ξ: νυκτ + σι → νυξί(ν), σαρκ + σι → σαρξί(ν)\nντ + σι: ντ가 떨어지고 앞 모음이 길어지는데, ο는 ω가 아니라 ου: ἀρχοντσι → ἄρχουσι(ν). (미래 σ의 자음 변화 §145와 같은 원리)","§192",0],["n3","제3변화 명사의 성","-μα, -ματος 형은 모두 중성이에요(ὄνομα, πνεῦμα, ῥῆμα, σῶμα, αἷμα, γράμμα, θέλημα).\n그 밖에는 규칙이 없어서 성을 따로 외워요: ἐλπίς · νύξ · σάρξ는 여성, ἄρχων · αἰών은 남성.","§193, §195",0],["n3","단음절 명사의 악센트","단음절 제3변화 명사(σάρξ, νύξ)는 단수·복수의 속격과 여격에서 얼티마에 악센트: σαρκός, σαρκί, σαρκῶν, σαρξί(ν).\n복수 속격은 써컴플렉스예요(일반 법칙의 예외).","§194",0],["n3","-μα 명사 (ὄνομα)","ὄνομα, ὀνόματος, τό: 중성이라 주·대·호격이 같아요.\n단수 ὄνομα, ὀνόματος, ὀνόματι, ὄνομα / 복수 ὀνόματα, ὀνομάτων, ὀνόμασι(ν), ὀνόματα","§195–196",0],["pt","분사 = 동사적 형용사","분사는 동사와 형용사의 역할을 동시에 해요.\n형용사라서: 성·수·격을 갖추고, 꾸미는 명사와 성·수·격이 반드시 일치해요.\n동사라서: 시제와 태를 갖고, 부사적 수식어를 가질 수 있고, 타동사면 직접목적어를 가질 수 있어요.","§198, 205",0],["pt","현재 능동태 분사 만들기","λύω의 어근 λυ-에 εἰμί의 현재분사 ὤν, οὖσα, ὄν을 어미로 붙이면 λύων, λύουσα, λῦον.\n〔교재〕 어떤 동사든 현재 어근 + -ων, -ουσα, -ον.\n남성·중성은 명사 제3변화(남성은 ἄρχων과 똑같이), 여성은 제1변화(〔교재〕 δόξα처럼)를 따라요.","§199–201",0],["pt","여성 복수 속격 λυουσῶν","분사는 형용사에 속하지만, 능동태 분사 여성 복수 속격의 악센트는 명사 제1변화 법칙을 따라 써컴플렉스예요: λυουσῶν (참고 §47, 59).\n남성·중성 복수 속격은 λυόντων.","§201",0],["pt","짧은 α","제3변화에서는 단수 대격·복수 대격 어미의 α가 짧아요(λύοντα, λύοντας). 제1변화 명사에서는 길어요(cf. §46).\n〔교재〕 분사의 여성 단수 주격·대격 어미의 α도 짧아요(λύουσα, λύουσαν).","§202",0],["pt","복수 여격 λύουσι(ν)","λυοντ + σι: ντ가 떨어지고 ο가 ου로 길어져 λύουσι(ν). ἄρχουσι(ν)와 같은 원리예요(§192).\n남성·중성이 같은 모양이고, 현재 능동태 직설법 3복 λύουσι(ν)와도 모양이 같아서 문맥으로 구별해요.","§192, 199",0],["pt","현재 중간태·수동태 분사","어떤 동사든 현재 어근 + -ομενος, -ομενη, -ομενον. 중간태와 수동태의 변화형이 같아요.\n남성·중성은 명사 제2변화, 여성은 명사 제1변화를 따라요.","§203",1],["pt","디포넌트 동사의 분사","디포넌트 동사의 분사도 중간태·수동태 분사 어미를 가지면서 뜻은 능동이에요.\nπορευόμενοι 가는 자들, δεχόμενος 영접하는 자, διωκόμενοι는 디포가 아니라서 ‘박해를 받는’.","§204",0],["pt","분사의 시제","문장 주동사의 시제에 따라 정해져요. 주동사와 같은 때의 동작이면 현재, 주동사보다 앞선 동작이면 과거 분사.\n주동사가 과거든 현재든 미래든 상관없어요. 과거의 같은 시간에 일어난 일도, 미래에 함께 일어날 일도 현재 분사.\nδιδασκομένῳ … προσῆλθον αὐτῷ: 종들이 왔을 때 가르치는 일이 진행 중이었다.","§206",1],["pt","현재 분사의 ‘현재’","헬라어 동사의 시제는 동작의 시간보다 동작의 종류(성격)를 더 많이 나타내요(§156–157).\n그래서 현재 분사의 현재는 시간상의 현재가 아니라 동작의 계속성·진행성·반복성을 주로 말해요.","§207",0],["pt","분사의 세 가지 용법","분사는 동사적 형용사라 보통 형용사와 같은 용법을 가져요: 한정적 · 서술적 · 독립적.\n외우기: 형전관사, 유한무서 — 형용사(분사) 앞에 관사가 있으면 한정, 없으면 서술.","§208",0],["pt","① 한정적 용법","명사를 꾸며요: …는, …(을)ㄹ, …(은)ㄴ, …던. 반드시 분사 앞에 관사가 있어야 해요.\nὁ λέγων ταῦτα ἐν τῷ ἱερῷ ἀπόστολος = ἀπόστολος ὁ λέγων ταῦτα ἐν τῷ ἱερῷ\n그 성전에서 이것을 말하는 사도","§208",0],["pt","② 서술적 용법","분사를 붙여 명사를 보충 설명해요(…하면서, …하고 있다). 서술적 용법의 분사 앞에는 관사가 오지 않아요(주의!).\nὁ ἀπόστολος λέγων ταῦτα ἐν τῷ ἱερῷ βλέπει τὸν κύριον. 그 사도는 성전 안에서 이것들을 말하면서 주님을 본다.\nὁ ἀπόστολος ὁ λέγων …이면 한정적: 이것들을 말하는 그 사도가 주님을 본다.","§208",0],["pt","③ 독립적 용법","분사가 관사만 가지고 단독으로 쓰여요(ὁ ἀγαθός 그 좋은 남자처럼).\nὁ λέγων ταῦτα 이것들을 말하는 남자 · ἡ λέγουσα ταῦτα 이것들을 말하는 여자 · οἱ λέγοντες ταῦτα 이것들을 말하는 남자들\nτὰ βλεπόμενα οὐ μένει εἰς τὸν αἰῶνα. 그 보이는 것들은 영원히 남아 있지 않는다.","§208",0],["pt","προσέρχομαι + 여격","προσέρχομαι(디포, 가다, 오다)는 여격을 취해요.\nπροσερχόμεθα τῷ ἀποστόλῳ λέγοντι ταῦτα. 우리는 이것들을 말하고 있는 그 사도에게로 간다.","§198, 205",0],["pt","단순과거 능동태 분사","λύσας, λύσασα, λῦσαν. 현재 능동태 분사처럼 남성·중성은 명사 제3변화, 여성은 제1변화.\n단순과거의 특징 σα가 모든 변화에 나타나요: 어근 λυσαντ-, λυσασ-, λυσαντ-.","§211–214",1],["pt","분사에는 접두모음이 없다","접두모음 ἐ는 직설법에서만 써요.\nἔλυσα → 분사 λύσας (ἐλύσας ×) · ἤκουσα → 분사 ἀκούσας (ἠκούσας ×) · εἶδον → ἰδών\n예외는 많지 않아요(〔교재〕 §220).","§211–214, 220",1],["pt","단순과거 중간태 분사","λυσάμενος, -η, -ον. 남성·중성은 제2변화, 여성은 제1변화.\n현재 중간·수동태 분사와 어미변화가 같고, 원어근과 어미 사이에 현재는 ο, 단순과거 중간태는 σα가 끼어 있어요.\n단순과거 수동태 분사는 모양이 매우 달라서 20과에서 따로 다뤄요.","§215–217",1],["pt","제2단순과거 능동태 분사 만들기","1) 제2단순과거 어근 찾기: εἶδον에서 접두모음과 어미 -ον을 떼면 ἰδ-\n2) εἰμί의 분사 ὤν, οὖσα, ὄν을 붙이기: ἰδών, ἰδοῦσα, ἰδόν\n현재 분사는 현재 어근에, 제2단과 분사는 제2단과 어근에 붙여요. 다른 점은 어근과 악센트뿐.","§218–222",0],["pt","악센트로 시제 가리기","제2단순과거 능동태 분사의 악센트는 동사 법칙이 아니라 명사 법칙을 따라요. 남성·중성 단수 주격에서 얼티마(ἰδών, ἰδόν), 단수 속격 이하도 모두 같은 음절.\n현재 능동태 분사는 동사 법칙(λύων). 그래서 악센트 위치를 보고 시제를 가려낼 수 있어요.","§218–222",0],["pt","합성동사의 분사","합성동사의 접두모음은 전치사와 동사 사이에 있어요.\nἀποθνῄσκω → 제2단과 직설법 ἀπέθανον → 접두모음과 어미를 없애 어근 ἀποθαν- → ἀποθανών, -οῦσα, -όν","§218–222",1],["pt","제2단순과거 중간태 분사","제2단순과거 능동태 어근 + -ομενος, -ομενη, -ομενον.\nλαμβάνω: 현재 중간태 분사 λαμβανόμενος (어근 λαμβαν-) · 제2단과 중간태 분사 λαβόμενος (어근 λαβ-). 어미는 같아요.\n예) γίνομαι → γενόμενος","§218–222",1],["pt","단순과거 분사의 시제","단순과거 분사는 주동사보다 앞선 동작을 나타내요. 주동사가 과거든 현재든 미래든 상관없어요.\nὁ ἀπόστολος εἰπὼν ταῦτα ἐν τῷ ἱερῷ βλέπει τὸν κύριον. 그 사도는 이것들을 말한 후에 주님을 본다. (cf. 현재 분사 λέγων 말하면서)\nπροσῆλθον αὐτῷ εἰπόντι ταῦτα. 그가 이것들을 말한 후에 그들이 그에게 왔다.","§223",1],["pt","단순과거 분사의 용법","한정적: 관사가 있고 명사를 꾸며요. 관사는 관계대명사 역할.\nὁ μαθητὴς ὁ ἀκούσας ταῦτα … ἦλθεν 이것들을 들었던 그 제자는 … 들어갔다\n관사가 없으면 서술적: ὁ μαθητὴς ἀκούσας ταῦτα … 그 제자가 이것들을 들은 후에\n독립적: ὁ ἀκούσας ταῦτα ἀπῆλθεν 이것들을 들었던 사람이 가버렸다","§224",0],["pt","분사의 동작의 종류","현재 분사는 계속·반복·진행하는 동작, 단순과거 분사는 단순한 발생을 의미하는 동작.\n시간보다 동작의 종류를 먼저 생각해요. 과거 분사도 같은 시간의 동작(마 22:1)이나 뒤의 동작(히 9:12)을 나타낼 때가 있어요.","§225",0],["pt","부정어 οὐ와 μή","직설법은 οὐ, 그 밖의 모든 법(명령법, 가정법, 희구법, 부정사, 분사)은 μή.\nὁ μὴ πιστεύων οὐ σώζεται. 믿지 않는 사람은 구원을 얻지 못한다.","§226",0],["pt","단순과거 수동태 분사","λυθείς, λυθεῖσα, λυθέν. 남성·중성은 제3변화, 여성은 제1변화.\n단순과거 수동태형(제6기본형)의 특징 θε가 모든 변화에 나타나요: 원어근 + θε.\n접두모음은 가질 수 없고, 악센트는 불규칙해요.\nγραφείς: θ가 빠지는 제2수동태 분사, 변화는 보통 것과 같아요.","§228–233",1],["pt","단순과거 수동태 분사의 시제와 용법","주동사보다 앞선 동작, 진행이 아니라 단순한 일회적 발생.\n서술적: ἐκβληθέντα τὰ δαιμόνια … ἀπῆλθεν 그 귀신들은 쫓겨난 후에 들어가 버렸다\n한정적: ὁ μαθητὴς ὁ διωχθείς 박해를 받은 그 제자\n독립적: οἱ διδαχθέντες 가르침을 받은 자들","§234",0],["pt","속격 독립 구문 (절대 속격)","주동사의 주어와 분사의 주어가 다를 때, 분사와 그 주어를 속격으로 써서 독립적인 절을 만들어요.\nεἰπόντων ταῦτα τῶν ἀποστόλων οἱ μαθηταὶ ἀπῆλθον. 그 사도들이 이것들을 말한 후에 제자들은 가버렸다.\nλέγοντος αὐτοῦ ταῦτα οἱ μαθηταὶ ἀπῆλθον. 그가 이것들을 말하는데 그 제자들이 가버렸다.","§235",0],["pt","미래 분사","신약성서에 몇 번밖에 나오지 않아 강의안에서는 설명하지 않아요(변화는 §533 참고).\n주동사보다 뒤에 오는 동작을 나타내요(요 6:64, 고전 15:37, 히 3:5).","§236",0]],"RQ":[["ac",1,"ἄγγελος의 바른 발음은?",["앙겔로스","악겔로스","아겔로스","악켈로스"],"γ가 γ, κ, ξ, χ 앞에 오면 ㅇ으로 읽어요.","§1"],["ac",1,"ἀνάγκη의 바른 발음은?",["아낭케","아낙케","아나그케","아나케"],"γκ도 앞의 γ를 ㅇ으로 읽어요.","§1"],["ac",1,"ου의 소리는?",["ㅜ (우)","오우","ㅗ (오)","ㅟ (위)"],"ου는 이중모음으로 ‘우’ 한 소리예요. λόγου 로구.","§4"],["ac",1,"ευ의 소리는? (강의안 표기)",["ㅠ (유)","에우","ㅜ (우)","에위"],"강의안 표에서 ευ는 ㅠ로 표기해요. ηυ는 ‘에우’로 차례대로 읽어요.","§4, §6"],["ac",1,"ᾳ, ῃ, ῳ 아래의 작은 ι는?",["이오타 하기 — 소리 내지 않아요","‘이’를 따로 읽어요","거친 숨표예요","장모음 표시예요"],"이오타 하기(下記)는 발음하지 않아요(아- 에- 오-).","§6"],["ac",1,"낱말 맨 끝에 쓰는 시그마는?",["ς","σ","ζ","Σ"],"낱말 끝에서만 ς, 그 밖에는 σ.","§1"],["ac",1,"ρ나 υ가 낱말 처음에 오면?",["거친 숨표가 붙어 ㅎ 소리가 섞여요 (ῥ, ὑ)","연한 숨표가 붙어요","악센트가 붙지 않아요","대문자로 써요"],"ῥῆμα ㅎ레마, ὑπό 휘포.","§1"],["ac",1,"이중모음의 숨표·악센트 자리는?",["둘째 모음 위","첫째 모음 위","두 모음 사이","앞 자음 위"],"οὐ, εἰ, αἰ처럼 둘째 모음 위에 붙여요.","§5–6"],["ac",1,"가름표(ϊ)의 뜻은?",["앞 모음과 이중모음이 아니라는 표시","장모음 표시","이오타 하기","강조 표시"],"προΐμος는 프로-이-모스, 세 음절이에요.","§7"],["ac",1,"헬라어에서 물음표 역할을 하는 부호는?",[";","·","?","."],"; 가 물음표, · 는 콜론·세미콜론이에요.","§8"],["ac",2,"애큐트가 붙을 수 있는 범위는?",["마지막 세 음절","마지막 두 음절","얼티마만","모든 음절"],"애큐트는 앤티피널트·피널트·얼티마. 그래서 ἄποστολος는 틀린 형태예요.","§12"],["ac",2,"써컴플렉스가 붙을 수 있는 곳은?",["마지막 두 음절의 장모음","마지막 세 음절 어디든","얼티마의 단모음","피널트의 단모음"],"써컴플렉스는 장모음에만, 피널트·얼티마에만. πιστεῦομεν은 틀린 형태예요.","§12"],["ac",2,"얼티마가 길 때 가능한 악센트 자리는?",["피널트(애큐트만) 또는 얼티마","앤티피널트 애큐트","피널트 써컴플렉스","어디든 가능"],"얼티마가 길면 앤티피널트에 악센트가 못 오고, 피널트에는 애큐트만: ἀποστόλῳ, δούλου.","§12"],["ac",2,"δοῦλος의 피널트가 써컴플렉스인 이유는?",["얼티마가 짧고 피널트가 길어서","얼티마가 길어서","보유법 예외라서","전접어 앞이라서"],"얼티마 짧고 피널트 길면 피널트 악센트는 써컴플렉스. 얼티마가 길어지면 δούλου.","§12"],["ac",2,"ἄνθρωποι의 앤티피널트에 악센트가 올 수 있는 이유는?",["맨 끝의 -οι는 짧게 보기 때문","οι는 이중모음이라 길기 때문","명사는 역행법이라서","예외 단어라서"],"낱말 맨 끝의 οι, αι는 악센트 문제에서 짧아요. 반면 ἀνθρώποις는 끝이 ς라서 길어요.","§11"],["ac",2,"ἀνθρώποις에서 악센트가 피널트로 온 이유는?",["끝이 -οις라서 얼티마가 길다","끝이 -οι라서 짧다","여격은 항상 피널트","보유법 때문"],"ς가 끝에 있어서 οι가 맨 끝이 아니므로 긴 음절이에요.","§11"],["ac",2,"동사 악센트의 원칙은?",["역행법 — 가능한 한 끝에서 멀리","보유법 — 원형 자리 유지","항상 피널트","항상 얼티마"],"얼티마 짧으면 앤티피널트, 길면 피널트에 애큐트(ἐγίνωσκε / ἐγινώσκου).","§14"],["ac",2,"명사 악센트의 원칙은?",["보유법 — 주격 단수 자리를 지키되 일반 법칙 안에서","역행법 — 끝에서 멀리","항상 얼티마","격마다 새로 정함"],"그래서 명사는 악센트까지 외워야 해요. οἶκος → οἴκου.","§15"],["ac",2,"얼티마의 애큐트가 뒤 낱말과 이어지면?",["그레이브로 바뀐다","써컴플렉스로 바뀐다","사라진다","피널트로 옮겨 간다"],"ἀγαθὸς λόγος, ὁ θεὸς λέγει처럼 그레이브가 돼요(전접어 앞과 문장 끝은 예외).","§12"],["ac",5,"제1변화 명사 복수 속격의 악센트는?",["항상 얼티마 써컴플렉스 -ῶν","주격 단수 자리 유지","항상 피널트 애큐트","악센트가 없다"],"보유법의 예외: ὥρα → ὡρῶν, ἀλήθεια → ἀληθειῶν.","§47"],["ac",4,"υἱός, γραφή처럼 주격 얼티마에 악센트가 있는 명사의 속격·여격은?",["써컴플렉스 (υἱοῦ, γραφῆς)","애큐트를 그대로 유지","그레이브","피널트로 이동"],"속격·여격(단·복)은 써컴플렉스, 나머지는 애큐트.","§37, §54"],["nm",6,"-ος로 끝나지만 여성(ἡ)인 명사 둘은?",["ἔρημος, ὁδός","λόγος, νόμος","θάνατος, οἶκος","κόσμος, λίθος"],"ἔρημος(빈들), ὁδός(길)는 관사 ἡ와 함께 외워요.","§56"],["nm",7,"προφήτης, μαθητής의 성은?",["남성 (제1변화)","여성 (제1변화)","남성 (제2변화)","중성"],"-ης로 끝나는 제1변화 남성 명사예요.","§73"],["nm",7,"제1변화 남성 명사가 여성과 다른 칸은?",["단수 주격·속격·호격","복수 전체","단수 여격·대격","속격만"],"주 -ης, 속 -ου, 호 -α만 다르고 나머지는 여성 제1변화와 같아요.","§74"],["nm",5,"ἀλήθεια의 단수 속격은?",["ἀληθείας","ἀληθείης","ἀληθείου","ἀληθειῶν"],"어근이 ε, ι, ρ로 끝나서 단수 내내 α예요.","§48"],["nm",5,"δόξα의 단수 속격은?",["δόξης","δόξας","δόξου","δοξῶν"],"ε, ι, ρ 뒤가 아닌 -α 명사는 단수 속격·여격이 η.","§50"],["nm",4,"중성 명사의 공통 규칙은?",["주격 = 대격 = 호격, 복수는 짧은 -α","주격 = 속격","단수와 복수가 같다","호격이 없다"],"δῶρον / δῶρα. 제3변화 중성도 같아요.","§39"],["nm",6,"관사 가운데 τ로 시작하지 않는 것은?",["ὁ, ἡ, οἱ, αἱ","τοῦ, τῆς","τόν, τήν","τά, τό"],"이 넷은 τ도 없고 악센트도 없는 후접어예요.","§62"],["nm",6,"관사에 없는 격은?",["호격","속격","여격","대격"],"관사는 호격이 없어요.","§60"],["nm",6,"관사의 중성 단수 주·대격은?",["τό","τόν","τοῦ","τά"],"형용사 ἀγαθόν과 달리 관사는 τό예요.","§62"],["nm",6,"‘그 좋은 말씀’(한정적)이 아닌 것은?",["ὁ λόγος ἀγαθός","ὁ ἀγαθὸς λόγος","ὁ λόγος ὁ ἀγαθός"],"ὁ λόγος ἀγαθός는 형용사 앞에 관사가 없으니 서술적: ‘그 말씀은 좋다’.","§65–69"],["nm",6,"ἀγαθὸς ὁ λόγος의 뜻은?",["그 말씀은 좋다","그 좋은 말씀","좋은 말씀들","그 말씀의 선함"],"유한무서: 형용사 앞에 관사가 없으면 서술적.","§65–69"],["nm",6,"관사 없는 ἀγαθὸς λόγος는?",["한정·서술 둘 다 가능 (문맥으로)","항상 서술적","항상 한정적","문법 오류"],"구별은 명사에 관사가 있을 때만 가능해요.","§69"],["nm",6,"οἱ ἀγαθοί의 뜻은? (독립적 용법)",["그 선한 남자들","선한 말씀들","그 좋은 것들","선한 여자들"],"남성 복수 → 남자들. 중성 τὰ ἀγαθά는 ‘그 좋은 것들’.","§70"],["nm",6,"관사 없는 λόγος의 번역으로 알맞은 것은?",["말씀 또는 한 말씀","그 말씀","말씀들","그 말씀의"],"부정관사가 없으므로 관사 없는 명사는 ‘한 ~’으로 볼 수 있어요.","§64"],["nm",6,"ὁ θεός처럼 관사가 붙으면 강조되는 것은?",["정체(identity) — 성부 하나님처럼 구별된 신분","질(質)이나 종류","복수의 뜻","소유의 뜻"],"관사는 사물의 정체를 가리키고, 관사 없는 θεός는 신령한 존재(질)를 말해요.","§64"],["nm",4,"헬라어 문장을 번역할 때 기준은?",["낱말의 어미(격)","낱말의 순서","관사의 위치","문장 길이"],"격이 역할을 보여 주므로 어순이 바뀌어도 뜻이 같아요. 강조어를 앞에 둬요.","§40"],["nm",4,"움직이는 ν가 주로 붙는 때는?",["모음 앞이나 문장 끝","자음 앞에서만","복수 1인칭","의문문"],"-ουσι(ν)이 대표예요. 자음 앞에서도 가끔 써요.","§41"],["nm",4,"λόγοις의 분석은?",["남복여","남복대","남단여","남복속"],"-οις(여격) ↔ -ους(대격). 기억 고리: 이스는 ‘에게’.","§35"],["nm",5,"γραφῇ의 분석은?",["여단여","여단대","여단주","여단속"],"-ῇ(여격, 이오타 하기) ↔ -ήν(대격).","§52"],["pr",8,"전치사 뒤에 쓰는 인칭대명사는?",["강조형 (δι’ ἐμοῦ)","비강조형 (διά μου)","속격만","아무거나"],"전치사 뒤에는 강조형. 단 πρός με는 흔히 써요.","§91"],["pr",8,"‘나의 말’을 바르게 쓴 것은?",["ὁ λόγος μου","ὁ λόγος ἐμοῦ","ὁ ἐμοῦ λόγος","μου ὁ λόγος"],"소유를 나타낼 때는 비강조형 속격을 써요.","§91"],["pr",8,"ἐγὼ λέγω처럼 주격 대명사를 쓰면?",["주어를 강조(대조)","반드시 써야 하는 문법","수동의 뜻","의문의 뜻"],"동사 어미에 이미 주어가 있으니 주격 대명사는 강조용이에요.","§91"],["pr",9,"αὐτὸς ὁ ἀπόστολος의 뜻은?",["그 사도 자신이","바로 그(같은) 사도","그의 사도","그 사도에게"],"관사 밖(서술적 위치)의 αὐτός는 ‘자신이’.","§99"],["pr",9,"ὁ αὐτὸς ἀπόστολος의 뜻은?",["바로 그(같은) 사도","그 사도 자신이","그의 사도","그 사도는 그다"],"관사 뒤(한정적 위치)의 αὐτός는 ‘바로 그, 같은’.","§99"],["pr",9,"αὐτὸς λέγω의 뜻은?",["나 자신이 말한다","그가 말한다","그 자신이 말한다","내가 그에게 말한다"],"αὐτός가 숨은 주어(1인칭)를 강조해요.","§99"],["pr",9,"αὕτη와 αὐτή의 차이는?",["αὕτη 이 여자(지시) / αὐτή 그 여자(인칭)","둘 다 같은 말","αὕτη 그녀의 / αὐτή 그녀를","αὕτη 복수 / αὐτή 단수"],"숨표와 악센트 자리로 구별해요. 지시대명사는 거친 숨표, 악센트가 앞.","§2, §99"],["pr",9,"οὗτος 변화에서 어근 ου/αυ를 정하는 법은?",["어미에 ο 소리면 ου, α·η 소리면 αυ","단수 ου, 복수 αυ","남성 ου, 여성 αυ","주격만 αυ"],"τούτου, ταύτης, ταῦτα(중복은 α 어미라서 αυ).","§97"],["pr",9,"οὗτος 변화 가운데 τ로 시작하지 않는 것은?",["οὗτος, αὕτη, οὗτοι, αὗται","τοῦτο, ταῦτα","τούτου, ταύτης","τοῦτον, ταύτην"],"관사 ὁ ἡ οἱ αἱ와 같은 자리예요.","§97"],["pr",9,"‘이 말씀’을 바르게 쓴 것은?",["οὗτος ὁ λόγος","ὁ οὗτος λόγος","οὗτος λόγ ἐξέρχεσθε ἐκ τοῦ οἴκου αὐτοῦ.","너희는 그 예언자의 음성을 듣지 않는다. 그러나 너희는 그의 집으로부터 나가고 있다.","강의안"],"10-5":[10,5,"ἐκεῖνοι οἱ ἀγαθοὶ διδάσκαλοι οὐκ εἰσέρχονται εἰς τοὺς οἴκους τῶν ἁμαρτωλῶν.","저 선한 선생들은 그 죄인들의 집들 안으로 들어가지 않는다.","강의안"],"10-7":[10,7,"λέγετε ἐκείνοις τοῖς ἁμαρτωλοῖς ὅτι σώζεσθε ὑπὸ τοῦ θεοῦ ἀπὸ τῶν ἁμαρτιῶν ὑμῶν.","너희가 하나님으로 말미암아 너희의 죄들로부터 구원받는다는 것을 너희는 저 죄인들에게 말하고 있다.","강의안"],"10-9":[10,9,"εἰρήνην ἔχει ἡ ἐκκλησία, ὅτι σώζεται ὑπὸ τοῦ κυρίου αὐτῆς.","그 교회는 평화를 가지고 있다. 왜냐하면 그것은 그것의 주님으로 말미암아 구원받고 있기 때문이다.","강의안"],"10-10":[10,10,"οὐκ ἀποκρινόμεθα τῷ ἀποστόλῳ ὅτι οὐ γινώσκομεν αὐτόν.","우리는 그 사도에게 대답하지 않는다. 왜냐하면 우리는 그를 알지 않기 때문이다.","강의안"],"10-11":[10,11,"οὐχ ὑπὸ τῶν μαθητῶν σώζῃ ἀπὸ τῶν ἁμαρτιῶν σου, ἀλλ’ ὑπ’ αὐτοῦ τοῦ θεοῦ.","너는 그 제자들로 말미암아가 아니라 하나님 자신으로 말미암아 너의 죄들로부터 구원받는다.","강의안"],"10-12":[10,12,"οὐ πορεύῃ ἐν τῇ ὁδῷ τῇ κακῇ, ἀλλὰ σώζῃ ἀπὸ τῶν ἁμαρτιῶν σου· καὶ οἱ ἀδελφοί σου ἀκούουσι τῆς φωνῆς τοῦ κυρίου.","너는 그 나쁜 길 안에 가지 않고, 너의 그 죄들로부터 구원받고 있다. 그리고 너의 그 형제들은 주님의 그 음성을 듣고 있다.","강의안"],"10-13":[10,13,"μετὰ τῶν ἀδελφῶν αὐτοῦ ἄγεται εἰς τὴν βασιλείαν τοῦ θεοῦ τῇ φωνῇ τῶν ἀποστόλων.","그는 그의 형제들과 함께 그 사도들의 음성으로 하나님의 그 나라 안으로 인도받는다.","강의안"],"10-14":[10,14,"οὐ γίνῃ μαθητὴς τοῦ κυρίου, ὅτι οὐκ εἰσέρχῃ εἰς τὴν ἐκκλησίαν αὐτοῦ.","너는 그 주님의 제자가 되지 않는다. 왜냐하면 그의 그 교회 안으로 들어가지 않기 때문이다.","강의안"],"11-1":[11,1,"ἠκούομεν τῆς φωνῆς αὐτοῦ ἐν ἐκείναις ταῖς ἡμέραις, νῦν δὲ οὐκέτι ἀκούομεν αὐτῆς.","우리는 저 날들 안에 그의 음성을 듣고 있었다. 그러나 지금 우리는 더 이상 그것을 듣지 않는다.","강의안"],"11-3":[11,3,"ἀπέκτεινον οἱ δοῦλοι τὰ τέκνα σὺν τοῖς μαθηταῖς.","그 종들이 그 제자들과 함께 그 아이들을 죽이고 있었다.","강의안"],"11-5":[11,5,"παρελαμβάνετε τὸν ἄρτον παρὰ τῶν δούλων καὶ ἠσθίετε αὐτόν.","너희는 그 빵을 그 종들로부터 받고 있었다. 그리고 너희는 그것을 먹고 있었다.","강의안"],"11-7":[11,7,"συνῆγεν οὗτος ὁ ἀπόστολος εἰς τὴν ἐκκλησίαν τοὺς μαθητὰς τοῦ κυρίου ἡμῶν.","이 사도는 그 교회 안으로 우리 주님의 그 제자들을 모으고 있었다.","강의안"],"11-9":[11,9,"ὁ κύριος ἡμῶν ᾖρε τὰς ἁμαρτίας ἡμῶν.","우리의 그 주님이 우리의 그 죄들을 치우고 계셨다.","강의안"],"11-11":[11,11,"πονηροὶ ἦτε, ἀγαθοὶ δέ ἐστε.","너희는 악한 자들이었다. 그러나 너희는 선한 자들이다.","강의안"],"11-13":[11,13,"τότε ἤμην ἐν τῷ ἱερῷ καὶ ἐδίδασκέ με ὁ κύριος.","그때에 나는 그 성전 안에 있었다. 그리고 주님께서 나를 가르치고 계셨다.","강의안"],"11-15":[11,15,"ἐξέβαλλες αὐτοὺς ἐκ τοῦ ἱεροῦ.","네가 그들을 그 성전 밖으로 몰아내고 있었다.","강의안"],"11-17":[11,17,"ὁ κύριος ἀπέστελλεν ἀγγέλους πρὸς ἡμᾶς.","그 주님은 우리를 향하여 천사들을 보내고 계셨다.","강의안"],"11-19":[11,19,"δοῦλος ἦς τοῦ πονηροῦ, ἀλλὰ νῦν οὐκέτι εἶ δοῦλος.","너는 그 악한 자의 종이었다. 그러나 지금 너는 더 이상 종이 아니다.","강의안"],"12-1":[12,1,"ἐγράφοντο οὗτοι οἱ λόγοι ἐν βιβλίῳ.","이 말씀들이 책 안에 기록되고 있었다.","강의안"],"12-2":[12,2,"ἐδιδασκόμην ὑπ’ αὐτοῦ ἐκ τῶν βιβλίων τῶν προφητῶν.","나는 그 예언자들의 책들에서 그로 말미암아 가르침을 받고 있었다.","강의안"],"12-3":[12,3,"ἐν ἐκείναις ταῖς ἡμέραις καὶ ἐδιδασκόμεθα ὑπ’ αὐτοῦ καὶ ἐδιδάσκομεν τοὺς ἄλλους, ἀλλὰ νῦν οὐδὲ διδασκόμεθα οὐδὲ διδάσκομεν.","저 날들 안에 우리가 그로 말미암아 가르침을 받고 있었고 다른 사람들을 가르치고 있었다. 그러나 지금 우리는 가르침을 받지도 않고 가르치지도 않는다.","강의안"],"12-5":[12,5,"ἐξεπορεύετο πρὸς αὐτὸν ἡ ἐκκλησία, ἀλλὰ νῦν οὐκέτι ἐκπορεύεται.","그 교회는 그를 향하여 나가고 있었다. 그러나 지금은 더 이상 나가지 않는다.","강의안"],"12-7":[12,7,"ἐλέγετο ἐν τῷ ἱερῷ καλὸς λόγος περὶ τούτου τοῦ ἀποστόλου.","이 사도에 대하여 좋은 말씀이 그 성전 안에서 말해지고 있었다.","강의안"],"12-9":[12,9,"ἐφέρετο τὰ δῶρα καὶ πρὸς τοὺς πονηρούς.","그 선물들이 그 악한 자들에게까지도 옮겨지고 있었다.","강의안"],"12-10":[12,10,"ἐδέχου τὰ βιβλία ἀπὸ τῶν προφητῶν.","너는 그 예언자들로부터 그 책들을 받고 있었다.","강의안"],"12-11":[12,11,"συνήρχοντο οἱ μαθηταὶ πρὸς τοῦτον.","그 제자들이 이 사람에게 함께 가고 있었다.","강의안"],"12-14":[12,14,"ὑπὲρ τῆς ἐκκλησίας αὐτοῦ ἀπέθνῃσκεν ὁ κύριος.","그 주님이 그의 교회를 위하여 죽고 있었다.","강의안"],"12-16":[12,16,"ἐν τῷ πλοίῳ ἤγου πρὸς τὸν κύριον διὰ τῆς θαλάσσης.","그 배로 너는 그 호수를 통과하여 그 주님에게로 인도되고 있었다.","강의안"],"13-1":[13,1,"ἄξει ὁ κύριος τοὺς μαθητὰς αὐτοῦ εἰς τὴν βασιλείαν.","그 주께서 그의 그 제자들을 그 나라 안으로 인도할 것이다.","강의안"],"13-2":[13,2,"γνωσόμεθα καὶ τοὺς ἀγαθοὺς καὶ τοὺς πονηρούς.","우리는 선한 자들과 악한 자들을 모두 알 것이다.","교재"],"13-3":[13,3,"λήμψεσθε τὰ πλοῖα ἐκ τῆς θαλάσσης.","너희가 그 배들을 그 호수에서 밖으로 취할 것이다.","강의안"],"13-4":[13,4,"λύσεις τοὺς δούλους.","너는 그 종들을 풀어 줄 것이다.","교재"],"13-5":[13,5,"ἕξουσιν οἱ πονηροὶ οὐδὲ χαρὰν οὐδὲ εἰρήνην.","그 악한 자들은 기쁨도 평안도 갖지 않을 것이다.","강의안"],"13-6":[13,6,"ἐν ἐκείνῃ τῇ ὥρᾳ ἐλεύσεται ὁ υἱὸς τοῦ ἀνθρώπου σὺν τοῖς ἀγγέλοις αὐτοῦ.","저 시간에 인자가 그의 천사들과 함께 올 것이다.","교재"],"13-7":[13,7,"ἁμαρτωλοί ἐστε, γενήσεσθε δὲ μαθηταὶ τοῦ κυρίου.","너희는 죄인들이다. 그러나 너희는 주님의 제자들이 될 것이다.","교재"],"13-9":[13,9,"προσεύξῃ τῷ θεῷ σου καὶ δοξάσεις αὐτόν.","너는 너의 하나님께 기도할 것이고 그에게 영광을 돌릴 것이다.","교재"],"13-14":[13,14,"διὰ τοῦ λόγου τοῦ κυρίου ἀναβλέψουσιν οἱ τυφλοὶ οὗτοι.","주님의 말씀을 통하여 이 맹인들이 다시 볼 것이다.","교재"],"13-17":[13,17,"ἀπελεύσῃ καὶ σὺ εἰς τὰς ὁδοὺς τῶν πονηρῶν καὶ διδάξεις οὕτως τοὺς ἀνθρώπους.","너도 악한 자들의 길들로 가 버릴 것이고 사람들을 그렇게 가르칠 것이다.","교재"],"14-1":[14,1,"ἀπέλυσεν ὁ κύριος τὸν δοῦλον αὐτοῦ, ὁ δὲ δοῦλος οὐκ ἀπέλυσε τὸν ἄλλον.","주께서 그의 종을 풀어 주었다. 그러나 그 종은 다른 사람을 풀어 주지 않았다.","강의안"],"14-2":[14,2,"ἤδη ἐπέστρεψαν οὗτοι πρὸς τὸν κύριον, ἐκεῖνοι δὲ ἐπιστρέψουσιν ἐν ταῖς ἡμέραις ταῖς κακαῖς.","이 사람들은 이미 주님에게로 돌아섰다. 그러나 저 사람들은 그 나쁜 날들 안에서 돌아설 것이다.","강의안"],"14-3":[14,3,"ἐπιστεύσαμεν εἰς τὸν κύριον καὶ σώσει ἡμᾶς.","우리는 주님을 믿었다. 그리고 그는 우리를 구원할 것이다.","강의안"],"14-4":[14,4,"καὶ ἐπίστευσας εἰς αὐτὸν καὶ πιστεύσεις.","그리고 너는 그를 믿었고 믿을 것이다.","강의안"],"14-5":[14,5,"ὑπέστρεψας πρὸς τὸν κύριον καὶ ἐδέξατό σε εἰς τὴν ἐκκλησίαν αὐτοῦ.","네가 주님께로 돌아섰다. 그리고 그가 그의 교회 안으로 너를 영접하였다.","강의안"],"14-7":[14,7,"ἐπεστρέψατε πρὸς τὸν κύριον καὶ ἐθεράπευσεν ὑμᾶς.","너희는 주님께로 돌아섰다. 그리고 그는 너희를 고치셨다.","강의안"],"14-9":[14,9,"ἡτοίμασα ὑμῖν τόπον ἐν τῷ οὐρανῷ.","나는 너희에게 그 하늘 안에 한 장소를 준비했다.","강의안"],"14-11":[14,11,"ἀνέβλεψαν οἱ τυφλοί.","그 맹인들이 다시 보게 되었다.","교재"],"14-12":[14,12,"ἔσωσα ὑμᾶς ἐγώ, ὑμεῖς δὲ ἐμὲ οὐκ ἐδέξασθε εἰς τοὺς οἴκους ὑμῶν.","내가 너희를 구원했다. 그러나 너희는 나를 너희의 집들 안으로 영접하지 않았다.","교재"],"14-17":[14,17,"ἤκουσαν αὐτοῦ καὶ ἐθαύμασαν.","그들이 그의 말을 듣고 놀랐다.","교재"],"15-1":[15,1,"καὶ εἴδομεν τὸν κύριον καὶ ἠκούσαμεν τοὺς λόγους αὐτοῦ.","우리가 그 주님을 보았고 그의 그 말씀들에 순종했다.","강의안"],"15-2":[15,2,"οὐδὲ γὰρ εἰσῆλθες εἰς τοὺς οἴκους αὐτῶν οὐδὲ εἶπες αὐτοῖς παραβολήν.","왜냐하면 너는 그들의 집들 안으로 들어가지 않았고 그들에게 비유를 말하지 않았기 때문이다.","강의안"],"15-3":[15,3,"ἐν ἐκείνῃ τῇ ὥρᾳ ἐγένοντο μαθηταὶ τοῦ κυρίου.","저 시간 안에 그들은 주님의 제자들이 되었다.","강의안"],"15-4":[15,4,"οὗτοι μὲν ἐγένοντο μαθηταὶ ἀγαθοί, ἐκεῖνοι δὲ ἔτι ἦσαν πονηροί.","이들은 선한 제자들이 되었다. 그러나 저들은 아직 악한 자들이었다.","강의안"],"15-5":[15,5,"προσέφερον αὐτῷ τοὺς τυφλούς.","내가 그 맹인들을 그에게 데려가고 있었다.","강의안"],"15-6":[15,6,"ἔπεσον ἐκ τοῦ οὐρανοῦ οἱ ἄγγελοι οἱ πονηροί.","그 악한 천사들이 그 하늘로부터 떨어졌다.","강의안"],"15-7":[15,7,"τὰ μὲν δαιμόνια ἐξεβάλετε, τὰ δὲ τέκνα ἐθεραπεύσατε.","너희가 그 귀신들을 쫓아내었고, 그 아이들을 고쳤다.","강의안"],"15-8":[15,8,"τοὺς μὲν πονηροὺς συνηγάγετε ὑμεῖς εἰς τοὺς οἴκους ὑμῶν, τοὺς δὲ ἀγαθοὺς ἡμεῖς.","너희는 그 악한 자들을 너희의 그 집들 안으로 모았고, 우리는 그 선한 자들을 모았다.","강의안"],"15-9":[15,9,"οὐκ ἐκήρυξας τὸ εὐαγγέλιον ἐν τῇ ἐκκλησίᾳ, οὐδὲ γὰρ ἐγένου μαθητής.","너는 그 교회 안에서 그 복음을 선포하지 않았다. 왜냐하면 네가 제자가 되지 않았기 때문이다.","강의안"],"15-10":[15,10,"νῦν μὲν λέγετε λόγους ἀγαθούς, εἶπον δὲ οὗτοι τοὺς αὐτοὺς λόγους καὶ ἐν ταῖς ἡμέραις ἐκείναις.","지금 너희는 선한 말씀들을 말한다. 그러나 이 사람들은 저 날들 안에서까지도 바로 그 말씀들을 말했다.","강의안"],"15-11":[15,11,"ἐπιστεύσαμεν εἰς τὸν κύριον, οἱ γὰρ μαθηταὶ ἤγαγον ἡμᾶς πρὸς αὐτόν.","우리는 주님을 믿었다. 왜냐하면 그 제자들이 우리를 그에게로 인도했기 때문이다.","교재"],"15-14":[15,14,"τότε ὀψόμεθα τὸν κύριον ἐν τῇ δόξῃ αὐτοῦ· ἐπιστεύσαμεν γὰρ εἰς αὐτόν.","그때에 우리는 그의 영광 안에서 주님을 볼 것이다. 왜냐하면 우리가 그를 믿었기 때문이다.","교재"],"15-16":[15,16,"ταύτας τὰς ἐντολὰς ἔλαβον ἀπὸ τοῦ κυρίου, ἤμην γὰρ μαθητὴς αὐτοῦ.","이 계명들을 나는 주님으로부터 받았다. 왜냐하면 나는 그의 제자였기 때문이다.","교재"],"15-18":[15,18,"ἤλθετε πρὸς τὸν κύριον καὶ παρελάβετε παρ’ αὐτοῦ ταῦτα.","너희가 주님께로 왔고 그로부터 이것들을 받았다.","교재"],"15-20":[15,20,"εἶδον οἱ ἄνθρωποι τὸν υἱὸν τοῦ θεοῦ· ἐγένετο γὰρ αὐτὸς ἄνθρωπος καὶ ἔμενεν ἐν τούτῳ τῷ κόσμῳ.","사람들이 하나님의 아들을 보았다. 왜냐하면 그가 친히 사람이 되었고 이 세상 안에 머물고 있었기 때문이다.","교재"],"16-1":[16,1,"ἐπιστεύσαμεν εἰς τὸν κύριον καὶ ἐγνώσθημεν ὑπ’ αὐτοῦ.","우리는 주님을 믿었다. 그리고 우리는 그로 말미암아 알려졌다.","강의안"],"16-2":[16,2,"ταῦτα ἐγράφη ἐν τοῖς βιβλίοις.","이것들이 그 책들 안에 기록되었다.","교재"],"16-3":[16,3,"ἐδιδάξατε τὰ τέκνα, ἐδιδάχθητε δὲ καὶ αὐτοὶ ὑπὸ τοῦ κυρίου.","너희는 그 아이들을 가르쳤다. 그러나 너희 자신도 주님으로 말미암아 가르침을 받았다.","강의안"],"16-4":[16,4,"ἐλήμφθησαν οἱ πιστοὶ εἰς τὸν οὐρανόν, ἐξεβλήθησαν δὲ ἐξ αὐτοῦ οἱ ἄγγελοι οἱ πονηροί.","신실한 자들은 하늘로 들려 갔고, 악한 천사들은 그곳으로부터 쫓겨났다.","교재"],"16-5":[16,5,"ἐγερθήσονται οἱ νεκροὶ τῷ λόγῳ τοῦ κυρίου.","그 죽은 자들이 주님의 그 말씀으로 일으킴을 받을 것이다.","강의안"],"16-6":[16,6,"οὗτοι οἱ τυφλοὶ συνήχθησαν εἰς τὴν ἐκκλησίαν.","이 맹인들이 그 교회 안으로 모였다.","교재"],"16-7":[16,7,"ἐξεβλήθη τὰ δαιμόνια· ὁ γὰρ κύριος ἐξέβαλεν αὐτά.","그 귀신들이 쫓겨났다. 왜냐하면 주님께서 그것들을 쫓아내셨기 때문이다.","강의안"],"16-8":[16,8,"πέμπονται μὲν καὶ νῦν οἱ μαθηταί, ἐπέμφθησαν δὲ τότε οἱ ἀπόστολοι καὶ πεμφθήσονται ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ οἱ ἄγγελοι.","제자들은 지금도 보내심을 받는다. 그때에는 사도들이 보내심을 받았고, 저 날에는 천사들도 보내심을 받을 것이다.","교재"],"16-9":[16,9,"εἰσῆλθες εἰς τὴν ἐκκλησίαν καὶ ἐβαπτίσθης.","너는 그 교회 안으로 들어갔고 세례를 받았다.","강의안"],"16-10":[16,10,"ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.","그는 세상에서 믿어지셨고, 영광 가운데 들려 올라가셨다.","교재"],"16-11":[16,11,"οἱ ἁμαρτωλοὶ ἐσώθησαν ἐν ἐκείνῃ τῇ ὥρᾳ καὶ ἐγενήθησαν μαθηταὶ τοῦ κυρίου.","그 죄인들은 저 시간에 구원을 받았고 주님의 제자들이 되었다.","교재"],"16-12":[16,12,"ἐπορεύθημεν εἰς ἕτερον τόπον· οὐ γὰρ δέξονται ἡμᾶς οὗτοι.","우리는 다른 곳으로 갔다. 왜냐하면 이 사람들은 우리를 영접하지 않을 것이기 때문이다.","교재"],"16-13":[16,13,"ἐδοξάσθη ὁ θεὸς ὑπὸ τοῦ υἱοῦ, ἐδόξασε δὲ αὐτόν.","하나님은 그 아들로 말미암아 영광을 받으셨고, 또 그(아들)를 영화롭게 하셨다.","교재"],"16-14":[16,14,"τὸ εὐαγγέλιον ἐκηρύχθη ἐν ταῖς ἡμέραις ἐκείναις, κηρυχθήσεται δὲ καὶ νῦν.","그 복음은 저 날들에 선포되었고, 지금도 선포될 것이다.","교재"],"16-15":[16,15,"ἑτοιμασθήσεται ἡμῖν τόπος ἐν οὐρανῷ κατὰ τὴν ἐπαγγελίαν τοῦ κυρίου.","주님의 약속을 따라 하늘에 우리를 위하여 처소가 예비될 것이다.","교재"],"16-16":[16,16,"τὰ τέκνα προσηνέχθησαν τῷ κυρίῳ.","그 아이들이 주님께 데려가졌다.","교재"],"16-18":[16,18,"ἐν τῷ μικρῷ οἴκῳ ἀκουσθήσεται ἡ φωνὴ τοῦ ἀποστόλου.","그 작은 집 안에서 그 사도의 음성이 들릴 것이다.","교재"],"16-19":[16,19,"πρῶτός εἰμι τῶν ἁμαρτωλῶν, ἐσώθην δὲ καὶ ἐγώ.","나는 죄인들 중에 첫째이다. 그러나 나도 구원을 받았다.","교재"],"16-20":[16,20,"ὀψόμεθα μὲν τοὺς ἀγγέλους, ὀφθησόμεθα δὲ καὶ ὑπ’ αὐτῶν.","우리는 천사들을 볼 것이고, 또한 그들에게 보일 것이다.","교재"],"17-1":[17,1,"ἐλπίδα οὐκ ἔχουσιν οὐδὲ τὸ πνεῦμα τὸ ἅγιον.","그들은 희망을 가지고 있지 않고, 성령도 가지고 있지 않다.","강의안"],"17-2":[17,2,"διὰ τὴν ἐλπίδα τὴν καλὴν ἤνεγκαν ταῦτα οἱ μαθηταὶ τοῦ κυρίου.","그 좋은 희망 때문에 주님의 제자들은 이것들을 가져갔다(옮겼다).","강의안"],"17-3":[17,3,"ταῦτά ἐστιν τὰ ῥήματα τοῦ ἁγίου πνεύματος.","이것들은 그 거룩한 성령의 말씀들이다.","강의안"],"17-4":[17,4,"ἐγράφη τὰ ὀνόματα ὑμῶν ὑπὸ τοῦ θεοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς.","너희의 이름들이 하나님으로 말미암아 그 생명의 책 안에 기록되었다.","강의안"],"17-5":[17,5,"τῷ λόγῳ τοῦ κυρίου ἔσωσεν ἡμᾶς ὁ θεός.","하나님이 주님의 그 말씀으로 우리를 구원하셨다.","강의안"],"17-6":[17,6,"οἱ ἄρχοντες οἱ πονηροὶ οὐκ ἐπίστευσαν εἰς τὸ ὄνομα τοῦ κυρίου.","그 악한 통치자들은 주님의 그 이름을 믿지 않았다.","강의안"],"17-7":[17,7,"ταῦτα εἶπον ἐκεῖνοι τοῖς ἄρχουσιν τούτου τοῦ αἰῶνος.","저들이 이 시대의 통치자들에게 이것들을 말했다.","강의안"],"17-8":[17,8,"ὄψεσθε ὑμεῖς τὸ πρόσωπον τοῦ κυρίου εἰς τὸν αἰῶνα, ἀλλ’ οὐκ ὄψονται αὐτὸ οἱ πονηροί, ὅτι οὐκ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ.","너희는 주님의 얼굴을 영원히 볼 것이다. 그러나 그 악한 자들은 그것을 보지 못할 것이다. 그들이 그의 이름을 믿지 않았기 때문이다.","강의안"],"17-9":[17,9,"οὐκέτι κατὰ σάρκα γινώσκομεν τὸν κύριον.","우리는 더 이상 육체를 따라 주님을 알지 않는다.","강의안"],"17-10":[17,10,"ἐν τῇ σαρκὶ ὑμῶν εἴδετε τὸν θάνατον, ἀλλὰ διὰ τοῦ ἁγίου πνεύματος ἔχετε ἐλπίδα καλήν.","너희는 너희의 육체 안에서 그 죽음을 보았다. 그러나 거룩한 성령을 통하여 너희는 좋은 희망을 가지고 있다.","강의안"],"17-11":[17,11,"τὸ μὲν γράμμα ἀποκτείνει, ἐν τῷ δὲ πνεύματι ἔχετε ζωήν.","그 글(문자)은 죽인다. 그러나 그 영 안에서 너희는 생명을 가지고 있다.","교재"],"17-13":[17,13,"ἐδίδαξαν οἱ μαθηταὶ καὶ τοὺς ἄρχοντας καὶ τοὺς δούλους.","그 제자들은 통치자들과 종들을 모두 가르쳤다.","교재"],"17-15":[17,15,"μετὰ τῶν ἀρχόντων ἤμην ἐν ἐκείνῳ τῷ οἴκῳ.","나는 저 집 안에서 통치자들과 함께 있었다.","교재"],"17-16":[17,16,"μετὰ δὲ ἐκείνην τὴν νύκτα ἦλθεν οὗτος ἐν τῷ πνεύματι εἰς τὴν ἔρημον.","그리고 저 밤 후에 이 사람은 성령 안에서 광야로 갔다.","교재"],"17-18":[17,18,"ἤγαγεν αὐτὸν τὸ ἅγιον πνεῦμα εἰς τὸ ἱερόν.","그 성령이 그를 성전 안으로 인도하였다.","교재"],"17-19":[17,19,"ταῦτα τὰ ῥήματα ἐκηρύχθη ἐν ἐκείνῃ τῇ νυκτὶ τοῖς δούλοις τοῦ ἄρχοντος.","이 말씀들이 저 밤에 그 통치자의 종들에게 선포되었다.","교재"],"17-20":[17,20,"ἠγέρθησαν τὰ σώματα τῶν ἁγίων.","성도들의 몸들이 일으킴을 받았다.","교재"],"18-1":[18,1,"διωκόμενοι ὑπὸ τοῦ ἄρχοντος προσευχόμεθα τῷ θεῷ.","그 통치자로 말미암아 박해를 받는 우리는 하나님께 기도한다.","강의안"],"18-2":[18,2,"ὁ σὲ δεχόμενος δέχεται καὶ τὸν κύριον.","너를 영접하는 자는 주님도 영접한다.","교재"],"18-3":[18,3,"ταῦτα λέγομεν τοῖς πορευομένοις εἰς τὸν οἶκον περὶ τοῦ ἐγείροντος τοὺς νεκρούς.","우리는 그 죽은 자들을 일으키는 남자에 관하여 그 집 안으로 들어가는 남자들에게 이것들을 말한다.","강의안"],"18-4":[18,4,"ἐξερχομένοις ἐκ τῆς ἐκκλησίας λέγει ἡμῖν ταῦτα.","그는 교회에서 나가는 우리에게 이것들을 말한다.","교재"],"18-5":[18,5,"αἱ ἐκκλησίαι αἱ διωκόμεναι ὑπὸ τῶν ἀρχόντων πιστεύουσιν εἰς τὸν κύριον.","그 통치자들로 말미암아 박해를 받는 그 교회들은 주님을 믿는다.","강의안"],"18-6":[18,6,"οἱ πιστεύοντες εἰς τὸν κύριον σώζονται.","주님을 믿는 자들은 구원을 받는다.","교재"],"18-7":[18,7,"γινώσκει ὁ θεὸς τὰ γραφόμενα ἐν τῷ βιβλίῳ τῆς ζωῆς.","하나님은 생명의 책에 기록되는 것들을 아신다.","교재"],"18-8":[18,8,"ἐξήλθομεν πρὸς αὐτοὺς ἄγοντες τὰ τέκνα.","우리는 그 아이들을 데리고 그들에게로 나갔다.","교재"],"18-9":[18,9,"εἴδομεν τοὺς λαμβάνοντας τὰ δῶρα ἀπὸ τῶν τέκνων.","우리는 그 아이들에게서 선물들을 받는 자들을 보았다.","교재"],"18-10":[18,10,"οὗτός ἐστιν ὁ ἄρχων ὁ δεχόμενός με εἰς τὸν οἶκον αὐτοῦ.","이 사람이 나를 그의 집으로 영접하는 그 통치자이다.","교재"],"18-11":[18,11,"ἅγιοί εἰσιν οἱ πιστεύοντες εἰς τὸν κύριον καὶ σωζόμενοι ὑπ’ αὐτοῦ.","주님을 믿고 그분으로 말미암아 구원을 받는 자들은 거룩하다.","교재"],"18-12":[18,12,"τοῦτό ἐστι τὸ πνεῦμα τὸ σῶζον ἡμᾶς.","이것이 우리를 구원하는 그 영이다.","교재"],"18-13":[18,13,"ἦσαν ἐν τῷ οἴκῳ τῷ λυομένῳ ὑπὸ τοῦ ἄρχοντος.","그들은 그 통치자로 말미암아 허물어지고 있는 그 집 안에 있었다.","교재"],"18-14":[18,14,"ἦσαν ἐν τῷ οἴκῳ λυομένῳ ὑπὸ τοῦ ἄρχοντος.","그 집이 그 통치자로 말미암아 허물어지고 있을 때 그들은 그 집 안에 있었다.","교재"],"18-15":[18,15,"αὕτη ἐστὶν ἡ ἐκκλησία ἡ πιστεύουσα εἰς τὸν κύριον.","이것이 주님을 믿는 그 교회이다.","교재"],"18-16":[18,16,"διδασκόμενοι ὑπὸ τοῦ κυρίου ἐπορεύεσθε ἐν τῇ ὁδῷ τῇ ἀναβαινούσῃ εἰς τὴν ἔρημον.","너희는 주님께 가르침을 받으면서 광야로 올라가는 그 길로 가고 있었다.","교재"],"18-17":[18,17,"ἐκηρύχθη ὑπ’ αὐτῶν τὸ εὐαγγέλιον τὸ σῶζον τοὺς ἁμαρτωλούς.","죄인들을 구원하는 그 복음이 그들로 말미암아 선포되었다.","교재"],"18-18":[18,18,"τοῦτό ἐστιν τὸ εὐαγγέλιον τὸ κηρυσσόμενον ἐν τῷ κόσμῳ καὶ σῶζον τοὺς ἀνθρώπους.","이것이 세상에서 선포되고 사람들을 구원하는 그 복음이다.","교재"],"18-19":[18,19,"ἦλθον πρὸς αὐτὸν βαπτίζοντα τοὺς μαθητάς.","그들은 그 제자들에게 세례를 주고 있는 그에게로 왔다.","교재"],"18-20":[18,20,"ἔτι ὄντα ἐν τῷ ἱερῷ εἴδομεν αὐτόν.","그가 아직 성전 안에 있을 때 우리는 그를 보았다.","교재"],"19-1":[19,1,"λαβόντες ταῦτα παρὰ τῶν πιστευόντων εἰς τὸν κύριον ἐξήλθομεν εἰς τὴν ἔρημον.","우리가 주를 믿는 자들로부터 이것들을 취한 후에 그 광야 안으로 나갔다.","강의안"],"19-2":[19,2,"πισταί εἰσιν αἱ δεξάμεναι τοὺς διωκομένους ὑπὸ τοῦ ἄρχοντος.","그 통치자로 말미암아 박해를 받는 자들을 영접한 여자들은 신실하다.","교재"],"19-3":[19,3,"εἴδομεν αὐτοὺς καὶ μένοντας ἐν τῷ οἴκῳ καὶ ἐξελθόντας ἐξ αὐτοῦ.","우리는 그들이 그 집 안에 머물고 있을 때뿐만 아니라 그것(그 집)에서 밖으로 나간 후까지도 그들을 보았다.","강의안"],"19-4":[19,4,"οἱ ἰδόντες τὸν κύριον ἦλθον πρὸς τοὺς ἀγαγόντας τὸν μαθητὴν ἐκ τοῦ ἱεροῦ.","주님을 본 자들은 그 제자를 성전에서 데리고 나온 자들에게로 갔다.","교재"],"19-5":[19,5,"ταῦτα εἴπομεν περὶ τοῦ σώσαντος ἡμᾶς.","우리는 우리를 구원한 자에 관하여 이것들을 말했다.","강의안"],"19-6":[19,6,"οὗτοί εἰσιν οἱ κηρύξαντες τὸ εὐαγγέλιον, ἀλλ’ ἐκεῖνοί εἰσιν οἱ διώξαντες τοὺς πιστεύοντας.","이 사람들은 복음을 선포한 자들이지만, 저 사람들은 믿는 자들을 박해한 자들이다.","교재"],"19-7":[19,7,"προσενεγκόντες τῷ κυρίῳ τὸν διωκόμενον ὑπὸ τοῦ ἄρχοντος τοῦ πονηροῦ ἀπήλθετε εἰς ἄλλον τόπον.","그 악한 통치자로부터 박해받는 자를 주님께 데려간 후에 너희들은 다른 장소로 가버렸다.","강의안"],"19-8":[19,8,"προσῆλθον τῷ κυρίῳ ἐλθόντι εἰς τὸ ἱερόν.","주님께서 성전에 오신 후에 그들이 그분께 나아왔다.","교재"],"19-9":[19,9,"ἐπίστευσας εἰς αὐτὸν εἰπόντα ταῦτα.","너는 그가 이것들을 말한 후에 그를 믿었다.","강의안"],"19-10":[19,10,"ταῦτα εἶπον ἐξελθὼν ἐκ τῆς ἐκκλησίας.","나는 교회에서 나온 후에 이것들을 말했다.","교재"],"19-11":[19,11,"ὁ μὴ ἰδὼν τὸν κύριον οὐκ ἐπίστευσεν εἰς αὐτόν.","주님을 보지 못한 자는 그를 믿지 않았다.","교재"],"19-12":[19,12,"ταῦτα εἶπεν ὁ κύριος ἔτι ὢν ἐν τῇ ὁδῷ τοῖς ἐξελθοῦσιν ἐκ τοῦ οἴκου καὶ πορευομένοις μετ’ αὐτοῦ.","주님은 아직 길에 계실 때, 집에서 나와 그와 함께 가고 있는 자들에게 이것들을 말씀하셨다.","교재"],"19-13":[19,13,"ἀκούσαντες τὰ λεγόμενα ὑπὸ τοῦ κυρίου ἐπίστευσαν εἰς αὐτόν.","그들은 주님께서 하시는 말씀들을 들은 후에 그를 믿었다.","교재"],"19-14":[19,14,"εἴδομεν τοὺς γενομένους μαθητὰς τοῦ κυρίου καὶ ἔτι μένοντας ἐν τῇ ἐλπίδι αὐτῶν τῇ πρώτῃ.","우리는 주님의 제자가 되어 아직도 그들의 처음 소망 안에 머물러 있는 자들을 보았다.","교재"],"19-15":[19,15,"τὰ τέκνα τὰ λαβόντα ταῦτα ἀπὸ τῶν ἀκουσάντων τοῦ κυρίου εἶδον αὐτὸν ἔτι ὄντα ἐν τῷ οἴκῳ.","주님의 말씀을 들은 자들에게서 이것들을 받은 그 아이들은 그가 아직 집에 있을 때 그를 보았다.","교재"],"19-16":[19,16,"ἰδοῦσαι αὗται τὸν κηρύξαντα τὸ εὐαγγέλιον ἐκεῖνο ἦλθον πρὸς αὐτὸν ἐρχόμενον εἰς τὸν οἶκον.","이 여자들은 저 복음을 선포한 이를 본 후에, 집으로 들어오고 있는 그에게로 갔다.","교재"],"19-17":[19,17,"οἱ ἄγγελοι οἱ πεσόντες ἐκ τοῦ οὐρανοῦ πονηροὶ ἦσαν.","하늘에서 떨어진 그 천사들은 악했다.","교재"],"19-18":[19,18,"ἰδόντες τοὺς ἔτι ὄντας ἐν τῷ ἱερῷ ἐκήρυξαν αὐτοῖς τὴν βασιλείαν τοῦ θεοῦ.","그들은 아직 성전에 있는 자들을 보고 그들에게 하나님의 나라를 선포했다.","교재"],"19-19":[19,19,"ταῦτα ἀπεκρίθη τοῖς προσενεγκοῦσιν αὐτῷ τὰ τέκνα.","그는 그에게 그 아이들을 데려온 자들에게 이것들을 대답하였다.","교재"],"19-20":[19,20,"ἀπήλθομεν μὴ ἰδόντες τὸν διδάξαντα ἡμᾶς.","우리는 우리를 가르친 이를 보지 못하고 떠나갔다.","교재"],"20-1":[20,1,"πορευθέντος τοῦ ἄρχοντος πρὸς τὸν κύριον οἱ δοῦλοι εἶπον ταῦτα τοῖς μαθηταῖς.","그 통치자가 주님께로 간 후에 그 종들은 그 제자들에게 이것들을 말했다.","강의안"],"20-2":[20,2,"πορευθεὶς πρὸς αὐτοὺς ὁ ἄρχων ἐπίστευσεν εἰς τὸν κύριον.","그 통치자는 그들에게로 간 후에 주님을 믿었다.","교재"],"20-3":[20,3,"πιστευσάντων ὑμῶν εἰς τὸν κύριον εὐθὺς ἐπίστευσε καὶ ὁ ἄρχων.","너희가 주님을 믿은 후에 곧 그 통치자 역시 믿었다.","강의안"],"20-4":[20,4,"εἰσελθόντος εἰς τὴν οἰκίαν τοῦ ἐγερθέντος ὑπὸ τοῦ κυρίου οἱ μαθηταὶ ἐθαύμασαν.","주님으로 말미암아 일으킴을 받은 이가 그 집으로 들어간 후에 제자들은 놀랐다.","교재"],"20-5":[20,5,"ἐκβληθέντος αὐτοῦ ἐκ τῆς συναγωγῆς συνήχθησαν οἱ ἄρχοντες.","그가 회당 밖으로 던져진(쫓겨난) 후에 그 통치자들이 모여졌다.","강의안"],"20-6":[20,6,"ἐκβληθέντα ἐκ τῆς συναγωγῆς ἐδίδαξεν αὐτὸν ὁ κύριος.","주님께서는 회당에서 쫓겨난 그를 가르치셨다.","교재"],"20-7":[20,7,"εἰπόντος ταῦτα τοῦ πνεύματος τοῦ ἁγίου οἱ μαθηταὶ ἐκήρυξαν τὸν λόγον τοῦ θεοῦ.","성령께서 이것들을 말씀한 후에 그 제자들이 하나님의 말씀을 선포했다.","강의안"],"20-8":[20,8,"τοῖς θεραπευθεῖσιν ὑπ’ αὐτοῦ εἴπετε ῥήματα ἐλπίδος καὶ ζωῆς.","너희는 그로 말미암아 고침을 받은 자들에게 소망과 생명의 말씀들을 말했다.","교재"],"20-9":[20,9,"ἐλθόντος τούτου εἰς τὴν οἰκίαν αὐτοῦ εὐθέως εἴπομεν τοῖς ἄλλοις τὰ ῥήματα τὰ παραλημφθέντα ἀπὸ τοῦ κυρίου.","이 사람이 그의 집 안으로 들어간 후에 즉시, 우리는 다른 사람들에게 주님으로 말미암아 받아들여진 말씀들을 말했다.","강의안"],"20-10":[20,10,"βληθέντες εἰς φυλακὴν διὰ τὸ εὐαγγέλιον τὸ κηρυχθὲν αὐτοῖς ὑπὸ τοῦ ἀποστόλου ἐδόξασαν ἐκεῖ τὸν σώσαντα αὐτούς.","사도에게서 그들에게 선포된 복음 때문에 감옥에 갇힌 후에, 그들은 거기서 자기들을 구원하신 이를 영화롭게 했다.","교재"],"20-11":[20,11,"ἀναλημφθέντος αὐτοῦ εἰς οὐρανὸν εἰσῆλθον οἱ μαθηταὶ εἰς τὴν οἰκίαν αὐτῶν.","그가 하늘로 들려 올라가신 후에 제자들은 그들의 집으로 들어갔다.","교재"],"20-12":[20,12,"ἐδέξασθε τοὺς ἐκβληθέντας ἐκ τῆς συναγωγῆς καὶ τὰς δεξαμένας αὐτοὺς εἰς τὰς οἰκίας αὐτῶν.","너희는 회당에서 쫓겨난 자들과, 그들을 자기들 집에 영접한 여자들을 영접했다.","교재"],"20-13":[20,13,"αὗταί εἰσιν αἱ διωχθεῖσαι καὶ ἔτι διωκόμεναι ὑπὸ τῶν ἀρχόντων.","이들은 통치자들에게 박해를 받았고 아직도 박해를 받고 있는 여자들이다.","교재"],"20-14":[20,14,"αὕτη ἐστὶν ἡ ἐλπὶς ἡ κηρυχθεῖσα ἐν τῷ κόσμῳ ὑπὸ τῶν ἰδόντων τὸν κύριον.","이것이 주님을 본 자들로 말미암아 세상에 선포된 그 소망이다.","교재"],"20-15":[20,15,"τῶν στρατιωτῶν διωξάντων ἡμᾶς εἰς τὴν οἰκίαν ἐδέξαντο ἡμᾶς οἱ ὄντες ἐκεῖ.","군인들이 우리를 그 집까지 쫓아온 후에, 거기 있던 자들이 우리를 영접했다.","교재"],"20-16":[20,16,"διωχθέντας ἡμᾶς ὑπὸ τῶν στρατιωτῶν ἐδέξαντο οἱ ὄντες ἐν τῇ οἰκίᾳ.","군인들에게 쫓긴 우리를 그 집 안에 있던 자들이 영접했다.","교재"],"20-17":[20,17,"εἰσερχομένῳ σοι εἰς τὴν οἰκίαν προσῆλθον οἱ ἄρχοντες, εἰσελθόντα δὲ ἐξέβαλον.","네가 그 집으로 들어가고 있을 때 통치자들이 네게 다가왔고, 네가 들어간 후에는 너를 쫓아냈다.","교재"],"20-18":[20,18,"ταῦτα μὲν εἶπον αὐτοῖς προσφέρουσι τὰ παιδία τῷ κυρίῳ, ἐκεῖνα δὲ προσενεγκοῦσιν.","나는 그들이 아이들을 주님께 데려오고 있을 때는 이것들을, 데려온 후에는 저것들을 그들에게 말했다.","교재"],"20-19":[20,19,"πορευομένου μὲν τοῦ κυρίου μετὰ τῶν μαθητῶν αὐτοῦ ἔλεγον οἱ ἀπόστολοι ταῦτα, ἐλθόντος δὲ εἰς τὴν οἰκίαν ἐκεῖνα.","주님께서 제자들과 함께 가고 계실 때는 사도들이 이것들을 말하고 있었고, 그 집에 들어가신 후에는 저것들을 말하고 있었다.","교재"],"20-20":[20,20,"ταῦτα εἶπον ὑμῖν ἔτι οὖσιν μετ’ ἐμοῦ.","너희가 아직 나와 함께 있을 때 나는 너희에게 이것들을 말했다.","교재"]},"PARSE":[[3,"βλέπεις","βλέπω","보다","2단현능직",0,"네가 보고 있다",null],[3,"γινώσκεις","γινώσκω","알다","2단현능직",0,"네가 알고 있다",null],[3,"λαμβάνεις","λαμβάνω","취하다","2단현능직",0,"네가 취하고 있다",null],[3,"λύει","λύω","풀다","3단현능직",0,"그가 풀고 있다",null],[3,"διδάσκει","διδάσκω","가르치다","3단현능직",0,"그가 가르치고 있다",null],[3,"λέγετε","λέγω","말하다","2복현능직",0,"너희가 말하고 있다",null],[3,"γράφετε","γράφω","쓰다","2복현능직",0,"너희가 쓰고 있다",null],[3,"γινώσκομεν","γινώσκω","알다","1복현능직",0,"우리가 알고 있다",null],[3,"ἔχεις","ἔχω","가지다","2단현능직",0,"네가 가지고 있다",null],[3,"βλέπουσι","βλέπω","보다","3복현능직",0,"그들이 보고 있다",null],[3,"λαμβάνομεν","λαμβάνω","취하다","1복현능직",0,"우리가 취하고 있다",null],[4,"δ       T_={"현":"현재","미완":"미완료","미래":"미래","단과":"단순과거","2단과":"제2단순과거"},
      V_={"능":"능동태","중":"중간태","수":"수동태"}, G_={"남":"남성","여":"여성","중":"중성"},
      C_={"주":"주격","속":"속격","여":"여격","대":"대격","호":"호격"};
const VRE=/^([123])(단|복)(현|미완|미래|단과|2단과)(능|중|수)직$/;
const PRE=/^(남|여|중)(단|복)(주|속|여|대|호)(현|단과|2단과)(능|중|수)분$/;
function feat(code, kind){
  if(kind==="prep"){const m=code.match(/^(.+) \+ (.+)$/); return {prep:m[1], cs:m[2]}}
  let m=code.match(VRE);
  if(m) return {p:m[1],n:m[2],t:m[3],v:m[4]};
  m=code.match(PRE);
  if(m) return {g:m[1],n:m[2],c:m[3],t:m[4],v:m[5],m:"분"};
  m=code.match(/^([123])?(남|여|중)?(단|복)(주|속|여|대|호)$/);
  return {p:m[1]||"",g:m[2]||"",n:m[3],c:m[4]};
}
function decode(code, kind){
  if(kind==="prep") return "";
  const f=feat(code,kind);
  if(f.m) return `${G_[f.g]} ${N_[f.n]} ${C_[f.c]} ${T_[f.t]} ${V_[f.v]} 분사`;
  if(f.t) return `${P_[f.p]} ${N_[f.n]} ${T_[f.t]} ${V_[f.v]} 직설법`;
  return [f.p?P_[f.p]:"", f.g?G_[f.g]:"", N_[f.n], C_[f.c]].filter(Boolean).join(" ");
}
function dist(a,b){let d=0;for(const k of new Set([...Object.keys(a),...Object.keys(b)])) if(a[k]!==b[k]) d++;return d}
function pickNear(cands, n){ return cands.map(c=>({c, s:c.d+Math.random()*1.6})).sort((a,b)=>a.s-b.s).slice(0,n).map(x=>x.c) }

function josa(s){const k=s.replace(/\s*\(.*\)$/,"");const c=k.charCodeAt(k.length-1);return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?"이에요.":"예요."}
const posLine = p=>p?`<div class="pos">${esc(p)}</div>`:"";
const noteLine = n=>n?`<div class="mine">${gk(n)}</div>`:"";

    if(/μα$/.test(s)) return "-μα, -ματος 형 제3변화 명사는 모두 중성이에요.";

  if(g==="f" && /ος$/.test(s)) return "-ος로 끝나지만 여성 명사예요. 관사 ἡ와 함께 외워 두세요.";

}

/* ================= 2. 변화 ================= */
const PREP_CONFLICT=[["μετά + 속격","σύν + 여격","παρά + 여격"],["ἐκ (ἐξ) + 속격","ἀπό + 속격","παρά + 속격"],["παρά + 여격","παρά + 대격"]];
const prepConflict=(a,b)=>a===b||PREP_CONFLICT.some(g=>g.includes(a)&&g.includes(b));
const secName = s=>SECS.find(x=>x[0]===s)[1];
const PB=[];
PARA.forEach((P,pi)=>{
  P.items.forEach((it,ii)=>{ if(!it.d) PB.push({id:`p_${P.id}_${ii}`, src:"p", dir:"cf", sec:it.s||P.sec, pi, ii, build:buildParaQ}) });
  const seen=new Set();
  P.items.forEach((it,ii)=>{ if(it.d||seen.has(it.f)) return; seen.add(it.f);
    PB.push({id:`pf_${P.id}_${ii}`, src:"p", dir:"fc", sec:it.s||P.sec, pi, form:it.f, build:buildParaQ}); });
});
function buildParaQ(q){
  const P=PARA[q.pi], prep=P.kind==="prep", sec=secName(q.sec);
  if(q.dir==="cf"){
    const it=P.items[q.ii], fc=feat(it.c,P.kind);
    const byForm=new Map();
    P.items.forEach(x=>{ if(x.f===it.f) return;
      if(prep && prepConflict(x.c,it.c)) return;
      const d=dist(fc,feat(x.c,P.kind));
      if(!byForm.has(x.f)||byForm.get(x.f).d>d) byForm.set(x.f,{key:x.f,d});
    });
    const ds=pickNear([...byForm.values()],3).map(c=>c.key);
    const opts=shuffle([it.f,...ds]).map(f=>({v:f,label:f,html:prep?esc(f):gk(f)}));
    return {pre:prep?"":P.lemma, word:it.c, wordCls:prep?"":"code",
      ask: prep?"뜻은?":"알맞은 형태는?", opts, ans:it.f, ansTxt:it.f, optCls:prep?"small":"gkopt",
      tag:`${sec} · 형태 고르기`, revWord:prep?it.c:`${P.lemma.split(/[, /]/)[0]}  ${it.c}`, revSub:sec,
      fb:paraFb(P,it.f,prep)};
  }
  const valid=P.items.filter(x=>x.f===q.form);
  const given=valid.filter(x=>!x.d);
  const code=given[Math.floor(Math.random()*given.length)].c;
  const fc=feat(code,P.kind);
  const cands=P.items.filter(x=>x.f!==q.form && !valid.some(v=>v.c===x.c) && !(prep && valid.some(v=>prepConflict(v.c,x.c))))
    .map(x=>({key:x.c,d:dist(fc,feat(x.c,P.kind))}));
  const uniq=[...new Map(cands.map(c=>[c.key,c])).values()];
  const ds=pickNear(uniq,3).map(c=>c.key);
  const opts=shuffle([code,...ds]).map(c=>({v:c,label:c,html:prep?gk(c):`${esc(c)}<small>${esc(decode(c,P.kind))}</small>`}));
  return {pre:prep?"":P.lemma, word:q.form, wordCls:prep?"ko":"",
    ask: prep?"어떤 전치사 + 격일까요?":"이 형태의 분석으로 맞는 것은?", opts, ans:code, ansTxt:code,
    optCls:prep?"gkopt small":"", tag:`${sec} · 분석하기`, revWord:q.form, revSub:sec,
    fb:paraFb(P,q.form,prep)};
}
function paraFb(P,f,prep){
  const all=P.items.filter(x=>x.f===f), it=all[0];
  let h="";
  if(prep){
    h+=`<div class="entry">${gk(all.map(x=>x.c).join(" / "))}</div><div class="fbline">${esc(f)}</div><div class="fbline dim">발음: ${esc(it.p)} · ${esc(it.t)}</div>`;
    if(/함께/.test(f)) h+=`<div class="fbline dim">‘~과 함께’는 μετά + 속격 / σύν + 여격 / παρά + 여격</div>`;
  } else {
    h+=`<div class="entry">${gk(f)} <span class="fbline dim">(${esc(it.p)})</span></div>`;
    h+=`<div class="fbline">${all.map(x=>`${esc(x.c)} <span class="fbline dim">${decode(x.c,P.kind)}${x.d?" · 참고":""}</span>`).join("<br>")}</div>`;
    const ts=[...new Set(all.map(x=>x.t).filter(Boolean))];
    if(ts.length) h+=`<div class="fbline">${ts.map(esc).join(" / ")}</div>`;
    if(all.length>1) h+=`<div class="fbline dim">같은 형태라서 위 분석이 모두 가능해요.</div>`;
  }
  h+=`<div class="mine">${gk(P.note)}</div>`;
  return h;
}

const EB=[];
ENDS.forEach((E,ei)=>E.items.forEach(([slot,e],si)=>{
  EB.push({id:`ecf_${E.k}${si}`, src:"e", dir:"cf", set:ei, si, build:buildEndQ});
  const first=E.items.findIndex(x=>x[1]===e);

  if(ENDCOUNT[e].size===1 && first===si) EB.push({id:`est_${E.k}${si}`, src:"e", dir:"st", set:ei, si, build:buildEndQ});

function endFb(E, hi){
  return `<div class="fbline"><b>${esc(E.name)}</b> <span class="fbline dim">${gk(E.use)}</span></div>`+
    `<div class="fbline">${E.items.map(([s,e,p],i)=>`${i===hi?"<b>":""}${esc(s)} <span class="gk">${esc(e)}</span> ${esc(p)}${i===hi?"</b>":""}`).join(" · ")}</div>`+
    `<div class="mine">${gk(E.orig)}</div>`;
}
function buildEndQ(q){
  const E=ENDS[q.set], [slot,e,p]=E.items[q.si];
  if(q.dir==="cf"){
    const same=shuffle(E.items.filter(x=>x[1]!==e)).map(x=>x[1]);
    const other=shuffle(ENDS.filter(x=>x!==E).map(x=>x.items[q.si][1]).filter(x=>x!==e));
    const pool=[...new Set([...same.slice(0,2),...other.slice(0,2),...same.slice(2),...other.slice(2)])].filter(x=>x!==e);
    const opts=shuffle([e,...pool.slice(0,3)]).map(x=>({v:x,label:x,html:gk(x)}));
    return {pre:E.name, preCls:"ui", word:SLOT[slot], wordCls:"ko", ask:"알맞은 어미는?", opts, optCls:"gkopt", ans:e, ansTxt:e,
      tag:`어미 · ${E.name}`, revWord:`${E.name} ${slot}`, revSub:"어미 고르기", fb:endFb(E,q.si)};
  }
  if(q.dir==="fc"){
    const ok=E.items.filter(x=>x[1]===e).map(x=>x[0]);
    const opts=E.items.map(x=>({v:x[0],label:x[0],html:esc(x[0])}));
    return {pre:E.name, preCls:"ui", word:e, ask:"몇 인칭·몇 수의 어미일까요?", opts, cols:3, optCls:"small", ans:ok, ansTxt:ok.map(x=>SLOT[x]).join(" / "),
      tag:`어미 · ${E.name}`, revWord:`${e}  (${E.name})`, revSub:"인칭·수 맞히기", fb:endFb(E,q.si)+(ok.length>1?`<div class="fbline dim">1단과 3복이 같은 모양이라 둘 다 정답이에요.</div>`:"")};
  }
  const others=shuffle(ENDS.filter(x=>x!==E)).slice(0,3);
  const opts=shuffle([E,...others]).map(x=>({v:x.k,label:x.name,html:`${esc(x.name)}<small>${gk(x.use)}</small>`}));
  return {word:e, ask:`<b>${esc(SLOT[slot])}</b> 어미예요. 어느 어미표일까요?`, opts, cols:1, ans:E.k, ansTxt:E.name,
    tag:"어미 · 시제·태 맞히기", revWord:e, revSub:"시제·태 맞히기", fb:endFb(E,q.si)};
}

const AL = ALPHA.map(([lo,up,name,snd,num])=>({lo,up,name,snd,num}));
function alNear(a, key){
  const grp=ALPHA_CONF.filter(g=>g.includes(a.lo)).flat().filter(x=>x!==a.lo);
  const near=shuffle(AL.filter(x=>grp.includes(x.lo)));
  const rest=shuffle(AL.filter(x=>x!==a && !grp.includes(x.lo)));
  const out=[]; for(const x of [...near,...rest]){ if(out.length>=3) break; if(x[key]!==a[key] && !out.some(o=>o[key]===x[key])) out.push(x) }
  return out;
}

  const fb=`<div class="entry">${gk(a.lo)} <span class="gk">${esc(a.up)}</span></div><div class="fbline">${esc(a.name)} · 소리 ${esc(a.snd)} · 숫자 ${esc(a.num)}</div>`;

// 기본형
const PPO = PP.map(([pr,fu,ao,m,l,n])=>({pr,fu,ao,m,l,n}));
function ppFb(x){
  return `<div class="entry">${gk([x.pr,x.fu||"—",x.ao||"—"].join(", "))}</div><div class="fbline dim">현재 · 미래 · 단순과거 (1인칭 단수)</div><div class="fbline">${esc(x.m)} · ${esc(x.l)}과</div>${x.n?`<div class="mine">${gk(x.n)}</div>`:""}`;
}
function ppDistract(x, key, n){
  const pool=PPO.filter(y=>y!==x && y[key] && y[key]!==x[key]);
  return shuffle(pool).slice(0,n).map(y=>y[key]);
}
function sigSwap(f){
  const m=f.match(/^(.*)(ψ|ξ|σ)(ω|ομαι|α|άμην)$/);
  if(!m) return [];
  return ["ψ","ξ","σ"].filter(c=>c!==m[2]).map(c=>m[1]+c+m[3]);
}
function ppOpts(x,key){
  const other = key==="fu" ? x.ao : x.fu;
  let ds=sigSwap(x[key]);
  if(other) ds.push(other);
  const more=ppDistract(x,key,6).filter(d=>!ds.includes(d));
  ds=[...new Set([...ds,...more])].filter(d=>d!==x[key]);
  return ds.slice(0,3);
}
PPO.forEach((x,i)=>{
  if(x.fu){
    RB.push({id:"ppf"+i, src:"pp", g:"pp", build:()=>{ const ds=ppOpts(x,"fu");
      return {pre:x.m, preCls:"ui", word:x.pr, ask:"미래 1인칭 단수는?", opts:shuffle([x.fu,...ds]).map(o=>({v:o,label:o,html:gk(o)})), optCls:"gkopt",

    RB.push({id:"ppfr"+i, src:"pp", g:"pp", build:()=>({word:x.fu, ask:"어느 동사의 미래일까요?", opts:shuffle([x.pr,...ppDistract(x,"pr",3)]).map(o=>({v:o,label:o,html:gk(o)})), optCls:"gkopt",

  }
  if(x.ao){
    RB.push({id:"ppa"+i, src:"pp", g:"pp", build:()=>{ const ds=ppOpts(x,"ao");
      return {pre:x.m, preCls:"ui", word:x.pr, ask:"단순과거 1인칭 단수는?", opts:shuffle([x.ao,...ds]).map(o=>({v:o,label:o,html:gk(o)})), optCls:"gkopt",
        ans:x.ao, ansTxt:x.ao, tag:"기본형 · 단순과거", revWord:x.pr, revSub:"단순과거", fb:ppFb(x)}}});
    RB.push({id:"ppar"+i, src:"pp", g:"pp", build:()=>({word:x.ao, ask:"어느 동사의 단순과거일까요?", opts:shuffle([x.pr,...ppDistract(x,"pr",3)]).map(o=>({v:o,label:o,html:gk(o)})), optCls:"gkopt",
        ans:x.pr, ansTxt:x.pr, tag:"기본형 · 단순과거 → 현재", revWord:x.ao, revSub:"단순과거 → 현재", fb:ppFb(x)})});
  }

const ALLCODES=[];
for(const p of ["1","2","3"]) for(const n of ["단","복"]) for(const t of ["현","미완","미래","단과","2단과"]) for(const v of ["능","중","수"]){

  return `<h3>${esc(E.name)}</h3><p class="note">${gk(E.use)} · 보기 ${gk(E.ex)}</p><div class="chant">${esc(E.chant)}</div>`+
    tw(["","어미"], E.items.map(([s,e,p])=>`<tr><td class="k">${esc(SLOT[s])}</td><td class="f">${gk(e)}<small class="pr">${esc(p)}</small></td></tr>`))+
    `<p class="note">${gk(E.orig)}</p>`;
}
const ruleCard = ([_,t,b,ref,star])=>`<div class="rule"><h4>${star?`<span class="star" aria-label="강조">★</span>`:""}${gk(t)}</h4>${lines(b)}<span class="ref">${esc(ref)}</span></div>`;
const alphaBlock = ()=>tw(["글자","이름","소리","수"], AL.map(a=>`<tr><td class="f">${gk(a.lo)} ${gk(a.up)}</td><td>${esc(a.name)}</td><td>${esc(a.snd)}</td><td class="k">${esc(a.num)}</td></tr>`))+
  `<p class="note">모음: 단모음 α ε ο ι υ / 장모음 α η ω ι υ. ε(짧은 에)·η(긴 에), ο(짧은 오)·ω(긴 오)를 철자로 구별해요.</p>`;
const ppBlock = list=>tw(["현재 · 미래 · 단순과거","뜻"], list.map(x=>`<tr><td class="f fw" style="white-space:normal">${gk(x.pr)} · ${gk(x.fu||"—")} · ${gk(x.ao||"—")}</td><td>${esc(x.m)}${x.n?`<small>${gk(x.n)}</small>`:""}</td></tr>`))+
  `<p class="note">— 는 아직 강의안·교재 1–20과에 나오지 않은 칸이에요.</p>`;
function parseBlock(xs){
  const bySent=new Map(), loose=[];
  xs.forEach(x=>{ if(x[7]){ if(!bySent.has(x[7])) bySent.set(x[7],[]); bySent.get(x[7]).push(x) } else loose.push(x) });
  const row=x=>`<tr><td class="f">${gk(x[1])}</td><td class="f">${gk(x[2])}<small>${esc(x[3])}</small></td><td>${esc(x[4])}${x[5]?"디포":""}<small>${esc(x[6])}</small></td></tr>`;
  let h="";
  if(loose.length) h+=tw(["형태","원형","분석"], loose.map(row));
  bySent.forEach((ys,sid)=>{
    const s=SENT[sid];
    h+=`<details class="sent"><summary><div class="g">${gk(s[2])}</div><div class="k">${esc(s[3])}</div><span class="peek">분석 보기 · ${ys.length}개</span> <span class="src">· ${s[0]}과 ${s[1]}번 ${s[4]==="교재"?"교재 익힘":"강의안 풀이"}</span></summary>${tw(["형태","원형","분석"], ys.map(row))}</details>`;
  });
  return h;
}

/* ---------- 과 정보 ---------- */
const LTITLE={1:"알파벳",2:"악센트",3:"현재 능동태 직설법",4:"명사 제2변화, 어순, 움직이는 ν",5:"명사 제1변화",
  6:"관사, 제1·2변화 형용사, 관사와 형용사의 용법",7:"제1변화의 남성 명사, 전치사",8:"전접어, 3인칭 인칭대명사, εἰμί의 현재 직설법",
  9:"지시대명사, αὐτός 용법의 보충",10:"현재 중간태·수동태 직설법, ὑπό+속격, 수단의 여격, 디포넌트, 합성동사, οὐ의 위치, 동사가 지배하는 격",
  11:"미완료 능동태 직설법, 합성동사의 접두모음, εἰμί의 미완료, ἔστι(ν)의 악센트",12:"미완료 중간태·수동태 직설법, 중성 복수 주어와 단수 동사, καί와 οὐδέ",
  13:"미래 능동태·중간태 직설법",14:"단순과거 능동태·중간태 직설법, πιστεύω에 대하여",15:"제2단순과거 능동태·중간태 직설법",
  16:"단순과거 수동태 직설법, 미래 수동태 직설법",17:"명사 제3변화",18:"현재분사, 분사의 용법",19:"단순과거 분사의 능동태와 중간태, 분사의 용법(계속), 부정어 οὐ와 μή",20:"단순과거 수동태 분사, 속격 독립 구문, 미래 분사"};
const NOML={anth:4,doron:4,huios:4,alet:5,doxa:5,graf:5,prof:7,art:6,agat:6,mikr:6,ego:8,auto:8,hout:9,ekei:9,elpis:17,nux:17,archon:17,sarx:17,onoma:17,ptca:18,ptcm:18,ptcsa:19,ptcsm:19,ptc2a:19,ptcsp:20};
function itemLesson(P,it){
  if(P.kind==="prep") return parseInt(it.t);
  if(P.kind!=="verb") return NOML[P.id];
  if(P.id==="leipo") return 15;
  if(P.id==="grapho") return 16;
  const f=feat(it.c);
  if(P.id==="eimi") return f.t==="현"?8:11;
  return {"현":f.v==="능"?3:10,"미완":f.v==="능"?11:12,"미래":f.v==="수"?16:13,"단과":f.v==="수"?16:14,"2단과":15}[f.t];
}
const SEC_START=[[1,1],[10,2],[17,3],[24,4],[43,5],[56,6],[72,7],[85,8],[95,9],[101,10],[113,11],[127,12],[139,13],[155,14],[165,15],[174,16],[185,17],[198,18],[210,19],[228,20]];
const secLesson = n=>{let L=1; for(const [s,l] of SEC_START) if(n>=s) L=l; return L};
function refLessons(ref){
  const ns=[]; for(const m of ref.matchAll(/(\d+)(?:–(\d+))?/g)){ const a=+m[1], b=m[2]?+m[2]:a; for(let i=a;i<=b;i++) ns.push(i) }
  return [...new Set(ns.map(secLesson))];
}
const ENDL={A:[3,13],B:[10,13],C:[11,15],D:[12,15],E:[14],F:[14],G:[16],H:[16]};
const ppLessons = x=>x.l.split("·").map(Number);
function lessonOfQ(q){
  if(q.src==="v") return [q.l];
  if(q.src==="p"){ const P=PARA[q.pi]; const it = q.dir==="cf"?P.items[q.ii]:P.items.find(x=>x.f===q.form); return [itemLesson(P,it)] }
  if(q.src==="e") return ENDL[ENDS[q.set].k];
  if(q.src==="x") return [PARSE[q.i][0]];
  if(q.src==="al") return [1];
  const m=q.id.match(/^(ppfr|ppar|ppf|ppa|r)(\d+)$/);
  if(m[1]==="r") return [RQ[+m[2]][1]];
  return ppLessons(PPO[+m[2]]);
}
const lessonPool = L=>[...ALLQ.values()].filter(q=>lessonOfQ(q).includes(L));

/* ================= 학습 탭 ================= */
const TOPICS=[["v","단어"],["p","변화표"],["e","어미"],["r","특이사항"],["x","익힘 파싱"]];
const LS_VIEW="gk_1_15_view_v1";
let VIEW={pane:"learn", lm:"lesson", topic:"p", lesson:1};
try{ Object.assign(VIEW, JSON.parse(localStorage.getItem(LS_VIEW)||"{}")) }catch(e){}
const saveView=()=>{ try{ localStorage.setItem(LS_VIEW, JSON.stringify(VIEW)) }catch(e){} };

function sec(key,title,count,inner){
  return `<details class="sec" data-key="${esc(key)}"${(VIEW.open||[]).includes(key)?" open":""}><summary><span>${title}</span>${count!=null?`<span class="sc">${count}</span>`:""}</summary><div class="sb">${inner}</div></details>`;
}
function topicView(k){
  let h="";
  if(k==="v"){
    h+=`<p class="lead">강의안 낱말 모음 순서예요. 명사는 관사와 함께, 동사는 ‘내가 ~하다’로 외워요.</p>`;
    LESSONS.forEach(l=>{ const ws=WORDS.filter(w=>w.l===l); h+=sec(`v:${l}`,`${l}과`,`${ws.length}개`,wordsBlock(ws)) });
  } else if(k==="p"){
    h+=`<p class="lead">회색 칸은 비교용 참고예요. 같은 칸끼리 세로로 소리 내어 읽어 보세요.</p>`;
    SECS.forEach(([sn,name])=>{
      let b=""; PARA.forEach(P=>{ const its=P.items.filter(it=>(it.s||P.sec)===sn); if(its.length) b+=paraBlock(P,its) });
      h+=sec(`p:${sn}`,gk(name),null,b);
    });
  } else if(k==="e"){
    h+=`<p class="lead">어미는 연결모음(μ, ν 앞 ο / 그 밖 ε)까지 붙인 모양으로 외워요. 굵은 줄을 리듬 있게 소리 내어 읽으세요.</p>`;
    h+=sec("e:f","시제 조립표",null,formulaBlock(FORMULA)+`<p class="note">제1시제 = 현재·미래(·현재완료), 제2시제 = 미완료·단순과거(·과거완료). 제2시제 직설법에는 접두모음 ἐ가 붙어요.</p>`);
    h+=sec("e:1","제1시제 어미",null,endBlock(ENDS[0])+endBlock(ENDS[1]));
    h+=sec("e:2","제2시제 어미",null,endBlock(ENDS[2])+endBlock(ENDS[3]));
    h+=sec("e:a","단순과거 어미",null,endBlock(ENDS[4])+endBlock(ENDS[5]));
    h+=sec("e:p","수동태 어미",null,endBlock(ENDS[6])+endBlock(ENDS[7]));
  } else if(k==="r"){
    h+=`<p class="lead">★는 강의안에 ★ 또는 ‘모두 외우기!’로 표시된 내용, 〔교재〕는 교재에서 보충한 내용이에요. § 번호는 강의안·교재 공통 항목 번호예요.</p>`;
    RG.forEach(([g,name,ls])=>{
      const b = g==="al" ? alphaBlock() : g==="pp" ? ppBlock(PPO) : RULES.filter(r=>r[0]===g).map(ruleCard).join("");
      h+=sec(`r:${g}`,gk(name),esc(ls),b);
    });
  } else {
    h+=`<p class="lead">익힘 문제에 나온 동사 형태를 문장과 함께 모았어요. 강의안 풀이를 그대로 따랐고, ‘교재 익힘’은 강의안 풀이가 없는 문장이에요.</p>`;
    XGRP.forEach(([g,name])=>{ const xs=PARSE.filter(x=>(x[0]<10?9:x[0])===g); h+=sec(`x:${g}`,name,`${xs.length}개`,parseBlock(xs)) });
  }
  const T=TABS[k];
  h+=`<div class="cta"><button class="primary" id="goQuiz">${esc(T.name)} 문제 풀러 가기</button></div>`;
  return h;
}
function lessonView(L){
  let h=`<div class="lhead"><h1>제${L}과</h1><button class="linkbtn" id="openAll">모두 펼치기</button></div><p class="lead">${gk(LTITLE[L])}</p>`;
  if(L===1) h+=sec("L:al","알파벳",null,alphaBlock());
  const ws=WORDS.filter(w=>w.l===L);
  if(ws.length) h+=sec("L:v","낱말 모음",`${ws.length}개`,wordsBlock(ws));
  let ph="", pn=0;
  PARA.forEach(P=>{ const its=P.items.filter(it=>itemLesson(P,it)===L); if(its.length){ ph+=paraBlock(P,its); pn++ } });
  if(ph) h+=sec("L:p","변화표",`${pn}개`,ph);
  const es=ENDS.filter(E=>ENDL[E.k].includes(L));
  if(es.length){
    const fr=FORMULA.filter(f=>f[3].split("·").map(s=>parseInt(s)).includes(L));
    h+=sec("L:e","어미",`${es.length}개`,(fr.length?formulaBlock(fr):"")+es.map(endBlock).join(""));
  }
  const rs=RULES.filter(r=>refLessons(r[3]).includes(L));
  if(rs.length) h+=sec("L:r","정리",`${rs.length}개`,rs.map(ruleCard).join(""));
  const xs=PARSE.filter(x=>x[0]===L);
  if(xs.length) h+=sec("L:x","익힘 파싱",`${new Set(xs.map(x=>x[7]||x[1])).size}문장 · ${xs.length}형태`,`<p class="note">문장을 누르면 분석이 나와요. 먼저 머릿속으로 분석해 보세요.</p>`+parseBlock(xs));
  const n=lessonPool(L).length;
  h+=`<div class="cta btns">${n?`<button class="primary" id="lq20">${L}과 문제 ${Math.min(20,n)}개 풀기</button>${n>20?`<button class="ghost" id="lqAll">${L}과 전부 풀기 (${n}개)</button>`:""}`:""}</div>`;
  const nav=[];
  if(L>1) nav.push(`<button class="ghost" id="lPrev">← ${L-1}과</button>`);
  if(L<20) nav.push(`<button class="ghost" id="lNext">${L+1}과 →</button>`);
  h+=`<div class="lnav">${nav.join("")}</div>`;
  return h;
}
const on0=(id,f)=>{const el=$("#"+id); if(el) el.onclick=f};
const on=on0;
function renderLearn(){
  document.querySelectorAll("#learnSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===VIEW.lm));
  const box=$("#learnChips");
  if(VIEW.lm==="lesson"){
    const NL=Object.keys(LTITLE).length, L=VIEW.lesson;
    box.className="learnchips stepper";
    box.innerHTML=`<button id="lsPrev" aria-label="이전 과"${L<=1?" disabled":""}>‹</button><select id="lsSel" aria-label="과 선택">${Array.from({length:NL},(_,i)=>`<option value="${i+1}"${i+1===L?" selected":""}>${i+1}과 · ${esc(LTITLE[i+1].split(",")[0])}</option>`).join("")}</select><button id="lsNext" aria-label="다음 과"${L>=NL?" disabled":""}>›</button>`;
    const go=n=>{VIEW.lesson=n; saveView(); renderLearn(); window.scrollTo(0,0)};
    $("#lsSel").onchange=e=>go(+e.target.value);
    $("#lsPrev").onclick=()=>go(L-1); $("#lsNext").onclick=()=>go(L+1);
  } else {
    box.className="learnchips chips";
    box.innerHTML=TOPICS.map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${k===VIEW.topic}">${esc(l)}</button>`).join("");
    box.querySelectorAll("button").forEach(b=>b.onclick=()=>{ VIEW.topic=b.dataset.k; saveView(); renderLearn(); });
  }
  const body=$("#learnBody");
  body.innerHTML = VIEW.lm==="lesson" ? lessonView(VIEW.lesson) : topicView(VIEW.topic);
  const secs=[...body.querySelectorAll("details.sec")];
  secs.forEach(d=>d.addEventListener("toggle",()=>{
    const o=new Set(VIEW.open||[]); d.open?o.add(d.dataset.key):o.delete(d.dataset.key); VIEW.open=[...o]; saveView(); syncAll();
  }));
  const syncAll=()=>{ const b=$("#openAll"); if(b) b.textContent = secs.length && secs.every(d=>d.open) ? "모두 접기" : "모두 펼치기" };
  syncAll();
  on0("openAll",()=>{ const all=secs.every(d=>d.open); secs.forEach(d=>d.open=!all); });
  on("goQuiz",()=>{ tab=VIEW.topic; setPane("quiz"); renderTabs(); renderPanel(); window.scrollTo(0,0) });
  on("lq20",()=>start(shuffle(lessonPool(VIEW.lesson)).slice(0,20)));
  on("lqAll",()=>start(lessonPool(VIEW.lesson)));
  on("lPrev",()=>{VIEW.lesson--; saveView(); renderLearn(); window.scrollTo(0,0)});
  on("lNext",()=>{VIEW.lesson++; saveView(); renderLearn(); window.scrollTo(0,0)});
}
function setPane(p){
  VIEW.pane=p; saveView();
  document.querySelectorAll("#topNav button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===p));
  $("#learnPane").classList.toggle("hidden", p!=="learn");
  $("#quizPane").classList.toggle("hidden", p!=="quiz");
}
document.querySelectorAll("#topNav button").forEach(b=>b.onclick=()=>{ setPane(b.dataset.v); if(b.dataset.v==="learn") renderLearn(); else renderPanel(); });
document.querySelectorAll("#learnSeg button").forEach(b=>b.onclick=()=>{ VIEW.lm=b.dataset.m; saveView(); renderLearn() });
const upBtn=$("#upBtn");
window.addEventListener("scroll",()=>{ upBtn.classList.toggle("hidden", !(window.scrollY>700 && !$("#home").classList.contains("hidden") && VIEW.pane==="learn")) },{passive:true});
upBtn.onclick=()=>window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});

renderTabs(); renderPanel(); renderLearn(); setPane(VIEW.pane);
</script>
