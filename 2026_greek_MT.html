<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헬라어 3–11과 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF2; --surface:#FFFFFF; --ink:#18263D; --muted:#5F6B7D; --line:#CFD6E0;
  --accent:#2C5AA0; --accent-ink:#FFFFFF; --soft:#DCE5F3;
  --ok:#24704F; --ok-bg:#E1F1E8; --bad:#A83434; --bad-bg:#F7E3E3;
  --greek:"Gentium Plus","Gentium Book Plus","Noto Serif","Times New Roman","Noto Sans KR",serif;
  --ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111823; --surface:#1A2433; --ink:#E4EAF3; --muted:#9AA6B8; --line:#2D3A4E;
    --accent:#86AAE8; --accent-ink:#0E1622; --soft:#22324A;
    --ok:#7FCFA6; --ok-bg:#183327; --bad:#EE9A9A; --bad-bg:#3A1F22;
  }
}
:root[data-theme="dark"]{
  --bg:#111823; --surface:#1A2433; --ink:#E4EAF3; --muted:#9AA6B8; --line:#2D3A4E;
  --accent:#86AAE8; --accent-ink:#0E1622; --soft:#22324A;
  --ok:#7FCFA6; --ok-bg:#183327; --bad:#EE9A9A; --bad-bg:#3A1F22;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding:28px 18px 48px}
.gk{font-family:var(--greek)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* 시작 화면 */
.masthead{margin:8px 0 28px}
.masthead .alpha{font-family:var(--greek);font-size:clamp(56px,16vw,88px);line-height:1;letter-spacing:-.01em;color:var(--accent)}
.masthead h1{font-size:22px;margin:10px 0 4px;font-weight:700}
.masthead p{margin:0;color:var(--muted);font-size:14px}
.group{margin-bottom:24px}
.group h2{font-size:15px;font-weight:700;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;font-size:14px;line-height:1.35}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--soft);font-weight:700;color:var(--accent)}
.seg small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.slider-row{display:flex;align-items:center;gap:14px}
input[type=range]{flex:1;accent-color:var(--accent)}
.count{font-weight:700;font-size:20px;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.avail{color:var(--muted);font-size:13px;margin-top:6px}
.primary{width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:15px;margin-top:6px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:500}

/* 문제 화면 */
.topbar{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:10px}
.topbar button{border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--surface);border-radius:16px;padding:30px 22px 24px;border:1px solid var(--line)}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin-bottom:18px}
.word{font-family:var(--greek);font-size:clamp(40px,11vw,60px);line-height:1.15;text-align:center;margin:4px 0 6px;word-break:keep-all;overflow-wrap:anywhere}
.word.long{font-size:clamp(28px,8vw,42px)}
.ask{text-align:center;color:var(--muted);margin:0 0 24px;font-size:15px}
.ask b{color:var(--ink);font-weight:500}
.opts{display:grid;gap:10px}
.opts.cols3{grid-template-columns:repeat(3,1fr)}
.opts.cols4{grid-template-columns:repeat(2,1fr)}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 8px;font-size:16px;text-align:center;min-height:56px}
.opt .gk{font-size:19px;display:block;line-height:1.1}
.opt small{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.sa input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.feedback{margin-top:18px;border-radius:12px;padding:14px 16px;font-size:15px}
.feedback.ok{background:var(--ok-bg)}
.feedback.no{background:var(--bad-bg)}
.feedback.neutral{background:var(--soft)}
.feedback .verdict{font-weight:700;margin-bottom:4px}
.feedback.ok .verdict{color:var(--ok)}
.feedback.no .verdict{color:var(--bad)}
.entry{font-family:var(--greek);font-size:19px}
.mine{color:var(--muted);font-size:14px;margin-top:6px}
.match{font-size:13px;color:var(--ok);margin-top:4px}
.selfgrade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.selfgrade button{border-radius:10px;padding:12px;font-weight:700;border:1.5px solid}
.selfgrade .y{border-color:var(--ok);color:var(--ok);background:var(--surface)}
.selfgrade .n{border-color:var(--bad);color:var(--bad);background:var(--surface)}
.actions{margin-top:18px}

/* 결과 */
.result-head{text-align:center;margin:20px 0 26px}
.result-head .emoji{font-size:56px;line-height:1}
.result-head .score{font-size:44px;font-weight:700;margin:8px 0 0;font-variant-numeric:tabular-nums}
.result-head .score span{font-size:22px;color:var(--muted);font-weight:500}
.result-head p{margin:4px 0 0;color:var(--muted)}
.review h2{font-size:16px;margin:0 0 10px}
.review ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.review li{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:12px 14px}
.review .q{font-family:var(--greek);font-size:20px}
.review .q small{font-family:var(--ui);font-size:13px;color:var(--muted);margin-left:6px}
.review .a{font-size:15px}
.review .m{font-size:13px;color:var(--muted)}
.btns{display:grid;gap:10px;margin-top:22px}
.empty{color:var(--muted);text-align:center;padding:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:2px solid var(--line);margin-bottom:24px}
.tabs button{border:0;background:none;padding:12px 6px 10px;font-size:16px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button small{display:block;font-size:12px;font-weight:400}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.pre{text-align:center;font-family:var(--greek);font-size:20px;color:var(--muted);margin-bottom:2px}
.word.code{font-family:var(--ui);font-weight:700;font-size:clamp(30px,9vw,42px);letter-spacing:.02em}
.word.ko{font-family:var(--ui);font-weight:700;font-size:clamp(24px,7vw,32px)}
.opt.gkopt{font-family:var(--greek);font-size:22px;line-height:1.25}
.opt.small{font-size:15px}
.fbline{margin-top:2px}
.pos{display:inline-block;margin-top:8px;font-size:13px;font-weight:500;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.fbline.dim{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (max-width:380px){.opts.cols3{grid-template-columns:1fr}}
</style>
</head>

<section id="home">

    <h1>헬라어 3–11과 모의고사</h1>

  <button class="primary" id="startBtn">시작하기</button>
</section>

  <div class="bar"><i id="progBar"></i></div>
  <div class="card" id="card"></div>
</section>

<section id="result" class="hidden"></section>

</div>

const P_={1:"1인칭",2:"2인칭",3:"3인칭"}, N_={"단":"단수","복":"복수"}, T_={"현":"현재","미":"미완료"},
      V_={"능":"능동태","중":"중간태","수":"수동태"}, G_={"남":"남성","여":"여성","중":"중성"},
      C_={"주":"주격","속":"속격","여":"여격","대":"대격","호":"호격"};
function feat(code, kind){
  if(kind==="prep"){const m=code.match(/^(.+) \+ (.+)$/); return {prep:m[1], cs:m[2]}}
  let m=code.match(/^([123])(단|복)(현|미)(능|중|수)(직)$/);
  if(m) return {p:m[1],n:m[2],t:m[3],v:m[4]};
  m=code.match(/^([123])?(남|여|중)?(단|복)(주|속|여|대|호)$/);
  return {p:m[1]||"",g:m[2]||"",n:m[3],c:m[4]};
}
function decode(code, kind){
  if(kind==="prep") return "";
  const f=feat(code,kind);
  if(f.t) return `${P_[f.p]} ${N_[f.n]} ${T_[f.t]} ${V_[f.v]} 직설법`;
  return [f.p?P_[f.p]:"", f.g?G_[f.g]:"", N_[f.n], C_[f.c]].filter(Boolean).join(" ");
}
function dist(a,b){let d=0;for(const k of new Set([...Object.keys(a),...Object.keys(b)])) if(a[k]!==b[k]) d++;return d}
const PREP_CONFLICT=[["μετά + 속격","σύν + 여격","παρά + 여격"],["ἐκ (ἐξ) + 속격","ἀπό + 속격","παρά + 속격"],["παρά + 여격","παρά + 대격"]];
function prepConflict(a,b){return a===b||PREP_CONFLICT.some(g=>g.includes(a)&&g.includes(b))}
function pickNear(cands, n){ // cands: [{key,d}]
  return cands.map(c=>({c, s:c.d+Math.random()*1.6})).sort((a,b)=>a.s-b.s).slice(0,n).map(x=>x.c);
}
function sameForm(P, f){return P.items.filter(x=>x.f===f).map(x=>x.c)}

const PBANK=[];
PARA.forEach((P,pi)=>{
  // 코드 → 형태: 칸마다 하나
  P.items.forEach((it,ii)=>{ if(!it.d) PBANK.push({id:`pf${pi}_${ii}`, type:"mc", src:"p", dir:"cf", sec:P.sec, pi, ii}); });
  // 형태 → 코드: 같은 형태는 하나로
  const seen=new Set();
  P.items.forEach((it,ii)=>{ if(it.d||seen.has(it.f)) return; seen.add(it.f);
    PBANK.push({id:`pc${pi}_${ii}`, type:"mc", src:"p", dir:"fc", sec:P.sec, pi, form:it.f}); });
});

function buildParaQ(q){
  const P=PARA[q.pi], prep=P.kind==="prep";
  const sec=SECS.find(s=>s[0]===P.sec)[1];
  let out={};
  if(q.dir==="cf"){
    const it=P.items[q.ii], fc=feat(it.c,P.kind);
    const byForm=new Map();
    P.items.forEach(x=>{ if(x.f===it.f) return;
      if(prep && prepConflict(x.c,it.c)) return;
      const d=dist(fc,feat(x.c,P.kind));
      if(!byForm.has(x.f)||byForm.get(x.f).d>d) byForm.set(x.f,{key:x.f,d});
    });
    const ds=pickNear([...byForm.values()],3).map(c=>c.key);
    const opts=shuffle([it.f,...ds]).map(f=>({v:f,label:f,html:esc(f)}));
    out={pre:prep?"":P.lemma, word:it.c, wordCls:prep?"":"code",
      ask: prep?"뜻은?":"알맞은 형태는?", opts, ans:it.f, ansTxt:it.f, optCls:prep?"small":"gkopt",
      tag:`${sec} · 형태 고르기`, revWord:prep?it.c:`${P.lemma.split(/[, /]/)[0]}  ${it.c}`, revSub:sec,
      fb:paraFb(P,it.f,[it.c],prep)};
  } else {
    const valid=P.items.filter(x=>x.f===q.form);
    if(!q.code){const given=valid.filter(x=>!x.d); q.code=given[Math.floor(Math.random()*given.length)].c;}
    const fc=feat(q.code,P.kind);
    const cands=P.items.filter(x=>x.f!==q.form && !(prep && valid.some(v=>prepConflict(v.c,x.c))))
      .map(x=>({key:x.c,d:dist(fc,feat(x.c,P.kind))}));
    const ds=pickNear(cands,3).map(c=>c.key);
    const opts=shuffle([q.code,...ds]).map(c=>({v:c,label:c,html:esc(c)}));
    out={pre:prep?"":P.lemma, word:q.form, wordCls:prep?"ko":"",
      ask: prep?"어떤 전치사 + 격일까요?":"이 형태의 분석으로 맞는 것은?", opts, ans:q.code, ansTxt:q.code,
      optCls:prep?"gkopt small":"", tag:`${sec} · 분석하기`, revWord:q.form, revSub:sec,
      fb:paraFb(P,q.form,valid.map(v=>v.c),prep)};
  }
  return out;
}
function paraFb(P,f,codes,prep){
  const all=P.items.filter(x=>x.f===f);
  const it=all.find(x=>codes.includes(x.c))||all[0];
  let h="";
  if(prep){
    h+=`<div class="entry">${esc(all.map(x=>x.c).join(" / "))}</div><div class="fbline">${esc(f)}</div><div class="fbline dim">발음: ${esc(it.p)} · ${esc(it.t)}</div>`;
    if(/함께/.test(f)) h+=`<div class="fbline dim">‘~과 함께’는 μετά + 속격 / σύν + 여격 / παρά + 여격</div>`;
  } else {
    h+=`<div class="entry">${esc(f)} <span class="fbline dim">(${esc(it.p)})</span></div>`;
    h+=`<div class="fbline">${all.map(x=>`${esc(x.c)} <span class="fbline dim">${decode(x.c,P.kind)}</span>`).join("<br>")}</div>`;
    const ts=[...new Set(all.map(x=>x.t).filter(Boolean))];
    if(ts.length) h+=`<div class="fbline">${ts.map(esc).join(" / ")}</div>`;
    if(all.length>1) h+=`<div class="fbline dim">같은 형태라서 위 분석이 모두 가능해요.</div>`;
  }
  h+=`<div class="mine">${esc(P.note)}</div>`;
  return h;
}

function chipRow(box, items, set, label, rerender){
  box.innerHTML="";
  const all=document.createElement("button");
  all.className="chip"; all.textContent="전체";
  all.setAttribute("aria-pressed", set.size===items.length);
  all.onclick=()=>{ if(set.size===items.length) set.clear(); else items.forEach(k=>set.add(k)); rerender(); };
  box.appendChild(all);
  items.forEach(k=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label(k);
    b.setAttribute("aria-pressed", set.has(k));
    b.onclick=()=>{ set.has(k)?set.delete(k):set.add(k); rerender(); };
    box.appendChild(b);
  });
}
function renderChips(){
  chipRow($("#lessonChips"), LESSONS, selLessons, l=>l+"과", renderChips);
  chipRow($("#secChips"), SECS.map(s=>s[0]), selSecs, k=>SECS.find(s=>s[0]===k)[1], renderChips);
  updateCount();
}
function updateCount(){
  const p=pool(), n=p.length, r=$("#countRange");
  const want=+r.dataset.want||20;
  r.max=Math.max(n,1); r.min=1; r.disabled=n===0;
  r.value=Math.max(1,Math.min(want,n));
  $("#countOut").textContent = n?r.value:0;
  const sel = tab==="v"?selLessons:selSecs;
  let detail;
  if(tab==="v"){const mc=p.filter(q=>q.type==="mc").length; detail=`객관식 ${mc} · 단답형 ${n-mc}`;}
  else {const cf=p.filter(q=>q.dir==="cf").length; detail=`형태 고르기 ${cf} · 분석하기 ${n-cf}`;}
  $("#availTxt").textContent = n ? `풀 수 있는 문제 ${n}개 (${detail})` : (sel.size? "이 범위에는 해당 유형 문제가 없어요. 유형이나 범위를 바꿔 보세요." : "범위를 하나 이상 골라 주세요.");
  $("#startBtn").disabled = n===0;
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  $("#panelV").classList.toggle("hidden",tab!=="v");
  $("#panelP").classList.toggle("hidden",tab!=="p");
  updateCount();
});
function segBind(sel, set){
  document.querySelectorAll(sel+" button").forEach(b=>b.onclick=()=>{
    set(b.dataset.t);
    document.querySelectorAll(sel+" button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    updateCount();
  });
}
segBind("#typeSeg", v=>selType=v);
segBind("#dirSeg", v=>selDir=v);
$("#countRange").oninput=e=>{e.target.dataset.want=e.target.value;$("#countOut").textContent=e.target.value};
$("#startBtn").onclick=()=>{start(shuffle(pool()).slice(0,+$("#countRange").value))};
$("#quitBtn").onclick=()=>finish();

function start(set){
  set.forEach(q=>{ if(q.src==="p" && q.dir==="fc") q.code=null; });
  lastSet=set.slice(); qs=shuffle(set); idx=0; log=[]; show("quiz"); render();
}

/* ---------- 문제 화면 ---------- */
function render(){
  const q0=qs[idx];
  const q = q0.src==="p" ? Object.assign({}, q0, buildParaQ(q0)) : q0;
  $("#progTxt").textContent=`${idx+1} / ${qs.length}`;
  $("#progBar").style.width=(idx/qs.length*100)+"%";
  const long = q.word.length>14 ? " long":"";
  let h=`<span class="tag">${q.tag}</span>`;
  if(q.pre) h+=`<div class="pre">${esc(q.pre)}</div>`;
  h+=`<div class="word${long} ${q.wordCls||""}">${esc(q.word)}</div>`;
  if(q.type==="mc"){
    const n=q.opts.length;
    h+=`<p class="ask">${q.ask}</p><div class="opts ${n===3?"cols3":"cols4"}">`;
    q.opts.forEach(o=>h+=`<button class="opt ${q.optCls||""}" data-v="${esc(o.v)}" aria-pressed="false">${o.html}</button>`);
    h+=`</div><div id="fb"></div><div class="actions"><button class="primary" id="actBtn" disabled>정답 제출</button></div>`;
    $("#card").innerHTML=h;
    let pick=null;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      pick=b.dataset.v;
      document.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));
      $("#actBtn").disabled=false;
    });
    $("#actBtn").onclick=()=>{
      const ok=pick===q.ans;
      document.querySelectorAll(".opt").forEach(b=>{
        b.disabled=true;
        if(b.dataset.v===q.ans) b.classList.add("right");
        else if(b.dataset.v===pick) b.classList.add("wrong");
      });
      const picked=q.opts.find(o=>o.v===pick);
      log.push({q, ok, mine:picked?picked.label:""});
      $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}"><div class="verdict">${ok?"정답이에요.":(q.src==="p"?"오답이에요. 정답: "+esc(q.ansTxt):"정답은 "+esc(q.ansTxt)+"예요.")}</div>${q.fb}</div>`;
      nextBtn();
    };
  } else {
    h+=`<p class="ask">뜻을 써 보세요</p><div class="sa"><input id="saIn" type="text" autocomplete="off" placeholder="뜻 입력 (비워 두고 확인해도 돼요)" aria-label="뜻 입력"></div><div id="fb"></div><div class="actions"><button class="primary" id="actBtn">확인</button></div>`;
    $("#card").innerHTML=h;
    const inp=$("#saIn"); inp.focus({preventScroll:true});
    inp.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();$("#actBtn").click()}};
    $("#actBtn").onclick=()=>{
      const mine=inp.value.trim(); inp.disabled=true;
      const hit = mine && matches(mine,q.ans);
      $("#fb").innerHTML=`<div class="feedback neutral"><div class="verdict">정답</div><div class="entry">${esc(q.word)}</div><div>${esc(q.ans)}</div>${posLine(q.pos)}<div class="mine">내 답: ${mine?esc(mine):"(비워 둠)"}</div>${hit?`<div class="match">입력한 답이 정답 중 하나와 일치해요.</div>`:""}<div class="selfgrade"><button class="y" id="yBtn">맞았어요</button><button class="n" id="nBtn">틀렸어요</button></div></div>`;
      $(".actions").remove();
      const grade=ok=>{log.push({q,ok,mine:mine||"(비워 둠)"}); advance()};
      $("#yBtn").onclick=()=>grade(true); $("#nBtn").onclick=()=>grade(false);
      (hit?$("#yBtn"):$("#nBtn")).focus({preventScroll:true});
    };
  }
}
function norm(s){return s.replace(/\(.*?\)/g,"").replace(/[\s~·.,!?'"‘’…-]/g,"")}
function matches(mine,ans){
  const m=norm(mine); if(!m) return false;
  const parts=ans.replace(/\+[속여대주격보어]+:?/g,"").replace(/디포,|중간,/g,"").split(/[,/]/).map(norm).filter(Boolean);
  return parts.some(p=>p===m||(m.length>=2&&p.includes(m)&&m.length>=p.length-1));
}
function nextBtn(){
  const a=$("#actBtn");
  a.textContent = idx===qs.length-1 ? "결과 보기" : "다음 문제";
  a.disabled=false; a.onclick=advance; a.focus({preventScroll:true});
}
function advance(){idx++; if(idx>=qs.length) finish(); else {render(); window.scrollTo(0,0)}}

/* ---------- 결과 ---------- */
function finish(){
  $("#progBar").style.width="100%";
  const total=log.length, right=log.filter(x=>x.ok).length;
  const pct= total? Math.round(right/total*100):0;
  const emo = !total?"📖": pct>=90?"🏆":pct>=70?"🎉":pct>=50?"💪":"📖";
  const msg = !total?"아직 푼 문제가 없어요.": pct>=90?"거의 다 외웠어요.":pct>=70?"잘하고 있어요. 틀린 문제만 한 번 더 보세요.":pct>=50?"절반은 넘었어요. 오답노트로 한 번 더 돌려 보세요.":"오답노트부터 천천히 다시 외워 봐요.";
  const wrong=log.filter(x=>!x.ok);
  let h=`<div class="result-head"><div class="emoji">${emo}</div><div class="score">${right}<span> / ${total}</span></div><p>${total?pct+"점 · ":""}${msg}</p></div>`;
  h+=`<div class="review"><h2>오답노트 ${wrong.length}개</h2>`;
  if(!wrong.length) h+=`<div class="empty">${total?"틀린 문제가 없어요.":"문제를 풀면 여기에 틀린 문제가 모여요."}</div>`;
  else {
    h+="<ol>";
    wrong.forEach(({q,mine})=>{
      if(q.src==="p"){
        h+=`<li><div class="q">${esc(q.revWord)}<small>${esc(q.revSub)}</small></div><div class="a">정답: ${esc(q.ansTxt)}</div><div class="m">내 답: ${esc(mine)}</div></li>`;
      } else {
        const ans = q.type==="mc"? q.ansTxt : q.ans;
        h+=`<li><div class="q">${esc(q.word)}<small>${esc(q.revSub)}${q.pos?" · "+esc(q.pos):""}</small></div><div class="a">정답: ${esc(ans)}</div>${q.revExtra?`<div class="m">${esc(q.revExtra)}</div>`:""}<div class="m">내 답: ${esc(mine)}</div></li>`;
      }
    });
    h+="</ol>";
  }
  h+=`</div><div class="btns">${wrong.length?`<button class="primary" id="rWrong">틀린 문제만 다시 풀기</button>`:""}<button class="ghost" id="rSame">같은 문제 다시 풀기</button><button class="ghost" id="rHome">처음으로</button></div>`;
  $("#result").innerHTML=h; show("result");
  const orig=q=>q.src==="p"?PBANK.find(x=>x.id===q.id):q;
  if(wrong.length) $("#rWrong").onclick=()=>start(wrong.map(x=>orig(x.q)));
  $("#rSame").onclick=()=>start(lastSet);
  $("#rHome").onclick=()=>{show("home"); updateCount()};
}

renderChips();
</script>
</body>
</html>
