<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경 모의고사</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'맑은 고딕',sans-serif; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height:100vh; color:#333; }
.container { max-width:760px; margin:0 auto; padding:16px; }
.card { background:white; border-radius:16px; padding:24px; box-shadow:0 8px 30px rgba(0,0,0,0.15); margin-bottom:16px; }
h1 { text-align:center; color:white; font-size:26px; margin:20px 0; text-shadow:0 2px 8px rgba(0,0,0,0.2); }
h2 { color:#5a3d8a; font-size:20px; margin-bottom:16px; }
.stat-row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:8px; }
.stat { background:#f0ecfb; border-radius:10px; padding:10px 16px; text-align:center; flex:1; min-width:80px; }
.stat .num { font-size:20px; font-weight:bold; color:#5a3d8a; }
.stat .lbl { font-size:12px; color:#888; }
.mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.mode-btn { background:#f7f5fc; border:2px solid #e0d8f0; border-radius:12px; padding:18px 12px; cursor:pointer; text-align:center; transition:all .2s; }
.mode-btn:hover { border-color:#764ba2; background:#f0ecfb; transform:translateY(-2px); }
.mode-btn.active { border-color:#764ba2; background:#764ba2; color:white; }
.mode-btn .icon { font-size:28px; margin-bottom:6px; }
.mode-btn .title { font-weight:bold; font-size:15px; }
.mode-btn .desc { font-size:11px; color:#999; margin-top:3px; }
.mode-btn.active .desc { color:#e0d8f0; }
label { display:block; margin:14px 0 6px; font-weight:bold; color:#555; font-size:14px; }
select, input { width:100%; padding:12px; border:2px solid #e0d8f0; border-radius:10px; font-size:15px; background:white; }
.count-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; }
.count-btn { padding:12px; border:2px solid #e0d8f0; border-radius:10px; background:white; cursor:pointer; font-weight:bold; transition:all .2s; }
.count-btn:hover { border-color:#764ba2; }
.count-btn.active { background:#764ba2; color:white; border-color:#764ba2; }
.qtype-toggle { display:flex; gap:10px; margin-top:8px; }
.qtype-btn { flex:1; padding:12px; border:2px solid #e0d8f0; border-radius:10px; background:white; cursor:pointer; font-weight:bold; text-align:center; transition:all .2s; font-size:14px; }
.qtype-btn.active { background:#764ba2; color:white; border-color:#764ba2; }
.btn-primary { width:100%; background:linear-gradient(135deg,#667eea,#764ba2); color:white; border:none; padding:16px; border-radius:12px; font-size:17px; font-weight:bold; cursor:pointer; margin-top:20px; transition:all .2s; }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(118,75,162,0.4); }
.progress-info { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:14px; color:#666; }
.timer { font-weight:bold; color:#764ba2; }
.pbar { background:#eee; border-radius:8px; height:8px; overflow:hidden; margin-bottom:20px; }
.pfill { background:linear-gradient(90deg,#667eea,#764ba2); height:100%; transition:width .3s; }
.q-meta { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.tag { font-size:12px; padding:3px 10px; border-radius:20px; font-weight:bold; }
.tag-ot { background:#e2efda; color:#548235; }
.tag-nt { background:#daeef3; color:#2e75b6; }
.tag-book { background:#f0ecfb; color:#5a3d8a; }
.tag-sa { background:#fff3cd; color:#856404; }
.q-text { font-size:17px; line-height:1.6; margin-bottom:20px; white-space:pre-wrap; }
.opt { display:block; width:100%; text-align:left; padding:15px; margin-bottom:10px; border:2px solid #e8e8e8; border-radius:12px; background:white; cursor:pointer; font-size:15px; transition:all .15s; }
.opt:hover { border-color:#764ba2; background:#faf8fe; }
.opt.selected { border-color:#764ba2; background:#f0ecfb; }
.opt .onum { display:inline-block; width:26px; height:26px; line-height:26px; text-align:center; background:#764ba2; color:white; border-radius:50%; margin-right:10px; font-size:13px; font-weight:bold; }
/* 주관식 */
.sa-answer-box { margin-top:10px; padding:20px; border-radius:12px; background:#f7f5fc; border:2px dashed #c5b3e8; text-align:center; }
.sa-answer-box .hidden-msg { color:#999; font-size:15px; }
.sa-answer-box .answer-text { font-size:24px; font-weight:bold; color:#28a745; }
.sa-answer-box .answer-label { font-size:13px; color:#888; margin-bottom:6px; }
.btn-reveal { width:100%; background:#fff3cd; color:#856404; border:2px solid #ffc107; padding:14px; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:10px; }
.btn-reveal:hover { background:#ffeaa0; }
.nav-row { display:flex; gap:10px; margin-top:16px; }
.btn-nav { flex:1; padding:14px; border:2px solid #764ba2; border-radius:12px; background:white; color:#764ba2; font-weight:bold; cursor:pointer; font-size:15px; }
.btn-nav:hover { background:#f0ecfb; }
.btn-nav.fill { background:#764ba2; color:white; }
.btn-nav:disabled { opacity:0.4; cursor:not-allowed; }
.result-score { text-align:center; padding:20px; }
.result-score .big { font-size:56px; font-weight:bold; color:#764ba2; }
.result-score .sub { font-size:16px; color:#888; margin-top:6px; }
.grade { display:inline-block; padding:8px 24px; border-radius:30px; font-size:20px; font-weight:bold; margin-top:12px; }
.review-item { padding:14px; border-radius:10px; margin-bottom:10px; border-left:4px solid #ccc; }
.review-item.ok { background:#f0faf2; border-left-color:#28a745; }
.review-item.no { background:#fdf0f1; border-left-color:#dc3545; }
.review-q { font-size:14px; margin-bottom:8px; font-weight:bold; }
.review-a { font-size:13px; color:#666; }
.review-a .yours { color:#dc3545; }
.review-a .right { color:#28a745; font-weight:bold; }
.hidden { display:none; }
.book-checks { max-height:240px; overflow-y:auto; border:2px solid #e0d8f0; border-radius:10px; padding:10px; margin-top:8px; }
.book-check { display:inline-flex; align-items:center; gap:5px; padding:6px 10px; margin:3px; background:#f7f5fc; border-radius:8px; cursor:pointer; font-size:13px; }
.book-check input { width:auto; }
.small-btn { padding:6px 12px; font-size:13px; border:1px solid #764ba2; background:white; color:#764ba2; border-radius:8px; cursor:pointer; margin-right:6px; }
.sa-done-btn { display:flex; gap:10px; margin-top:14px; }
.sa-mark { flex:1; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer; border:2px solid; font-size:14px; }
.sa-mark.know { background:#e8f7ec; color:#28a745; border-color:#28a745; }
.sa-mark.dunno { background:#fdeaec; color:#dc3545; border-color:#dc3545; }
</style>
</head>
<body>
<div class="container">
<h1>📖 성경 모의고사</h1>

<div id="setup">
  <div class="card">
    <div class="stat-row">
      <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">전체</div></div>
      <div class="stat"><div class="num" id="mcCount">0</div><div class="lbl">객관식</div></div>
      <div class="stat"><div class="num" id="saCount">0</div><div class="lbl">주관식</div></div>
    </div>
  </div>

  <div class="card">
    <h2>문제 유형</h2>
    <div class="qtype-toggle">
      <div class="qtype-btn active" data-qt="mc" onclick="selectQType('mc')">📝 객관식</div>
      <div class="qtype-btn" data-qt="sa" onclick="selectQType('sa')">✏️ 주관식</div>
    </div>
    <div style="font-size:12px;color:#999;margin-top:8px" id="qtHint">객관식: 4지선다, 자동 채점</div>
  </div>

  <div class="card">
    <h2>출제 방식</h2>
    <div class="mode-grid">
      <div class="mode-btn active" data-mode="random" onclick="selectMode('random')">
        <div class="icon">🎲</div><div class="title">랜덤 출제</div><div class="desc">전체에서 무작위</div>
      </div>
      <div class="mode-btn" data-mode="testament" onclick="selectMode('testament')">
        <div class="icon">📜</div><div class="title">구약/신약</div><div class="desc">구분해서 풀기</div>
      </div>
      <div class="mode-btn" data-mode="book" onclick="selectMode('book')">
        <div class="icon">📚</div><div class="title">책 선택</div><div class="desc">원하는 책만</div>
      </div>
      <div class="mode-btn" data-mode="all" onclick="selectMode('all')">
        <div class="icon">🔥</div><div class="title">전체 도전</div><div class="desc">전부 순서대로</div>
      </div>
    </div>

    <div id="testamentOpts" class="hidden">
      <label>구약/신약 선택</label>
      <select id="testamentSel"><option value="구약">구약</option><option value="신약">신약</option></select>
    </div>

    <div id="bookOpts" class="hidden">
      <label>책 선택 <button class="small-btn" onclick="checkAllBooks(true)">전체</button><button class="small-btn" onclick="checkAllBooks(false)">해제</button></label>
      <div class="book-checks" id="bookChecks"></div>
    </div>

    <div id="countSection">
      <label>문제 수</label>
      <div class="count-grid">
        <div class="count-btn" onclick="selectCount(10,this)">10</div>
        <div class="count-btn active" onclick="selectCount(20,this)">20</div>
        <div class="count-btn" onclick="selectCount(30,this)">30</div>
        <div class="count-btn" onclick="selectCount(50,this)">50</div>
      </div>
      <label style="margin-top:12px">직접 입력</label>
      <input type="number" id="customCount" placeholder="예: 100" min="1" oninput="customCountInput()">
    </div>

    <button class="btn-primary" onclick="startQuiz()">시험 시작 ▶</button>
  </div>
</div>

<div id="quiz" class="hidden">
  <div class="card">
    <div class="progress-info">
      <span id="qProgress">1 / 20</span>
      <span class="timer" id="timer">00:00</span>
    </div>
    <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
    <div class="q-meta" id="qMeta"></div>
    <div class="q-text" id="qText"></div>
    <div id="qOptions"></div>
    <div id="saArea" class="hidden"></div>
    <div class="nav-row">
      <button class="btn-nav" id="prevBtn" onclick="prevQ()">◀ 이전</button>
      <button class="btn-nav fill" id="nextBtn" onclick="nextQ()">다음 ▶</button>
    </div>
  </div>
</div>

<div id="result" class="hidden">
  <div class="card">
    <div class="result-score">
      <div class="big" id="scoreBig">0</div>
      <div class="sub" id="scoreSub"></div>
      <div id="gradeBadge"></div>
      <div class="sub" id="timeSpent" style="margin-top:10px"></div>
    </div>
    <button class="btn-primary" onclick="location.reload()">🔄 다시 풀기</button>
  </div>
  <div class="card">
    <h2 id="reviewTitle">오답 노트</h2>
    <div id="reviewList"></div>
  </div>
</div>

</div>

<script>
const MC = [{"n":1,"src":"창5","book":"창세기","q":"다음의 하나님과 관련된 명칭들 가운데 창세기에 언급되지 않는 것은?","o":["엘 엘로헤 이스라엘","전능한 하나님","만군의 여호와","지극히 높으신 하나님"],"a":"3","t":"구약","type":"mc"},{"n":2,"src":"창6","book":"창세기","q":"다음 중 노아 때의 홍수 사건에 대한 설명들 가운데 틀린 것은?","o":["노아가 600세 되던 해, 둘째 달 17일에 홍수가 시작되었다.","노아가 방주에 들어간 지 3일 후에 홍수가 땅에 덮였고, 40주야를 비가 내렸다","일곱째 달 17일에 방주가 아라랏 산에 머물렀다.","물은 150일을 땅에 넘쳤다."],"a":"2","t":"구약","type":"mc"},{"n":3,"src":"창7","book":"창세기","q":"\"여호와께서 아브람에게 이르시되 너는 너의 고향과 친척과 아버지의 집을 떠나 내가 네게 보여 줄 땅으로 가라 내가 너로 (  )을/를 이루고 네게 복을 주어 네 (  )을/를 창대하게 하리니 너는 복이 될지라 너를 축복하는 자에게는 내가 복을 내리고 너를 저주하는 자에게는 저주하리니 땅의 (  )이/가 너로 말미암아 복을 얻을 것이라 하신지라\"(창 12:1~3)에서 괄호 안에 들어갈 낱말들로 옳게 짝지어진 것은?","o":["큰 민족, 이름, 모든 족속","큰 나라, 이름, 모든 왕","큰 민족, 자손, 모든 나라","큰 나라, 자손, 모든 방백"],"a":"1","t":"구약","type":"mc"},{"n":4,"src":"창8","book":"창세기","q":"다음 구절들을 구약성경의 본문 순서대로 바르게 배열한 것은?(창12:10, 13:9, 14:14, 15:17) a. 네 앞에 온 땅이 있지 아니하냐 나를 떠나가라 네가 좌하면 나는 우하고 네가 우하면 나는 좌하리라 b. 그 땅에 기근이 들었으므로 아브람이 애굽에 거류하려고 그리로 내려갔으니 이는 그땅에 기근이 심하였음이라 c. 아브람이 그의 조카가 사로잡혔음을 듣고 집에서 길리고 훈련된 자 삼백십팔 명을 거느리고 단까지 쫓아가서 d. 해가 져서 어두울 때에 연기 나는 화로가 보이며 타는 횃불이 쪼갠 고기 사이로 지나더라","o":["c-b-a-d","a-c-b-d","b-a-c-d","c-a-b-d"],"a":"3","t":"구약","type":"mc"},{"n":5,"src":"창10","book":"창세기","q":"아브람의 자손이 이방에서 객이 되어 사대만에 약속의 땅으로 돌아오게 되는 까닭은?","o":["아모리 족속의 죄악이 아직 가득차지 아니하여","이스라엘 자손이 하나님께 불순종하여","가나안 족속이 땅을 차지하고 있어서","애굽이 이스라엘을 놓아 주지 않아서"],"a":"1","t":"구약","type":"mc"},{"n":6,"src":"창12","book":"창세기","q":"다음의 문장은 아브라함이 소돔을 위하여 여호와께 간구할 때 했던 말들 가운데 하나이다. 아래의 문장은 여호와께서 의인 몇 명을 찾았을 경우에 그 곳을 용서하시겠다고 말씀하신 후에 아브라함이 자신에 대하여 언급했던 표현들인가? \"아브라함이 대답하여 이르되 나는 티끌이나 재와 같사오나 감히 주께 아뢰나이다.\"(창 18장)","o":["40명","50명","45명","30명"],"a":"2","t":"구약","type":"mc"},{"n":7,"src":"창13","book":"창세기","q":"모압과 암몬의 조상은 누구인가?","o":["롯","이스마엘","에서","하란"],"a":"1","t":"구약","type":"mc"},{"n":8,"src":"창14","book":"창세기","q":"막벨라, 기럇아르바, 마므레와 관련 있는 곳은?","o":["벧엘","헤브론","아이","여리고"],"a":"2","t":"구약","type":"mc"},{"n":9,"src":"창17","book":"창세기","q":"야곱이 벧엘에서 하나님을 만나는 사건을 본문에서 나타난 순서대로 ":["다른 민족보다 수효가 많음","사랑하심","능력과 가능성이 있음","순종함"],"a":"2","t":"구약","type":"mc"},{"n":252,"src":"신11","book":"신명기","q":"\"너희(네) 하나님 여호와께서 자기 이름을 위하여 택하신(택하실)곳\"이라는 표현이 3회 이상 반복적으로 사용된 본문은 신명기 몇 장인가?","o":["5장","10장","12장","24장"],"a":"3","t":"구약","type":"mc"},{"n":253,"src":"신14","book":"신명기","q":"다음은 이스라엘 자손이 여호와 하나님의 제단 앞에 토지소산의 맏물을 드리며 아뢰는 말씀 가운데 한 부분이다. 그들이 자신의 조상에 관하여 언급한 표현으로서 괄호 안에 들어갈 말은 무엇인가? \"내 조상은 (  )사람으로서 애굽에 내려가서 거기에서 소수로 거류하였더니 거기에서 크고 강하고 번성한 민족이 되었는데…\"","o":["유리하는 히브리","방랑하는 아람","이주하던 아모리","유목하던 이스라엘"],"a":"2","t":"구약","type":"mc"},{"n":254,"src":"신16","book":"신명기","q":"신명기 31장 10-11절에서는 모세가 기록한 율법을 언제 이스라엘 자손들에게 낭독하여 듣게 하라고 명령하였습니까?","o":["면제년의 초막절","매 안식일","매 삼년 마지막 해","매년 절기들"],"a":"1","t":"구약","type":"mc"},{"n":255,"src":"신18","book":"신명기","q":"신명기 32장 17절에는 이스라엘 자손의 죄를 묘사한 내용 중 일부가 기록되어 있다. 본문에서는 그들이 하나님께 제사하지 않고 누구에게 제사하였다고 기록하였는가? \"그들은 하나님께 제사하지 아니하고 (  )에게 하였으니 곧 그들이 알지 못하던 신들, 근래에 들어온 새로운 신들, 너희의 조상들이 두려워하지 아니하던 것들이로다\"","o":["사탄","하늘의 천군과 천사","조상들","귀신들"],"a":"4","t":"구약","type":"mc"},{"n":256,"src":"신22","book":"신명기","q":"다음은 신명기 18장 15절이다. 괄호 안에 들어갈 알맞은 말을 찾으시오. \"네 하나님 여호와께서 너희 가운데 네 형제 중에서 너를 위하여 (  )하나를 일으키시리니 너희는 그의 말을 들을지니라\"","o":["하나님의 사람","여호와의 종","나와 같은 선지자","기름부음 받은 종"],"a":"3","t":"구약","type":"mc"},{"n":257,"src":"신23","book":"신명기","q":"이스라엘 자손이 적군과 싸우려 할 때에 싸울 곳에 가까이 가면 신명기 20장 3-4절에 기록된 다음과 같은 말을 백성에게 나아가 고해야 하는 사람은 누구인가(20:2)? \"이스라엘아 들으라 너희가 오늘 너희의 대적과 싸우려고 나아왔으니 마음에 겁내지 말며 두려워하지 말며 떨지 말며 그들로 말미암아 놀라지 말라 너희 하나님 여호와는 너희와 함께 행하시며 너희를 위하여 너희 적군과 싸우시고 구원하실 것이라\"","o":["왕","군대의 지휘관","제사장","대제사장"],"a":"3","t":"구약","type":"mc"},{"n":258,"src":"신28","book":"신명기","q":"다음은 신명기 33장 2절 본문 가운데 일부분이다. 괄호 안에 들어갈 알맞은 지명이 순서대로 바르게 짝지어진 것은? \"…여호와께서 (  )에서 오시고 (  )에서 일어나시고 (  )에서 비추시고 일만 성도 가운데에 강림하셨고, 그의 오른손에는 그들을 위해 번쩍이는 불이 있도다\"","o":["시내산-바란산-헐몬산","호렙산-비스가산-에돔산","시내산-세일산-바란산","호렙산-세일산-호르산"],"a":"3","t":"구약","type":"mc"},{"n":259,"src":"신29","book":"신명기","q":"다음은 신명기 33장에 기록된 모세의 마지막 축복들 가운데 요셉 지파와 관련된 본문입니다. 괄호 안에 들어갈 알맞은 말은 무엇인가? \"…땅의 let qtype='mc', mode='random', count=20, quiz=[], answers=[], revealed=[], cur=0, startTime, timerInt;

function activeData(){ return qtype==='mc' ? MC : SA; }

document.getElementById('totalCount').textContent=(MC.length+SA.length).toLocaleString();
document.getElementById('mcCount').textContent=MC.length.toLocaleString();
document.getElementById('saCount').textContent=SA.length.toLocaleString();

function buildBookChecks(){
  const data=activeData();
  const bookList=[];
  data.forEach(q=>{ if(!bookList.includes(q.book)) bookList.push(q.book); });
  const el=document.getElementById('bookChecks');
  el.innerHTML='';
  bookList.forEach(b=>{
    const cnt=data.filter(q=>q.book===b).length;
    const lbl=document.createElement('label');
    lbl.className='book-check';
    lbl.innerHTML=`<input type="checkbox" value="${b}" checked> ${b}(${cnt})`;
    el.appendChild(lbl);
  });
}
buildBookChecks();

function selectQType(t){
  qtype=t;
  document.querySelectorAll('.qtype-btn').forEach(b=>b.classList.toggle('active',b.dataset.qt===t));
  document.getElementById('qtHint').textContent = t==='mc'?'객관식: 4지선다, 자동 채점':'주관식: 문제 보고 정답 확인 (스스로 채점)';
  buildBookChecks();
}
function selectMode(m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  document.getElementById('testamentOpts').classList.toggle('hidden',m!=='testament');
  document.getElementById('bookOpts').classList.toggle('hidden',m!=='book');
  document.getElementById('countSection').classList.toggle('hidden',m==='all');
}
function selectCount(c,el){
  count=c;
  document.querySelectorAll('.count-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('customCount').value='';
}
function customCountInput(){
  const v=parseInt(document.getElementById('customCount').value);
  if(v>0){ count=v; document.querySelectorAll('.count-btn').forEach(b=>b.classList.remove('active')); }
}
function checkAllBooks(s){ document.querySelectorAll('#bookChecks input').forEach(c=>c.checked=s); }

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startQuiz(){
  const data=activeData();
  let pool=[];
  if(mode==='random'){ pool=shuffle(data).slice(0,count); }
  else if(mode==='testament'){ const t=document.getElementById('testamentSel').value; pool=shuffle(data.filter(q=>q.t===t)).slice(0,count); }
  else if(mode==='book'){
    const checked=[...document.querySelectorAll('#bookChecks input:checked')].map(c=>c.value);
    if(checked.length===0){ alert('책을 하나 이상 선택하세요'); return; }
    pool=shuffle(data.filter(q=>checked.includes(q.book))).slice(0,count);
  }
  else if(mode==='all'){ pool=shuffle(data); }

  if(pool.length===0){ alert('조건에 맞는 문제가 없습니다'); return; }
  quiz=pool; answers=new Array(quiz.length).fill(null); revealed=new Array(quiz.length).fill(false); cur=0;
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  startTime=Date.now();
  timerInt=setInterval(updateTimer,1000);
  renderQ();
}

function updateTimer(){
  const s=Math.floor((Date.now()-startTime)/1000);
  document.getElementById('timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function renderQ(){
  const q=quiz[cur];
  document.getElementById('qProgress').textContent=`${cur+1} / ${quiz.length}`;
  document.getElementById('pfill').style.width=`${((cur+1)/quiz.length)*100}%`;
  let meta = qtype==='sa' ? `<span class="tag tag-sa">주관식</span>` : '';
  document.getElementById('qMeta').innerHTML=meta;
  document.getElementById('qText').textContent=q.q;

  const optsEl=document.getElementById('qOptions');
  const saEl=document.getElementById('saArea');

  if(qtype==='mc'){
    optsEl.classList.remove('hidden');
    saEl.classList.add('hidden');
    optsEl.innerHTML='';
    q.o.forEach((opt,i)=>{
      if(opt==='') return;
      const btn=document.createElement('button');
      btn.className='opt';
      if(answers[cur]===i+1) btn.classList.add('selected');
      btn.innerHTML=`<span class="onum">${i+1}</span>${opt}`;
      btn.onclick=()=>{ answers[cur]=i+1; renderQ(); };
      optsEl.appendChild(btn);
    });
  } else {
    optsEl.classList.add('hidden');
    saEl.classList.remove('hidden');
    if(revealed[cur]){
      saEl.innerHTML=`<div class="sa-answer-box">
        <div class="answer-label">정답</div>
        <div class="answer-text">${q.a}</div>
      </div>
      <div class="sa-done-btn">
        <button class="sa-mark know" onclick="markSA(true)">⭕ 맞았어요</button>
        <button class="sa-mark dunno" onclick="markSA(false)">❌ 틀렸어요</button>
      </div>`;
      // 표시: 이미 채점한 경우
      if(answers[cur]===true) saEl.querySelector('.know').style.outline='3px solid #28a745';
      if(answers[cur]===false) saEl.querySelector('.dunno').style.outline='3px solid #dc3545';
    } else {
      saEl.innerHTML=`<button class="btn-reveal" onclick="revealSA()">👁 정답 확인하기</button>`;
    }
  }
  document.getElementById('prevBtn').disabled=cur===0;
  document.getElementById('nextBtn').textContent=cur===quiz.length-1?'제출 ✓':'다음 ▶';
}

function revealSA(){ revealed[cur]=true; renderQ(); }
function markSA(ok){ answers[cur]=ok; renderQ(); }

function prevQ(){ if(cur>0){cur--;renderQ();} }
function nextQ(){ if(cur<quiz.length-1){cur++;renderQ();} else finishQuiz(); }

function finishQuiz(){
  clearInterval(timerInt);
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  const s=Math.floor((Date.now()-startTime)/1000);
  document.getElementById('timeSpent').textContent=`소요 시간: ${Math.floor(s/60)}분 ${s%60}초`;

  if(qtype==='mc'){
    let correct=0;
    quiz.forEach((q,i)=>{ if(String(answers[i])===String(q.a)) correct++; });
    const pct=Math.round((correct/quiz.length)*100);
    document.getElementById('scoreBig').textContent=pct+'점';
    document.getElementById('scoreSub').textContent=`${correct} / ${quiz.length} 정답`;
    let grade,color;
    if(pct>=90){grade='우수 🏆';color='#28a745';}
    else if(pct>=70){grade='양호 👍';color='#2e75b6';}
    else if(pct>=50){grade='보통 📖';color='#fd7e14';}
    else{grade='분발 💪';color='#dc3545';}
    document.getElementById('gradeBadge').innerHTML=`<div class="grade" style="background:${color}22;color:${color}">${grade}</div>`;
    document.getElementById('reviewTitle').textContent='오답 노트';
    const rl=document.getElementById('reviewList'); rl.innerHTML='';
    let hasWrong=false;
    quiz.forEach((q,i)=>{
      if(String(answers[i])===String(q.a)) return;
      hasWrong=true;
      const yourAns=answers[i]?`${answers[i]}. ${q.o[answers[i]-1]}`:'(무응답)';
      const rightAns=`${q.a}. ${q.o[parseInt(q.a)-1]||q.a}`;
      const div=document.createElement('div'); div.className='review-item no';
      div.innerHTML=`<div class="review-q">[${q.book}] ${q.q}</div><div class="review-a">내 답: <span class="yours">${yourAns}</span> → 정답: <span class="right">${rightAns}</span></div>`;
      rl.appendChild(div);
    });
    if(!hasWrong) rl.innerHTML='<div class="review-item ok"><div class="review-q">🎉 모든 문제를 맞혔습니다!</div></div>';
  } else {
    // 주관식: 스스로 채점한 결과
    let know=quiz.filter((q,i)=>answers[i]===true).length;
    let dunno=quiz.filter((q,i)=>answers[i]===false).length;
    let skip=quiz.filter((q,i)=>answers[i]===null).length;
    const graded=know+dunno;
    const pct=graded>0?Math.round((know/graded)*100):0;
    document.getElementById('scoreBig').textContent=pct+'점';
    document.getElementById('scoreSub').textContent=`맞음 ${know} · 틀림 ${dunno}${skip>0?' · 미채점 '+skip:''}`;
    let color=pct>=70?'#28a745':pct>=50?'#fd7e14':'#dc3545';
    document.getElementById('gradeBadge').innerHTML=`<div class="grade" style="background:${color}22;color:${color}">스스로 채점</div>`;
    document.getElementById('reviewTitle').textContent='전체 문제 & 정답';
    const rl=document.getElementById('reviewList'); rl.innerHTML='';
    quiz.forEach((q,i)=>{
      const ok=answers[i]===true;
      const div=document.createElement('div');
      div.className='review-item '+(answers[i]===false?'no':'ok');
      div.innerHTML=`<div class="review-q">[${q.book}] ${q.q}</div><div class="review-a">정답: <span class="right">${q.a}</span></div>`;
      rl.appendChild(div);
    });
  }
}
</script>
