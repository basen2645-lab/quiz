제사를 반복하는 것이 아니며, 그리스도의 제사는 모든 사람을 위해 단번에 치러졌으며, 미사는 신자들의 사귐이므로 사제 혼자만 참석하는 죽은 자들을 위한 미사는 없애야 한다고 주장했다."],"answer":1},{"id":213,"type":"mc","question":"금식일을 폐지하고 대성당에서 성상을 제거했고 벽들을 하얗게 칠하고 오르간을 폐쇄한 개혁자는?","choices":["루터","츠빙글리","칼빈","뮌처"],"answer":2},{"id":214,"type":"mc","question":"영국의 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["헨리 8세는 왕을 수장으로 하는 독립된 영국 국교회를 세웠다.","헨리 8세는 성경을 영어로 번역하여 모든 교회에 영어 성경을 사용하도록 명령했다.","에드워드 6세때에는 전례를 영어로 번역하여 공동기도서가 출판되었다.","영국의 종교개혁은 철저하게 루터교쪽으로 진행되었다."],"answer":4},{"id":215,"type":"mc","question":"가톨릭 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세오.","choices":["트렌트 공의회는 전승과 성경을 나란히 두었으며, 불가타 역본을 유일하게 권위 있는 역본으로 선포했다.","트렌트 공의회는 신자가 축적된 공로를 통해 자신의 구원에 협력할 수 있다고 정의했고, 연옥 교리를 그대로 두었다.","트렌트 공의회는 에라스무스의 정신을 이어 인문주의자들을 성경 번역에 활용하였다.","1540년 예수회는 교황의 승인을 받았고, 유럽을 이단으로부터 되찾고 신세계를 개종시키기 위한 교황청의 “군대”가 되었고, 혁명, 심지어 종교적 목적 하의 군주 살해까지 정당화했다."],"answer":3},{"id":216,"type":"mc","question":"신앙고백 시대에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["1555년 아우그스부르크 평화회의가 열려 영토 원칙에 따라 루터교를 승인하였다. 이로써 “하나의 제국에, 하나의 종교”라는 큰 틀이 무너졌다.","가톨릭과 프로테스탄트 진영의 투쟁은 온건파 숙청으로 이어졌다.","1648년 베스트팔렌 조약은 영토 원칙에서 벗어나 개인의 신앙 자유를 인정했다.","프로테스탄트 교도들도 재세례파를 물에 빠뜨려 죽였고 반삼위일체주의자를 참수와 화형으로 처단했다."],"answer":3},{"id":217,"type":"mc","question":"다음은 영국 종교개혁의 진행과정에 일어난 사건들입니다. 이 사건들을 일어난 순서대로 배열한 것의 번호를 고르세요. \n\n가) 엘리자베드 여왕의 일치령\n나) 로드의 청교도 탄압\n다) 헨리 8세의 수장령\n라) 명예혁명과 관용령\n마) 웨스트민스터 개혁 의회\n바) 크롬웰의 독재\n사) 메리 여왕의 개신교 박해","choices":["다-나-마-가-바-사-라","다-사-나-가-바-마-라","다-사-가-나-마-바-라","다-사-나-마-바-가-라"],"answer":3},{"id":218,"type":"mc","question":"유럽 각국의 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["프랑스에서는 수많은 전쟁과 학살 후에 1598년 낭트 칙령으로 위그노는 특정 도시들에서 자유롭게 예배하도록 허락받았으며, 위그노들은 공직에 오를 자유도 있었다.","낙스는 1560년에 스코틀랜드 의회가 칼빈주의를 채택하도록 했으며, 장로교는 스코틀랜드의 국교가 되었다.","네덜란드에서는 윌리엄이 스페인의 압제에 대해 반란군을 일으키고 북부 지방을 차지하여 1581년 독립을 선포하였으며, 가톨릭 교도들, 루터교도들, 칼빈주의자들, 심지어 메노파에게까지 신앙의 자유를 허용했다.","영국 국교회는 국민들에게 하나의 믿음을 강조했지만, 예배와 교회 정치는 자유롭게 선택할 수 있도록 인정했다."],"answer":4},{"id":219,"type":"mc","question":"영국 청교도의 여러 분파에 대한 설명입니다. 틀린 것울 하나 고르세요","choices":["장로파는 주교제와 공동기도서를 배척하고 정치적인 면에서 입헌군주제를 선호했다.","독립파의 교회조직은 회중제였고, 지교회 위에는 주교도, 총회도, 노회도 없었으므로, 권징과 출교는 거의 강조되지 않았다.","침례파는 네덜란드에서 메노파와 접촉하면서 유아세례가 자신들의 교회관과 일치되지 않는다고 확신했다.","친우회(퀘이커교)는 성령이 문자를 초월하신다고 하여 성령을 강조했다."],"answer":2},{"id":220,"type":"mc","question":"프랑스 종교개혁에 대한 진술입니다. 틀린 것을 골라 번호를 쓰세요.","choices":["개신교 사상은 하층민을 중심으로 전파되어 프랑스 귀족 사회에 큰 물의를 일으켰다.","성 바돌로매 축일에 파리와 대도시에서 수천 명의 위그노가 학살되었다.","1598년 낭트 칙령은 위그노가 프랑스 전역에서 자유롭게 예배하도록 허락했다.","1685년 낭트 칙령이 폐지되자 위그노는 복종이나 추방을 선택하도록 강요되었다."],"answer":3},{"id":221,"type":"mc","question":"신앙고백 시대의 예배, 성례, 목회, 영성에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["엘리자베스 여왕은 주교제, 왕의 수장권, 공동기도서를 의무적으로 받아들이도록 했다","1633년 캔터베리 대주교로 임명된 윌리엄 로드는 교리에는 자유가, 정치 조직과 전례에는 일치가 있어야 한다고 믿었다.","메이플라워 계약에 따르면 모든 성도가 교회의 회원이 될 수 있었으며, 공직에 오르고 고위직 선출에 투표할 수 있었다.","친우회의 창시자 폭스는 전례도 성례도 음악도 성소도 모두 없애자고 주장했다."],"answer":3},{"id":222,"type":"mc","question":"청교도들에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["신대륙에 정착한 청교도들(순례조부들)은 영토 원칙을 폐기하고 관용과 신앙의 자유를 인정했다.","청교도는 초기 칼빈파처럼 자본주의의 성장에 기여했다는 평가를 받았다. 그들은 근면, 성실, 검소, 정직으로 번영했고, 약속을 반드시 지켰기 때문에 자본주의 발전에 기여했다.","삼림이 개간되고 공유지를 사유화하여 가난이 극심했을 때 청교도 평신도들은 구호금을 전달하고 빈민을 교육하고 사회에 복귀하는데 앞장섰다.","하나님께 서로 헌신하는 것이 부부의 덕목이 되었기 때문에 결혼은 하나의 이상을 실현하기 위한 동역 관계가 되었다."],"answer":1},{"id":223,"type":"mc","question":"18세기에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["계몽사상은 신앙고백주의에 대한 반동이었다.","18세기에는 상대적으로 평화로운 시대였고 전쟁을 비판하는 문학이 성행하고 평화를 위한 계획이 수립되었다.","계몽사상은 미신 추방운동으로 마녀 사냥을 종식시켰고, 자연법과 인류에 대한 이상은 민주주의의 토대가 되었고 자유, 평등, 박애의 구호는 농노 해방과 노예 해방에 기여했다.","부흥운동은 철저히 계몽사상과 대립적으로 이해할 수 있다."],"answer":4},{"id":224,"type":"mc","question":"18세기 부흥운동에 대한 서술입니다. 틀린 것을 하나 고르세오.","choices":["부흥운동은 부분적으로는 계몽주의의 건조한 사색과 이완된 윤리에 대한 반작용으로, 그리고 프로테스탄트 신스콜라주의라는 정직된 보수주의에 대한 반작용으로 일어났다.","경건주의는 독일 민족주의에 기여했고, 낭만주의자들은 경건주의 전통에서 자라났다.","웨슬리는 영국 국교회에서 감리교회를 독립시켜 새로운 교회를 세웠다.","부흥운동은 신앙고백시대 이전의 체험적 종교의 뿌리로 돌아갔다."],"answer":3},{"id":225,"type":"mc","question":"이신론에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["이신론은 인격적 하나님, 역사를 통해서 자신을 나타내시고 인간사에 관심을 가진 하나님과 함께, 천체를 운행하고 별들이 조화롭게 돌 수 있도록 배려한 우주의 조물주로서의 하나님을 강조했다.","이신론자들은 스스로를 그리스도인으로 여겼으며, 유신론과 무신론과는 구분된다.","프랑스 이신론자들은 공공연히 가톨릭교회를 비판했지만 영국의 이신론은 온건하고 소심했다.","이신론의 목적은 미신을 추방하고 이를 합리적 신앙으로 대체하여 사람이 공허한 피조물로 전락하지 않도록 하려는 것이었다."],"answer":1},{"id":226,"type":"mc","question":"계몽사상가에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["라이프니츠는 하나님의 작품인 자연을 통해 하나님의 정신을 알 수 있다고 주장했다.","볼테르는 현재 이 세계는 가능한 세계 중에서 최고의 세계라고 생각했지만 리스본 지진 후 이 세계에 대한 풍자로 《캉디드》를 저술했다.","라이마루스는 부활은 속임수이며 따라서 기독교는 사기에 의해 출발했다고 이해했다.","존 로크는 정신은 생득적 개념은 없고 경험으로부터 출발해서 진리를 탐구해야 한다고 강조했다."],"answer":1},{"id":227,"type":"mc","question":"18세기 부흥운동 지도자에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["진젠도르프의 신앙은 계층과 신조를 초월했으며, 모라비아에서 온 후스파 난민들이나 슐레지엔에서 온 슈벤크펠트파를 받아들이고 심지어 프랑스인 가톨릭 추기경과도 친하게 지냈다.","웨슬리는 강단에 설 권리를 박탈당하자, 말을 타고 촌락과 광산을 찾아다니며 야외 설교를 했다.","웨슬리는 가난한 자를 알았으며, 가난한 자들을 회심시켜 프롤레타리아들을 복음의 범주 안으로 끌어들였다.","뉴잉글랜드의 조나단 에드워즈는 신비주의자들의 전승을 이어받은 체험적 그리스도인으로 계몽사상을 철저히 배격하고 기독교 신앙과 계몽주의를 대립시켰다."],"answer":4},{"id":228,"type":"mc","question":"18세기 부흥운동에 나타난 영성과 경건에 대한 진술입니다. 틀린 것을 하나 고르시오.","choices":["경건주의의 기원은 중세 말 에크하르트와 타울러로 거슬러 올라가지만, 좀 더 직접적인 선구자는 카스파르 슈벤크펠트였다.","아우구스트 프랑케의 경건은 중세의 그리스도 수난 숭배를 당시의 언어로 표현한 것으로 생각될 수 있고, 서정시인으로 회중 찬송에 새로운 자극을 주었다.","웨슬리는 모라비아 교도들에게 감명을 받고 런던에서 모라비아 교도 예배에 참여하다가 멜란히톤의 『로마서 주석』에 실린 루터의 서문이 낭독되는 것을 듣고 신생(新生)을 체험했다.","조나단 에드워즈는 하나님은 진노의 하나님이시며, 하나님은 패역한 인간을 지옥불에 던져 넣을 충분한 이유가 있지만 참으시고 인간들에게 또 한 번의 기회를 주신다고 설교했다."],"answer":2},{"id":229,"type":"mc","question":"19세기 해외 선교에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["가톨릭 선교의 쇠퇴는 스페인과 포르투갈 식민지 제국들의 약화에, 개신교 선교의 성장은 영국과 네덜란드의 대대적인 식민지 개척과 관련된다.","가톨릭 선교사들은 공동체성을 강조했고, 개신교 선교사들은 개인의 회심을 강조했다.","개신교 선교는 성경 번역을 강조했고, 현지 문학, 연극, 음악, 건축을 배우고 보전하려고 했으며 수많은 방언에 문자를 만들어 주었다.","선교사들은 식민지 정부에 대해 비판적이었고, 어느 형태로든 협력을 거절했다."],"answer":4},{"id":230,"type":"mc","question":"근현대 교회와 국가에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["스코틀랜드에서는 장로교회가 국교였는데, 교회를 국가의 통제로부터 해방시키기 위해 1843년 토마스 찰머스를 중심으로 자유교회를 세웠다.","러시아에서는 공산주의 혁명 전까지 교회가 국가에 대해서 상당한 독립성을 유지할 수 있었다.","이탈리아에서는 교회가 교회령을 잃을까 염려하여 통일을 반대하였고 1929년 정교협약에 의해 바티칸에 대한 정치적 주권을 되찾았지만, 성직자 급여는 국가에 의해 지불되어 국가의 통제를 받았다.","히틀러가 28개 개신교 지역 교회들을 묶어 하나의 국가교회를 결성한 직후부터 4천 명의 개신교 목사는 고백교회를 결성하고 1934년 바르멘 선언을 통해 총통이 하나님 말씀 위에 설 수 없다고 선언했다."],"answer":2},{"id":231,"type":"mc","question":"20세기 미국의 교회와 국가의 관계에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["미국에선 식민지 시대에 다양한 교단들이 각기 자기들의 지역을 중심으로 국교회 역할을 했다.","정치 판도의 변화, 새로운 이민, 무역과 공동 방위의 필요로 인해 국교회 체제가 약화되었고 다른 교파들이 관용되었으며, 교단 간의 차이도 줄어들었다.","미국의 헌법 제정자들은 국가가 초자연적 질서에 속한다는 것을 강조했으며, 어떠한 교파도 연방의 국교회가 되지 못하도록 정했다.","교회와 국가의 분리는 1830년대에 완료되었고, 그 뒤 미국에서는 교회와 분파의 구분이 사라졌고, 미국의 교회들은 교단이라 불린다."],"answer":3},{"id":232,"type":"mc","question":"종교는 그리스도 안에 계시된 하나님에 대한 절대 의존감으로 이루어진다고 주장하고 도움을 받으려면 통회와 자백으로 자신의 상태와 철저한 의존감을 인정해야 한다고 주장하여 당시 세속화된 지식인들에게 낭만주의자들의 언어로 루터의 신학을 전했다고 평가되는 자는?","choices":["쉴라이에르마하","프리드리히 슈트라우스","칼 바르트","루돌프 불트만"],"answer":1},{"id":233,"type":"mc","question":"종교를 현대의 지식과 사상과 조화시키기 위해 노력했던 30세기 신학자들에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["칼 바르트는 제1차 세계대전을 계기로 자유주의 신학을 비판하고 계시, 즉 하나님의 자기 현시에 대한 신앙을 회복시켰다.","테아르 드 샤르댕은 투쟁보다는 사랑의 생명의 법칙이며, 진화 과정이 육체의 차원을 초월하는 더 고상한 삶의 형태를 향해 솟아나며, 우주 자체를 일종의 성사, 즉 보이지 않은 은혜의 보이는 상징으로 해석하여 과학과 신앙을 융합시켰다.","알브레히트 리츨은 형이상학과 궁극적 대답의 가능성에 절망한 뒤, 역사로, 그리스도의 지상 생애에 관해 우리가 알 수 있는 것으로 돌아가자고 제안하여 자유주의 신학의 기초를 놓았다.","폴 틸리히는 20세기 과학 이전 시대인 1세기 그리스도인들의 사고의 틀을 그대로 사용할 수 없으며 복음을 비신화해야 하며, 기독교의 핵심은 그리스도 사건으로 이는 절대 헌신을 요구하는 사건이며, 신앙을 갖기 위해서는 자신을 신앙에 헌신하는 모험을 해야 한다고 가르쳤다."],"answer":4},{"id":234,"type":"mc","question":"옥스퍼드 운동에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["소교구들의 예배를 초기 교회의 신성한 상태로 되살리려고 힘썼다.","모든 사람들을 포괄하려는 광교회의 이상에 반대하고 교회는 역사적 증거, 신조들 등 사도들의 계승자들이 전수해온 유산을 회복해야 한다고 주장했다.","소교구들의 부흥을 일으키려면 국가에 종속되어 있는 현실을 타파해야 한다고 생각했다.","기독교력(교회력)을 비판했으며, 하나님이 제정하신 성일은 안식일뿐이라고 주장했다."],"answer":4},{"id":235,"type":"mc","question":"근대 이후 산업화와 인구 증가에 대한 기독교의 대응에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["도시 빈민 사역은 처음으로 구세군에 의해 시도되었다.","감리교인들은 노동운동에 적극적으로 참여하여 20세기 영국에 파시스트 혁명이 일어나지 않게 한 하나의 이유로 손꼽힌다.","독일에서는 개인의 자유를 존중하였기 때문에 국가가 아버지처럼 공공 복지에 책임을 져야 한다는 사상이 뿌리내리기 어려웠다.","가톨릭 교회는 오랜 협력의 전통을 가지고 있어서 복지국가의 이념을 받아들이기 쉬웠다. 케텔러는 자유주의를 비판했고, 교황 레오 13세는 “레룸 노바룸”이라는 노동문제에 대한 교서를 발표했다.."],"answer":3},{"id":236,"type":"mc","question":"19세기 사회개혁에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["영국에서는 노예 매매 반대 운동이 감리교와 국교회에서 시작되었다.","뉴잉글랜드의 청교도들은 1812년 전쟁이 끝난 뒤에야 비로서 반전운동에 참여했다.","식민지 아메리카에서 노예제도에 대한 저항은 퀘이커 교도로부터 시작되었다.","19세기 중엽까지 노동조합은 불법 단체였으므로 1849년 이후 5년 동안 감리교도의 3분의 1이 교회를 탈퇴하여 노동조합에 가입했고, 이로써 영국에서 노동운동은 탈기독교화되었다."],"answer":4},{"id":237,"type":"mc","question":"다음과 같은 말을 남긴 사람은?\n\n그리스도인들의 하나님은 단순히 기하학적 진리들로 이루어진 이론인 신이 아니다. 그것은 이교도들의 신이다. 하나님은 섬기는 자들에게 복을 주는 그런 하나님이 아니다. 그것은 유대인들의 신이다. 그리스도인들의 하나님은 사랑과 성결의 하나님이시오, 인간에게 자신의 철저한 비참함과 하나님의 무한한 자비를 느끼게 하시는 하나님이시오, 친히 그들의 존재 근거가 되사 그들에게 겸손과 기쁨과 확신과 사랑을 가득 채워 주시는 하나님이시다.","choices":["조지 폭스(퀘이커)","파스칼","슈페너","진젠도르프"],"answer":2},{"id":238,"type":"mc","question":"다음과 같은 말을 남긴 사람은? \n\n우리는 뜨거운 구원 집회를 연다... 즐겁고 편하고 쉬운 사귐의 밤이다. 소녀들은 벤조와 템버린을 연주하고, 런던에서 보게 되는 활기찬 집회가 두어 시간 지속된다. 짧고 분명하게 드리는 기도 시간이 있고, 다음에 설교 시간이 오는데, 더러는 집회 지도자들이 맡지만, 대부분은 지난 번 집회에서 구원받은 사람들의 간증... 개인 체험을 바탕으로 한 간단한 고백으로 진행된다... 우리는 지금 런던에서 수천 명의 극빈자들을 수용하고 있는데, 그들 중 다수가 전과자, 거지, 떠돌이로서 만물의 찌기에 해당하는 사람들이다.","choices":["웨슬리","조나단 에드워즈","윌리엄 윌버포스","윌리엄 부스(구세군)"],"answer":4},{"id":239,"type":"mc","question":"다음은 제임스 앤서니 프루드가 쓴 글이다. 이는 누구를 존경하여 쓴 글인가?\n\"그는 언제나 다른 참석자들보다 공통된 대화 주제들을 더 잘 알고 있는 듯했다…화자로서 그의 특징은 짐짓 재치있는 말이나 인상적인 말을 하지 않은 데 있을 것이다. 그는 풍자는 해도 독설은 입밖에 내지 않았다. 악의가 담김 일화를 그에게서 들어본 적이 없다. 그는 단조로움을 참지 못했다. 그는 빛 자체였다. 융통성 넘치는 빛 말이다….그의 설교는 독특한 착상을 바탕으로 한 시로서, 정교해서 마음이 끌리고, 진지해서 반갑고, 독창적이러서 흥미로웠다.\"","choices":["존 케이블","존 헨리 뉴먼","조나단 에드워드","윌프레드 워드"],"answer":2},{"id":240,"type":"mc","question":"다음은 매튜 아놀드의 글이다. 누구를 존경하여 쓴 글인가?\n\"성 메리 대성당의 측량으로 비치는 희미한 오후 햇살을 타고 소리없이 들어와 강단에서 일어나, 정교하고 정겹고 애처로운 종교 음악과 같은 말과 생각으로 침묵을 깨뜨리는 지극히 황홀한 음성으로 파문져 나가는 그 영적인 환영의 매력을 누가 거절할 수 있었겠는가? 내 귓가에는 여전히 그의 음성이 쟁쟁하다: \"세상살이의 열정이 식고, 고단함과 아픔도 접고, 투쟁과 낙심도 끝나고, 음울함과 성마름도 끝나고, 싸워 이기는 일도 끝나고, 이 고통스럽고 불건강한 상태에서 생기는 온갖 변화와 우연도 끝나면, 마침내 죽음이 찾아옵니다. 마침내 하나님의 흰 보좌 앞에 서게 됩니다. 마침내 지복직관에 이릅니다.\"","choices":["제임스 앤서니 프루드","존 헨리 뉴먼","장 칼뱅","윌리엄 윌버포스"],"answer":2},{"id":241,"type":"mc","question":"20세기 해외선교에 대한 다음의 보기 중 틀린 것을 고르시오.","choices":["19세기 방대한 확장을 주도한 세력은 개신교도들이었다","카톨릭 선교사들은 16세기에 정치적 지원 없이도 일본에 들어가 폭넓은 수확을 거두었다.","본토 문화를 수용하는데 있어서 카톨릭은 개인의 회심, 훈련과 시험을 강조했으며그렇게 가입한 회심자가 동족에게 단절되는 일이 있었다.","원주민들의 관습에 관해서 선교사들은 인도에서 남편이 죽으면 아내를 산 체로 함께 화장하는 순장 제도에 반대했다."],"answer":3},{"id":242,"type":"mc","question":"미국의 지역별 국교회 중 바르게 연결되지 않은 것을 고르시오","choices":["뉴저지 - 네덜란드 개혁교회","펜실베이나 - 퀘이커교","메릴랜드-카톨릭","로드 아일랜드-침례교"],"answer":1},{"id":243,"type":"mc","question":"다음 중 틀린 설명을 고르시오","choices":["허버트 스펜서는 사후의 유일한 환셩은 하나님이며 하나님과 교통할 수 있는 자들만 살아남을 수 있다는 조건적 불멸 이론을 주장했다.","뉴먼 스미스는 진보란 생명의 법칙이고, 육체적 진화가 이제 그 한계에 도달했으므로, 육체에는 더 이상 발전이 없을 것이며, 진화 과정은 무덤 저편에서 절정에 달할 것이라고 말했다.","프리드리히 슈트라우스는 그리스도 안에 계시된 하나님께 대한 의존감을 말했다. 그는 당시의 세속화한 지식인들에게 낭만주의자들의 언어로 루터의 신학을 전하고 있었다.","알브레히트 리츨은 형이상학과 궁극적 대답들의 가능성에 절망한 뒤 역사로, 그리스도의 지상 생애에 관해 우리가 알 수 있는 것으로 돌아가자고 요구했다."],"answer":3},{"id":244,"type":"mc","question":"다음은 제2바티칸 공의회에 관한 설명이다. 틀린 것을 한 개 고르시오.","choices":["성경연구를 확대하였다.","에큐매니즘에 적극 참여하였다.","교회론을 재정립했다.","성경의 언어를 자국어로 바꾸는 것을 금지했다."],"answer":4},{"id":245,"type":"mc","question":"1910년에 열린 선교대회로 WCC의 기원으로 인정받는 선교대회는 무엇인가?","choices":["로잔 대회","에딘버러 선교대회","로이엔베르크 연합대회","제2차 바티칸 공의회"],"answer":2},{"id":246,"type":"mc","question":"다음과 같은 말을 한 사람은 누구인가?\n\"… 하지만 하나님이 영광을 받는다면 사제와 원숭이들이 기독교교회를 대표하는 일이 더 오래 일어나서는 안 된다. 오히려 하나님의 말씀이 선택한 친구들이 바울이 가르치듯이 예언하기를 배워, 그들이 하나님이 모든 선택 받은 자들에게 얼마나 친근하게 말씀하는지를 참으로 경험해야 한다. 그러한 말씀을 공적으로 알리기 위해 나는 나의 삶을 하나님의 뜻에 드릴 준비가 되어 있다. 하나님은 그분이 선택한 자들에게, 특별히 이 땅에서 놀라운 일들을 행할 것이다. 왜냐하면 새로운 교회는 여기서 시작하며 이 민족이 전 세계의 거울[과 본보기]가 될 것이다. 그리하여 나는 하나님의 말씀이 보호될 수 있도록 도우라고 모든 사람에게 호소한다. \"","choices":["루터","츠빙글리","장 칼뱅","토마스 뮌처"],"answer":4},{"id":247,"type":"mc","question":"1523년 9월, 독일 바이에른의 잉골슈타트대학에서 18세의 젊은 학생 아르사키우스 제호퍼가 자신의 개혁신앙을 철회한 일에 대한 비판으로 공개토론을 요구한 여성 종교개혁가는 누구인가?","choices":["올림피아 모라타","잔 달브레","아르굴라 폰 그룸바흐","마르가리타 드 나바라"],"answer":3},{"id":248,"type":"mc","question":"다음 중 트렌트 공의회에 대한 설명으로 틀린 것은?","choices":["연옥교리의 문제점을 파악하고 이를 수정했다.","성경의 불가타 역본을 모든 논쟁에서 사용하되 문제를 제기할 수 없는 유일하게 권위 있는 역본으로 선포했다.","믿음으로만 의롭다 함을 얻는다는 이신칭의와 상반되게, 신자가 여전히 축적된 공로들을 통해서 자신의 구원에 협력할 수 있다고 정의했다.","성직자의 복수 점유를 금했고, 교육 개선안을 제시했으며, 면죄부 교리는 유지하되 그에 따른 경제적 폐습은 바로잡았다."],"answer":1}];

const LABEL = ["①","②","③","④"];
let filter = "all";
let quizQ = [], current = 0, selected = null, revealed = false;
let results = [];
let score = 0;

function getPool() {
  if (filter === "mc") return QUESTIONS.filter(q => q.type === "mc");
  if (filter === "ox") return QUESTIONS.filter(q => q.type === "ox");
  return QUESTIONS;
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === f));
  const pool = getPool();
  const slider = document.getElementById("count-slider");
  slider.max = pool.length;
  document.getElementById("range-max").textContent = pool.length;
  const cur = parseInt(slider.value);
  if (cur > pool.length) { slider.value = pool.length; updateCount(pool.length); }
  const total = QUESTIONS.length;
  const mc = QUESTIONS.filter(q=>q.type==="mc").length;
  const ox = QUESTIONS.filter(q=>q.type==="ox").length;
  document.getElementById("home-sub").textContent = `기말고사 모의고사 · 총 ${f==="all"?total:f==="mc"?mc:ox}문제`;
}

function updateCount(v) {
  document.getElementById("count-display").textContent = v;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz() {
  const pool = getPool();
  const n = parseInt(document.getElementById("count-slider").value);
  quizQ = shuffle(pool).slice(0, Math.min(n, pool.length));
  current = 0; selected = null; revealed = false; results = []; score = 0;
  show("quiz");
  renderQuestion();
}

function show(id) {
  ["home","quiz","review"].forEach(s => document.getElementById(s).style.display = s===id ? (s==="home"?"flex":"block") : "none");
}

function goHome() { show("home"); }

function renderQuestion() {
  const q = quizQ[current];
  const isOX = q.type === "ox";
  selected = null; revealed = false;

  document.getElementById("q-counter").textContent = `${current+1} / ${quizQ.length}`;
  document.getElementById("score-badge").textContent = `${score} 정답`;
  document.getElementById("progress-fill").style.width = `${(current/quizQ.length)*100}%`;

  const badge = document.getElementById("type-badge");
  badge.className = "type-badge " + (isOX ? "type-ox" : "type-mc");
  badge.textContent = isOX ? "O / X" : "객관식";

  const qtext = isOX ? q.question.replace(/^\(OX 문제\) /, "") : q.question;
  document.getElementById("q-text").textContent = qtext;

  // choices vs OX
  document.getElementById("choices").style.display = isOX ? "none" : "block";
  document.getElementById("ox-btns").style.display = isOX ? "flex" : "none";

  if (!isOX) {
    const div = document.getElementById("choices");
    div.innerHTML = "";
    q.choices.forEach((ch, i) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.innerHTML = `<span class="choice-label">${LABEL[i]}</span><span style="flex:1">${ch}</span><span class="choice-mark"></span>`;
      btn.onclick = () => selectChoice(i);
      div.appendChild(btn);
    });
  } else {
    document.getElementById("ox-o").className = "ox-btn";
    document.getElementById("ox-x").className = "ox-btn";
  }

  const fb = document.getElementById("feedback");
  fb.style.display = "none"; fb.className = "feedback";

  document.getElementById("btn-confirm").style.display = "block";
  document.getElementById("btn-confirm").disabled = true;
  document.getElementById("btn-next").style.display = "none";
}

function selectChoice(i) {
  if (revealed) return;
  selected = i;
  document.querySelectorAll(".choice-btn").forEach((b, idx) => {
    b.classList.toggle("selected", idx === i);
  });
  document.getElementById("btn-confirm").disabled = false;
}

function selectOX(v) {
  if (revealed) return;
  selected = v;
  document.getElementById("ox-o").className = "ox-btn" + (v==="O" ? " selected" : "");
  document.getElementById("ox-x").className = "ox-btn" + (v==="X" ? " selected" : "");
  document.getElementById("btn-confirm").disabled = false;
}

function confirmAnswer() {
  if (selected === null) return;
  revealed = true;
  const q = quizQ[current];
  const isOX = q.type === "ox";
  const correct = isOX ? selected === q.answer : selected === q.answer - 1;

  if (correct) score++;
  results.push({ qid: q.id, correct, selected, answer: q.answer });

  if (isOX) {
    const correctVal = q.answer;
    ["O","X"].forEach(v => {
      const el = document.getElementById("ox-" + v.toLowerCase());
      el.classList.remove("selected");
      if (v === correctVal) el.classList.add("correct");
      else if (v === selected) el.classList.add("wrong");
    });
  } else {
    document.querySelectorAll(".choice-btn").forEach((b, i) => {
      b.classList.remove("selected");
      const mark = b.querySelector(".choice-mark");
      if (i === q.answer - 1) { b.classList.add("correct"); mark.textContent = "✓"; }
      else if (i === selected) { b.classList.add("wrong"); mark.textContent = "✗"; }
      b.classList.add("revealed");
    });
  }

  const fb = document.getElementById("feedback");
  fb.style.display = "block";
  fb.className = "feedback " + (correct ? "correct" : "wrong");
  if (correct) {
    fb.textContent = "✓ 정답입니다!";
  } else {
    const ans = isOX ? q.answer : LABEL[q.answer-1];
    fb.textContent = `✗ 오답 — 정답: ${ans}`;
  }

  document.getElementById("score-badge").textContent = `${score} 정답`;
  document.getElementById("btn-confirm").style.display = "none";
  const btnNext = document.getElementById("btn-next");
  btnNext.style.display = "block";
  btnNext.textContent = current+1 >= quizQ.length ? "결과 보기 →" : "다음 문제 →";
}

function nextQuestion() {
  if (current + 1 >= quizQ.length) {
    showReview();
  } else {
    current++;
    renderQuestion();
  }
}

function showReview() {
  show("review");
  const total = results.length;
  const pct = Math.round((score/total)*100);
  const wrong = results.filter(r => !r.correct);
  document.getElementById("result-emoji").textContent = pct>=80?"🎉":pct>=60?"💪":"📖";
  document.getElementById("result-score").textContent = pct + "점";
  document.getElementById("result-sub").innerHTML =
    `${total}문제 중 <span class="ok">${score}개</span> 정답 · 오답 <span class="bad">${wrong.length}개</span>`;

  const list = document.getElementById("wrong-list");
  list.innerHTML = "";
  if (wrong.length > 0) {
    const title = document.createElement("p");
    title.className = "wrong-title"; title.textContent = "✗ 틀린 문제 복습";
    list.appendChild(title);
    wrong.forEach(r => {
      const q = quizQ.find(q => q.id === r.qid);
      if (!q) return;
      const div = document.createElement("div");
      div.className = "wrong-item";
      const qtxt = q.question.replace(/^\(OX 문제\) /, "");
      if (q.type === "mc") {
        div.innerHTML = `<p class="wrong-q">${qtxt.replace(/</g,"&lt;")}</p>` +
          q.choices.map((ch, i) => {
            const isC = i === q.answer-1;
            const isW = i === r.selected;
            const cls = isC ? "correct" : isW ? "wrong" : "";
            const mark = isC ? " ✓" : (isW ? " ✗" : "");
            return `<div class="review-choice ${cls}"><span style="font-weight:700;min-width:18px">${LABEL[i]}</span><span style="flex:1">${ch.replace(/</g,"&lt;")}${mark}</span></div>`;
          }).join("");
      } else {
        div.innerHTML = `<p class="wrong-q">${qtxt.replace(/</g,"&lt;")}</p>` +
          `<div class="review-ox">` +
          ["O","X"].map(v => {
            const isC = v === q.answer;
            const isW = v === r.selected;
            const cls = isC ? "correct" : (isW && !isC ? "wrong" : "");
            return `<div class="review-ox-btn ${cls}">${v}</div>`;
          }).join("") +
          `</div>`;
      }
      list.appendChild(div);
    });
  }
}

// Init
(function() {
  const total = QUESTIONS.length;
  const mc = QUESTIONS.filter(q=>q.type==="mc").length;
  const ox = QUESTIONS.filter(q=>q.type==="ox").length;
  document.getElementById("home-sub").textContent = `기말고사 모의고사 · 총 ${total}문제`;
  document.getElementById("range-max").textContent = total;
  document.getElementById("count-slider").max = total;
})();
</script>
</body>
</html>
