사용하도록 명령했다.","엘리자베스 1세 여왕 시대 영국 교회의 교리는 39개조로 제시되었는데, 그 교리와 정의는 가톨릭 골수분자들과 엄격한 칼빈주의자를 제외한 모든 사람들을 받아들일 정도로 포괄적이었다.","엘리자베스 1세 여왕 시대 영국 국교회는 국민들에게 믿고 싶은 것을 믿게 했으나 주교제, 왕의 수장권, 공동기도서를 의무적으로 받아들여야 한다고 강조했다."],"answer":2},{"id":107,"type":"mc","question":"가톨릭 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["트렌트 공의회에서는 공의회주의가 부활하여 교황의 권위가 약화되었다.","트렌트 공의회는 인문주의 학자를 성경 번역 분야에서 배제하고 에라스무스의 저서들을 단죄했다.","트렌트 공의회는 불가타를 모든 논쟁에서 사용하고 이신칭의를 거부하고 전승과 성경이 교회의 가르침을 위한 권위라고 선언했다.","가톨릭 교회의 개혁 열정은 선교지에서 나타났는데, 파라과이의 예수회 식민지는 스페인과 포르투갈인들의 탄압을 받았다."],"answer":1},{"id":108,"type":"mc","question":"신앙고백 시대에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["1555년 아우그스부르크 평화회의가 열려 영토 원칙에 따라 루터교와 칼빈주의를 승인하였다. 이로써 \"하나의 제국에, 하나의 종교\"리는 큰 틀이 무너졌다.","낙스는 1560년에 스코틀랜드 의회가 칼빈주의를 채택하도록 했으며, 장로교는 스코틀렌드 국교가 되었다.","30년 전쟁(1618-48)은 처음부터 종교전쟁이었으며 군사적 고려보다 종교적 확신이 앞섰다.","1540년 예수회는 교황의 승인을 받았고 유럽을 이단으로부터 되찾고 신세계를 개종하기 위한 교황청의 군대가 되었고, 혁명, 심지어 종교적 목적 하에 군주 살해까지 정당화했다."],"answer":1},{"id":109,"type":"mc","question":"다음은 영국 종교개혁의 진행과정에 일어난 사건들입니다. 이 사건들을 일어난 순서대로 배열한 것의 번호를 고르세요.\n가) 웨스트민스터 개혁의회\n나) 크롬웰의 독재\n다) 명예혁명과 관용령\n라) 비밀집회 금지령과 5마일령\n마) 로드의 정교도 탄압\n바) 헨리8세의 수장령\n사) 메리 여왕의 박해\n아) 엘리자베스 여왕의 일치령","choices":["바-아-사-마-라-나-가-다","바-시-아-마-나-라-가-다","바-사-아-마-가-나-라-다","바-사-아-마-가-라-나-다"],"answer":3},{"id":110,"type":"mc","question":"영국 청교도의 여러 분파에 대한 설명입니다. 틀린 것을 하나 고르세요.","choices":["장로파는 주교제와 공동기도서를 배척하고 정치적인 면에서 입헌군주제를 선호했다.","침례파는 네덜란드에서 메노파와 접촉하면서 유아세례가 자신들의 교회관과 일치하지 않는다고 확신했다.","친우회(퀘이커교)의 창시자 폭스는 성직자도, 전례도, 성례도, 음악도, 성소도 모두 없애자고 주장했다.","독립파의 교회조직은 회중제였고, 지교회 위에는 주교도, 총회도, 노회도 없었으므로, 권징과 출교는 거의 강조되지 않았다."],"answer":4},{"id":111,"type":"mc","question":"프랑스 종교개혁에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["1559년 카토 캉브레지 조약이 맺어졌을 때, 파리에서 교회회의를 열어 칼빈주의자라는 전국 조직을 결성했다.","1598년 낭트 칙령은 위그노가 프랑스의 특정 도시들에서 자유롭게 예배하도록 허락되었지만, 군대 유지, 공직 참여는 배제되었다.","위그노는 주로 종교적 이유뿐만 아니라 경제적 이유로도 불만이 팽배하던 도시의 장인들이었다.","1685년 낭트 칙령이 폐지되자 위그노는 복종이나 추방을 선택하도록 강요되었다."],"answer":2},{"id":112,"type":"mc","question":"18세기에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["18세기는 상대적으로 평화로운 시대였고, 전쟁을 비판하는 문학이 성행하고 평화를 위한 계획이 수립되었다.","계몽사상은 미신 추방운동으로 마녀 사냥을 종식시켰고, 자연법과 인류에 대한 이상은 민주주의의 토대가 되었고, 자유, 평등, 박애의 구호는 농노 해방과 노예 해방에 기여했다.","이신론자들은 스스로를 그리스도인이라고 여겼으며 유신론과 무신론과는 구분된다.","프랑스 이신론자들은 공공연히 가톨릭 교회를 비판했지만, 북아메리카의 영국 식민지의 이신론은 온건하고 소심했다."],"answer":4},{"id":113,"type":"mc","question":"18세기 부흥운동에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["독일의 경건주의의 기원은 에크하르트와 타울러 등으로 거슬러 올라가고, 직접적인 선구자는 카스파르 슈벤크펠트였다.","경건주의는 초기부터 박애사업에 힘써, 프랑케는 고아원을 세우고 진젠도르프는 난민들을 받아들였다.","뉴잉글랜드의 조나단 에드워즈는 신비주의자들의 전승을 이어받은 체험적인 그리스도인으로 계몽사상을 잘 알고 있었고 로크와 뉴턴의 글을 인용했다.","웨슬리의 동료 휘트필드(휫필드)는 회심과 중생한 사람들의 상호지원을 위해 속회를 조직하고 전국의 모임을 감독했다."],"answer":4},{"id":114,"type":"mc","question":"19세기 해외선교에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["가톨릭 선교의 쇠퇴는 스페인과 포르투갈 식민지 제국들의 약화에, 개신교 선교의 성장은 영국과 네덜란드의 대대적인 식민지 개척과 관련된다.","개신교 선교는 개인 회심 체험, 일정 기간의 훈련과 시험 뒤에 교회 가입에 초점을 두었는데, 교회에 가입한 다음에는 동족에게서 단절되었다.","개신교 선교사들은 서구의 의술, 공중 위생, 교육, 운동, 과학기술, 영농법 전파에 힘썼으므로, 토착 문학, 연극, 음악, 건축에는 관심을 두지 않았다.","대종교인 유대교, 이슬람교, 힌두교, 유교는 기독교 선교로 인해 어떤 심각한 타격도 입지 않았다."],"answer":3},{"id":115,"type":"mc","question":"근현대 교회와 국가에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["영국에서는 성공회가, 스웨덴에서는 루터교가 국교회로 남아있을 수 있었다.","이탈리아에서는 1929년 정교협약에 의해 바티칸에 대한 정치적 주권을 되찾고 국가의 간섭을 배제하고 국가를 비판할 권리를 누렸다.","남아메리카에서는 교회가 스페인과 포르투갈의 지배 계층과 결속했는데, 정교 분리는 칠례를 제외하고는 정치권 측의 반감에서 비롯되었다.","히틀러는 1933년 정교협약을 체결하여 성사 집례의 자유, 자녀 교육의 자유, 수도회 존립의 자유, 재산 소유의 자유를 허용했다."],"answer":2},{"id":116,"type":"mc","question":"미국의 교회와 국가의 관계에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["미국에선 식민지 시대에 다양한 교단들이 각기 자기들의 지역을 중심으로 국교회 역할을 했다.","정치 판도의 변화, 새로운 이민, 무역과 공동 방위의 필요로 인해 다른 교파들이 관용되었고 교단 간의 차이도 줄어들었다.","부흥운동은 회심한 자들이 국가를 다스려야 한다고 주장하여 교회와 국가의 분리를 반대했다.","교회와 국가의 분리는 1830냔대에 완료되었고, 그 뒤 미국에서는 교파와 분파의 구분이 사라졌고, 미국의 교회들은 교단이라 불린다."],"answer":3},{"id":117,"type":"mc","question":"20세기 과학 이전 시대인 1세기 그리스도인들의 사고의 틀을 그대로 사용할 수 없으며 복음을 비신화화해야 하며, 기독교의 핵심은 그리스도 사건으로 이는 절대 헌신을 요구하는 사람이며, 신앙을 갖기 위해서는 자신을 신앙에 헌신하는 모험을 해야 한다고 가르친 사람은?","choices":["루돌프 불트만","쉴라이에르마하","칼 바르트","테아르 드 샤르댕"],"answer":1},{"id":118,"type":"mc","question":"옥스퍼드 운동에 대한 서술입니다. 틀린 것은?","choices":["영국 국교회에서 일어난 운동이다.","소교구들의 예배를 초기 교회의 신성한 상태로 되살리려고 힘썼다.","모든 사람들을 포괄하려는 광교회의 이상을 품고 회중을 중심으로 경건과 기도를 다시 일으키려고 했다.","국가에 종속되어 있는 현실을 타파해야 한다고 생각했다."],"answer":3},{"id":119,"type":"mc","question":"근대 이후 산업화와 인구 증가에 대한 기독교의 대응에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["미국에서는 월터 라우센부쉬가 사회복음 운동을 전개하였다.","감리교인들은 노동운동에 적극 참여하여 20세기 영국에 파시스트 혁명이 일어나지 않게 한 이유 중 하나로 손꼽힌다.","케텔러는 자유주의를 비판했고, 교황 레오 13세는 \"레룸 노바룸\"이라는 노동문제에 대한 교서를 반포했다.","독일 루터교는 개인의 자유를 존중했기 때문에 자유방임을 옹호하고 국가의 통제를 반대했다."],"answer":4},{"id":120,"type":"mc","question":"현대의 가톨릭 교회에 대한 설명입니다. 틀린 것을 하나 고르세요.","choices":["1870년에는 교황무류설을 확립였는데, 이는 교황의 모든 결정은 모든 신자들에게 구속력을 가지며, 모든 경우에 성령께서 교황으로 하여금 오류를 범하지 않도록 막아주실 것이라는 뜻이다.","교황 피우스 9세는 오류목록이라는 교서에서 합리주의, 사회주의, 공산주의, 자연주의, 정교 분리, 출판의 자유, 종교의 자유를 배척했다.","오늘날 미사의 상당 부분을 자국어로 진행하며 회중의 참여폭도 늘려놓았다.","가톨릭 현대주의자들은 동정녀 탄생 신조를 역사 사실로 인정하지 않고 신화로 받아들일 수 있다고 주장했다."],"answer":1},{"id":121,"type":"mc","question":"러시아 교회에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["1547년 이반 4세가 차르의 칭호를 취하고 수도를 옮겨 모스크바 시대가 시작되었지만 러시아 교회는 여전히 비잔틴 교회에 소속되었다.","17세기에 총대주교 니콘은 비잔틴 교회를 모델 삼아 전례 개혁에 착주했다가 보수주의자들에 의해 강력한 반발을 받았다.","1721년 교회 정치는 소보르라는 위원회에 위임되었다.","1904년 멘세비키 혁명의 결과 총대교직이 부활되었다."],"answer":1},{"id":122,"type":"mc","question":"현대의 기독교 박해에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["1917년 공산주의 혁명을 일으킨 사람들은 교회 뿐 아니라 인민의 아편인 종교 자체를 말살하려고 했다.","소련 정부의 박해에도 불구하고 1940년 무신론 계열의 간행물은 적어도 도시 노동자의 절반이 신자들이며 농촌 지역에는 불신자를 찾아보기 힘들다고 인정했다.","히틀러는 개신교 교회들을 국가의 부서로 만들고 기독교를 셈족의 혈통이 없는 게르만족의 종교로 개조하려고 했다.","히틀러는 1933년 정교협약을 체결하여 가톨릭교회와 좋은 관계를 유지할 수 있었다."],"answer":4},{"id":123,"type":"mc","question":"종교개혁 시대의 예배와 성례와 목회에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["재세례파는 모든 집회는 성령이 주관하시며, 남자든 여자든, 누가 성령의 인도로 말하게 될 때까지 모두가 잠잠히 있어야 한다고 했다.","루터는 영혼과 육체를 분리할 수 없다고 보아 예배를 돕는 물질적인 것들을 인정했다. 따라서 루터교는 예배에 예술을 남겨두었고, 교회 내의 건축, 조작, 회화에 아무런 혁신이 없었다.","에드워드 6세 때에는 전례를 영어로 개정하고 번역하여 공동기도서가 만들어졌다.","영국의 장로교도들과 청교도들은 교회력을 거부하고 성탄절, 재의 수요일, 사순절, 부활절 등 모든 축일을 제거하라고 주장했다."],"answer":1},{"id":124,"type":"mc","question":"다음과 같이 말한 사람은?\n\"여러분 존귀하신 영주들께서 간단한 대답을 원하시므로, 저는 거두절미하고 대답하겠습니다. 성경과 명백한 이성에 의해 가책을 받지 않는 한 저는 교황들과 공의회들의 권위를 받아들이지 않습니다. 그들은 서로 모순되기 때문입니다. 제 양심은 하나님의 말씀에 사로잡혀 있습니다. 저는 어떤 것도 철회할 수도 없고 철회하지 않을 것입니다. 양심을 거스른다는 것은 옳지도 않고 안전하지도 않기 때문입니다. 하나님, 저를 도와주옵소서. 아멘\"","choices":["루터","토마스 뮌처","츠빙글리","칼빈"],"answer":1},{"id":125,"type":"mc","question":"선택받은 자라는 확신을 얻는 방식에 대한 종교개혁자의 서술입니다. 틀린 것을 하나 고르세요.","choices":["루터는 선택자라는 것을 확신할 시험 방법을 부정했고 따라서 선택자들의 공동체를 세울 수 없다고 보았다.","츠빙글리는 신앙고백으로 선택자를 확인할 수 있다고 보았다.","재세례파는 중생 체험이 시험 기준이 될 수 있다고 보았다.","칼빈은 시험 기준에 성찬에 대한 사랑이 포함될 수 있다고 보았다."],"answer":3},{"id":126,"type":"mc","question":"스코틀랜드 교회에 대한 설명입니다. 틀린 것을 하나 고르세요.","choices":["낙스는 1560년 스코틀랜드 의회로 하여금 칼빈주의를 채택하도록 만들었다.","낙스와 그 추종자들의 지도 하에 장로교가 스코틀랜드의 국교가 되었다.","대주교 로드 시대에는 영국 국교회의 공동기도서에 따라 예배를 드리도록 결의했다.","1843년 토마스 찰머스는 회중의 뜻에 무관하게 평신도 후원자가 성직자를 임명하는 것을 반대하여 항의운동을 벌이자, 1203명의 목사 중 451명이 국교회를 탈퇴하여 자유교회를 세웠다."],"answer":3},{"id":127,"type":"mc","question":"얀센주의의 대변자로서 이성적인 추론이 아니라 예수 그리스도 안에 계시된 하나님을 봄으로써 하나님에 대한 믿음에 도달할 수 있다고 주장한 사람은?","choices":["르네 데카르트","블레즈 파스칼","프랑소와 드 라 모테 페넬롱","자크 베니네 보슈에"],"answer":2},{"id":128,"type":"mc","question":"웨슬리에 대한 설명입니다. 틀린 것을 하나 고르세요.","choices":["옥스퍼드 대학을 다니면서 금욕적 품행, 열성적인 기도 생활, 교도소 방문 전도로 놀림감이 되었다.","모라비아 예배당에서 멜란히톤의 <로마서주석>에 실린 루터의 서문이 낭독되는 것을 듣고 신생을 체험했다.","가난한 자를 회심시켜 프롤레타리아를 복음의 범주 안으로 끌어들였다.","아버지가 시무하던 엡워스 교회에서 강단에 설 권리를 박탈당하자 국교회를 떠나 새로운 교단을 창설했다."],"answer":4},{"id":129,"type":"ox","question":"(OX 문제) 예수회 선교사 노빌리는 16세기에 인도에서 사역하면서 카스트 제도를 받아들이고 브라만처럼 생활함으로써 지도자들을 얻으려고 노력하고, 한편으로는 브라만 계층을 위한 교회가 있어야 하고 다른 편으로는 하층민들을 위한 교회가 있어야 한다고 믿었고 로마는 즉시 그 방법을 승인했다.","answer":"O"},{"id":130,"type":"mc","question":"19세기 사회개혁에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["영국령에서 노예 매매 반대운동은 감리교와 국교회에서 시작되었다.","미국에서는 노예제도를 두고 감리교, 장로교, 침례교가 북부와 남부로 분열되었다.","라가츠와 파울 틸리히는 20세기 초에 기독교 사회주의자들이라는 집단을 결성했다.","부흥운동은 회심을 강조해서 노예제도에는 관심을 두지 않았다."],"answer":4},{"id":131,"type":"mc","question":"20세기 교회의 재통합에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["부흥운동은 영혼의 신생을 체험한 모든 사람들을 통합하는 경향을 띠었다.","캐나다에서는 감리교, 회중교회, 장로교가 캐나다 연합교회를 결성했다.","남인도에서는 성공회, 감리교, 장로교, 회중교회가 남인도교회를 결성했다.","세계교회협의회에는 개신교회만 포함되며 러시아 정교회, 그리스 정교회는 가입되어 있지 않다."],"answer":4},{"id":132,"type":"mc","question":"다음과 같은 말을 남긴 사람은?\n\"하나님께 관한 일을 생각하노라면 종종 마음에 즐거움이, 영혼의 향기가 불현듯 타올랐다....밖으로 나가 혼자 걸었다. 아버지의 목장에 있는 한적한 곳이 었다. 그곳을 거닐면서 하늘과 구름을 쳐다보자니 하나님의 영광스러운 엄위와 자비에 대한 생각이 형언할 수 없이 가득 밀려왔다. \n모든 게 다 달라보였다. 사방에 조용하고 온화한 하나님의 영광과 그 뛰어나심과 지혜와 성결과 사랑이 드리운 듯했다. 해와 달과....모든 자연....전에도 나는 앉아서 하염없이 달을 바라보곤 했다. 그리고 그 날 오랫동안 구름과 하늘을 바라보고 있다가 거기서 하나님의 인자한 영광을 바라보고서, 나직한 소리로 창조주와 구주께 대한 묵상을 노래로 읊조렸다. \"","choices":["조나단 에드워즈","슈페너","진젠도르프","윌리엄 윌버포스"],"answer":1},{"id":133,"type":"mc","question":"가톨릭 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["트렌트 공의회는 불가타를 모든 논쟁에서 사용하고 이신칭의를 거부하고 전승과 성경이 교회의 가르침을 위한 권위라고 선언했다.","교황 파울루스 4세는 에라스무스가 저술한 모든 글을 금서로 규정했다.","예수회는 유럽을 이단으로부터 되찾고 신세계를 개종시키기 위한 교황의 새로운 군대가 되었고 교황에게만 복종했다.","가톨릭 교회의 개혁 열정은 선교지에서 나타났는데, 파라과이의 예수회 식민지는 스페인과 포르투갈인의 적극적인 지지로 발전했다."],"answer":4},{"id":134,"type":"mc","question":"부흥운동의 지도자에 대한 서술입니다. 틀린 것은 고르세요.","choices":["존 웨슬리는 야외설교를 통해 탄광 노동자에게 복음을 전했다.","아우구스트 프랑케는 계층과 신조를 초월하였고 헤른후트파를 지도했다.","조나단 에드워즈는 사회 전체를 회심시키려 하였고 《진노하시는 하나님의 손아귀에 있는 죄인들》을 썼다.","요한 비케른은 독일에 지체장애자, 시각장애자, 간질병자, 문둥병자, 사생아, 미혼모, 정신장애자 등 심신에 결함이 있는 모든 사람들을 보살피기 위해 이른바 국내선교회를 조직했다."],"answer":2},{"id":135,"type":"mc","question":"계몽주의와 이신론에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["이신론은 인격적 하나님, 역사를 통해서 자신을 나타내시고 인간사에 관심을 가진 하나님을 믿지 않고, 천체를 운행하고 별들이 조화롭게 돌 수 있도록 배려한 우주의 조물주로서의 하나님을 강조했다.","휴고 그로티우스는 자연법을 ‘심지어 신이 없을지라도’ 유효한 윤리로 다룸으로써 탈기독교화했다.","존 톨랜드는 『신비롭지 않은 기독교』에서 이성의 수위성을 강변했지만, 화체설과 공재설과 같은 전통 신조를 부정하진 않았다.","미국의 건국 조부들은 정치는 인간의 자연 이성의 범주에 있으며, 따라서 국가는 하나님의 뜻에서 해방된다고 주장했다."],"answer":4},{"id":136,"type":"mc","question":"다음은 영국 종교개혁의 진행과정에 일어난 사건들입니다. 이 사건들을 일어난 순서대로 배열한 것의 번호를 고르세요.\n가) 웨스트민스터 개혁 의회\n나) 헨리 8세의 수장령\n다) 엘리자베드 여왕의 일치령\n라) 비밀집회 금지령\n마) 크롬웰의 독재\n바) 로드의 청교도 탄압\n사) 명예혁명과 관용령\n아) 메리 여왕의 개신교 박해","choices":["나-다-아-바-가-라-마-사","나-아-바-다-마-가-라-사","나-아-다-바-가-마-라-사","나-다-아-바-가-마-라-사"],"answer":3},{"id":137,"type":"mc","question":"다음과 같은 말을 남긴 사람은?\n\"그리스도인들의 하나님은 단순히 기하학적 진리들로 이루어진 이론인 신이 아니다. 그것은 이교도들의 신이다. 하나님은 섬기는 자들에게 복을 주는 그런 하나님이 아니다. 그것은 유대인들의 신이다. 그리스도인들의 하나님은 사랑과 성결의 하나님이시오, 인간에게 자신의 철저한 비참함과 하나님의 무한한 자비를 느끼게 하시는 하나님이시오, 친히 그들의 존재 근거가 되사 그들에게 겸손과 기쁨과 확신과 사랑을 가득 채워 주시는 하나님이시다.\"","choices":["조지 폭스(퀘이커)","파스칼","슈페너","진젠도르프"],"answer":2},{"id":138,"type":"mc","question":"근현대 교회와 국가에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["스코틀랜드에서는 장로교회가 국교였는데, 교회를 국가의 통제로부터 해방시키기 위해 1843년 토마스 찰머스를 중심으로 자유교회를 세웠다.","러시아에서는 공산주의 혁명 전까지 교회가 국가에 대해서 상당한 독립성을 유지할 수 있었다.","미국에서는 모든 종교 단체가 비국교회가 되어 교단주의가 정착되었다.","파시즘은 분개한 중산층이 국가에 대해 파업을 중단시키고 강제력을 써서라도 노동자와 자본가 사이의 협력을 끌어내라고 요구한 이탈리아에서 시작되었다."],"answer":2},{"id":139,"type":"mc","question":"프랑스의 위그노에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["1559년 카토 캉브레지 조약이 맺어졌을 때, 파리에서 교회회의를 열어 칼빈주의자라는 전국 조직을 결성했다.","성 바돌로매 축일에 파리와 대도시에서 수천 명의 위그노가 학살되었다.","1598년 낭트 칙령은 위그노가 자유롭게 예배하도록 허락했지만 위그노는 공직에 오를 수 없었다.","추기경 리슐리외가 위그노의 요새화된 도시를 모두 헐어버리자 위그노에 대한 관용은 국왕의 선의에 의존할 수밖에 없었다."],"answer":3},{"id":140,"type":"mc","question":"신앙고백시대의 예배·성례·목회·영성에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["영국의 에드워드 6세는 전례를 영어로 번역하여 공동기도서를 편찬했는데, 제2기도서는 제1기도서보다 츠빙글리적인 색채를 지녔다.","크롬웰은 국교회를 포기하고 모든 정파를 관용하고 예배 자유를 인정했다.","스코틀랜드 장로교도와 청교도들은 교회력을 거부했다.","바로크 예술은 화려하고 사치스러운 장식, 열정적이고 드라마틱한 성격, 죽음만이 유일한 해결책이 되는 투쟁의 묘사로 특징지어지는데, 가톨릭의 반동종교개혁과 스페인의 정신을 대변한다."],"answer":2},{"id":141,"type":"mc","question":"다음과 같은 말을 남긴 사람은? \n\n죄인들이여, 여러분이 처해 있는 위험한 처지를 생각하십시오. 지금 이 예배당에 건강한 몸으로 조용히 안전하게 앉아 있는 사람들이 내일 아침이 오기 전에 지옥에 가 있다 해도 조금도 놀랄 일이 아닙니다.","choices":["조나단 에드워즈","웨슬리","찰스 피니","무디"],"answer":1},{"id":142,"type":"mc","question":"16세기 초 자유주의적 가톨릭 개혁운동에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["에라스무스는 구원에 필수적인 교리와 비본질적인 교리를 구분하고, 본질적인 교리들을 사도신경으로 제한했다.","에라스무스는 고전 번역과 성경 출판을 위해 노력했으며 여러 학자들의 도움을 얻어 콤풀루툼 학파 대역성경을 편찬했다.","에라스무스는 화체설을 근거 없는 스콜라주의적 궤변으로 여겼고, 성찬 때 발생하는 그리스도의 임재를 영적인 임재로 해석했다.","복음주의적 인문주의에는 에라스무스 이외에도 영국의 존 콜레트, 토마스 모어, 프랑스의 자크 르페브르 데타플, 장 스탕동크, 이탈리아의 후안 드 발데스가 포함된다."],"answer":2},{"id":143,"type":"mc","question":"근대 이후 기독교의 사회개혁 운동에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["감리교인들은 노동운동에 적극적으로 참여하여 20세기 영국에 파시스트 혁명이 일어나지 않게 한 하나의 이유로 손꼽힌다.","스위스인 라가츠, 독일인 파울 틸리히는 20세기 초에 기독교 사회주의자들이라 부르는 집단을 결성했다.","영국에서는 노예 매매 반대 운동이 감리교와 국교회에서 시작되었다.","뉴잉글랜드의 청교도들은 처음부터 반전운동에 헌신했다."],"answer":4},{"id":144,"type":"mc","question":"종교를 현대의 지식과 사상과 조화시키기 위해 노력했던 신학자들에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["바르트는 제1차 세계대전을 계기로 자유주의 신학을 비판하고 계시, 즉 하나님의 자기 현시에 대한 신앙을 회복시켰다.","알브레히트 리츨은 형이상학과 궁극적 대답의 가능성에 절망한 뒤, 역사로, 그리스도의 지상 생애에 관해 우리가 알 수 있는 것으로 돌아가자고 제안하여 자유주의 신학의 기초를 놓았다.","호레이스 부쉬넬은 성경의 열쇠는 논리가 아니라 상상과 열정과 감정이며 시인들이야말로 참된 신학자라고 주장했다.","폴 틸리히는 창세기를 신화로 해석할 수 있듯이 복음서도 신화, 즉 영원한 진리를 감싸고 있는 종종 이야기 형태로 된 상징으로 이해하고 복음서는 예수를 가장 완전한 모범자라는 진리를 전달하기 위해 구약성경의 자료를 이야기로 구성했다고 가르쳤다."],"answer":4},{"id":145,"type":"mc","question":"다음은 종교개혁 시대의 예배와 성례와 목회에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["재세례파는 모든 집회는 성령이 주관하시며, 남자든 여자든, 누가 성령의 인도로 말하게 될 때까지 모두가 잠잠히 있어야 한다고 했다.","루터는 영혼과 육체를 분리할 수 없다고 보아 예배를 돕는 물질적인 것들을 인정했다. 따라서 루터교는 예배에 예술을 남겨두었고, 교회 내의 건축, 조작, 회화에 아무런 혁신이 없었다.","츠빙글리는 금식일을 폐지하고 취리히 대성당에서 성상을 제거했고 벽들을 하얗게 칠하고 오르간을 폐쇄했다.","칼빈은 교회가 독립된 지위를 누려야 하고, 전례 형태를 결정하고, 무엇보다 출교권을 행사해야 한다고 주장했다."],"answer":1},{"id":146,"type":"mc","question":"재세례파에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["교회가 국가로부터 분리된, 깨달은 신자들의 자발적 사회라는 것을 강조했다.","1529년 슈파이에르 의회에서 가톨릭측과 루터교 양측은 신성로마제국 전역의 재세례파를 사형에 처하기로 하는데 합의했다.","처음 몇십 년 동안에는 주 예수의 재림 등 종말신앙을 강조하지 않다가 박해를 거치면서 임박한 종말론이 강조되었다.","메노파는 단순한 산상보훈의 기독교로서 신학을 될 수 있는 대로 강조하지 않고 품행에 관한 교리를 강조하여 교회와 국가의 분리를 주장했다."],"answer":3},{"id":147,"type":"mc","question":"18세기 부흥운동에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["에드워즈의 대각성운동은 일부 교회에 생명을 불어넣었지만, 교회는 새빛파와 옛빛파로 분열되었다.","웨슬리는 영국 국교회를 떠난 적이 없고 버림 받은 적이 없지만, 시간이 흐르면서 감리교도들은 스스로를 비국교도로 여기며 새로운 교단이 존재하게 되었다.","부흥운동은 독일의 경건주의, 영국의 감리교 운동과 성공회 내의 클래팜파, 뉴잉글랜드의 대각성운동으로 전개되었다.","부흥운동은 이성대신 체험을 강조했으므로 계몽사상에 대한 철저한 반동으로 이해될 수 있다."],"answer":4},{"id":148,"type":"mc","question":"친우회 혹은 퀘이커교에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["퀘이커교는 재세례파처럼 사회의 틀에서 물러나서 개혁을 주장했다.","창설자 폭스는 성직자도 전례도 성례도 음악도 성소도 모두 없애자고 주장했다.","사회적 평등주의를 주장하여 왕에게도 하인에게 쓰는 것과 똑같은 호칭을 사용하자고 주장했다.","퀘이커교는 재세례파처럼 전쟁과 맹세(서약)을 반대했다."],"answer":1},{"id":149,"type":"mc","question":"칼빈에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["성찬 때의 그리스도의 실제적―비록 물질적은 아니지만―임재를 믿었다. 그에게는 빵과 포도주가 그리스도께서 임재해 계신다는 상징물이었다.","신앙과 지식을 대립시키기를 거부하고, 그리스도인들은 계시에 의존하므로 흔들릴 수 없는 확신을 누릴 수 있다고 주장했다. 또한 인간의 주된 목적은 하나님과의 합일이 아니라 불가해한 작정 앞에서는 잠잠히 엎드리고 계시된 계명에 대해서는 순종하는 것이라고 가르쳤다.","진정한 기독교 사회에서는 교회와 국가가 협력할 수 있으며, 선지자는 왕을 계도하고 왕은 예배를 뒷받침하고 불경한 자들을 몰아내야 한다고 가르쳤으며, 정부가 교회 문제를 관장하는 것을 인정했다.","교회에서 시편 찬송은 허용했으나 다른 음악은 허용하지 않았으며, 시편 찬송은 프랑스와 스코틀랜드와 뉴잉클랜드에 있던 칼빈주의 교회 예배의 독특한 특징이 되었다."],"answer":3},{"id":150,"type":"mc","question":"루터의 사상에 대한 서술로 맞는 것을 하나 고르세요.","choices":["자유의지에 대해 논쟁하면서 인간이 구원을 얻는데 하나님과 조금은 협력할 수 있다고 보았다.","모든 신자가 다 사제이며, 행정관은 교회에 간섭해서는 안 된다고 가르쳤다.","성례는 받는 자의 믿음에 따라 효력을 발휘하고, 그리스도께서 성찬물 안에, 또한 그 아래 임재하신다고 가르쳤다.","고해성사를 가톨릭교회의 폐해라고 보고 폐기했다."],"answer":3},{"id":151,"type":"mc","question":"미국에서 교회와 국가가 분리되도록 도움을 준 요인이 아닌 것은?","choices":["부흥운동","무역과 공동방위","초자연적 국가 이해","새로운 이민"],"answer":3},{"id":152,"type":"mc","question":"개신교와 가톨릭 해외 선교에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["개신교의 선교는 개인 회심 체험, 일정 기간의 훈련과 시험 뒤의 교회 가입에 초점을 두었는데, 교회 가입한 다음에는 동족에게서 단절되었다.","카톨릭 선교는 유럽에서의 집단 개종 전통을 이어갔으므로, 개종한 집단이 가지고 들어온 이교 신앙과 의식의 문제를 해결해야 했다.","개신교 선교사들은 복음 전도와 회심을 강조했기 때문에 서구 문명을 전하는 데는 매우 소극적이었다.","복음주의 부흥운동은 개신교권에 대대적인 선교 운동이 일어나게 했다."],"answer":3},{"id":153,"type":"mc","question":"16세기 초의 교회 상황에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["공의회 운동이 교황 통제 하에 종속되었으며, 교황청의 분열도 종식되었다.","분파주의와 이단이 성행하여 종교재판소의 엄격한 정책이 시행되었다.","십일조를 내지 않으면 파문에 처하게 되어 십일조는 혐오 대상이 되었으며, 성직 매매, 면죄부 판매, 교황청 세금에 대해 원성이 높았다.","목회자들과 주교들은 타지에 가 있느라 교구를 비워 두는 일이 많았다."],"answer":2},{"id":154,"type":"mc","question":"스페인이 처음 정복사업에 나섰을 때 카리브해 연안의 원주민들에게 야만적 행위를 격렬하게 비판한 인물의 이름은?","choices":["바르톨로메 드 라스카사스","히메네즈","마테오 리치","노빌리"],"answer":1},{"id":155,"type":"mc","question":"영국 청교도 분파 중에서 주교제와 공동기도서를 배척하지만 왕을 인정하고 입헌군주제를 주장한 분파는?","choices":["장로파","독립파","침례파","퀘이커파"],"answer":1},{"id":156,"type":"mc","question":"가톨릭 현대주의자들에 대한 설명입니다. 틀린 것은 하나 고르세요.","choices":["개신교에서 유행하던 성서학의 방법을 받아들였다.","동정녀 탄생 신조를 역사 사실로 인정하지 않고 신화로 받아들일 수 있다고 주장했다.","교황무류 교리를 신자들의 합의 이상의 것이 아니라는 쪽으로 재해석했다.","1910년에 파문을 당하여, 이후에 그들의 성경학 방법은 가톨릭 학자들에게 외면당했다."],"answer":4},{"id":157,"type":"mc","question":"예수회를 설립하는데 함께 참여했고, 설립자 이그나티우스 로욜라의 명령에 순종하여 인도와 일본에서 선교했던 선교사의 이름은?","choices":["프란시스 사비에르","노빌리","바르톨로매 라스 카사스","마테오 리치"],"answer":1},{"id":158,"type":"mc","question":"벵갈의 세람포어에서 침례교 선교회 소속으로 인쇄소를 세워 1832년까지 44개의 언어와 방언으로 성경을 발행하도록 한 선교사는?","choices":["헨리 마틴","윌리엄 케리","존 엘리엇","데이비드 브레이너드"],"answer":2},{"id":159,"type":"mc","question":"노예매매를 반대하고 노예제도 폐지를 위해 노력했던 인물이 아닌 사람은?","choices":["윌리엄 윌버포스","웨슬리","해리어트 비처 스토우","모리스"],"answer":4},{"id":160,"type":"mc","question":"옥스퍼드 운동에 대한 설명입니다. 틀린 것을 하나 고르세요.","choices":["영국 국교회에서 일어난 운동으로 그 영향은 영국 국교회 안에 한정되었다.","존 케블, 에드워드 퓨지, 존 헨리 뉴먼 등이 주도했다.","소교구 교회들의 예배를 초기 교회의 신성한 상태로 되살리려 했다.","위대한 역사들의 증거와 신조들을 회복하려고 했다."],"answer":1},{"id":161,"type":"mc","question":"뉴잉글랜드 교회에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["처음부터 각성한 자들로 구성되어 있었다.","주님의 은혜를 맛본 사람만 교회 회원으로 인정하고 교회 회원만 공직에 오르거나 투표할 수 있었다.","제2세대에 접어들어 영적인 회심을 내세울 수는 없어도 참정권뿐만 아니라 교회의 삶에도 참여하고자 하는 경건하고 건실한 사람이 많았다.","조나단 에드워즈의 할아버지인 솔로몬 스토다드는 회심하지 않은 자들이 성찬에 참여하는 것을 금했다."],"answer":4},{"id":162,"type":"mc","question":"경건주의의 영향에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["독일 민족주의가 대두하는데 기여했다.","초등학교 발전을 통해서 독일 본토뿐만 아니라 스칸디나비아 국가들에도 대중 교육을 촉진했다.","계몽사상과 맞물려 교회사를 바라보는 새로운 방법을 도입했다.","초기부터 박애사업에 힘써, 농민들과 귀족들, 공장 프롤레타리아들의 호감을 샀다."],"answer":4},{"id":163,"type":"ox","question":"(OX 문제) 19세기 중엽까지 노동조합은 불법 단체였으므로 1849년 이후 5년 동안 감리교도의 3분의 1이 교회를 탈퇴하여 노동조합에 가입했고, 이로써 영국에서 노동운동은 탈기독교화되었다.","answer":"X"},{"id":165,"type":"ox","question":"(OX 문제) 가톨릭 교회는 오랜 협력의 전통을 가지고 있어서 복지국가의 이념을 받아들이기 쉬웠다. 케텔러는 자유주의를 비판했고, 교황 레오 13세는 “레룸 노바룸”이라는 노동문제에 대한 교서를 발표했다.","answer":"O"},{"id":166,"type":"ox","question":"(OX 문제) 엘리자베스1세 여왕(영국국교회)은 국민들에게 신앙은 통일하지만 예배는 자유롭게 드릴 수 있도록 했다.","answer":"X"},{"id":167,"type":"ox","question":"(OX 문제) 멜랑히톤은 루터의 오랜 동료로, 사역자는 성직복도 입지 않고, 급료도 받지 않은 채 스스로 노동으로 생계를 유지하는 평신도여야 하며, 교회 음악과 성상을 배척하고 주의 만찬을 영적으로 해석했다.","answer":"X"},{"id":168,"type":"ox","question":"(OX 문제) 18세기 부흥운동은 부분적으로는 계몽주의의 건조한 사색과 이완된 윤리에 대한 반작용으로, 그리고 프로테스탄트 신스콜라주의라는 정직된 보수주의에 대한 반작용으로 일어났다.","answer":"O"},{"id":169,"type":"ox","question":"(OX 문제) 토마스 뮌처는 교회의 개혁은 행정관의 동의를 구할 필요가 없고, 참 신자들의 구별된 단체를 세울 것을 주장했고, 국가를 비기독교적 제도로 배척했다.","answer":"X"},{"id":170,"type":"ox","question":"(OX 문제) 칼빈은 참 신앙의 고백, 올바른 삶, 성찬 참여, 이 요건들을 갖추고 있는 사람은 자기가 선택자라는 것을 확신할 수 있다고 가르쳤으며 후대의 뉴잉글랜드의 청교도와는 달리 정신의 중생 같은 주관적인 어떤 것을 요구하지 않았다.","answer":"O"},{"id":171,"type":"ox","question":"(OX 문제) 알프레드 로와지는 투쟁보다는 사랑의 생명의 법칙이며, 진화 과정이 육체의 차원을 초월하는 더 고상한 삶의 형태를 향해 솟아나며, 우주 자체를 일종의 성사, 즉 보이지 않은 은혜의 보이는 상징으로 해석하여 과학과 신앙을 융합시켰다.","answer":"X"},{"id":172,"type":"ox","question":"(OX 문제) 히틀러는 28개 개신교 지역 교회들을 묶어 하나의 국가교회를 결성하였고, 임의로 주교를 쫓아내는 등 개신교 교회를 국가의 교회로 만들었고, 유대인 혈통을 지닌 자는 기독교 교회의 교인일지라도 추방하는 정책을 세웠다.","answer":"O"},{"id":173,"type":"mc","question":"16세기 초의 교회 상황에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["공의회 운동은 교황의 통제 하에 종속되었으며 교황청의 분열도 종식되었다.","교회 내부에는 부패가 만연했고 개혁의 목소리가 높았다.","스페인에서는 자유롭고 비교리적이고 윤리적이며 교육에 의존하여 목적을 달성하려는 개혁운동이 진행되었다.","하위 성직자들은 제대로 교육을 받지 못했고, 국가 교회나 보편 교회를 지원하는데 많은 금액이 징수되었으며, 사제들은 단일 소교구에서 나오는 수입으로 먹고 살 수 없었고 교구의 목회자가 비는 경우가 많았다."],"answer":3},{"id":174,"type":"mc","question":"에라스무스에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["구원에 필수적인 교리와 비본질적인 교리를 구분하고, 본질적인 교리들을 사도신경으로 제한했다.","보편제국, 보편교회보다는 민족주의와 민족교회를 강조했다.","루터와 자유의지에 대해 논쟁하면서 인간이 구원을 얻는데 하나님과 조금은 협력할 수 있다고 보고, 궁극적으로는 성경보다 교회의 권위에 의존했다.","민중에게 성경을 깨우쳐 주려고 노력했으며, 산상수훈으로 돌아가는 것을 강조했다."],"answer":2},{"id":175,"type":"mc","question":"루터의 오랜 동료로, 사역자는 성직복도 입지 않고, 급료도 받지 않은 채 스스로 노동으로 생계를 유지하는 평신도여야 하며, 교회 음악과 성상을 배척하고 주의 만찬을 영적으로 해석한 인물은?","choices":["멜랑히톤","에라스무스","칼슈타트","토마스 뮌처"],"answer":3},{"id":176,"type":"mc","question":"루터의 사상에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["성경을 단지 구원의 선포로만 간주하지 않고 교회 조직의 전형으로 간주했다.","고해성사를 다른 그리스도인, 심지어 평신도에게라도 자신의 잘못을 자백하는 행위로 축소시켰다.","미사는 그리스도의 제사를 반복하는 것이 아니며, 그리스도의 제사는 모든 사람을 위해 단번에 치러졌으며, 미사는 신자들의 사귐이므로, 사제 혼자만 참석하는 죽은 자들을 위한 미사는 없애야 한다고 주장했다.","성례는 받는 자의 믿음에 따라 효력을 발휘하고, 화체설을 부인하고, 그리스도께서 성찬물 안에, 또한 그 아래 임재한다고 가르쳤다."],"answer":1},{"id":177,"type":"mc","question":"츠빙글리에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["성경이 명하지 않은 것은 모두 금하려 했다.","교회가 국가로부터 독립된 지위를 누려야 하며 전례 형태를 결정하고 무엇보다 출교권을 행사해야 한다고 가르쳤다.","전례력에 따라 발췌문(성서정과) 대신 복음서 전체를 설교했으며 헬라어 성경에서 복음서를 번역하려고 했다.","공적 신앙고백을 한 사람들의 자녀들에게 세례를 베풀 수 있다고 보았다."],"answer":2},{"id":178,"type":"mc","question":"재세례파에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["교회가 국가로부터 분리된 깨달은 신자들의 자발적 사회이며, 신앙에 관한 한 강제로 동의를 끌어내서는 안 된다고 주장했다.","메노파는 일부다처제, 혁명, 꿈과 환상을 통한 영감, 재림 일자 산정을 배척했다.","가톨릭측으로부터는 가혹한 탄압을 받았지만 루터파와 개혁파에게 관용되었다.","유아세례를 세례가 아니라고 보고 진정한 세례는 성인세례라고 보았다."],"answer":3},{"id":179,"type":"mc","question":"종교개혁자의 예배와 성례와 목회에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["에라스무스는 화체설을 근거 없는 스콜라주의적 궤변으로 여겼고, 성찬 때 발생하는 그리스도의 임재를 영적인 임재로 해석하고 이를 교리화하여 가톨릭 교회에 정면으로 도전했다.","루터는 영혼과 육체를 분리할 수 없다고 보아 예배를 돕는 물질적인 것들을 인정했다. 따라서 루터교는 예배에 예술을 남겨두었고, 교회 내의 건축, 조각, 회화에 아무런 혁신이 없었다.","영국의 에드워드 6세 때에는 전례가 영어로 번역되여 공동기도서가 출판되었다.","츠빙글리는 금식일을 폐지하고 대성당에서 성상을 제거했고 벽돌을 하얗게 칠하고 오르간을 폐쇄했다."],"answer":1},{"id":180,"type":"mc","question":"십자가상은 허용하지 않지만 십자가는 허용했으며, 교회에서 다른 음악은 허용하지 않지만, 시편 찬송은 허용한 개혁자는?","choices":["루터","츠빙글리","칼빈","뮌처"],"answer":3},{"id":181,"type":"mc","question":"영국의 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["헨리 8세는 성경을 영어로 번역하여 모든 교회에 영어 성경을 사용하도록 명령했다.","헨리 8세는 수도원을 해체하고 그 재산을 경매에 넘겼다.","헨리 8세는 재위 말기에 이르면서 가톨릭 신앙과 프로테스탄트 신앙 사이의 중도 노선을 추구했다.","에드워드 사망후 왕위에 오른 메리 튜더는 루터교쪽으로 진행하던 종교개혁을 츠빙글리쪽으로, 칼빈주의쪽으로 진행시켰다."],"answer":4},{"id":182,"type":"mc","question":"가톨릭 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세오.","choices":["트렌트 공의회는 성경의 불가타 역본을 모든 논쟁에서 사용하되 문제를 제기할 수 없는 유일한 권위 있는 역본으로 선포했다.","신앙고백의 시대에 스페인에서는 에라스무스파와 신비주의자들이 프로테스탄트 사상이 침투하지 못하도록 저지하는데 큰 역할을 했다.","가톨릭교회의 개혁 열정은 선교지에서 나타났는데, 여기에는 예수회와 프란체스코회를 비롯한 수도회가 큰 역할을 했다.","1540년 예수회는 교황의 승인을 받았고, 교황청의 “군대”가 되었고, 혁명, 심지어 종교적 목적 하의 군주 살해까지 정당화했다."],"answer":2},{"id":183,"type":"mc","question":"신앙고백 시대에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["1555년 아우그스부르크 평화회의가 열려 영토 원칙에 따라 루터교를 승인하였다. 이로써 “하나의 제국에, 하나의 종교”라는 큰 틀이 무너졌다.","30년 전쟁(1618-48)은 표면적으로는 종교전쟁이었지만, 처음부터 종교적 확신보다는 군사적 고리가 앞섰다.","1648년 베스트팔렌 조약은 영토 원칙을 다시 확인하고 칼빈주의에 대해 루터교와 가톨릭 교회와 동일한 지위를 부여했다.","낙스는 1560년에 스코틀랜드 의회가 칼빈주의를 채택하도록 했으며, 장로교는 스코틀랜드 국교가 되었다."],"answer":2},{"id":184,"type":"mc","question":"다음은 영국 종교개혁의 진행과정에 일어난 사건들입니다. 이 사건들을 일어난 순서대로 배열한 것의 번호를 고르세요. \n\n가) 엘리자베드 여왕의 일치령\n나) 로드의 청교도 탄압\n다) 헨리 8세의 수장령\n라) 명예혁명과 관용령\n마) 웨스트민스터 개혁 의회\n바) 크롬웰의 독재\n사) 비밀집회 금지령과 5마일령","choices":["다-나-마-가-바-사-라","다-가-나-사-바-마-라","다-사-가-나-마-바-라","다-가-나-마-바-사-라"],"answer":4},{"id":185,"type":"mc","question":"스페인의 압제에 대해 반란군을 일으키고 북부 지방을 차지하여 1581년 독립을 선포하였으며, 가톨릭 교도들, 루터교도들, 칼빈주의자들, 심지어 메노파에게까지 신앙의 자유를 허용한 나라는?","choices":["프랑스","네덜란드","스코틀랜드","영국"],"answer":2},{"id":186,"type":"mc","question":"영국의 종교개혁에 대한 설명입니다. 틀린 것울 하나 고르세요","choices":["엘리자베스 여왕은 주교제, 왕의 수장권, 공동기도서를 의무적으로 받아들이도록 했다.","독립파의 교회조직은 회중제였고, 지교회 위에는 주교도, 총회도, 노회도 인정하지 않았으며 엄격한 권징을 시행했다.","장로파는 주교제와 공동기도서를 배척하고 정치적으로는 왕정의 폐지를 주장했다.","친우회(퀘이커교)는 성찬용 빵, 성찬상, 성직복, 전례, 주교제, 장로제를 모두 폐지해야 한다고 주장했다."],"answer":3},{"id":187,"type":"mc","question":"청교도에 대한 서술입니다. 틀린 것을 골라 번호를 쓰세요.","choices":["청교도들이 신대륙으로 이주하기 시작한 것은 일차적으로는 박해를 피하기 위해서였다.","주님의 은혜를 맛본 사람들만 성도의 사귐과 교회 회원이 될 수 있었고, 교회 회원만 공직에 오르거나 고위직 선출에 투표할 수 있었다.","순례 조부(The Pilgrims)와 베이 식민주는 영토 원칙에 따랐고, 신앙을 따르지 않는다면 다른 데로 가서 살도록 했다.","퀘이커교 사회에서는 남녀 차별이 뿌리 깊게 남아있었다."],"answer":4},{"id":188,"type":"mc","question":"신앙고백 시대의 예배, 성례, 목회, 영성에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["영국의 장로교들과 청교도들은 성탄절, 재의 수요일, 사순절, 부활절 등 교회력을 통째로 거부하고 하나님이 제정하신 성일은 안식일뿐이라고 주장했다.","1633년 캔터베리 대주교로 임명된 윌리엄 로드는 교리에는 자유가, 정치 조직과 전례에는 일치가 있어야 한다고 믿었다.","유니테리언파는 사회적 평등주의를 주장하여 왕에게도 하인에게 쓰는 것과 똑같은 호칭을 사용하자고 주장했다.","1598년 낭트 칙령은 위그노가 프랑스 전역에서 자유롭게 예배하도록 허락했다."],"answer":3},{"id":189,"type":"mc","question":"크롬웰에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["장로파, 독립파, 침례파라는 세 기둥에 의해 지탱되는 국가 종교를 세우려고 했고, 가톨릭 교도와 유니테리언 교도들에게도 관용을 허락했다.","사회적 지위나 종교적 출신 성분도 구별하지 않고 영적인 사람들로 구성된 성도의 군대를 창설했다.","처음에는 왕정 복귀를 찬성했지만, 왕의 전령이 체포되자, 왕은 절대 왕정과 국교회를 회복하는 것 외에는 다른 생각이 없다는 것을 깨닫고 왕을 처형했다.","거룩한 공화국이란 이념은 고대 이스라엘의 형태에 뿌리를 두고 있었다."],"answer":1},{"id":190,"type":"mc","question":"18세기에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["18세기는 인간에 대한 비관론으로 시작했다.","이신론자의 하나님은 세계를 너무나 완벽하게 만들어 놓았기 때문에 스스로 물러나 사람들이 이성의 인도 하에 스스로의 문제를 처리하도록 내버려두었다.","계몽사상은 미신 추방운동으로 마녀 사냥을 종식시켰고, 자연법과 인류에 대한 이상은 민주주의의 토대가 되었고 자유, 평등, 박애의 구호는 농노 해방과 노예 해방에 기여했다.","부흥운동은 부분적으로는 계몽주의의 건조한 사색과 이완된 윤리에 대한 반작용으로, 그리고 프로테스탄트 신스콜라주의라는 정직된 보수주의에 대한 반작용으로 일어났다."],"answer":1},{"id":191,"type":"mc","question":"18세기 부흥운동에 대한 서술입니다. 틀린 것을 하나 고르세오.","choices":["독일의 경건주의의 기원은 에크하르트와 타울러 등으로 거슬러 올라가고, 직접적인 선구자는 카스파르 슈벤크펠트였다.","경건주의는 독일 민족주의에 기여했고, 낭만주의자들은 경건주의 전통에서 자라났다.","뉴잉글랜드의 조나단 에드워즈는 신비주의자들의 전승을 이어받은 체험적 그리스도인으로 계몽사상을 철저히 배격하고 기독교 신앙과 계몽주의를 대립시켰다.","경건주의는 초기부터 박애사업에 힘써, 프랑케는 고아원을 세우고 진젠도르프는 난민들을 받아들였다."],"answer":3},{"id":192,"type":"mc","question":"계몽사상에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["프랑스 이신론자들은 공공연히 가톨릭교회를 비판했지만, 북아메리카의 영국 식민지의 이신론은 온건하고 소심했다.","이신론자들은 스스로를 그리스도인으로 여겼으며, 유신론과 무신론과는 구분된다.","세계 연방 수립에 의해 항구적인 평화를 성취할 수 있다는 소망을 갖고 있었다.","정치적 결론에 도달하는 데 신적인 인도가 필요 없다고 주장하였다."],"answer":1},{"id":193,"type":"mc","question":"현재 이 세계는 가능한 세계 중에서 최고의 세계라고 생각했지만 리스본 지진 후 이 세계에 대한 풍자로 《캉디드》를 저술한 사람은?","choices":["라이프니츠","볼테르","라이마투스","존 로크"],"answer":2},{"id":194,"type":"mc","question":"부흥운동 지도자에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["진젠도르프는 중세의 그리스도 수난 숭배를 당시의 언어로 표현한 것으로 생각될 수 있고, 서정시인으로 회중 찬송에 새로운 자극을 주었다.","에드워즈는 하나님은 진노의 하나님이며, 패역한 인간들을 지옥불에 넣으실 충분한 이유가 있다고 설교했다.","웨슬리의 동료 휘트필드(휫필드)는 회심과 중생한 사람들의 상호지원을 위해 속회를 조직하고 전국의 모임을 감독했다.","비케른은 독일에 장애자, 미혼모, 사생아 등 심신에 결함이 있는 모든 사람을 보살피기 위해 국내선교회를 조직했고 사회를 개조하려고 했다."],"answer":3},{"id":195,"type":"mc","question":"웨슬리에 대한 진술입니다. 틀린 것을 하나 고르시오.","choices":["가난한 자를 알았으며, 가난한 자들을 회심시켜 프롤레타리아들을 복음의 범주 안으로 끌어들였다.","코크를 북아메리카 강독으로 임명하여 국교회를 떠났고 국교회로부터 버림을 받았다.","모라비아 교도들에게 감명을 받고 런던에서 모라비아 교도 예배에 참여하다가 멜란히톤의 『로마서 주석』에 실린 루터의 서문이 낭독되는 것을 듣고 신생(新生)을 체험했다.","강단에 설 권리를 박탈당하자, 말을 타고 촌락과 광산을 찾아다니며 야외 설교를 했다."],"answer":2},{"id":196,"type":"mc","question":"19세기 해외 선교에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["가톨릭 선교의 쇠퇴는 스페인과 포르투갈 식민지 제국들의 약화에, 개신교 선교의 성장은 영국과 네덜란드의 대대적인 식민지 개척과 관련된다.","개신교의 선교는 개인 회심 체험, 일정 기간의 훈련과 시험 뒤의 교회 가입에 초점을 두었는데, 교회 가입한 다음에는 동족에게서 단절되었다.","인도와 중국에서는 기독교를 받아들인 사람들은 주로 하층민인 반면, 일본에서는 지식인들이었고 대중은 받아들이지 않았다.","기독교의 선교는 유대교, 이슬람교, 힌두교, 유교 등의 종교에 큰 타격을 주었고, 원시종교, 특히 물활론(animism)이 우세한 지역에 효과적이었다."],"answer":4},{"id":197,"type":"mc","question":"근현대 교회와 국가에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["영국에서는 성공회가, 스웨덴에서는 루터교가 국교회로 남아있을 수 있었다.","가톨릭권 국가에서는 국가는 공화정이든 사회주의로든 민주화한 반면, 교회는 구체제를 지지했기 때문에 국가가 정교분리를 강요했다.","미국에서 교회와 국가의 분리는 1830년대에 완료되었고, 그 뒤 미국에서는 교회와 분파의 구분이 사라졌고, 미국의 교회들은 교단이라 불린다.","독일 가톨릭교회는 비스마르크의 독일 통일을 적극적으로 지지하여 통일 후 큰 영향력을 행사했다."],"answer":4},{"id":198,"type":"mc","question":"근현대 가톨릭 교회에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["1864년 교황 피우스 9세는 ‘오류목록’이라는 교서에서 자유주의자들을 단죄하고, 합리주의, 사회주의, 공산주의, 정교 분리, 출판의 자유, 종교의 자유를 배척했다.","1870년 이탈리아가 통일되고 군대가 로마 시를 점령하기 직전에 바티칸 공의회는 교황무류설을 선포하고 모든 세속주의를 맹렬히 비판했다.","20세기 첫 10년에 가톨릭 학자들이 개신교권에서 유행하던 성서학 방법을 받아들였는데, 이들은 현대주의자들이라고 불렸고, 1910년 파문되어, 이후 성서학 분야에서는 가톨릭 학자들과 개신교 학자들의 차이가 크다.","교황 레오 13세는 1891년 레룸 노바룸이란 교서에서 복지국가와 노동 단체를 승인했다."],"answer":3},{"id":199,"type":"mc","question":"종교를 현대의 지식과 사상과 조화시키기 위해 노력했던 20세기 신학자들의 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["호레이스 부쉬넬은 진보의 원칙은 우주의 구조 자체에 명백히 나타나 있으며, 인간은 불가피하게 더 고등한 상태로 진행해야 한다고 주장했다.","프리드리히 슈트라우스는 창세기를 신화로 해석할 수 있듯이 복음서도 신화, 즉 영원한 진리를 감싸고 있는 종종 이야기 형태로 된 상징으로 이해하고 복음서는 예수를 가장 완전한 모범자라는 진리를 전달하기 위해 구약성경의 자료를 이야기로 구성했다고 가르쳤다.","슐라이어마허는 종교는 그리스도 안에 계시된 하나님에 대한 절대 의존감으로 이루어진다고 주장하고 도움을 받으려면 통회와 자백으로 자신의 상태와 철저한 의존감을 인정해야 한다고 주장했다.","칼 바르트는 제1차 세계대전을 계기로 자유주의 신학을 비판하고 계시, 즉 하나님의 자기 현시에 대한 신앙을 회복시켰다."],"answer":1},{"id":200,"type":"mc","question":"20세기 과학 이전 시대인 1세기 그리스도인들의 사고의 틀을 그대로 사용할 수 없으며 복음을 비신화해야 하며, 기독교의 핵심은 그리스도 사건으로 이는 절대 헌신을 요구하는 사건이며, 신앙을 갖기 위해서는 자신을 신앙에 헌신하는 모험을 해야 한다고 가르친 현대 신학자는?","choices":["칼 바르트","슐라이마허","루돌프 불트만","알브레히트 리츨"],"answer":3},{"id":201,"type":"mc","question":"19세기 부흥운동에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["옥스퍼드 운동은 소교구들의 예배를 초기 교회의 신성한 상태로 되살리려고 힘썼다.","옥스퍼드 개혁자들의 원칙을 받아들여 케임브리지 그룹은 대대적인 건축 및 전례 부흥운동을 일으켰다.","19세기 초 뉴잉글랜드에서 진행된 제2차 각성운동은 제1차 각성운동과 달리 격렬한 신체적 반응이 강조되었다.","서부 변경에서는 야영집회가 대대적으로 일어났으며, 변경 지대 사람들을 순하게 길들였다."],"answer":3},{"id":202,"type":"mc","question":"근대 이후 산업화와 인구 증가에 대한 기독교의 대응에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["윌리엄 부스는 빈민가에 들어가 남녀를 불문하고 가난한 자들을 먹이고 채워줄 보호소를 설치했다.","19세기 중엽까지 노동조합은 불법 단체였으므로 1849년 이후 5년 동안 감리교도의 3분의 1이 교회를 탈퇴하여 노동조합에 가입했는데, 그들은 복음주의 입장을 버리지 않았다.","미국에서는 월터 라우센부쉬가 사회복음 운동을 전개하였다.","독일에서는 개인의 자유를 존중하였기 때문에 국가가 아버지처럼 공공복지에 책임을 져야 한다는 사상이 뿌리내리기 어려웠다."],"answer":4},{"id":203,"type":"mc","question":"19세기 사회개혁에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["교회는 18세기 전에 전면적인 금주를 요구한 적이 없었지만, 감리교는 초창기에 광부들에게 철저한 금주를 요구했고 칼빈파 교회들은 주류 판매와 제조를 규제하도록 정부에 호소했다.","미국 북부에서 노예제도 반대 운동은 제2차 대각성운동에서 직접 유래했다.","영국령에서 노예 매매 반대운동은 감리교와 국교회에서 시작되었다.","여러 분야에서 개혁이 일어났지만, 완전한 사회질서가 수립되지 못해 사회 문제가 전혀 해결 불가능하다는 인식을 심어주었다."],"answer":4},{"id":204,"type":"mc","question":"다음과 같은 말을 남긴 사람은?\n\n주의 불을 지피소서. 제 아버지여/ 마음과 기분과 정신과 영혼이/ 주님의 입김으로 더욱 달아올라/ 주의 사랑으로 훤히 타오를 때까지","choices":["조지 폭스(퀘이커","파스칼","슈페너","진젠도르프"],"answer":4},{"id":205,"type":"mc","question":"다음과 같은 말을 남긴 사람은? \n\n새로 장식된 대수도원 교회를 생각해보라... 십자가상이 붙은 화상간막이, 벽걸이 융단, 성가대석, 프레스코 벽화로 장식된 둥근 천장, 금박 입힌 기둥머리, 원색을 잃지 않은 기둥 사이의 벽.... 본당 회중석에 꽉 들어선 수천 명의 예배자들...","choices":["웨슬리","존 메이슨 닐","윌리엄 윌버포스","윌리엄 부스(구세군)"],"answer":2},{"id":206,"type":"mc","question":"16세기 초의 교회 상황에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["교황청은 분열되고 공의회 운동이 세력을 얻고 분파주의와 이단이 성행하여 불안과 두려움이 고조되었다.","성직자 독신의 강화로 성직자 축첩 관행을 부추겼고 성직자들의 도덕적 문란을 성토하는 소리가 높았다.","십일조를 내지 않으면 파문에 처하게 되어 십일조는 혐오 대상이 되었으며, 성직 매매, 면죄부 판매, 교황청 세금에 대해 원성이 높았다.","국가 교회나 보편 교회를 지원하기 위해 소교구에 많은 금액이 징수되어 사제들은 단일 소교구에 나오는 수입으로 먹고 살 수 없었다."],"answer":1},{"id":207,"type":"mc","question":"16세기 초 스페인적 가톨릭 개혁운동에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["교리적이고 권징적인 유형으로 세밀한 신조, 규율의 강요가 강조되었다.","그리스어와 라틴어를 병기한 콤풀루툼 학파 대역성경을 편찬했다.","성직자에 대한 철저한 개혁을 단행하였고 성직자 교육을 위해 알칼라에 대학교를 신설했다.","종교생활과 의식보다 내적 경험을 강조했다."],"answer":4},{"id":208,"type":"mc","question":"종교개혁자들의 사상에 대한 서술입니다. 맞는 것을 하나 고르세요.","choices":["멜랑히톤은 루터의 오랜 동료로, 사역자는 성직복도 입지 않고, 급료도 받지 않은 채 스스로 노동으로 생계를 유지하는 평신도여야 하며, 교회 음악과 성상을 배척하고 주의 만찬을 영적으로 해석했다.","에라스무스는 루터와 자유의지에 대해 논쟁하면서 인간이 구원을 얻는데 하나님과 조금은 협력할 수 있다고 보고, 궁극적으로는 성경보다 교회의 권위에 의존했다.","토마스 뮌처는 교회의 개혁은 행정관의 동의를 구할 필요가 없고, 참 신자들의 구별된 단체를 세울 것을 주장했고, 국가를 비기독교적 제도로 배척했다.","츠빙글리는 교회가 독립된 지위를 누려야 하고, 전례 형태를 결정하고, 무엇보다 출교권을 행사해야 한다고 주장했다."],"answer":2},{"id":209,"type":"mc","question":"루터의 사상에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["모든 신자가 다 사제이며, 행정관은 직위도 영적인 지위라고 주장했다.","고해성사를 가톨릭교회의 폐해라고 보고 폐기했다.","평민은 절대로 칼을 들어서는 안 된다는 이유로 농민들의 폭력 사용을 반대했으며, 군주들에게는 무질서를 진압할 의무가 있다고 가르쳤다.","구원은 오직 믿음을 통해 하나님의 은혜를 받는 데에 달려 있다고 했다."],"answer":2},{"id":210,"type":"mc","question":"칼빈에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["신앙과 지식을 대립시키기를 거부하고, 그리스도인들은 계시에 의존하므로 흔들릴 수 없는 확신을 누릴 수 있다고 주장했다.","십자가상은 허용하지 않지만 십자가는 허용했으며, 교회에서 다른 음악은 허용하지 않지만, 시편 찬송은 허용했다.","묵시적 소망을 희석시켰지만, 대신 사회조직을 구속할 사회적 복음의 길을 열어주었다.","루터처럼 선택자들의 공동체를 세울 수 없다고 보았다."],"answer":4},{"id":211,"type":"mc","question":"재세례파에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["교회가 국가로부터 분리된, 깨달은 신자들의 자발적 사회라는 것을 강조했다.","교회의 개혁이 행정관의 동의를 기다려야 한다는 것에 반대했다.","사도 바울이 군주들을 가리켜 하나님이 죄인들을 벌하도록 세우신 자들이라고 말했으므로, 성도들도 군주가 되어 죄인들을 벌할 수 있다고 보았다.","대부분 평화주의자들로서 산상보훈의 명령을 문자적으로 받아들였다."],"answer":3},{"id":212,"type":"mc","question":"루터의 예배와 성례와 목회에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["결혼을 일반 사회의 문제라고 보는 것을 반대하고 결혼의 거룩성을 강조했다.","영혼과 육체를 분리할 수 없다고 보아 예배를 돕는 물질적인 것들을 인정했다. 따라서 루터교는 예배에 예술을 남겨두었고, 교회 내의 건축, 조각, 회화에 아무런 혁신이 없었다.","성례는 그 자체가 저절로 효력을 발휘하는 것이 아니라(ex opere operato), 성례를 받는 자의 믿음에 따라 효력을 발휘한다고 가르쳤다.","미사는 그리스도의 제사를 반복하는 것이 아니며, 그리스도의 제사는 모든 사람을 위해 단번에 치러졌으며, 미사는 신자들의 사귐이므로 사제 혼자만 참석하는 죽은 자들을 위한 미사는 없애야 한다고 주장했다."],"answer":1},{"id":213,"type":"mc","question":"금식일을 폐지하고 대성당에서 성상을 제거했고 벽들을 하얗게 칠하고 오르간을 폐쇄한 개혁자는?","choices":["루터","츠빙글리","칼빈","뮌처"],"answer":2},{"id":214,"type":"mc","question":"영국의 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["헨리 8세는 왕을 수장으로 하는 독립된 영국 국교회를 세웠다.","헨리 8세는 성경을 영어로 번역하여 모든 교회에 영어 성경을 사용하도록 명령했다.","에드워드 6세때에는 전례를 영어로 번역하여 공동기도서가 출판되었다.","영국의 종교개혁은 철저하게 루터교쪽으로 진행되었다."],"answer":4},{"id":215,"type":"mc","question":"가톨릭 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세오.","choices":["트렌트 공의회는 전승과 성경을 나란히 두었으며, 불가타 역본을 유일하게 권위 있는 역본으로 선포했다.","트렌트 공의회는 신자가 축적된 공로를 통해 자신의 구원에 협력할 수 있다고 정의했고, 연옥 교리를 그대로 두었다.","트렌트 공의회는 에라스무스의 정신을 이어 인문주의자들을 성경 번역에 활용하였다.","1540년 예수회는 교황의 승인을 받았고, 유럽을 이단으로부터 되찾고 신세계를 개종시키기 위한 교황청의 “군대”가 되었고, 혁명, 심지어 종교적 목적 하의 군주 살해까지 정당화했다."],"answer":3},{"id":216,"type":"mc","question":"신앙고백 시대에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["1555년 아우그스부르크 평화회의가 열려 영토 원칙에 따라 루터교를 승인하였다. 이로써 “하나의 제국에, 하나의 종교”라는 큰 틀이 무너졌다.","가톨릭과 프로테스탄트 진영의 투쟁은 온건파 숙청으로 이어졌다.","1648년 베스트팔렌 조약은 영토 원칙에서 벗어나 개인의 신앙 자유를 인정했다.","프로테스탄트 교도들도 재세례파를 물에 빠뜨려 죽였고 반삼위일체주의자를 참수와 화형으로 처단했다."],"answer":3},{"id":217,"type":"mc","question":"다음은 영국 종교개혁의 진행과정에 일어난 사건들입니다. 이 사건들을 일어난 순서대로 배열한 것의 번호를 고르세요. \n\n가) 엘리자베드 여왕의 일치령\n나) 로드의 청교도 탄압\n다) 헨리 8세의 수장령\n라) 명예혁명과 관용령\n마) 웨스트민스터 개혁 의회\n바) 크롬웰의 독재\n사) 메리 여왕의 개신교 박해","choices":["다-나-마-가-바-사-라","다-사-나-가-바-마-라","다-사-가-나-마-바-라","다-사-나-마-바-가-라"],"answer":3},{"id":218,"type":"mc","question":"유럽 각국의 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["프랑스에서는 수많은 전쟁과 학살 후에 1598년 낭트 칙령으로 위그노는 특정 도시들에서 자유롭게 예배하도록 허락받았으며, 위그노들은 공직에 오를 자유도 있었다.","낙스는 1560년에 스코틀랜드 의회가 칼빈주의를 채택하도록 했으며, 장로교는 스코틀랜드의 국교가 되었다.","네덜란드에서는 윌리엄이 스페인의 압제에 대해 반란군을 일으키고 북부 지방을 차지하여 1581년 독립을 선포하였으며, 가톨릭 교도들, 루터교도들, 칼빈주의자들, 심지어 메노파에게까지 신앙의 자유를 허용했다.","영국 국교회는 국민들에게 하나의 믿음을 강조했지만, 예배와 교회 정치는 자유롭게 선택할 수 있도록 인정했다."],"answer":4},{"id":219,"type":"mc","question":"영국 청교도의 여러 분파에 대한 설명입니다. 틀린 것울 하나 고르세요","choices":["장로파는 주교제와 공동기도서를 배척하고 정치적인 면에서 입헌군주제를 선호했다.","독립파의 교회조직은 회중제였고, 지교회 위에는 주교도, 총회도, 노회도 없었으므로, 권징과 출교는 거의 강조되지 않았다.","침례파는 네덜란드에서 메노파와 접촉하면서 유아세례가 자신들의 교회관과 일치되지 않는다고 확신했다.","친우회(퀘이커교)는 성령이 문자를 초월하신다고 하여 성령을 강조했다."],"answer":2},{"id":220,"type":"mc","question":"프랑스 종교개혁에 대한 진술입니다. 틀린 것을 골라 번호를 쓰세요.","choices":["개신교 사상은 하층민을 중심으로 전파되어 프랑스 귀족 사회에 큰 물의를 일으켰다.","성 바돌로매 축일에 파리와 대도시에서 수천 명의 위그노가 학살되었다.","1598년 낭트 칙령은 위그노가 프랑스 전역에서 자유롭게 예배하도록 허락했다.","1685년 낭트 칙령이 폐지되자 위그노는 복종이나 추방을 선택하도록 강요되었다."],"answer":3},{"id":221,"type":"mc","question":"신앙고백 시대의 예배, 성례, 목회, 영성에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["엘리자베스 여왕은 주교제, 왕의 수장권, 공동기도서를 의무적으로 받아들이도록 했다","1633년 캔터베리 대주교로 임명된 윌리엄 로드는 교리에는 자유가, 정치 조직과 전례에는 일치가 있어야 한다고 믿었다.","메이플라워 계약에 따르면 모든 성도가 교회의 회원이 될 수 있었으며, 공직에 오르고 고위직 선출에 투표할 수 있었다.","친우회의 창시자 폭스는 전례도 성례도 음악도 성소도 모두 없애자고 주장했다."],"answer":3},{"id":222,"type":"mc","question":"청교도들에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["신대륙에 정착한 청교도들(순례조부들)은 영토 원칙을 폐기하고 관용과 신앙의 자유를 인정했다.","청교도는 초기 칼빈파처럼 자본주의의 성장에 기여했다는 평가를 받았다. 그들은 근면, 성실, 검소, 정직으로 번영했고, 약속을 반드시 지켰기 때문에 자본주의 발전에 기여했다.","삼림이 개간되고 공유지를 사유화하여 가난이 극심했을 때 청교도 평신도들은 구호금을 전달하고 빈민을 교육하고 사회에 복귀하는데 앞장섰다.","하나님께 서로 헌신하는 것이 부부의 덕목이 되었기 때문에 결혼은 하나의 이상을 실현하기 위한 동역 관계가 되었다."],"answer":1},{"id":223,"type":"mc","question":"18세기에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["계몽사상은 신앙고백주의에 대한 반동이었다.","18세기에는 상대적으로 평화로운 시대였고 전쟁을 비판하는 문학이 성행하고 평화를 위한 계획이 수립되었다.","계몽사상은 미신 추방운동으로 마녀 사냥을 종식시켰고, 자연법과 인류에 대한 이상은 민주주의의 토대가 되었고 자유, 평등, 박애의 구호는 농노 해방과 노예 해방에 기여했다.","부흥운동은 철저히 계몽사상과 대립적으로 이해할 수 있다."],"answer":4},{"id":224,"type":"mc","question":"18세기 부흥운동에 대한 서술입니다. 틀린 것을 하나 고르세오.","choices":["부흥운동은 부분적으로는 계몽주의의 건조한 사색과 이완된 윤리에 대한 반작용으로, 그리고 프로테스탄트 신스콜라주의라는 정직된 보수주의에 대한 반작용으로 일어났다.","경건주의는 독일 민족주의에 기여했고, 낭만주의자들은 경건주의 전통에서 자라났다.","웨슬리는 영국 국교회에서 감리교회를 독립시켜 새로운 교회를 세웠다.","부흥운동은 신앙고백시대 이전의 체험적 종교의 뿌리로 돌아갔다."],"answer":3},{"id":225,"type":"mc","question":"이신론에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["이신론은 인격적 하나님, 역사를 통해서 자신을 나타내시고 인간사에 관심을 가진 하나님과 함께, 천체를 운행하고 별들이 조화롭게 돌 수 있도록 배려한 우주의 조물주로서의 하나님을 강조했다.","이신론자들은 스스로를 그리스도인으로 여겼으며, 유신론과 무신론과는 구분된다.","프랑스 이신론자들은 공공연히 가톨릭교회를 비판했지만 영국의 이신론은 온건하고 소심했다.","이신론의 목적은 미신을 추방하고 이를 합리적 신앙으로 대체하여 사람이 공허한 피조물로 전락하지 않도록 하려는 것이었다."],"answer":1},{"id":226,"type":"mc","question":"계몽사상가에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["라이프니츠는 하나님의 작품인 자연을 통해 하나님의 정신을 알 수 있다고 주장했다.","볼테르는 현재 이 세계는 가능한 세계 중에서 최고의 세계라고 생각했지만 리스본 지진 후 이 세계에 대한 풍자로 《캉디드》를 저술했다.","라이마루스는 부활은 속임수이며 따라서 기독교는 사기에 의해 출발했다고 이해했다.","존 로크는 정신은 생득적 개념은 없고 경험으로부터 출발해서 진리를 탐구해야 한다고 강조했다."],"answer":1},{"id":227,"type":"mc","question":"18세기 부흥운동 지도자에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["진젠도르프의 신앙은 계층과 신조를 초월했으며, 모라비아에서 온 후스파 난민들이나 슐레지엔에서 온 슈벤크펠트파를 받아들이고 심지어 프랑스인 가톨릭 추기경과도 친하게 지냈다.","웨슬리는 강단에 설 권리를 박탈당하자, 말을 타고 촌락과 광산을 찾아다니며 야외 설교를 했다.","웨슬리는 가난한 자를 알았으며, 가난한 자들을 회심시켜 프롤레타리아들을 복음의 범주 안으로 끌어들였다.","뉴잉글랜드의 조나단 에드워즈는 신비주의자들의 전승을 이어받은 체험적 그리스도인으로 계몽사상을 철저히 배격하고 기독교 신앙과 계몽주의를 대립시켰다."],"answer":4},{"id":228,"type":"mc","question":"18세기 부흥운동에 나타난 영성과 경건에 대한 진술입니다. 틀린 것을 하나 고르시오.","choices":["경건주의의 기원은 중세 말 에크하르트와 타울러로 거슬러 올라가지만, 좀 더 직접적인 선구자는 카스파르 슈벤크펠트였다.","아우구스트 프랑케의 경건은 중세의 그리스도 수난 숭배를 당시의 언어로 표현한 것으로 생각될 수 있고, 서정시인으로 회중 찬송에 새로운 자극을 주었다.","웨슬리는 모라비아 교도들에게 감명을 받고 런던에서 모라비아 교도 예배에 참여하다가 멜란히톤의 『로마서 주석』에 실린 루터의 서문이 낭독되는 것을 듣고 신생(新生)을 체험했다.","조나단 에드워즈는 하나님은 진노의 하나님이시며, 하나님은 패역한 인간을 지옥불에 던져 넣을 충분한 이유가 있지만 참으시고 인간들에게 또 한 번의 기회를 주신다고 설교했다."],"answer":2},{"id":229,"type":"mc","question":"19세기 해외 선교에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["가톨릭 선교의 쇠퇴는 스페인과 포르투갈 식민지 제국들의 약화에, 개신교 선교의 성장은 영국과 네덜란드의 대대적인 식민지 개척과 관련된다.","가톨릭 선교사들은 공동체성을 강조했고, 개신교 선교사들은 개인의 회심을 강조했다.","개신교 선교는 성경 번역을 강조했고, 현지 문학, 연극, 음악, 건축을 배우고 보전하려고 했으며 수많은 방언에 문자를 만들어 주었다.","선교사들은 식민지 정부에 대해 비판적이었고, 어느 형태로든 협력을 거절했다."],"answer":4},{"id":230,"type":"mc","question":"근현대 교회와 국가에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["스코틀랜드에서는 장로교회가 국교였는데, 교회를 국가의 통제로부터 해방시키기 위해 1843년 토마스 찰머스를 중심으로 자유교회를 세웠다.","러시아에서는 공산주의 혁명 전까지 교회가 국가에 대해서 상당한 독립성을 유지할 수 있었다.","이탈리아에서는 교회가 교회령을 잃을까 염려하여 통일을 반대하였고 1929년 정교협약에 의해 바티칸에 대한 정치적 주권을 되찾았지만, 성직자 급여는 국가에 의해 지불되어 국가의 통제를 받았다.","히틀러가 28개 개신교 지역 교회들을 묶어 하나의 국가교회를 결성한 직후부터 4천 명의 개신교 목사는 고백교회를 결성하고 1934년 바르멘 선언을 통해 총통이 하나님 말씀 위에 설 수 없다고 선언했다."],"answer":2},{"id":231,"type":"mc","question":"20세기 미국의 교회와 국가의 관계에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["미국에선 식민지 시대에 다양한 교단들이 각기 자기들의 지역을 중심으로 국교회 역할을 했다.","정치 판도의 변화, 새로운 이민, 무역과 공동 방위의 필요로 인해 국교회 체제가 약화되었고 다른 교파들이 관용되었으며, 교단 간의 차이도 줄어들었다.","미국의 헌법 제정자들은 국가가 초자연적 질서에 속한다는 것을 강조했으며, 어떠한 교파도 연방의 국교회가 되지 못하도록 정했다.","교회와 국가의 분리는 1830년대에 완료되었고, 그 뒤 미국에서는 교회와 분파의 구분이 사라졌고, 미국의 교회들은 교단이라 불린다."],"answer":3},{"id":232,"type":"mc","question":"종교는 그리스도 안에 계시된 하나님에 대한 절대 의존감으로 이루어진다고 주장하고 도움을 받으려면 통회와 자백으로 자신의 상태와 철저한 의존감을 인정해야 한다고 주장하여 당시 세속화된 지식인들에게 낭만주의자들의 언어로 루터의 신학을 전했다고 평가되는 자는?","choices":["쉴라이에르마하","프리드리히 슈트라우스","칼 바르트","루돌프 불트만"],"answer":1},{"id":233,"type":"mc","question":"종교를 현대의 지식과 사상과 조화시키기 위해 노력했던 30세기 신학자들에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["칼 바르트는 제1차 세계대전을 계기로 자유주의 신학을 비판하고 계시, 즉 하나님의 자기 현시에 대한 신앙을 회복시켰다.","테아르 드 샤르댕은 투쟁보다는 사랑의 생명의 법칙이며, 진화 과정이 육체의 차원을 초월하는 더 고상한 삶의 형태를 향해 솟아나며, 우주 자체를 일종의 성사, 즉 보이지 않은 은혜의 보이는 상징으로 해석하여 과학과 신앙을 융합시켰다.","알브레히트 리츨은 형이상학과 궁극적 대답의 가능성에 절망한 뒤, 역사로, 그리스도의 지상 생애에 관해 우리가 알 수 있는 것으로 돌아가자고 제안하여 자유주의 신학의 기초를 놓았다.","폴 틸리히는 20세기 과학 이전 시대인 1세기 그리스도인들의 사고의 틀을 그대로 사용할 수 없으며 복음을 비신화해야 하며, 기독교의 핵심은 그리스도 사건으로 이는 절대 헌신을 요구하는 사건이며, 신앙을 갖기 위해서는 자신을 신앙에 헌신하는 모험을 해야 한다고 가르쳤다."],"answer":4},{"id":234,"type":"mc","question":"옥스퍼드 운동에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["소교구들의 예배를 초기 교회의 신성한 상태로 되살리려고 힘썼다.","모든 사람들을 포괄하려는 광교회의 이상에 반대하고 교회는 역사적 증거, 신조들 등 사도들의 계승자들이 전수해온 유산을 회복해야 한다고 주장했다.","소교구들의 부흥을 일으키려면 국가에 종속되어 있는 현실을 타파해야 한다고 생각했다.","기독교력(교회력)을 비판했으며, 하나님이 제정하신 성일은 안식일뿐이라고 주장했다."],"answer":4},{"id":235,"type":"mc","question":"근대 이후 산업화와 인구 증가에 대한 기독교의 대응에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["도시 빈민 사역은 처음으로 구세군에 의해 시도되었다.","감리교인들은 노동운동에 적극적으로 참여하여 20세기 영국에 파시스트 혁명이 일어나지 않게 한 하나의 이유로 손꼽힌다.","독일에서는 개인의 자유를 존중하였기 때문에 국가가 아버지처럼 공공 복지에 책임을 져야 한다는 사상이 뿌리내리기 어려웠다.","가톨릭 교회는 오랜 협력의 전통을 가지고 있어서 복지국가의 이념을 받아들이기 쉬웠다. 케텔러는 자유주의를 비판했고, 교황 레오 13세는 “레룸 노바룸”이라는 노동문제에 대한 교서를 발표했다.."],"answer":3},{"id":236,"type":"mc","question":"19세기 사회개혁에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["영국에서는 노예 매매 반대 운동이 감리교와 국교회에서 시작되었다.","뉴잉글랜드의 청교도들은 1812년 전쟁이 끝난 뒤에야 비로서 반전운동에 참여했다.","식민지 아메리카에서 노예제도에 대한 저항은 퀘이커 교도로부터 시작되었다.","19세기 중엽까지 노동조합은 불법 단체였으므로 1849년 이후 5년 동안 감리교도의 3분의 1이 교회를 탈퇴하여 노동조합에 가입했고, 이로써 영국에서 노동운동은 탈기독교화되었다."],"answer":4},{"id":237,"type":"mc","question":"다음과 같은 말을 남긴 사람은?\n\n그리스도인들의 하나님은 단순히 기하학적 진리들로 이루어진 이론인 신이 아니다. 그것은 이교도들의 신이다. 하나님은 섬기는 자들에게 복을 주는 그런 하나님이 아니다. 그것은 유대인들의 신이다. 그리스도인들의 하나님은 사랑과 성결의 하나님이시오, 인간에게 자신의 철저한 비참함과 하나님의 무한한 자비를 느끼게 하시는 하나님이시오, 친히 그들의 존재 근거가 되사 그들에게 겸손과 기쁨과 확신과 사랑을 가득 채워 주시는 하나님이시다.","choices":["조지 폭스(퀘이커)","파스칼","슈페너","진젠도르프"],"answer":2},{"id":238,"type":"mc","question":"다음과 같은 말을 남긴 사람은? \n\n우리는 뜨거운 구원 집회를 연다... 즐겁고 편하고 쉬운 사귐의 밤이다. 소녀들은 벤조와 템버린을 연주하고, 런던에서 보게 되는 활기찬 집회가 두어 시간 지속된다. 짧고 분명하게 드리는 기도 시간이 있고, 다음에 설교 시간이 오는데, 더러는 집회 지도자들이 맡지만, 대부분은 지난 번 집회에서 구원받은 사람들의 간증... 개인 체험을 바탕으로 한 간단한 고백으로 진행된다... 우리는 지금 런던에서 수천 명의 극빈자들을 수용하고 있는데, 그들 중 다수가 전과자, 거지, 떠돌이로서 만물의 찌기에 해당하는 사람들이다.","choices":["웨슬리","조나단 에드워즈","윌리엄 윌버포스","윌리엄 부스(구세군)"],"answer":4},{"id":239,"type":"mc","question":"다음은 제임스 앤서니 프루드가 쓴 글이다. 이는 누구를 존경하여 쓴 글인가?\n\"그는 언제나 다른 참석자들보다 공통된 대화 주제들을 더 잘 알고 있는 듯했다…화자로서 그의 특징은 짐짓 재치있는 말이나 인상적인 말을 하지 않은 데 있을 것이다. 그는 풍자는 해도 독설은 입밖에 내지 않았다. 악의가 담김 일화를 그에게서 들어본 적이 없다. 그는 단조로움을 참지 못했다. 그는 빛 자체였다. 융통성 넘치는 빛 말이다….그의 설교는 독특한 착상을 바탕으로 한 시로서, 정교해서 마음이 끌리고, 진지해서 반갑고, 독창적이러서 흥미로웠다.\"","choices":["존 케이블","존 헨리 뉴먼","조나단 에드워드","윌프레드 워드"],"answer":2},{"id":240,"type":"mc","question":"다음은 매튜 아놀드의 글이다. 누구를 존경하여 쓴 글인가?\n\"성 메리 대성당의 측량으로 비치는 희미한 오후 햇살을 타고 소리없이 들어와 강단에서 일어나, 정교하고 정겹고 애처로운 종교 음악과 같은 말과 생각으로 침묵을 깨뜨리는 지극히 황홀한 음성으로 파문져 나가는 그 영적인 환영의 매력을 누가 거절할 수 있었겠는가? 내 귓가에는 여전히 그의 음성이 쟁쟁하다: \"세상살이의 열정이 식고, 고단함과 아픔도 접고, 투쟁과 낙심도 끝나고, 음울함과 성마름도 끝나고, 싸워 이기는 일도 끝나고, 이 고통스럽고 불건강한 상태에서 생기는 온갖 변화와 우연도 끝나면, 마침내 죽음이 찾아옵니다. 마침내 하나님의 흰 보좌 앞에 서게 됩니다. 마침내 지복직관에 이릅니다.\"","choices":["제임스 앤서니 프루드","존 헨리 뉴먼","장 칼뱅","윌리엄 윌버포스"],"answer":2},{"id":241,"type":"mc","question":"20세기 해외선교에 대한 다음의 보기 중 틀린 것을 고르시오.","choices":["19세기 방대한 확장을 주도한 세력은 개신교도들이었다","카톨릭 선교사들은 16세기에 정치적 지원 없이도 일본에 들어가 폭넓은 수확을 거두었다.","본토 문화를 수용하는데 있어서 카톨릭은 개인의 회심, 훈련과 시험을 강조했으며그렇게 가입한 회심자가 동족에게 단절되는 일이 있었다.","원주민들의 관습에 관해서 선교사들은 인도에서 남편이 죽으면 아내를 산 체로 함께 화장하는 순장 제도에 반대했다."],"answer":3},{"id":242,"type":"mc","question":"미국의 지역별 국교회 중 바르게 연결되지 않은 것을 고르시오","choices":["뉴저지 - 네덜란드 개혁교회","펜실베이나 - 퀘이커교","메릴랜드-카톨릭","로드 아일랜드-침례교"],"answer":1},{"id":243,"type":"mc","question":"다음 중 틀린 설명을 고르시오","choices":["허버트 스펜서는 사후의 유일한 환셩은 하나님이며 하나님과 교통할 수 있는 자들만 살아남을 수 있다는 조건적 불멸 이론을 주장했다.","뉴먼 스미스는 진보란 생명의 법칙이고, 육체적 진화가 이제 그 한계에 도달했으므로, 육체에는 더 이상 발전이 없을 것이며, 진화 과정은 무덤 저편에서 절정에 달할 것이라고 말했다.","프리드리히 슈트라우스는 그리스도 안에 계시된 하나님께 대한 의존감을 말했다. 그는 당시의 세속화한 지식인들에게 낭만주의자들의 언어로 루터의 신학을 전하고 있었다.","알브레히트 리츨은 형이상학과 궁극적 대답들의 가능성에 절망한 뒤 역사로, 그리스도의 지상 생애에 관해 우리가 알 수 있는 것으로 돌아가자고 요구했다."],"answer":3},{"id":244,"type":"mc","question":"다음은 제2바티칸 공의회에 관한 설명이다. 틀린 것을 한 개 고르시오.","choices":["성경연구를 확대하였다.","에큐매니즘에 적극 참여하였다.","교회론을 재정립했다.","성경의 언어를 자국어로 바꾸는 것을 금지했다."],"answer":4},{"id":245,"type":"mc","question":"1910년에 열린 선교대회로 WCC의 기원으로 인정받는 선교대회는 무엇인가?","choices":["로잔 대회","에딘버러 선교대회","로이엔베르크 연합대회","제2차 바티칸 공의회"],"answer":2},{"id":246,"type":"mc","question":"다음과 같은 말을 한 사람은 누구인가?\n\"… 하지만 하나님이 영광을 받는다면 사제와 원숭이들이 기독교교회를 대표하는 일이 더 오래 일어나서는 안 된다. 오히려 하나님의 말씀이 선택한 친구들이 바울이 가르치듯이 예언하기를 배워, 그들이 하나님이 모든 선택 받은 자들에게 얼마나 친근하게 말씀하는지를 참으로 경험해야 한다. 그러한 말씀을 공적으로 알리기 위해 나는 나의 삶을 하나님의 뜻에 드릴 준비가 되어 있다. 하나님은 그분이 선택한 자들에게, 특별히 이 땅에서 놀라운 일들을 행할 것이다. 왜냐하면 새로운 교회는 여기서 시작하며 이 민족이 전 세계의 거울[과 본보기]가 될 것이다. 그리하여 나는 하나님의 말씀이 보호될 수 있도록 도우라고 모든 사람에게 호소한다. \"","choices":["루터","츠빙글리","장 칼뱅","토마스 뮌처"],"answer":4},{"id":247,"type":"mc","question":"1523년 9월, 독일 바이에른의 잉골슈타트대학에서 18세의 젊은 학생 아르사키우스 제호퍼가 자신의 개혁신앙을 철회한 일에 대한 비판으로 공개토론을 요구한 여성 종교개혁가는 누구인가?","choices":["올림피아 모라타","잔 달브레","아르굴라 폰 그룸바흐","마르가리타 드 나바라"],"answer":3},{"id":248,"type":"mc","question":"다음 중 트렌트 공의회에 대한 설명으로 틀린 것은?","choices":["연옥교리의 문제점을 파악하고 이를 수정했다.","성경의 불가타 역본을 모든 논쟁에서 사용하되 문제를 제기할 수 없는 유일하게 권위 있는 역본으로 선포했다.","믿음으로만 의롭다 함을 얻는다는 이신칭의와 상반되게, 신자가 여전히 축적된 공로들을 통해서 자신의 구원에 협력할 수 있다고 정의했다.","성직자의 복수 점유를 금했고, 교육 개선안을 제시했으며, 면죄부 교리는 유지하되 그에 따른 경제적 폐습은 바로잡았다."],"answer":1}];

const LABEL = ["①","②","③","④"];
let filter = "all";
let quizQ = [], current = 0, selected = null, revealed = false;
let results = [];
let score = 0;


let currentMode = 'all';   // all | original | new | era
let currentEra = 'all_era';

function setMode(m) {
  currentMode = m;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  const eraSub = document.getElementById('era-subtabs');
  if (m === 'era') {
    eraSub.classList.add('show');
  } else {
    eraSub.classList.remove('show');
  }
  updatePool();
}

function setEra(e) {
  currentEra = e;
  document.querySelectorAll('.era-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  updatePool();
}

function updatePool() {
  let pool = [];
  if (currentMode === 'all') {
    pool = [...QUESTIONS, ...NEW_QUESTIONS];
  } else if (currentMode === 'original') {
    pool = [...QUESTIONS];
  } else if (currentMode === 'new') {
    pool = [...NEW_QUESTIONS];
  } else if (currentMode === 'era') {
    const allEra = [...QUESTIONS, ...NEW_QUESTIONS];
    if (currentEra === 'all_era') {
      pool = allEra;
    } else {
      // 기출 문제에 era 태그 매핑
      const eraMap = {
        reformation1: q => (q.era === 'reformation1') || (!q.era && q.id >= 1 && q.id <= 42),
        confession:   q => (q.era === 'confession')   || (!q.era && q.id >= 43 && q.id <= 100),
        enlightenment:q => (q.era === 'enlightenment')|| (!q.era && q.id >= 101 && q.id <= 162),
        modern:       q => (q.era === 'modern')        || (!q.era && q.id >= 163)
      };
      pool = allEra.filter(eraMap[currentEra] || (() => false));
    }
  }
  // 유형 필터 적용
  if (filter === 'mc') pool = pool.filter(q => q.type === 'mc');
  if (filter === 'ox') pool = pool.filter(q => q.type === 'ox');

  const total = pool.length;
  const slider = document.getElementById('count-slider');
  slider.max = total || 1;
  document.getElementById('range-max').textContent = total;
  const cur = parseInt(slider.value);
  if (cur > total) { slider.value = total; updateCount(total); }

  const modeLabel = {all:'전체', original:'기출', new:'예상변형', era:'시대별'}[currentMode];
  document.getElementById('home-sub').textContent =
    `기말고사 모의고사 · ${modeLabel} ${total}문제`;

  return pool;
}

function getPool() {
  return updatePool();
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === f));
  updatePool();
  /* keep slider */
}

function updateCount(v) {
  document.getElementById("count-display").textContent = v;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz() {
  const pool = getPool();
  const n = parseInt(document.getElementById("count-slider").value);
  quizQ = shuffle(pool).slice(0, Math.min(n, pool.length));
  current = 0; selected = null; revealed = false; results = []; score = 0;
  show("quiz");
  renderQuestion();
}

function show(id) {
  ["home","quiz","review"].forEach(s => document.getElementById(s).style.display = s===id ? (s==="home"?"flex":"block") : "none");
}

function goHome() { show("home"); }

function renderQuestion() {
  const q = quizQ[current];
  const isOX = q.type === "ox";
  selected = null; revealed = false;

  document.getElementById("q-counter").textContent = `${current+1} / ${quizQ.length}`;
  document.getElementById("score-badge").textContent = `${score} 정답`;
  document.getElementById("progress-fill").style.width = `${(current/quizQ.length)*100}%`;

  const badge = document.getElementById("type-badge");
  badge.className = "type-badge " + (isOX ? "type-ox" : "type-mc");
  const isNew = q.era !== undefined;
  badge.textContent = isOX ? "O / X" : "객관식";
  if (isNew) {
    badge.innerHTML += ' <span class="new-badge">예상변형</span>';
  }

  const qtext = isOX ? q.question.replace(/^\(OX 문제\) /, "") : q.question;
  document.getElementById("q-text").textContent = qtext;

  // choices vs OX
  document.getElementById("choices").style.display = isOX ? "none" : "block";
  document.getElementById("ox-btns").style.display = isOX ? "flex" : "none";

  if (!isOX) {
    const div = document.getElementById("choices");
    div.innerHTML = "";
    q.choices.forEach((ch, i) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.innerHTML = `<span class="choice-label">${LABEL[i]}</span><span style="flex:1">${ch}</span><span class="choice-mark"></span>`;
      btn.onclick = () => selectChoice(i);
      div.appendChild(btn);
    });
  } else {
    document.getElementById("ox-o").className = "ox-btn";
    document.getElementById("ox-x").className = "ox-btn";
  }

  const fb = document.getElementById("feedback");
  fb.style.display = "none"; fb.className = "feedback";
  document.getElementById("explanation").classList.remove("show");
  document.getElementById("explanation").textContent = "";
  document.getElementById("btn-explain").classList.remove("show");

  document.getElementById("btn-confirm").style.display = "block";
  document.getElementById("btn-confirm").disabled = true;
  document.getElementById("btn-next").style.display = "none";
}

function selectChoice(i) {
  if (revealed) return;
  selected = i;
  document.querySelectorAll(".choice-btn").forEach((b, idx) => {
    b.classList.toggle("selected", idx === i);
  });
  document.getElementById("btn-confirm").disabled = false;
}

function selectOX(v) {
  if (revealed) return;
  selected = v;
  document.getElementById("ox-o").className = "ox-btn" + (v==="O" ? " selected" : "");
  document.getElementById("ox-x").className = "ox-btn" + (v==="X" ? " selected" : "");
  document.getElementById("btn-confirm").disabled = false;
}

function confirmAnswer() {
  if (selected === null) return;
  revealed = true;
  const q = quizQ[current];
  const isOX = q.type === "ox";
  const correct = isOX ? selected === q.answer : selected === q.answer - 1;

  if (correct) score++;
  results.push({ qid: q.id, correct, selected, answer: q.answer });

  if (isOX) {
    const correctVal = q.answer;
    ["O","X"].forEach(v => {
      const el = document.getElementById("ox-" + v.toLowerCase());
      el.classList.remove("selected");
      if (v === correctVal) el.classList.add("correct");
      else if (v === selected) el.classList.add("wrong");
    });
  } else {
    document.querySelectorAll(".choice-btn").forEach((b, i) => {
      b.classList.remove("selected");
      const mark = b.querySelector(".choice-mark");
      if (i === q.answer - 1) { b.classList.add("correct"); mark.textContent = "✓"; }
      else if (i === selected) { b.classList.add("wrong"); mark.textContent = "✗"; }
      b.classList.add("revealed");
    });
  }

  const fb = document.getElementById("feedback");
  fb.style.display = "block";
  fb.className = "feedback " + (correct ? "correct" : "wrong");
  if (correct) {
    fb.textContent = "✓ 정답입니다!";
  } else {
    const ans = isOX ? q.answer : LABEL[q.answer-1];
    fb.textContent = `✗ 오답 — 정답: ${ans}`;
  }

  document.getElementById("score-badge").textContent = `${score} 정답`;
  document.getElementById("btn-confirm").style.display = "none";

  // 해설 처리
  const expEl = document.getElementById("explanation");
  const btnExp = document.getElementById("btn-explain");
  expEl.classList.remove("show");
  btnExp.textContent = "💡 오답 해설 보기";
  const expText = EXPLANATIONS[q.id];
  if (!correct && expText) {
    expEl.textContent = expText;
    btnExp.classList.add("show");
  } else {
    btnExp.classList.remove("show");
    expEl.textContent = "";
  }

  const btnNext = document.getElementById("btn-next");
  btnNext.style.display = "block";
  btnNext.textContent = current+1 >= quizQ.length ? "결과 보기 →" : "다음 문제 →";
}

function nextQuestion() {
  if (current + 1 >= quizQ.length) {
    showReview();
  } else {
    current++;
    renderQuestion();
  }
}

function showReview() {
  show("review");
  const total = results.length;
  const pct = Math.round((score/total)*100);
  const wrong = results.filter(r => !r.correct);
  document.getElementById("result-emoji").textContent = pct>=80?"🎉":pct>=60?"💪":"📖";
  document.getElementById("result-score").textContent = pct + "점";
  document.getElementById("result-sub").innerHTML =
    `${total}문제 중 <span class="ok">${score}개</span> 정답 · 오답 <span class="bad">${wrong.length}개</span>`;

  const list = document.getElementById("wrong-list");
  list.innerHTML = "";
  if (wrong.length > 0) {
    const title = document.createElement("p");
    title.className = "wrong-title"; title.textContent = "✗ 틀린 문제 복습";
    list.appendChild(title);
    wrong.forEach(r => {
      const q = quizQ.find(q => q.id === r.qid);
      if (!q) return;
      const div = document.createElement("div");
      div.className = "wrong-item";
      const qtxt = q.question.replace(/^\(OX 문제\) /, "");
      if (q.type === "mc") {
        div.innerHTML = `<p class="wrong-q">${qtxt.replace(/</g,"&lt;")}</p>` +
          q.choices.map((ch, i) => {
            const isC = i === q.answer-1;
            const isW = i === r.selected;
            const cls = isC ? "correct" : isW ? "wrong" : "";
            const mark = isC ? " ✓" : (isW ? " ✗" : "");
            return `<div class="review-choice ${cls}"><span style="font-weight:700;min-width:18px">${LABEL[i]}</span><span style="flex:1">${ch.replace(/</g,"&lt;")}${mark}</span></div>`;
          }).join("") + (EXPLANATIONS[q.id] ? `<div class="wrong-explanation">💡 ${EXPLANATIONS[q.id].replace(/</g,"&lt;")}</div>` : "");
      } else {
        div.innerHTML = `<p class="wrong-q">${qtxt.replace(/</g,"&lt;")}</p>` +
          `<div class="review-ox">` +
          ["O","X"].map(v => {
            const isC = v === q.answer;
            const isW = v === r.selected;
            const cls = isC ? "correct" : (isW && !isC ? "wrong" : "");
            return `<div class="review-ox-btn ${cls}">${v}</div>`;
          }).join("") +
          `</div>` + (EXPLANATIONS[q.id] ? `<div class="wrong-explanation">💡 ${EXPLANATIONS[q.id].replace(/</g,"&lt;")}</div>` : "");
      }
      list.appendChild(div);
    });
  }
}

// Init
(function() {
  updatePool();
})();
</script>
