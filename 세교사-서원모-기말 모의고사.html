<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계교회사 모의고사</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    color: #e2e8f0;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 20px; }

  /* HOME */
  #home {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 24px;
  }
  .home-card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 480px; width: 100%;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
  }
  .cross { font-size: 48px; margin-bottom: 12px; }
  .home-title { color: #e8d5a3; font-size: 24px; font-weight: 700; margin-bottom: 4px; letter-spacing: 1px; }
  .home-sub { color: #7a9bb5; font-size: 13px; margin-bottom: 32px; }

  .filter-btns { display: flex; gap: 8px; margin-bottom: 24px; justify-content: center; flex-wrap: wrap; }
  .filter-btn {
    padding: 8px 16px; border-radius: 20px; font-size: 12px;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
    border: 2px solid rgba(255,255,255,0.12);
    background: transparent; color: #7a9bb5;
  }
  .filter-btn.active {
    border-color: #e8d5a3;
    background: rgba(232,213,163,0.12);
    color: #e8d5a3;
  }

  .count-label { color: #a0b4c8; font-size: 13px; display: block; margin-bottom: 10px; }
  .count-val { color: #e8d5a3; font-weight: 700; }
  input[type=range] { width: 100%; accent-color: #e8d5a3; margin-bottom: 4px; }
  .range-minmax { display: flex; justify-content: space-between; color: #4a6a82; font-size: 11px; }

  .btn-start {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #c9a227, #e8d5a3);
    color: #1a1a2e; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 20px rgba(201,162,39,0.3);
    margin-top: 8px; transition: transform 0.1s;
  }
  .btn-start:active { transform: scale(0.98); }

  /* QUIZ */
  #quiz { display: none; }
  .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .btn-back { background: transparent; border: none; color: #7a9bb5; cursor: pointer; font-size: 20px; padding: 4px 8px; }
  .q-counter { color: #a0b4c8; font-size: 13px; }
  .score-badge {
    background: rgba(232,213,163,0.12); color: #e8d5a3;
    padding: 4px 12px; border-radius: 12px; font-size: 12px;
    border: 1px solid rgba(232,213,163,0.2);
  }
  .progress-bar {
    height: 3px; background: rgba(255,255,255,0.07);
    border-radius: 2px; margin-bottom: 20px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #c9a227, #e8d5a3);
    border-radius: 2px; transition: width 0.4s ease;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 24px; margin-bottom: 14px;
  }
  .type-badge {
    display: inline-block; padding: 3px 10px; border-radius: 8px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 10px;
  }
  .type-mc { background: rgba(59,130,246,0.18); color: #93c5fd; }
  .type-ox { background: rgba(139,92,246,0.18); color: #c4b5fd; }
  .q-text { color: #e2e8f0; font-size: 14.5px; line-height: 1.8; white-space: pre-wrap; }

  .choices { margin-bottom: 14px; }
  .choice-btn {
    width: 100%; text-align: left; padding: 13px 15px; border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: #94a3b8; cursor: pointer; margin-bottom: 7px;
    font-family: inherit; font-size: 13.5px;
    display: flex; align-items: flex-start; gap: 10px;
    line-height: 1.65; transition: all 0.15s;
  }
  .choice-btn:hover:not(.revealed) { border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); }
  .choice-btn.selected { background: rgba(201,162,39,0.1); border-color: rgba(201,162,39,0.38); color: #e8d5a3; }
  .choice-btn.correct { background: rgba(110,231,183,0.1); border-color: rgba(110,231,183,0.38); color: #6ee7b7; }
  .choice-btn.wrong { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.38); color: #f87171; }
  .choice-label { font-weight: 700; min-width: 20px; font-size: 15px; flex-shrink: 0; }
  .choice-mark { margin-left: auto; padding-left: 8px; flex-shrink: 0; }

  .ox-btns { display: flex; gap: 12px; margin-bottom: 14px; }
  .ox-btn {
    flex: 1; height: 76px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #94a3b8; cursor: pointer; font-size: 30px; font-weight: 700;
    font-family: inherit; transition: all 0.2s;
  }
  .ox-btn:hover:not(.revealed) { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.08); }
  .ox-btn.selected { background: rgba(201,162,39,0.1); border-color: rgba(201,162,39,0.4); color: #e8d5a3; }
  .ox-btn.correct { background: rgba(110,231,183,0.12); border-color: rgba(110,231,183,0.4); color: #6ee7b7; }
  .ox-btn.wrong { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.4); color: #f87171; }

  .feedback {
    border-radius: 13px; padding: 13px 16px; margin-bottom: 12px;
    font-size: 14px; font-weight: 600; text-align: center; display: none;
  }
  .feedback.correct { background: rgba(110,231,183,0.08); border: 1px solid rgba(110,231,183,0.28); color: #6ee7b7; }
  .feedback.wrong { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.28); color: #f87171; }

  .btn-confirm {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #c9a227, #e8d5a3);
    color: #1a1a2e; border: none; border-radius: 13px;
    font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: all 0.2s;
  }
  .btn-confirm:disabled { background: rgba(255,255,255,0.05); color: #3a5a72; cursor: not-allowed; }
  .btn-next {
    width: 100%; padding: 15px;
    background: rgba(15,52,96,0.8);
    color: #93c5fd; border: 1px solid rgba(147,197,253,0.25);
    border-radius: 13px; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit; display: none;
  }

  /* REVIEW */
  #review { display: none; }
  .result-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 36px 24px;
    text-align: center; margin-bottom: 24px;
  }
  .result-emoji { font-size: 52px; margin-bottom: 8px; }
  .result-score { color: #e8d5a3; font-size: 48px; font-weight: 800; margin-bottom: 4px; }
  .result-sub { color: #7a9bb5; font-size: 14px; }
  .result-sub .ok { color: #6ee7b7; }
  .result-sub .bad { color: #f87171; }

  .wrong-title { color: #e8d5a3; font-size: 14px; margin-bottom: 12px; }
  .wrong-item {
    background: rgba(239,68,68,0.06);
    border: 1px solid rgba(239,68,68,0.2);
    border-radius: 16px; padding: 18px; margin-bottom: 10px;
  }
  .wrong-q { color: #cbd5e1; font-size: 13px; margin-bottom: 12px; line-height: 1.65; white-space: pre-wrap; }
  .review-choice {
    padding: 9px 12px; border-radius: 10px; margin-bottom: 5px;
    font-size: 12px; line-height: 1.5;
    display: flex; gap: 8px; align-items: flex-start;
    border: 1px solid transparent; background: transparent; color: #4a6a82;
  }
  .review-choice.correct { background: rgba(110,231,183,0.1); border-color: rgba(110,231,183,0.32); color: #6ee7b7; }
  .review-choice.wrong { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.28); color: #f87171; }
  .review-ox { display: flex; gap: 10px; }
  .review-ox-btn {
    flex: 1; padding: 10px; border-radius: 10px; text-align: center;
    font-size: 22px; border: 1px solid rgba(255,255,255,0.08); color: #4a6a82;
  }
  .review-ox-btn.correct { background: rgba(110,231,183,0.1); border-color: rgba(110,231,183,0.32); color: #6ee7b7; }
  .review-ox-btn.wrong { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.28); color: #f87171; }


  .explanation {
    border-radius: 13px; padding: 13px 16px; margin-bottom: 12px;
    font-size: 13px; line-height: 1.8; display: none;
    background: rgba(148,163,184,0.07);
    border: 1px solid rgba(148,163,184,0.22);
    color: #94a3b8;
    white-space: pre-wrap;
  }
  .explanation.show { display: block; }
  .btn-explain {
    width: 100%; padding: 10px;
    background: transparent;
    color: #7a9bb5; border: 1px solid rgba(122,155,181,0.25);
    border-radius: 10px; font-size: 13px;
    cursor: pointer; font-family: inherit; display: none;
    margin-bottom: 8px; transition: all 0.2s;
  }
  .btn-explain:hover { background: rgba(122,155,181,0.08); }
  .btn-explain.show { display: block; }
  /* review 해설 */
  .wrong-explanation {
    margin-top: 8px; padding: 10px 12px; border-radius: 10px;
    font-size: 12px; line-height: 1.7; color: #7a9bb5;
    background: rgba(148,163,184,0.06);
    border: 1px solid rgba(148,163,184,0.18);
    white-space: pre-wrap;
  }

  /* TAB SYSTEM */
  .tab-bar {
    display: flex; gap: 6px; margin-bottom: 28px;
    flex-wrap: wrap; justify-content: center;
  }
  .tab-btn {
    padding: 7px 14px; border-radius: 16px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
    border: 1.5px solid rgba(255,255,255,0.1);
    background: transparent; color: #7a9bb5; letter-spacing: 0.3px;
  }
  .tab-btn.active {
    border-color: #e8d5a3;
    background: rgba(232,213,163,0.12);
    color: #e8d5a3;
  }
  .tab-btn.new-tab {
    border-color: rgba(134,239,172,0.3);
    color: #86efac;
  }
  .tab-btn.new-tab.active {
    border-color: #86efac;
    background: rgba(134,239,172,0.12);
    color: #86efac;
  }
  .era-tabs { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .era-btn {
    padding: 5px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
    border: 1px solid rgba(255,255,255,0.08);
    background: transparent; color: #4a6a82;
  }
  .era-btn.active {
    border-color: rgba(147,197,253,0.4);
    background: rgba(147,197,253,0.08);
    color: #93c5fd;
  }
  .sub-tabs { display: none; margin-top: 10px; }
  .sub-tabs.show { display: flex; }
  .new-badge {
    display: inline-block; background: rgba(134,239,172,0.2);
    color: #86efac; font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 8px; margin-left: 4px;
    letter-spacing: 0.5px;
  }
  .btn-retry {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #c9a227, #e8d5a3);
    color: #1a1a2e; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
    margin-top: 16px;
  }
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <div class="home-card">
    <div class="cross">✝</div>
    <h1 class="home-title">세계교회사</h1>
    <p class="home-sub" id="home-sub">기말고사 모의고사</p>

    <!-- 상단 탭: 전체/기출/예상변형/시대별 -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="setMode('all')">전체</button>
      <button class="tab-btn" onclick="setMode('original')">기출</button>
      <button class="tab-btn new-tab" onclick="setMode('new')">예상변형 <span class="new-badge">NEW</span></button>
      <button class="tab-btn" onclick="setMode('era')">시대별</button>
    </div>
    <!-- 시대별 서브탭 -->
    <div class="sub-tabs era-tabs" id="era-subtabs">
      <button class="era-btn active" onclick="setEra('all_era')">전체</button>
      <button class="era-btn" onclick="setEra('reformation1')">종교개혁</button>
      <button class="era-btn" onclick="setEra('confession')">신앙고백</button>
      <button class="era-btn" onclick="setEra('enlightenment')">계몽부흥</button>
      <button class="era-btn" onclick="setEra('modern')">19-20C</button>
    </div>
    <!-- 문제 유형 필터 -->
    <div class="filter-btns" style="margin-top:12px">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">전체</button>
      <button class="filter-btn" data-filter="mc" onclick="setFilter('mc')">객관식</button>
      <button class="filter-btn" data-filter="ox" onclick="setFilter('ox')">OX</button>
    </div>

    <div style="margin-bottom:28px">
      <span class="count-label">문제 수: <span class="count-val" id="count-display">20</span>문제</span>
      <input type="range" id="count-slider" min="5" max="247" value="20" oninput="updateCount(this.value)">
      <div class="range-minmax"><span>5</span><span id="range-max">247</span></div>
    </div>

    <button class="btn-start" onclick="startQuiz()">시작하기</button>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz">
  <div class="wrap">
    <div class="quiz-header">
      <button class="btn-back" onclick="goHome()">←</button>
      <span class="q-counter" id="q-counter">1 / 20</span>
      <span class="score-badge" id="score-badge">0 정답</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

    <div class="card">
      <span class="type-badge" id="type-badge">객관식</span>
      <p class="q-text" id="q-text"></p>
    </div>

    <div class="choices" id="choices"></div>
    <div class="ox-btns" id="ox-btns" style="display:none">
      <button class="ox-btn" id="ox-o" onclick="selectOX('O')">O</button>
      <button class="ox-btn" id="ox-x" onclick="selectOX('X')">X</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="explanation" id="explanation"></div>
    <button class="btn-explain" id="btn-explain" onclick="toggleExplain()">💡 오답 해설 보기</button>
    <button class="btn-confirm" id="btn-confirm" disabled onclick="confirmAnswer()">정답 확인</button>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">다음 문제 →</button>
  </div>
</div>

<!-- REVIEW -->
<div id="review">
  <div class="wrap">
    <div class="result-card">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-score" id="result-score">100점</div>
      <div class="result-sub" id="result-sub"></div>
    </div>
    <div id="wrong-list"></div>
    <button class="btn-retry" onclick="goHome()">다시 풀기</button>
  </div>
</div>

<script>
const EXPLANATIONS = {
  1: "16세기 초는 교황청 분열이 종식되고 분파주의와 이단이 거의 다 진압된 시기입니다. 이 지문은 14~15세기 중세 말기(대분열 시기)의 상황을 묘사한 것으로, 시대를 정반대로 뒤집은 함정입니다.",
  2: "에라스무스가 화체설을 스콜라주의적 궤변으로 여기고 영적 임재로 해석한 것은 맞지만, 그는 평화주의자로서 자신의 생각을 교리화하거나 교회의 합의에 정면으로 도전할 의사가 없었습니다. '도전했다'를 '도전할 의사도 없었다'로 바꾼 함정입니다.",
  3: "①번은 칼슈타트에 대한 설명이고, ②번은 루터파가 농민 폭력을 인정하지 않았으며, ③번은 재세례파에 대한 설명입니다. ④번 칼빈이 교회의 독립적 지위와 출교권을 주장했다는 것이 올바른 팩트입니다.",
  4: "감각적 도구에 의존하지 않고 오직 영혼으로만 예배해야 한다며 오르간과 성상을 파괴한 사람은 루터가 아니라 츠빙글리(와 칼슈타트)입니다. 루터는 영혼과 육체를 분리하지 않고 예배에 예술을 남겨두었습니다.",
  5: "츠빙글리는 1519년 취리히 부임 후 교회력에 따른 발췌문 설교를 거부하고 복음서 전체를 처음부터 끝까지 강해하는 연속 강해 설교를 도입했습니다. 전례력에 따라 발췌문으로 설교한 것은 루터의 방식입니다.",
  6: "칼빈은 교회의 독립성과 출교권을 주장했으나, 정부가 교회 문제를 관장하는 것에 목숨을 걸고 반대했습니다. 정부 관장을 인정한 것은 취리히의 츠빙글리 노선입니다. 칼빈은 이 문제로 제네바에서 추방당하기까지 했습니다.",
  7: "재세례파는 가톨릭뿐만 아니라 루터파와 개혁파(프로테스탄트) 당국자들에게도 이단으로 지목되어 물에 빠뜨려 죽임을 당하는 등 가혹한 탄압을 받았습니다. 결코 루터파와 개혁파에게 관용되지 않았습니다.",
  8: "감각적 도구를 배제하고 오직 영혼으로만 예배해야 한다고 믿어 오르간과 성상을 파괴한 사람은 루터가 아니라 츠빙글리입니다. 루터는 예배에 음악과 예술(감각적 도구)을 남겨두었습니다.",
  9: "에드워드 사망 후 즉위한 메리 튜더는 철저한 로마 가톨릭 신자였습니다. 영국의 종교개혁을 루터교에서 츠빙글리파, 칼빈주의 쪽으로 더욱 급진적으로 진행시킨 것은 에드워드 6세입니다. 메리 튜더는 영국을 로마 가톨릭으로 되돌리고 개신교도들을 극심하게 탄압했습니다.",
  10: "트렌트 공의회는 인문주의 학자들을 성경 번역에 활용하기는커녕 철저히 배제하고 에라스무스의 저서들을 단죄했습니다. '활용'을 '배제'로 바꾼 서술어 반전 함정입니다.",
  11: "베스트팔렌 조약 이후에도 영토에 입각한 원칙(영주의 종교가 지역의 종교가 되는 원칙)은 여전히 유효하게 유지되었습니다. 개인의 신앙 자유는 아직 허용되지 않았습니다.",
  12: "정답은 ① 나-아-다-바-가-마-라-사 입니다. 순서: 나)헨리8세 수장령(1534) → 아)메리여왕 박해(1553~) → 다)엘리자베스 일치령(1559) → 바)로드의 탄압(1633~) → 가)웨스트민스터(1643~) → 마)크롬웰(1653~) → 라)비밀집회금지(1664) → 사)명예혁명(1688).",
  13: "영국 국교회는 믿음(교리)은 각자 자유롭게 믿도록 했으나, 예배 형식(공동기도서)과 교회 정치(주교제)는 국가가 정한 하나로 강제 통일시켰습니다. 믿음과 예배의 자유/통일을 정반대로 교차한 함정입니다.",
  14: "독립파(회중파)가 상위 기구를 두지 않은 것은 맞지만, 가시적인 성도들로 교회를 순수하게 유지하기 위해 권징과 출교를 그 어떤 분파보다도 엄격하게 강조하고 시행했습니다.",
  15: "퀘이커 교도들은 사회의 틀에서 물러나지 않고, 기독교 세계를 변화시키겠다는 소망을 품고 사회 안에 머물렀습니다. '물러나지 않았다'를 '물러나서'로 바꾼 함정입니다.",
  16: "윌리엄 로드는 교리에는 자유를, 의식(전례)에는 일치를 강요했습니다. 즉 임재설 같은 교리보다 공동기도서 준수 같은 의식에 더 관심이 있었습니다. 교리와 의식의 자유/강제를 정반대로 뒤집은 함정입니다.",
  17: "신대륙으로 건너간 청교도들은 정작 자신들의 영토에서 영토 원칙을 철저히 고수했습니다. 자신과 신앙이 다르면 쫓아내고 퀘이커 교도들을 교수형에 처하기까지 했습니다.",
  18: "미국의 건국 조부들이 정치에 이성을 강조한 것은 맞으나, 그것이 국가가 하나님의 뜻에서 해방된다는 의미가 아니었습니다. 국가 문제에서 특별한 계시 조명을 구할 필요가 없다는 의미였을 뿐입니다.",
  19: "자연(하나님이 해놓으신 일)을 통해 하나님의 정신을 알 수 있다고 주장한 사람은 윌리엄 페일리입니다. 라이프니츠는 '이 세계는 최고의 세계'라고 주장한 독일 철학자입니다. 인물 바꿔치기 함정입니다.",
  20: "온건하고 소심하여 국교회 성직자들 사이에도 자리 잡았던 이신론은 북미 식민지가 아니라 영국(본토)의 이신론입니다. 지역을 교체한 함정입니다.",
  21: "볼테르는 처음에는 이 세계가 최선의 세계라고 생각했으나, 리스본 지진을 접한 후 충격을 받아 《캉디드》에서 이를 신랄하게 풍자했습니다.",
  22: "조나단 에드워즈는 계몽사상을 배격하지 않았고, 오히려 로크와 뉴턴의 글을 인용하며 적극적으로 수용했습니다. 기독교 신앙과 계몽주의를 대립시켰다는 것은 정반대의 왜곡입니다.",
  23: "속회(class)를 조직하고 전국적인 모임을 감독한 탁월한 행정가는 조지 휘트필드가 아니라 존 웨슬리입니다. 인물 바꿔치기 함정입니다.",
  24: "웨슬리가 코크를 감독으로 임명한 것은 사실이나, 그는 죽을 때까지 스스로를 성공회 사제로 여겼으며 결코 국교회를 자의로 떠나거나 버림받지 않았습니다.",
  25: "경건주의가 농민과 귀족의 호감을 산 것은 맞지만, 마르크스 사회주의에 빠져들던 공장 프롤레타리아(노동자 계급)들의 마음을 얻는 데는 실패했습니다.",
  26: "개신교 선교사들은 복음 전도뿐만 아니라 의술, 공중 위생, 교육, 과학 기술, 영농법 등 서구 문명을 매우 적극적으로 전파했습니다. '소극적'이었다는 것은 정반대의 왜곡입니다.",
  27: "러시아 정교회는 국가로부터 독립성을 유지하지 못했고, 차르 체제하에서 철저히 국가의 한 부서로 예속되어 통제받았습니다.",
  28: "미국의 부흥운동은 교회와 국가의 분리를 반대한 것이 아니라, 오히려 가장 강력하게 정교분리를 요구하고 지지했습니다. '분리를 요구'를 '분리를 반대'로 뒤집은 함정입니다.",
  29: "독일 가톨릭교회는 비스마르크의 통일을 적극 지지한 것이 아니라, 오히려 가장 강력하게 방해한 세력이었습니다. 이로 인해 통일 후 비스마르크로부터 극심한 탄압(문화투쟁)을 받았습니다.",
  30: "진보의 원칙이 우주의 구조에 나타나 있고 인간이 더 고등한 상태로 진행한다고 주장한 사람은 허버트 스펜서입니다. 호레이스 부쉬넬은 성경의 열쇠가 감정과 상상, 열정에 있다고 주장한 인물입니다. 인물 바꿔치기 함정입니다.",
  31: "옥스퍼드 운동(고교회파)은 교리를 축소시켜 모두를 포용하려던 자유주의적 광교회의 이상을 철저히 배격하고 반대했습니다. '배격'을 '적극적으로 실천'으로 뒤집은 함정입니다.",
  32: "개인의 자유와 자유방임주의를 존중하여 국가의 복지 개입을 꺼려했던 나라는 독일이 아니라 영국입니다. 독일은 루터교 전통에 따라 국가가 노동과 임금을 통제해야 한다고 보았습니다. 국가 바꿔치기 함정입니다.",
  33: "노예제도 폐지를 위해 하원에서 연설하며 노예제도의 참상을 고발한 인물은 영국 국교도 윌리엄 윌버포스입니다.",
  34: "16세기 초는 교황청 분열이 종식되고 분파주의와 이단이 거의 다 진압된 시기입니다. 이 지문은 14~15세기 중세 말기의 상황을 묘사한 것으로, 시대를 정반대로 뒤집은 함정입니다.",
  35: "구원에 필수적인 교리를 사도신경으로 단순화하자고 주장한 사람은 히메네스가 아니라 에라스무스입니다. 히메네스는 교리적이고 엄격한 권징적 개혁을 추구했습니다. 인물 바꿔치기 함정입니다.",
  36: "스페인 정복자들의 인디언 학살과 착취를 맹렬히 비판하고 원주민들의 인권을 보호하기 위해 헌신한 도미니쿠스회 수사는 바르톨로메 드 라스카사스입니다.",
  37: "행정관의 동의를 기다리지 않고 국가를 비기독교적 제도로 배척하여 분리된 참 신자들만의 단체를 세우려 한 이들은 토마스 뮌처가 아니라 급진적 재세례파입니다. 뮌처는 무력 혁명을 주장했습니다.",
  38: "교회력에 따른 발췌문 설교를 거부하고 복음서 전체를 처음부터 끝까지 강해하는 연속 강해 설교를 도입한 인물은 루터가 아니라 츠빙글리입니다.",
  39: "행정관(정부)의 동의를 기다릴 필요 없이 즉각 독자적인 교회를 세워야 한다고 반대한 이들은 급진적 재세례파입니다. 칼빈은 관료(시의회)와의 협력과 긴장 속에서 개혁을 이루어갔습니다.",
  40: "1521년 보름스 제국의회에서 자신의 저작 철회를 강요받았을 때 성경과 이성을 따르겠다고 당당히 선언한 사람은 마르틴 루터입니다.",
  41: "십자가상은 허용하지 않고 십자가는 허용하며 시편 찬송을 허용한 것은 칼빈의 예배관입니다. 츠빙글리는 음악 자체를 예배에서 전면 금지하고 오르간도 파괴했습니다.",
  42: "전례를 영어로 번역하여 공동기도서를 편찬한 것은 헨리 8세가 아니라 그의 뒤를 이은 에드워드 6세 시대(대주교 크랜머 주도)의 업적입니다.",
  43: "트렌트 공의회는 공의회주의(공의회가 교황보다 우위)를 부활시키지 않았고, 오히려 교황의 통제하에 남아 교황의 권위와 교회의 중앙집중화를 더욱 강화했습니다.",
  44: "이그나티우스 로욜라와 함께 예수회 창립 멤버였으며 아시아(인도, 일본) 선교를 개척한 가장 위대한 예수회 선교사는 프란시스 사비에르(프란치스코 하비에르)입니다.",
  45: "베스트팔렌 조약 이후에도 영토에 입각한 원칙은 여전히 유효하게 유지되었습니다. 개인의 신앙 자유는 아직 허용되지 않았습니다.",
  46: "정답은 ③ 다-사-가-나-마-바-아-라 입니다. 순서: 다)헨리8세 수장령(1534) → 사)메리여왕 박해(1553~) → 가)엘리자베스 일치령(1559) → 나)로드의 탄압(1633~) → 마)웨스트민스터(1643~) → 바)크롬웰(1653~) → 아)비밀집회금지(1664) → 라)명예혁명(1688).",
  47: "왕에게도 하인에게 쓰는 것과 똑같은 평등한 호칭을 사용하자고 주장하여 사회적 평등주의를 실천한 것은 독립파가 아니라 친우회(퀘이커교)의 창설자 조지 폭스입니다.",
  48: "낭트 칙령은 위그노들에게 예배의 자유뿐만 아니라 국비로 군대 주둔을 보장해주었고 공직에 오를 권리도 보장했습니다. '배제되었다'는 것은 정반대의 왜곡입니다.",
  49: "장로교도들과 청교도들은 성탄절을 비롯한 모든 교회력을 통째로 거부했습니다. 하나님이 제정하신 성일은 안식일뿐이라고 믿었기 때문입니다. '강조했다'를 '거부했다'로 바꾸어야 합니다.",
  50: "신대륙으로 건너간 청교도들은 정작 자신들의 영토에서 영토 원칙을 철저히 고수했습니다. 자신들과 신앙이 다르면 쫓아내고 퀘이커 교도들을 교수형에 처하기까지 했습니다.",
  51: "부흥운동을 계몽사상과 철저히 대립시켜서는 안 됩니다. 부흥운동의 기독교적 측은지심과 계몽사상의 인도주의는 사회 개혁이라는 목표 아래 서로 결합할 수 있었습니다.",
  52: "이 세대는 정복이 아니라 '정복에 의하지 않고' 세계 연방 수립으로 항구적인 평화를 성취할 수 있다는 소망을 가졌습니다. '정복만이 평화를 성취할 수 있다'는 정반대의 왜곡입니다.",
  53: "이신론(Deism)이 믿는 하나님은 역사에 친히 개입하시는 인격적 하나님이 아닙니다. 역사를 통해 자신을 나타내는 인격적 하나님을 믿는 것은 유신론자들입니다. 이신론자들은 우주를 창조한 뒤 물러나 계신 '조물주'만을 강조했습니다.",
  54: "조나단 에드워즈는 계몽사상을 배격하지 않았고, 오히려 로크와 뉴턴의 글을 인용하며 적극적으로 수용했습니다. 기독교 신앙과 계몽주의를 대립시켰다는 것은 정반대의 왜곡입니다.",
  55: "웨슬리가 강단에서 쫓겨나 야외 설교를 시작한 것은 맞지만, 그는 죽을 때까지 스스로를 성공회 사제로 여겼으며 결코 국교회를 자의로 떠나거나 새로운 교단을 창설하려 하지 않았습니다.",
  56: "독일에 심신이 결함 있는 모든 사람을 보살피기 위해 국내선교회를 조직하고 사회를 개조하려 한 인물은 요한 비케른입니다.",
  57: "유대교, 이슬람교, 힌두교, 불교, 유교 같은 대중교(대종교)들은 기독교 선교로 인해 어떤 심각한 타격도 입지 않았습니다. '큰 타격을 주었다'는 정반대의 왜곡입니다.",
  58: "러시아 정교회는 국가로부터 독립성을 유지하지 못했고, 차르 체제하에서 철저히 국가의 한 부서로 예속되어 통제받았습니다.",
  59: "미국의 건국 조부들(특히 제퍼슨)은 국가를 계시에 의존하는 '초자연적 질서'가 아니라 이성이 지배하는 '자연 질서'로 이해했습니다. 이것이 정교분리의 근거였습니다.",
  60: "세계교회협의회(WCC)에는 개신교뿐만 아니라 그리스 정교회와 러시아 정교회도 분명히 가입되어 있습니다.",
  61: "종교를 절대 의존감으로 규정하고 낭만주의자들의 언어로 루터 신학을 전한 인물은 슐라이어마허입니다.",
  62: "진화론을 수용하여 우주 자체를 일종의 성사로 해석한 신학자는 폴 틸리히가 아니라 피에르 테야르 드 샤르댕입니다. 인물 바꿔치기 함정입니다.",
  63: "옥스퍼드 운동(고교회파)은 교리를 축소시켜 모두를 포용하려던 광교회의 이상을 철저히 배격했습니다. 또한 야영집회(회중) 중심이 아니라 유서 깊은 소교구를 겨냥했습니다.",
  64: "개인의 자유와 자유방임주의를 존중하여 국가의 복지 개입을 꺼려했던 나라는 독일이 아니라 영국입니다. 독일은 국가가 적극적으로 복지에 개입해야 한다는 사상이 뿌리를 내렸습니다.",
  65: "복음주의 부흥운동은 영혼 구원뿐만 아니라 기독교적 측은지심을 불러일으켜 노예제 폐지 운동에 가장 앞장섰습니다. '관심을 두지 않았다'는 정반대의 왜곡입니다.",
  66: "이성적 추론이 아니라 예수 그리스도를 통해서만 하나님을 알 수 있다고 주장하며 이 말을 남긴 인물은 얀센주의의 대변자 블레즈 파스칼입니다.",
  67: "여러 학자들의 도움을 얻어 헬라어와 라틴어가 병기된 콤풀루툼 학파 대역성경을 편찬한 사람은 에라스무스가 아니라 스페인의 히메네스입니다. 인물 바꿔치기 함정입니다.",
  68: "①번은 칼슈타트, ③번은 재세례파, ④번은 칼빈에 대한 설명입니다. ②번 에라스무스가 인간이 구원에서 하나님과 협력할 수 있다고 보고 교회의 권위에 의존했다는 것이 올바른 팩트입니다.",
  69: "교회력에 따른 발췌문 설교를 거부하고 복음서 전체를 강해한 인물은 루터가 아니라 츠빙글리입니다.",
  70: "그리스도께서 빵과 포도주 '안에, 그리고 그 아래(공재설)'임재한다고 가르친 것은 칼빈이 아니라 루터입니다. 칼빈은 영적 임재설(실제적이지만 물질적은 아님)을 주장했습니다.",
  71: "재세례파는 초기에 주 예수의 재림과 종말 신앙을 강렬하게 강조했습니다. 지도자들이 처형당하고 핍박을 피해 숨어들면서 점차 그 열기가 식었습니다. 초기와 후기를 뒤집은 함정입니다.",
  72: "트렌트 공의회는 인문주의 학자들을 성경 번역에 활용한 것이 아니라 철저히 배제했으며, 에라스무스의 저서들을 단죄했습니다.",
  73: "베스트팔렌 조약 이후에도 영토에 입각한 원칙은 여전히 유효하게 유지되었습니다. 개인의 신앙 자유는 아직 허용되지 않았습니다.",
  74: "낭트 칙령은 위그노들에게 예배의 자유뿐만 아니라 국비로 군대 주둔을 보장해주었고 공직에 오를 권리도 보장했습니다. '배제되었다'는 것은 정반대의 왜곡입니다.",
  75: "정답은 ③ 다-사-가-나-마-바-라 입니다. 순서: 다)헨리8세 수장령(1534) → 사)메리여왕 박해(1553~) → 가)엘리자베스 일치령(1559) → 나)로드의 탄압(1633~) → 마)웨스트민스터(1643~) → 바)크롬웰(1653~) → 라)명예혁명(1688).",
  76: "신대륙으로 건너간 청교도들은 정작 자신들의 영토에서 영토 원칙을 철저히 고수했습니다. 자신들과 신앙이 다르면 쫓아내고 퀘이커 교도들을 교수형에 처하기까지 했습니다.",
  77: "부흥운동을 계몽사상과 철저히 대립시켜서는 안 됩니다. 양자는 사회 개혁이라는 공통의 목적에서 서로 결합할 수 있었습니다.",
  78: "이신론은 우주의 조물주 하나님만 강조했을 뿐, 역사를 통해 자신을 나타내는 인격적 하나님을 함께 강조하지 않았습니다. 이신론과 유신론의 특성을 뒤섞은 함정입니다.",
  79: "조나단 에드워즈는 계몽사상을 배격하지 않았고, 로크와 뉴턴의 글을 인용하며 적극적으로 수용했습니다.",
  80: "속회(class)를 조직하고 전국적인 모임을 감독한 행정가는 조지 휘트필드가 아니라 존 웨슬리입니다. 인물 바꿔치기 함정입니다.",
  81: "개신교 선교사들은 복음 전도뿐만 아니라 의술, 공중 위생, 교육, 과학 기술, 영농법 등 서구 문명을 매우 적극적으로 전파했습니다.",
  82: "감리교도들이 노동조합에 대거 가입한 것은 사실이나, 그들은 교회를 떠났음에도 불구하고 복음주의적 신앙을 버리지 않았습니다. 따라서 영국의 노동운동이 '탈기독교화' 되었다는 서술은 거짓입니다.",
  83: "러시아 정교회는 국가로부터 독립성을 유지하지 못했고, 차르 체제하에서 철저히 국가의 한 부서로 예속되어 통제받았습니다.",
  84: "히틀러는 1933년 정교협약을 맺었으나, 이후 약속을 야금야금 철회하며 가톨릭교회를 탄압했습니다. 정권 말기까지 우호적인 관계가 유지되지 않았습니다.",
  85: "미국의 헌법 제정자들(특히 제퍼슨)은 국가를 계시에 의존하는 '초자연적 질서'가 아니라 이성이 지배하는 '자연 질서'로 이해했습니다.",
  86: "비신화화(Demythologization)를 주창하고 실존적 결단과 헌신을 강조한 신학자는 폴 틸리히가 아니라 루돌프 불트만입니다. 인물 바꿔치기 함정입니다.",
  87: "옥스퍼드 운동(고교회파)은 교리를 축소시켜 모두를 포용하려던 광교회의 이상을 철저히 배격하고 반대했습니다.",
  88: "개인의 자유와 자유방임주의를 존중하여 국가 복지 개입을 꺼려했던 나라는 독일이 아니라 영국입니다. 독일은 국가가 적극 개입해야 한다는 사상이 뿌리를 내렸습니다.",
  89: "런던 빈민가에 뛰어들어 영혼 구원과 구제 사역을 펼치고 탬버린과 군악기를 동원한 집회를 연 구세군의 창설자는 윌리엄 부스입니다.",
  90: "이성적 추론이 아니라 예수 그리스도를 통해서만 하나님을 알 수 있다고 주장하며 이 말을 남긴 인물은 얀센주의의 대변자 블레즈 파스칼입니다.",
  91: "선택받은 자를 확인하는 기준으로 '중생 체험(주관적 체험)'을 강조한 것은 재세례파가 아니라 후대의 뉴잉글랜드 청교도들입니다. 재세례파는 '청결한 삶(도덕적 윤리)'을 기준으로 삼았습니다.",
  92: "세계교회협의회(WCC)에는 개신교뿐만 아니라 그리스 정교회와 러시아 정교회도 분명히 가입되어 있습니다.",
  93: "독립파(회중파)가 상위 기구를 두지 않은 것은 맞지만, 교회의 순수성을 유지하기 위해 권징과 출교를 그 어떤 분파보다도 엄격하게 강조하고 시행했습니다.",
  94: "윌리엄 로드는 교리에는 자유를, 의식(전례)에는 일치를 강요했습니다. 임재설 같은 교리보다 공동기도서 준수 같은 의식에 더 관심이 있었습니다. 교리와 의식의 자유/강제를 정반대로 뒤집은 함정입니다.",
  95: "리스본 지진 후 충격을 받아 《캉디드》를 저술하여 최선의 세계라는 낙관론을 신랄하게 풍자한 사람은 루소가 아니라 볼테르입니다. 인물 교체 함정입니다.",
  96: "평신도 후원자의 임의적인 성직자 임명권에 반발하여 토머스 찰머스를 중심으로 451명의 목사들이 국교회를 탈퇴해 자유교회를 세운 사건은 스코틀랜드에서 발생했습니다.",
  97: "집회에서 성령의 인도를 기다리며 모두가 침묵 속에 잠잠히 기다리는 예배 방식은 재세례파가 아니라 친우회(퀘이커교)의 특징입니다. 교파 바꿔치기 함정입니다.",
  98: "웨슬리가 강단에서 쫓겨나 야외 설교를 시작한 것은 맞지만, 그는 죽을 때까지 스스로를 성공회 사제로 여겼으며 결코 국교회를 자의로 떠나거나 새로운 교단을 창설하려 하지 않았습니다.",
  99: "인도에서 카스트 제도를 수용하고 브라만처럼 생활하며 선교한 예수회 선교사는 이탈리아 출신의 로베르토 드 노빌리입니다.",
  100: "성직자 독신주의로 인해 사제들의 서자(사생아)가 생겨났으나, 사회는 이들을 심하게 차별하지 않았습니다. 오히려 에라스무스 같은 서출들도 유명 인사가 될 수 있었습니다. 서술어를 정반대로 뒤집은 함정입니다.",
  101: "자유롭고 비교리적이며 윤리와 교육에 의존했던 개혁은 스페인이 아니라 네덜란드(에라스무스 등) 유형의 개혁이었습니다. 스페인의 개혁은 교리적이고 권징적인 엄격한 형태였습니다. 국가 바꿔치기 함정입니다.",
  102: "루터는 고해성사를 완전히 '폐기'하지 않았습니다. 의무적인 성사로 보는 것은 반대했지만, 평신도에게라도 자발적으로 죄를 고백하는 행위로 '축소'하여 남겨두었습니다.",
  103: "이단 재판권은 교회가 아니라 세속 행정관(시의회)에게 남아 있었습니다. 칼빈은 교회의 권징(출교)권을 쟁취했지만, 세르베투스 화형 같은 이단 재판은 시의회가 주도했습니다.",
  104: "재세례파는 초기에 주 예수의 재림과 종말 신앙을 강렬하게 강조했습니다. 지도자들이 처형당하고 핍박을 피해 숨어들면서 점차 그 열기가 식었습니다. 초기와 후기를 뒤집은 함정입니다.",
  105: "츠빙글리는 성경을 엄격한 교회 조직의 법칙으로 보아 성경이 명하지 않은 것은 모두 금지시켰습니다. 교회 정치와 전례를 비본질적으로 보고 다양성을 인정한 것은 루터의 입장입니다.",
  106: "모든 교회에 영어 성경 비치와 사용을 명령한 왕은 에드워드 6세가 아니라 헨리 8세입니다. 에드워드 6세는 영어 공동기도서를 편찬한 업적이 있습니다. 인물 바꿔치기 함정입니다.",
  107: "트렌트 공의회는 공의회주의를 부활시키지 않았고, 철저히 교황의 통제하에 남아 교황의 권위와 중앙집중화를 더욱 강화했습니다.",
  108: "1555년 아우크스부르크 평화회의에서는 오직 '루터교' 하나만을 합법적인 종교로 승인했습니다. 칼빈주의는 철저히 배제되었습니다.",
  109: "정답은 ③ 바-사-아-마-가-나-라-다 입니다. 순서: 바)헨리8세 수장령(1534) → 사)메리여왕 박해(1553~) → 아)엘리자베스 일치령(1559) → 마)로드의 탄압(1633~) → 가)웨스트민스터(1643~) → 나)크롬웰(1653~) → 라)비밀집회금지(1664) → 다)명예혁명(1688).",
  110: "독립파(회중파)가 상위 기구를 두지 않은 것은 맞지만, 교회의 순수성을 유지하기 위해 권징과 출교를 그 어떤 분파보다도 엄격하게 강조하고 시행했습니다.",
  111: "낭트 칙령은 위그노들에게 예배의 자유뿐만 아니라 국비로 군대 주둔을 보장해주었고 공직에 오를 권리도 보장했습니다. '배제되었다'는 것은 정반대의 왜곡입니다.",
  112: "온건하고 소심하여 국교회 성직자들 사이에도 자리 잡았던 이신론은 북미 식민지가 아니라 영국(본토)의 이신론입니다. 지역을 교체한 함정입니다.",
  113: "속회(class)를 조직하고 전국적인 모임을 감독한 행정가는 조지 휘트필드가 아니라 존 웨슬리입니다.",
  114: "개신교 선교사들은 서구 문명을 전하는 데 적극적이었을 뿐만 아니라, 토착 문학, 연극, 음악, 건축을 배우고 보전하려고 노력했으며 방언에 문자도 만들어 주었습니다.",
  115: "1929년 무솔리니와의 정교협약으로 바티칸 주권을 되찾았으나, 성직자 급여를 국가가 지불하게 됨으로써 이탈리아 교회는 오히려 국가에 의해 효과적으로 통제받게 되었습니다.",
  116: "미국의 부흥운동은 정교분리를 반대한 것이 아니라, 오히려 가장 강력하게 교회와 국가의 분리를 요구하고 지지했습니다.",
  117: "비신화화(Demythologization)를 주창하고 실존적 결단과 헌신을 강조한 신학자는 루돌프 불트만입니다.",
  118: "옥스퍼드 운동(고교회파)은 교리를 축소시켜 모두를 포용하려던 광교회의 이상을 철저히 배격하고 반대했습니다. 또한 야영집회(회중) 중심이 아니라 유서 깊은 소교구를 겨냥했습니다.",
  119: "개인의 자유와 자유방임주의를 존중하여 국가 복지 개입을 꺼려했던 나라는 독일이 아니라 영국입니다. 독일은 루터교 전통에 따라 국가가 노동과 임금을 통제해야 한다고 보았습니다.",
  120: "교황 무류설은 교황의 모든 결정이 아니라, 오직 신앙과 도덕에 관해 '공식적으로(엑스 카쎄드라)' 선포할 때에만 성령께서 오류를 막아주신다는 의미입니다. '모든 경우'라는 극단적 단어를 넣은 함정입니다.",
  121: "이반 4세 시대에 러시아 교회는 비잔틴 교회에 소속된 것이 아니라 완전한 독립 교회가 되었습니다. 다만 황제가 교회를 장악하는 비잔틴의 형태를 모방했을 뿐입니다.",
  122: "히틀러는 1933년 정교협약을 맺었으나, 이후 약속을 야금야금 철회하며 가톨릭교회를 탄압했습니다. 좋은 관계가 유지된 것이 아닙니다.",
  123: "집회에서 성령의 인도를 기다리며 모두가 침묵 속에 잠잠히 기다리는 예배 방식은 재세례파가 아니라 친우회(퀘이커교)의 특징입니다.",
  124: "1521년 보름스 제국의회에서 성경과 이성을 따르겠다고 당당히 선언한 사람은 마르틴 루터입니다.",
  125: "선택받은 자를 확인하는 기준으로 '중생 체험(주관적 체험)'을 강조한 것은 재세례파가 아니라 후대의 뉴잉글랜드 청교도들입니다. 재세례파는 '청결한 삶'을 기준으로 삼았습니다.",
  126: "1637년 로드 대주교가 스코틀랜드에 공동기도서 사용을 의무화하려 하자, 스코틀랜드인들은 예배를 드리기로 '결의'한 것이 아니라 에든버러에서 대규모 '폭동'을 일으켰습니다.",
  127: "이성적 추론이 아니라 예수 그리스도를 통해서만 하나님을 알 수 있다고 주장한 얀센주의의 대변자는 블레즈 파스칼입니다.",
  128: "웨슬리가 강단에서 쫓겨나 야외 설교를 시작한 것은 맞지만, 그는 죽을 때까지 스스로를 성공회 사제로 여겼으며 결코 국교회를 자의로 떠나거나 새로운 교단을 창설하지 않았습니다.",
  129: "노빌리는 인도에서 카스트 제도를 수용하고 브라만처럼 생활하며 선교했으며, 로마(교황청)는 즉시 그 방법을 승인했습니다. 이것은 역사적 사실입니다.",
  130: "복음주의 부흥운동은 영혼 구원뿐만 아니라 기독교적 측은지심을 불러일으켜 노예제 폐지 운동에 가장 앞장섰습니다.",
  131: "세계교회협의회(WCC)에는 개신교뿐만 아니라 그리스 정교회와 러시아 정교회도 분명히 가입되어 있습니다.",
  132: "자연을 묵상하며 하나님의 영광을 노래한 이 고백을 남긴 인물은 미국 대각성 운동의 주역 조나단 에드워즈입니다.",
  133: "파라과이의 예수회 식민지(레둑시온)는 스페인과 포르투갈 정복자들의 지지를 받은 것이 아니라, 원주민들을 노예로 삼으려던 스페인과 포르투갈 사람들에 의해 심각한 탄압을 받았습니다.",
  134: "계층과 신조를 초월하여 헤른후트파(모라비아 난민)를 지도한 것은 아우구스트 프랑케가 아니라 진젠도르프 백작입니다. 프랑케는 할레에 고아원과 학교를 세운 인물입니다.",
  135: "미국의 건국 조부들이 정치에 이성을 강조한 것은 맞으나, 그것이 국가가 하나님의 뜻에서 해방된다는 의미가 아니었습니다. 국가 문제에서 특별한 계시 조명을 구할 필요가 없다는 의미였을 뿐입니다.",
  136: "정답은 ③ 나-아-다-바-가-마-라-사 입니다. 순서: 나)헨리8세 수장령(1534) → 아)메리여왕 박해(1553~) → 다)엘리자베스 일치령(1559) → 바)로드의 탄압(1633~) → 가)웨스트민스터(1643~) → 마)크롬웰(1653~) → 라)비밀집회금지(1664) → 사)명예혁명(1688).",
  137: "이성적 추론이 아니라 예수 그리스도를 통해서만 하나님을 알 수 있다고 주장하며 이 말을 남긴 인물은 블레즈 파스칼입니다.",
  138: "러시아 정교회는 국가로부터 독립성을 유지하지 못했고, 차르 체제하에서 철저히 국가의 한 부서로 예속되어 통제받았습니다.",
  139: "낭트 칙령은 위그노들에게 예배의 자유뿐만 아니라 국비로 군대 주둔을 보장해주었고 공직에 오를 권리도 보장했습니다. '공직에 오를 수 없었다'는 것은 정반대의 왜곡입니다.",
  140: "크롬웰이 대부분의 개신교 정파에게 관용을 준 것은 맞지만, '모든 정파'를 관용하지는 않았습니다. 가톨릭 교도들과 유니테리언(삼위일체 부정파) 교도들에게는 관용을 허락하지 않았습니다.",
  141: "지옥에 떨어질 죄인들의 위험한 처지를 경고하며 회개를 촉구한 이 설교는 조나단 에드워즈의 〈진노하시는 하나님의 손아귀에 있는 죄인들〉입니다.",
  142: "콤풀루툼 학파 대역성경을 편찬한 사람은 에라스무스가 아니라 스페인의 히메네스입니다. 에라스무스는 1516년 신약성경 헬라어 본문을 최초로 출판한 인물입니다.",
  143: "처음부터 반전운동에 헌신한 집단은 뉴잉글랜드 청교도들이 아니라 친우회(퀘이커교)입니다. 청교도들은 오히려 퀘이커 교도들을 교수형에 처하기도 했습니다.",
  144: "복음서를 신화로 해석하고 구약 자료를 이야기로 구성했다고 주장한 신학자는 폴 틸리히가 아니라 프리드리히 슈트라우스입니다. 인물 바꿔치기 함정입니다.",
  145: "집회에서 성령의 인도를 기다리며 모두가 침묵 속에 잠잠히 기다리는 예배 방식은 재세례파가 아니라 친우회(퀘이커교)의 특징입니다.",
  146: "재세례파는 초기에 주 예수의 재림과 종말 신앙을 강렬하게 강조했습니다. 지도자들이 처형당하고 핍박을 피해 숨어들면서 점차 그 열기가 식었습니다.",
  147: "부흥운동을 계몽사상과 철저히 대립시켜서는 안 됩니다. 부흥운동의 기독교적 측은지심과 계몽사상의 인도주의는 사회 개혁이라는 목표 아래 서로 결합할 수 있었습니다.",
  148: "퀘이커 교도들은 사회의 틀에서 물러나지 않고, 기독교 세계를 변화시키겠다는 소망을 품고 사회 안에 머물렀습니다.",
  149: "칼빈은 교회의 독립성과 출교권을 주장했으나, 정부가 교회 문제를 관장하는 것에 반대했습니다. 정부 관장을 인정한 것은 취리히의 츠빙글리 노선입니다.",
  150: "①번은 에라스무스, ②번은 루터가 행정관의 교회 개입을 인정했으므로 오답, ④번은 루터가 폐기한 것이 아니라 축소한 것이 오답. ③번 루터의 공재설과 성례론에 대한 설명이 올바릅니다.",
  151: "미국의 건국 조부들(특히 제퍼슨)은 국가를 계시에 의존하는 '초자연적 질서'가 아니라 이성이 지배하는 '자연 질서'로 이해했습니다.",
  152: "개신교 선교사들은 복음 전도뿐만 아니라 의술, 공중 위생, 교육, 과학 기술, 영농법 등 서구 문명을 매우 적극적으로 전파했습니다. '소극적'이었다는 것은 정반대의 왜곡입니다.",
  153: "16세기 초는 교황청 분열이 종식되고 분파주의와 이단이 거의 다 진압된 시기입니다. '성행'했다는 것은 정반대의 왜곡입니다.",
  154: "스페인 정복자들의 인디언 학살과 착취를 맹렬히 비판하고 원주민들의 인권을 보호하기 위해 헌신한 인물은 바르톨로메 드 라스카사스입니다.",
  155: "주교제와 공동기도서를 배척하면서도 왕정을 인정하고 입헌군주제를 선호한 청교도 분파는 장로파입니다.",
  156: "가톨릭 현대주의자들이 1910년에 파문당한 것은 맞지만, 최근에는 그들의 성서학 방법론이 가톨릭 내에서 대폭 수용되었습니다. 가톨릭과 개신교 학자들 사이의 성경학 차이는 사실상 사라졌습니다.",
  157: "이그나티우스 로욜라와 함께 예수회 창립 멤버였으며 아시아(인도, 일본) 선교를 개척한 선교사는 프란시스 사비에르(프란치스코 하비에르)입니다.",
  158: "벵갈의 세람포어에 인쇄소를 세워 1832년까지 44개의 언어와 방언으로 성경을 발행한 근대 선교의 아버지는 윌리엄 케리입니다.",
  159: "노예 매매에 반대하고 노예제 폐지를 위해 노력했던 인물에는 윌버포스, 웨슬리, 해리어트 비처 스토우가 있습니다. 모리스(F.D.Maurice)는 기독교 사회주의자로 노동자 교육과 협동조합 실험을 주도했습니다.",
  160: "옥스퍼드 운동은 영국 국교회(성공회) 내부에서 일어났지만, 그 영향은 국교회 안에 한정되지 않고 개신교 전반에 깊은 영향을 끼친 부흥운동으로 평가받습니다.",
  161: "솔로몬 스토다드는 회심하지 않은 자들의 성찬 참여를 금한 것이 아니라, 오히려 성찬을 통해 회심하기를 기대하며 '허락'했습니다. 서술어를 정반대로 뒤집은 함정입니다.",
  162: "경건주의가 농민과 귀족의 호감을 산 것은 맞지만, 마르크스 사회주의에 빠져들던 공장 프롤레타리아(노동자 계급)들의 마음을 얻는 데는 실패했습니다.",
  163: "감리교도들이 교회를 탈퇴해 노동조합에 가입한 것은 사실이나, 그들은 복음주의적 신앙을 버리지 않았습니다. 따라서 영국의 노동운동이 '탈기독교화' 되었다는 것은 거짓입니다.",
  165: "가톨릭 교회의 오랜 국가 협력 전통으로 복지국가 이념을 쉽게 수용했다는 것, 케텔러의 자유주의 비판, 레오 13세의 레룸 노바룸 교서 반포는 모두 역사적 사실입니다.",
  166: "엘리자베스 1세는 반대로 신앙(마음속 믿음)은 각자 자유롭게 믿도록 했지만, 예배(의식)만큼은 공동기도서 형식으로 통일하도록 강제했습니다. 신앙과 예배의 자유/통일을 뒤바꾼 함정입니다.",
  167: "성직복을 입지 않고 평신도처럼 노동하며 음악과 성상을 배척한 것은 멜랑히톤이 아니라 루터의 동료 칼슈타트입니다. 인물 바꿔치기 함정입니다.",
  168: "18세기 부흥운동이 계몽주의의 건조한 사색과 신스콜라주의의 경직된 보수주의에 대한 반작용으로 일어났다는 것은 교재가 명확히 기록하고 있는 사실입니다.",
  169: "행정관의 동의를 기다리지 않고 국가를 비기독교적 제도로 배척하여 분리된 참 신자들의 단체를 세운 것은 토마스 뮌처가 아니라 급진적 재세례파입니다.",
  170: "칼빈이 세 가지 기준으로 선택자를 확인하고 청교도와 달리 주관적 중생 체험을 요구하지 않았다는 것은 교재가 명확히 기록하고 있는 사실입니다.",
  171: "진화론을 수용하여 우주 자체를 일종의 성사로 해석한 신학자는 알프레드 로와지가 아니라 테야르 드 샤르댕입니다. 인물 바꿔치기 함정입니다.",
  172: "히틀러가 개신교 국가교회를 결성하고, 유대인 혈통 기독교인을 추방하는 정책을 세운 것은 역사적 사실입니다.",
  173: "자유롭고 비교리적이며 윤리와 교육에 의존했던 개혁은 스페인이 아니라 네덜란드(에라스무스 등) 유형의 개혁이었습니다. 스페인의 개혁은 교리적이고 권징적인 형태였습니다.",
  174: "에라스무스는 보편 제국과 보편 교회를 강조했으며, 민족주의를 가장 완강한 대적으로 여겼습니다. '민족주의와 민족교회를 강조했다'는 정반대의 왜곡입니다.",
  175: "성직복을 입지 않고 평신도처럼 노동하며 음악과 성상을 배척한 루터의 동료는 칼슈타트입니다.",
  176: "성경을 교회 조직의 전형(법칙)으로 보아 성경이 명하지 않은 것은 모두 금한 것은 루터가 아니라 츠빙글리입니다. 루터는 성경을 구원의 선포로 보아 성경이 금하지 않은 것은 예배에 허용했습니다.",
  177: "교회의 독립적 지위와 출교권을 주장한 것은 츠빙글리가 아니라 칼빈입니다. 츠빙글리는 취리히에서 국가(시의회)와 교회가 협력하는 신정 정치를 펼쳤습니다.",
  178: "재세례파는 가톨릭뿐만 아니라 루터파와 개혁파(프로테스탄트) 당국자들에게도 이단으로 지목되어 가혹한 탄압을 받았습니다.",
  179: "에라스무스가 화체설을 궤변으로 여기고 영적 임재로 해석한 것은 맞지만, 그는 평화주의자로서 이를 교리화하거나 가톨릭교회에 정면으로 도전할 의사가 없었습니다.",
  180: "십자가는 허용하되 십자가상은 허용하지 않고, 시편 찬송은 허용하되 다른 음악은 허용하지 않은 개혁자는 칼빈입니다.",
  181: "에드워드 사망 후 즉위한 메리 튜더는 철저한 로마 가톨릭 신자로 영국을 로마 가톨릭으로 되돌렸습니다. 칼빈주의 쪽으로 진행시킨 것은 에드워드 6세입니다.",
  182: "스페인의 에라스무스파와 신비주의자들은 프로테스탄트를 저지한 것이 아니라, 오히려 스페인 종교재판소의 가혹한 탄압과 색출 대상이 되었습니다.",
  183: "30년 전쟁 초기에는 군사적 고려보다 종교적 확신이 훨씬 더 앞서 작용했습니다. '처음부터 군사적 고리가 앞섰다'는 서술은 정반대의 왜곡입니다.",
  184: "정답은 ④ 다-가-나-마-바-사-라 입니다. 순서: 다)헨리8세 수장령(1534) → 가)엘리자베스 일치령(1559) → 나)로드의 탄압(1633~) → 마)웨스트민스터(1643~) → 바)크롬웰(1653~) → 사)비밀집회금지(1664) → 라)명예혁명(1688).",
  185: "스페인의 압제에 맞서 반란을 일으키고 1581년 독립을 선언하며 다양한 종교적 관용을 베푼 나라는 네덜란드입니다.",
  186: "영국의 청교도 분파 중 '장로파'는 주교제와 공동기도서를 배척했지만, 정치적으로 왕정 폐지가 아니라 '입헌군주제'를 선호했습니다. 왕정 폐지를 주도한 것은 독립파(크롬웰)입니다.",
  187: "퀘이커교는 당시로서 매우 파격적으로 남녀 평등을 실천했습니다. 남녀 차별이 뿌리 깊게 남아있었다는 것은 정반대의 왜곡입니다.",
  188: "왕에게도 하인에게 쓰는 것과 똑같은 호칭을 사용하자고 주장한 것은 유니테리언파가 아니라 친우회(퀘이커교)의 창설자 조지 폭스입니다. 교파 바꿔치기 함정입니다.",
  189: "크롬웰이 개신교 여러 분파에게 관용을 베푼 것은 사실이나, 가톨릭 교도들과 유니테리언 교도들에게만큼은 관용을 허락하지 않았습니다.",
  190: "18세기는 이성과 인류의 진보에 대한 낙관론으로 시작했습니다. '비관론'이라는 단어 하나를 교묘하게 바꾼 함정입니다.",
  191: "조나단 에드워즈는 계몽사상을 배격하지 않았고, 오히려 로크와 뉴턴의 글을 인용하며 적극적으로 수용했습니다.",
  192: "온건하고 소심하여 국교회 성직자들 사이에도 자리 잡았던 이신론은 북미 식민지가 아니라 영국(본토)의 이신론입니다. 지역을 교체한 함정입니다.",
  193: "볼테르는 처음에는 이 세계가 최선의 세계라고 생각했으나, 리스본 지진 후 충격을 받아 《캉디드》에서 이를 신랄하게 풍자했습니다.",
  194: "속회(class)를 조직하고 전국적인 모임을 감독한 행정가는 조지 휘트필드가 아니라 존 웨슬리입니다.",
  195: "웨슬리가 코크를 감독으로 임명한 것은 사실이나, 그는 죽을 때까지 스스로를 성공회 사제로 여겼으며 결코 국교회를 자의로 떠나거나 버림받지 않았습니다.",
  196: "유대교, 이슬람교, 힌두교, 불교, 유교 같은 대종교들은 기독교 선교로 인해 어떤 심각한 타격도 입지 않았습니다. '큰 타격을 주었다'는 정반대의 왜곡입니다.",
  197: "독일 가톨릭교회는 비스마르크의 통일을 적극 지지한 것이 아니라, 오히려 가장 강력하게 방해한 세력이었습니다.",
  198: "가톨릭 현대주의자들이 파문당한 것은 맞지만, 최근에는 그들의 성서학 방법론이 가톨릭 내에서 대폭 수용되었습니다. 차이는 '크다'가 아니라 '사실상 사라졌다'가 맞습니다.",
  199: "진보의 원칙이 우주의 구조에 나타나 있고 인간이 더 고등한 상태로 진행한다고 주장한 사람은 허버트 스펜서입니다. 호레이스 부쉬넬은 성경의 열쇠가 감정과 상상에 있다고 주장한 인물입니다.",
  200: "비신화화(Demythologization)를 주창하고 실존적 결단과 헌신을 강조한 신학자는 루돌프 불트만입니다.",
  201: "뉴잉글랜드의 제2차 대각성운동은 제1차의 무절제한 부작용을 피해 조심스럽고 절제된 방식으로 진행되었습니다. 격렬한 신체적 반응이 강조된 것은 서부 변경의 야영집회였습니다.",
  202: "개인의 자유와 자유방임주의를 존중하여 국가 복지 개입을 꺼려했던 나라는 독일이 아니라 영국입니다.",
  203: "부흥운동은 영혼 구원뿐만 아니라 사회 개혁에도 기여하여 사회 문제가 전혀 해결 불가능하지 않음을 입증했습니다. '전혀 해결 불가능하다는 인식을 심어주었다'는 정반대의 왜곡입니다.",
  204: "중세의 그리스도 수난 숭배를 바로크 언어로 표현하고 회중 찬송에 새로운 자극을 준 서정시인은 진젠도르프 백작입니다.",
  205: "옥스퍼드 운동의 영향을 받은 케임브리지 그룹에서 소교구 교회당을 연구하고 고딕 양식 건축 부활에 불을 지핀 대수도원 예배를 묘사한 인물은 존 메이슨 닐입니다.",
  206: "16세기 초는 교황청 분열이 종식되고 분파주의와 이단이 거의 다 진압된 시기입니다. 이 지문은 14~15세기 중세 말기의 상황으로, 시대를 정반대로 뒤집은 함정입니다.",
  207: "종교생활과 의식보다 내적 경험과 윤리를 강조한 것은 스페인이 아니라 네덜란드(에라스무스) 유형의 개혁이었습니다. 스페인의 개혁은 교리적이고 권징적인 형태였습니다.",
  208: "①번은 칼슈타트, ③번은 재세례파, ④번은 칼빈에 대한 설명입니다. ②번 에라스무스가 인간이 구원에서 하나님과 협력할 수 있다고 보고 교회의 권위에 의존했다는 것이 올바른 팩트입니다.",
  209: "루터는 고해성사를 완전히 '폐기'하지 않았습니다. 의무적인 성사로 보는 것은 반대했지만, 자발적인 자백 행위로 '축소'하여 남겨두었습니다.",
  210: "루터는 선택자를 확인할 객관적 시험 방법을 부정하여 선택자들의 공동체를 세울 수 없다고 보았습니다. 반면 칼빈은 세 가지 시험 방법을 제시하여 선택자들의 공동체를 가시적으로 세울 수 있다고 보았습니다.",
  211: "재세례파는 세속 국가를 철저히 분리하고 배척했기 때문에, 그리스도인이 군주(행정관)가 되어 칼로 죄인을 벌하는 것은 절대 안 된다고 가르쳤습니다.",
  212: "루터는 결혼을 일반 사회의 문제로 보았습니다. 가톨릭은 결혼을 성사(거룩한 것)로 보았으나, 루터는 결혼을 세속화(일반 사회 영역)시켰습니다. 거룩성을 강조한 것은 가톨릭의 입장입니다.",
  213: "금식일을 폐지하고 대성당에서 성상을 제거하며 오르간을 폐쇄한 급진적 개혁자는 취리히의 츠빙글리입니다.",
  214: "영국의 종교개혁은 헨리 8세의 정치적 독립에서 시작하여 에드워드 6세 때 루터교에서 츠빙글리파, 나아가 칼빈주의 쪽으로 복합적으로 진행되었습니다. '철저하게 루터교 쪽으로만' 진행되지 않았습니다.",
  215: "트렌트 공의회는 인문주의 학자들을 성경 번역에 활용한 것이 아니라 철저히 배제했으며, 에라스무스의 저서들을 단죄했습니다.",
  216: "베스트팔렌 조약 이후에도 영토에 입각한 원칙은 여전히 유효하게 유지되었습니다. 개인의 신앙 자유는 아직 허용되지 않았습니다.",
  217: "정답은 ③ 다-사-가-나-마-바-라 입니다. 순서: 다)헨리8세 수장령(1534) → 사)메리여왕 박해(1553~) → 가)엘리자베스 일치령(1559) → 나)로드의 탄압(1633~) → 마)웨스트민스터(1643~) → 바)크롬웰(1653~) → 라)명예혁명(1688).",
  218: "영국 국교회는 믿음(교리)은 각자 자유롭게 믿도록 했으나, 예배 형식(공동기도서)과 교회 정치(주교제)는 국가가 정한 하나로 강제 통일시켰습니다.",
  219: "독립파(회중파)가 상위 기구를 두지 않은 것은 맞지만, 교회의 순수성을 유지하기 위해 권징과 출교를 그 어떤 분파보다도 엄격하게 강조하고 시행했습니다.",
  220: "낭트 칙령은 프랑스 전역이 아니라 특정 지정된 도시들에서만 예배를 허락했습니다.",
  221: "메이플라워 계약에 따르면 모든 성도가 아니라 '주님의 은혜를 맛본 사람(회심자)'만 교회 회원이 될 수 있었고, 교회 회원만 공직과 투표권을 가질 수 있었습니다.",
  222: "신대륙으로 건너간 청교도들은 정작 자신들의 영토에서 영토 원칙을 철저히 고수했습니다. 자신들과 신앙이 다르면 쫓아내고 퀘이커 교도들을 교수형에 처하기까지 했습니다.",
  223: "부흥운동을 계몽사상과 철저히 대립시켜서는 안 됩니다. 양자는 사회 개혁이라는 공통의 목적에서 서로 결합할 수 있었습니다.",
  224: "웨슬리는 죽을 때까지 스스로를 영국 국교회(성공회) 사제로 여겼으며, 자의로 국교회를 떠나 새로운 교단을 세우려 하지 않았습니다.",
  225: "이신론은 우주의 조물주 하나님만 강조했을 뿐, 역사를 통해 자신을 나타내는 인격적 하나님을 함께 강조하지 않았습니다.",
  226: "자연을 통해 하나님의 정신을 알 수 있다고 주장한 것은 라이프니츠가 아니라 윌리엄 페일리입니다. 라이프니츠는 '이 세계는 최고의 세계'라고 주장했습니다.",
  227: "조나단 에드워즈는 계몽사상을 배격하지 않았고, 로크와 뉴턴의 글을 인용하며 적극적으로 수용했습니다.",
  228: "중세의 그리스도 수난 숭배를 바로크 언어로 표현하고 회중 찬송에 새로운 자극을 준 서정시인은 아우구스트 프랑케가 아니라 진젠도르프 백작입니다.",
  229: "선교사들이 식민지 정부를 때때로 비판한 것은 맞지만, '어느 형태로든 협력을 거절했다'는 것은 역사적 사실을 극단적으로 왜곡한 오답입니다. 현실적인 사역을 위해 다양한 형태로 협력하는 경우가 많았습니다.",
  230: "러시아 정교회는 국가로부터 독립성을 유지하지 못했고, 차르 체제하에서 철저히 국가의 한 부서로 예속되어 통제받았습니다.",
  231: "미국의 건국 조부들(특히 제퍼슨)은 국가를 계시에 의존하는 '초자연적 질서'가 아니라 이성이 지배하는 '자연 질서'로 이해했습니다.",
  232: "종교를 절대 의존감으로 규정하고 낭만주의자들의 언어로 루터 신학을 전한 인물은 슐라이어마허입니다.",
  233: "비신화화(Demythologization)를 주창하고 실존적 결단과 헌신을 강조한 신학자는 폴 틸리히가 아니라 루돌프 불트만입니다.",
  234: "교회력을 비판하고 안식일만 성일로 주장한 것은 옥스퍼드 운동이 아니라 영국의 장로교도들과 청교도들입니다. 옥스퍼드 운동은 오히려 역사적 전례와 교회 전통을 회복하려 했습니다.",
  235: "개인의 자유와 자유방임주의를 존중하여 국가 복지 개입을 꺼려했던 나라는 독일이 아니라 영국입니다.",
  236: "감리교도들이 교회를 탈퇴해 노동조합에 가입한 것은 사실이나, 그들은 복음주의적 신앙을 버리지 않았습니다. 따라서 '탈기독교화'는 거짓 서술입니다.",

{"id":349,"era":"modern","type":"mc",

"choices":["독일에서는 개인의 자유를 존중하는 전통이 강하여 국가의 복지 개입이 뿌리내리기 어려웠다.","영국에서는 루터교 전통에 따라 국가가 아버지처럼 공공복지에 책임을 져야 한다는 사상이 발달했다.","영국에서는 개인의 자유와 상업의 자유를 존중하여 국가의 복지 개입을 꺼려하는 경향이 있었다.","가톨릭교회는 자유주의와 자본주의를 지지하여 복지국가 이념과 거리를 두었다."],
"answer":3,
"explanation":"개인의 자유와 자유방임주의를 존중하여 국가 복지 개입을 꺼려했던 나라는 독일이 아니라 영국입니다. 독일은 국가가 적극 개입해야 한다는 사상이 발달했습니다."},

{"id":350,"era":"modern","type":"mc",
"question":"19세기 사회 개혁에 관한 서술입니다. 틀린 것을 하나 고르세요.",
"choices":["영국령에서 노예 매매 반대 운동은 감리교와 국교회에서 시작되었다.","복음주의 부흥운동은 기독교적 측은지심을 불러일으켜 농노 해방과 노예 해방에 기여했다.","부흥운동은 영혼 구원만 강조했기 때문에 노예제도 폐지와 같은 사회 문제에는 관심을 두지 않았다.","미국에서 노예제도를 둘러싸고 감리교, 장로교, 침례교가 북부와 남부로 분열되었다."],
"answer":3,
"explanation":"복음주의 부흥운동은 기독교적 측은지심을 일깨워 노예제 폐지 운동에 가장 앞장섰습니다. '관심을 두지 않았다'는 정반대의 왜곡입니다."},

{"id":351,"era":"modern","type":"mc",
"question":"히틀러와 기독교에 관한 서술입니다. 틀린 것을 하나 고르세요.",
"choices":["히틀러는 28개 개신교 지역 교회들을 묶어 하나의 국가교회를 결성하도록 요구했다.","4천 명의 개신교 목사들이 고백교회를 결성하고 1934년 바르멘 선언을 통해 저항했다.","히틀러는 1933년 가톨릭교회와 정교협약을 체결하여 정권 말기까지 우호적인 관계를 유지했다.","유대인 혈통을 가진 자는 기독교인이라도 추방하는 정책을 세웠다."],
"answer":3,
"explanation":"히틀러는 1933년 정교협약을 맺었으나 이후 약속을 야금야금 철회하며 가톨릭교회를 탄압했습니다. 정권 말기까지 우호적인 관계가 유지되지 않았습니다."},

{"id":352,"era":"modern","type":"mc",
"question":"슐라이어마허에 관한 서술입니다. 맞는 것을 하나 고르세요.",
"choices":["제1차 세계대전을 계기로 자유주의 신학을 비판하고 계시에 관한 신앙을 회복시켰다.","복음을 비신화화해야 한다고 주장하며 기독교의 핵심을 그리스도 사건에 대한 헌신으로 보았다.","종교는 그리스도 안에 계시된 하나님에 대한 절대 의존감으로 이루어진다고 주장했다.","진화 과정이 더 고상한 삶의 형태를 향해 나아간다고 보며 우주를 성사(聖事)로 해석했다."],
"answer":3,
"explanation":"종교를 절대 의존감으로 정의하고 낭만주의자들의 언어로 루터 신학을 전한 것은 슐라이어마허입니다. ①는 칼 바르트, ②는 루돌프 불트만, ④는 테야르 드 샤르댕입니다."},

{"id":353,"era":"modern","type":"mc",
"question":"20세기 신학자들에 관한 서술입니다. 틀린 것을 하나 고르세요.",
"choices":["칼 바르트는 제1차 세계대전을 계기로 자유주의 신학을 비판하고 하나님의 자기 현시에 관한 신앙을 회복시켰다.","루돌프 불트만은 복음을 비신화화해야 한다고 주장하며 그리스도 사건에 대한 실존적 헌신을 강조했다.","폴 틸리히는 진화 과정이 더 고상한 삶의 형태를 향해 솟아나며 우주 자체를 성사(聖事)로 해석했다.","알브레히트 리츨은 형이상학에 절망한 뒤 그리스도의 지상 생애로 돌아가자고 주장했다."],
"answer":3,
"explanation":"진화론을 수용하여 우주 자체를 성사로 해석한 신학자는 폴 틸리히가 아니라 피에르 테야르 드 샤르댕입니다. 인물 바꿔치기 함정입니다."},

{"id":354,"era":"modern","type":"mc",
"question":"세계교회협의회(WCC)에 관한 서술입니다. 맞는 것을 하나 고르세요.",
"choices":["세계교회협의회에는 개신교만 포함되며 정교회는 가입되어 있지 않다.","러시아 정교회와 그리스 정교회도 세계교회협의회에 가입되어 있다.","로마 가톨릭교회가 주도하여 설립한 에큐메니컬 기관이다.","1910년 에딘버러 선교대회는 WCC 설립과 전혀 무관하다."],

"explanation":"세계교회협의회(WCC)에는 개신교뿐만 아니라 러시아 정교회와 그리스 정교회도 가입되어 있습니다."},

{"id":355,"era":"modern","type":"mc",
"question":"교황 무류설에 관한 서술입니다. 틀린 것을 하나 고르세요.",
"choices":["1870년 바티칸 공의회에서 선포되었다.","교황이 신앙과 도덕에 관해 공식적으로(엑스 카쎄드라) 선포할 때에 한해 오류가 없다는 의미이다.","교황의 모든 결정과 발언이 어떠한 경우에도 오류가 없다는 것을 의미한다.","교황이 일상적인 행정이나 개인적 의견에서는 오류를 범할 수 있다."],
"answer":3,
"explanation":"교황 무류설은 '모든 경우'에 적용되는 것이 아니라, 오직 신앙과 도덕에 관해 엑스 카쎄드라(공식적으로 권좌에서) 선포할 때에만 적용됩니다."},

{"id":356,"era":"modern","type":"mc",
"question":"19세기 부흥운동에 관한 서술입니다. 맞는 것을 하나 고르세요.",
"choices":["옥스퍼드 운동은 모든 사람들을 포괄하려는 광교회의 이상을 품고 회중을 중심으로 경건을 일으켰다.","19세기 초 뉴잉글랜드의 제2차 대각성운동은 제1차의 무절제한 부작용을 피해 절제된 방식으로 진행되었다.","서부 변경에서의 야영집회는 지식층을 대상으로 정제된 방식으로 진행되었다.","옥스퍼드 운동의 영향은 영국 국교회 안에만 한정되었다."],
"answer":2,
"explanation":"뉴잉글랜드의 제2차 대각성운동은 제1차의 무절제를 피해 조심스럽고 절제된 방식으로 진행되었습니다. 서부 야영집회는 격렬한 신체 반응이 특징이었고, 옥스퍼드 운동은 광교회를 배격했으며 그 영향은 국교회를 넘어 개신교 전반에 미쳤습니다."},

{"id":357,"era":"modern","type":"mc",
"question":"가톨릭 현대주의자들에 관한 서술입니다. 틀린 것을 하나 고르세요.",
"choices":["개신교에서 유행하던 성서학 방법을 받아들였다.","동정녀 탄생 신조를 역사 사실로 인정하지 않고 신화로 해석했다.","1910년에 파문을 당했고, 이후 그들의 성경학 방법은 가톨릭 학자들에게 외면당했다.","교황무류 교리를 신자들의 합의 이상의 것이 아니라는 쪽으로 재해석했다."],
"answer":3,
"explanation":"현대주의자들이 파문당한 것은 맞지만, 최근에는 그들의 성서학 방법론이 가톨릭 내에서 대폭 수용되었습니다. 가톨릭과 개신교 학자들 사이의 성경학 차이는 사실상 사라졌습니다."},

{"id":358,"era":"modern","type":"mc",
"question":"감리교도들과 노동운동에 관한 서술입니다. 맞는 것을 하나 고르세요.",
"choices":["1849년 이후 교회를 탈퇴해 노동조합에 가입한 감리교도들은 복음주의 신앙을 버렸다.","교회를 탈퇴해 노동조합에 가입했음에도 복음주의 입장을 버리지 않았다.","감리교도들의 노동운동 참여로 영국에서 노동운동이 완전히 탈기독교화되었다.","감리교도들은 노동운동이 신앙에 반한다고 보아 참여를 거부했다."],
"answer":2,
"explanation":"감리교도들이 교회를 떠나 노동조합에 가입한 것은 사실이나, 그들은 복음주의적 신앙을 버리지 않았습니다. 따라서 영국 노동운동이 '탈기독교화'되었다는 것은 거짓입니다."},

{"id":359,"era":"modern","type":"mc",
"question":"다음 중 복음을 비신화화해야 한다고 주장하며 기독교의 핵심을 그리스도 사건에 대한 절대 헌신으로 본 신학자는?",
"choices":["칼 바르트","슐라이어마허","알브레히트 리츨","루돌프 불트만"],

{"id":360,"era":"modern","type":"mc",
"question":"이탈리아 교회와 국가에 관한 서술입니다. 맞는 것을 하나 고르세요.",
"choices":["가톨릭교회는 이탈리아의 통일을 적극 지지하여 통일 후 큰 영향력을 행사했다.","1929년 무솔리니와의 정교협약으로 바티칸의 정치적 주권을 되찾았지만 성직자 급여를 국가가 지불하여 국가의 통제를 받았다.","정교협약 이후 교회는 국가의 통제로부터 완전히 독립하여 파시즘 정권을 자유롭게 비판했다.","교회가 교회령을 자발적으로 포기하고 이탈리아 통일 운동에 앞장섰다."],
"answer":2,
"explanation":"1929년 정교협약으로 바티칸 주권을 되찾았으나, 성직자 급여를 국가가 지불하게 됨으로써 국가에 의해 효과적으로 통제받게 되었습니다."},

{"id":361,"era":"modern","type":"mc",
"question":"솔로몬 스토다드와 조나단 에드워즈에 관한 서술입니다. 틀린 것을 하나 고르세요.",
"choices":["에드워즈의 할아버지 솔로몬 스토다드는 회심하지 않은 자들이 성찬에 참여하는 것을 허락했다.","에드워즈는 스토다드의 정책을 비판하며 회심하지 않은 자들의 성찬 참여를 제한하려 했다.","에드워즈는 스토다드처럼 회심하지 않은 자들도 성찬에 참여해야 회심할 수 있다고 보았다.","뉴잉글랜드 교회는 처음부터 각성한 자들(회심자들)로만 구성되었다."],
"answer":3,
"explanation":"회심하지 않은 자들의 성찬 참여를 허락하여 성찬을 회심의 수단으로 삼은 것은 스토다드의 정책입니다. 에드워즈는 이 정책을 비판하며 성찬 자격을 엄격히 제한하려 했습니다."},

{"id":362,"era":"modern","type":"mc",

{"id":363,"era":"modern","type":"ox",
"question":"(OX 문제) 러시아 정교회는 공산주의 혁명 이전까지 국가로부터 상당한 독립성을 유지하여 사회에 깊은 영향력을 행사했다.",

{"id":364,"era":"modern","type":"ox",
"question":"(OX 문제) 옥스퍼드 운동은 모든 사람들을 포괄하려는 광교회의 이상을 배격하고, 사도들의 계승자들이 전수해온 역사적 유산과 신조들을 회복하려 했다.",

{"id":365,"era":"modern","type":"ox",
"question":"(OX 문제) 복음주의 부흥운동은 영혼 구원만 강조하여 노예제도 폐지와 같은 사회 개혁에는 관심을 두지 않았다.",

{"id":366,"era":"modern","type":"mc",
"question":"미국의 교회와 국가의 관계에 관한 서술입니다. 틀린 것을 하나 고르세요.",
"choices":["식민지 시대에 다양한 교단들이 각기 자기 지역에서 국교회 역할을 했다.","무역과 공동 방위의 필요, 새로운 이민이 국교회 체제 약화에 기여했다.","미국의 헌법 제정자들은 국가가 초자연적 질서에 속한다고 보아 교회와 국가를 연합시켰다.","교회와 국가의 분리가 완료된 후 미국에서는 교파와 분파의 구분이 사라지고 교단이라는 개념이 정착했다."],

const QUESTIONS = [{"id":1,"type":"mc","question":"16세기 초의 교회 상황에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["교황청은 분열되고 공의회 운동이 세력을 얻고 분파주의와 이단이 성행하여 불안과 두려움이 고조되었다.","성직자 독신의 강화로 성직자 축첩 관행을 부추겼고 성직자들의 도덕적 문란을 성토하는 소리가 높았다.","십일조를 내지 않으면 파문에 처하게 되어 십일조는 혐오 대상이 되었으며, 성직 매매, 면죄부 판매, 교황청 세금에 대해 원성이 높았다.","국가교회나 보편 교회를 지원하기 위해 소교구에 많은 금액이 징수되어 사제들은 단일 소교구에 나오는 수입으로 먹고 살 수 없었다."],"answer":1},{"id":2,"type":"mc","question":"에라스무스에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["구원에 필수적인 교리와 비본질적인 교리를 구분하고, 본질적인 교리들을 사도신경으로 제한했다.","화체설은 근거 없는 스콜라적 궤변으로 여겼고 성찬에서 그리스도의 임재를 영적인 임재로 해석하여 교회의 합의에 정면으로 도전했다.","기독교 고전 본문을 편집하고 번역하며 신약성경 헬라어 본문을 출판했다.","민중에게 성경을 깨우쳐 주려고 노력했으며, 산상수훈으로 돌아가는 것을 강조했다."],"answer":2},{"id":3,"type":"mc","question":"종교개혁자들의 사상에 관한 서술입니다. 맞는 것을 하나 고르세요.","choices":["토마스 뮌처는 루터의 오랜 동료로, 사역자는 성직복도 입지 않고, 급료도 받지 않은 채 스스로 노동으로 생계를 유지하는 평신도여야 하며, 교회 음악과 성상을 배척하고 주의 만찬을 영적으로 해석했다.","멜랑히톤은 십일조를 폐지하기를 바라던 농민들의 요구가 정당성을 갖는다고 보았다.","칼슈타트는 교회의 개혁은 행정관의 동의를 구할 필요가 없고, 참 신자들의 구별된 단체를 세울 것을 주장했고, 국가를 비기독교적 제도로 배척했다.","칼빈은 교회가 독립된 지위를 누려야 하고, 전례 형태를 결정하고, 무엇보다 출교권을 행사해야 한다고 주장했다."],"answer":4},{"id":4,"type":"mc","question":"루터의 사상에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["하나님께 예배할 때 감각적 도구에 의존하지 않고 오직 영혼으로 예배해야 한다고 말했다.","교회는 선택자들로 구성되지만, 선택자들은 오직 하나님만 아신다고 말했다.","미사는 그리스도의 제사를 반복하는 것이 아니며, 그리스도의 제사는 모든 사람을 위해 단번에 치러졌으며, 미사는 신자들의 사귐이므로, 사제 혼자만 참석하는 죽은 자들을 위한 미사는 없애야 한다고 주장했다.","성례는 받는 자의 믿음에 따라 효력을 발휘하고, 화체설을 부인하고, 그리스도께서 성찬물 안에, 또한 그 아래 임재한다고 가르쳤다."],"answer":1},{"id":5,"type":"mc","question":"츠빙글리에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["성경이 명하지 않은 것은 모두 금하려 했다.","성경을 단지 구원의 선포로만 간주하지 않고 교회 조직의 전형으로 간주했다.","헬라어 성경에서 복음서를 번역하고 했으며 전례력에 따라 발췌문(성서정과)에 따라 설교했다.","공적 신앙고백을 한 사람들의 자녀들에게 세례를 베풀 수 있다고 보았다."],"answer":3},{"id":6,"type":"mc","question":"칼빈에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["성찬 때의 그리스도의 실제적―비록 물질적은 아니지만―임재를 믿었다. 그에게는 빵과 포도주가 그리스도께서 임재해 계신다는 상징물이었다.","신앙과 지식을 대립시키기를 거부하고, 그리스도인들은 계시에 의존하므로 흔들릴 수 없는 확신을 누릴 수 있다고 주장했다. 또한 인간의 주된 목적은 하나님과의 합일이 아니라 불가해한 작정 앞에서는 잠잠히 엎드리고 계시된 계명에 대해서는 순종하는 것이라고 가르쳤다.","진정한 기독교 사회에서는 교회와 국가가 협력할 수 있으며, 선지자는 왕을 계도하고 왕은 예배를 뒷받침하고 불경한 자들을 몰아내야 한다고 가르쳤으며, 정부가 교회 문제를 관장하는 것을 인정했다.","참 신앙의 고백, 올바른 삶을 사는 것, 성찬 참여, 이 세 가지 요건을 갖추고 있는 사람은 자신이 선택자라는 것을 확신할 수 있다고 가르쳤다."],"answer":3},{"id":7,"type":"mc","question":"재세례파에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["교회가 국가로부터 분리된 깨달은 신자들의 자발적 사회이며, 신앙에 관한 한 강제로 동의를 끌어내서는 안 된다고 주장했다.","메노파는 단순한 산상보훈의 기독교로서, 신학을 강조하지 않고 품행에 관한 교리를 강조하여 교회와 국가의 분리를 주장했다.","가톨릭측으로부터는 가혹한 탄압을 받았지만, 루터파와 개혁파에게 관용되었다.","유아세례를 세례가 아니라고 보고 진정한 세례는 성인세례라고 보았다."],"answer":3},{"id":8,"type":"mc","question":"종교개혁자의 예배와 성례와 목회에 관한 진술입니다. 틀린 것을 하나 고르세요.","choices":["루터는 하나님께 예배할 때 감각적 도구에 의존하지 않고 오직 영혼으로만 예배해야 한다고 생각했다.","칼빈은 교회에서 시편 찬송은 허용했으나 다른 음악은 허용하지 않았으며, 시편 찬송은 프랑스와 스코틀랜드와 뉴잉글랜드에 있던 칼빈주의 교회 예배의 독특한 특징이 되었다.","에드워드 6세 때에는 전례를 영어로 개정하고 번역하여 공동기도서가 만들어졌다.","츠빙글리는 미사개혁을 단행하고 금식일을 폐지하고 성상도 제거하고 교회음악을 중단시켰으며 오르간도 철거했다."],"answer":1},{"id":9,"type":"mc","question":"영국의 종교개혁에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["1534년 헨리 8세는 교황청과의 관계를 단절하고 왕을 수장으로 하는 독립된 영국 국교회를 세웠다.","헨리 8세는 성경을 영어로 번역하여 모든 교회에 영어 성경을 사용하도록 명령했다.","에드워드 6세 시대에는 전례를 영어로 개정하고 번역하여 공동기도서를 만들었다.","에드워드 사망후 왕위에 오른 메리 튜더는 루터교쪽으로 진행하던 종교개혁을 츠빙글리쪽으로, 칼빈주의쪽으로 진행시켰다."],"answer":4},{"id":10,"type":"mc","question":"가톨릭 종교개혁에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["트렌트 공의회는 교회의 가르침을 위한 권위로 성경과 나란히 전승을 두었다.","트렌트 공의회는 에라스무스를 비롯한 인문주의 학자들을 성경 번역에 적극적으로 활용했다.","가톨릭교회의 개혁 열정은 선교지에서 나타났는데, 여기에는 예수회와 프란체스코회를 비롯한 수도회가 큰 역할을 했다.","1540년 예수회는 교황의 승인을 받았고, 교황청의 “군대”가 되었고, 혁명, 심지어 종교적 목적 하의 군주 살해까지 정당화했다."],"answer":2},{"id":11,"type":"mc","question":"신앙고백 시대에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["1555년 아우그스부르크 평화회의가 열려 영토 원칙에 따라 루터교를 승인하였다. 이로써 “하나의 제국에, 하나의 종교”라는 큰 틀이 무너졌다.","가톨릭과 프로테스탄트 진영의 투쟁은 온건파 숙청으로 이어졌다.","1648년 베스트팔렌 조약은 영토 원칙에서 벗어나 개인의 신앙 자유를 인정했다.","프로테스탄트 교도들도 재세례파를 물에 빠뜨려 죽였고 반삼위일체주의자를 참수와 화형으로 처단했다."],"answer":3},{"id":12,"type":"mc","question":"다음은 영국 종교개혁의 진행과정에 일어난 사건들입니다. 이 사건들을 일어난 순서대로 배열한 것의 번호를 고르세요.\n가) 웨스트민스터 개혁 의회\n나) 헨리 8세의 수장령\n다) 엘리자베드 여왕의 일치령\n라) 비밀집회 금지령\n마) 크롬웰의 독재\n바) 로드의 청교도 탄압\n사) 명예혁명과 관용령\n아) 메리 여왕의 개신교 박해","choices":["나-아-다-바-가-마-라-사","나-아-바-다-마-가-라-사","나-다-아-바-가-라-마-사","나-다-아-바-가-마-라-사"],"answer":1},{"id":13,"type":"mc","question":"유럽 각국의 종교개혁에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["프랑스에서는 수많은 전쟁과 학살 후에 1598년 낭트 칙령으로 위그노는 특정 도시들에서 자유롭게 예배하도록 허락받았으며, 위그노들은 공직에 오를 자유도 있었다.","낙스는 1560년에 스코틀랜드 의회가 칼빈주의를 채택하도록 했으며, 장로교는 스코틀랜드의 국교가 되었다.","네덜란드에서는 윌리엄이 스페인의 압제에 대해 반란군을 일으키고 북부 지방을 차지하여 1581년 독립을 선포하였으며, 가톨릭 교도들, 루터교도들, 칼빈주의자들, 심지어 메노파에게까지 신앙의 자유를 허용했다.","영국 국교회는 국민들에게 하나의 믿음을 강조했지만, 예배와 교회 정치는 자유롭게 선택할 수 있도록 인정했다."],"answer":4},{"id":14,"type":"mc","question":"영국 청교도의 여러 분파에 관한 설명입니다. 틀린 것을 하나 고르세요","choices":["장로파는 주교제와 공동기도서를 배척하고 정치적인 면에서 입헌군주제를 선호했다.","독립파의 교회조직은 회중제였고, 지교회 위에는 주교도, 총회도, 노회도 없었으므로, 권징과 출교는 거의 강조되지 않았다.","침례파는 네덜란드에서 메노파와 접촉하면서 유아세례가 자신들의 교회관과 일치되지 않는다고 확신했다.","유니테리언파는 하나님의 군주적 절대주의를 강조함으로써 신성 내의 복수주의적 개념을 배제했다."],"answer":2},{"id":15,"type":"mc","question":"친우회 혹은 퀘이커교에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["퀘이커교는 재세례파처럼 사회의 틀에서 물러나서 개혁을 주장했다.","창설자 폭스는 성직자도 전례도 성례도 음악도 성소도 모두 없애자고 주장했다.","사회적 평등주의를 주장하여 왕에게도 하인에게 쓰는 것과 똑같은 호칭을 사용하자고 주장했다.","퀘이커교는 재세례파처럼 전쟁과 맹세(서약)을 반대했다."],"answer":1},{"id":16,"type":"mc","question":"신앙고백 시대의 예배, 성례, 목회, 영성에 관한 진술입니다. 틀린 것을 하나 고르세요.","choices":["1633년 캔터베리 대주교로 임명된 윌리엄 로드는 모든 영국인이 실제적 임재설을 믿도록 강요했지만, 의식에 대해서는 자유를 인정했다.","장로교들과 청교도들은 성탄절, 재의 수요일, 사순절, 부활절 등 교회력을 통째로 거부하고 하나님이 제정하신 성일은 안식일뿐이라고 주장했다.","영국의 독립파는 자녀에게 세례를 주었지만, 정회원은 아니라고 했고, 적절한 자비의 행위로 성도임을 입증받을 수 있는 가시적인 성도로 교회가 구성된다고 가르쳤다.","바로크 예술은 화려하고 사치스러운 장식, 열정적이고 드라마틱한 성격, 죽음만이 유일한 해결책이 되는 투쟁의 묘사로 특징지어지는데, 가톨릭의 반동종교개혁과 스페인의 정신을 대변한다."],"answer":1},{"id":17,"type":"mc","question":"청교도들에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["신대륙에 정착한 청교도들(순례조부들)은 영토 원칙을 폐기하고 관용과 신앙의 자유를 인정했다.","청교도는 초기 칼빈파처럼 자본주의의 성장에 기여했다는 평가를 받았다. 그들은 근면, 성실, 검소, 정직으로 번영했고, 약속을 반드시 지켰기 때문에 자본주의 발전에 기여했다.","삼림이 개간되고 공유지를 사유화하여 가난이 극심했을 때 청교도 평신도들은 구호금을 전달하고 빈민을 교육하고 사회에 복귀하는데 앞장섰다.","하나님께 서로 헌신하는 것이 부부의 덕목이 되었기 때문에 결혼은 하나의 이상을 실현하기 위한 동역 관계가 되었다."],"answer":1},{"id":18,"type":"mc","question":"18세기에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["18세기는 상대적으로 평화로운 시대였고, 전쟁을 비판하는 문학이 성행하고 평화를 위한 계획이 수립되었다.","계몽사상은 미신 추방운동으로 마녀 사냥을 종식시켰고, 자연법과 인류에 관한 이상은 민주주의의 토대가 되었고, 자유, 평등, 박애의 구호는 농노 해방과 노예 해방에 기여했다.","부흥운동은 부분적으로는 계몽주의의 건조한 사색과 이완된 윤리에 관한 반작용으로, 그리고 프로테스탄트 신스콜라주의라는 정직된 보수주의에 관한 반작용으로 일어났다.","미국의 건국 조부들은 정치는 인간의 자연 이성의 범주에 있으며, 따라서 국가는 하나님의 뜻에서 해방된다고 주장했다."],"answer":4},{"id":19,"type":"mc","question":"계몽사상가에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["라이프니츠는 하나님의 작품인 자연을 통해 하나님의 정신을 알 수 있다고 주장했다.","휴고 그로티우스는 자연법을 ‘심지어 신이 없을지라도’ 유효한 윤리로 다룸으로써 탈기독교화했다.","라이마루스는 부활은 속임수이며 따라서 기독교는 사기에 의해 출발했다고 이해했다.","존 로크는 정신은 생득적 개념은 없고 경험으로부터 출발해서 진리를 탐구해야 한다고 강조했다."],"answer":1},{"id":20,"type":"mc","question":"이신론에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["이신론은 인격적 하나님, 역사를 통해서 자신을 나타내시고 인간사에 관심을 가진 하나님을 믿지 않고, 천체를 운행하고 별들이 조화롭게 돌 수 있도록 배려한 우주의 조물주로서의 하나님을 강조했다.","이신론의 목적은 미신을 추방하고 이를 합리적 신앙으로 대체하여 사람이 공허한 피조물로 전락하지 않도록 하려는 것이었다.","프랑스 이신론자들은 공공연히 가톨릭 교회를 비판했지만, 북아메리카의 영국 식민지의 이신론은 온건하고 소심했다.","이신론자들은 스스로를 그리스도인이라고 여겼으며 유신론과 무신론과는 구분된다."],"answer":3},{"id":21,"type":"mc","question":"현재 이 세계는 가능한 세계 중에서 최고의 세계라고 생각했지만 리스본 지진 후 이 세계에 관한 풍자로 《캉디드》를 저술한 사람은?","choices":["라이프니츠","볼테르","라이마투스","존 로크"],"answer":2},{"id":22,"type":"mc","question":"18세기 부흥운동 지도자에 관한 서술입니다. 틀린 것을 하나 고르시오.","choices":["진젠도르프의 신앙은 계층과 신조를 초월했으며, 모라비아에서 온 후스파 난민들이나 슐레지엔에서 온 슈벤크펠트파를 받아들이고 심지어 프랑스인 가톨릭 추기경과도 친하게 지냈다.","웨슬리는 강단에 설 권리를 박탈당하자, 말을 타고 촌락과 광산을 찾아다니며 야외 설교를 했다.","요한 비케른은 독일에 지체장애자, 시각장애자, 간질병자, 문둥병자, 사생아, 미혼모, 정신장애자 등 심신에 결함이 있는 모든 사람들을 보살피기 위해 이른바 국내선교회를 조직했다.","뉴잉글랜드의 조나단 에드워즈는 신비주의자들의 전승을 이어받은 체험적 그리스도인으로 계몽사상을 철저히 배격하고 기독교 신앙과 계몽주의를 대립시켰다."],"answer":4},{"id":23,"type":"mc","question":"18세기 부흥운동에 나타난 영성과 경건에 관한 진술입니다. 틀린 것을 하나 고르시오.","choices":["경건주의는 초기부터 박애 사업에 힘써, 프랑케는 고아원을 세우고 진젠도르프는 난민들을 받아들였다.","진젠도르프의 경건은 중세의 그리스도 수난 숭배를 당시의 언어로 표현한 것으로 생각될 수 있고, 서정시인으로 회중 찬송에 새로운 자극을 주었다.","웨슬리의 동료 휘트필드(휫필드)는 회심과 중생한 사람들의 상호지원을 위해 속회를 조직하고 전국의 모임을 감독했다.","조나단 에드워즈는 하나님은 진노의 하나님이시며, 하나님은 패역한 인간을 지옥불에 던져 넣을 충분한 이유가 있지만 참으시고 인간들에게 또 한 번의 기회를 주신다고 설교했다."],"answer":3},{"id":24,"type":"mc","question":"웨슬리에 관한 진술입니다. 틀린 것을 하나 고르시오.","choices":["옥스퍼드 대학을 다니면서 금욕적 품행, 열성적인 기도 생활, 교도소 방문 전도로 놀림감이 되었다.","코크를 북아메리카 감독으로 임명하여 국교회를 떠났고 국교회로부터 버림을 받았다.","모라비아 교도들에게 감명을 받고 런던에서 모라비아 교도 예배에 참여하다가 멜란히톤의 『로마서 주석』에 실린 루터의 서문이 낭독되는 것을 듣고 신생(新生)을 체험했다.","가난한 자를 회심시켜 프롤레타리아를 복음의 범주 안으로 끌어들였다."],"answer":2},{"id":25,"type":"mc","question":"경건주의의 영향에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["독일 민족주의가 대두하는데 기여했다.","초등학교 발전을 통해서 독일 본토뿐만 아니라 스칸디나비아 국가들에도 대중 교육을 촉진했다.","계몽사상과 맞물려 교회사를 바라보는 새로운 방법을 도입했다.","초기부터 박애사업에 힘써, 농민들과 귀족들, 공장 프롤레타리아들의 호감을 샀다."],"answer":4},{"id":26,"type":"mc","question":"19세기 해외 선교에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["개신교의 선교는 개인 회심 체험, 일정 기간의 훈련과 시험 뒤의 교회 가입에 초점을 두었는데, 교회 가입한 다음에는 동족에게서 단절되었다.","카톨릭 선교는 유럽에서의 집단 개종 전통을 이어갔으므로, 개종한 집단이 가지고 들어온 이교 신앙과 의식의 문제를 해결해야 했다.","개신교 선교사들은 복음 전도와 회심을 강조했기 때문에 서구 문명을 전하는 데는 매우 소극적이었다.","복음주의 부흥운동은 개신교권에 대대적인 선교 운동이 일어나게 했다."],"answer":3},{"id":27,"type":"mc","question":"근현대 교회와 국가에 관한 서술입니다. 틀린 것을 하나 고르시오.","choices":["스코틀랜드에서는 장로교회가 국교였는데, 교회를 국가의 통제로부터 해방시키기 위해 1843년 토마스 찰머스를 중심으로 자유교회를 세웠다.","가톨릭권 국가에서는 국가는 공화정이든 사회주의로든 민주화한 반면, 교회는 구체제를 지지했기 때문에 국가가 정교분리를 강요했다.","남아메리카에서는 교회가 스페인과 포르투갈의 지배 계층과 결속했는데, 정교 분리는 칠레를 제외하고는 정치권 측의 반감에서 비롯되었다.","러시아에서는 공산주의 혁명 전까지 교회가 국가에 대해서 상당한 독립성을 유지할 수 있었다."],"answer":4},{"id":28,"type":"mc","question":"미국의 교회와 국가의 관계에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["미국에선 식민지 시대에 다양한 교단들이 저마다 자기들의 지역을 중심으로 국교회 역할을 했다.","정치 판도의 변화, 새로운 이민, 무역과 공동 방위의 필요로 인해 다른 교파들이 관용되었고 교단 간의 차이도 줄어들었다.","부흥운동은 회심한 자들이 국가를 다스려야 한다고 주장하여 교회와 국가의 분리를 반대했다.","교회와 국가의 분리는 1830년대에 완료되었고, 그 뒤 미국에서는 교파와 분파의 구분이 사라졌고, 미국의 교회들은 교단이라 불린다."],"answer":3},{"id":29,"type":"mc","question":"현대의 기독교 박해에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["1917년 공산주의 혁명을 일으킨 사람들은 교회 뿐 아니라 인민의 아편인 종교 자체를 말살하려고 했다.","소련 정부의 박해에도 불구하고 1940년 무신론 계열의 간행물은 적어도 도시 노동자의 절반이 신자들이며 농촌 지역에는 불신자를 찾아보기 힘들다고 인정했다.","히틀러는 개신교 교회들을 국가의 부서로 만들고 기독교를 셈족의 혈통이 없는 게르만족의 종교로 개조하려고 했다.","독일 가톨릭교회는 비스마르크의 독일 통일을 적극적으로 지지하여 통일 후 큰 영향력을 행사했다."],"answer":4},{"id":30,"type":"mc","question":"종교를 현대의 지식과 사상과 조화시키기 위해 노력했던 30세기 신학자들에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["호레이스 부쉬넬은 진보의 원칙은 우주의 구조 자체에 명백히 나타나 있으며, 인간은 불가피하게 더 고등한 상태로 진행해야 한다고 주장했다.","알브레히트 리츨은 형이상학과 궁극적 대답의 가능성에 절망한 뒤, 역사로, 그리스도의 지상 생애에 관해 우리가 알 수 있는 것으로 돌아가자고 제안하여 자유주의 신학의 기초를 놓았다.","슐라이어마허는 종교는 그리스도 안에 계시된 하나님에 관한 절대 의존감으로 이루어진다고 주장하고 도움을 받으려면 통회와 자백으로 자신의 상태와 철저한 의존감을 인정해야 한다고 주장했다.","칼 바르트는 제1차 세계대전을 계기로 자유주의 신학을 비판하고 계시, 즉 하나님의 자기 현시에 관한 신앙을 회복시켰다."],"answer":1},{"id":31,"type":"mc","question":"옥스퍼드 운동에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["소교구들의 예배를 초기 교회의 신성한 상태로 되살리려고 힘썼다.","모든 사람들을 포괄하려는 광교회의 이상을 적극적으로 실천했다.","소교구들의 부흥을 일으키려면 국가에 종속되어 있는 현실을 타파해야 한다고 생각했다.","역사적 증거, 신조들 등 사도들의 계승자들이 전수해온 유산을 회복하기 위해 노력했다."],"answer":2},{"id":32,"type":"mc","question":"근대 이후 산업화와 인구 증가에 관한 기독교의 대응에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["미국에서는 월터 라우센부쉬가 사회복음 운동을 전개하였다.","19세기 중엽까지 노동조합은 불법 단체였으므로 1849년 이후 5년 동안 감리교도의 3분의 1이 교회를 탈퇴하여 노동조합에 가입했는데, 그들은 복음주의 입장을 버리지 않았다.","케텔러는 자유주의를 비판했고, 교황 레오 13세는 \"레룸 노바룸\"이라는 노동문제에 관한 교서를 반포했다.","독일 루터교는 개인의 자유를 존중했기 때문에 자유방임을 옹호하고 국가의 통제를 반대했다."],"answer":4},{"id":33,"type":"mc","question":"다음과 같은 말을 남긴 사람은?\n\"노예제도는 악을 먹고 삽니다. 바르베시아 왕이 브랜디를 원하겠습니까? 그는 야간에 군대를 보내 마을을 붙태우고 쑥대밭을 만들 뿐입니다. (...) 리버풀에서 온 사절은 노예들의 대기 숙소가 “유향과 라임즙 향기로 진동한다”고 말합니다. 그러나 외과의사들은 흑인들이 짐짝처럼 빽빽이 들어차 있어서 그들 사이로 지나가기조차 힘들고 악취도 참을 수 없을 정도라고 합니다. (...) 적어도 죽음이 확실한 통관의 근거이며, 대체로 50%가 죽어나갑니다. 어떤 이는 “우리가 노예 매매를 중단하면 프랑스가 대신하여 이득을 볼 것이다.”라고 주장합니다. 우리는 프랑스에게 더 큰 불행이 임하기를 바라서는 안 될 것입니다. 그러나 프랑스를 위해서, 그리고 인류를 위해서, 나는 프랑스가 그러지 않으리라고 확신, 아니 장담합니다. \"","choices":["웨슬리","조나단 에드워즈","윌리엄 윌버포스","윌리엄 부스(구세군)"],"answer":3},{"id":34,"type":"mc","question":"16세기 초의 교회 상황에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["목회자들과 주교들은 타지에 가 있느라 교구를 비워 두는 일이 많았다.","십일조를 내지 않으면 파문에 처하게 되어 십일조는 혐오 대상이 되었으며, 성직 매매, 면죄부 판매, 교황청 세금에 대해 원성이 높았다.","성직자 독신의 강화로 성직자 축첩 관행을 부추겼고 성직자들의 도덕적 문란을 성토하는 소리가 높았다.","교황청은 분열되고 공의회 운동이 세력을 얻고 분파주의와 이단이 성행했다."],"answer":4},{"id":35,"type":"mc","question":"16세기 초 가톨릭 개혁운동에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["스페인에서는 교리적이고 권징적인 유형으로 세밀한 신조, 규율의 강요가 강조되었다.","네덜란드에서는 자유롭고 비교리적이고 윤리적이며 교육에 의존하여 목적을 성취하려고 한 유형의 개혁이 일어났다.","스페인에선 그리스어와 라틴어를 병기한 콤풀루툼 대역성경이 편찬되었다.","스페인의 히메네스는 구원에 필수적인 교리와 비본질적인 교리를 구분하고, 본질적인 교리들을 사도신경으로 제한했다."],"answer":4},{"id":36,"type":"mc","question":"스페인이 처음 정복사업에 나섰을 때 카리브해 연안의 원주민들에게 야만적 행위를 격렬하게 비판한 인물의 이름은?","choices":["바르톨로메 드 라스카사스","히메네즈","마테오 리치","노빌리"],"answer":1},{"id":37,"type":"mc","question":"종교개혁자들의 사상에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["칼슈타트는 사역자는 성직복도 입지 않고, 급료도 받지 않은 채 스스로 노동으로 생계를 유지하는 평신도여야 한다고 주장하고, 교회 음악과 성상을 배척하고 주의 만찬을 영적으로 해석했다.","토마스 뮌처는 교회의 개혁은 행정관의 동의를 구할 필요가 없고, 참 신자들의 구별된 단체를 세울 것을 주장했고, 국가를 비기독교적 제도로 배척했다.","츠빙글리는 성경이 명하지 않는 것은 모두 금하려 했다.","칼빈은 교회가 독립된 지위를 누려야 하고, 전례 형태를 결정하고, 무엇보다 출교권을 행사해야 한다고 주장했다."],"answer":2},{"id":38,"type":"mc","question":"루터의 사상에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["전례력에 따르는 발췌문(성서정과) 대신 복음서 전체를 설교했으며 헬라어 성경에서 복음서를 번역하려고 했다.","성례는 받는 자의 믿음에 따라 효력을 발휘한다고 주장하고, 화체설을 부인하고 그리스도께서 성찬물 안에, 또한 그 아래 임재한다고 가르쳤다.","모든 신자가 다 사제이며, 행정관은 직위도 영적인 지위라고 주장했다.","구원은 오직 믿음을 통해 하나님의 은혜를 받는 데에 달려 있다고 했다."],"answer":1},{"id":39,"type":"mc","question":"칼빈에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["인간의 주된 목적은 하나님과의 합일이 아니라 그분의 불가해한 작정 앞에서는 잠잠히 엎드리고 계시된 계명들에 대해 순종하는 것이라고 했다.","성찬 때 그리스도의 실제적—물질적이지는 않지만—임재를 믿었다.","교회의 개혁이 행정관의 동의를 기다려야 한다는 것에 반대했다.","묵시적 소망을 희석시켰지만, 대신 사회조직을 구속할 사회적 복음의 길을 열어주었다."],"answer":3},{"id":40,"type":"mc","question":"다음과 같이 말한 사람은?\n\"여러분 존귀하신 영주들께서 간단한 대답을 원하시므로, 저는 거두절미하고 대답하겠습니다. 성경과 명백한 이성에 의해 가책을 받지 않는 한 저는 교황들과 공의회들의 권위를 받아들이지 않습니다. 그들은 서로 모순되기 때문입니다. 제 양심은 하나님의 말씀에 사로잡혀 있습니다. 저는 어떤 것도 철회할 수도 없고 철회하지 않을 것입니다. 양심을 거스른다는 것은 옳지도 않고 안전하지도 않기 때문입니다. 하나님, 저를 도와주옵소서. 아멘\"","choices":["루터","토마스 뮌처","츠빙글리","칼빈"],"answer":1},{"id":41,"type":"mc","question":"종교개혁자의 예배와 성례와 목회에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["재세례파는 교회가 국가로부터 분리된, 깨달은 신자들의 자발적 사회라는 것을 강조했다.","재세례파는 유아세례를 세례가 아니라고 보고 진정한 세례는 성인세례라고 보았다.","츠빙글리는 십자가상은 허용하지 않지만, 십자가는 허용했으며, 교회에서 다른 음악은 허용하지 않지만, 시편 찬송은 허용했다.","루터는 영혼과 육체를 분리할 수 없다고 보아 예배를 돕는 물질적인 것들을 인정했다. 따라서 루터교는 예배에 예술을 남겨두었고, 교회 내의 건축, 조작, 회화에 아무런 혁신이 없었다."],"answer":3},{"id":42,"type":"mc","question":"영국의 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["헨리 8세는 성경을 영어로 번역하여 모든 교회에 영어 성경을 사용하도록 명령했다.","헨리 8세는 수도원을 해체하고 그 재산을 경매에 넘겼다.","헨리 8세는 왕을 수장으로 하는 독립된 영국 국교회를 세웠다.","헨리 8세는 전례를 영어로 번역하여 공동기도서가 출판되었다."],"answer":4},{"id":43,"type":"mc","question":"가톨릭 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세오.","choices":["트렌트 공의회는 성경의 불가타 역본을 모든 논쟁에서 사용하되 문제를 제기할 수 없는 유일한 권위 있는 역본으로 선포했다.","트렌트 공의회는 신자가 축적된 공로를 통해 자신의 구원에 협력할 수 있다고 정의했고, 연옥 교리를 그대로 두었다.","1540년 예수회는 교황의 승인을 받았고, 유럽을 이단으로부터 되찾고 신세계를 개종시키기 위한 교황청의 “군대”가 되었고, 혁명, 심지어 종교적 목적으로 군주 살해까지 정당화했다.","트렌트 공의회에서는 공의회주의가 부활하여 교황의 권위가 약화되었다."],"answer":4},{"id":44,"type":"mc","question":"예수회를 설립하는 데 참여했고, 설립자 이그나티우스 로욜라의 명령에 순종하여 인도와 일본에서 선교했던 선교사의 이름은?","choices":["프란시스 사비에르","노빌리","바르톨로매 라스 카사스","마테오 리치"],"answer":1},{"id":45,"type":"mc","question":"신앙고백 시대에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["1555년 아우그스부르크 평화회의가 열려 영토 원칙에 따라 루터교를 승인하였다. 이로써 “하나의 제국에, 하나의 종교”라는 큰 틀이 무너졌다.","가톨릭과 프로테스탄트 진영의 투쟁은 온건파 숙청으로 이어졌다.","1648년 베스트팔렌 조약은 영토 원칙에서 벗어나 개인의 신앙 자유를 인정했다.","프로테스탄트 교도들도 재세례파를 물에 빠뜨려 죽였고 반삼위일체주의자를 참수와 화형으로 처단했다."],"answer":3},{"id":46,"type":"mc","question":"다음은 영국 종교개혁의 진행과정에 일어난 사건들입니다. 이 사건들을 일어난 순서대로 배열한 것의 번호를 고르세요.\n가) 엘리자베드 여왕의 일치령\n나) 로드의 청교도 탄압\n다) 헨리 8세의 수장령\n라) 명예혁명과 관용령\n마) 웨스트민스터 개혁 의회\n바) 크롬웰의 독재\n사) 메리 여왕의 개신교 박해\n아) 비밀집회 금지령과 5마일령","choices":["다-나-마-가-바-아-사-라","다-사-가-나-바-아-마-라","다-사-가-나-마-바-아-라","다-사-나-마-바-아-가-라"],"answer":3},{"id":47,"type":"mc","question":"영국 청교도의 여러 분파에 대한 설명입니다. 틀린 것을 하나 고르세요","choices":["장로파는 주교제와 공동기도서를 배척하고 정치적인 면에서 입헌군주제를 선호했다.","독립파는 사회적 평등주의를 주장하여 왕에게도 하인에게 쓰는 것과 똑같은 호칭을 사용하자고 주장했다.","침례파는 네덜란드에서 메노파와 접촉하면서 유아세례가 자신들의 교회관과 일치하지 않는다고 확신했다.","친우회(퀘이커교)의 창시자 폭스는 성직자, 전례, 성례, 음악, 성소도 모두 없애자고 주장했다."],"answer":2},{"id":48,"type":"mc","question":"프랑스 종교개혁에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["위그노는 주로 종교적 이유뿐만 아니라 경제적 이유로도 불만이 팽배하던 도시의 장인들이었다.","성 바돌로매 축일에 파리와 대도시에서 수천 명의 위그노가 학살되었다.","1598년 낭트 칙령은 위그노가 프랑스의 특정 도시들에서 자유롭게 예배하도록 허락했지만, 군대 유지, 공직 참여는 배제되었다.","1685년 낭트 칙령이 폐지되자 위그노는 복종이나 추방을 선택하도록 강요되었다."],"answer":3},{"id":49,"type":"mc","question":"신앙고백 시대의 예배, 성례, 목회, 영성에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["엘리자베스 여왕은 주교제, 왕의 수장권, 공동기도서를 의무적으로 받아들이도록 했다.","영국의 장로교들과 청교도들은 성탄절, 재의 수요일, 사순절, 부활절 등 교회력을 강조했다.","1633년 캔터베리 대주교로 임명된 윌리엄 로드는 교리에는 자유가, 정치 조직과 전례에는 일치가 있어야 한다고 믿었다.","바로크 예술은 화려하고 사치스러운 장식, 열정적이고 드라마틱한 성격, 죽음만이 유일한 해결책이 되는 투쟁의 묘사로 특징지어지는데, 가톨릭의 반동종교개혁과 스페인의 정신을 대변한다."],"answer":2},{"id":50,"type":"mc","question":"신대륙에 정착한 청교도들에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["영토 원칙을 폐기하고 관용과 신앙의 자유를 인정했다.","근면, 성실, 검소, 정직으로 번영했고, 약속을 반드시 지켰기 때문에 자본주의 발전에 기여했다.","삼림이 개간되고 공유지를 사유화하여 가난이 극심했을 때 청교도 평신도들은 구호금을 전달하고 빈민을 교육하고 사회에 복귀하는 데 앞장섰다.","하나님께 서로 헌신하는 것이 부부의 덕목이 되었기 때문에 결혼은 하나의 이상을 실현하기 위한 동역 관계가 되었다."],"answer":1},{"id":51,"type":"mc","question":"18세기에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["계몽사상은 신앙고백주의에 대한 반동이었다.","18세기에는 상대적으로 평화로운 시대였고 전쟁을 비판하는 문학이 성행하고 평화를 위한 계획이 수립되었다.","계몽사상은 미신 추방운동으로 마녀 사냥을 종식시켰고 자연법과 인류에 대한 이상은 민주주의의 토대가 되었다.","부흥운동은 철저히 계몽사상과 대립적으로 이해할 수 있다."],"answer":4},{"id":52,"type":"mc","question":"계몽사상에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["자유, 평등, 박애의 구호는 농노 해방과 노예 해방에 기여했다.","자연법을 신이 없을지라도 유효한 윤리로 다루는 세속적인 자연법관이 발전했다.","민족국가가 발전하여 정복만이 평화를 성취할 수 있다는 사상이 지배적이었다.","정치적 결론에 도달하는 데 신적인 인도가 필요 없다고 주장했다."],"answer":3},{"id":53,"type":"mc","question":"이신론에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["스스로를 그리스도인이라고 여겼으며 유신론과 무신론과는 구분된다.","프랑스 이신론자들은 공공연히 가톨릭교회를 비판했지만 영국의 이신론은 온건하고 소심했다.","인격적 하나님, 역사를 통해서 자신을 나타내고 인간사에 관심을 가진 하나님을 강조했다.","이신론의 목적은 미신을 추방하고 이를 합리적 신앙으로 대체하여 사람이 공허한 피조물로 전락하지 않도록 하려는 것이었다."],"answer":3},{"id":54,"type":"mc","question":"18세기 부흥운동에 대한 서술입니다. 틀린 것을 하나 고르세오.","choices":["경건주의의 기원은 중세 말 독일 신비주의자들인 에크하르트와 타울러로 거슬러 올라갈 수 있지만, 직접적인 선구자는 카스파르 슈벤크펠트였다.","경건주의는 독일 민족주의가 대두하는데 기여했고 초기부터 박애 사업에 힘썼다.","뉴잉글랜드의 조나단 에드워즈는 신비주의자들의 전승을 이어받은 체험적 그리스도인으로 계몽사상을 철저히 배격하고 기독교 신앙과 계몽주의를 대립시켰다.","부흥운동은 독일의 경건주의, 영국의 감리교 운동과 성공회 내의 클래팜파, 뉴잉글랜드의 대각성운동으로 전개되었다."],"answer":3},{"id":55,"type":"mc","question":"웨슬리에 대한 진술입니다. 틀린 것을 하나 고르시오.","choices":["가난한 자들을 회심시켜 프롤레타리아들을 복음의 범주 안으로 끌어들였다.","모라비아 교도들에게 감명을 받고 런던에서 모라비아 교도 예배에 참여하다가 멜란히톤의 『로마서 주석』에 실린 루터의 서문이 낭독되는 것을 듣고 신생(新生)을 체험했다.","강단에 설 권리를 박탈당하자, 말을 타고 촌락과 광산을 찾아다니며 야외 설교를 했다.","아버지가 시무하던 엡워스 교회에서 강단에 설 권리를 박탈당하자 국교회를 떠나 새로운 교단을 창설했다."],"answer":4},{"id":56,"type":"mc","question":"독일에 장애자, 미혼모, 사생아 등 심신에 결함이 있는 모든 사람을 보살피기 위해 국내선교회를 조직했고 사회를 개조하려고 한 사람은?","choices":["슈페너","프랑케","진첸도르프","비케른"],"answer":4},{"id":57,"type":"mc","question":"19세기 해외 선교에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["가톨릭 선교의 쇠퇴는 스페인과 포르투갈 식민지 제국들의 약화에, 개신교 선교의 성장은 영국과 네덜란드의 대대적인 식민지 개척과 관련된다.","기독교의 선교는 유대교, 이슬람교, 힌두교, 유교 등의 종교에 큰 타격을 주었다.","개신교의 선교는 개인 회심 체험, 일정 기간의 훈련과 시험 뒤의 교회 가입에 초점을 두었는데, 교회 가입한 다음에는 동족에게서 단절되었다.","개신교 선교는 성경 번역을 강조했고, 현지 문학, 연극, 음악, 건축을 배우고 보전하려고 했으며 수많은 방언에 문자를 만들어주었다."],"answer":2},{"id":58,"type":"mc","question":"근현대 교회와 국가에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["스코틀랜드에서는 장로교회가 국교였는데, 교회를 국가의 통제로부터 해방시키기 위해 1843년 토마스 찰머스를 중심으로 자유교회를 세웠다.","러시아에서는 공산주의 혁명 전까지 교회가 국가에 대해서 상당한 독립성을 유지할 수 있었다.","이탈리아에선 교회가 교회령을 잃을까 염려하여 통일을 반대하였고 1929년 정교협약에 의해 바티칸에 대한 정치 주권을 되찾았지만, 국가가 성직자 급여를 지급하여 국가의 통제를 받았다.","히틀러가 28개 개신교 지역교회들을 묶어 하나의 국가교회를 결성한 직후부터 4천 명의 개신교 목사는 고백교회를 결성하고 1934년 바르멘 선언을 통해 총통이 하나님 말씀 위에 설 수 없다고 선언했다."],"answer":2},{"id":59,"type":"mc","question":"미국에서 교회와 국가가 분리되도록 도움을 준 요인이 아닌 것은?","choices":["부흥운동","무역과 공동방위","초자연적 국가 이해","새로운 이민"],"answer":3},{"id":60,"type":"mc","question":"20세기 교회의 재통합에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["부흥운동은 영혼의 신생을 체험한 모든 사람들을 통합하는 경향을 띠었다.","캐나다에서는 감리교, 회중교회, 장로교가 캐나다 연합교회를 결성했다.","남인도에서는 성공회, 감리교, 장로교, 회중교회가 남인도교회를 결성했다.","세계교회협의회에는 개신교회만 포함되며 러시아 정교회, 그리스 정교회는 가입되어 있지 않다."],"answer":4},{"id":61,"type":"mc","question":"종교는 그리스도 안에 계시된 하나님에 대한 절대 의존감으로 이루어진다고 주장하고 도움을 받으려면 통회와 자백으로 자신의 상태와 철저한 의존감을 인정해야 한다고 주장하여 당시 세속화된 지식인들에게 낭만주의자들의 언어로 루터의 신학을 전했다고 평가되는 자는?","choices":["쉴라이에르마하","프리드리히 슈트라우스","칼 바르트","루돌프 불트만"],"answer":1},{"id":62,"type":"mc","question":"종교를 현대의 지식과 사상과 조화시키기 위해 노력했던 신학자들에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["칼 바르트는 제1차 세계대전을 계기로 자유주의 신학을 비판하고 계시, 즉 하나님의 자기 현시에 대한 신앙을 회복시켰다.","알브레히트 리츨은 형이상학과 궁극적 대답의 가능성에 절망한 뒤, 역사로, 그리스도의 지상 생애에 관해 우리가 알 수 있는 것으로 돌아가자고 제안하여 자유주의 신학의 기초를 놓았다.","루돌프 불트만은 20세기 과학 이전 시대인 1세기 그리스도인들의 사고의 틀을 그대로 사용할 수 없으며 복음을 비신화화해야 하며, 기독교의 핵심은 그리스도 사건으로 이는 절대 헌신을 요구하는 사람이며, 신앙을 갖기 위해서는 자신을 신앙에 헌신하는 모험을 해야 한다고 가르쳤다.","폴 틸리히는 투쟁보다는 사랑의 생명의 법칙이며, 진화 과정이 육체의 차원을 초월하는 더 고상한 삶의 형태를 향해 솟아나며, 우주 자체를 일종의 성사, 즉 보이지 않은 은혜의 보이는 상징으로 해석하여 과학과 신앙을 융합시켰다."],"answer":4},{"id":63,"type":"mc","question":"19세기 부흥운동에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["옥스퍼드 운동은 모든 사람들을 포괄하려는 광교회의 이상을 품고 회중을 중심으로 경건과 기도를 다시 일으키려고 했다.","복음주의 부흥운동은 개신교권에 대대적인 선교 운동이 일어나게 하는데 주된 역할을 했다.","19세기 초 뉴잉글랜드에서 진행된 제2차 각성운동은 제1차 각성운동의 무절제를 피해가며 조심스럽게 진행되고 있었다.","서부 변경에서는 야영집회가 대대적으로 일어났으며, 변경 지대 사람들을 순하게 길들였다."],"answer":1},{"id":64,"type":"mc","question":"근대 이후 산업화와 인구 증가에 대한 기독교의 대응에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["윌리엄 부스는 빈민가에 들어가 가난한 자들을 먹이고 채워 줄 보호소를 설치했다.","미국에서는 월터 라우센부쉬가 사회복음 운동을 전개하였다.","19세기 중엽까지 노동조합은 불법 단체였으므로 1849년 이후 5년 동안 감리교도의 3분의 1이 교회를 탈퇴하여 노동조합에 가입했는데, 그들은 복음주의 입장을 버리지 않았다.","독일에서는 개인의 자유를 존중하였기 때문에 국가가 아버지처럼 공공복지에 책임을 져야 한다는 사상이 뿌리내리기 어려웠다."],"answer":4},{"id":65,"type":"mc","question":"19세기 사회개혁에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["부흥운동은 회심을 강조해서 노예제도에는 관심을 두지 않았다.","영국령에서는 노예 매매 반대 운동이 감리교와 국교회에서 시작되었다.","스위스인 라가츠, 독일인 파울 틸리히는 20세기 초에 기독교 사회주의자들이라 부르는 집단을 결성했다.","미국에서는 노예제도를 두고 감리교, 장로교, 침례교가 북부와 남부로 분열되었다."],"answer":1},{"id":66,"type":"mc","question":"다음과 같은 말을 남긴 사람은?\n\"그리스도인들의 하나님은 단순히 기하학적 진리들로 이루어진 이론인 신이 아니다. 그것은 이교도들의 신이다. 하나님은 섬기는 자들에게 복을 주는 그런 하나님이 아니다. 그것은 유대인들의 신이다. 그리스도인들의 하나님은 사랑과 성결의 하나님이시오, 인간에게 자신의 철저한 비참함과 하나님의 무한한 자비를 느끼게 하시는 하나님이시오, 친히 그들의 존재 근거가 되사 그들에게 겸손과 기쁨과 확신과 사랑을 가득 채워 주시는 하나님이시다.\"","choices":["조지 폭스(퀘이커)","파스칼","슈페너","진첸도르프"],"answer":2},{"id":67,"type":"mc","question":"16세기 초 가톨릭 개혁운동에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["스페인에서는 교리적이고 권징적인 유형으로 세밀한 신조, 규율의 강요가 강조되었다.","에라스무스는 고전 번역과 성경 출판을 위해 노력했으며 여러 학자들의 도움을 얻어 그리스어와 라틴어를 병기한 콤풀루툼 학파 대역성경을 편찬했다.","스페인의 히메니즈는 성직자에 대한 철저한 개혁을 단행하였고 성직자 교육을 위해 알칼라에 대학교를 신설했다.","에라스무스는 구원에 필수적인 교리와 비본질적인 교리를 구분하고, 본질적인 교리들을 사도신경으로 제한했다."],"answer":2},{"id":68,"type":"mc","question":"종교개혁자들의 사상에 대한 서술입니다. 맞는 것을 하나 고르세요.","choices":["멜랑히톤은 루터의 오랜 동료로, 사역자는 성직복도 입지 않고, 급료도 받지 않은 채 스스로 노동으로 생계를 유지하는 평신도여야 하며, 교회 음악과 성상을 배척하고 주의 만찬을 영적으로 해석했다.","에라스무스는 루터와 자유의지에 대해 논쟁하면서 인간이 구원을 얻는데 하나님과 조금은 협력할 수 있다고 보고, 궁극적으로는 성경보다 교회의 권위에 의존했다.","토마스 뮌처는 교회의 개혁은 행정관의 동의를 구할 필요가 없고, 참 신자들의 구별된 단체를 세울 것을 주장했고, 국가를 비기독교적 제도로 배척했다.","츠빙글리는 교회가 독립된 지위를 누려야 하고, 전례 형태를 결정하고, 무엇보다 출교권을 행사해야 한다고 주장했다."],"answer":2},{"id":69,"type":"mc","question":"루터의 사상에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["모든 신자가 다 사제이며, 행정관은 직위도 영적인 지위라고 주장했다.","고해성사를 다른 그리스도인, 심지어 평신도에게라도 자신의 잘못을 자백하는 행위로 축소시켰다.","전례력에 따라 발췌문(성서정과) 대신 복음서 전체를 설교했으며 헬라어 성경에서 복음서를 번역하려고 했다.","미사는 그리스도의 제사를 반복하는 것이 아니며, 그리스도의 제사는 모든 사람을 위해 단번에 치러졌으며, 미사는 신자들의 사귐이므로, 사제 혼자만 참석하는 죽은 자들을 위한 미사는 없애야 한다고 주장했다."],"answer":3},{"id":70,"type":"mc","question":"칼빈에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["신앙과 지식을 대립시키기를 거부하고, 그리스도인들은 계시에 의존하므로 흔들릴 수 없는 확신을 누릴 수 있다고 주장했다.","십자가상은 허용하지 않지만 십자가는 허용했으며, 교회에서 다른 음악은 허용하지 않지만, 시편 찬송은 허용했다.","묵시적 소망을 희석시켰지만, 대신 사회조직을 구속할 사회적 복음의 길을 열어주었다.","성례는 받는 자의 믿음에 따라 효력을 발휘하고, 화체설을 부인하고, 그리스도께서 성찬물 안에, 또한 그 아래 임재한다고 가르쳤다."],"answer":4},{"id":71,"type":"mc","question":"재세례파에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["교회가 국가로부터 분리된 깨달은 신자들의 자발적 사회이며, 신앙에 관한 한, 강제로 동의를 끌어내서는 안 된다고 주장했다.","메노파는 일부다처제, 혁명, 꿈과 환상을 통한 영감, 재림 일자 산정을 배척했다.","1529년 슈파이에르 의회에서 가톨릭측과 루터교 양측은 신성로마제국 전역의 재세례파를 사형에 처하기로 합의했다.","처음 몇십 년 동안에는 주 예수의 재림 등 종말 신앙을 강조하지 않다가 박해를 거치면서 임박한 종말론이 강조되었다."],"answer":4},{"id":72,"type":"mc","question":"가톨릭 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세오.","choices":["트렌트 공의회는 전승과 성경을 나란히 두었으며, 불가타 역본을 유일하게 권위 있는 역본으로 선포했다.","트렌트 공의회는 신자가 축적된 공로를 통해 자신의 구원에 협력할 수 있다고 정의했고, 연옥 교리를 그대로 두었다.","트렌트 공의회는 에라스무스의 정신을 이어 인문주의자들을 성경 번역에 활용하였다.","1540년 예수회는 교황의 승인을 받았고, 유럽을 이단으로부터 되찾고 신세계를 개종시키기 위한 교황청의 “군대”가 되었고, 혁명, 심지어 종교적 목적 하의 군주 살해까지 정당화했다."],"answer":3},{"id":73,"type":"mc","question":"신앙고백 시대에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["1555년 아우그스부르크 평화회의가 열려 영토 원칙에 따라 루터교를 승인하였다. 이로써 “하나의 제국에, 하나의 종교”라는 큰 틀이 무너졌다.","가톨릭과 프로테스탄트 진영의 투쟁은 온건파 숙청으로 이어졌다.","1648년 베스트팔렌 조약은 영토 원칙에서 벗어나 개인의 신앙 자유를 인정했다.","프로테스탄트 교도들도 재세례파를 물에 빠뜨려 죽였고 반삼위일체주의자를 참수와 화형으로 처단했다."],"answer":3},{"id":74,"type":"mc","question":"유럽 각국의 종교개혁에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["프랑스에서는 수많은 전쟁과 학살 후에 1598년 낭트 칙령으로 위그노는 특정 도시들에서 자유롭게 예배하도록 허락받았지만, 군대 유지, 공직 참여는 배제되었다.","낙스는 1560년에 스코틀랜드 의회가 칼빈주의를 채택하도록 했으며, 장로교는 스코틀랜드의 국교가 되었다.","네덜란드에서는 윌리엄이 스페인의 압제에 대해 반란군을 일으키고 북부 지방을 차지하여 1581년 독립을 선포하였으며, 가톨릭 교도들, 루터교도들, 칼빈주의자들, 심지어 메노파에게까지 신앙의 자유를 허용했다.","영국 국교회는 국민들에게 믿고 싶은 것을 믿게 했지만, 예배는 의회가 정한 형식대로 드리도록 했는데, 그것은 주교제, 왕의 수장권, 공동기도서를 의무적으로 받아들여야 함을 뜻했다."],"answer":1},{"id":75,"type":"mc","question":"다음은 영국 종교개혁의 진행과정에 일어난 사건들입니다. 이 사건들을 일어난 순서대로 배열한 것의 번호를 고르세요.\n가) 엘리자베드 여왕의 일치령\n나) 로드의 청교도 탄압\n다) 헨리 8세의 수장령\n라) 명예혁명과 관용령\n마) 웨스트민스터 개혁 의회\n바) 크롬웰의 독재\n사) 메리 여왕의 개신교 박해","choices":["다-나-마-가-바-사-라","다-사-나-가-바-마-라","다-사-가-나-마-바-라","다-사-나-마-바-가-라"],"answer":3},{"id":76,"type":"mc","question":"청교도들에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["신대륙에 정착한 청교도들(순례조부들)은 영토 원칙을 폐기하고 관용과 신앙의 자유를 인정했다.","청교도는 초기 칼빈파처럼 자본주의의 성장에 기여했다는 평가를 받았다. 그들은 근면, 성실, 검소, 정직으로 번영했고, 약속을 반드시 지켰기 때문에 자본주의 발전에 기여했다.","삼림이 개간되고 공유지를 사유화하여 가난이 극심했을 때 청교도 평신도들은 구호금을 전달하고 빈민을 교육하고 사회에 복귀하는데 앞장섰다.","하나님께 서로 헌신하는 것이 부부의 덕목이 되었기 때문에 결혼은 하나의 이상을 실현하기 위한 동역 관계가 되었다."],"answer":1},{"id":77,"type":"mc","question":"18세기에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["계몽사상은 신앙고백주의에 대한 반동이었다.","18세기에는 상대적으로 평화로운 시대였고 전쟁을 비판하는 문학이 성행하고 평화를 위한 계획이 수립되었다.","계몽사상은 미신 추방운동으로 마녀 사냥을 종식시켰고, 자연법과 인류에 대한 이상은 민주주의의 토대가 되었고 자유, 평등, 박애의 구호는 농노 해방과 노예 해방에 기여했다.","부흥운동은 철저히 계몽사상과 대립적으로 이해할 수 있다."],"answer":4},{"id":78,"type":"mc","question":"이신론에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["이신론은 인격적 하나님, 역사를 통해서 자신을 나타내시고 인간사에 관심을 가진 하나님과 함께, 천체를 운행하고 별들이 조화롭게 돌 수 있도록 배려한 우주의 조물주로서의 하나님을 강조했다.","이신론자들은 스스로를 그리스도인으로 여겼으며, 유신론과 무신론과는 구분된다.","프랑스 이신론자들은 공공연히 가톨릭교회를 비판했지만 영국의 이신론은 온건하고 소심했다.","이신론의 목적은 미신을 추방하고 이를 합리적 신앙으로 대체하여 사람이 공허한 피조물로 전락하지 않도록 하려는 것이었다."],"answer":1},{"id":79,"type":"mc","question":"18세기 부흥운동에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["경건주의의 기원은 중세 말 독일 신비주의자들인 에크하르트와 타울러로 거슬러 올라갈 수 있지만, 직접적인 선구자는 카스파르 슈벤크펠트였다.","경건주의는 독일 민족주의가 대두하는데 기여했고 초기부터 박애 사업에 힘썼다.","진젠도르프의 신앙은 계층과 신조를 초월했으며, 모라비아에서 온 후스파 난민들이나 슐레지엔에서 온 슈벤크펠트파를 받아들이고 심지어 프랑스인 가톨릭 추기경과도 친하게 지냈다.","뉴잉글랜드의 조나단 에드워즈는 신비주의자들의 전승을 이어받은 체험적 그리스도인으로 계몽사상을 철저히 배격하고 기독교 신앙과 계몽주의를 대립시켰다."],"answer":4},{"id":80,"type":"mc","question":"18세기 부흥운동에 나타난 영성과 경건에 대한 진술입니다. 틀린 것을 하나 고르시오.","choices":["경건주의는 초기부터 박애 사업에 힘써, 프랑케는 고아원을 세우고 진젠도르프는 난민들을 받아들였다.","진젠도르프의 경건은 중세의 그리스도 수난 숭배를 당시의 언어로 표현한 것으로 생각될 수 있고, 서정시인으로 회중 찬송에 새로운 자극을 주었다.","웨슬리의 동료 휘트필드(휫필드)는 회심과 중생한 사람들의 상호지원을 위해 속회를 조직하고 전국의 모임을 감독했다.","조나단 에드워즈는 하나님은 진노의 하나님이시며, 하나님은 패역한 인간을 지옥불에 던져 넣을 충분한 이유가 있지만 참으시고 인간들에게 또 한 번의 기회를 주신다고 설교했다."],"answer":3},{"id":81,"type":"mc","question":"19세기 해외 선교에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["가톨릭 선교의 쇠퇴는 스페인과 포르투갈 식민지 제국들의 약화에, 개신교 선교의 성장은 영국과 네덜란드의 대대적인 식민지 개척과 관련된다.","가톨릭 선교사들은 공동체성을 강조했고, 개신교 선교사들은 개인의 회심을 강조했다.","개신교 선교는 성경 번역을 강조했고, 현지 문학, 연극, 음악, 건축을 배우고 보전하려고 했으며 수많은 방언에 문자를 만들어주었다.","개신교 선교사들은 복음 전도와 회심을 강조했기 때문에 서구 문명을 전하는 데는 매우 소극적이었다."],"answer":4},{"id":82,"type":"mc","question":"19세기 사회개혁에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["영국에서는 노예 매매 반대 운동이 감리교와 국교회에서 시작되었다.","케텔러는 자유주의를 비판했고, 교황 레오 13세는 \"레룸 노바룸\"이라는 노동문제에 대한 교서를 반포했다.","계몽사상의 인도주의가 경건주의의 윤리의식과 맞물려 사회악들을 경감하기 위한 여러 운동을 일으켰다.","19세기 중엽까지 노동조합은 불법 단체였으므로 1849년 이후 5년 동안 감리교도의 3분의 1이 교회를 탈퇴하여 노동조합에 가입했고, 이로써 영국에서 노동운동은 탈기독교화되었다."],"answer":4},{"id":83,"type":"mc","question":"근현대 교회와 국가에 대한 서술입니다. 틀린 것을 하나 고르시오.","choices":["스코틀랜드에서는 장로교회가 국교였는데, 교회를 국가의 통제로부터 해방시키기 위해 1843년 토마스 찰머스를 중심으로 자유교회를 세웠다.","러시아에서는 공산주의 혁명 전까지 교회가 국가에 대해서 상당한 독립성을 유지할 수 있었다.","이탈리아에서는 교회가 교회령을 잃을까 염려하여 통일을 반대하였고 1929년 정교협약에 의해 바티칸에 대한 정치적 주권을 되찾았지만, 성직자 급여는 국가에 의해 지불되어 국가의 통제를 받았다.","히틀러가 28개 개신교 지역 교회들을 묶어 하나의 국가교회를 결성한 직후부터 4천 명의 개신교 목사는 고백교회를 결성하고 1934년 바르멘 선언을 통해 총통이 하나님 말씀 위에 설 수 없다고 선언했다."],"answer":2},{"id":84,"type":"mc","question":"현대의 기독교 박해에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["1917년 공산주의 혁명을 일으킨 사람들은 교회뿐 아니라 인민의 아편인 종교 자체를 말살하려고 했다.","소련 정부의 박해에도 불구하고 1940년 무신론 계열의 간행물은 적어도 도시 노동자의 절반이 신자들이며 농촌 지역에는 불신자를 찾아보기 힘들다고 인정했다.","히틀러는 개신교 교회들을 국가의 부서로 만들고 기독교를 셈족의 혈통이 없는 게르만족의 종교로 개조하려고 했다.","히틀러는 1933년 정교협약을 체결하여 가톨릭교회에게 성사 집례, 자녀 교육, 수도회 존립, 재산 소유의 자유를 인정하여, 정권 말기까지 가톨릭교회와 우호적인 관계를 유지했다."],"answer":4},{"id":85,"type":"mc","question":"20세기 미국의 교회와 국가의 관계에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["미국에선 식민지 시대에 다양한 교단들이 각기 자기들의 지역을 중심으로 국교회 역할을 했다.","정치 판도의 변화, 새로운 이민, 무역과 공동방위의 필요로 인해 국교회 체제가 약화되었고 다른 교파들이 관용되었으며, 교단 간의 차이도 줄어들었다.","미국의 헌법 제정자들은 국가가 초자연적 질서에 속한다는 것을 강조했으며, 어떠한 교파도 연방의 국교회가 되지 못하도록 정했다.","교회와 국가의 분리는 1830년대에 완료되었고, 그 뒤 미국에서는 교회와 분파의 구분이 사라졌고, 미국의 교회들은 교단이라 불린다."],"answer":3},{"id":86,"type":"mc","question":"종교를 현대의 지식과 사상과 조화시키기 위해 노력했던 20세기 신학자들에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["칼 바르트는 제1차 세계대전을 계기로 자유주의 신학을 비판하고 계시, 즉 하나님의 자기 현시에 대한 신앙을 회복시켰다.","테아르 드 샤르댕은 투쟁보다는 사랑의 생명의 법칙이며, 진화 과정이 육체의 차원을 초월하는 더 고상한 삶의 형태를 향해 솟아나며, 우주 자체를 일종의 성사, 즉 보이지 않은 은혜의 보이는 상징으로 해석하여 과학과 신앙을 융합시켰다.","알브레히트 리츨은 형이상학과 궁극적 대답의 가능성에 절망한 뒤, 역사로, 그리스도의 지상 생애에 관해 우리가 알 수 있는 것으로 돌아가자고 제안하여 자유주의 신학의 기초를 놓았다.","폴 틸리히는 20세기 과학 이전 시대인 1세기 그리스도인들의 사고의 틀을 그대로 사용할 수 없으며 복음을 비신화해야 하며, 기독교의 핵심은 그리스도 사건으로 이는 절대 헌신을 요구하는 사건이며, 신앙을 갖기 위해서는 자신을 신앙에 헌신하는 모험을 해야 한다고 가르쳤다."],"answer":4},{"id":87,"type":"mc","question":"옥스퍼드 운동에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["소교구들의 예배를 초기 교회의 신성한 상태로 되살리려고 힘썼다.","모든 사람들을 포괄하려는 광교회의 이상을 적극적으로 실천했다.","소교구들의 부흥을 일으키려면 국가에 종속되어 있는 현실을 타파해야 한다고 생각했다.","역사적 증거, 신조들 등 사도들의 계승자들이 전수해온 유산을 회복하기 위해 노력했다."],"answer":2},{"id":88,"type":"mc","question":"근대 이후 산업화와 인구 증가에 대한 기독교의 대응에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["도시 빈민 사역은 처음으로 구세군에 의해 시도되었다.","감리교인들은 노동운동에 적극적으로 참여하여 20세기 영국에 파시스트 혁명이 일어나지 않게 한 하나의 이유로 손꼽힌다.","독일에서는 개인의 자유를 존중하였기 때문에 국가가 아버지처럼 공공복지에 책임을 져야 한다는 사상이 뿌리내리기 어려웠다.","가톨릭교회는 오랜 협력의 전통을 가지고 있어서 복지국가의 이념을 받아들이기 쉬웠다."],"answer":3},{"id":89,"type":"mc","question":"다음과 같은 말을 남긴 사람은?\n\"우리는 뜨거운 구원 집회를 연다... 즐겁고 편하고 쉬운 사귐의 밤이다. 소녀들은 벤조와 템버린을 연주하고, 런던에서 보게 되는 활기찬 집회가 두어 시간 지속된다. 짧고 분명하게 드리는 기도 시간이 있고, 다음에 설교 시간이 오는데, 더러는 집회 지도자들이 맡지만, 대부분은 지난 번 집회에서 구원받은 사람들의 간증... 개인 체험을 바탕으로 한 간단한 고백으로 진행된다... 우리는 지금 런던에서 수천 명의 극빈자들을 수용하고 있는데, 그들 중 다수가 전과자, 거지, 떠돌이로서 만물의 찌기에 해당하는 사람들이다.\"","choices":["웨슬리","조나단 에드워즈","윌리엄 윌버포스","윌리엄 부스(구세군)"],"answer":4},{"id":90,"type":"mc","question":"다음과 같은 말을 남긴 사람은?\n\"그리스도인들의 하나님은 단순히 기하학적 진리들로 이루어진 이론인 신이 아니다. 그것은 이교도들의 신이다. 하나님은 섬기는 자들에게 복을 주는 그런 하나님이 아니다. 그것은 유대인들의 신이다. 그리스도인들의 하나님은 사랑과 성결의 하나님이시오, 인간에게 자신의 철저한 비참함과 하나님의 무한한 자비를 느끼게 하시는 하나님이시오, 친히 그들의 존재 근거가 되사 그들에게 겸손과 기쁨과 확신과 사랑을 가득 채워 주시는 하나님이시다.\"","choices":["조지 폭스(퀘이커)","파스칼","슈페너","진젠도르프"],"answer":2},{"id":91,"type":"mc","question":"선택받은 자라는 확신을 얻는 방식에 대한 종교개혁자의 서술입니다. 틀린 것을 하나 고르세요.","choices":["루터는 선택자라는 것을 확신할 시험 방법을 부정했고 따라서 선택자들의 공동체를 세울 수 없다고 보았다.","츠빙글리는 신앙고백으로 선택자를 확인할 수 있다고 보았다.","재세례파는 중생 체험이 시험 기준이 될 수 있다고 보았다.","칼빈은 시험 기준에 성찬에 대한 사랑이 포함될 수 있다고 보았다."],"answer":3},{"id":92,"type":"mc","question":"20세기 교회의 재통합에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["부흥운동은 영혼의 신생을 체험한 모든 사람들을 통합하는 경향을 띠었다.","캐나다에서는 감리교, 회중교회, 장로교가 캐나다 연합교회를 결성했다.","남인도에서는 성공회, 감리교, 장로교, 회중교회가 남인도교회를 결성했다.","세계교회협의회에는 개신교회만 포함되며 러시아 정교회, 그리스 정교회는 가입되어 있지 않다."],"answer":4},{"id":93,"type":"mc","question":"영국 청교도의 여러 분파에 대한 설명입니다. 틀린 것을 하나 고르세요.","choices":["장로파는 주교제와 공동기도서를 배척하고 정치적인 면에서 입헌군주제를 선호했다.","독립파의 교회조직은 회중제였고, 지교회 위에는 주교도, 총회도, 노회도 없었으므로, 권징과 출교는 거의 강조되지 않았다.","침례파는 네덜란드에서 메노파와 접촉하면서 유아세례가 자신들의 교회관과 일치되지 않는다고 확신했다.","친우회(퀘이커)파는 사회적 평등주의를 주장하여 왕에게도 하인에게 쓰는 것과 똑같은 호칭을 사용하자고 주장했다."],"answer":2},{"id":94,"type":"mc","question":"신앙고백 시대의 예배·성례·목회·영성에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["1633년 캔터베리 대주교로 임명된 윌리엄 로드는 모든 영국인이 실제적 임재설을 믿도록 강요했지만, 의식에 대해서는 자유를 인정했다.","장로교들과 청교도들은 성탄절, 재의 수요일, 사순절, 부활절 등 교회력을 통째로 거부하고 하나님이 제정하신 성일은 안식일뿐이라고 주장했다.","영국의 독립파는 자녀에게 세례를 주었지만, 정회원은 아니라고 했고, 적절한 자비의 행위로 성도임을 입증받을 수 있는 가시적인 성도로 교회가 구성된다고 가르쳤다.","친우회의 창시자 폭스는 전례도 성례도 음악도 성소도 모두 없애자고 주장했으며 성령을 강조했다."],"answer":1},{"id":95,"type":"mc","question":"18세기 사상가에 대한 서술입니다. 틀린 것을 하나만 고르세요.","choices":["휴고 그로티우스는 자연법을 신이 없을 지라도 유효한 윤리로 다루어 이를 탈기독화했다.","윌리엄 페일리는 하나님의 작품인 자연을 통해 하나님의 정신을 알 수 있다고 주장했다.","루소는 이 세계는 가능한 세계 중에서 최고의 세계라고 생각했지만, 리스본 지진 후에 이 세계에 대한 풍자로 『캉디드』를 저술했다.","존 로크는 생득적 개념은 없으며, 경험에서 출발해서 자연을 연구하고 그 기초 위에서 자연의 신을 연구해야 한다고 가르쳤다."],"answer":3},{"id":96,"type":"mc","question":"국교회 자체가 아니라, 의회에 책임을 지는 평신도 후원자가 회중의 뜻과 무관하게 임의로 성직자를 임명하는 권한을 반대하여 목사들이 담임 교회와 목사관과 재산을 포기하고 국교회를 탈퇴한 나라는?","choices":["영국","스코틀랜드","네덜란드","오스트리아"],"answer":2},{"id":97,"type":"mc","question":"종교개혁 시대의 예배와 성례와 목회에 대한 진술입니다. 틀린 것을 하나 고르세요.","choices":["재세례파는 모든 집회는 성령이 주관하시며, 남자든 여자든, 누가 성령의 인도로 말하게 될 때까지 모두가 잠잠히 있어야 한다고 했다.","루터는 영혼과 육체를 분리할 수 없다고 보아 예배를 돕는 물질적인 것들을 인정했다. 따라서 루터교는 예배에 예술을 남겨두었고, 교회 내의 건축, 조작, 회화에 아무런 혁신이 없었다.","에드워드 6세 때에는 전례를 영어로 개정하고 번역하여 공동기도서가 만들어졌다.","츠빙글리는 미사개혁을 단행하고 금식일을 폐지하고 성상도 제거하고 교회음악을 중단시켰으며 오르간도 철거했다."],"answer":1},{"id":98,"type":"mc","question":"웨슬리에 대한 설명입니다. 틀린 것을 하나 고르세요.","choices":["옥스퍼드 대학을 다니면서 금욕적 품행, 열성적인 기도 생활, 교도소 방문 전도로 놀림감이 되었다.","모라비아 예배당에서 멜란히톤의 <로마서주석>에 실린 루터의 서문이 낭독되는 것을 듣고 신생을 체험했다.","가난한 자를 회심시켜 프롤레타리아를 복음의 범주 안으로 끌어들였다.","아버지가 시무하던 엡워스 교회에서 강단에 설 권리를 박탈당하자 국교회를 떠나 새로운 교단을 창설했다."],"answer":4},{"id":99,"type":"mc","question":"16세기에 인도에서 사역하면서 카스트 제도를 받아들이고 브라만처럼 생활함으로써 지도자들을 얻으려고 노력하고, 한편으로는 브라만 계층을 위한 교회가 있어야 하고 다른 편으로는 하층민들을 위한 교회가 있어야 한다고 믿었던 선교사는?","choices":["노빌리","프란시스코 사비에르(하비에르)","라스 카사스","마테오 리치"],"answer":1},{"id":100,"type":"mc","question":"16세기 초의 교회 상황에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["공의회 운동이 교황 통제 하에 종속되었으며, 교황청의 분열도 종식되었다.","성직자 독신의 강화로 성직자 축첩 관행을 부추겼고 사제들의 서자는 심하게 차별을 받았다.","하위 성직자들은 제대로 교육을 받지 못했고, 국가 교회나 보편 교회를 지원하는데 많은 금액이 징수되었고, 사제들은 단일 소교구에서 나오는 수입으로 먹고 살 수 없었고 교구의 목회자가 비는 경우가 많았다.","스페인이 확고히 기독교 세계로 편입되어 종교재판소의 엄격한 정책이 완화될 수 있었다."],"answer":2},{"id":101,"type":"mc","question":"16세기 초 가톨릭 개혁운동에 관한 서술입니다. 틀린 것을 하나 고르세요.","choices":["에라스무스는 구원에 필수적인 교리와 비본질적인 교리를 구분하고, 본질적인 교리들을 사도신경으로 제한했다.","스페인에서는 자유롭고 비교리적이고 윤리적이며 교육에 의존하여 목적을 성취하려고 한 유형의 개혁이 일어났다.","스페인에선 그리스어와 라틴어를 병기한 콤풀루툼 대역성경이 편찬되었다.","복음주의적 인문주의에는 에라스무스 이외에도 영국의 존 콜레트, 토마스 모어, 프랑스의 자크 르페브르 데타플, 장 스탕동크, 이탈리아의 후안 드 발데스가 포함된다."],"answer":2},{"id":102,"type":"mc","question":"루터의 사상에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["고해성사를 가톨릭교회의 폐해라고 보고 폐기했다.","성례는 받는 자의 믿음에 따라 효력을 발휘한다고 주장하고, 화체설을 부인하고 그리스도께서 성찬물 안에, 또한 그 아래 임재한다고 가르쳤다.","교회가 혼인에 복을 빌 수 있지만, 혼인이란 본질상 일반 사회의 문제라고 보았다.","기독교 행정관들도 모두 그리스도인으로 세례를 받은 자들이므로 사제들이라고 주장했다."],"answer":1},{"id":103,"type":"mc","question":"칼빈에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["십자가상은 허용하지 않지만, 십자가는 허용했으며, 교회에서 다른 음악은 허용하지 않지만 시편 찬송은 허락했다.","인간의 주된 목적은 하나님과의 합일이 아니라 그분의 불가해한 작정 앞에서는 잠잠히 엎드리고 계시된 계명들에 대해 순종하는 것이라고 했다.","성찬 때 그리스도의 실제적--물질적이지는 않지만-- 임재를 믿었다.","제네바에서는 교회의 권징은 교회의 권한이라는 것이 확인되었으며 이단 재판도 교회에 의해 주도되었다."],"answer":4},{"id":104,"type":"mc","question":"재세례파에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["교회가 국가로부터 분리된, 깨달은 신자들의 자발적 사회라는 것을 강조했다.","메노파는 단순한 산상보훈의 기독교로서 신학을 될 수 있는 대로 강조하지 않고 품행에 관한 교리를 강조하여 교회와 국가의 분리를 주장했다.","유아세례를 세례가 아니라고 보고 진정한 세례는 성인세례라고 보았다.","처음 몇십 년 동안 재세례파는 주 예수의 재림 등 종말신앙을 강조하지 않다가 박해를 거치면서 임박한 종말론이 강조되었다."],"answer":4},{"id":105,"type":"mc","question":"츠빙글리에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["교회력에 따른 전례서에 실린 마태복음 발췌문에 준해 설교하지 않고 복음서 전체를 놓고 설교했다.","교회정치와 전례를 비본질적인 것으로 보고 다양성의 문을 열어놓았다.","선택받은 자들은 참 신앙을 공개적으로 지지하고 회중 앞에서 성찬을 받는 것으로 입증된다고 보았다.","금식일을 폐지하고 대성당에서 성상을 제거했고 벽들을 하얗게 칠하고 오르간을 폐쇄했다."],"answer":2},{"id":106,"type":"mc","question":"영국의 종교에 대한 서술입니다. 틀린 것을 하나 고르세요.","choices":["헨리 8세는 왕을 수장으로 하는 독립된 영국 국교회를 세웠다.","에드워드 6세는 성경을 영어로 번역하여 모든 교회에 영어 성경을
