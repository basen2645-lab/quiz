<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조직신학개론 기말고사 모의고사</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1c1428 0%, #2a1f3d 50%, #1a0e2e 100%);
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    color: #e2e8f0;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 20px; }
  #home { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .home-card {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px; padding: 44px 36px; max-width: 500px; width: 100%;
    text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.5);
  }
  .home-icon { font-size: 48px; margin-bottom: 12px; }
  .home-title { color: #d4b8ff; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .home-sub { color: #7a6a9a; font-size: 13px; margin-bottom: 26px; }
  .set-row { display:flex; gap:6px; margin-bottom:14px; justify-content:center; flex-wrap:wrap; }
  .set-btn {
    padding: 5px 11px; border-radius: 14px; font-size: 11px;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
    border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #5a4a7a;
  }
  .set-btn.active { border-color: rgba(212,184,255,0.5); background: rgba(212,184,255,0.1); color: #c4a8ef; }
  .filter-row { display:flex; gap:8px; margin-bottom:18px; justify-content:center; }
  .filter-btn {
    padding: 7px 14px; border-radius: 18px; font-size: 12px;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
    border: 2px solid rgba(255,255,255,0.1); background: transparent; color: #6a5a8a;
  }
  .filter-btn.active { border-color: #d4b8ff; background: rgba(212,184,255,0.1); color: #d4b8ff; }
  .count-wrap { margin-bottom: 22px; }
  .count-label { color: #8a7aaa; font-size: 13px; display:block; margin-bottom:10px; }
  .count-val { color: #d4b8ff; font-weight: 700; }
  input[type=range] { width:100%; accent-color: #d4b8ff; }
  .range-mm { display:flex; justify-content:space-between; color:#3a2a5a; font-size:11px; margin-top:4px; }
  .btn-start {
    width:100%; padding:16px;
    background: linear-gradient(135deg, #6b3fa0, #9b6de0);
    color: #fff; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 20px rgba(107,63,160,0.4); transition: transform 0.1s;
  }
  .btn-start:active { transform: scale(0.98); }
  #quiz { display:none; }
  .quiz-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .btn-back { background:transparent; border:none; color:#6a5a8a; cursor:pointer; font-size:20px; padding:4px 8px; }
  .q-counter { color:#8a7aaa; font-size:13px; }
  .score-badge { background:rgba(212,184,255,0.1); color:#d4b8ff; padding:4px 12px; border-radius:12px; font-size:12px; border:1px solid rgba(212,184,255,0.2); }
  .progress-bar { height:3px; background:rgba(255,255,255,0.07); border-radius:2px; margin-bottom:18px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#6b3fa0,#9b6de0); border-radius:2px; transition:width 0.4s ease; }
  .card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09); border-radius:18px; padding:22px 20px; margin-bottom:14px; }
  .set-label { font-size:11px; color:#3a2a5a; margin-bottom:4px; }
  .type-badge { display:inline-block; padding:3px 10px; border-radius:8px; font-size:11px; font-weight:600; margin-bottom:8px; }
  .type-mc { background:rgba(155,109,224,0.18); color:#c4a8ef; }
  .type-sa { background:rgba(134,239,172,0.18); color:#86efac; }
  .q-text { color:#e2e8f0; font-size:14.5px; line-height:1.8; white-space:pre-wrap; }
  .choices { margin-bottom:14px; }
  .choice-btn {
    width:100%; text-align:left; padding:12px 14px; border-radius:12px;
    border:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.03);
    color:#7a6a9a; cursor:pointer; margin-bottom:6px; font-family:inherit; font-size:13.5px;
    display:flex; align-items:flex-start; gap:10px; line-height:1.65; transition:all 0.15s;
  }
  .choice-btn:hover:not([disabled]) { border-color:rgba(255,255,255,0.15); background:rgba(255,255,255,0.06); }
  .choice-btn.selected { background:rgba(155,109,224,0.1); border-color:rgba(155,109,224,0.35); color:#d4b8ff; }
  .choice-btn.correct { background:rgba(110,231,183,0.1); border-color:rgba(110,231,183,0.35); color:#6ee7b7; }
  .choice-btn.wrong { background:rgba(239,68,68,0.1); border-color:rgba(239,68,68,0.35); color:#f87171; }
  .choice-label { font-weight:700; min-width:22px; font-size:15px; flex-shrink:0; }
  .choice-mark { margin-left:auto; padding-left:6px; flex-shrink:0; }
  .sa-wrap { margin-bottom:14px; }
  .sa-input {
    width:100%; padding:12px 14px; border-radius:12px;
    border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05);
    color:#e2e8f0; font-family:inherit; font-size:14px;
    margin-bottom:8px; outline:none; transition:border 0.2s; resize:vertical; min-height:44px;
  }
  .sa-input:focus { border-color:rgba(134,239,172,0.4); }
  .sa-answer-box { padding:12px 14px; border-radius:12px; background:rgba(110,231,183,0.08); border:1px solid rgba(110,231,183,0.2); color:#6ee7b7; font-size:13.5px; line-height:1.7; display:none; }
  .sa-answer-label { font-size:11px; color:#3a8060; margin-bottom:4px; font-weight:600; }
  .btn-show-ans {
    width:100%; padding:10px; background:transparent; color:#3a6050;
    border:1px solid rgba(134,239,172,0.15); border-radius:10px; font-size:13px;
    cursor:pointer; font-family:inherit; margin-bottom:8px; transition:all 0.2s;
  }
  .btn-show-ans:hover { background:rgba(134,239,172,0.06); color:#6ee7b7; }
  .explanation { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:12px; padding:12px 14px; font-size:12.5px; color:#5a4a7a; line-height:1.7; margin-bottom:12px; display:none; }
  .explanation.show { display:block; }
  .exp-label { font-size:11px; color:#3a2a5a; margin-bottom:6px; font-weight:600; }
  .feedback { border-radius:12px; padding:12px 16px; margin-bottom:12px; font-size:14px; font-weight:600; text-align:center; display:none; }
  .feedback.correct { background:rgba(110,231,183,0.07); border:1px solid rgba(110,231,183,0.25); color:#6ee7b7; }
  .feedback.wrong { background:rgba(239,68,68,0.07); border:1px solid rgba(239,68,68,0.25); color:#f87171; }
  .btn-confirm {
    width:100%; padding:14px; background:linear-gradient(135deg,#6b3fa0,#9b6de0);
    color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:700;
    cursor:pointer; font-family:inherit; transition:all 0.2s;
  }
  .btn-confirm:disabled { background:rgba(255,255,255,0.05); color:#2a1a4a; cursor:not-allowed; }
  .btn-next {
    width:100%; padding:14px; background:rgba(20,10,40,0.8); color:#9b6de0;
    border:1px solid rgba(155,109,224,0.2); border-radius:12px; font-size:15px;
    font-weight:700; cursor:pointer; font-family:inherit; display:none; margin-top:8px;
  }
  #review { display:none; }
  .result-card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09); border-radius:20px; padding:32px 24px; text-align:center; margin-bottom:20px; }
  .result-emoji { font-size:48px; margin-bottom:8px; }
  .result-score { color:#d4b8ff; font-size:46px; font-weight:800; margin-bottom:4px; }
  .result-sub { color:#5a4a7a; font-size:14px; }
  .result-sub .ok { color:#6ee7b7; }
  .result-sub .bad { color:#f87171; }
  .result-sub .skip { color:#d4b8ff; }
  .wrong-title { color:#d4b8ff; font-size:14px; margin-bottom:12px; font-weight:600; }
  .wrong-item { background:rgba(239,68,68,0.05); border:1px solid rgba(239,68,68,0.18); border-radius:14px; padding:16px; margin-bottom:10px; }
  .wrong-q { color:#cbd5e1; font-size:13px; margin-bottom:10px; line-height:1.65; }
  .wrong-set { font-size:11px; color:#4a3a6a; margin-bottom:4px; }
  .review-choice { padding:8px 12px; border-radius:9px; margin-bottom:4px; font-size:12px; line-height:1.5; display:flex; gap:8px; align-items:flex-start; border:1px solid transparent; color:#3a2a5a; }
  .review-choice.correct { background:rgba(110,231,183,0.08); border-color:rgba(110,231,183,0.28); color:#6ee7b7; }
  .review-choice.wrong { background:rgba(239,68,68,0.08); border-color:rgba(239,68,68,0.25); color:#f87171; }
  .review-exp { font-size:11.5px; color:#3a2a5a; margin-top:8px; line-height:1.6; padding-top:8px; border-top:1px solid rgba(255,255,255,0.05); }
  .btn-retry { width:100%; padding:16px; background:linear-gradient(135deg,#6b3fa0,#9b6de0); color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:16px; }
</style>
</head>
<body>
<div id="home">
  <div class="home-card">
    <div class="home-icon">📗</div>
    <h1 class="home-title">조직신학개론</h1>
    <p class="home-sub" id="home-sub">기말고사 기출 해설 · 총 125문제</p>
    <div class="set-row">
      <button class="set-btn active" data-set="all" onclick="setSet('all')">전체</button>
      <button class="set-btn" data-set="2022A" onclick="setSet('2022A')">2022A</button>
      <button class="set-btn" data-set="2022B" onclick="setSet('2022B')">2022B</button>
      <button class="set-btn" data-set="2023년" onclick="setSet('2023년')">2023</button>
      <button class="set-btn" data-set="2024-1" onclick="setSet('2024-1')">2024-1</button>
      <button class="set-btn" data-set="2024/2025" onclick="setSet('2024/2025')">2024/25</button>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">전체</button>
      <button class="filter-btn" data-filter="mc" onclick="setFilter('mc')">객관식</button>
      <button class="filter-btn" data-filter="sa" onclick="setFilter('sa')">단답형</button>
    </div>
    <div class="count-wrap">
      <span class="count-label">문제 수: <span class="count-val" id="count-display">20</span>문제</span>
      <input type="range" id="count-slider" min="5" max="125" value="20" oninput="updateCount(this.value)">
      <div class="range-mm"><span>5</span><span id="range-max">96</span></div>
    </div>
    <button class="btn-start" onclick="startQuiz()">시작하기</button>
  </div>
</div>

<div id="quiz">
  <div class="wrap">
    <div class="quiz-header">
      <button class="btn-back" onclick="goHome()">←</button>
      <span class="q-counter" id="q-counter">1 / 20</span>
      <span class="score-badge" id="score-badge">0 점</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="card">
      <div class="set-label" id="set-label"></div>
      <span class="type-badge" id="type-badge">객관식</span>
      <p class="q-text" id="q-text"></p>
    </div>
    <div class="choices" id="choices"></div>
    <div class="sa-wrap" id="sa-wrap" style="display:none">
      <textarea class="sa-input" id="sa-input" placeholder="답을 입력하세요..." rows="2"></textarea>
      <button class="btn-show-ans" id="btn-show-ans" onclick="showSAAnswer()">📋 정답 확인하기</button>
      <div class="sa-answer-box" id="sa-answer-box">
        <div class="sa-answer-label">✅ 정답</div>
        <div id="sa-answer-text"></div>
      </div>
    </div>
    <div class="explanation" id="explanation"><div class="exp-label">📖 풀이</div><div id="exp-text"></div></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn-confirm" id="btn-confirm" disabled onclick="confirmAnswer()">정답 확인</button>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">다음 문제 →</button>
  </div>
</div>

<div id="review">
  <div class="wrap">
    <div class="result-card">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-score" id="result-score">--점</div>
      <div class="result-sub" id="result-sub"></div>
    </div>
    <div id="wrong-list"></div>
    <button class="btn-retry" onclick="goHome()">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS=[{"id":1,"set":"2022A","type":"mc","question":"신약에서의 성령의 사역의 6가지 측면들에 속하지 않는 것은?","choices":["예수 그리스도를 넘어서는 신비","새로운 삶의 권능","새로운 자유의 권능","새로운 공동체의 권능"],"answer":1,"explanation":"성령은 그리스도를 현재적으로 현존하게 하는 '재현적 권능'으로 묘사되며, 결코 예수 그리스도의 인격과 사역을 넘어서거나 그와 분리된 독자적 신비로 존재하지 않습니다."},{"id":2,"set":"2022A","type":"mc","question":"종교신학에서 폴 니터의 4가지 유형이 아닌 것은?","choices":["배타","성취","상호성","비교불가능성(incommensurability)"],"answer":4,"explanation":"폴 니터의 4유형은 '대체(배타), 성취, 상호성, 수용'입니다. 비교불가능성(특수성)은 조지 린드벡의 후기자유주의적 입장입니다."},{"id":3,"set":"2022A","type":"mc","question":"다음 중 학자와 종교 이해가 잘못 연결된 것은?","choices":["포이어바흐 - 종교투사론","칼 마르크스 – 종교는 아편","칼 바르트 - 종교는 하나님의 계시","프로이트 – 종교는 유아기적 환영"],"answer":3,"explanation":"칼 바르트는 종교를 하나님의 참된 계시에 대한 인간의 교만이자 '우상숭배(불신앙)'라고 강하게 비판했습니다."},{"id":4,"set":"2022A","type":"mc","question":"니케아신조에서의 교회의 고전적 표지들 4가지가 아닌 것은?","choices":["통일성","도덕성","보편성","사도성"],"answer":2,"explanation":"381년 니케아-콘스탄티노플 신조의 4대 표지는 '하나의(통일성), 거룩한(거룩성), 보편적, 사도적' 교회입니다. 도덕성은 표지가 아닙니다."},{"id":5,"set":"2022A","type":"mc","question":"다음 중 세례의 의미와 관련이 가장 먼 것은?","choices":["예수 그리스도와의 연합","죄로 물든 삶을 씻는 것","성령으로 다시 태어나는 것","교인수의 확보와 교회성장"],"answer":4,"explanation":"세례는 은혜의 표시이자 타자와의 연대, 제자도로의 부름을 의미하는 성례이며, 양적 성장을 위한 수단이 아닙니다."},{"id":6,"set":"2022A","type":"mc","question":"다음 중 연결이 잘못된 것은?","choices":["조지 린드벡 - 종교의 차이점/특수성/이질성 강조","칼 라너 - 익명의 그리스도인(anonymous Christian)","존 힉 – 포용주의","밀리오리 – 삼위일체적 종교신학"],"answer":3,"explanation":"존 힉(John Hick)은 모든 종교가 하나의 궁극적 실재를 향한다는 '신중심주의적 다원주의' 학자이며 포용주의자가 아닙니다."},{"id":7,"set":"2022A","type":"mc","question":"밀리오리가 말하는 그리스도인의 삶의 성장을 나타내는 6가지 기준/표지가 아닌 것은?","choices":["성숙한 소망","성숙한 기도","성숙한 개인주의","성숙한 연대"],"answer":3,"explanation":"밀리오리의 성화 6표지는 성숙한 경청, 기도, 자유, 연대, 감사(기쁨), 소망입니다."},{"id":8,"set":"2022A","type":"mc","question":"다음 중 연결이 잘못된 것은?","choices":["천주교의 화체설(transubstantiation)","루터의 공재설(consubstantiation)","칼뱅의 영적 실재적 임재설(spiritual real presence)","안셀무스의 기념설(memoralism)"],"answer":4,"explanation":"성만찬을 단순히 기억하고 상기하는 것이라는 '기념설'을 주장한 학자는 안셀무스가 아니라 츠빙글리입니다."},{"id":9,"set":"2022A","type":"mc","question":"기독교의 소망을 표현하는 고전적 상징들이 아닌 것은?","choices":["보편구원설","예수 그리스도의 재림(advent/parousia)","죽은자들의 부활 & 몸의 부활","최후의 심판"],"answer":1,"explanation":"참된 기독교적 종말 소망의 4대 고전적 상징은 재림(파루시아), 부활, 심판, 영생입니다. 보편구원설은 상징이 아닙니다."},{"id":10,"set":"2022A","type":"mc","question":"다음 중 연결이 잘못된 것은?","choices":["흑인신학 - 인종차별(racism)","페미니즘신학 - 가부장제(patriarchy)","해방신학 - 정치적, 경제적 억압","히스패닉신학 - 민족적, 문화적 정체성"],"answer":0,"explanation":"보기들은 모두 상황신학의 핵심 주제들과 정확하게 일치합니다. (히스패닉 신학은 혼혈성/메스티사헤를 통한 문화적 정체성을 다룹니다.)"},{"id":11,"set":"2022A","type":"sa","question":"밀리오리에 따르면 교회에 대한 신약의 이미지들 네 가지는 무엇인가?","answer":"① 하나님의 백성, ② 섬기는 백성, ③ 그리스도의 몸, ④ 성령의 공동체","explanation":"밀리오리는 교회를 단순한 제도가 아닌 다양한 이미지로 이해하며, 각 이미지는 교회의 서로 다른 본질적 측면을 드러냅니다."},{"id":12,"set":"2022A","type":"sa","question":"신학적인 의미에서 성자/성령의 '파송(missions)'과 '출원/발출(processions)'은 각각 무슨 의미인가?","answer":"① 파송: 창조와 구원 역사 속(대외적)으로 성자와 성령을 보내신 경륜적 사역. ② 출원: 창세 전 삼위일체 하나님 내부(대내적)에서 성자와 성령이 성부로부터 나오심","explanation":"파송은 역사 안에서의 외적 사역(opera ad extra), 출원은 삼위일체 내부의 영원한 관계(opera ad intra)를 가리킵니다."},{"id":13,"set":"2022A","type":"sa","question":"성만찬에서 에피클레시스(epiclesis)는 무슨 뜻인가?","answer":"떡과 포도주, 그리고 참여하는 자들에게 성령께서 임재해 주시기를 간구하는 '성령 임재 기원 기도'","explanation":"에피클레시스는 성만찬 예식에서 성령의 임재를 요청하는 기도로, 동방교회 전통에서 특히 강조됩니다."},{"id":14,"set":"2022A","type":"sa","question":"칼뱅의 교회의 표지들은 무엇인가?","answer":"① 하나님의 말씀의 순수한 선포, ② 성례의 올바른 집행","explanation":"칼뱅은 참된 교회를 식별하는 두 표지로 말씀의 순수한 선포와 성례의 올바른 집행을 제시했습니다."},{"id":15,"set":"2022A","type":"sa","question":"선교학자 앤드류 월스가 말하는 복음 전파에 존재하는 '번역의 원리'는 무엇인가?","answer":"복음이 특정한 하나의 문화나 언어에 고정되지 않고, 다양한 언어와 역사적 상황 속으로 끊임없이 새롭게 번역되며 전파되어야 한다는 원리","explanation":"성육신 자체가 하나님의 말씀이 인간의 언어와 문화로 '번역'된 사건이므로, 복음은 본질적으로 번역 가능하고 번역되어야 합니다."},{"id":16,"set":"2022A","type":"sa","question":"기독교적 종교신학에서 '둘레길 이론'에 관하여 설명하시오.","answer":"존 힉의 신중심주의(모든 종교가 같은 정상으로 간다는 등산로 비유)를 비판하며, 각 종교는 목적지(정상)가 다르고 산 주변을 맴도는 각자의 둘레길처럼 서로 고유한 특수성을 지닌다는 백충현 교수의 이론","explanation":"둘레길 이론은 다원주의적 혼합주의를 거부하면서도 각 종교의 고유성과 대화 가능성을 동시에 긍정합니다."},{"id":17,"set":"2022A","type":"sa","question":"기독교-이슬람 대화에서의 '공통의 말씀(Common Word)'은 무엇을 가리키는지 간단히 설명하시오.","answer":"2007년 두 종교의 지도자들이 발표한 문서로, '하나님 사랑'과 '이웃 사랑'이라는 두 계명이 두 종교 간 대화와 연대의 본질적인 공통 기초임을 천명한 내용","explanation":"138명의 이슬람 학자들이 서명한 이 문서는 기독교-이슬람 대화의 역사적 전환점이 되었습니다."},{"id":18,"set":"2022A","type":"sa","question":"1952년 빌링겐 세계선교대회에서 공식화된 '하나님의 선교(missio Dei)'에 관해 간략히 설명하시오.","answer":"선교의 궁극적 주체는 교회가 아니라 '삼위일체 하나님 자신'이며, 교회는 세상을 치유하시고 화해하시는 하나님의 위대한 선교 사역에 동참하도록 부름받고 파송된 도구라는 개념","explanation":"Missio Dei 개념은 선교를 교회 성장의 도구가 아닌, 삼위일체 하나님의 본질적 활동으로 이해하게 합니다."},{"id":19,"set":"2022A","type":"sa","question":"종말(eschaton)의 두 가지는 의미는 무엇인가?","answer":"① 시간적인 '끝(마지막)', ② 하나님의 구원 사역이 도달하고자 하는 '목적(Telos)'","explanation":"종말은 단순한 시간적 끝이 아니라, 역사가 향해 나아가는 하나님의 목적과 완성을 의미합니다."},{"id":20,"set":"2022A","type":"sa","question":"에클레시아(ecclesia)='교회'의 핵심 본질은 무엇인지 간단히 설명하시오.","answer":"헬라어 '에크(~로부터)'와 '칼레오(부르다)'의 합성어로, '하나님의 부르심을 받아 세상으로부터 모인 자들의 모임(회중)'을 의미합니다","explanation":"교회는 자발적으로 모인 집단이 아니라, 하나님의 부르심(klesis)에 응답한 자들의 공동체입니다."},{"id":21,"set":"2022A","type":"sa","question":"밀리오리에 따르면 성만찬은 '나눔의 성례'인데 무슨 의미인가?","answer":"성만찬은 단순히 떡을 먹는 것을 넘어, 생명의 자원을 가난한 자들과 '나누고' 억압받는 이웃과 연대하여 사회의 불의에 맞서는 실천적 의미를 포함한다는 뜻","explanation":"성만찬의 나눔은 예배 안의 상징에 머물지 않고, 세상 속의 정의로운 나눔 실천으로 이어져야 합니다."},{"id":22,"set":"2022A","type":"sa","question":"'칭의 교리에 대한 공동선언서(JDDJ)'에 관해 간단히 설명하시오.","answer":"1999년 로마 가톨릭과 루터교회가 종교개혁 이후의 칭의 논쟁에 관해 합의한 문서로, '우리는 우리의 공로가 아니라 오직 은혜와 믿음으로 하나님께 의롭다 용납받는다'고 공동으로 선언한 것","explanation":"JDDJ(Joint Declaration on the Doctrine of Justification)는 500년 분열을 극복한 역사적 에큐메니칼 문서입니다."},{"id":23,"set":"2022A","type":"sa","question":"신묵시주의(neo-apocalypticism)에 대한 밀리오리의 비판점들 중 2가지에 관하여 설명하시오.","answer":"① 종말의 시간표를 결정주의적으로 조작한다. ② 십자가와 부활의 신학이 부재한다. ③ 두려움을 조장하여 현실의 책임을 회피하게 만든다. ④ 성경의 참된 소망을 왜곡한다. (중 2가지)","explanation":"신묵시주의는 참된 종말론적 소망을 공포와 도피로 왜곡하며, 신자들이 세상 속에서 책임 있는 제자도를 살지 못하게 방해합니다."},{"id":24,"set":"2022A","type":"sa","question":"성령의 우주적 사역에 관하여 간단히 설명하시오.","answer":"성령의 활동은 교회 안에만 머물지 않고 창조 세계 전체로 확장되며, 우주 만물의 생명과 호흡을 보존하고 파괴에 맞서 샬롬(평화)을 지탱하시는 활동을 의미합니다","explanation":"성령은 교회의 영이실 뿐 아니라 생명의 영(Spirit of life)으로서 우주적 생명력과 창조의 갱신을 이끄십니다."},{"id":25,"set":"2022A","type":"sa","question":"'ecclesia reformata semper reformanda'는 무슨 뜻인가?","answer":"'개혁된 교회는 항상 (계속해서) 개혁되어야 한다'는 뜻으로, 교회가 전통에 안주하지 않고 말씀과 성령 안에서 끊임없이 갱신되어야 함을 뜻하는 종교개혁의 표어","explanation":"이 표어는 개혁교회가 과거의 개혁에 안주하지 않고 지속적으로 하나님의 말씀 앞에 자신을 새롭게 해야 함을 선언합니다."},{"id":26,"set":"2022B","type":"mc","question":"다음 중 연결이 잘못된 것은?","choices":["디트리히 본회퍼 – 타자를 위한 교회","칼 라너 - 익명의 그리스도인(anonymous Christian)","조지 린드벡 - 종교의 차이점/특수성/이질성 강조","마르틴 루터 - 값싼 은혜(cheap grace)"],"answer":4,"explanation":"십자가의 제자도 없는 '값싼 은혜(cheap grace)'를 비판한 학자는 마르틴 루터가 아니라 디트리히 본회퍼입니다."},{"id":27,"set":"2022B","type":"mc","question":"다음 중 교회의 3가지 주요한 정치제도에 속하지 않는 것은?","choices":["장로제","감독제","회중제","만인제사장제"],"answer":4,"explanation":"교회의 3대 정치 직제는 장로제, 감독(주교)제, 회중제입니다. 만인제사장제는 루터의 신학 교리입니다."},{"id":28,"set":"2022B","type":"mc","question":"다음 용어들 중 가리키는 의미가 다른 하나는?","choices":["뮈스테리온(mysterion)=신비(mystery)","에피클레시스(epiclesis)","사크라멘툼(sacramentum)=성례(sacrament)","(없음)"],"answer":2,"explanation":"뮈스테리온과 사크라멘툼은 모두 '성례(신비)'를 뜻하는 동의어입니다. 에피클레시스는 성만찬 시의 '성령 임재 기원 기도'를 뜻하므로 다릅니다."},{"id":29,"set":"2022B","type":"mc","question":"밀리오리에 따르면 오늘날 교회이해를 가로막는 장애물이 아닌 것은?","choices":["민족주의","종교의 사사화(privatization)","관료주의적 조직","신앙고백과 실천 사이의 괴리"],"answer":1,"explanation":"4대 장애물은 극단적 개인주의, 종교의 사사화, 교회의 관료주의화, 신앙과 삶(실천)의 괴리입니다."},{"id":30,"set":"2022B","type":"mc","question":"예수 그리스도의 삼중직무에 해당되지 않는 것은?","choices":["심판자","예언자","왕","제사장"],"answer":1,"explanation":"칼뱅이 체계화한 그리스도의 삼중직(munus triplex)은 제사장, 예언자(선지자), 왕입니다."},{"id":31,"set":"2022B","type":"mc","question":"오늘날 성령에 대한 관심이 증대되는 원인들이 아닌 것은?","choices":["현대의 비인격화와 관료체제화에 대한 항의","영적 자원에 대한 광범위한 갈망","근대의식의 냉정한 객관성과 역사성의 확산","현대 에큐메니칼 교회의 발전"],"answer":3,"explanation":"근대의식의 냉정한 객관성 확산 '때문'이 아니라, 반대로 그 냉정함과 거리감에 대한 '반발(항의)'로 인해 생생한 영적 체험을 갈망하게 된 것입니다."},{"id":32,"set":"2022B","type":"mc","question":"다음 중 연결이 잘못된 것은?","choices":["이정용 - 주변성(marginality)","구스타보 구티에레즈 - 해방신학","존 소브리노 - 흑인신학","고수케 고야마 - 물소신학(water buffalo theology)"],"answer":3,"explanation":"존 소브리노는 남미 해방신학자입니다. 흑인신학의 대표적인 학자는 제임스 콘(James Cone)입니다."},{"id":33,"set":"2022B","type":"mc","question":"다음 중 참된 기독교적 종말론이 제시하는 소망의 정신이 아닌 것은?","choices":["폭력과 죽음의 세력에 맞섬","세상에 대한 혐오와 도피","정의와 자유와 평화 위한 부담 감수","하나님의 목적의 완성 재촉 및 기다림"],"answer":2,"explanation":"참된 종말론적 소망은 세상을 도피하거나 혐오하는 것이 아니라, 만물의 갱신을 기대하며 현세의 삶에서 신실하게 책임을 다하는 것입니다."},{"id":34,"set":"2022B","type":"mc","question":"다음 중 흑인여성신학을 가리키는 용어는 무엇인가?","choices":["페미니즘","뮤헤리스타신학(mujerista theology)","우머니즘(womanism)","메스티사헤(mestizaje)"],"answer":3,"explanation":"백인 중심의 페미니즘에 반발하여 흑인 여성들의 삼중적 억압 경험을 바탕으로 전개된 신학이 우머니즘(Womanism)입니다."},{"id":35,"set":"2022B","type":"mc","question":"종교신학에서 통상적으로 사용되는 3-선택 틀(3-option frame)이 아닌 것은?","choices":["다원주의","그리스도의 최종성","포용주의","배타주의"],"answer":2,"explanation":"종교 간의 관계를 설명하는 고전적 3분법은 배타주의, 포용주의, 다원주의입니다. '그리스도의 최종성'은 기독교 신학이 반드시 견지해야 할 신앙 고백의 본질입니다."},{"id":36,"set":"2022B","type":"sa","question":"성경본문(text)과 상황(context) 관계에서 상황의 두 가지 의미는 무엇인가?","answer":"① 텍스트를 읽고 해석하는 해석자가 처한 '역사적, 사회적, 문화적 정황'. ② 성경 본문 자체의 '전후 문맥'","explanation":"상황(context)은 해석자의 삶의 자리(Sitz im Leben)이기도 하고, 본문 내의 전후 문맥이기도 합니다."},{"id":37,"set":"2022B","type":"sa","question":"밀리오리의 '삼위일체적 교제의 교회론'에 관하여 간단히 설명하시오.","answer":"교회는 삼위일체 하나님의 풍성한 교제(상호내주/페리코레시스)에 참여하며, 그 교제적 사랑을 세상을 향한 선교(미시오 데이)로 반영하고 실천하는 공동체라는 입장","explanation":"교회는 삼위일체의 교제를 반영하는 공동체로서, 그 내적 코이노니아가 외적 선교로 흘러넘쳐야 합니다."},{"id":38,"set":"2022B","type":"sa","question":"'필리오케(filioque)'에 관해 간략히 설명하시오.","answer":"라틴어로 '그리고 성자로부터'라는 뜻. 성령이 성부와 '성자로부터' 이중 출원한다는 것을 명시하기 위해 서방교회가 신경에 임의로 추가한 문구. 동방교회는 성령이 오직 성부로부터만 출원한다고 반대","explanation":"필리오케 논쟁은 1054년 동서방 교회 대분열의 핵심 신학적 쟁점 중 하나입니다."},{"id":39,"set":"2022B","type":"sa","question":"신묵시주의(neo-apocalypticism)에 대한 밀리오리의 비판에 관해 간단히 설명하시오.","answer":"신묵시주의는 종말의 시간표를 결정주의적으로 조작하고 두려움을 조장하여 신자들로 하여금 현세의 삶에 대한 책임(신실한 제자도)을 외면하고 세상을 도피하게 만든다고 비판합니다","explanation":"밀리오리는 참된 종말론적 소망은 공포가 아닌 기대와 책임으로 나타난다고 강조합니다."},{"id":40,"set":"2022B","type":"sa","question":"성례의 효력과 관련하여 사효론(ex opere operato)과 인효론(ex opere operantis)은 각각 어떤 입장인가?","answer":"① 사효론: 성례를 집행하는 행위 그 자체(객관적)로 은혜가 발생한다는 로마 가톨릭의 입장. ② 인효론: 성례의 효력이 집례자나 참여자의 영적·도덕적 자격과 신앙적 응답(주관적)에 의존한다는 입장","explanation":"두 입장의 차이는 은혜가 성례 행위에 내재하느냐(사효론), 아니면 인간의 신앙적 응답에 달려 있느냐(인효론)에 있습니다."},{"id":41,"set":"2022B","type":"sa","question":"밀리오리에 따르면 세례는 '연대의 성례'인데 무슨 의미인가?","answer":"예수 그리스도께서 세례를 통해 스스로 죄인들과 연대하셨듯이, 세례를 받은 신자들 역시 세상의 굶주리고 소외된 자들과 연대하는 삶을 살아야 한다는 의미","explanation":"세례는 개인적 구원의 표시를 넘어, 그리스도의 연대를 이어받아 이웃과 함께하는 사회적 의미를 지닙니다."},{"id":42,"set":"2022B","type":"sa","question":"애버리 덜레스의 교회의 5가지 모형/모델 중 4가지는 무엇인가?","answer":"① 제도적 모델, ② 신비적 교제의 모델, ③ 성례적 모델, ④ 사신(전달자) 모델, ⑤ 종의 모델 (중 4가지)","explanation":"덜레스는 교회를 단일한 모델로 환원하지 않고, 다섯 가지 상호보완적 모델을 통해 교회의 풍성한 본질을 설명합니다."},{"id":43,"set":"2022B","type":"sa","question":"존 힉(John Hick)의 신중심주의(theocentricism)는 무엇을 주장하는가?","answer":"구원의 중심을 예수 그리스도에 두지 않고, 모든 종교가 각자의 길(등산로)을 통해 궁극적으로 동일한 '신(궁극적 실재)'이라는 하나의 정상에 도달한다는 다원주의적 주장","explanation":"힉의 신중심주의는 기독교의 그리스도 중심성을 포기하는 급진적 다원주의로, 많은 신학자들의 비판을 받습니다."},{"id":44,"set":"2022B","type":"sa","question":"칼뱅의 이중은총(double grace)은 무엇과 무엇을 가리키며 이 둘의 관계는 어떠한가?","answer":"칭의(Justification)와 성화(Sanctification)를 가리킵니다. 이 둘은 개념적으로 구별될 수는 있지만, 동전의 양면처럼 결코 분리될 수 없는 관계입니다","explanation":"칼뱅에게 칭의와 성화는 그리스도와의 연합(unio cum Christo)에서 함께 주어지는 이중의 은혜입니다."},{"id":45,"set":"2022B","type":"sa","question":"천주교의 화체설(transubstantiation)에 관하여 간단히 설명하시오.","answer":"성만찬 시 떡과 포도주의 '외적 형태(우연)'는 그대로 남아있지만, 그 '본질(실체)'은 그리스도의 실제 살과 피로 완전히 변환된다는 로마 가톨릭의 교리","explanation":"화체설은 아리스토텔레스의 실체-우연 철학을 이용하여 성찬에서의 그리스도의 실제적 임재를 설명합니다."},{"id":46,"set":"2022B","type":"sa","question":"성례에 대한 아우구스티누스의 정의는 무엇인가?","answer":"'보이지 않는 은혜에 대한 보이는(가시적) 표지(visible signs of an invisible grace)'","explanation":"이 정의는 성례의 외적 요소(물, 떡, 포도주)와 내적 은혜(하나님의 용서, 임재)의 관계를 간결하게 표현합니다."},{"id":47,"set":"2022B","type":"sa","question":"'파루시아(advent/parousia)'는 무슨 뜻인가?","answer":"문자적으로 '옆에 함께 존재하심' 또는 '도래/도착'을 뜻하며, 신학적으로는 그리스도의 재림(다시 오심)을 가리킵니다","explanation":"파루시아는 단순한 미래 사건이 아니라, 이미 임재하시는 그리스도의 완전한 나타나심을 의미합니다."},{"id":48,"set":"2022B","type":"sa","question":"'simul iustus et peccator'는 누구의 말이며 무슨 뜻인가?","answer":"마르틴 루터의 말이며, '의인인 동시에 죄인'(하나님의 은혜로 의롭다 함을 받았으나 본질적으로는 여전히 죄의 성향을 지닌 존재)이라는 뜻","explanation":"이 역설적 표현은 칭의가 죄성의 완전한 제거가 아닌, 하나님의 선언적 은혜임을 강조합니다."},{"id":49,"set":"2022B","type":"sa","question":"밀리오리에 따르면 현대의 4가지 미래소망들 중 성경의 참된 종말 이외의 나머지 3가지는 무엇인가?","answer":"① 세속적 진보주의, ② 마르크스주의 유토피아, ③ 신묵시주의","explanation":"밀리오리는 이 세 가지가 각각 인간 이성, 역사 변증법, 공포주의로 희망을 왜곡한다고 비판합니다."},{"id":50,"set":"2022B","type":"sa","question":"종교신학에서 다원주의(pluralism)와 다원성(plurality)의 차이는 무엇인가?","answer":"다원성은 여러 종교와 문화가 공존하는 객관적 '현실/사실' 그 자체를 의미하며, 다원주의는 그 종교들이 모두 구원에 이르는 동등한 길이라고 주장하는 신학적 '이데올로기/가치관'을 뜻합니다","explanation":"다원성은 기술적(descriptive) 개념이고, 다원주의는 규범적(normative) 이데올로기입니다."},{"id":51,"set":"2023년","type":"mc","question":"종교신학에서 폴 니터의 4가지 유형이 아닌 것은?","choices":["배타","성취","상호성","비교불가능성(incommensurability)"],"answer":4,"explanation":"폴 니터의 4유형은 '대체(배타), 성취, 상호성, 수용'입니다. 비교불가능성(특수성)은 조지 린드벡의 후기자유주의적 입장입니다."},{"id":52,"set":"2023년","type":"mc","question":"다음 중 연결이 잘못된 것은?","choices":["이상현 - 경계성","구스타보 구티에레즈 - 해방신학","존 소브리노 - 흑인신학","고수케 고야마 - 물소신학(water buffalo theology)"],"answer":3,"explanation":"존 소브리노는 남미 해방신학자이며, 흑인신학자는 제임스 콘입니다."},{"id":53,"set":"2023년","type":"mc","question":"니케아신조에서의 교회의 고전적 표지들 4가지가 아닌 것은?","choices":["통일성","도덕성","보편성","사도성"],"answer":2,"explanation":"381년 니케아-콘스탄티노플 신조의 4대 표지는 통일성, 거룩성, 보편성, 사도성입니다. 도덕성은 표지가 아닙니다."},{"id":54,"set":"2023년","type":"mc","question":"밀리오리에게서 그리스도인의 삶의 성장을 나타내는 6가지 표지가 아닌 것은?","choices":["성숙한 경청","성숙한 기도","성숙한 감사","성숙한 개인주의"],"answer":4,"explanation":"성숙한 개인주의가 아니라 '성숙한 연대'와 '자유' 등입니다. 6표지는 경청, 기도, 자유, 연대, 감사, 소망입니다."},{"id":55,"set":"2023년","type":"mc","question":"다음 중 연결이 잘못된 것은?","choices":["천주교의 화체설(transubstantiation)","안셀무스의 공재설(consubstantiation)","칼뱅의 영적 실재적 임재설(spiritual real presence)","츠빙글리의 기념설(memoralism)"],"answer":2,"explanation":"성만찬에서 그리스도가 떡과 포도주 '안에, 함께, 아래에' 임재하신다는 '공재설'은 마르틴 루터의 주장입니다."},{"id":56,"set":"2023년","type":"mc","question":"다음 중 페미니즘신학이 주로 비판하는 것은 무엇인가?","choices":["인종차별(racism)","정치적 경제적 억압","가부장제(patriarchy)","민족적 문화적 혼종성(hybrid)"],"answer":3,"explanation":"남성 중심적 구조로 여성을 억압하고 지배해 온 가부장제(patriarchy)를 강력하게 비판합니다."},{"id":57,"set":"2023년","type":"mc","question":"기독교적 종교신학에서 백충현의 '둘레길 이론'이 비판하는 것은?","choices":["존 힉(John Hick)의 신중심주의(theocentricism)","마크 하임 '삼위일체적 포용주의'","칼 라너의 '익명의 그리스도인(anonymous Christian)'","조지 린드벡의 '종교간 특수성을 강조'"],"answer":1,"explanation":"'모든 종교는 산의 정상을 향해 올라가는 각기 다른 등산로와 같다'는 존 힉의 신중심주의적 다원주의를 정면으로 비판했습니다."},{"id":58,"set":"2023년","type":"mc","question":"성례의 효력이 집례자의 자격과 덕에 의존한다는 주장은 무엇인가?","choices":["사효론(ex opere operato)","성례론","인효론(ex opere operantis)","만족설"],"answer":3,"explanation":"성례의 효력이 집행하는 사제의 주관적인 도덕성이나 자격(인간적 요소)에 의존한다는 주장은 인효론입니다."},{"id":59,"set":"2023년","type":"mc","question":"다음 중 신묵시주의(neo-apocalypticism)의 예에 해당하지 않는 것은?","choices":["할 린제이 『대유성지구의 종말』","재림의 날짜를 특정하는 시한부 종말론","마르틴 루터 '내일 지구 종말이 온다면…오늘 사과나무 심겠다!'","『레프트 비하인드(Left Behind)』 시리즈"],"answer":3,"explanation":"종말이 오더라도 삶의 자리에서 책임을 다해 나무를 심겠다는 루터의 고백은 세상을 도피하는 신묵시주의가 아니라 '참된 종말론적 소망'의 올바른 예시입니다."},{"id":60,"set":"2023년","type":"mc","question":"다음 중 서로 관련이 없는 용어는?","choices":["보편구원설(universalism)","재림(second-coming)","파루시아(parousia)","도래/아드벤트(advent)"],"answer":1,"explanation":"2, 3, 4번은 모두 예수 그리스도의 '다시 오심(재림)'을 뜻하는 동의어군입니다. 보편구원설은 재림과 다른 개념입니다."},{"id":61,"set":"2023년","type":"sa","question":"흑인여성신학을 가리키는 용어는 무엇인가?","answer":"우머니즘(Womanism)","explanation":"백인 중심 페미니즘에 반발하여 흑인 여성들의 인종·성별·계층의 삼중 억압 경험을 신학적으로 다룬 운동입니다."},{"id":62,"set":"2023년","type":"sa","question":"애버리 덜레스의 교회의 모델/모형 5가지는 무엇인가?","answer":"① 제도적 모델, ② 신비적 교제의 모델, ③ 성례적 모델, ④ 사신(전달자) 모델, ⑤ 종의 모델","explanation":"덜레스는 어느 한 모델도 교회의 신비를 완전히 담지 못한다고 보며, 다섯 모델의 상호보완적 사용을 권장합니다."},{"id":63,"set":"2023년","type":"sa","question":"종말론에서 다원성(plurality)과 다원주의(pluralism)의 개념적 차이는 무엇인가?","answer":"다원성은 여러 종교가 공존하는 객관적 사실(현실)이며, 다원주의는 그 모든 종교가 동등한 구원의 길이라는 가치관/이데올로기입니다","explanation":"다원성(plurality)은 현실 기술이고, 다원주의(pluralism)는 이를 신학적으로 정당화하는 이데올로기입니다."},{"id":64,"set":"2023년","type":"sa","question":"밀리오리가 말하는 그리스도인의 삶의 주관적 측면 3가지(믿음, 사랑, 소망)에 해당하는 객관적 측면 3가지는 무엇인가?","answer":"① 칭의 (믿음의 짝), ② 성화 (사랑의 짝), ③ 소명 (소망의 짝)","explanation":"그리스도인의 삶의 주관적 응답(믿음·사랑·소망)은 하나님의 객관적 사역(칭의·성화·소명)에 대응합니다."},{"id":65,"set":"2023년","type":"sa","question":"밀리오리의 삼위일체적 교회론의 두 가지 기둥은 무엇과 무엇인가?","answer":"① 삼위일체적 교제(코이노니아), ② 하나님의 선교(미시오 데이)","explanation":"교회는 안으로 삼위일체의 교제를 살고, 밖으로 하나님의 선교에 참여하는 이중적 소명을 가집니다."},{"id":66,"set":"2024-1","type":"mc","question":"삼위일체신학에서 강조하는 '하나님의 형상(imago Dei)'은 무엇인가?","choices":["관계성","이성/합리성","자유","신체적 유사성"],"answer":1,"explanation":"삼위일체 하나님의 형상은 독립된 개체의 이성이나 신체가 아니라, 성부·성자·성령의 친밀한 교제를 반영하는 타자와의 '관계성(공동체성)'에 있습니다."},{"id":67,"set":"2024-1","type":"mc","question":"하나님에 의해 창조된 인간이 본래 가진 긍정적인 요소가 아닌 것은?","choices":["자기초월성","미래개방성","자기중심성","외심성"],"answer":3,"explanation":"'자기중심성(자아중심성)'은 인간이 타락하여 하나님과 관계가 깨어질 때 나타나는 죄의 본질적 특성입니다."},{"id":68,"set":"2024-1","type":"mc","question":"성례의 효력이 성례 자체에 의해 발생한다고 여기는 주장은 무엇인가?","choices":["신앙론","승리자 그리스도론","인효론(ex opere operantis)","사효론(ex opere operato)"],"answer":4,"explanation":"객관적으로 집행된 사역(성례 행위) 그 자체로부터 은혜가 발생한다는 로마 가톨릭의 입장이 '사효론'입니다."},{"id":69,"set":"2024-1","type":"mc","question":"기독론과 관련하여 다음 중 연결이 잘못된 것은?","choices":["알렉산드리아학파 - 말씀-육신 기독론","안디옥학파 - 말씀-인간 기독론","제4차 칼케돈공의회 - 양성기독론","제5차 콘스탄티노플공의회 - 속성의 교류"],"answer":4,"explanation":"제5차 공의회의 핵심 결정은 그리스도의 '인성의 내재위격성(enhypostasis)'입니다. 속성의 교류는 특정 공의회만의 결과라기보다는 기독론 전반의 중요한 고전 교리입니다."},{"id":70,"set":"2024-1","type":"mc","question":"안셀무스의 Cur Deus Homo가 주장하는 속죄론의 입장은?","choices":["도덕적 감화설","대속형벌설","만족설","승리자 그리스도론"],"answer":3,"explanation":"죄로 훼손된 하나님의 무한한 명예와 공의를 회복하기 위해서는 죄 없는 그리스도의 희생을 통해서만 '만족(satisfaction)'시킬 수 있다는 속죄론입니다."},{"id":71,"set":"2024-1","type":"mc","question":"다음 중 '가난한 자들을 위한 선택적 우선권'을 주장하는 신학은?","choices":["여성신학(페미니즘신학)","흑인신학","히스패닉신학","남미해방신학"],"answer":4,"explanation":"억눌리고 가난한 자들의 편에 서시는 하나님이라는 전제에서 출발하는 남미 해방신학의 가장 핵심적인 전제입니다."},{"id":72,"set":"2024-1","type":"mc","question":"교회에 대한 이해를 가로막는 장애물이 아닌 것은?","choices":["그리스도인의 신앙과 삶의 괴리","참된 공동체성에 관한 관심","종교의 관료주의화 및 사사화","개인주의"],"answer":2,"explanation":"'참된 공동체성에 관한 관심'은 방해물이 아니라 교회가 회복해야 할 올바른 본질입니다."},{"id":73,"set":"2024-1","type":"mc","question":"다음 중 연결이 바르게 된 것은?","choices":["루터 - 화체설(transubstantiation)","츠빙글리 - 공재설(consubstantiation)","칼뱅 - 영적 임재설(spiritual presence)","멜랑히톤 - 기념설(memoralism)"],"answer":3,"explanation":"올바른 짝은 가톨릭-화체설, 루터-공재설, 칼뱅-영적 실재적 임재설, 츠빙글리-기념설입니다."},{"id":74,"set":"2024-1","type":"mc","question":"백충현의 '둘레길 이론'이 비판하는 입장은 무엇인가?","choices":["존 힉의 다원주의","폴 니터의 4가지 유형론","칼 라너의 익명의 그리스도인","조지 린드벡의 종교간 특수성"],"answer":1,"explanation":"존 힉의 다원주의(신중심주의)가 주장하는 '등산로 비유'를 정면으로 반박한 이론입니다."},{"id":75,"set":"2024-1","type":"mc","question":"이슬람교/기독교 공통말씀(A Common Word)이 말하는 공통점이 아닌 것은?","choices":["경전에 대한 태도","삼위일체론","신의 하나됨","사랑"],"answer":2,"explanation":"이슬람교는 철저한 유일신 사상을 고수하며, 신을 셋으로 나누는 것처럼 보이는 삼위일체론을 철저히 반대합니다."},{"id":76,"set":"2024-1","type":"sa","question":"영성(spirituality)에 관한 기독교적 정의의 핵심은 무엇인가?","answer":"'성령 하나님을 따라 걷고 사는 삶' (프뉴마티)","explanation":"기독교 영성은 자기초월적 체험이나 도덕적 수양이 아니라, 구체적으로 성령의 인도하심을 따라 걷는 삶(갈 5:25)을 의미합니다."},{"id":77,"set":"2024-1","type":"sa","question":"에클레시아(ecclesia)가 그리스 정치에서는 '민회'로, 기독교 성경에서는 '교회'로 번역되는데 민회와 교회의 차이점을 2가지 쓰시오.","answer":"① 자격 요건의 차이: 민회는 시민권(남성) 등 배타적 조건이 있으나 교회는 무조건적이고 포용적이다. ② 기초의 차이: 민회는 시민의 자발적 주도로 모이지만, 교회는 하나님의 부르심(초대)에 대한 응답이다","explanation":"교회는 민회의 언어를 빌려왔지만, 하나님의 주권적 부르심에 기초한다는 점에서 근본적으로 다릅니다."},{"id":78,"set":"2024-1","type":"sa","question":"기독론에서 예수 그리스도의 '인격'과 '사역'은 각각 무엇을 의미하는가?","answer":"① 인격: 예수 그리스도는 누구인가?(정체성), ② 사역: 예수 그리스도는 무엇을 하셨는가?(구원 활동)","explanation":"기독론은 전통적으로 그리스도의 존재(person)와 사역(work)을 구분하여 다루지만, 이 둘은 분리될 수 없습니다."},{"id":79,"set":"2024-1","type":"sa","question":"성령의 '재현적(representative) 사역'은 무엇을 의미하는가?","answer":"성령의 권능 안에서 과거의 역사적 예수가 현재 신자들 가운데 살아계신 주님으로 현존(임재)하시도록 드러내는 사역","explanation":"성령은 과거의 그리스도를 역사적 기억으로만 남기지 않고, 현재에도 살아계신 주님으로 현존하게 하는 '재현자'이십니다."},{"id":80,"set":"2024-1","type":"sa","question":"그리스도의 재림/강림을 가리키는 파루시아(parousia)와 아드벤투스(adventus)의 문자적인 뜻은 무엇인가?","answer":"파루시아는 '옆에 함께 존재하심'을 뜻하고, 아드벤투스는 '우리에게로 오심(도래)'을 뜻합니다","explanation":"두 단어는 같은 사건(재림)을 가리키지만, 파루시아는 임재(presence)를, 아드벤투스는 도래(coming)를 강조합니다."},{"id":81,"set":"2024/2025","type":"mc","question":"다음 중 연결이 잘못된 것은?","choices":["파토스(pathos)=고난","뮈스테리온(mysterion)=신비/비밀","에스카톤(eschaton)=회개","도케티즘(docetism)=가현설(假現說)"],"answer":3,"explanation":"에스카톤(eschaton)은 '종말(마지막, 목적)'을 뜻하는 헬라어입니다. 회개는 메타노이아(metanoia)입니다."},{"id":82,"set":"2024/2025","type":"mc","question":"다음 중 '전능자(全能者)'를 의미하는 단어는 무엇인가?","choices":["파라클레토스(parakletos)","판토크라토르(pantokrator)","선교사 하나님(the missionary God)","네페쉬 하야(nephesh haya)"],"answer":2,"explanation":"요한계시록에서 하나님을 가리키는 전능자는 '판토크라토르'입니다. 파라클레토스는 '보혜사'입니다."},{"id":83,"set":"2024/2025","type":"mc","question":"다음 중 연결이 바르게 된 것은?","choices":["멜랑히톤-화체설(transubstantiation)","루터-공재설(consubstantiation)","츠빙글리-영적 임재설(spiritual presence)","칼뱅-기념설(memoralism)"],"answer":2,"explanation":"떡과 포도주 안에, 함께, 아래에 공존하신다는 루터의 공재설이 올바른 짝입니다. 츠빙글리는 기념설, 칼뱅은 영적 임재설입니다."},{"id":84,"set":"2024/2025","type":"mc","question":"다음 중 '가난한 자들을 위한 선택적 우선권'을 주장하는 신학은?","choices":["여성신학(페미니즘신학)","흑인신학","히스패닉신학","남미해방신학"],"answer":4,"explanation":"구스타보 구티에레즈 등으로 대표되는 남미 해방신학의 핵심 전제입니다."},{"id":85,"set":"2024/2025","type":"mc","question":"백충현의 '둘레길 이론'이 비판하는 입장은 무엇인가?","choices":["조지 린드벡의 종교간 특수성","폴 니터의 4가지 유형론","칼 라너의 익명의 그리스도인","존 힉의 다원주의"],"answer":4,"explanation":"모든 종교가 같은 정상으로 간다는 존 힉의 신중심주의적 다원주의를 둘레길에 빗대어 비판했습니다."},{"id":86,"set":"2024/2025","type":"mc","question":"칼뱅의 예수 그리스도의 삼중직(munus triplex)의 3가지 직무가 아닌 것은?","choices":["왕","사도","제사장","예언자/선지자"],"answer":2,"explanation":"칼뱅이 정리한 세 가지 신적 직무는 예언자(선지자), 제사장, 왕이며, '사도'는 포함되지 않습니다."},{"id":87,"set":"2024/2025","type":"mc","question":"다음 중 신묵시주의(neo-apocalypticism)에 대한 비판이 아닌 것은?","choices":["성경에 대한 왜곡된 해석임","종말사건들의 시간예정표가 결정주의적임","신실한 제자도에 집중함","예수 그리스도의 십자가/부활의 신학이 부재함"],"answer":3,"explanation":"참된 기독교적 소망은 신실한 제자도에 집중하지만, 신묵시주의는 세상을 파국으로 묘사하며 제자도로의 부름을 외면하게 만들기 때문에 비판받습니다."},{"id":88,"set":"2024/2025","type":"mc","question":"성찬에서의 성령임재를 요청하는 기도는 무엇인가?","choices":["아남네시스(anamnesis)","에피클레시스(epiclesis)","연대(solidarity)","환대(hospitality)"],"answer":2,"explanation":"성만찬에서 성령께서 임재해 주시기를 간구하는 기도를 에피클레시스라고 합니다."},{"id":89,"set":"2024/2025","type":"mc","question":"다음 중 연결이 잘못된 것은?","choices":["앤드류 월스-세계기독교","구티에레즈-해방신학","송천성(C. S. Song)-이야기신학","제임스 콘-여성신학"],"answer":4,"explanation":"제임스 콘(James Cone)은 인종차별 경험을 바탕으로 십자가의 의미를 해석한 흑인신학의 대표자입니다."},{"id":90,"set":"2024/2025","type":"mc","question":"다음 중 연결이 잘못된 것은?","choices":["속성의 교류–communicatio idiomatum","존귀–kenosis","하나님의어머니–theotokos","위격적 연합–hypostatic union"],"answer":2,"explanation":"케노시스(kenosis)는 '존귀'가 아니라 자기를 비우는 '비움(겸허)'을 뜻하는 기독론의 핵심 용어입니다."},{"id":91,"set":"2024/2025","type":"sa","question":"325년 니케아공의회가 결정한 '동일본질(homoousia)'은 무엇을 의미하는가?","answer":"성자(예수 그리스도)는 피조물이 아니라 성부 하나님과 본질적으로 완전히 동일하신 참 하나님이심을 뜻합니다","explanation":"이 결정은 아리우스파의 '성자 피조물론'을 이단으로 정죄하고, 그리스도의 완전한 신성을 확정한 기독교 신학의 토대입니다."},{"id":92,"set":"2024/2025","type":"sa","question":"이슬람교-기독교 '공통말씀(A Common Word)'이 말하는 공통점 3가지는?","answer":"① 경전에 대한 태도(존중), ② 신의 일치성(하나됨), ③ 사랑(하나님 사랑과 이웃 사랑의 두 계명)","explanation":"공통말씀은 두 종교의 근본적 차이를 무시하지 않으면서도, 평화적 공존의 신학적 기반을 모색합니다."},{"id":93,"set":"2024/2025","type":"sa","question":"종교신학에서 '예수 그리스도의 최종성(finality)'이라는 개념은 무엇을 의미하는가?","answer":"보편적인 구주이시며 주님이신 예수 그리스도에 대해 기독교가 결코 포기할 수 없는 무조건적이고 궁극적인 본질(가장 결정적 계시)을 의미합니다","explanation":"최종성은 배타적 폐쇄성이 아니라, 모든 종교 대화에서도 포기할 수 없는 기독교 신앙의 핵심입니다."},{"id":94,"set":"2024/2025","type":"sa","question":"밀리오리에 따르면 교회에 대한 이해를 가로막는 장애물 네 가지는 무엇인가?","answer":"① 극단적 개인주의, ② 종교의 사사화, ③ 교회의 관료주의화, ④ 신앙고백과 삶(실천)의 괴리","explanation":"이 네 장애물은 모두 교회를 그 본질인 '공동체적 제자도'에서 벗어나게 하는 현대적 도전들입니다."},{"id":95,"set":"2024/2025","type":"sa","question":"밀리오리가 제시하는 성화의 6가지 표지들은 무엇인가?","answer":"성숙한 ① 경청, ② 기도, ③ 자유, ④ 연대, ⑤ 감사(기쁨), ⑥ 소망","explanation":"이 여섯 표지는 성화가 단순한 개인적 도덕 향상이 아니라, 삼위일체 하나님과의 관계 및 이웃과의 관계 안에서 이루어지는 전인적 변화임을 보여줍니다."},{"id":96,"set":"2024/2025","type":"sa","question":"451년 칼케돈 공의회에서 결정한 양성기독론은 무엇인지 설명하시오.","answer":"예수 그리스도는 참 하나님(완전한 신성)이시며 동시에 참 인간(완전한 인성)이시며, 이 두 본성은 단일한 위격 안에서 '혼동이나 변화나 분할이나 분리 없이' 연합되어 있다는 고전적 기독론 교리","explanation":"칼케돈 신조는 알렉산드리아의 신성 강조와 안디옥의 인성 강조를 종합하여, 그리스도의 완전한 신성과 인성을 동시에 보호합니다."},{"id":101,"set":"2023년","type":"sa","question":"성례에 대한 아우구스티누스의 정의는 무엇인가?","answer":"보이지 않는 은혜에 대한 보이는(가시적) 표지","explanation":"이 정의는 성례의 외적 요소(물, 떡, 포도주)와 내적 은혜(하나님의 용서, 임재)의 관계를 간결하게 표현합니다."},{"id":102,"set":"2023년","type":"sa","question":"종말(eschaton)의 두 가지 의미는 무엇인가?","answer":"① 끝(마지막), ② 목적(목표)","explanation":"종말은 단순한 시간적 끝이 아니라, 역사가 향해 나아가는 하나님의 목적과 완성을 의미합니다."},{"id":103,"set":"2023년","type":"sa","question":"'칭의 교리에 대한 공동선언서(JDDJ)'는 무엇인가?","answer":"1999년 로마 가톨릭과 루터교회가 분열을 극복하고 '우리의 공로가 아니라 오직 은혜와 믿음으로 의롭다 함을 받는다'고 칭의에 관해 공식 합의한 선언문","explanation":"JDDJ는 500년 분열을 극복한 역사적 에큐메니칼 문서입니다."},{"id":104,"set":"2023년","type":"sa","question":"종교신학에서 다원성(plurality)과 다원주의(pluralism)의 개념적 차이는 무엇인가?","answer":"다원성은 여러 종교가 공존하는 객관적 사실(현실)이며, 다원주의는 그 모든 종교가 동등한 구원의 길이라는 가치관/이데올로기입니다","explanation":"다원성(plurality)은 현실 기술이고, 다원주의(pluralism)는 이를 신학적으로 정당화하는 이데올로기입니다."},{"id":105,"set":"2023년","type":"sa","question":"개혁교회 교회론의 주요표어인 'ecclesia reformata semper reformanda'는 무슨 의미인가?","answer":"'개혁된 교회는 항상 개혁되어야 한다' — 과거의 낡은 제도에 안주하지 않고 끊임없이 말씀으로 갱신되어야 함을 뜻함","explanation":"이 표어는 개혁교회가 과거의 개혁에 안주하지 않고 지속적으로 하나님의 말씀 앞에 자신을 새롭게 해야 함을 선언합니다."},{"id":106,"set":"2023년","type":"sa","question":"종교의 사사화(privatization)는 (1) 무슨 의미이며 (2) 이것의 문제점은 무엇인가?","answer":"(1) 신앙과 종교적 실천이 개인의 내면이나 사적인 영역으로만 축소되고 제한되는 현상. (2) 문제점: 교회가 세상 속에서 감당해야 할 공공성(사회적 책임)을 상실하게 만듦","explanation":"종교의 사사화는 교회를 공적 영역에서 배제시켜 세상 변혁의 능력을 잃게 합니다."},{"id":107,"set":"2023년","type":"sa","question":"칼뱅의 이중은총(double grace)는 무엇과 무엇을 가리키는가?","answer":"칭의(Justification)와 성화(Sanctification)","explanation":"칼뱅에게 칭의와 성화는 그리스도와의 연합(unio cum Christo)에서 함께 주어지는 이중의 은혜입니다."},{"id":108,"set":"2023년","type":"sa","question":"교회를 가리키는 에클레시아(ecclesia/구약의 카할)의 본질적 의미는 무엇인가?","answer":"하나님의 부르심을 받아 세상으로부터 모인 자들의 모임(회중)","explanation":"교회는 자발적으로 모인 집단이 아니라, 하나님의 부르심(klesis)에 응답한 자들의 공동체입니다."},{"id":109,"set":"2023년","type":"sa","question":"밀리오리의 삼위일체적 교회론의 두 가지 기둥은 무엇과 무엇인가?","answer":"① 삼위일체적 교제(코이노니아), ② 하나님의 선교(미시오 데이)","explanation":"교회는 안으로 삼위일체의 교제를 살고, 밖으로 하나님의 선교에 참여하는 이중적 소명을 가집니다."},{"id":110,"set":"2023년","type":"sa","question":"밀리오리는 그리스도인의 삶의 주관적 측면 3가지를 믿음, 사랑, 소망으로 구별하는데, 각각에 해당하는 객관적 측면 3가지는 무엇인가?","answer":"① 칭의 (믿음의 짝), ② 성화 (사랑의 짝), ③ 소명 (소망의 짝)","explanation":"그리스도인의 삶의 주관적 응답(믿음·사랑·소망)은 하나님의 객관적 사역(칭의·성화·소명)에 대응합니다."},{"id":111,"set":"2024-1","type":"sa","question":"선교(mission)의 일차적인 뜻은 무엇인가?","answer":"보냄, 파송(하다)","explanation":"Missio Dei 개념에서 선교의 일차적 주체는 교회가 아니라 보내시는 하나님 자신입니다."},{"id":112,"set":"2024-1","type":"sa","question":"에클레시아(ecclesia)가 그리스 정치에서는 '민회'로, 기독교 성경에서는 '교회'로 번역되는데 민회와 교회의 차이점을 적어도 2가지 쓰시오.","answer":"① 자격 요건의 차이: 민회는 시민권(남성) 등 배타적 조건이 있으나 교회는 무조건적이고 포용적이다. ② 기초의 차이: 민회는 시민의 자발적 주도로 모이지만, 교회는 하나님의 부르심(초대)에 대한 응답이다","explanation":"교회는 민회의 언어를 빌려왔지만, 하나님의 주권적 부르심에 기초한다는 점에서 근본적으로 다릅니다."},{"id":113,"set":"2024-1","type":"sa","question":"예수 그리스도의 '감동성(passibility)'은 무엇을 의미하는가?","answer":"하나님이 저 멀리서 무감각하게 계시는 분이 아니라, 그리스도의 십자가를 통해 인간의 고통에 깊이 공감하시고 함께 아파하시는 분(파토스)이라는 의미","explanation":"감동성은 전통적 무감동성(impassibility)에 대한 현대 신학의 대안으로, 하나님의 고통은 약함이 아닌 자유로운 사랑의 표현입니다."},{"id":114,"set":"2024-1","type":"sa","question":"성령과 관련하여 필리오케(filioque)는 무엇을 의미하며, 동방교회와 서방교회의 입장은 각각 무엇인가?","answer":"필리오케는 '그리고 성자로부터'라는 뜻. 서방교회는 성령이 성부와 성자로부터 이중 출원한다고 주장하여 신경에 추가했고, 동방교회는 성령이 오직 성부로부터만 단일 출원한다고 주장하여 이를 강력히 반대했습니다","explanation":"필리오케 논쟁은 1054년 동서방 교회 대분열의 핵심 신학적 쟁점 중 하나입니다."},{"id":115,"set":"2024-1","type":"sa","question":"장 칼뱅의 예수 그리스도의 삼중직(munus triplex)에서 3가지 직무는 무엇인가?","answer":"제사장, 예언자(선지자), 왕","explanation":"칼뱅의 삼중직은 전통적 기독론의 핵심 구조이다. 바르트는 이를 낮아지심과 높아지심의 역설로 재표현했다."},{"id":116,"set":"2024-1","type":"sa","question":"밀리오리가 신묵시주의(neo-apocalypticism)를 비판하는 이유들을 적어도 2가지 쓰시오.","answer":"① 끔찍한 두려움과 공포심을 조장한다. ② 현재의 삶에 대한 신실한 제자도와 역사적 책임을 외면하게 한다. ③ 종말의 날짜와 시간표를 결정주의적으로 고집한다. (중 2가지)","explanation":"밀리오리는 참된 종말론적 소망은 공포가 아닌 기대와 책임으로 나타난다고 강조합니다."},{"id":117,"set":"2024-1","type":"sa","question":"니케아신조에서 말하는 교회의 고전적 표지들 4가지는 무엇인가?","answer":"통일성(하나의), 거룩성(거룩한), 보편성(보편적), 사도성(사도적)","explanation":"381년 니케아-콘스탄티노플 신조에서 확정된 4대 표지는 참된 교회를 식별하는 고전적 기준입니다."},{"id":118,"set":"2024-1","type":"sa","question":"영성(spirituality)에 관한 기독교적 정의의 핵심은 무엇인가?","answer":"'성령 하나님을 따라 걷고 사는 삶' (프뉴마티)","explanation":"기독교 영성은 자기초월적 체험이나 도덕적 수양이 아니라, 구체적으로 성령의 인도하심을 따라 걷는 삶(갈 5:25)을 의미합니다."},{"id":119,"set":"2024-1","type":"sa","question":"애버리 덜레스가 제시하는 교회의 5가지 모델(모형)들은 무엇인가?","answer":"① 제도적 모델, ② 신비적 교제의 모델, ③ 성례적 모델, ④ 사신(전달자) 모델, ⑤ 종의 모델","explanation":"덜레스는 어느 한 모델도 교회의 신비를 완전히 담지 못한다고 보며, 다섯 모델의 상호보완적 사용을 권장합니다."},{"id":120,"set":"2024-1","type":"sa","question":"개혁교회/장로교회 교회론의 표어 'ecclesia reformata semper reformanda'는 무슨 뜻인가?","answer":"'개혁된 교회는 항상 개혁되어야 한다'","explanation":"이 표어는 개혁교회가 과거의 개혁에 안주하지 않고 지속적으로 하나님의 말씀 앞에 자신을 새롭게 해야 함을 선언합니다."},{"id":121,"set":"2024/2025","type":"sa","question":"성례론에서 인효론(ex opere operantis)은 무엇을 주장하는가?","answer":"성례의 효력이 그 자체로 발생하는 것이 아니라, 집례자의 도덕적 자격이나 참여하는 자의 신앙적 응답에 의존한다는 주장","explanation":"인효론은 성례의 효력이 인간의 주관적 신앙 상태에 달려 있다는 입장입니다."},{"id":122,"set":"2024/2025","type":"sa","question":"칼뱅의 교회의 표지 주요 2가지는 무엇인가?","answer":"하나님의 말씀의 순수한 선포, 성례의 올바른 집행","explanation":"칼뱅은 참된 교회를 식별하는 두 표지로 말씀의 순수한 선포와 성례의 올바른 집행을 제시했습니다."},{"id":123,"set":"2024/2025","type":"sa","question":"'칭의 교리에 대한 공동선언서(JDDJ)'는 무엇인가?","answer":"1999년 로마 가톨릭과 루터교회가 칭의 교리에 대해 합의하여 '우리는 오직 은혜와 그리스도의 구원에 대한 믿음 안에서 하나님께 용납된다'고 발표한 문서","explanation":"JDDJ는 500년 분열을 극복한 역사적 에큐메니칼 합의입니다."},{"id":124,"set":"2024/2025","type":"sa","question":"개혁교회 교회론의 주요표어인 'ecclesia reformata semper reformanda'는 무슨 의미인가?","answer":"'개혁된 교회는 항상 (계속해서) 개혁되어야 한다'","explanation":"이 표어는 교회가 전통에 안주하지 않고 말씀과 성령 안에서 끊임없이 갱신되어야 함을 선언합니다."},{"id":125,"set":"2024/2025","type":"sa","question":"칼뱅의 이중은총(double grace)는 무엇과 무엇을 가리키는가?","answer":"칭의(Justification)와 성화(Sanctification)","explanation":"칭의와 성화는 그리스도와의 연합에서 함께 주어지는 이중의 은혜로, 분리될 수 없습니다."},{"id":127,"set":"2024/2025","type":"sa","question":"그리스도의 재림/강림을 가리키는 파루시아(parousia)와 아드벤투스(adventus)의 문자적인 뜻은 무엇인가?","answer":"파루시아는 '옆에 함께 존재하심'을 뜻하고, 아드벤투스는 '우리에게로 오심'을 뜻합니다","explanation":"두 단어는 같은 사건(재림)을 가리키지만, 파루시아는 임재(presence)를, 아드벤투스는 도래(coming)를 강조합니다."},{"id":131,"set":"2024/2025","type":"sa","question":"성례에 대한 아우구스티누스의 정의는 무엇인가?","answer":"보이지 않는 은혜에 대한 가시적(보이는) 표지","explanation":"이 정의는 성례의 외적 요소와 내적 은혜의 관계를 간결하게 표현합니다."},{"id":132,"set":"2024/2025","type":"sa","question":"성령과 관련하여 필리오케(filioque)는 무엇을 의미하며, 동방교회와 서방교회의 입장은 각각 무엇인가?","answer":"필리오케는 '그리고 성자로부터'라는 뜻. 서방교회는 성령이 성부뿐만 아니라 성자로부터도 출원한다고 주장하며, 동방교회는 오직 성부로부터만 단일 출원한다고 주장하여 이를 강력히 반대했습니다","explanation":"필리오케 논쟁은 1054년 동서방 교회 대분열의 핵심 신학적 쟁점 중 하나입니다."},{"id":133,"set":"2024/2025","type":"sa","question":"기독론에서 '예수 그리스도의 인격'과 '사역'은 각각 무엇을 의미하는가?","answer":"① 인격: 예수 그리스도는 누구인가?(존재와 정체성), ② 사역: 예수 그리스도는 무엇을 하셨는가?(우리를 위한 구원 활동)","explanation":"기독론은 전통적으로 그리스도의 존재(person)와 사역(work)을 구분하여 다루지만, 이 둘은 분리될 수 없습니다."}];
const SET_LABELS={"2022A": "2022년 A반", "2022B": "2022년 B반", "2023년": "2023년", "2024-1": "2024-1학기", "2024/2025": "2024/2025학년도"};
const LABELS=['①','②','③','④'];
let curSet='all', curFilter='all';
let quizQ=[], current=0, selected=null, revealed=false, results=[], score=0;

function getPool(){
  let p=QUESTIONS;
  if(curSet!=='all') p=p.filter(q=>q.set===curSet);
  if(curFilter==='mc') p=p.filter(q=>q.type==='mc');
  else if(curFilter==='sa') p=p.filter(q=>q.type==='sa');
  return p;
}
function setSet(s){
  curSet=s;
  document.querySelectorAll('.set-btn').forEach(b=>b.classList.toggle('active',b.dataset.set===s));
  updateInfo();
}
function setFilter(f){
  curFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));
  updateInfo();
}
function updateInfo(){
  const p=getPool();
  const sl=document.getElementById('count-slider');
  sl.max=Math.max(p.length,1);
  document.getElementById('range-max').textContent=p.length;
  if(parseInt(sl.value)>p.length){sl.value=p.length;updateCount(p.length);}
  document.getElementById('home-sub').textContent=`기말고사 기출 해설 · ${p.length}문제`;
}
function updateCount(v){document.getElementById('count-display').textContent=v;}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function startQuiz(){
  const p=getPool(),n=parseInt(document.getElementById('count-slider').value);
  quizQ=shuffle(p).slice(0,Math.min(n,p.length));
  current=0;selected=null;revealed=false;results=[];score=0;
  show('quiz');renderQ();
}
function show(id){['home','quiz','review'].forEach(s=>{document.getElementById(s).style.display=s===id?(s==='home'?'flex':'block'):'none';});}
function goHome(){show('home');}

function renderQ(){
  const q=quizQ[current];
  selected=null;revealed=false;
  document.getElementById('q-counter').textContent=`${current+1} / ${quizQ.length}`;
  document.getElementById('score-badge').textContent=`${score} 점`;
  document.getElementById('progress-fill').style.width=`${(current/quizQ.length)*100}%`;
  document.getElementById('set-label').textContent=SET_LABELS[q.set]||q.set;
  const badge=document.getElementById('type-badge');
  if(q.type==='mc'){badge.className='type-badge type-mc';badge.textContent='객관식';}
  else{badge.className='type-badge type-sa';badge.textContent='단답형';}
  document.getElementById('q-text').textContent=q.question;
  document.getElementById('choices').style.display=q.type==='mc'?'block':'none';
  document.getElementById('sa-wrap').style.display=q.type==='sa'?'block':'none';
  if(q.type==='mc'){
    const div=document.getElementById('choices');div.innerHTML='';
    q.choices.forEach((ch,i)=>{
      const btn=document.createElement('button');btn.className='choice-btn';
      btn.innerHTML=`<span class="choice-label">${LABELS[i]}</span><span style="flex:1">${ch.replace(/</g,'&lt;')}</span><span class="choice-mark"></span>`;
      btn.onclick=()=>selectChoice(i);div.appendChild(btn);
    });
  } else {
    document.getElementById('sa-input').value='';
    document.getElementById('sa-input').disabled=false;
    document.getElementById('sa-answer-box').style.display='none';
    document.getElementById('btn-show-ans').style.display='block';
  }
  document.getElementById('feedback').style.display='none';
  document.getElementById('explanation').className='explanation';
  const btnC=document.getElementById('btn-confirm');
  btnC.style.display=q.type==='sa'?'none':'block';btnC.disabled=true;
  document.getElementById('btn-next').style.display='none';
}

function selectChoice(i){
  if(revealed)return;selected=i;
  document.querySelectorAll('.choice-btn').forEach((b,idx)=>b.classList.toggle('selected',idx===i));
  document.getElementById('btn-confirm').disabled=false;
}
function showSAAnswer(){
  const q=quizQ[current];
  document.getElementById('sa-input').disabled=true;
  document.getElementById('sa-answer-box').style.display='block';
  document.getElementById('sa-answer-text').textContent=q.answer;
  document.getElementById('btn-show-ans').style.display='none';
  if(q.explanation){document.getElementById('explanation').className='explanation show';document.getElementById('exp-text').textContent=q.explanation;}
  results.push({qid:q.id,correct:'sa'});
  document.getElementById('btn-next').style.display='block';
  document.getElementById('btn-next').textContent=current+1>=quizQ.length?'결과 보기 →':'다음 문제 →';
}
function confirmAnswer(){
  if(selected===null)return;revealed=true;
  const q=quizQ[current];
  const correct=selected===q.answer-1;
  if(correct)score++;
  results.push({qid:q.id,correct:correct?'yes':'no',selected,answer:q.answer});
  document.querySelectorAll('.choice-btn').forEach((b,i)=>{
    b.classList.remove('selected');const mark=b.querySelector('.choice-mark');
    if(i===q.answer-1){b.classList.add('correct');mark.textContent='✓';}
    else if(i===selected){b.classList.add('wrong');mark.textContent='✗';}
    b.disabled=true;
  });
  const fb=document.getElementById('feedback');fb.style.display='block';
  if(correct){fb.className='feedback correct';fb.textContent='✓ 정답입니다!';}
  else{fb.className='feedback wrong';fb.textContent=`✗ 오답 — 정답: ${LABELS[q.answer-1]}`;}
  if(q.explanation){document.getElementById('explanation').className='explanation show';document.getElementById('exp-text').textContent=q.explanation;}
  document.getElementById('score-badge').textContent=`${score} 점`;
  document.getElementById('btn-confirm').style.display='none';
  const btnN=document.getElementById('btn-next');btnN.style.display='block';
  btnN.textContent=current+1>=quizQ.length?'결과 보기 →':'다음 문제 →';
}
function nextQuestion(){if(current+1>=quizQ.length)showReview();else{current++;renderQ();}}
function showReview(){
  show('review');
  const gradeable=results.filter(r=>r.correct==='yes'||r.correct==='no');
  const saCount=results.filter(r=>r.correct==='sa').length;
  const total=gradeable.length,pct=total>0?Math.round((score/total)*100):0;
  const wrong=results.filter(r=>r.correct==='no');
  document.getElementById('result-emoji').textContent=pct>=80?'🎉':pct>=60?'💪':'📖';
  document.getElementById('result-score').textContent=total>0?pct+'점':'--';
  document.getElementById('result-sub').innerHTML=
    (total>0?`채점 ${total}문제 중 <span class="ok">${score}개</span> 정답 · 오답 <span class="bad">${wrong.length}개</span>`:'') +
    (saCount>0?` · 단답형 <span class="skip">${saCount}개</span> 확인`:'');
  const list=document.getElementById('wrong-list');list.innerHTML='';
  if(wrong.length>0){
    const t=document.createElement('p');t.className='wrong-title';t.textContent=`✗ 틀린 문제 복습 (${wrong.length}개)`;list.appendChild(t);
    wrong.forEach(r=>{
      const q=quizQ.find(q=>q.id===r.qid);if(!q)return;
      const div=document.createElement('div');div.className='wrong-item';
      let inner=`<div class="wrong-set">${SET_LABELS[q.set]||q.set} · 객관식</div><p class="wrong-q">${q.question.replace(/</g,'&lt;')}</p>`;
      inner+=q.choices.map((ch,i)=>{
        const isC=i===q.answer-1,isW=i===r.selected;
        return `<div class="review-choice ${isC?'correct':isW?'wrong':''}">`+
          `<span style="font-weight:700;min-width:20px">${LABELS[i]}</span>`+
          `<span style="flex:1">${ch.replace(/</g,'&lt;')}${isC?' ✓':isW?' ✗':''}</span></div>`;
      }).join('');
      if(q.explanation)inner+=`<div class="review-exp">📖 ${q.explanation}</div>`;
      div.innerHTML=inner;list.appendChild(div);
    });
  } else if(gradeable.length>0){
    const p=document.createElement('p');p.style.cssText='color:#3a2a5a;text-align:center;padding:20px';p.textContent='🎊 채점된 문제 모두 정답!';list.appendChild(p);
  }
}
</script>
</body>
</html>
