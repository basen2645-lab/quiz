        let state = {
            currentIndex: 0,
            selectedQuestions: [],
            answers: {},
            filter: 'all'
        };
        
        function setFilter(filter) {
            state.filter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            updateSliderMax();
        }
        
        function updateSliderMax() {
            const filtered = getFiltered();
            const slider = document.getElementById('countSlider');
            const max = Math.max(5, filtered.length);
            slider.max = max;
            if (parseInt(slider.value) > max) {
                slider.value = max;
                updateCount(max);
            }
        }
        
        function updateCount(value) {
            document.getElementById('countDisplay').textContent = value;
        }
        
        function getFiltered() {
            if (state.filter === 'mc') {
                return QUESTIONS.filter(q => q.type === 'MC');
            } else if (state.filter === 'sa') {
                return QUESTIONS.filter(q => q.type === 'SA');
            }
            return QUESTIONS;
        }
        
        function startQuiz() {
            const filtered = getFiltered();
            const count = parseInt(document.getElementById('countSlider').value);
            const selected = [];
            const indices = Array.from({length: filtered.length}, (_, i) => i);
            
            for (let i = 0; i < Math.min(count, filtered.length); i++) {
                const randIdx = Math.floor(Math.random() * indices.length);
                selected.push(filtered[indices[randIdx]]);
                indices.splice(randIdx, 1);
            }
            
            state.selectedQuestions = selected;
            state.currentIndex = 0;
            state.answers = {};
            
            document.getElementById('home').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            
            document.getElementById('totalNum').textContent = selected.length;
            showQuestion();
        }
        
        function showQuestion() {
            const q = state.selectedQuestions[state.currentIndex];
            const progress = ((state.currentIndex + 1) / state.selectedQuestions.length) * 100;
            
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentNum').textContent = state.currentIndex + 1;
            
            let html = '<div class="question-container">';
            html += '<div class="question-header">';
            html += '<span class="q-number">Q' + (state.currentIndex + 1) + '</span>';
            html += '<span class="q-type">' + (q.type === 'MC' ? '객관식' : '단답형') + '</span>';
            html += '</div>';
            html += '<div class="question-text">' + q.answer + '</div>';
            
            if (q.type === 'MC') {
                html += '<div class="choices" id="choicesArea"></div>';
            } else {
                html += '<div class="answer-display"><div class="answer-label">정답:</div>' + q.answer + '</div>';
            }
            
            html += '<div class="nav-buttons">';
            if (state.currentIndex > 0) {
                html += '<button class="btn btn-secondary" onclick="previousQuestion()">이전</button>';
            }
            html += '<button class="btn btn-primary" onclick="nextQuestion()">다음</button>';
            html += '</div>';
            html += '</div>';
            
            document.getElementById('questionArea').innerHTML = html;
            
            if (q.type === 'MC') {
                renderChoices();
            }
        }
        
        function renderChoices() {
            const choices = ['①', '②', '③', '④'];
            let html = '';
            choices.forEach((choice, idx) => {
                html += '<button class="choice" onclick="selectChoice(' + idx + ')">' + choice + '</button>';
            });
            document.getElementById('choicesArea').innerHTML = html;
        }
        
        function selectChoice(idx) {
            const q = state.selectedQuestions[state.currentIndex];
            state.answers[state.currentIndex] = idx;
            
            const choices = document.querySelectorAll('.choice');
            choices.forEach(c => c.classList.remove('selected', 'correct', 'incorrect'));
            
            const selectedBtn = choices[idx];
            selectedBtn.classList.add('selected');
            
            if (q.answer === ['①', '②', '③', '④'][idx]) {
                selectedBtn.classList.add('correct');
            } else {
                selectedBtn.classList.add('incorrect');
            }
        }
        
        function nextQuestion() {
            if (state.currentIndex < state.selectedQuestions.length - 1) {
                state.currentIndex++;
                showQuestion();
                document.querySelector('.quiz-header').scrollIntoView();
            } else {
                showResult();
            }
        }
        
        function previousQuestion() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                showQuestion();
                document.querySelector('.quiz-header').scrollIntoView();
            }
        }
        
        function showResult() {
            let correct = 0;
            state.selectedQuestions.forEach((q, idx) => {
                if (q.type === 'MC') {
                    const selected = state.answers[idx];
                    if (selected !== undefined && q.answer === ['①', '②', '③', '④'][selected]) {
                        correct++;
                    }
                }
            });
            
            const total = state.selectedQuestions.filter(q => q.type === 'MC').length;
            const percent = total > 0 ? Math.round((correct / total) * 100) : 0;
            
            document.getElementById('resultScore').textContent = correct + '/' + total;
            document.getElementById('resultDetail').textContent = '객관식 정답률: ' + percent + '%';
            
            let reviewHtml = '<div class="review-title">오답 검토</div>';
            let hasWrong = false;
            
            state.selectedQuestions.forEach((q, idx) => {
                if (q.type === 'MC') {
                    const selected = state.answers[idx];
                    const isCorrect = selected !== undefined && q.answer === ['①', '②', '③', '④'][selected];
                    
                    if (!isCorrect) {
                        hasWrong = true;
                        const selectedLabel = selected !== undefined ? ['①', '②', '③', '④'][selected] : '미응답';
                        reviewHtml += '<div class="review-item incorrect">';
                        reviewHtml += '<div class="review-question">Q' + (idx + 1) + ' (오답)</div>';
                        reviewHtml += '<div class="review-answer">선택: ' + selectedLabel + ' → 정답: ' + q.answer + '</div>';
                        reviewHtml += '</div>';
                    }
                }
            });
            
            if (!hasWrong) {
                reviewHtml += '<div style="color: #10b981; padding: 20px; text-align: center;">모든 객관식 문제를 맞추셨습니다! 🎉</div>';
            }
            
            document.getElementById('reviewSection').innerHTML = reviewHtml;
            
            document.getElementById('home').style.display = 'none';
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';
        }
        
        function goHome() {
            document.getElementById('home').style.display = 'flex';
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'none';
            state.currentIndex = 0;
            state.answers = {};
        }
    </script>
